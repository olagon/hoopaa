torches one after another. By the last torch the whole beach is glowing, and his eyebrows are gone."],"Strike an invisible match and jump back. \"Ho-AAAH!\"","ʻĀ means to burn. Hoʻā is to make it burn, to light it.",null,"Uncle lighting torches with a giant match"],["v196","v",196,"kinai","kee-NAI","to put out (a fire)","\"KEEN EYE!\"",["The fire station has a new firefighter. She is 80 years old and has the keenest eyes on the island. She can spot a fire from 30 miles away.","She sits on the station roof with a cooler of shave ice. Suddenly she points at the mountains. \"Somebody's grill is burning on the other side!\" The crew squints. They see nothing. \"Keen eye!\" they yell. Keen eye! Kinai!","She jumps in the truck. They race over the mountain. She leaps out, runs to the burning grill and dumps the whole cooler of shave ice on it. Strawberry, lemon, blue. HSSSSS. The fire is out.","She does this 14 times a day. The whole island smells like rainbow shave ice and wet charcoal."],"Point far away with one squinting eye, then dump an invisible bucket. \"Kee-NAI!\"","Kinai ahi means a firefighter, or a fire extinguisher. Ahi means fire.",null,"Old firefighter dumping shave ice on grill"],["v197","v",197,"hoʻomalu","ho-oh-MAH-loo","to protect, to shelter; to keep calm","\"HO! OH! MALL! OOH!\"",["A big storm is coming. The radio says winds of 90 miles an hour. People are running in circles in the street, holding their dogs and their rice cookers.","Then Aunty Dee, the security guard at the shopping mall, gets on her megaphone. She is calm like a lake. \"Everybody come inside the MALL.\"","The whole town cheers, \"HO! OH! MALL! OOH!\" Ho, oh, mall, ooh! Hoʻomalu!","5,000 people pack into the mall. She locks the big doors. Outside the wind howls and the palm trees bend flat. Inside she hands out blankets, puts on soft music and gives every kid a free pretzel.","Nobody panics. People nap in the furniture store. Aunties play cards in the food court. The storm passes by morning, and nobody wants to leave."],"Spread your arms over something to shelter it and speak softly. \"Ho-oh-MAH-loo.\"","Malu means shade or shelter. Hoʻomalu is to give shelter, to protect and to keep things calm.",null,"Mall guard sheltering the whole town"],["v198","v",198,"kiaʻi","kee-AH-ee","to guard, to watch over","\"KEY... AH! (catch) EEE!\"",["In Grandma's kitchen there is a snack cabinet with a big padlock. The only key hangs from the collar of Grandma's chihuahua, Peanut. Peanut is the guard.","Peanut weighs 4 pounds. She sits in front of the cabinet all day and all night. She never sleeps. When you walk near, she lifts her lip and growls a tiny growl.","You tiptoe up at midnight. \"Key...\" you whisper, reaching for her collar. She snaps her head around. \"AH!\" you gasp, and there is a gulp in your throat. She barks. \"EEE!\" Key! Ah! Eee! Kiaʻi!","The whole house wakes up. Grandma comes out in her curlers and finds Peanut sitting on your chest like she caught a burglar. She guards that cabinet for 17 years. Nobody ever gets a cracker."],"Stand with your arms crossed in front of a door. \"Kee-AH-ee!\"","A kiaʻi is also a guard or a guardian, the person who watches over.",null,"Chihuahua guarding the snack cabinet key"],["v199","v",199,"mākaʻikaʻi","maah-kah-ee-KAH-ee","to go sightseeing","\"MAAA! Ka-EE! Ka-EE!\"",["Your Ma comes to visit you for one week, and she wants to see EVERYTHING.","She has a camera around her neck the size of a toaster. Every time she takes a picture, she yells \"MAAA!\" to get your attention, and the camera goes \"ka-EE, ka-EE.\" Maaa! Ka-ee! Ka-ee! Mākaʻikaʻi!","She sightsees Diamond Head. Ka-ee, ka-ee. She sightsees the Pali Lookout. Ka-ee, ka-ee. Then she sightsees a stop sign, a mailbox, a pigeon, a man eating a plate lunch and the inside of a gas station restroom.","By the end of the week she has taken 14,000 pictures. When she gets home she shows them all to her friends. Nine thousand of them are of her own thumb."],"Hold up an invisible camera and click it twice. \"Maah-kah-ee-KAH-ee!\"","A visitor or newcomer who comes to go sightseeing is a malihini.",null,"Mom photographing everything, even mailboxes"],["v200","v",200,"hoʻonanea","ho-oh-nah-NEH-ah","to relax, to pass the time pleasantly","\"Ho... oh... nah... NAY... ahhh.\"",["Grandpa Bully has been lying in the same hammock between two coconut trees in Lāʻie for 11 years. He is the most relaxed man in history.","When anyone asks him to do anything, he answers in one long lazy sigh. \"Ho... oh... nah... NAY... ahhh.\" Ho, oh, nah, nay, ah! Hoʻonanea!","\"Grandpa, you have a phone call!\" \"Ho... oh... nah... nay... ahhh.\" \"Grandpa, the tide is coming in!\" \"Ho... oh... nah... nay... ahhh.\" A coconut falls and bounces off his belly. He does not even open his eyes.","Moss grows on his feet. A bird builds a nest in his hair. Tourists take photos of him like he is a statue.","He is not sleeping. He is just passing the time, very pleasantly."],"Lean back, put your hands behind your head and sigh it out. \"Ho-oh-nah-NEH-ah.\"","Nanea means relaxing and enjoyable. Hoʻonanea is to spend time that way.",null,"Grandpa relaxing in hammock for 11 years"],["v201","v",201,"luana","loo-AH-nah","to be at leisure, to take it easy","Lou? Ahh... nah.",["Your whole family is moving house today. Forty cousins, three trucks, one crane. Everybody is sweating. Everybody except your cousin Lou.","Lou is in a hammock between two coconut trees. He is holding a coconut with eleven straws in it. He has sunglasses on his face and a second pair resting on his belly button.","Grandma yells \"LOU! Grab the couch!\" Lou lifts one finger. \"Ahh... nah.\"","The crane lifts the entire house into the air and swings it right over his hammock. A refrigerator falls out and lands next to him. Lou opens it, takes a cold drink, and closes the door with his foot.","\"LOU!\" \"Ahh... nah.\" Lou, ah, nah. By sunset the house is gone, the trees are gone, and Lou is still swinging in his hammock, now held up by two tired cousins. He is the king of taking it easy."],"Lean back like you are in a hammock. \"Loo-AH-nah.\"","Luana is also a popular name in Hawaiʻi.",null,"Lou relaxing while house flies overhead"],["v202","v",202,"leʻaleʻa","leh-ah-LEH-ah","to have fun, to enjoy","Lay, ah! LAY, AH!",["You rent a bounce house for your birthday. Before any kids arrive, a big red hen named Pua sneaks inside.","Pua bounces once and lays an egg. She loves it. She bounces again, higher, and lays another. Every time she goes up she screams with joy. \"LAY (hic) AH! LAY (hic) AH!\" There is a little hiccup in the middle every time because she is laughing so hard.","Soon she is bouncing 20 feet high. Eggs shoot out the door like popcorn. The neighbors run over with bowls. Somebody sets up a scrambled egg station on the lawn.","The kids arrive and nobody wants to leave. A grandpa is bouncing. The mailman is bouncing. Pua is having the best day of her whole life. \"LAY, AH! LAY, AH!\" That is what fun looks like."],"Bounce on your toes twice. \"Leh-ah-LEH-ah!\"","Leʻa by itself means joy or pleasure. Doubling it to leʻaleʻa gives you fun and games.",null,"Hen laying eggs in a bounce house"],["v203","v",203,"ʻoliʻoli","oh-lee-OH-lee","to be glad, joyful","Oh, Lee! Oh, Lee!",["Your friend Lee has been away at college on the continent for two years. His dog Moku has waited by the front door the whole time. Every morning. Every night. Just staring at the door.","Today the door opens. Lee walks in.","Moku weighs 160 pounds. He hits Lee like a truck. They both fly across the living room and land in the laundry basket. Moku's tail wags so fast it knocks three pictures off the wall. He is so glad he forgets how to bark. All that comes out is \"Oh (gulp) LEE! Oh (gulp) LEE!\"","He runs laps around the house. He licks the ceiling. He licks the neighbor. He licks the mailman, who was only walking by. The whole street hears it. \"OH, LEE! OH, LEE!\" That is pure joy on four legs."],"Throw both arms in the air. \"Oh-lee-OH-lee!\"","ʻOli by itself also means joy or happy. Doubling it makes the joy even bigger.",null,"Giant dog tackling Lee with joy"],["v204","v",204,"hoʻohauʻoli","ho-oh-how-OH-lee","to make someone happy","Ho! Oh! HOW? Oh, Lee!",["Your neighbor, Old Man Lee, has not smiled since 1994. The whole street decides today is the day. Everybody stands in his yard and yells \"HO! OH! HOW (hic) OH, LEE? HOW do we make you happy?\"","First try. A marching band of 80 kids plays in his driveway. Nothing.","Second try. Forty puppies are let loose in his living room. He pets one. Still no smile.","Third try. A tower of malasadas taller than his house. He eats one. His left eyebrow moves a little.","Finally a tiny gecko climbs up his pant leg and tickles the bottom of his foot. Lee explodes. He laughs so hard his dentures fly out and land on the roof. He laughs for 45 minutes. The whole street cheers and hugs. You made someone happy. It just took a gecko."],"Tickle the air with one finger. \"Ho-oh-how-OH-lee.\"","Hauʻoli means happy, as in Hauʻoli lā hānau, happy birthday. Put hoʻo in front and you make someone happy.",null,"Gecko tickling grumpy neighbor's foot"],["v205","v",205,"kaumaha","kow-MAH-hah","to be sad; to be heavy","Cow! Ma! Hah...",["The ranch beauty contest is over. The prize cow, all 2,000 pounds of her, came in last place. Her ribbon just says \"Participant.\" She is crying big cow tears, each one the size of a water balloon.","She walks straight into your house and climbs onto Ma's lap in the rocking chair.","You scream \"COW! MA!\" Ma can only wheeze out a tiny \"...hah.\" The rocking chair sinks through the floor. The cow is so heavy and so sad she does not even notice. She lays her big head on Ma's shoulder and sniffles.","Ma pats her ear. \"Cow... Ma... hah.\" Two meanings, one cow. She is heavy. She is sad. And now Ma is stuck under her until the cow feels better, which could take a while."],"Slump your shoulders like you are carrying a cow. \"Kow-MAH-hah.\"","Kaumaha covers both heavy and sad, like a heavy heart. Kaumaha au means I am sad.",null,"Sad giant cow on Ma's lap"],["v206","v",206,"minamina","mee-nah-MEE-nah","to regret; to treasure","Mina! MINA!",["You are having a yard sale. A lady named Mina picks up Grandpa's old dented surfboard. You say \"Three dollars.\" She pays and walks away.","Ten seconds later you remember. Grandpa rode that board on the North Shore in 1971. He carved his initials in it. He told you it was the most precious thing he ever owned.","You run down the street yelling \"MINA! MINA!\" You jump a fence. You run straight through a car wash. You chase her across two parking lots and onto the beach. Mina is already paddling out on the board, waving.","You stand in the water up to your knees. \"Mina... Mina...\" That sick feeling in your stomach is regret. And the reason it hurts so much is that you treasure that board. Minamina is both at once."],"Reach out toward something far away. \"Mee-nah-MEE-nah.\"","Minamina is the feeling of holding tight to something precious that you might lose, or already did.",null,"Chasing Mina and Grandpa's surfboard"],["v207","v",207,"mihi","MEE-hee","to apologize, to repent","Me! Hee...",["You are playing catch in the yard with a breadfruit. Big mistake. It weighs 12 pounds. You throw it way too hard. It sails over the fence and CRASH, through the neighbor's front window and into his fish tank.","The neighbor storms out holding a goldfish in a coffee mug. He is dripping wet. \"WHO DID THIS?\"","Your hand goes up all by itself. \"Me!\" Then a scared little giggle sneaks out. \"...hee.\" Me, hee.","You feel so bad you get down on your knees. Then on your belly. You crawl across the grass to him holding a sign that says SORRY in 14 colors. You offer him your allowance, your bike, and your little brother. \"Me... hee. I apologize.\"","He thinks about it for a long time. He takes the bike."],"Raise your hand slowly and wince. \"MEE-hee.\"","Mihi is a real, from the heart apology. Its partner is kala (#208), to forgive.",null,"Breadfruit through window, hand raised"],["v208","v",208,"kala","KAH-lah","to forgive; to loosen, to release","Collar!",["Your pet pig Kiko ate your birthday cake. The whole thing. Three layers. You are furious. You grab her by her little pink collar and give her a long lecture.","Kiko looks up at you with frosting on her snout and the saddest eyes in the world. One tear rolls down her nose.","You can't stay mad. You sigh. You reach down and loosen her collar. Click. Then you take it off completely. \"COLLAR! Off! You're free!\" Kiko runs down the beach at full speed, ears flapping, doing happy little hops.","That is kala. You forgave her. You loosened the collar. You released the pig. All the same word.","She comes back an hour later and eats your other cake."],"Unclip an invisible collar. \"KAH-lah.\"","E kala mai means excuse me or I am sorry. Careful, kālā with long vowels means money, a totally different word.",null,"Loosening a frosting-faced pig's collar"],["v209","v",209,"ʻeha","EH-hah","to hurt, to be in pain","EH! HAH!",["You are walking barefoot on the beach feeling great. You step on a crab the size of a mini fridge. It grabs your big toe with one claw.","\"EH!\" The pain stops your breath for a second, a little catch in the throat. Then \"HAH!\" You start hopping. \"EH! HAH! EH! HAH!\"","The crab does not let go. You hop down the beach. You hop across the parking lot. You hop up the road, past the church, past the shave ice stand, two whole miles. The crab rides along like it paid for a ticket.","At urgent care the nurse looks up. \"What hurts?\" You point at the crab. \"EH! HAH!\"","Your toe stays purple for a week. Every time you bump it on the table leg, it comes right back out. \"EH! HAH!\""],"Grab your toe and hop. \"EH-hah!\"","ʻEha koʻu poʻo means my head hurts. The next word, hoʻeha (#210), is hurting somebody else.",null,"Giant crab clamped on your toe"],["v210","v",210,"hoʻeha","ho-EH-hah","to hurt someone","HO! EH! HAH!",["It is the World Pillow Fight Championship at the high school gym. Your opponent is Aunty Leilani, 72 years old, five feet tall. Her pillow is stuffed with a 25 pound bag of rice.","The bell rings. She winds up like a baseball pitcher. \"HO!\" The pillow swings. \"EH!\" It smacks last year's champion. \"HAH!\" He flies through the gym doors and lands in the parking lot.","Next guy. \"HO! EH! HAH!\" Into the bleachers.","Next guy. \"HO! EH! HAH!\" Into the scoreboard, which now reads 0 to AUNTY.","You are last. Your knees are shaking. You hold up your fluffy little pillow. She smiles sweetly and says \"Don't worry, this won't hurt a bit.\" Then she hurts you. \"HO! EH! HAH!\""],"Swing an invisible pillow. \"Ho-EH-hah!\"","ʻEha is to hurt or be in pain yourself. Put hoʻ in front and it becomes causing the pain.",null,"Aunty's rice pillow launching champions"],["v211","v",211,"maʻi","MAH-ee","to be sick","Maaah... EEE.",["Your pet goat Pilipo is sick. Really sick. His face is a little green, like a lime. He is lying on the couch under three blankets with a thermometer in his mouth. The thermometer beeps, then explodes.","He tries to bleat like a normal goat. \"Maaaah...\" Then his voice catches in his throat and turns into a tiny squeak. \"...eee.\" Maaah... eee.","You bring him soup. He sneezes in it. You bring him a heating pad. He eats it. You call the vet. The vet says \"Put him on the phone.\" Pilipo moans into the phone. \"Maaah... eee.\" The vet says \"Yup. He's sick.\"","He stays on that couch for four days watching cooking shows. Every hour you hear it from the living room. \"Maaah... eee.\""],"Hold your forehead and moan. \"MAH-ee.\"","Maʻi can also be a noun, sickness. A hale maʻi, a sick house, is a hospital.",null,"Sick green goat on the couch"],["v212","v",212,"lapaʻau","lah-pah-OW","to treat with medicine, to heal","Lap... a... OW!",["You crash your bike into a mango tree and scrape your whole knee. You limp to the school nurse. She is a retired pro wrestler, six foot five, with forearms like tree trunks.","She picks you up like a baby and sets you on her lap. Then she pulls out a bottle of medicine the size of a fire extinguisher.","\"Lap,\" she says, patting her knee. \"A...\" she says, aiming the nozzle. PSSSHHHT. \"OW!\" you scream. Lap, a, OW.","Then something amazing happens. The scrape zips shut like a jacket. The bruise fades. Your hair looks better. Your math grade goes up. She hands you a lollipop and says \"Next!\"","There is a line of 30 kids out the door. Every thirty seconds you hear \"Lap... a... OW!\" and another kid walks out healed."],"Spray an invisible bottle at your knee. \"Lah-pah-OW!\"","Lāʻau lapaʻau is traditional Hawaiian medicine made from plants.",null,"Wrestler nurse spraying giant medicine"],["v213","v",213,"hoʻōla","ho-OH-lah","to save, to heal, to bring back to life","Ho... OHHHHH... LA!",["Everything in your house is dead. The fern on the lanai is brown and crunchy. The goldfish is floating. The lei from graduation looks like old spaghetti.","Your cousin Kainoa, who sings opera in the shower, walks in. He takes a deep breath. His chest puffs up like a balloon. \"HO...\" Then he holds the next part. \"OHHHHHHHHHHHH...\" Ten seconds. Twenty seconds. The windows start to shake. \"...LA!\"","The fern springs up green. The goldfish flips over and starts swimming laps. The lei puffs up fresh and smells like a flower shop. A dead cockroach under the fridge gets up and walks out the door, which is a mistake, but still.","Kainoa bows. That long OHHHH is the healing part. The longer he holds it, the more things come back to life."],"Sing one long note. \"Ho-OHHHH-lah.\"","Ola means life or to live. Hoʻōla means to make live, so to save or heal.",null,"Opera cousin reviving the dead fern"],["v214","v",214,"kunu","KOO-noo","to cough","KOO... NOO!",["You are in a six person canoe race off Waikīkī. Your steersman, Big Keoni, has the worst cough on the island. Every cough sounds exactly the same. \"KOO... NOO!\"","Here is the secret. Every time Keoni coughs, the blast shoots out behind him like a jet engine and the canoe jumps forward 50 feet.","The race starts. You paddle. He coughs. \"KOO... NOO!\" You are in first. He coughs twice. \"KOO... NOO! KOO... NOO!\" You pass a surfer, a sailboat and a very confused turtle.","At the finish line the judges ask what your secret is. The whole crew points at Keoni. He opens his mouth to answer and coughs instead. All three judges get blown into the water.","Now whenever you hear a cough, you hear a canoe."],"Cover your mouth and cough. \"KOO-noo.\"","Kunu is to cough. Its gross twin kihe (#215) is to sneeze.",null,"Coughing steersman jet-powering a canoe"],["v215","v",215,"kihe","KEE-heh","to sneeze","KEE... HEH!",["Uncle Walter is the janitor at your school. He carries 400 keys on a ring the size of a hula hoop. He jingles when he walks. You can hear him coming from two floors away.","Today he gets pepper up his nose. His face scrunches. His eyes close. He takes a huge breath. \"KEEEEE...\"","Everybody in the hallway ducks.","\"...HEH!\"","The sneeze rips the key ring right off his belt. Four hundred keys fly down the hallway like a swarm of bees. Keys stuck in the ceiling. Keys in the fish tank. One key lands inside a malasada a kid was eating. Another flies out the window and locks a car in the parking lot.","Everyone turns and looks at Uncle Walter. He sniffs. \"Key... heh.\" Now he has to find every single one."],"Scrunch your face and sneeze. \"KEE-heh!\"","When someone sneezes, some families answer \"Kihe, a mauli ola,\" wishing them life and good health.",null,"Sneeze blasting 400 keys down hallway"],["v216","v",216,"luaʻi","loo-AH-ee","to throw up","LUA! Ah... EE!",["Your cousin Kimo takes on the Plate Lunch Challenge at the diner. Twelve plates. Two scoops rice each, mac salad, and a mountain of kalbi. He eats all twelve in 20 minutes. The whole diner cheers. He raises his arms like a champion.","Then his face turns the color of a kiwi.","He looks at you in panic. \"LUA!\" That is the local word for the bathroom. He takes off running. \"LUA! AH...\" He gulps, a hard catch in the throat. \"...EE!\"","He runs past the counter. He runs past the cook. People jump out of his way. There is a line of six people at the bathroom door. Kimo does not make it to the lua.","He makes it to the trash can by the door. The trash can will never be the same. Twelve plates, going back where they came from."],"Grab your stomach and run in place. \"Loo-AH-ee.\"","Lua means a hole or pit, and locals use it for the bathroom. The two words only sound alike, but picture luaʻi as what happens when you do not make it to the lua in time. Luaʻi is also used for a volcano erupting.",null,"Plate lunch champ racing for the lua"],["v217","v",217,"pakele","pah-KEH-leh","to escape, to get away","PACK, Kelly!",["You and your cousin Kelly are trapped at Aunty's house. She is showing slides from her cruise. Slide 1,204 is a picture of a buffet. Slide 1,205 is the same buffet from the left. There are 3,000 slides to go.","Aunty steps into the kitchen for more pūpū. You lean over and whisper \"PACK, KELLY!\"","Kelly already has her backpack on. You tie six bedsheets together. You open the bathroom window. You slide down the sheets into the mango tree, drop into the hedge, and army crawl under the carport. Kelly is right behind you with her slippahs in her mouth.","From inside you hear Aunty. \"Slide 1,206!\" The projector keeps clicking. You hop the fence and run all the way to the beach.","\"Pack, Kelly.\" You got away. You escaped."],"Zip up an invisible backpack, fast. \"Pah-KEH-leh!\"","Pakele is getting away safe yourself. Its bigger sibling hoʻopakele (#219) is rescuing someone else.",null,"Escaping Aunty's slideshow down bedsheets"],["v218","v",218,"mahuka","mah-HOO-kah","to run away, to flee","MA! HOOK... AH!",["You are a small fish, a manini, cruising the reef with your mom and 400 brothers and sisters. Life is good. You are nibbling algae. You are blowing bubbles.","Then you look up. A fishhook is coming down through the water. It is as big as a coat hanger. It is shiny. It has a whole sardine on it.","You scream \"MA! HOOK... AH!\"","The whole school hears it. Four hundred fish turn at once and flee so fast the water stays shaped like fish for a second after they leave. The coral shakes. An eel slams its door. A crab gets spun around three times.","You are gone. Ten miles gone. Up on the boat, the fisherman reels in an empty hook and scratches his head. \"Ma, hook, ah.\" When you see a hook, you run away."],"Dart your hand away like a fish. \"Mah-HOO-kah!\"","Pakele (#217) is escaping safe. Mahuka is the running part, fleeing like a runaway.",null,"Fish school fleeing a giant hook"],["v219","v",219,"hoʻopakele","ho-oh-pah-KEH-leh","to rescue","HO! OH! PACK, KELLY!",["Kelly from pakele is in trouble again. She ran from Aunty's slideshow by climbing the tallest mango tree in the yard. Now she is 60 feet up, stuck on a branch, hugging a mango, and Aunty is at the bottom aiming the projector at the tree.","You call the fire department. A fire truck pulls up with a ladder that stretches 70 feet. You ride the bucket up. The wind is blowing. A mynah bird is screaming at you.","You reach her and yell \"HO! OH! PACK, KELLY!\" Kelly throws her backpack into the bucket, then her slippahs, then herself. The ladder swings back down like a giant arm.","Aunty clicks to the next slide. Too late. You drive off with Kelly on the fire truck, sirens going. You saved her. That is a rescue."],"Reach up and pull someone into your arms. \"Ho-oh-pah-KEH-leh!\"","Pakele is escaping yourself. Hoʻo makes it happen to someone else, so hoʻopakele is to rescue.",null,"Fire truck ladder rescuing Kelly"],["v220","v",220,"ʻaʻa","AH-ah","to dare","AH! (gulp) AH!",["You are standing on top of a rock 40 feet above the water at Waimea Bay. Your cousin, floating below, yells up. \"I DARE YOU!\"","You walk to the edge. You look down. The water looks the size of a postage stamp. You open your mouth to say \"AH...\" and your throat freezes. A gulp. A catch. Your knees knock like coconuts.","Your cousin yells \"I DOUBLE DARE YOU!\" A crowd of tourists holds up their phones. A dragonfly lands on your nose to watch.","You take one breath. \"AH!\" Gulp. \"AH!\" And you jump. You fall for what feels like 17 minutes, screaming the whole way. SPLASH.","You pop up, spit out water, and point at your cousin. \"Your turn. I dare you.\" ʻAʻa always starts with a gulp."],"Stand at an imaginary edge, gulp, then jump. \"AH-ah!\"","Watch the marks. ʻaʻa, to dare, has two ʻokina. aʻa, with only the middle ʻokina, means root or vein. ʻaʻā, with a long a at the end, is the rough, jagged lava.",null,"Gulping at the edge of a cliff"],["v221","v",221,"lanakila","lah-nah-KEE-lah","to win, to triumph","LANA! KILLA!",["It is the Spam musubi eating contest at the school carnival. Twelve contestants. Big guys, football players, a sumo wrestler. And at the very end of the table, a tiny aunty named Lana in a flowered muʻumuʻu and a visor.","The horn blows. The football players eat 5 musubi each. The sumo wrestler eats 9. Lana eats 41. She eats them two at a time. She finishes, wipes her mouth with a napkin, and asks \"Is there more?\"","The crowd loses its mind. \"LANA! KILLA! LANA! KILLA!\"","They lift her onto their shoulders. She holds a trophy the size of a refrigerator over her head. Confetti falls. A marching band plays. She wins. She triumphs. She wins again next year, and the year after that, and the sumo wrestler asks for her autograph."],"Pump your fist over your head. \"Lah-nah-KEE-lah!\"","Ua lanakila mākou means we won.",null,"Tiny aunty winning the musubi contest"],["v222","v",222,"pio","PEE-oh","to be beaten, captured; to go out (like a fire)","PEEEE... oh.",["Your uncle bought a pet dragon at the swap meet. It is the size of a golden retriever and it breathes fire. It lights the grill. It lights the tiki torches. It lights Uncle's eyebrows twice.","At the family party it gets cocky. It challenges Grandma to a staring contest.","Grandma does not blink. The dragon's eyes water. Its lip shakes. After four minutes it blinks, and its fire goes out with a sad little whistle like a teakettle. \"PEEEEEE... oh.\"","It is beaten. Its fire is out. Grandma drops a laundry basket over it. Captured.","For the rest of the night it sits under the basket. Every time it tries to make a flame, only a puff of smoke comes out. \"Peee... oh.\" Beaten, captured, and fire out, all in one little word."],"Blow out an invisible candle. \"PEE-oh.\"","Ua pio ke ahi means the fire went out. You can say pio about a light, a candle, or a team that lost.",null,"Dragon losing staring contest to Grandma"],["v223","v",223,"hakakā","hah-kah-KAAH","to fight, to quarrel","HA! Ka-KAAAAH!",["You drop one french fry in the beach park parking lot. Just one.","Two mynah birds land on it at the exact same second. They look at each other. The fight begins.","\"HA!\" says the first one, grabbing the fry. \"Ka-KAAAAAAH!\" screams the second one, grabbing the other end. That last part is long and loud and it never seems to end. They pull. They flap. They roll across the hot asphalt in a ball of feathers.","Other mynahs show up to cheer. One is selling tickets. The fight rolls under a car, over a picnic table, and into the lifeguard tower. The lifeguard hides.","After 45 minutes they drop the fry so they can yell at each other better. A pigeon walks up, eats it, and leaves. The mynahs keep fighting anyway."],"Flap your elbows and squawk. \"Hah-kah-KAAAH!\"","Hakakā can be a real fight or just a loud quarrel, like two siblings in the back seat.",null,"Two mynahs fighting over one fry"],["v224","v",224,"paio","PAI-oh","to battle, to struggle","PIE! OH!",["The bakery on one side of the street and the bakery on the other side have hated each other for 30 years. Today it is war.","Both armies line up in aprons. Each side has a catapult made from a canoe paddle and a trampoline. Your general is a 90 year old baker with a wooden spoon. She raises it and screams \"PIE!\" Everybody answers \"OH!\"","Custard pies fly across the street by the hundreds. Coconut cream. Lemon. Chocolate haupia. People slip, get up, get hit again. You try to lift a 200 pound sweet potato pie onto the catapult and it takes four of you, groaning and struggling.","\"PIE! OH! PIE! OH!\" The battle lasts until sunset. Nobody wins. Everybody is sticky. Tomorrow morning they battle again."],"Throw an invisible pie across the room. \"PAI-oh!\"","Paio also means an argument or a struggle, not only a fight with weapons.",null,"Bakery armies launching pies by catapult"],["v225","v",225,"hoʻokūkū","ho-oh-koo-KOO","to compete, to hold a contest","Ho! Oh! Koo... KOOOO!",["Welcome to the first ever Cuckoo Clock Contest at the community center. Fifty clocks sit on a long table. Their owners stand behind them, sweating. It is one minute to noon.","The judges hold up scorecards. The rules are simple. Loudest bird, longest call, best form.","The clocks strike noon. Fifty little doors fly open. Fifty wooden birds shoot out. \"Koo koo! Koo koo!\" Most of them are done in two seconds.","But one clock, built by a retired ship captain, is different. His bird comes out the size of a chicken. It takes a breath. \"KOO...\" Then it holds the second one. \"KOOOOOOOOOOOO!\" For a full minute. Windows crack. A judge's hat flies off.","The crowd chants \"HO! OH! KOO KOOOO!\" The captain wins a trophy shaped like a bird. The other 49 demand a rematch. The competition continues next year."],"Pop your head out like a cuckoo bird and hold it. \"Ho-oh-koo-KOOOO!\"","Hoʻokūkū is also a noun, a contest or competition, like a hula competition or a spelling bee.",null,"Giant cuckoo bird winning clock contest"],["v226","v",226,"oli","OH-lee","to chant","Ollie!",["Your little cousin Ollie is eight years old and just joined a hālau. Before class starts, the kumu calls out \"Ollie! Time to chant!\"","Ollie stands tall. He plants his bare feet. He takes the biggest breath of his life. His chest swells. His cheeks puff out like a pufferfish. The whole room waits.","Then the chant comes out, strong and steady, one long line of voice rising and falling with no stopping. Ten seconds. Twenty. Thirty. The windows hum. The dog outside sits down to listen. A mynah bird on the fence goes quiet.","When Ollie finally finishes, his face is bright red and he gasps like he just swam up from the bottom of a pool. The kumu nods once and smiles. \"Ollie. That is how you chant.\""],"Stand tall, take a huge breath, and hold one steady tone. \"OH-lee.\"","An oli is a chant that is not danced to, like one asking permission to enter a place or one that welcomes guests. Careful, ʻoli with an ʻokina means glad, as in ʻoliʻoli.",null,"Little Ollie chanting, cheeks puffed"],["v227","v",227,"hīmeni","hee-MEH-nee","to sing a hymn","HEEEE... MANY!",["Sunday morning at a little country church. Twelve aunties in matching muʻumuʻu fill the choir. The pastor smiles and says \"Let's sing one hymn.\"","The lead aunty starts. \"HEEEEEEEEE...\" She holds that first note like a car alarm. The windows rattle. Then the whole choir comes in. \"...MANY!\" Many hymns, it turns out. Not one.","They sing hymn number 1. Then 2. Then 47. The ʻukulele player's fingers go numb. The pastor checks his watch. Someone brings in plate lunches and the choir eats between verses. A family of chickens wanders in and sits in the back row to listen.","At 4 in the afternoon they finally stop. The pastor wipes his forehead and says \"Next week, just one hymn.\" The aunties smile sweetly. \"HEEEE... MANY.\""],"Hold one long high note, then drop down. \"Heeee-MEH-nee.\"","Hīmeni comes from the English word hymn. Hawaiian church choirs have been singing them since the 1800s.",null,"Aunty choir singing forty seven hymns"],["v228","v",228,"hoʻopaʻapaʻa","ho-oh-pah-ah-PAH-ah","to argue, to debate","PA! AH! PA! AH!",["At the family reunion, two grandpas sit at opposite ends of the picnic table. Both of them are called Pa. The question is serious. Does the mac salad go on the left of the rice or the right?","\"PA!\" says one, pointing left. \"AH!\" says the other, slapping the table. \"PA!\" \"AH!\" Every word has a little hiccup in it because they are so worked up.","It turns into a full debate. Somebody brings two podiums and a microphone. A cousin keeps time with a stopwatch. There are charts. There is a poster board with glitter. Grandma is the moderator and she keeps ringing a cowbell.","Six hours later the plate lunches are cold, the sun is down, and the two Pas are still going. \"PA! AH! PA! AH!\" Nobody remembers what they were arguing about."],"Point left, then right, arguing with yourself. \"Ho-oh-pah-ah-PAH-ah!\"","Hoʻopaʻapaʻa can also be a noun, an argument or a debate. A school debate team does hoʻopaʻapaʻa.",null,"Two grandpas debating mac salad placement"],["v229","v",229,"ʻōhumu","oh-HOO-moo","to grumble, to complain","Ohhhhh... HOO... MOO.",["At the rodeo, the whole crowd is waiting for the famous bull, Thunder. The gate bangs open. Thunder walks out slowly, sighs, and sits down in the dirt.","\"Ohhhhhhhh,\" he groans, long and low. \"Hoo... moo.\" He is not bucking. He is grumbling.","The dirt is too dusty. \"Ohhhhhh... hoo moo.\" The cowboy's hat is too big. \"Ohhhhhh... hoo moo.\" The music is too loud, the sun is too hot, the popcorn smells funny, his hooves hurt, and his cousin never calls.","The cowboy climbs on his back and waits. Thunder complains about that too. The rodeo clown tries to cheer him up. Thunder complains about the clown's shoes.","The buzzer rings. The cowboy wins, because Thunder never moved. Thunder grumbles all the way back to the barn. \"Ohhhhhh... hoo... moo.\""],"Cross your arms and groan. \"Oh-HOO-moo.\"","ʻŌhumu can also mean to plot or scheme in secret, like two grumblers whispering in a corner.",null,"Grumpy rodeo bull complaining in dirt"],["v230","v",230,"hoʻokano","ho-oh-KAH-no","to act stuck up, to be arrogant","Ho, oh... my CANOE.",["There is one guy at the beach who thinks he is better than everybody. He owns a canoe painted gold. Real gold. It has a leather seat and two cup holders.","He walks everywhere with his nose so high in the air that when it rains, his nostrils fill up with water. He does not look at people. He looks over them.","A kid asks \"Can I touch it?\" He sniffs. \"Ho, oh... my CANOE.\" A tourist asks for a photo. \"Ho, oh, my CANOE.\" A crab crawls onto the front. He shoos it away with a tiny silk fan.","Then he paddles out, nose up, not looking where he is going, and runs straight into the reef. The gold canoe sinks in three feet of water. He is standing there, waist deep, nose still pointed at the clouds."],"Lift your nose high and sniff. \"Ho-oh-KAH-no.\"","The opposite is haʻahaʻa, humble.",null,"Snob with nose up, gold canoe"],["v231","v",231,"hoʻohanohano","ho-oh-hah-no-HAH-no","to honor","HA, NO! HA, NO!",["Uncle Sonny drove the same city bus route for 42 years. He never missed a day. He learned every rider's name. He let kids ride free with a smile when they forgot their fare.","On his last day, the whole route is waiting at the final stop. Four hundred people. A band. A banner. A pile of lei.","Uncle Sonny is way too humble. As they put the first lei on him he waves his hands. \"HA, NO! HA, NO!\" Another lei. \"Ha, no!\" Another. \"HA, NO!\" By lei number 30 he is covered up to his eyeballs. Only his bus driver hat sticks out. He keeps saying it, muffled under all the flowers.","The kids sing to him. The riders hug him. They honor him until the sun goes down, and he cries a little into the flowers."],"Wave off a compliment, twice. \"Ho-oh-hah-no-HAH-no.\"","Hanohano by itself means glorious or honored. Hoʻo turns it into giving that honor to someone.",null,"Bus driver buried in thirty lei"],["v232","v",232,"hoʻomaikaʻi","ho-oh-mai-KAH-ee","to congratulate, to praise, to bless","HO! OH MY, KAI!",["Your friend Kai paddles out on a stand up board just to fish for fun. He comes back towing a 200 pound ʻahi. It is bigger than the board. It is bigger than Kai.","The whole beach runs down to the water screaming. \"HO! OH MY, KAI!\" Grandmas hug him. A lifeguard gives him a high five that leaves a mark. Somebody's tutu says a little blessing over Kai and the board.","Somebody makes him a trophy out of a cooler lid. Somebody else writes KAI IS THE BEST in the sand in letters 20 feet tall. Everyone wants to shake his hand. His hand gets so tired he starts shaking with his foot.","\"Oh my, KAI!\" That is praise. That is congrats. That is blessing him for a good day. That is hoʻomaikaʻi."],"Pat someone on the back. \"Ho-oh-mai-KAH-ee!\"","Hoʻomaikaʻi ʻana! means Congratulations! Maikaʻi by itself means good.",null,"Beach cheering Kai and his giant ʻahi"],["v233","v",233,"hoʻolaʻa","ho-oh-LAH-ah","to dedicate, to make sacred","Ho, oh, LAAAA (hic) AH.",["Your school just finished building a new library. Before anyone walks in, there is a dedication. The elders offer a blessing, and a maile lei hangs across the doorway, waiting to be untied.","Your class is the choir. The teacher asks everyone to hold one soft, steady note the whole time. \"Ho... oh... LAAAAAA...\"","Everyone holds it. It sounds beautiful. Then the boy next to you gets the hiccups. \"LAAAA (hic) AH.\" He tries again. \"LAAAA (hic) AH.\" He turns bright red. You try not to laugh so hard that your ears pop.","Nobody minds. The blessing is finished, the maile is gently untied, and the building is set apart for learning. Dedicated. Made special. Ho, oh, la, ah.","Every time you walk through those doors now, you remember that hiccup."],"Hold one soft note, with a little catch in it. \"Ho-oh-LAH-ah.\"","Laʻa means sacred or set apart. Hoʻolaʻa is to make something that way, like blessing a new building or a new canoe. At blessings the maile lei is untied, not cut.",null,"Hiccuping choir at library blessing"],["v234","v",234,"paʻi","PAH-ee","to slap; to print","PIE!",["The printer in your office is 40 years old. It is the size of a car. It only works if you slap it.","You press print. Nothing. You slap the side. WHACK. \"PIE!\" it groans, and a page slides out. But the page is not your report. It is a picture of a pie.","You slap it again. WHACK. \"PIE!\" Another pie picture. Apple. Then coconut cream. Then a picture of a pie hitting your boss in the face. You slap it harder. WHACK WHACK WHACK. \"PIE! PIE! PIE!\" Paper pours out like a waterfall.","By lunch the whole office is buried in pie pictures up to the ceiling. Your boss climbs out of the pile, stares at the printer, and slaps it himself. \"PIE!\"","Slap. Print. Same word."],"Slap the table once. \"PAH-ee!\"","Paʻi kiʻi means to take a photo. Careful, pai with no ʻokina is the Hawaiian word for pie. Watch the family, paʻi (slap), paʻipaʻi (clap, #235), hoʻopaʻi (punish, #250).",null,"Slapping a printer that prints pies"],["v235","v",235,"paʻipaʻi","pah-ee-PAH-ee","to clap","PIE! PIE!",["You are at the aquarium show. The star is Big Momi, an octopus with eight very long arms. The trainer holds up a whole pie and asks \"Momi, what do you want?\"","Momi gets so excited she starts clapping. With all eight arms. Two at a time, then four at a time, then all eight together. SLAP SLAP SLAP SLAP. It sounds like popcorn in a metal pot. Water splashes the first ten rows.","While she claps she chants \"PIE! PIE! PIE! PIE!\" The whole crowd joins in, clapping and yelling \"PIE! PIE!\"","The trainer tosses her the pie. Momi catches it, eats it in one bite, and gives herself a standing ovation, which for an octopus looks like a wet umbrella flapping.","One slap is paʻi. Slap slap, again and again, is a clap."],"Clap twice, then twice again. \"Pah-ee-PAH-ee!\"","Hawaiian often doubles a word to repeat the action. Paʻi is one slap. Paʻipaʻi is slapping over and over, clapping.",null,"Octopus clapping eight arms for pie"],["v236","v",236,"kīkēkē","kee-keh-KEH","to knock (on a door)","KEY? KEH! KEH!",["You come home from the beach in wet shorts and sandy feet. You reach for your key. No key. It is in the car. The car is locked. The car key is in the house.","You knock on the door. Your little brother is inside playing video games with headphones on.","You yell \"KEY?\" and knock twice more. \"KEEEEY! KEH! KEH!\" Each knock you hold a little longer, stretching the sound out like chewing gum. \"KEEEEE... KEEEEH... KEEEEH!\"","Nothing. You knock harder. The mangoes fall off the tree. The neighbor's dog starts howling. You knock so hard the whole house hops two inches to the left.","Finally your brother opens the door. \"Oh. Hi.\" He was never wearing the headphones. He just liked hearing you knock."],"Knock three times on a table, slow and long. \"Kee-keh-KEH.\"","Kī by itself is the word for a key, borrowed from English. Handy when you are locked out.",null,"Locked out, knocking the house sideways"],["v237","v",237,"ʻō","OH","to poke, to pierce, to stab with a fork","OHHHHHH!",["Your friend brings a malasada to the party. It is the size of a beach ball. It is so full of custard it wobbles whenever anyone talks.","Everyone gathers around. You pick up a fork. You raise it high like a spear. The room goes quiet.","You poke. The fork pierces the skin with a tiny pop. For one second, nothing. Then everyone in the room catches their breath at once, a little gulp, and then \"OHHHHHHHHHHHH!\" as custard shoots straight up like a geyser.","It hits the ceiling fan. The fan spins custard across the whole room. The dog is custard. Grandpa is custard. Your little sister stands there with her mouth open, catching it like rain.","\"OHHHHHHH!\" The gasp lasts twelve seconds. One poke with a fork. That is ʻō."],"Stab an invisible fork down, then gasp. \"OHHH.\"","The same spelling ʻō also means over there, as in maʻō. And ʻōʻō, doubled, is the old digging stick.",null,"Fork popping a beach ball malasada"],["v238","v",238,"nahu","NAH-hoo","to bite hard, to sting","NAH... HOOOOO!",["You wake up late for work. You shove your foot into your shoe. Something inside it moves.","A centipede. Seven inches long. Orange. Angry. It bites your big toe as hard as it can.","\"NAH...\" you say, because this cannot be happening. Then the pain arrives. \"...HOOOOOOOOO!\"","You jump nine feet straight up. Your head pokes through a ceiling tile. You come down, hop across the kitchen, and kick the shoe across the yard. It lands in the neighbor's pool. The centipede climbs out, dries itself off on the diving board, and gives you a dirty look.","Your toe swells up like a cherry tomato. All day at work you limp. Every time someone asks what happened, you say it again. \"Nah... HOOOO.\" That is a hard bite. That is nahu."],"Shake out your foot, fast. \"NAH-hoo!\"","Nahu is a hard bite or a sting. Do not mix it up with nau (#239), which is just chewing.",null,"Centipede biting toe inside shoe"],["v239","v",239,"nau","NOW","to chew","NOW! NOW! NOW!",["Tūtū has one rule at her table. Every bite gets chewed 50 times. No exceptions.","Today she is serving pipikaula, dried beef so tough it could be a slippah. You put a piece in your mouth. Tūtū starts her stopwatch and stands over you like a drill sergeant.","\"NOW!\" You chew. \"NOW!\" You chew again. \"NOW! NOW! NOW!\" Every time she says it, your jaw goes up and down. By chew 20 your cheeks are burning. By chew 35 your ears are moving. By chew 49 your whole head is bobbing like a chicken.","\"NOW!\" Chew 50. You swallow. Tūtū nods. Then she puts another piece on your plate.","That night in bed, your jaw keeps going on its own. Now. Now. Now."],"Chew slowly and loudly. \"NOW. NOW. NOW.\"","Nau is chewing. Nahu (#238) is biting down hard. Chew nicely, don't bite.",null,"Tūtū timing fifty chews of jerky"],["v240","v",240,"omo","OH-mo","to suck","OH, MO!",["Your cousin Mo orders the thickest mango smoothie at the food court. It is so thick a spoon stands straight up in it. He gets the skinniest straw in the building.","He starts to suck. His cheeks cave in. His eyes bulge. His face turns purple. Nothing moves.","He sucks harder. The cup crumples. Napkins fly off the next table and stick to his face. A man's toupee lifts off his head. Everybody yells \"OH, MO!\"","He keeps going. The straw starts pulling in french fries, a fork, somebody's slippah, a pair of sunglasses. The table cloth is sliding toward him. \"OH, MO! OH, MO!\"","Finally, SHHLOOOORP. The whole smoothie shoots up the straw in one gulp. Mo leans back, very happy. Somewhere inside him is a pair of sunglasses."],"Suck hard through an invisible straw. \"OH-mo.\"",null,null,"Mo sucking the food court into straw"],["v241","v",241,"hoʻomomona","ho-oh-mo-MO-nah","to fatten; to fertilize","Mo'? MO'? Nah?",["Grandpa is getting his pig ready for the county fair. Her name is Honey and she is going to win Biggest Pig.","Every hour he brings her a bucket of leftover rice, poi and papaya. \"Mo'?\" he asks. Honey eats it. \"MO'?\" Honey eats more. He looks at her. \"Nah?\" Honey never says nah.","Then he goes out back and does the same thing to his garden. He shovels in a mountain of horse manure. \"Mo'? MO'? Nah?\" The tomatoes grow to the size of beach balls. The zucchini is longer than his truck.","By fair day, Honey is so fat she has to be rolled into the trailer. The tomatoes need their own trailer. Grandpa wins two ribbons. He fattened the pig. He fertilized the dirt. Mo', mo', nah."],"Hold out a spoon again and again. \"Ho-oh-mo-MO-nah.\"","Momona means fat, and also sweet or fertile. Hoʻomomona makes something fat, or makes soil rich.",null,"Grandpa fattening pig, giant tomatoes"],["v242","v",242,"pōloli","poh-LO-lee","to be hungry","POOOOLE... LOLLY!",["You skipped breakfast. You skipped lunch. It is 4 in the afternoon at the county fair and you are so hungry your stomach growls like a motorcycle. People turn around to see who is revving.","Then you see it. The greasy pole game. A 30 foot pole covered in butter, and at the very top, a lollipop the size of a trash can lid.","You point and moan \"POOOOOOLE...\" You hold it long because your stomach is too empty to talk fast. \"...LOLLY!\"","You climb. You slide down. You climb. You slide down. Twelve times. People start cheering. Your stomach roars so loud it scares a toddler. On the thirteenth try you reach the top and bite the lollipop right off the stick while still hugging the pole.","Pōloli. Hungry enough to climb a butter pole."],"Rub your belly and moan. \"Poh-LO-lee.\"","Pōloli is hungry. Its opposite is māʻona (#243), full. Pōloli au means I am hungry.",null,"Hungry climber on a butter pole"],["v243","v",243,"māʻona","maah-OH-nah","to be full (after eating)","MAAAAH (gulp) OH... NAH.",["It is the all you can eat buffet. A sumo wrestler sits at the table next to yours. He has eaten 14 plates. The stack of empty plates is taller than he is.","The waiter comes by with a tray of chocolate cake. The sumo wrestler leans back. His belt pops off and flies across the room like a slingshot. He lets out a long, happy sigh. \"MAAAAAAAAAH.\" Then a little gulp catches in his throat. He waves the cake away. \"...Oh, nah.\"","He tries to stand up. He can't. The chair is stuck to him. Three waiters roll him out the door like a barrel.","On the way out he pats his belly and says it one more time, very satisfied. \"Maaaah. Oh, nah.\" He is full. Totally, completely, perfectly full."],"Lean back, pat your belly, and wave off more food. \"Maah-OH-nah.\"","Ua māʻona au means I am full. The pair to remember, pōloli (hungry) and māʻona (full).",null,"Full sumo wrestler rolled out the door"],["v244","v",244,"ʻono","OH-no","to be delicious; to crave","Oh no.",["Your coworker brings in a pan of butter mochi. It is still warm. It is golden on top and chewy in the middle and the whole office smells like coconut.","You take one little square. You bite it. You freeze. You whisper \"Oh no.\"","Because now you know. You are going to eat the whole pan. You eat another square. \"Oh no.\" Another. \"OH NO.\" You are hiding squares in your desk drawer, in your pockets, in your shoes. By 10 am the pan is empty and you are licking it.","That night at 3 in the morning you wake up craving it so badly you drive to your coworker's house in your pajamas and knock on her door. She opens it holding a fresh pan. \"Oh no,\" you both say.","Delicious, and craving it. Both are ʻono."],"Take an invisible bite, then look scared. \"OH-no.\"","Locals use ʻono in everyday English for tasty food. The fish called ono, the wahoo, is spelled without the ʻokina.",null,"Licking the empty butter mochi pan"],["v245","v",245,"hoʻoinu","ho-oh-EE-noo","to give a drink; to water (plants)","Ho... oh... he KNEW!",["You come back from a two week trip. Every plant on your lanai is flat, crispy and gasping. The fern is lying on its back with one frond on its forehead like it fainted.","You grab the hose. The second the water hits, the plants start slurping. The fern sits up and gulps like a camel. The orchid grabs the hose and drinks straight from it.","Then the tomato plant, dripping wet, turns to the others and whispers \"Ho... oh... he KNEW!\" He knew we were thirsty! They all start cheering and waving their leaves.","The neighbor's horse leans over the fence with its tongue hanging out. You give it a drink too. Then the mailman. Then a gecko who looks very thirsty. \"He KNEW!\" they all shout.","You give a drink to anything that asks. That is hoʻoinu."],"Tip an invisible watering can. \"Ho-oh-EE-noo.\"","Inu means to drink. Hoʻo makes it happen to someone else, so hoʻoinu is giving water to people, animals or plants.",null,"Thirsty plants cheering at the hose"],["v246","v",246,"hānai","haah-NAI","to feed, to raise, to adopt","HAAAAH... NAY!",["Tūtū lives at the end of a long dirt road in Waimānalo. She raised 14 kids. Only 3 were born to her. The rest just showed up one by one, and she fed them, and they stayed.","She also raised a baby horse whose mother could not feed him. She gave him a bottle every three hours for six months. She sang to him. She let him sleep on the lanai. He is now 1,200 pounds and still thinks he is a lap dog.","Every morning when Tūtū comes out with breakfast, the horse throws his head back and neighs as loud as he can. \"HAAAAAAH... NAY!\" A long happy start, then the neigh.","All 14 kids come running too. Tūtū feeds everybody. The kids, the horse, the neighbor kids, and a mailman who retired years ago but still comes by for breakfast."],"Hold out a baby bottle. \"Haaah-NAI.\"","A hānai child is raised by someone other than the birth parents, a common and loving tradition in Hawaiian families.",null,"Tūtū bottle feeding a giant horse"],["v247","v",247,"hoʻolimalima","ho-oh-lee-mah-LEE-mah","to rent, to hire","LIMA! LIMA!",["You have to move a piano to the eighth floor. The elevator is broken. Your friends suddenly all have plans.","So you go to a rental shop at the end of an alley. The sign says HANDS FOR RENT. The old man behind the counter asks how many. You say \"A lot.\" He hands you a box.","You open it at home. Two hundred wooden hands crawl out like crabs. They line up in rows. They lift the piano. As they carry it up the stairs they chant in tiny voices \"LIMA! LIMA! LIMA!\"","Up they go. Floor three. Floor five. Floor eight. They set the piano down, play a little song on it, and crawl back into the box. You pay the old man 40 dollars and 6 lima beans, because that is his price.","You rented hands. That is hoʻolimalima."],"Walk your fingers across the table like crabs. \"Ho-oh-lee-mah-LEE-mah.\"","Lima means hand, and also the number five. Hoʻolimalima can also be a noun, a lease or a rental.",null,"Rented hands carrying a piano upstairs"],["v248","v",248,"hoʻokuʻu","ho-oh-KOO-oo","to let go, to release, to dismiss","KOO (gulp) OOO!",["Your cousin's wedding is on the beach. The plan is simple. At the end, release twelve white doves.","Somebody ordered wrong. The box is the size of a shipping container. The groom opens the door. Six hundred pigeons pour out at once, cooing so loud it sounds like an airplane. \"KOO... (gulp) OOO! KOO... OOO!\"","They let go of the box. They let go of the groom's jacket. One of them snatches Uncle's toupee on the way up and lets it go right over the cake.","Then the pastor looks at the crowd and says \"Okay. Everybody is dismissed.\" Six hundred pigeons and two hundred guests all scatter in different directions at the same time.","Letting go of the birds. Letting everybody go home. Ho, oh, koo, oo."],"Open your hands like you are releasing a bird. \"Ho-oh-KOO-oo.\"","Hoʻokuʻu is used for dismissing a class or releasing a prisoner. Its short cousin kuʻu (#249) is to let down or let go.",null,"Six hundred pigeons released at a wedding"],["v249","v",249,"kuʻu","KOO-oo","to let down, to lower, to release","Koooo... (hic) ...oooh.",["The lady upstairs in the old Chinatown building is 90 years old and does not do stairs. Every morning she lowers a basket on a rope from her third floor window.","The rope runs over a squeaky old pulley. As the basket goes down, the pulley sings \"KOOOOOOO...\" Then the rope catches for a second, a little hiccup, and keeps going. \"...oooooh.\"","The whole street knows that sound. The malasada man puts in six malasadas. The fish man puts in a whole ʻahi. The mailman puts in her mail. A kid puts in his homework for her to check.","Today the basket is so heavy she has to let it down inch by inch, arms shaking, the pulley singing the whole time. \"Kooooooo... ooooh.\" It lands on the sidewalk with a thump.","Lowering it down. Letting it go. That is kuʻu."],"Lower an invisible rope, hand over hand. \"KOO-oo.\"","Kuʻu also means my, in a loving way, like kuʻu ipo, my sweetheart, in old love songs.",null,"Basket lowered on a squeaky rope"],["v250","v",250,"hoʻopaʻi","ho-oh-PAH-ee","to punish","Ho... oh... no PIE.",["Your little brother ate the whole coconut cream pie meant for the church bake sale. All of it. He even licked the tin. He has whipped cream in his eyebrows.","Mom decides the punishment. He has to sit in a chair in the middle of the kitchen while the entire family eats pie in front of him. Nine pies. Apple, lemon, chocolate haupia, sweet potato. Everyone chews slowly and makes happy noises.","He whimpers. \"Ho... oh... no PIE.\" Mom takes another bite. \"Nope. No pie.\" He howls. \"HO! OH! NO PIE!\"","The punishment lasts three hours. The neighbors come over to watch. Somebody brings popcorn. By the end he promises he will never touch another pie as long as he lives.","The next morning, the last pie is missing."],"Shake your finger at someone. \"Ho-oh-PAH-ee.\"","Paʻi, paʻipaʻi, hoʻopaʻi. Slap, clap, punish, all from the same little word. Hoʻopaʻi can also mean a fine or penalty.",null,"Brother punished while family eats pie"],["v251","v",251,"hoʻokolokolo","ho-oh-ko-lo-KO-lo","to put on trial, to investigate","COLA! COLA!",["Court is in session. The judge is a mongoose in a tiny black robe. The accused is a can of cola.","The charges are serious. Yesterday the cola exploded inside Aunty's purse and soaked her wallet, her lipstick and her bingo cards.","The detective, a crab with a magnifying glass, investigates. He sniffs the purse. He pokes the can. He plays a slow motion video that shows someone shaking the can before putting it in the purse. It was Aunty's grandson.","The courtroom gasps and chants \"COLA! COLA! COLA!\" The mongoose bangs a gavel made from a macadamia nut. Ho, oh, cola, COLA.","The cola is found not guilty. It is so happy it fizzes a little. The grandson is sentenced to buy Aunty a new purse. Investigate, put on trial, find the truth."],"Bang an invisible gavel twice. \"Ho-oh-ko-lo-KO-lo.\"","A courthouse is a hale hoʻokolokolo. Kolo by itself means to creep or crawl, like a detective creeping around for clues.",null,"Mongoose judge putting cola on trial"],["v252","v",252,"hoʻopiʻi","ho-oh-PEE-ee","to sue, to accuse, to complain","Ho! Oh! P.E.!",["Kawika is in seventh grade and he hates P.E. more than anything. Today the coach made him run 40 laps in the rain.","So Kawika sues. He shows up at the principal's office in his dad's suit, four sizes too big. He carries a briefcase. The briefcase has a sandwich in it.","He points at the coach and says \"HO! OH! I accuse... P.E.!\" His voice cracks on the E, a little squeak in the throat. \"P... EE!\"","He reads his complaints from a scroll that unrolls across the floor. The laps were too long. The rain was too wet. The dodgeball hit him in the face three times, and one time was on purpose. He demands 5 million dollars and new shoes.","The principal reads it all, nods seriously, and makes him run five more laps."],"Point an accusing finger. \"Ho-oh-PEE-ee!\"","Piʻi by itself means to climb or go up. Think of hoʻopiʻi as taking your complaint up to someone higher.",null,"Seventh grader suing P.E. class"],["v253","v",253,"hoʻāhewa","ho-aah-HEH-vah","to blame, to condemn","HO! AAAAH, HEATHER!",["You are on a long family road trip. Six people in one car, windows up, AC on high. Somewhere in the second hour, a smell arrives. A terrible smell. A smell that could peel paint.","Every head in the car turns toward your little cousin Heather.","\"HO!\" says Dad. \"AAAAAAAH, HEATHER!\" says everybody else, with that long disgusted ahh. Mom points. Grandma points. The baby points.","Heather's eyes go wide. \"It wasn't me!\" Nobody believes her. They condemn her to the far back seat, alone, windows down, with a clothespin on her nose.","Ten minutes later the dog, curled under the seat, lets out a small happy sigh. Another smell. Heather sits up. \"HO! AAAAH, DOG!\"","Too late. The family already blamed her. The dog gets away with it forever."],"Point and pinch your nose. \"Ho-aah-HEH-vah.\"","Hoʻāhewa is strong blame, like a judge condemning someone. The whole car blaming Heather counts too.",null,"Family blaming Heather for the smell"],["v254","v",254,"hoʻokō","ho-oh-KOH","to carry out, to fulfill","HO! OH! COOOOLD!",["The shave ice delivery guy made a promise. \"Your order will arrive cold, no matter what.\"","Your order is going to the roof of the tallest hotel in Waikīkī. Forty four floors. The elevators are broken. It is August.","He starts up the stairs holding a rainbow shave ice with a snow cap on top. Floor 10, he is sweating. Floor 20, he takes off his shoes. Floor 30, he balances the cup on his head and fans it with his hat. Floor 40, he is crawling, blowing on it the whole way so it will not melt.","He kicks open the roof door. He holds it out. You take a bite. He yells \"HO! OH! COOOOOOOLD!\" and holds that long O until he runs out of air.","Promise kept. Order carried out. Fulfilled."],"Hand over an invisible cup, proudly. \"Ho-oh-KOH.\"","Hoʻokō is keeping your word or carrying out an order all the way to the end.",null,"Carrying shave ice up 44 floors"],["v255","v",255,"hoʻoholo","ho-oh-HO-lo","to decide; to pass (a law)","HOLE! OH!",["The town council has argued about the same law for three years. Should chickens be allowed on the golf course? Half say yes. Half say no. They cannot decide.","So the chairwoman stands up and says \"Let the hole decide.\"","The whole council marches out to the 18th green in their suits. She places a golf ball 60 feet from the cup. If it goes in, the law passes.","She swings. The ball rolls over a hill. It bounces off a chicken. It circles the cup three times. The whole council leans in and holds their breath.","It drops. \"HOLE! OH!\" The council screams and hugs like they just won a championship. Papers fly everywhere. The law passes. Seventeen chickens immediately walk onto the golf course.","Decided. Passed. Ho, oh, hole, oh."],"Tap an invisible putter, then throw up your hands. \"Ho-oh-HO-lo!\"","Holo means to run or to sail. Hoʻoholo, to decide, is like finally making the plan run.",null,"Council deciding a law by golf putt"],["v256","v",256,"koho","KO-ho","to choose, to vote; to guess","Vote COHO!",["It is election day at the fish market. For the first time ever, the fish are running for mayor of the market.","The candidates lie on the ice. A mullet with a bad haircut. A tuna wearing a tie. And a coho salmon who flew in from the continent with a campaign bus and signs everywhere that say VOTE COHO.","You have to choose. You stare at them. You try to guess which one will win. The tuna blinks. The mullet tells a joke. The coho salmon stands up on its tail and shouts \"CO... HO!\"","That does it. You mark your ballot. Everybody marks their ballot. The whole market chants \"COHO! COHO! COHO!\"","The salmon wins. His first act as mayor is to lower the price of salmon, which is a strange choice for a salmon."],"Mark an X on an invisible ballot. \"KO-ho.\"","Koho covers every kind of picking, from voting to guessing on a quiz. Koho is choosing, ʻāpono (#257) is giving the thumbs up.",null,"Salmon winning the fish market election"],["v257","v",257,"ʻāpono","aah-PO-no","to approve","AAAAH (gulp) PONO!",["The church potluck has one judge. She is a retired school principal who has never smiled in public. She carries a rubber stamp the size of a hubcap.","She walks down the long table. She tastes the chicken long rice. She chews. Everybody holds their breath. She lets out a long, low sound. \"AAAAAAAAH.\" A little gulp. \"...PONO.\" Then BAM, she slams down the stamp. Approved.","The lomi salmon. \"AAAAAH... pono.\" BAM. The kālua pig. \"AAAAAH... pono.\" BAM. The whole table jumps each time.","Then she tastes your macaroni salad with raisins in it. Silence. She puts the stamp back in her purse and walks away.","Your mom is crying. The other aunties nod quietly. Some dishes get ʻāpono, and some dishes do not."],"Stamp the table with your fist. \"Aah-PO-no.\"","Pono means right, good, proper. ʻĀpono is like saying yes, this is pono, I approve.",null,"Principal stamping approved potluck dishes"],["v258","v",258,"hoʻoponopono","ho-oh-po-no-PO-no","to set right, to fix; to resolve a conflict","Oh no, oh no... pono, pono.",["Two brothers stopped talking eleven years ago over a borrowed fishing pole that came back broken. Since then they sit at opposite ends of every party. At Christmas they pass the rice through three cousins so they never touch the same bowl.","This year their mom has had enough. She sits them down at the kitchen table, knee to knee, with the whole family around them.","At first all anybody says is \"Oh no. OH NO.\" Oh no, this is awkward. Oh no, here we go. The older one crosses his arms. The younger one stares at the ceiling fan.","But they talk. Hour after hour. One says sorry. Then the other. Somebody cries. Somebody brings out a brand new fishing pole with a bow on it.","By midnight the words have changed. \"Oh no, oh no\" has turned into \"pono, pono.\" Right again. Set right."],"Fit your two hands together like puzzle pieces. \"Ho-oh-po-no-PO-no.\"","Hoʻoponopono is also a traditional Hawaiian family practice of talking things through, with prayer and forgiveness, to make relationships right again.",null,"Two brothers making peace at the table"],["v259","v",259,"hoʻololi","ho-oh-LO-lee","to change, to alter","LOLLY!",["Your pet chameleon is named Lolly. She is green, with three little horns, and she rides on your shoulder all day.","Whenever you yell her name, she changes color. \"LOLLY!\" Purple. \"LOLLY!\" Orange with pink stripes. \"LOLLY!\" Plaid.","Then it gets weird. You yell \"LOLLY!\" and the couch changes from brown to yellow. \"LOLLY!\" Your dad's plain shirt turns into an aloha shirt. \"LOLLY!\" The family car is now a boat. The dog is now a cat, and she is not happy about it.","You panic. \"HO! OH! LOLLY! Change it back!\" Everything flips back except the car, which stays a boat. Your dad just shrugs and drives it down the road anyway.","Ho, oh, Lolly. Anything she looks at changes."],"Wave your hand like a magic wand. \"Ho-oh-LO-lee.\"","Loli means to change by itself. Hoʻololi is to make a change, to alter something.",null,"Chameleon Lolly changing everything around"],["v260","v",260,"unuhi","oo-NOO-hee","to translate; to pull out","OOO! NOOO! HEE!",["You have a loose tooth that has been wiggling for three weeks. The dentist ties it to a string. He ties the other end to the bumper of his truck.","He drives off. The string pulls tight. \"OOO!\" Tighter. \"NOOOOO!\" POP. The tooth flies out the window. \"HEE!\"","Then something strange happens. The dog barks, and you understand it perfectly. \"Is that a tooth? Can I eat it?\" A mynah bird on the wire says \"Nice tooth, kid.\" Visitors at the bus stop ask for directions in four different languages, and you answer every one of them.","You even understand what the baby is saying. It is mostly complaints about socks.","The dentist pulled out your tooth, and now you can translate everything. Oo, noo, hee. Both meanings in one yank."],"Yank an invisible string. \"Oo-NOO-hee!\"","Translating is pulling the meaning out of one language and setting it down in another. Same word, unuhi.",null,"Yanked tooth, suddenly translating everything"],["v261","v",261,"wehewehe","veh-heh-VEH-heh","to explain","This WAY, hey! That WAY, hey!",["Grandpa got a new TV remote. It has 64 buttons. Your uncle has been explaining it to him for three hours.","He has a whiteboard. He has a laser pointer. He has drawn a map of the remote with arrows and colors. \"This WAY, hey!\" he says, pointing at the volume. \"That WAY, hey!\" pointing at the channels. \"WAY, hey! WAY, hey!\"","Grandpa nods. Grandpa presses a button. The garage door opens. Uncle explains again, slower. Grandpa presses a button. The neighbor's garage door opens.","Uncle brings out a slideshow. He acts it out with hand puppets. He makes a song about it. By hour six, Grandpa finally changes the channel by himself. Uncle falls to his knees and cries with joy.","Then Grandpa asks \"Now how do I turn it off?\""],"Point this way, then that way. \"Veh-heh-VEH-heh.\"","Wehe means to open. Wehewehe is opening an idea up until it makes sense. The online Hawaiian dictionary is called Wehewehe Wikiwiki.",null,"Uncle explaining TV remote on whiteboard"],["v262","v",262,"hoʻākāka","ho-aah-KAAH-kah","to make clear","HO! AAAAH! CAAAR-CAR!",["It is pouring rain on the H-1. The inside of Dad's windshield is so fogged up it looks like milk. He is driving with his head out the window like a dog.","In the car seat in the back, your two year old brother is yelling the only words he knows. \"AAAAAH! CAAAR CAR!\"","Nobody understands. Dad says \"Yes, buddy, car car.\" The baby gets madder. \"HO! AAAAAAH! CAAAAAR CAR!\"","So the baby leans forward as far as his straps allow, stretches out one sticky arm, and wipes one big circle on the glass with his sleeve. Suddenly everyone can see. There is a car right in front of you. Dad hits the brakes. Everyone is fine.","The baby folds his arms. He made it clear. He made the windshield clear. Ho, ah, car car."],"Wipe a foggy window in a big circle. \"Ho-aah-KAAH-kah.\"","Akāka by itself means clear, easy to see or understand. Hoʻākāka makes it that way, like explaining until it clicks.",null,"Toddler wiping a foggy windshield clear"],["v263","v",263,"kuhikuhi","koo-hee-KOO-hee","to point, to give directions","Cookie? COOKIE!",["You are lost downtown. Your phone is dead. You stop a tiny old man on the sidewalk and ask how to get to the bakery.","He smiles, lifts one finger, and points. His finger starts to stretch. It stretches like a telescope. Out across the street. Past the bank. Around a corner. Down two blocks. It stops, tapping on the bakery window.","\"Cookie?\" you ask. \"COOKIE!\" he says, grinning. \"Cookie, cookie!\" Every time he says it, the finger bends to point at the next turn. Left at the church. Right at the mango tree. Straight past the sleeping dog.","You walk 12 blocks with your hand on his finger like a handrail. At the bakery, the finger holds the door open for you.","The old man is already inside, eating a cookie. Cookie, cookie. Point, point. Kuhikuhi."],"Point this way, then that way. \"Koo-hee-KOO-hee.\"","Kuhi means to point or gesture. Doubled, kuhikuhi is pointing over and over, giving directions.",null,"Old man's stretchy finger pointing directions"],["v264","v",264,"kākoʻo","kaah-KO-oh","to support, to back up","CAAAR! GO (gulp) OH!",["Uncle's old truck dies on the H-1 at rush hour, right in the middle lane. It will not start. Cars are honking for a mile.","Then something beautiful happens. A construction worker gets out of his car and pushes. A nurse gets out and pushes. A grandma in a muʻumuʻu. A football team off their bus. A guy in a gorilla suit. Thirty strangers get behind the truck, backing Uncle up.","They push together and yell \"CAAAAAR... GO...\" Somebody's voice catches in a little gulp. \"...OH!\" The truck rolls. \"CAAAAR! GO! OH!\" It rolls faster. They push it all the way down the off ramp and into a gas station.","Uncle cries. He hands out spam musubi to all thirty of them. That is support. You get behind someone and push."],"Put both hands out and push. \"Kaah-KO-oh!\"","Kākoʻo is also used for supporting a cause, a team or a person running for office. Mahalo for your kākoʻo means thanks for your support.",null,"Thirty strangers pushing a dead truck"],["v265","v",265,"hoʻoulu","ho-oh-OO-loo","to inspire; to make grow","HO! OH! OOH, LOU!",["Lou is 11 years old and the shortest kid on the basketball team. Four foot one. He cannot touch the net even standing on a chair.","The coach does not give up on him. Every morning she stands in front of Lou with a megaphone. \"HO! OH! OOH, LOU! You can do it! You are a giant inside!\" She plays loud music. She shows him videos of redwood trees growing.","Lou believes her. And he starts to grow. Two inches a week. Then six inches a week. By March he is six foot four. His pants are shorts. His shirts are belly shirts. He dunks on everybody.","The rest of the team begs the coach to yell at them too. She does. Now the whole team is growing. The gym ceiling has to be raised twice.","She inspired him. She made him grow. Both at once."],"Raise your hand from low to high. \"Ho-oh-OO-loo.\"","Ulu means to grow (#266). Hoʻoulu is making something grow, from a garden to a kid's courage.",null,"Coach with megaphone making a kid grow"],["v266","v",266,"ulu","OO-loo","to grow","OOOH, LOU!",["Remember Lou from hoʻoulu? It is summer and he is at the family reunion. Every aunty who walks in grabs his cheeks and screams \"OOOH, LOU! You GREW!\"","Here is the thing. He is still growing, right there, during the party. You can watch it happen. While the first aunty pinches his cheeks, he gets two inches taller. By the time the sixth aunty reaches him, she has to stand on a cooler.","\"OOOH, LOU!\" He grows through the tent. \"OOOH, LOU!\" His head is in the mango tree. By dessert the aunties are yelling up at him through a bullhorn, and he is picking mangoes off the top branch and handing them down.","At the end of the party the family has to drive him home lying down in the back of a flatbed truck, feet hanging off the end."],"Stretch up on your toes. \"OO-loo.\"","Ulu, to grow, has no ʻokina. ʻUlu, with the ʻokina, is breadfruit. Luckily, breadfruit trees ulu pretty fast.",null,"Lou growing through the reunion tent"],["v267","v",267,"kupu","KOO-poo","to sprout","COOP! OOO!",["You toss a handful of old seeds into the chicken coop and forget about it.","The next morning there is a rumbling under the coop. The chickens are nervous. One hen is standing on her tiptoes.","Then a sprout pushes up through the floor. A little green curl, right under the fattest hen. It keeps coming. It lifts the hen. It lifts the whole coop. The coop rises into the air on top of a giant green stalk. 20 feet. 40 feet. 60 feet. Chickens cluck out the windows.","The neighbors run outside and point. \"COOP! OOOOO!\"","By noon the coop is above the clouds and the chickens are laying eggs that fall into your yard like hail. All from one tiny sprout. Coop, ooo."],"Push one finger slowly up out of your fist like a sprout. \"KOO-poo.\"","Kupu, mohala, oʻo, pala, popopo. Sprout, bloom, mature, ripe, rot. A plant's whole life in the next five words.",null,"Sprout lifting chicken coop into sky"],["v268","v",268,"mohala","mo-HAH-lah","to bloom, to unfold","MO! HOLLA!",["At the botanical garden there is one flower bud that has refused to bloom for 12 years. It is shaped like a closed fist. The gardeners call it Mo.","Today the whole island shows up to cheer it on. They bring drums. They bring signs. They stand in a circle around it and scream \"MO! HOLLA! MO! HOLLA!\"","The bud shivers. Then it unfolds. One petal. Two petals. It keeps opening. The petals spread like an umbrella, then like a beach tent, then like a circus tent. It is 40 feet wide and hot pink. It smells so good that three tour buses pull over.","The crowd goes crazy. Someone sets up a snack stand underneath it. A band plays in its shade.","Mo bloomed. Mo unfolded. All it needed was a holla."],"Open your fist slowly, one finger at a time. \"Mo-HAH-lah.\"","A pua mohala is a flower in full bloom.",null,"Giant flower bud unfolding like a tent"],["v269","v",269,"oʻo","OH-oh","to be mature, ripe","OH! (gulp) OH!",["Your little brother is nine. Yesterday he ate a crayon and put a gecko down your shirt.","This morning you walk into the kitchen and he is sitting at the table in a suit and tie. He is reading the newspaper. He has a mustache. He is drinking black coffee and paying the electric bill.","You stare. \"OH!\" A catch in your throat. A gulp. \"OH!\"","He looks up over his reading glasses. \"Good morning. I made breakfast. Please rinse your plate.\" He folds his napkin into a perfect triangle. He talks about his retirement plan.","At school he politely corrects the teacher. At lunch he eats a salad. You follow him around all day going \"Oh! Oh!\"","He is mature. Like a mango that is finally full size, he is done growing. In one night."],"Gasp twice, with a little gulp between. \"OH-oh.\"","Oʻo is mature, full grown, like fruit ready to pick. Pala (#270) is the next step, ripe and soft. Different from ʻōʻō, the old digging stick.",null,"Nine year old brother suddenly an adult"],["v270","v",270,"pala","PAH-lah","to be ripe and soft","PAULA!",["There is a lady at the farmers market named Aunty Paula who tests every banana. She squeezes them.","She picks up a banana. It is brown with black spots. It is so ripe and soft that when she squeezes it, banana squirts out of both ends like toothpaste. It hits the guy at the next stand.","\"PAULA!\" the banana man yells.","She squeezes a mango. SPLAT. \"PAULA!\" A papaya. It collapses in her hand like a water balloon. \"PAULA!\" An avocado. It turns into guacamole on the spot.","She nods, very happy. \"Perfect. Soft. Ripe.\" She buys all of them. The banana man mops his table and yells after her as she walks away. \"PAULA!\"","When fruit is so ripe it squishes, it is pala."],"Squeeze an invisible banana. \"PAH-lah!\"","Oʻo (#269) is mature but still firm. Pala is ripe and soft. Popopo (#271) has gone too far.",null,"Aunty Paula squishing ripe bananas"],["v271","v",271,"popopo","po-PO-po","to rot","po... POP... po",["In August you forget a bag of mangoes in the trunk of the car. Then you leave on a trip for three weeks.","When you come back, the car is bulging. The trunk is humming. The back tires are flat.","You open it. Inside, the mangoes have rotted into a brown, bubbling soup. Big stink bubbles rise to the top and burst. \"po... POP... po.\" Each pop lets out a smell that makes your eyebrows curl. \"po POP po.\"","The mynah birds fly away screaming. The neighbors close their windows. A fly zooms in, takes one sniff, and flies back out holding its nose. The paint on the trunk lid peels off in long strips.","You slam the trunk. You put a sign on the car. FOR SALE. Inside you can still hear it. \"po... POP... po.\" That is rot."],"Pinch your nose and pop your lips three times. \"Po-PO-po.\"","Popopo is used for rotten fruit, rotten wood, even a rotten tooth. Pala (#270) is ripe and soft, popopo is way past that.",null,"Rotten mango soup bubbling in trunk"],["v272","v",272,"maloʻo","mah-LO-oh","to be dry","MA! LOW! (gulp) OH!",["It has not rained in 200 days. The grass is crunchy. The stream is a dusty path. The fish are walking across the dirt carrying tiny umbrellas.","You climb the ladder on the side of the water tank to check it. You knock. It sounds empty. You look inside. One sad raindrop is sitting at the bottom.","You yell down to the house \"MA! LOW!\" Then you catch your breath, a hard gulp. \"...OH!\" Ma, low, oh.","Everything is dry. The laundry dries in four seconds. The dog's water bowl is a dust bowl. Your lips are so dry that when you smile they crack like old paint. Even the cactus looks thirsty.","That night one single cloud floats over. Everyone runs outside holding up buckets. It does not rain. It just looks at you."],"Lick your dry lips and gulp. \"Mah-LO-oh.\"","Iʻa maloʻo is dried fish, a local favorite. Maloʻo is dry, pulu (#274) is wet.",null,"Empty water tank, fish with umbrellas"],["v273","v",273,"hoʻomaloʻo","ho-oh-mah-LO-oh","to dry something","HO! OH! MA! LOW! OH!",["Ma from maloʻo finally got rain. Too much rain. The cat, Mochi, got caught in it and is now soaked, skinny and dripping on the carpet, looking furious.","Ma grabs a hair dryer. Not a normal hair dryer. An industrial one, the kind used to dry airplanes. She cranks it to HIGH.","WHOOOOSH. Mochi lifts off the ground like a kite. You scream \"HO! OH! MA! LOW! OH!\" You mean put it on LOW. She cannot hear you over the roar.","Mochi floats around the living room, drying fast. Her fur puffs out. She gets bigger and fluffier until she looks like a giant dandelion. When Ma finally clicks it off, Mochi drifts slowly down onto the couch, perfectly dry and three times her normal size.","Ma dried the cat. That is hoʻomaloʻo."],"Blow on your hands like a hair dryer. \"Ho-oh-mah-LO-oh.\"","Maloʻo is to be dry. Hoʻomaloʻo is to make something dry, like dishes, laundry, or fish in the sun.",null,"Industrial hair dryer puffing up a cat"],["v274","v",274,"pulu","POO-loo","to be wet, soaked","POOL! OOH!",["It is your cousin's graduation party in the backyard. Everybody is dressed nice. Aunties in new muʻumuʻu. Uncles in pressed aloha shirts. A three layer cake on the table right next to the pool.","Then Uncle Bula, 380 pounds, climbs onto the roof of the house. Everybody looks up. He yells \"POOL!\" and jumps.","He does a cannonball. The pool empties in one second. A wave twelve feet tall rolls across the yard. Every single guest is soaked. The cake is soaked. The neighbor, who was just mowing his lawn, is soaked.","Uncle Bula stands up in the empty pool and yells \"OOH!\"","Forty people stand there dripping, hair flat, shoes squishing, cake floating in the grass. POOL. OOH. Everyone is pulu."],"Shake water off your hands. \"POO-loo.\"","Pulu pē means soaking wet, drenched. Pulu is also the soft fluff from the hāpuʻu tree fern, once used to stuff pillows.",null,"Uncle's cannonball soaking the whole party"],["v275","v",275,"hoʻopulu","ho-oh-POO-loo","to wet, to soak","HOSE! OH! POOL!",["Every summer the kids on your street have a water balloon war. This year the old lady on the corner decides to join. Nobody has ever seen her leave her porch.","She walks out holding a fire hose. A real one. It is hooked up to the hydrant. She turns the valve and yells \"HOSE! OH!\"","The first blast knocks three kids into a hedge. She soaks the ice cream truck. She soaks the mailman so hard h
