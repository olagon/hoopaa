giant cow in the middle goes \"peep peep.\"","The paniolo just tip their hats to it. Nobody is going to be the one to tell it."],"Say it in the tiniest chick voice you have. \"PEE-pee.\" Then say it normal.","Pipi came from English beef. Paniolo are Hawaiian cowboys.",null,"Huge cow peeping like a baby chick"],["n191","n",191,"hua","HOO-ah","fruit; egg; seed","WHO... AH?!",["You wake up and there is an egg in your backyard the size of a car. White, smooth, and a little warm. There was nothing there last night.","The whole neighborhood comes over. Everybody looks around at the sky, at each other. \"WHO... AH?\" Who laid this? The chickens all back away slowly.","At noon it starts to crack. Everyone ducks. The shell falls open. Inside there is no bird. There is one giant seed, as big as a beanbag.","The seed rolls out, sinks into the grass, and a tree shoots up out of the ground in 30 seconds, loaded with fruit. Mangoes, lychee, oranges, all on the same tree.","Everyone stands there holding fruit. Nobody knows who to thank. \"WHO... AH?\" The chickens take the credit."],"Look around confused with your hands out. \"HOO-ah?\"","Hua moa is a chicken egg. Hua can mean the egg, the fruit, or the seed, the whole cycle in one word.",null,"Car sized egg hatching a fruit tree"],["n192","n",192,"paʻakai","pah-ah-KAI","salt","PAH! (catch) AH... KAI!",["You are bodysurfing at the beach and you get caught under a big wave. You come up with a mouth full of ocean. You spit. \"PAH!\" You freeze with that catch in your throat, then gasp \"AH...\" and cough out \"KAI!\" which is Hawaiian for the sea, the thing that is currently in your mouth.","Your tongue is so salty it has turned white. You lick your arm. Salty. You lick your hair. Salty.","An aunty on the beach is scraping salt out of shallow pans by the shore, where the sea water dried in the sun. She hands you a crunchy pinch of it. You crunch it with a slice of raw fish.","It is the best thing you ever tasted. You spit the ocean out again, \"Pah, ah, kai,\" but now in a happy way."],"Spit out seawater, catch, then gasp. \"Pah,\" catch, \"ah-KAI.\"","One popular explanation splits paʻakai into paʻa (hard, solid) and kai (sea), so salt is hardened sea. Red ʻalaea salt is mixed with a red clay.",null,"Spitting out a mouthful of salty ocean"],["n193","n",193,"laiki","LAI-kee","rice","LIKE-ee! LIKE-ee!",["Your baby niece is 1 year old, and she has discovered rice. She is sitting in her high chair at the plate lunch place, with two scoops of rice in front of her. She grabs a fistful and shoves it in her mouth.","\"LIKE-EE!\"","She finishes both scoops. She points at your plate. You give her your rice. \"LIKE-EE!\" She points at the next table. The whole restaurant starts passing her their rice. \"LIKE-EE! LIKE-EE! LIKE-EE!\"","The cook brings out the giant rice pot, the one that holds 60 cups. She climbs out of her chair, into the pot, and eats her way to the bottom like a tiny bulldozer.","She pops her head out with rice on her eyebrows and one grain on her nose. \"Like-ee.\" Then she burps."],"Shovel invisible rice into your mouth. \"LAI-kee!\"","Laiki came from English rice, with the R turned into an L.",null,"Baby eating her way through a rice pot"],["n194","n",194,"palaoa","pah-lah-OH-ah","bread, flour","PULL-a... WHOA-ah!",["Grandma has been making sweet bread dough since 4 in the morning. She dumps a whole 50 pound sack of flour on the kitchen table, and the kitchen disappears in a white cloud. When it clears, Grandpa is white from head to toe, like a ghost.","She works the dough and hands you one end. \"Pull.\"","You pull. It stretches. You walk backwards. It keeps stretching. Out the kitchen, down the hall, out the door, down the driveway. \"PULL-a... WHOA-ah!\" It is 200 feet long now, a soft golden rope across the whole street. Cars stop to wait.","Finally Grandma yells \"Enough!\" and it snaps back like a rubber band. It pulls you all the way back into the kitchen and you land in the flour sack. She bakes it. It is the fluffiest bread on Oʻahu."],"Pull dough between your hands. \"Pah-lah-OH-ah.\"","Palaoa means both bread and flour. It also means sperm whale and whale ivory, as in the lei palaoa, a whale tooth pendant worn by chiefs.",null,"Stretching bread dough across the street"],["n195","n",195,"waiū","vai-OO","milk","WHY... OOOOOOH!",["Your cousin bets he can chug a whole gallon of milk in 20 seconds. The whole family gathers in the kitchen. He tips the jug up. Glug glug glug glug. Eleven seconds. Empty. Milk mustache all the way up to his eyebrows.","Then your uncle tells a really dumb joke.","Your cousin tries not to laugh. His cheeks puff up. His eyes water. Then it comes. Milk shoots out of both his nostrils in two white jets, 8 feet across the kitchen, and hits the refrigerator.","The whole family jumps back. \"WHY... OOOOOOOOH!\"","The cat walks in, sees milk all over the fridge, and thinks it is the best day of its life. It licks the fridge for an hour. Your cousin has to lie down. He smells like milk until Friday."],"Hold your nose like milk is coming out. \"Vai-OOOO.\" Hold the ū.","Wai is fresh water, and waiū is milk. Waiūpaka is butter.",null,"Milk shooting out of cousin's nose"],["n196","n",196,"kope","KO-peh","coffee","COPE, eh!",["It is 5 a.m. and your uncle has not had his coffee. He is not a person yet. He is a grumpy lump in a bathrobe. He walks into the wall. He tries to open the fridge with the TV remote. He says good morning to the dog in the wrong language.","He cannot cope.","He shuffles to the kitchen and fills a mug. Not a mug. A bucket. A whole mop bucket of hot black coffee from the farm in Kona. He lifts it with both hands and drinks.","His eyes pop open. His hair stands up. He starts vacuuming, doing push-ups, and fixing the roof at the same time. He mows the lawn in 4 minutes.","He looks at you, twitching, and gives you a thumbs up. \"COPE, EH!\""],"Hold a mug with two shaky hands. \"KO-peh.\"","Kope came from the English word coffee. Coffee grown in the Kona district of Hawaiʻi Island is world famous.",null,"Uncle drinking coffee from a mop bucket"],["n197","n",197,"wai","VAI","fresh water","WHY?",["Your little cousin is 4 and he asks \"WHY?\" about everything. Why is the sky blue. Why do dogs lick. Why is Uncle bald. He asks 900 times a day.","One day at the stream in the valley, something changes. He asks \"WHY?\" and SPLOOSH, a bucket of cold, clear stream water dumps on his head out of nowhere. He blinks. \"...Why?\" SPLOOSH.","Nobody is holding a bucket. It just happens. Every \"why\" comes with fresh cold water from the mountains. It is so clean he can drink it as it falls, and it tastes like rain.","By sunset he is soaked and shivering and very, very refreshed. He opens his mouth to ask one more question. He stops. He thinks about it. He just nods."],"Hold your palms up and shrug. \"VAI?\" Then shake off the water.","Wai is fresh water and kai is salt water. Waiwai, doubled, means wealth. One popular explanation is that fresh water was the greatest riches.",null,"Water dumping on a kid who asks why"],["n198","n",198,"ʻawa","AH-vah","kava","Ahhh... VAHHH.",["You are at a gathering in a friend's backyard, and his uncle offers you a drink of ʻawa. It is served in a coconut shell cup. It is brown and cloudy, like muddy water, and it smells like a root dug up out of the ground, because it is one.","You drink it. It tastes earthy and peppery. You say thank you.","Then your tongue goes numb. Totally numb, like after the dentist. Your lips tingle. You try to say \"That was great\" and only two sounds come out.","\"Ahhhh... vahhhh.\"","You try again. \"Ahhhh... vahhh.\" The uncle laughs a big warm laugh and says you just said its name perfectly. You sit back in your chair, calm and relaxed, and listen to the ʻukulele under the stars, saying \"ahhh, vahhh\" every time someone asks you anything."],"Stick out a numb tongue. \"AH-vah.\" Tiny catch before the ah.","ʻAwa is often served in a coconut shell cup. Awa without the ʻokina is the milkfish.",null,"Numb tongue after a coconut cup of ʻawa"],["n199","n",199,"kō","KOH","sugarcane","Ready, set, KOHHHHH! (GO!)",["Your neighbor has a patch of sugarcane taller than the house. He cuts you a stalk. It is 12 feet long, with rings on it like bamboo. He peels a piece and tells you to chew it.","You bite in. Sweet juice floods your mouth. So much sugar. You chew harder. You feel it go to your legs. Your knees start bouncing. Your hair stands up. Your ears are ringing.","The neighbor counts down like a rocket launch. \"Three, two, one...\"","\"KOHHHHHHHHHHH!\"","You blast off down the street. You run around the block 11 times in four minutes. You pass a moped. You pass a bus. Dogs give up chasing you.","You finally flop in his yard, still holding the stalk, chewing. \"Koh.\" Then you ask for another piece."],"Crouch like a runner at the starting line. \"KOHHHH!\" Hold the ō long.","Kōpaʻa, sugar, is built from kō, sugarcane, plus paʻa, hard or solid.",null,"Sugarcane sugar rush blasting down the street"],["n200","n",200,"kōpaʻa","koh-PAH-ah","sugar","GOOO, PA! (catch) AH!",["Remember Pa with the pale forehead and the loud shirt? Pa has been told to stop eating sugar. Today Ma is out, and he finds the sugar bag. The 25 pound one.","He eats one spoonful. Then ten. Then he just pours it straight into his mouth like a waterfall of white crystals.","His eyes spin. His mustache curls. He kicks open the front door and starts running laps around the neighborhood. The kids line the street and cheer like it is a marathon. \"GOOOO, PA!\"","On lap 30 he sees Ma's car turning the corner. He stops dead. That catch in his throat. \"...AH!\"","He runs back inside, hides the empty sugar bag in the rice pot, and sits on the couch pretending to read. He is still vibrating. The couch is vibrating."],"Pump your fists like a cheering crowd. \"Koh-PAH,\" catch, \"ah!\"","Kōpaʻa is kō (sugarcane) plus paʻa (hard), so sugar is hardened cane. Do not mix it up with kopa, which is soap.",null,"Pa sugar-rushing laps around the block"],["n201","n",201,"meli","MEH-lee","honey; bee","Melly!",["You open a jar of honey at the farmers market and a bee the size of a golden retriever climbs out. Her name is Melly. She is sticky from her antennas to her stinger, and she loves you right away.","She follows you to the car. She rides in the back seat with her head out the window, dripping honey all the way down the H-1. Everything she touches turns gold and sticky. The steering wheel. Your slippahs. Your cousin's hair.","At every red light you yell \"MELLY! NO!\" and she buzzes happy and leaves another puddle on the dashboard. By the time you get home there are 6 pounds of honey in your car and 40 regular bees following it like a parade.","Melly. Meli. Honey and bee, one word, one sticky mess."],"Lick imaginary honey off your finger. \"MEH-lee.\"","Nalo meli means honeybee.",null,"Giant bee Melly dripping honey in your car"],["n202","n",202,"limu","LEE-moo","seaweed","Lee, MOO!",["There is a cow on the North Shore named Lee, and Lee has given up grass. Lee only eats seaweed. Every morning at low tide she walks down to the reef, sticks her whole face in a tide pool and comes up with a green and brown slimy beard three feet long.","The farmer stands on the sand with a bucket of good hay, begging her to come home and act like a normal cow. \"LEE! MOO!\"","Lee turns around with seaweed hanging off both ears and answers \"Mooooo,\" and a little crab falls out of her mouth. Tourists take pictures. Lee chews. Green slime drips off her chin onto her hooves, and she looks like the happiest cow in the state.","Lee, moo. Limu."],"Pull invisible slime off your chin. \"LEE-moo.\"","Limu covers lots of plants that grow in water, even moss. Limu kohu is a favorite red seaweed for poke.",null,"Cow named Lee with a seaweed beard"],["n203","n",203,"ʻopihi","oh-PEE-hee","limpet","Oh! Pee-hee-hee!",["You are on the wet rocks at low tide with a butter knife, trying to pop an ʻopihi off. It is a little cone shaped shell stuck down harder than superglue. You push. Nothing. You pry. Nothing. You sit on the knife with your whole body. It does not move one millimeter.","Then you notice something. When you poke the edge of the shell, it wiggles. You poke again. It lets out a tiny gasp and then a giggle. \"(gasp) Oh! PEE-HEE-HEE!\"","It is ticklish. So you tickle it for ten straight minutes. \"Oh! Pee-hee! Oh! Pee-hee-hee!\" It laughs so hard it loses its grip and plops into your bucket, still giggling.","That little gasp at the front is the ʻokina. And keep one eye on the ocean the whole time, because the waves out there do not joke around."],"Wiggle a finger like you're tickling a shell. \"oh-PEE-hee.\"","ʻOpihi is a prized pūpū at a lūʻau, often eaten raw with a little salt.",null,"Ticklish limpet giggling off the rock"],["n204","n",204,"heʻe","HEH-eh","octopus","Hey... eh!",["You are waiting at the bus stop when an octopus the size of a beanbag chair slides up and sits next to you on the bench. It is very friendly. It waves one arm. \"Hey...\" Then it hiccups. \"...eh!\"","It waves a second arm. \"Hey... eh!\" Then a third. By the time the bus comes it is waving all eight arms at everybody on the sidewalk, \"HEY... eh! HEY... eh!\", with a hiccup in the middle of every single one.","The bus door opens. The octopus squeezes through a gap the size of a coin and takes over the whole back row. Every stop, it waves at the new people getting on. \"Hey... eh!\" An aunty waves back with her umbrella.","That little hiccup in the middle is the ʻokina. Heʻe."],"Wave with both hands and hiccup in the middle. \"HEH-eh.\"","Heʻe also means to slide or to surf. Heʻe nalu means surfing, sliding on a wave.",null,"Octopus waving eight arms at the bus stop"],["n205","n",205,"ʻinamona","ee-nah-MO-nah","roasted kukui nut relish","Eee! Nah, Mona!",["Aunty Mona runs the poke counter and she has one rule. Everything gets ʻinamona. That is the crunchy brown relish made from roasted kukui nuts pounded with salt. She keeps a bucket of it the size of a trash can behind the counter, and she sprinkles it with a garden shovel.","ʻAhi poke? ʻInamona. Rice? ʻInamona. Your cousin's birthday cake? She is already reaching for the shovel. The whole line screams \"EEE! NAH, MONA!\"","Too late. The cake is covered. Your cousin takes one bite, freezes, and slowly says \"...Mo', Mona.\" Now everybody wants it on everything. A kid puts it on his shave ice. The line goes out the door and around the block.","Eee, nah, Mona. ʻInamona."],"Shake an invisible shovel over your plate. \"ee-nah-MO-nah.\"","ʻInamona, limu and salt are the classic seasonings for old style poke.",null,"Aunty Mona shoveling relish on a birthday cake"],["n206","n",206,"ʻōpae","oh-PAI","shrimp","Ohhhh... PIE!",["It is the pie contest at the county fair. The judge is a very serious man in a bow tie. He lifts the crust of the last pie, and three thousand tiny shrimp come boiling out like popcorn.","They are everywhere. On the table, in his bow tie, in the lemonade. Little pink and see-through shrimp doing backflips across the tablecloth.","The judge gulps. That little catch is the ʻokina. Then he opens his mouth slow. \"Ohhhhhhhh...\" It takes him five full seconds to finish. \"...PIE!\"","The whole crowd joins in. \"Ohhhh... PIE!\" A shrimp jumps onto his tongue. He chews. He thinks. He gives it first place.","Hold that ō long like the judge did. ʻŌpae."],"Stare at a pie in shock. \"Ohhh... PAI!\"","ʻŌpae ʻula are tiny red shrimp that live in brackish ponds near the shore.",null,"Shrimp exploding out of a fair pie"],["n207","n",207,"pāpaʻi","paah-PAH-ee","crab","Paaa... Pa... EEE!",["You are at the beach with Papa. Papa is asleep in his beach chair with his mouth open and his toes in the sand. Out of a hole next to him walks a crab the size of a hubcap.","It walks sideways right up his leg, across his belly, and parks on his chest. Its two eyes pop up on little sticks and stare at his face from one inch away.","You try to warn him, but you are so scared it comes out in pieces. \"PAAAA... PA... (gulp) EEE!\"","Papa opens his eyes. He is nose to nose with the crab. The crab clicks its claws. Papa goes \"EEE!\" The crab goes click. They both panic. The crab runs off sideways with his slippah, and Papa runs off sideways too, because now he thinks that is how you run.","Paaa, pa, eee. Long ā, then the gulp before the ee."],"Point at a crab in terror. \"Paah-PAH-ee!\"","ʻAʻama is the black rock crab you see running along the shoreline rocks.",null,"Hubcap crab staring at sleeping Papa"],["n208","n",208,"ula","OO-lah","lobster","Oooh... LA!",["A lobster the size of a canoe crawls out of the water at Waikīkī. She has a tiny beret on her head and a silk scarf around her neck, and she walks down the sidewalk like it's a fashion show.","She stops. She poses. She lifts one giant claw. The whole crowd goes \"OOOH... LA!\" She lifts the other claw. \"OOOH... LA!\" She spins around, and her long feelers whip three sun hats off three tourists. \"OOH-LA!\"","At the end of the sidewalk she climbs up the lifeguard stand, blows a kiss with her claw, and belly flops back into the ocean with a splash that soaks the whole first row. People clap for ten minutes.","Ooh, la. Ula. The lobster."],"Strike a pose with lobster claws. \"OO-lah.\"","Don't mix it up with ʻula, with an ʻokina, which means red. That is the color a lobster turns when you cook it.",null,"Fashion lobster in a beret on Waikīkī"],["n209","n",209,"ʻahi","AH-hee","yellowfin tuna","(gulp) AH! HEE!",["You are fishing off the Waiʻanae coast. Your line goes tight and something pulls so hard the whole boat turns around. You hold on. It pulls you right over the side. Now you are water skiing on your slippahs behind a 200 pound yellowfin tuna.","It is fast. It zigzags. Salt water keeps splashing in your mouth, so every scream starts with a gulp. \"(gulp) AH! HEE!\" \"(gulp) AH! HEEEE!\"","After five miles the tuna slows down, pokes its long yellow fin out of the water, and looks back at you like \"You done?\" Then it takes off again. \"(gulp) AH! HEE!\"","That gulp at the start of every scream is the ʻokina. ʻAhi."],"Jerk back on a pretend fishing rod. \"(tiny catch) AH-hee!\"","Keep the ʻokina. ʻAhi with the ʻokina is the tuna. Ahi without it means fire.",null,"Water skiing behind a giant yellowfin tuna"],["n210","n",210,"ʻanae","ah-NAI","mullet (full grown)","Ah... NEIGH!",["In the old fishpond there is one giant gray mullet, as long as your arm and fat like a football. It has the haircut to match. Short in front. Long in the back. A real mullet. It is very proud of that hair.","Every morning it jumps out of the water, flips its hair back, and makes a sound like a horse. First a little hitch in the throat, then \"Ah... NEIGH!\"","The baby mullets swim in circles under it. They don't have hair yet. They are too young. Only the full grown fish gets the haircut, and only the full grown fish gets to neigh. The little ones practice anyway. \"Ah... neigh,\" in tiny squeaky voices.","Ah, neigh. ʻAnae. The big grown-up mullet."],"Flip your imaginary long hair back. \"ah-NAI!\"","ʻAmaʻama is the young mullet. ʻAnae is the full grown one.",null,"Mullet fish with a mullet haircut neighing"],["n211","n",211,"laulau","lau-LAU","wrapped bundle of food cooked in leaves","Loud, LOUD!",["Aunty is making laulau for a graduation party of 300 people, and you are the practice laulau. She lays ti leaves on the table and says \"Lie down.\" You lie down. She puts a lūʻau leaf on your chest, a chunk of pork belly in your hand and a piece of butterfish on your forehead.","Then she wraps you. You complain. \"Too tight!\" She says \"Too LOUD. Too LOUD,\" and wraps another leaf. You complain again. Another leaf. \"LOUD, LOUD.\"","After 20 complaints you are a green bundle the size of a sleeping bag, tied up with a ti leaf string, and the only thing sticking out is your nose. Two uncles carry you to the steamer. You smell amazing.","Loud, loud. Laulau."],"Hug yourself tight like you're wrapped. \"lau-LAU.\"","Lau by itself means leaf.",null,"You wrapped up as a giant laulau"],["n212","n",212,"pūpū","poo-POO","appetizer, snack; shell","Pooh-POOH!",["Uncle Rodney shows up at the party and looks at the pūpū table. Shoyu chicken wings, poke, fried wontons, edamame. He waves his hand. \"Pooh-POOH. That's just snacks. I'm saving room for the real food.\"","Then he eats one wing. Just one. Then 60 more. Then the whole tray of wontons. Every time somebody walks by he waves them off again, \"Pooh-pooh, just pūpū,\" with sauce on his face and a toothpick behind each ear.","When the main food finally comes out, Uncle is lying on the grass holding his stomach. He looks at the kālua pig and the lomi salmon and whispers \"...pooh-pooh.\"","Hold both ū's long, like his sad little whisper. Pūpū."],"Wave off a plate like it's nothing. \"Poo-POO.\"","Pūpū also means shell. A lei pūpū is a shell lei, like the tiny Niʻihau shell lei.",null,"Uncle pooh-poohing then eating the whole pūpū table"],["n213","n",213,"kūlolo","koo-LO-lo","taro coconut pudding","Cooool. Low. Low.",["Your uncle drives a shiny lowrider truck that can bounce up and down. Today he is delivering kūlolo to a party. Kūlolo is dense. Taro and coconut cooked together until it's sticky and brown and heavy like a brick of fudge. He has 400 pounds of it in the back.","He pulls up to the party and the whole truck sinks. The tires squish flat. The bumper scrapes the road. Sparks. Everybody comes out to look.","Uncle leans out the window with his sunglasses on, nods slow and says \"Cooool. Low. Low.\" He hits the switch to bounce. The truck will not bounce. It just groans.","It takes 12 cousins to carry the trays inside. Cool, low, low. Kūlolo. Hold that first ū long and cool."],"Nod slow like you're too cool. \"Kooo-LO-lo.\"","Kūlolo is made from grated kalo and coconut milk, baked or steamed for hours.",null,"Lowrider truck sagging under 400 pounds of kūlolo"],["n214","n",214,"haupia","how-PEE-ah","coconut pudding","HOW be ya?",["At the lūʻau there is a square of haupia on your plate. White, smooth, cold, cut perfect. You poke it with your fork and it jiggles. Then it jiggles back. Then it opens two little eyes.","\"HOW be ya?\" it says, wobbling.","You say fine. It says \"How be ya?\" again, wobbling harder, like it didn't hear you. Now the whole tray of haupia on the buffet table is wobbling and asking \"HOW be ya? HOW be ya?\" in tiny coconut voices.","Grandma walks over and eats three of them in one bite. The rest go quiet. You look at yours. It looks at you. You eat it. It's so good you feel a little bad.","How be ya. Haupia."],"Wobble your head like jello. \"how-PEE-ah.\"","Haupia was first thickened with pia, Polynesian arrowroot. Today most people use cornstarch.",null,"Wobbly haupia square asking \"How be ya?\""],["n215","n",215,"kanakē","kah-nah-KEH","candy","Can a... KAAAY?",["You are six years old in the checkout line, and there is a wall of candy right at eye level. You grab the biggest chocolate bar. You look up at your dad with the biggest eyes in history.","\"Can a...? 'Kay?\" He says no. \"Can a... KAAAAY?\" He says no. You keep going. The KAAAY gets longer every time, until one \"Kaaaaaaaaaaay\" lasts so long the people behind you start buying candy just to make it stop.","The cashier hands you a free lollipop. The man behind you buys you gum. A lady buys you a whole bag of gummy bears. You walk out of there with more candy than the store. Dad has no idea what just happened.","Can a... KAAAY? Kanakē. Stretch that last ē like a begging kid."],"Clasp your hands and beg. \"kah-nah-KEHHH?\"","Kanakē comes from the English word candy. Hawaiian has no d, so the sounds shifted.",null,"Kid begging for candy, \"Can a... KAAAY?\""],["n216","n",216,"ʻaikalima","ai-kah-LEE-mah","ice cream","Ice... cream... ah (with a frozen tongue)",["You order the biggest ice cream in the shop. Twelve scoops, taller than you. You eat six scoops in two minutes. Your brain freezes. Then your lips freeze. Then your tongue turns into a popsicle.","You want a thirteenth scoop. You open your mouth to say \"ice cream,\" but your frozen tongue can't make the sounds. First a little catch in your throat, then it comes out \"AI... kah... LEE... mah.\" The worker stares. You point at the tub and try again. \"AI-kah-LEE-mah!\" Your cheeks are so cold they crackle.","She gives you the scoop. It worked. Now everybody in line is ordering the frozen tongue way. \"Ai-kah-LEE-mah, please.\" The owner changes the menu board.","Frozen tongue ice cream. ʻAikalima."],"Stick your tongue out like it's frozen. \"ai-kah-LEE-mah.\"","ʻAikalima is borrowed from the English words ice cream, reshaped to fit Hawaiian sounds.",null,"Frozen tongue ordering a thirteenth scoop"],["n217","n",217,"waina","VAI-nah","wine; grapes","VINE! Ahhh!",["You leave your window open one night. In the morning there is a grapevine coming through it. A thick green vine, 90 feet long, curling across your floor, up your bed and around your ankle. It is heavy with purple grapes the size of golf balls.","You yell \"VINE! AHHH!\" It squeezes a little. A grape falls into your open mouth. It is sweet. You yell again. \"VINE! AHHH!\" Another grape. You start to see how this works.","By lunch you are still in bed, wrapped up in vine, yelling \"VINE, AH!\" every 30 seconds and eating grapes. Your mom walks in, looks at you, and closes the door.","Vine, ah. Waina. The w can sound like a v here."],"Pop a grape in your mouth. \"VAI-nah.\"","Waina means both the grapes and the wine made from them. It comes from the English word wine.",null,"Grapevine feeding you grapes in bed"],["n218","n",218,"ʻalani","ah-LAH-nee","orange","Ah! LONNIE!",["Uncle Lonnie has one talent. He can peel an orange in a single long spiral without breaking the peel. At the family party the kids line up and bring him the biggest orange they can find, one the size of a basketball.","He starts at the top. His thumb goes around and around. The peel comes off in one orange ribbon. Ten feet, twenty feet, thirty feet, out the door and down the driveway. The neighbors come outside. A car stops to watch.","When the last inch comes off in one piece, the whole yard gasps and cheers. \"(gasp) AH! LONNIE!\"","He bows. He hands out slices. There is juice running down every chin in the yard.","Ah, Lonnie. ʻAlani. The little catch at the front is that gasp."],"Gasp, then clap. \"ah-LAH-nee!\"","ʻAlani comes from the English word orange. Wai ʻalani is orange juice.",null,"Orange peel ribbon running down the driveway"],["n219","n",219,"ʻāpala","aah-PAH-lah","apple","Aaaah... PAL, ah!",["You go to the dentist. He says \"Open wide, pal. Say AAAAH.\" You say \"Aaaaaaah.\" You hold it. You hold it longer. That long ā is important.","While your mouth is wide open, he reaches over and pops a whole red apple in there, like the roast pig on a fancy platter. \"PAL, ah,\" he says, \"that's how wide I need you.\"","Now you are stuck in the chair with an apple in your mouth and a little paper bib. He goes to lunch. You sit there for an hour. You get bored. You eat the apple from the inside out. When he comes back the apple is gone and your teeth are the cleanest he has ever seen.","Aaah... pal, ah. ʻĀpala."],"Open wide and hold it. \"Aaaah-PAH-lah.\"","The mountain apple, the pink fruit that grows in Hawaiʻi valleys, is ʻōhiʻa ʻai.",null,"Dentist popping an apple in your mouth"],["n220","n",220,"lemi","LEH-mee","lemon","LEMME!",["Twelve cousins are standing around one lemon on the picnic table. It is the size of a watermelon and it is the only lemon at the party. Everybody wants to squeeze it into their drink.","\"LEMME!\" \"No, LEMME!\" \"LEMME, LEMME!\" Twelve hands grab it at once. They all squeeze together.","The lemon explodes. A wave of sour juice shoots across the yard. It hits Aunty in the eye. It hits the dog. It fills the cooler. Every cousin is soaked, puckered and blinking, twelve little sour faces with their lips sucked all the way in.","Only one person says anything. From under the table, dripping, Grandpa whispers \"...lemme next time.\"","Lemme. Lemi. The lemon."],"Reach out and grab. \"LEH-mee!\"","Lemi comes from the English word lemon.",null,"Twelve cousins squeezing one giant lemon"],["n221","n",221,"kāloke","kaah-LO-keh","carrot","CAAAR! LOW-key!",["You buy a used car from a lot at the edge of town. It is not really a car. It is a giant carrot, 14 feet long, bright orange, with four wheels bolted on and leafy green tops sticking up like antennas.","Your cousin rides with you wearing sunglasses and a hat pulled down low. He does not want anybody to see him. \"It is just a CAAAR,\" he whispers. \"Keep it LOW-KEY.\"","It is not low-key. At the first red light a horse leans in the window and bites off a piece of the hood. Two rabbits chase you down the highway. A kid on the sidewalk points and yells \"CAAAR! LOW-KEY!\" and the whole bus stop laughs.","By the time you park, half the carrot is gone and there is a trail of orange crumbs behind you.","Caaar, low-key. Kāloke. Hold that ā long like a car horn."],"Crunch a pretend carrot, loud. \"Kaah-LO-keh.\" Hold the kaah like a car horn.","Kāloke comes from the English word carrot.",null,"Giant carrot car that is not low-key"],["n222","n",222,"ʻakaʻakai","ah-kah-ah-KAI","onion","Ah... ka... ah... CRY!",["You have to chop one onion for the family stew. It is the size of a bowling ball. The first cut, your eyes sting. The fifth cut, your nose runs. By the tenth cut you are sobbing so hard you hiccup between every sound.","\"Ah... (hic) ka... (hic) ah... CRY!\"","The dog walks in and starts crying. The neighbor walks past the window and starts crying. Your whole family comes in to see what's wrong, and they all start sobbing and hiccuping too. \"Ah-ka-ah-CRY!\" Fifteen people crying over one cutting board.","The stew comes out great. A little salty from the tears.","Those hiccups are the two ʻokina. ʻAkaʻakai."],"Wipe your eyes and hiccup. \"ah-kah-ah-KAI.\"","Hawaiʻi's famous sweet onions grow upcountry in Kula on Maui.",null,"Whole family sobbing over a giant onion"],["n223","n",223,"ʻōlena","oh-LEH-nah","turmeric","Ohhh, LENA!",["Your golden retriever Lena sneaks into the kitchen while Mom is grating fresh ʻōlena for tea. The bowl of bright orange turmeric falls off the counter. SPLAT. Lena rolls in it. When she stands up, she is not golden anymore. She is school bus yellow.","She is so happy about it. She runs through the house wagging, leaving yellow paw prints on the white couch, the white rug and the white wall. You chase her down the hall screaming \"OHHHH, LENA!\"","Mom washes her three times. Still yellow. Your hands are yellow from grabbing her. Lena stays yellow for two weeks and glows in every family photo.","Ohhh, Lena. ʻŌlena. Hold that long ō like you mean it."],"Throw your hands up at the mess. \"Ohhh-LEH-nah!\"","ʻŌlena is a canoe plant brought by early voyagers, used for yellow dye and for medicine.",null,"Yellow dog Lena leaving paw prints on the couch"],["n224","n",224,"ʻāina","AAH-ee-nah","land","Aaah... eat? Nah.",["You show up at Tūtū's house on a Saturday, starving. \"Tūtū, can I eat?\" She hands you a shovel. \"Eat? Nah. First we plant.\"","So you plant. Kalo in the wet corner. ʻUala along the fence. A banana stump by the water tank. Every weekend for months you dig, you weed, you haul water. You get blisters. You ask again. \"Now can I eat?\" \"Nah. Not yet.\"","Then one morning the ground gives it all back. Bananas hanging heavy. Sweet potatoes as long as your forearm. Kalo ready to cook. Tūtū makes lunch, you take the first warm bite, and you let out the longest sigh of your life. \"Aaaaah.\"","That long sigh, then \"eat? nah.\" Aaah, eat, nah. ʻĀina. The land feeds you when you take care of it first."],"Put your palm flat on the ground and breathe out. \"Aaah-ee-nah.\"","Many teachers explain ʻāina as \"that which feeds,\" from ʻai, to eat. Aloha ʻāina means love for the land.",null,"Tūtū handing you a shovel instead of lunch"],["n225","n",225,"honua","ho-NOO-ah","earth, world","Ho! NEW, ah!",["A small green alien lands his spaceship in the Ala Moana parking lot. It is his first time on Earth, and everything amazes him.","He sees a rubber slippah. \"HO! NEW, ah!\" He sees a spam musubi. \"HO! NEW, AH!\" He sees a pigeon, a shopping cart, a lady with 40 shopping bags. \"HO! NEW AH!\" He takes pictures of all of it with his three eyes.","He buys a shave ice and gets rainbow syrup all down his antennas, and he decides this whole planet is the best thing he has ever seen. When he flies home he takes a bag of dirt, a coconut and one slippah. His friends back home don't believe a word.","Ho, new, ah. Honua. The whole world, brand new to him."],"Spread your arms like you're holding a globe. \"ho-NOO-ah.\"","Mālama honua means care for the earth. It was the name of Hōkūleʻa's voyage around the world.",null,"Alien amazed by everything at Ala Moana"],["n226","n",226,"lani","LAH-nee","sky, heaven","My LAWN! Eee!",["You are mowing the front lawn on a hot Saturday. The grass is thick and green. You get to the last strip, the mower jerks, and the whole lawn peels up off the ground like a giant green carpet.","It floats. It rises past the fence, past the roof, past the power lines. You grab the edge and now you are going up too. You yell down to your dad. \"My LAWN! EEEE!\"","Up and up, past the birds, through the clouds, into the wide blue sky. You lie back on the grass and look around. It's quiet up here. Somebody's kite drifts past. A plane waves its wings. Your lawn floats over the whole island like a magic carpet, and you never want to come down.","Lawn, eee. Lani. The sky."],"Point straight up. \"LAH-nee.\"","Lani shows up in lots of names, like Leilani, heavenly lei. Don't confuse it with ʻalani, the orange.",null,"Your lawn floating up into the sky"],["n227","n",227,"lā","LAAH","sun; day","LAAAAAH!",["Every morning the sun comes up over Diamond Head and starts to sing. One note. \"LAAAAAAAAAAH.\" It holds it. It holds it through breakfast. It holds it through school. You can hear it all day long.","The sun never takes a breath. That's its job. As long as it's singing, it's day. Surfers ride waves to it. Aunties hang laundry to it. Chickens dance to it in the yard.","Around 7 o'clock the sun gets tired. The note starts to wobble. It sinks lower and lower toward the ocean, and the \"LAAAAH\" gets quieter and quieter until the sun dips into the water with a little fizz and goes silent. Night.","Next morning, same note. \"LAAAAH.\" Lā. The sun, and the day it sings."],"Lift your arms and sing one long note. \"LAAAAH.\"","Lā also means day. Hauʻoli lā hānau means happy birthday.",null,"The sun singing one long note all day"],["n228","n",228,"mahina","mah-HEE-nah","moon; month","MA! HYENA!",["Every full moon a hyena shows up on your roof. Nobody knows where it comes from. It stands on the peak of the roof, looks up at the big round moon, and laughs like crazy. \"HEE-HEE-HEE-HAAA!\"","You run into your mom's room. \"MA! HYENA!\" She pulls the pillow over her head. \"It's the moon again. Go back to sleep.\"","It happens every month, like clockwork. The moon gets fat and round, the hyena appears, you yell \"MA! HYENA!\" Then the moon shrinks back to a skinny sliver and the hyena is gone for weeks. You start marking it on the calendar. Pretty soon you count your whole year in hyenas.","Ma, hyena. Mahina. Moon, and month, same word."],"Look up at the ceiling and howl. \"mah-HEE-nah.\"","Hawaiians named every night of the moon's cycle. Māhealani is one of the full moon nights.",null,"Hyena laughing at the full moon on your roof"],["n229","n",229,"hōkū","hoh-KOO","star","Hooo... COOO.",["You are lying on the grass at night counting stars. One of them starts to wobble. Then it falls. It lands in your yard with a soft thump. It is about the size of a microwave, glowing gold and warm like fresh bread.","It is also cooing. Like a pigeon. \"Hooo... COOOO.\"","You pick it up. It snuggles under your arm. \"Hooo... COOO.\" It's shy. Your whole yard is lit up gold. The neighbor's cat comes over to stare. You feed it a little rice, which is probably wrong, but it eats it.","At midnight it floats up out of your arms, gives one last \"Hooo-COOO,\" and zooms back to its place in the sky. Now every time you look up, one star is cooing at you.","Both vowels are long. Hōkū."],"Coo softly at the ceiling. \"Hohh-KOOO.\"","The voyaging canoe Hōkūleʻa is named for a star, Arcturus. The name means star of gladness.",null,"Fallen star cooing like a pigeon"],["n230","n",230,"ao","OW","cloud; daylight; world","OW!",["It is a perfect beach day until a cloud drops out of the sky. Not rain. The actual cloud. It comes down low and slow and bonks you right on the head.","\"OW!\"","Clouds are supposed to be soft. This one is not. This one is solid, like a 50 pound bag of rice. It floats back up and comes down again. \"OW!\" It bonks your uncle. \"OW!\" It bonks a surfer, a lifeguard and the guy selling shave ice. \"OW! OW! OW!\" The whole beach is rubbing their heads.","Finally it floats away. The sun comes out bright. Daylight everywhere. Everybody goes back to swimming, still going \"ow\" under their breath.","Ow. Ao. The cloud, the daylight after it, all of it."],"Rub the top of your head. \"OW.\"","Ao and pō are a pair. Ao is daylight and pō is night. Ao can also mean the world.",null,"Hard cloud bonking beachgoers on the head"],["n231","n",231,"ua","OO-ah","rain","Oooh! AHHH!",["It has not rained for 40 days. The grass is brown. The dogs are grumpy. The whole neighborhood is sitting outside staring at the sky.","Then one fat raindrop falls. It lands on a little boy's nose. Everybody gasps like it's a fireworks show. \"OOOOH!\"","Then another drop. \"AAAAH!\"","Then the sky opens up and it pours. Buckets. Sheets. People stand in the street with their arms out and faces up, going \"OOOH! AHHH!\" like it's New Year's Eve and every raindrop is a firework. An aunty opens her umbrella, then throws it away. Uncle dances in the gutter in his slippahs. The dogs roll in the mud.","Ooh, ah. Ua. The rain."],"Look up and hold your palms out. \"OO-ah.\"","Hawaiian has hundreds of names for different rains. Kanilehua is a famous rain of Hilo.",null,"Neighborhood oohing at raindrops like fireworks"],["n232","n",232,"makani","mah-KAH-nee","wind","Ma, CAN he?",["It is the windiest day of the year at the beach. Fifty mile trade winds. Your little brother weighs 40 pounds and he wants to fly the big kite. You look over at Ma. \"Ma, CAN he?\"","Ma says \"Sure, just hold on tight.\"","He grabs the string. The wind grabs the kite. The kite grabs him. Up he goes like a flag on a pole, feet kicking, cheeks flapping, laughing his head off. You grab his ankle and walk him down the beach like a balloon at a parade. His slippahs fall off one at a time.","Ma jumps up. \"WHO SAID HE CAN?\" You yell back over the wind. \"Ma, CAN HE? You SAID!\"","Ma, can he. Makani. The wind."],"Hold your hair down against the wind. \"mah-KAH-nee.\"","Many places in Hawaiʻi have their own named winds. A Kona wind blows from the south and brings sticky weather.",null,"Little brother flying like a kite"],["n233","n",233,"mauna","MOW-nah","mountain","MOW? Nah.",["Dad hands you a lawn mower and points out the window. Not at the yard. At the mountain. Thirteen thousand feet of mountain.","\"Go mow that.\"","You look at the mower. You look at the mountain. There is snow on top. There are clouds halfway up. There are rocks the size of trucks. \"MOW? NAH.\"","Dad does not accept nah. So you start. Mow at the bottom. Mow up the side. By the end of week one your legs are huge. By week three you are above the clouds and a goat is following you. At the very top, freezing, you look down at the whole island and whisper one more time. \"Mow? ...Nah.\"","Mow, nah. Mauna. The mountain."],"Shake your head at a mountain. \"MOW-nah.\"","Mauna Loa means long mountain. Mauna Kea is the tallest mountain in Hawaiʻi.",null,"Pushing a lawn mower up a snowy mountain"],["n234","n",234,"kuahiwi","koo-ah-HEE-vee","mountain, high hill; mountain country","Koo... ah... HEAVY!",["Aunty Pua wants her piano moved. Not to the next room. To her sister's house, on the other side of the mountains. She does not trust the moving company. So it's you.","They strap the piano on your back. You hike up the ridge trail, one peak, then another, then another, a whole long line of peaks like the spikes on a dragon's back. Every step you groan the same thing.","\"Koo... ah... HEAVY!\"","At the top of each peak you stop and rest, and a hiker plays a song on the piano on your back. Then you keep going. \"Koo... ah... HEAVY!\" Twelve peaks later you set it down at her sister's door. Her sister says \"Oh, I don't play.\"","Koo, ah, heavy. Kuahiwi. The high mountains, peak after peak."],"Hunch over like you're carrying a piano. \"koo-ah-HEE-vee.\"","Kua by itself means back, the part of you carrying that piano.",null,"Hauling a piano over peak after peak"],["n235","n",235,"puʻu","POO-oo","hill; throat","PHEW... (gulp) OOH.",["There is a hill behind your school so steep that nobody has ever made it to the top without stopping. You decide today is the day. You run straight up. Your legs burn. Your lungs burn. Your slippahs are smoking.","You reach the top. You bend over, hands on your knees, and let out the biggest \"PHEW!\" of your life. Then a gulp gets stuck in your throat. \"...OOH.\"","\"PHEW... (gulp) OOH.\"","Everybody down below hears it echo off the hill. Now every kid who makes it up there does the same thing at the top. \"Phew... ooh.\" Somebody sticks a flag up there with a cartoon of a kid holding his throat.","Phew, ooh. Puʻu. The hill, and the throat where that gulp got stuck. The ʻokina is the gulp."],"Hand on your throat, gulp in the middle. \"POO-oo.\"","Lots of place names start with Puʻu, like Puʻu ʻUalakaʻa, the park high above Honolulu.",null,"Kid gasping on top of a steep hill"],["n236","n",236,"awāwa","ah-VAAH-vah","valley","Ah... WAAAH... vah.",["Deep in a green valley, with walls so tall the sun only shows up for a couple of hours a day, lives a singing group of 40 frogs. They stand on rocks in matching bow ties. Every night they sing the same song.","\"Ahhh... WAAAAH... vah.\"","The valley walls bounce it back. \"WAAAH-vah... WAAH-vah... wah-vah.\" The echo lasts ten minutes. Hikers stop on the trail and snap their fingers. The waterfall keeps the beat.","One night a frog tries a solo, \"Ah-WAAAAH-vah,\" so loud the echo wakes up a herd of wild pigs on the far side of the valley. They join in. Now it's 40 frogs and 12 pigs singing till sunrise.","Ah, waaah, vah. Awāwa. Stretch that middle ā like the frogs."],"Cup your hands and sing into a valley. \"ah-VAAAH-vah.\"","Don't mix it up with awa, which means harbor. Awāwa is the valley.",null,"Frog singing group echoing in a valley"],["n237","n",237,"kahawai","kah-hah-VAI","stream, river","Ka, ha... WHY?",["You wake up and there is a stream running through your living room. Clear, cold, fresh water, knee deep, coming in the front door and going out the back. There are little fish in it. There is a frog on your couch.","Your dad walks in, stands in the water holding his coffee, and starts laughing. \"Ka, ha ha!\" Then he stops. \"...WHY?\"","\"Ha ha... WHY?\" Your mom comes in. \"Ha ha... WHY?\" Grandma floats past on an inner tube. \"Ha ha, WHY?\"","Nobody knows why. The stream stays for a week. You catch ʻōpae under the TV. Then one morning it's gone, and the carpet smells like a river forever.","Ka, ha... WHY? Kahawai. The stream."],"Laugh, then shrug hard. \"kah-hah-VAI.\"","Wai means fresh water. Look for it in kahawai, wailele, pūnāwai and muliwai.",null,"Stream running through the living room"],["n238","n",238,"wailele","vai-LEH-leh","waterfall","WHY, Layla?",["At the top of a 300 foot waterfall, a million tiny drops of water are lined up at the edge like skydivers. One by one they jump. \"WHEEE!\" They sparkle all the way down into the pool.","Except one little drop named Layla. She stands at the edge, shaking. She won't jump. The line behind her backs up for miles, all the way up the stream. Every drop is yelling at her.","\"WHY, LAYLA? JUST JUMP!\" \"Why, Layla? WHY?!\"","She takes a breath. She closes her eyes. She jumps. She screams the whole way down, lands in the pool with a plip, pops back up, and runs straight back to the top to get in line again.","Why, Layla. Wailele. Water that jumps."],"Jump in place with your arms up. \"vai-LEH-leh!\"","Wai is fresh water and lele means to jump or fly. A wailele is water that leaps.",null,"Scared water drop at the top of a waterfall"],["n239","n",239,"loko","LO-ko","pond, lake; inside","LOCO!",["Uncle's fishpond is usually calm. Today it has gone completely loco. The fish are jumping. The crabs are doing cartwheels. The big mullet with the mullet haircut from ʻanae is spinning on its tail like a breakdancer.","Uncle stands on the stone wall with his arms out. \"The pond is LOCO!\"","You look closer. Somebody dropped a 40 pound bag of coffee beans in there. Every fish inside is wired. The ducks won't land. The frogs are singing too fast. Bubbles are coming up from inside the pond like a hot tub.","It takes three days to calm down. Uncle puts up a sign. NO COFFEE IN POND.","Loco. Loko. The pond, and everything going crazy inside it."],"Spin a finger next to your ear. \"LO-ko.\"","Loko iʻa means fishpond. I loko means inside.",null,"Fishpond gone loco on coffee"],["n240","n",240,"loʻi","LO-ee","taro patch","Low... EEE!",["It's a work day at the loʻi. The aunties and uncles have been at it since before sunrise, and now it's your turn. You step off the bank into the taro patch.","The mud is cold. The mud is deep. You sink. Lower. Lower. Past your ankles, past your shins, up to your knees. You freeze. The cold mud squishes up between your toes and you let out one little squeak.","\"Low... EEE!\"","The aunty next to you laughs with you, not at you. She shows you how to walk, slow, knees high, feet flat. By lunch you are pulling weeds around the big heart shaped kalo leaves like you were born here. You're muddy to the belly button. Best day of your summer.","Low... eee. Loʻi. That little freeze in the middle is the ʻokina."],"Sink down slowly and squeak. \"LO-ee!\"","A loʻi kalo is a wetland taro patch. Cool water flows in from a ditch called an ʻauwai.",null,"Sinking knee deep in the taro patch mud"],["n241","n",241,"one","OH-neh","sand","Oh, NEH!",["You go to the beach for one afternoon. One. That's all.","Three weeks later there is still sand everywhere. In your shoes. \"Oh, NEH!\" In your ears. \"Oh, NEH!\" In your rice at dinner. \"OH, NEH!\" Under your pillow, in your toothbrush, inside a sealed jar of peanut butter that never even went to the beach.","You shake out your towel and a whole beach falls out of it, about 400 pounds of sand, burying the vacuum cleaner. You take a shower and the drain clogs. You open your wallet. Sand. \"OH, NEHHH!\"","You will be finding sand from that one afternoon until you are 80.","Oh, neh. One. Not the English number. Oh-neh, the sand."],"Shake sand out of your shoe. \"OH-neh!\"","One here is sand, not the number. The number one is ʻekahi.",null,"Sand pouring out of everything for weeks"],["n242","n",242,"pōhaku","poh-HAH-koo","rock, stone","Pohhh... HAH! ...koo.",["A karate master stands in front of a big smooth rock on the beach. Black belt. Serious face. A crowd gathers.","He breathes in slow. \"Pohhhhhhh...\" That breath lasts forever, just like the long ō. Then he raises his hand and brings it down on the rock with all his power. \"HAH!\"","The rock does not break. The rock does not even notice. There is a long silence. Then, very quietly, he holds his hand and makes a tiny sad sound. \"...koo.\"","\"Pohhh... HAH... koo.\"","The rock just sits there being a rock. A crab walks across it. The master bows to it with respect and goes to find some ice.","Pōhaku. The stone always wins."],"Breathe in slow, chop the air, then wince. \"poh-HAH-koo.\"","ʻIliʻili are small smooth stones clicked together like castanets in some hula.",null,"Karate chop on a rock that doesn't break"],["n243","n",243,"lepo","LEH-po","dirt, soil","LET GO!",["Tug of war at the family picnic. Thirty cousins on one side, thirty on the other, and a giant pit of loose dirt in the middle. You are at the very front of your team, closest to the pit.","The rope goes tight. Your feet slide. You feel yourself going. You scream to your team, \"LET GO! LET GO!\"","They do not let go. They pull harder. You go face first into the dirt, and your whole team slides in after you like dominoes, thirty people in one big brown pile. Dirt in your ears. Dirt in your teeth. Dirt in your belly button. You spit out enough dirt to plant a tree.","Let go. Lepo. The dirt you'll be washing out of your hair for a week."],"Spit out imaginary dirt. \"LEH-po.\"","Lepo is the dirt on your slippahs and also the good soil that kalo grows in.",null,"Tug of war team sliding into a dirt pit"],["n244","n",244,"lua","LOO-ah","hole, pit; toilet","The LOO? Ah.",["Camping trip at the beach park. The bathrooms are closed. Uncle Kimo grabs a shovel and says \"No worries, I'll make one.\"","He digs. And digs. He doesn't stop. By sunset the hole is 12 feet deep and as wide as a hot tub. He lays a plank across the middle, sticks a toilet seat on it, and hangs a shower curtain around the whole thing.","You walk over with your flashlight. \"Uncle... where's the loo?\"","He points proudly at the giant hole. You look down. It is very, very deep. Something down there echoes. \"The LOO?... AHHH.\"","You decide you can wait until morning.","Loo, ah. Lua. The hole, and the toilet. Same word."],"Peek down into a deep hole. \"LOO-ah.\"","Lua also means two, as in ʻelua.",null,"Giant hole with a toilet seat at camp"],["n245","n",245,"ana","AH-nah","cave","ANNA!",["You are exploring a lava tube cave with a flashlight, and your cousin Anna went ahead. The walls are black and bumpy. Water drips from the ceiling. The tunnel keeps going deeper.","You can't see her. You cup your hands and yell. \"ANNA!\"","The cave yells back. \"ANNA... Anna... anna... anna...\" Forty times. It bounces all the way to the end and comes back again. Then from somewhere deep inside you hear Anna yell \"WHAT?\" and the cave answers \"WHAT... what... what...\" for another ten minutes.","You finally find her. She is sitting on a rock eating a musubi in the dark. She says the echo was the best part.","Anna. Ana. The cave."],"Cup your hands and yell into a cave. \"AH-nah!\"","Many caves in Hawaiʻi are lava tubes, tunnels left behind when flowing lava drained out.",null,"Yelling \"Anna!\" into an echoing lava tube"],["n246","n",246,"pali","PAH-lee","cliff","POLLY!",["You are standing at the Pali Lookout with a parrot named Polly on your shoulder. The wind up here is famous. It comes screaming up the cliff so hard you can lean into it and not fall down.","Polly spreads her wings to show off. Big mistake. The wind catches her and she flies backwards while flapping forwards, like a bird on a treadmill. \"POLLY!\"","She shoots up over the edge of the cliff and hangs there in the air, wings out, not moving at all, staring at you. Then the wind flips and blows her straight back onto your head. Your hair is sticking straight up. So are her feathers.","Polly. Pali. The cliff where the wind lives."],"Lean forward into the wind. \"PAH-lee.\"","The Pali Lookout on Oʻahu sits on top of the Koʻolau cliffs and is famous for wind strong enough to lean on.",null,"Parrot blown backwards at the cliff lookout"],["n247","n",247,"kula","KOO-lah","school; open country","COOLER!",["Upcountry, in a wide open field with nothing but grass, cows and sky for miles, there is a school. It is inside a giant cooler. A red and white cooler the size of a gym, with the lid propped up for a door.","The kids come to class in jackets and beanies. Inside it's cold like a fridge. The teacher writes on the board in mittens. At recess everybody runs out into the warm open field to thaw, and at the bell they all run back into the cooler.","A new kid shows up on the first day, looks at it, and says \"The school... is a COOLER?\"","\"Yup,\" says the teacher. \"COOLER.\"","Cooler. Kula. School, and all that open country around it."],"Rub your arms like you're freezing. \"KOO-lah.\"","A kula kaiapuni is a Hawaiian language immersion school.",null,"School inside a giant cooler in an open field"],["n248","n",248,"ahi","AH-hee","fire","Ah, HEAT!",["Uncle builds a bonfire at the beach. He keeps adding wood. Pallets. Driftwood. An old chair. By 9 o'clock it is 30 feet tall and you can see it from a plane.","You walk up with a marshmallow on a stick. You get within 20 feet and the heat hits you like opening an oven. \"Ah! HEAT!\" You get closer. Your eyebrows curl. \"AH, HEAT!\" Your marshmallow catches fire, then the stick, then the bottom of your slippah.","Everybody at the beach is standing in a big circle 40 feet away, holding their hands up to the glow, going \"Ah, heat... ah, heat...\"","Ah, heat. Ahi. The fire. No ʻokina on this one."],"Hold your hands up to a fire. \"AH-hee.\"","Ahi with no ʻokina is fire. ʻAhi with the ʻokina is the tuna. A menu that says ahi poke is, strictly speaking, selling you fire poke.",null,"Giant bonfire curling your eyebrows"],["n249","n",249,"uahi","oo-AH-hee","smoke","Ooh! AH! Hee!",["Remember the 30 foot bonfire from ahi? Now it's smoking. And the smoke picks you. Only you.","You move left. The smoke moves left. You move right. The smoke follows. You run around the fire three times and the smoke chases you like a puppy. It gets in your eyes, your nose, your hair, your hoodie.","You cough so hard it comes out in three pieces. \"OOH! ...AH! ...HEE!\" Everybody else is sitting happy in clean air. You are the only one inside a cloud. \"OOH-AH-HEE!\"","Next morning your pillow smells like a barbecue.","Ooh, ah, hee. Uahi. And look, ahi, fire, is hiding right inside it."],"Wave smoke away from your face and cough. \"oo-AH-hee.\"","Uahi has ahi inside it. Where there is smoke, there is fire.",null,"Smoke chasing you around a bonfire"],["n250","n",250,"pele","PEH-leh","lava, volcano","Not so PALE now, eh?",["You just came home from four years of college on the continent, and you are pale. Pale like rice. Pale like the inside of a coconut. Your uncle takes one look at you and drives you to the volcano.","At night you stand at the overlook with a hundred other people, all quiet. Down in the crater the lava is glowing and rolling, bright orange, breathing heat you can feel on your cheeks from far away. It is the most powerful thing you have ever seen. Nobody talks loud here.","The glow lights up your whole face. Your uncle looks at you, orange from forehead to chin, and gives a small nod. \"Not so PALE now, eh?\"","Pale, eh. Pele. The lava and the volcano, a place you visit with respect."],"Feel warmth on your face and say it softly. \"PEH-leh.\"","Pele is also the name of the volcano goddess. People there speak of her with respect and don't take lava rocks home.",null,"Pale face glowing orange at the crater"],["n251","n",251,"pāhoehoe","paah-ho-eh-HO-eh","smooth lava","PAAA! Whoa, eh! WHOA, eh!",["Pa goes for a walk across an old lava flow in his socks. Not the sharp kind. The smooth kind. Shiny gray-black, with ripples and ropes in it, like somebody poured brownie batter over the land and it froze.","It is so smooth that Pa starts to slide. His arms go out. His knees wobble. You scream \"PAAAA!\" and he yells back \"WHOA, EH! WHOA, EH!\" He slides down a long lava ripple like a kid on a water slide, spinning in circles, socks smoking a little.","He comes to a stop at the bottom and stands up very slow. He brushes off his shorts. He says he meant to do that. Nobody believes him.","Paaa... whoa eh, whoa eh. Pāhoehoe. The smooth, ropy lava."],"Slide your feet like you're on ice. \"paah-ho-eh-HO-eh.\"","Pāhoehoe and ʻaʻā are Hawaiian words that geologists all over the world use for these two kinds of lava.",null,"Pa sliding on smooth lava in his socks"],["n252","n",252,"ʻaʻā","ah-AAH","rough, jagged lava","Ah! ...AAAAH!",["Pa lost his socks on the pāhoehoe. Now he has to cross a different lava field barefoot, and this one is ʻaʻā. Jagged, sharp, crumbly, like a field of broken flowerpots and burnt cornflakes.","He takes one step. \"Ah!\" He freezes. Then the pain arrives. \"AAAAAAAH!\"","Every step is the same. A short \"Ah!\", a frozen stop, then a long \"AAAAH!\" You can hear him a mile away. A mongoose pokes its head out of a crack and starts copying him. \"Ah! AAAAH!\"","It takes Pa forty minutes to go a hundred feet. At the end he sits down, looks at the bottoms of his feet, and swears he will never leave home without slippahs again.","Ah... AAAH. ʻAʻā. The ʻokina is the freeze, the ā is the long scream."],"Tiptoe on sharp rocks. \"ah... AAAH!\"","Don't mix it up with aʻa, which means a small root or a vein.",null,"Barefoot Pa yelling on sharp lava"],["n253","n",253,"nahele","nah-HEH-leh","forest, wilderness","Nah, Haley!",["Your friend Haley has a new phone with a map app, and she says she knows a shortcut. The map says turn left. Left is straight into the forest.","\"Nah, Haley.\"","She goes anyway. You follow. The trees close in. Ferns taller than trucks. Vines hanging down like jump ropes. Moss on everything. Birds you have never heard in your life. Every ten feet she says \"It says keep going,\" and you say \"NAH, HALEY.\"","Three hours later you come out the other side covered in leaves, with a spider in your hair and mud up to your knees, 50 feet from where you started. The phone chirps. \"You have arrived.\"","Nah, Haley. Nahele. The forest, the wild green place where maps give up."],"Push a branch out of your face. \"nah-HEH-leh.\"","The ʻōhiʻa lehua is one of the most important trees in Hawaiʻi's native forests.",null,"Following Haley's phone into a thick forest"],["n254","n",254,"moku","MO-koo","island; ship; district","Mine is MO' COOL!",["Two brothers each buy a boat. The first brother gets a little fishing boat. The second brother, Uncle Keoni, buys a huge old cargo ship and parks it right next to his brother's. He leans over the rail. \"Mine is MO' COOL.\"","His brother adds a cooler and a flag. Keoni plants 60 coconut trees on his deck. \"MO' COOL.\" His brother adds a hammock. Keoni adds a sandy beach, a fishpond and a family of chickens. \"MO' COOL.\"","By summer his ship is basically an island floating in the harbor. It has its own zip code. It holds an election and picks its own mayor. It is officially its own district.","Mo' cool. Moku. Ship, island and district, all in one word."],"Puff out your chest and brag. \"MO-koo.\"","Moku can also mean cut or broken apart. Mokupuni is another word for island.",null,"Cargo ship turned into a floating island"],["n255","n",255,"mokupuni","mo-koo-POO-nee","island","Mo' cool... but PUNY.",["Remember Uncle Keoni and his mo' cool ship island from moku? His little brother is jealous. So he goes online and buys his own private island. Twelve dollars, free shipping.","It shows up in a box. He carries it to the beach and sets it in the water. It is four feet across. One coconut tree, about as tall as a fire hydrant. One hermit crab. That's the whole island. He has to stand on one foot.","He waves up at Keoni with a tiny flag. Keoni looks down from his giant ship island, tilts his head, and says \"Mo' cool... but PUNY.\"","The hermit crab nods. The coconut tree drops its one coconut. The island tips over.","Mo' cool, puny. Mokupuni. The everyday word for island. Big or puny, every island is a mokupuni."],"Hold your thumb and finger a little bit apart. \"mo-koo-POO-nee.\"","Hawaiʻi is a pae ʻāina, a chain of islands, with eight main mokupuni.",null,"Tiny four foot island with one tree"],["n256","n",256,"kai","KAI","sea, salt water","KAI... YAK!",["You go kayaking. The very first wave hits the front of your kayak and a big splash of sea water goes straight into your open mouth.","It is salty. It is SO salty. Your whole face scrunches up. \"KAI... YAK!\"","Another wave. Another mouthful. \"KAI-YAK!\" You paddle harder. The ocean keeps slapping salt water at you like it's a game. By the time you reach the sandbar you have swallowed half a gallon of ocean, your lips are crusty white with salt and your tongue is dry like beef jerky. You drink three bottles of water and it still tastes like the sea.","Now every time you see a kayak, you taste salt.","Kai. The sea. The salty stuff."],"Spit and make a sour face. \"KAI!\"","Kai is salt water and wai is fresh water. Makai means toward the sea.",null,"Kayaker swallowing a mouthful of sea water"],["n257","n",257,"moana","mo-AH-nah","ocean","MOOOAN... ah.",["You are in a small boat in the middle of the ocean. Nothing but blue in every direction. Blue below, blue above, blue forever. No land for a thousand miles.","Then from deep, deep down comes a sound. A whale as long as a city bus is moaning. \"MOOOOAN... AH.\"","It rattles your cooler. It shakes the spam musubi in your hand. The whole ocean seems to hum. Then another whale answers from 50 miles away. \"MOOOOAN-AH.\" They moan back and forth all night across all that open water, the loudest conversation on earth, and you are a tiny speck in the middle of it.","You lie on the deck and listen until sunrise.","Moan, ah. Moana. The big open ocean."],"Moan low like a whale. \"mo-AH-nah.\"","Moananuiākea is a name for the vast Pacific Ocean.",null,"Whales moaning across the open ocean"],["n258","n",258,"nalu","NAH-loo","wave, surf","NAH, LOU!",["North Shore, winter, biggest day of the year. A wave rolls in as tall as a five story building. Everybody on the beach takes a step back.","Out in the water, one old man is already paddling for it. Uncle Lou. Seventy-four years old, tank top, longboard, no fear at all.","The lifeguard grabs the megaphone. \"NAH, LOU! NOT THIS ONE!\"","Lou ignores him. He catches it anyway, stands up, and rides that giant wave all the way in, arms out, gray hair flying. The wave curls over his head like a blue roof. The lifeguard yells the whole time. \"NAH, LOU! NAH, LOUUU!\" Lou steps off onto the sand and hands the lifeguard his board.","Nah, Lou. Nalu. The wave."],"Paddle hard with both arms. \"NAH-loo.\"","Heʻe nalu means to surf, to slide on a wave. Remember the octopus from heʻe?",null,"Old Uncle Lou riding a giant wave"],["n259","n",259,"kahakai","kah-hah-KAI","beach, seashore","HA HA, KITE!",["You buy the biggest kite at the swap meet, shaped like a shark, 20 feet wide. You take it to the beach. The wind grabs it and you hold on.","It drags you. Down the beach on your butt, through the wet sand, past umbrellas and coolers and a man sleeping under a newspaper, digging a trench the whole length of the shoreline, right where the waves meet the sand.","Everybody on the beach points and laughs. \"HA HA! KITE!\"","Two miles later the kite finally drops. You sit up in the ditch you just dug. The tide comes in and fills it. Now it's a canal. Kids are floating down it on bodyboards. \"Ha ha, kite.\"","Ka ha KITE. Kahakai. The beach, the edge of the sea."],"Point at the ocean and laugh. \"kah-hah-KAI.\"","Kahakai ends in kai, sea. Kahawai, the stream, ends in wai, fresh water. Salty beach, fresh stream.",null,"Giant shark kite dragging you down the beach"],["n260","n",260,"papa","PAH-pah","board; class; reef flat","PAPA!",["Papa lies down flat on the reef flat at low tide, stiff as a board. The water is shallow and warm. Six grandkids climb onto his back.","\"Papa is the board!\" He does not move. A little wave comes, he floats, and they stand up on him, wobbling, arms out, screaming \"PAPA! PAPA!\" One falls off. Another climbs on.","Then Papa lifts his head and starts teaching. He is the board, he is the surf teacher, and this is class. \"Knees bent. Look forward. Paddle.\" Six kids sit in a row on the reef flat, taking notes with their fingers in the wet sand. A turtle swims up to listen.","Papa. Papa. Papa. Board, class and reef flat. Papa is all three."],"Lie flat and stiff as a board. \"PAH-pah.\"","A papa heʻe nalu is a surfboard, a board for sliding on waves.",null,"Grandkids surfing on Papa on the reef flat"],["n261","n",261,"ʻākoʻakoʻa","aah-ko-ah-KO-ah","coral","Ah! Koa... KOA...!",["You go snorkeling with your cousin. Down on the reef she spots a coral head shaped exactly like a koala hugging a tree. Brown and bumpy, round ears, little nose, arms wrapped around a branch of coral. Fish are swimming in and out of its ears.","She pops up to tell you. \"Ah! A koa...\" A wave floods her snorkel. She coughs. \"(gulp) KOA...!\" Another splash. She never gets to say the \"la.\" \"Ah! Koa... (gulp) KOA...!\"","Now you both keep diving down to look at it and coming up choking. \"Ah-koa-KOA!\" The coral has towers and fans and antlers and brains, a whole underwater city, and all you two can say is half a koala.","Every gulp is an ʻokina. ʻĀkoʻakoʻa. Coral."],"Blow bubbles, then gasp. \"aah-ko-ah-KO-ah.\"","Coral is alive. Don't stand on it or touch it, and use reef safe sunscreen.",null,"Coral shaped like a koala, snorkel flooding"],["n262","n",262,"pūnāwai","poo-naah-VAI","spring (of water)","Pool? Naaah... WHY?!",["Your kid wants a swimming pool. Every single day. \"Can we get a pool?\" And every day you say the same thing. \"Pool? Naaaah.\"","One morning you're watering the garden and the ground under your feet starts to bubble. Then gurgle. Then cold, clear, fresh water comes shooting up out of the grass like a fountain, straight out of the earth. It fills the yard. It fills the sandbox. It floats the lawn chairs.","Your kid runs out in goggles and cannonballs in. You stand there soaked, staring at the spring in your backyard. \"Pool? Naaah... WHY?!\"","Pool, naaah, why. Pūnāwai. A spring, fresh water coming up from the ground."],"Push your hands up like a fountain. \"poo-naah-VAI.\"","Spot the wai, fresh water, at the end. A pūnāwai is a spring of fresh water.",null,"Spring bursting up in the backyard"],["n263","n",263,"muliwai","moo-lee-VAI","river mouth, estuary","Moo, Lee... WHY?",["Lee the cow from limu is back. She got tired of eating seaweed on the reef, so she walked up the beach to where the stream runs into the ocean. Now she stands there with her front legs in the salty sea and her back legs in the fresh stream water. Half and half.","She won't move. She just chews and looks happy. The farmer comes running down the beach waving his hat. \"Moo, Lee! WHY?\"","She stays right there in the mixed-up water where fresh and salty meet, with little fish around her ankles, some from the stream and some from the sea. Then she moos, a mullet jumps over her tail, and a duck lands on her back.","Moo, Lee, why. Muliwai. The river mouth."],"Put one foot forward and one foot back. \"moo-lee-VAI.\"","At a muliwai, fresh water, wai, meets salt water, kai. The mix is called brackish water.",null,"Cow standing half in the stream, half in the sea"],["n264","n",264,"ʻauwai","ow-VAI","irrigation ditch","(gulp) OW! WHY?",["Layla the water drop from wailele is back. After the waterfall she floats down the stream, and a little stone ditch scoops her up. It's an ʻauwai, and it carries water off the stream toward the taro patches.","It's narrow. It's fast. It's twisty. Layla shoots down it like a water slide, bouncing off every stone. \"OW! WHY? OW! WHY?\" Right before every bump she gulps. \"(gulp) OW! WHY?\"","Then she pops out into the calm, cool water of the loʻi and floats in circles around the big green kalo leaves. The kalo drinks. When she's done, she flows back out the other side and home to the stream, ready to do it all again.","Ow, why. ʻAuwai. The gulp is the ʻokina."],"Wince, then shrug. \"ow-VAI.\"","The water in an ʻauwai flows through the loʻi and then goes back to the stream.",null,"Water drop bouncing down a stone ditch"],["n265","n",265,"awa","AH-vah","harbor","AVA!",["The harbor is packed. Three hundred boats. Fishing boats, sailboats, a tugboat, a canoe, an old yacht with a hot tub on the deck. And every single one is named Ava. Say it like the harbor master does, AH-vah.","He stands on the dock with a megaphone. \"AVA! You're up!\"","All three hundred boats start their engines at the same time. Horns blast. Seagulls scatter. They all try to leave at once and jam up at the harbor mouth like the H-1 at five o'clock.","The harbor master sighs into the megaphone. \"The BLUE Ava.\" Two hundred of them are blue.","Ava. Awa. The harbor where all the boats come home."],"Wave boats in like a harbor master. \"AH-vah!\"","Don't mix up awa, the harbor, with ʻawa, the kava plant and drink, or awāwa, the valley.",null,"Three hundred boats named Ava jammed in the harbor"],["n266","n",266,"ānuenue","aah-noo-eh-NOO-eh","rainbow","Aaah! NEW, eh? NEW, eh?",["Aunty comes home from the swap meet with a rainbow. A real one, 90 feet long, rolled up under her arm like a carpet, the price tag still hanging off the end. She unrolls it across the yard. Red, orange, yellow, green, blue, purple, glowing.","She is so proud. She shows the neighbor. \"Aaah! NEW, EH? NEW, EH?\"","The neighbor says \"Wow.\" She shows the mailman. \"Aaah! NEW, eh? NEW, eh?\" She drapes it over the carport. She hangs it off the mango tree. She makes the whole family stand under it for a photo.","That night it sprinkles a little, and the rainbow gets even brighter. Aunty's eyes shine. \"NEW, eh?\"","Aaah, new eh, new eh. Ānuenue. The rainbow."],"Draw a big arc across the sky with your arm. \"aah-noo-eh-NOO-eh.\"","A rainbow is on Hawaiʻi's license plates.",null,"Aunty unrolling a rainbow from the swap meet"],["n267","n",267,"hekili","heh-KEE-lee","thunder","HEY, KEELY!",["Ever wonder what thunder is? Up in the clouds there is a bowling alley for giants. And the best bowler up there is a giant named Keely.","Every time she steps up, her whole team yells \"HEY, KEELY!\" She rolls a ball the size of a house down a lane made of cloud. BOOOOOM. The pins crash. The whole sky rattles. Down below, dogs hide under beds and windows shake in their frames.","\"HEY, KEELY!\" Strike. BOOM. \"HEY, KEELY!\" BOOM. She bowls a perfect game, and all of Hilo is awake at 2 in the morning listening to every frame.","Hey, Keely. Hekili. The thunder."],"Roll an invisible bowling ball, then say it like a boom. \"heh-KEE-lee!\"","Hekili is thunder and uila is lightning.",null,"Giant named Keely bowling in the clouds"],["n268","n",268,"kēhau","keh-HOW","dew","Oookaaay... HOW?",["Every night you park your car in the driveway. Every morning it is covered in tiny drops of water. Thousands of them. On the windshield, on the mirrors, on the hood. It did not rain. The ground is dry. The sky was clear all night.","You stand there in your slippahs with your coffee. \"Oookaaay... HOW?\"","So one night you stay up to watch. You sit in a lawn chair with a flashlight. Midnight, nothing. Two o'clock, nothing. Around 4 a.m. the air gets cool, and one by one, little drops just appear out of nowhere, like the car is sweating. \"Kaaaay... HOW?\"","You fall asleep in the chair. In the morning you are covered in drops too.","Kay, how. Kēhau. The dew. Stretch that ē like you're confused."],"Wipe drops off a windshield with your hand. \"keh-HOW?\"",null,null,"Staring at a dew covered car at 4 a.m."],["n269","n",269,"noe","NO-eh","mist","NO, EH!",["You spent two hours on your hair for prom. Perfect. Flat. Shiny. Not one hair out of place. You step outside.","The mist is waiting for you. Not rain. Just a soft, fine, floating mist, so light you can barely see it. It hangs in the air like a ghost of water. You take one step into it.","Your hair goes POOF. Twice as big. Then three times. \"NO, EH!\" You run back inside. Too late. You look like a dandelion. \"NO! EHHHH!\"","Your date shows up. Their hair is poofy too. Everybody at prom is poofy. The photographer says it's the best group photo he has ever taken.","No, eh. Noe. The mist."],"Pat your hair down in a panic. \"NO-eh!\"","The name Noelani means heavenly mist, noe plus lani.",null,"Prom hair poofing up in the mist"],["n270","n",270,"ʻohu","OH-hoo","fog, low cloud","OH! WHO?",["You're driving up the mountain road at night and the fog rolls in so thick you can't see your own hood. You pull over and get out to look around. You can't see your own hands.","You walk forward with your arms out. You bump into something warm. Something with a face. First a little catch in your throat, then \"OH! WHO?\"","\"Me,\" it says. It's your cousin. He got lost in the fog too. You walk together. You bump into another face. \"OH! WHO?\" It's a man selling boiled peanuts. Another bump. \"OH! WHO?\" A very confused nēnē. Then a lady walking her pig.","By the time the fog lifts, there are 12 of you standing in a clump on the side of the road, holding hands, all going \"Oh. Who?\"","Oh, who. ʻOhu. The fog."],"Stick your hands out like you're blind. \"OH-hoo?\"","Noe is a fine mist. ʻOhu is fog, or a low cloud sitting on the mountain.",null,"Bumping into strangers in thick fog"],["n271","n",271,"kukuna","koo-KOO-nah","ray of light","Co-COON, ah!",["In the garden a moth caterpillar is getting ready to change. Most of them make their cocoon out of silk. Not this one. This one waits for the morning sun and grabs a single ray of light shining through the leaves.","It wraps that golden ray around and around its body like tape. The light is warm and bright. When it's done, there is a glowing gold cocoon hanging from the branch like a little lantern.","Your little sister sees it and screams \"Co-COON, ah! COCOON, AH!\" Every neighbor comes to look. At night it lights up the whole yard. A week later a moth bursts out with shining gold wings, and a hundred little rays of light fly out with it.","Co-coon, ah. Kukuna. A ray of light."],"Point at a sunbeam. \"koo-KOO-nah.\"","Kukuna o ka lā means the rays of the sun.",null,"Caterpillar wrapped in a ray of light"],["n272","n",272,"wanaʻao","vah-nah-OW","dawn","Wanna... OW!",["It's 5 in the morning. Pitch dark. Your dad shakes you awake and whispers \"Wanna see the sunrise?\"","You're half asleep. You say \"Wanna...\" and roll out of bed and stomp straight onto a toy block. First a gasp. Then \"...OW!\"","\"Wanna... OW!\" You hop down the hall. You bang your knee on the door. \"OW!\" You walk into the screen door. \"OW!\" You trip on the pile of slippahs by the step.","Then you get outside, and the whole sky over the mountain is turning pink and gold. The first light of the day. You forget all about your foot. You and Dad stand there in the cool air with your mouths open.","Wanna... OW. Wanaʻao. The dawn. The gasp before the ow is the ʻokina."],"Stretch, then grab your foot. \"vah-nah-OW!\"","Wanaʻao is the first light of dawn, before the sun is fully up.",null,"Stepping on a toy block at dawn"],["n273","n",273,"kakahiaka","kah-kah-hee-AH-kah","morning","Cock-a-hee-AH-ka!",["Your neighbor's rooster has one job. Crow in the morning. Every day at sunrise he climbs up on the fence, puffs out his chest, and gives it everything he's got.","But he doesn't do cock-a-doodle-doo. He never learned it. He does his own.","\"KAH-KAH-HEE-AH-KAH!\"","Every window on the street flies open. Dogs start howling. The garbage truck driver honks along. By the third crow the whole neighborhood is up, making coffee, grumbling, and saying it to each other over the fence like a greeting. \"Kah-kah-hee-AH-kah.\" The rooster struts back and forth, very proud, until noon.","Kakahiaka. Morning."],"Flap your elbows and crow. \"kah-kah-hee-AH-kah!\"","Aloha kakahiaka means good morning.",null,"Rooster on a fence crowing \"Kah-kah-hee-AH-kah!\""],["n274","n",274,"awakea","ah-vah-KEH-ah","noon","Oh. AWAKE, ah?",["Your teenage cousin is sleeping over. Morning comes. He sleeps. Breakfast comes. He sleeps. Somebody mows the lawn right outside his window. He sleeps. A marching band goes by. He sleeps.","At twelve noon, sun high in the sky, he walks out of the room with his hair sticking up like a pineapple and one sock on.","Your dad looks up from the table. \"Oh. AWAKE, ah?\"","Your cousin blinks. \"Is it morning?\" \"It's NOON.\" \"Awake, ah?\" says Grandma. \"Awake, ah?\" says the neighbor through the window. Even the dog looks at him like \"Awake, ah?\" He eats breakfast for lunch.","Awake, ah. Awakea. Noon. The w can sound like a v too."],"Stretch and yawn big. \"ah-vah-KEH-ah.\"","Twice a year in Hawaiʻi the noon sun is straight overhead and your shadow disappears. People call it Lāhainā Noon.",null,"Teenager waking up at noon with pineapple hair"],["n275","n",275,"ʻauinalā","ow-ee-nah-LAAH","afternoon","(catch) OW! WHEE! Nah... LAAAH!",["Remember the singing sun from lā? By afternoon it gets bored of just hanging up there. So it climbs onto a giant slide made of sky and lets go.","It starts slow. It bumps over a cloud. \"OW!\" Then it picks up speed. \"WHEEE!\" Halfway down it grabs the edge because it doesn't want the day to end. \"Nah...\" Then it slips, and slides the rest of the way toward the ocean singing its long song. \"LAAAAAH!\"","\"Ow! Whee! Nah... LAAAH!\" All afternoon long the sun slides down the sky, the shadows stretch out long, and the heat goes soft and golden.","ʻAuinalā. The afternoon, when the sun slopes down. Hold that last ā like the sun's song."],"Slide your hand down in a slow arc. \"ow-ee-nah-LAAH.\"","ʻAuina means to slope down, and lā is the sun. Aloha ʻauinalā means good afternoon.",null,"The sun sliding down a slide in the sky"],["n276","n",276,"ahiahi","ah-hee-AH-hee","evening","Ah, HEAT! Ah, HEAT!",["It's evening at the beach. The sun just went down and the sky is purple. A guy with a long torch comes running down the sand to light the row of tiki torches, a hundred of them, all the way to the rocks.","Every time he lights one, the flame jumps up and the heat hits him in the face. \"AH, HEAT!\" Next torch. \"AH, HEAT!\" He goes faster and faster. \"Ah, heat! Ah, heat! Ah, heat!\" It turns into a song. The tourists start clapping to the beat. A little kid runs behind him doing it too.","By the last torch the whole beach is glowing orange, and a hundred little fires flicker in the dark.","Ah heat, ah heat. Ahiahi. It even looks like ahi, fire, twice."],"Light two pretend torches, one after the other. \"ah-hee-AH-hee.\"","Aloha ahiahi means good evening.",null,"Torch lighter running down the beach at sunset"],["n277","n",277,"pō","POH","night; darkness","POHHHHH (blowing out a candle)",["It's 7 p.m., the sun is still up, and the baby can't sleep. So a giant as tall as Diamond Head stomps down to the beach, leans over the ocean, and looks at the sun like it's a birthday candle.","He takes a huge breath. He blows. \"POHHHHHHHHHH.\"","The sun goes out like a candle. A little puff of smoke curls up off the ocean. Everything goes dark. Deep, black, starry dark. The frogs start singing. The streetlights click on one by one. Somebody down the street yells \"HEY! I was reading!\"","The giant whispers \"Good night,\" tiptoes off, and the baby is snoring before he gets home.","Pō. Night. Hold that ō long, like the giant's breath."],"Blow out a candle, slow and long. \"POHHH.\"","In the Kumulipo, the Hawaiian chant of creation, life begins in pō, the deep darkness.",null,"Giant blowing out the sun like a candle"],["n278","n",278,"aumoe","ow-MO-eh","midnight","OW! Mo... eh.",["It's midnight. The whole house is dark. You sneak into the kitchen for the last spam musubi in
