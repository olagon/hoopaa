<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoʻopaʻa</title>
<meta name="description" content="Train on 1,000 Hawaiian words with memory stories until every one is mastered.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;0,800;1,400;1,500&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
:root{
  --bg:#EDF2EE; --surface:#FFFFFF; --surface-2:#F3F7F4; --ink:#12241D; --ink-2:#3B4F46; --muted:#66786F; --line:#D5DFD8;
  --accent:#C22F3A; --accent-ink:#FFFFFF; --accent-soft:#F8E1E2;
  --teal:#0A6B75; --teal-soft:#DAEDEE; --gold:#B87A0C; --gold-soft:#FAEDCB;
  --good:#1D7F46; --good-soft:#DCF1E3; --bad:#B8362A; --bad-soft:#FAE2DE;
  --night:#07121B; --night-2:#0E2230; --star:#F3C85A;
  --shadow:0 1px 2px rgba(18,36,29,.06),0 10px 28px rgba(18,36,29,.07);
  --radius:18px;
  --f-display:"Alegreya","Noto Serif",Georgia,serif;
  --f-read:"Alegreya","Noto Serif",Georgia,serif;
  --f-ui:"Alegreya Sans","Noto Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1317; --surface:#111F26; --surface-2:#162831; --ink:#E6EEE9; --ink-2:#BACBC3; --muted:#8B9F97; --line:#22363F;
    --accent:#FF5E66; --accent-ink:#1C0709; --accent-soft:#3A1B1F;
    --teal:#4CC6CF; --teal-soft:#113238; --gold:#F2C14E; --gold-soft:#3A2E12;
    --good:#4CC57F; --good-soft:#123222; --bad:#FF7063; --bad-soft:#3A1916;
    --night:#040C12; --night-2:#0A1B26;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1317; --surface:#111F26; --surface-2:#162831; --ink:#E6EEE9; --ink-2:#BACBC3; --muted:#8B9F97; --line:#22363F;
  --accent:#FF5E66; --accent-ink:#1C0709; --accent-soft:#3A1B1F;
  --teal:#4CC6CF; --teal-soft:#113238; --gold:#F2C14E; --gold-soft:#3A2E12;
  --good:#4CC57F; --good-soft:#123222; --bad:#FF7063; --bad-soft:#3A1916;
  --night:#040C12; --night-2:#0A1B26;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-variant-numeric:lining-nums}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-ui);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-inline:16px;padding-bottom:96px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:760px;margin:0 auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px 10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:-.01em;line-height:1;flex:1;display:flex;align-items:baseline;gap:10px}
.brand small{font-family:var(--f-ui);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.chips{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px;font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
.chip svg{width:16px;height:16px}
.chip.sun svg{color:var(--gold)}
.chip.xp svg{color:var(--accent)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav-in{display:flex;gap:4px;max-width:520px;width:100%}
.nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:12px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.02em}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
@media (min-width:820px){
  body{padding-bottom:40px}
  .nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);bottom:auto;background:transparent;border:0;padding:0 0 8px;z-index:19}
  .nav-in{max-width:760px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
  .nav button{flex-direction:row;justify-content:center;gap:8px;font-size:14px;padding:9px}
  .nav button svg{width:18px;height:18px}
}

.view{display:grid;gap:16px;padding-block:6px 24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.greet{font-family:var(--f-display);font-size:22px;font-weight:500;color:var(--ink-2)}
.greet b{font-weight:700;color:var(--ink)}

/* sky hero */
.sky{position:relative;border-radius:22px;overflow:hidden;background:radial-gradient(120% 90% at 50% 45%,var(--night-2),var(--night));color:#EAF2F6;border:1px solid rgba(255,255,255,.06)}
.sky canvas{display:block;width:100%;height:100%}
.sky-hero{aspect-ratio:16/10;max-width:100%;cursor:pointer}
@media (max-width:520px){.sky-hero{aspect-ratio:1/1}}
.sky-over{position:absolute;left:18px;bottom:16px;right:18px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;pointer-events:none}
.sky-count{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,9vw,64px);line-height:.9;color:#FFF6DC;font-variant-numeric:lining-nums tabular-nums}
.sky-count span{font-family:var(--f-ui);font-size:14px;font-weight:600;color:#A9BECB;display:block;margin-top:6px;letter-spacing:.02em}
.sky-note{font-size:13px;color:#A9BECB;max-width:22ch;text-align:right}
.sky-full{aspect-ratio:1/1;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

/* today */
.today{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;font-size:18px;line-height:1.1;font-variant-numeric:lining-nums tabular-nums}
.ring .num small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.today h2{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.1}
.today .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;color:var(--ink-2);font-size:15px}
.today .meta b{font-variant-numeric:lining-nums tabular-nums}
.today-actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px}

.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s ease,background .2s}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.teal{background:var(--teal);color:var(--surface)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.link{background:transparent;color:var(--muted);padding:10px 12px;font-weight:700}
.btn.big{padding:16px 26px;font-size:18px;flex:1;min-width:200px}
.btn[disabled]{opacity:.5;cursor:default}

.upnext{display:grid;gap:10px}
.upnext-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.teaser{flex:0 0 auto;min-width:170px;max-width:220px;border:1px dashed var(--line);border-radius:14px;padding:12px 14px;background:var(--surface-2)}
.teaser .w{font-family:var(--f-display);font-weight:700;font-size:22px}
.teaser .h{font-family:var(--f-read);font-style:italic;color:var(--ink-2);font-size:14px}

.prog{display:grid;gap:14px}
.prow{display:grid;gap:6px}
.prow .lab{display:flex;justify-content:space-between;font-weight:700;font-size:15px}
.prow .lab span{color:var(--muted);font-weight:600;font-variant-numeric:lining-nums tabular-nums}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.stack i{display:block;height:100%}
.c-m{background:var(--gold)} .c-g{background:var(--teal)} .c-l{background:color-mix(in srgb,var(--teal) 35%,var(--surface))}

/* words */
.toolbar{display:grid;gap:10px}
.search{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.segs{display:flex;flex-wrap:wrap;gap:8px}
.seg{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;color:var(--ink-2)}
.seg[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row .hw{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.15}
.row .en{color:var(--ink-2);font-size:14px;line-height:1.35}
.row .num{font-size:12px;color:var(--muted);font-variant-numeric:lining-nums tabular-nums;width:40px}
.pips{display:flex;gap:3px}
.pips i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--teal)}
.pips.m i{background:var(--gold)}
.more{justify-self:center}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:600px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.tile .v{font-family:var(--f-display);font-size:32px;font-weight:700;line-height:1.05;font-variant-numeric:lining-nums tabular-nums}
.tile .k{font-size:13px;color:var(--muted);font-weight:700}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-ui)}
.setgrid{display:grid;gap:18px}
.setrow{display:grid;gap:8px}
.setrow label.t{font-weight:800}
.setrow .hint{font-size:14px;color:var(--muted)}
textarea.code{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.switch{display:flex;align-items:center;gap:10px;font-weight:600}
.switch input{width:20px;height:20px;accent-color:var(--teal)}

/* session */
.session{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 140px)}
.ses-in{max-width:640px;margin:0 auto;display:grid;gap:18px}
.ses-top{display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg);padding-block:8px;z-index:2}
.x{border:0;background:var(--surface);border:1px solid var(--line);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto}
.x svg{width:18px;height:18px}
.pbar{flex:1;height:12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--good));border-radius:99px;transition:width .35s ease}
.combo{font-weight:800;color:var(--gold);font-variant-numeric:lining-nums tabular-nums;min-width:52px;text-align:right;font-size:15px}
.combo.hot{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.25)}}

.big-word{font-family:var(--f-display);font-weight:700;font-size:clamp(46px,13vw,84px);line-height:.95;letter-spacing:-.015em;word-break:break-word}
.pron{display:inline-block;margin-top:10px;padding:5px 12px;border-radius:999px;background:var(--teal-soft);color:var(--teal);font-weight:800;letter-spacing:.06em;font-size:15px}
.meaning{font-family:var(--f-read);font-size:21px;margin-top:10px;color:var(--ink)}
.kind{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.hook{margin-top:18px;padding:16px 18px;border-radius:16px;background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 30%,transparent)}
.hook q{display:block;font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;margin-top:4px;quotes:"\201C" "\201D"}
.lbl{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.story{font-family:var(--f-read);font-size:19px;line-height:1.6;display:grid;gap:14px;margin-top:18px;max-width:62ch}
.sayit{margin-top:18px;padding:14px 16px;border-radius:14px;background:var(--teal-soft)}
.sayit p{margin-top:4px;font-weight:600}
.said{display:flex;align-items:center;gap:10px;margin-top:10px;font-weight:700;cursor:pointer}
.said input{width:22px;height:22px;accent-color:var(--teal)}
.bonus{margin-top:14px;font-size:15px;color:var(--ink-2)}
.bonus b{color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}

.prompt{text-align:center;padding-block:20px 6px;display:grid;gap:6px;justify-items:center}
.prompt .scene{font-family:var(--f-read);font-size:24px;line-height:1.35;max-width:26ch}
.prompt .scene.hk{font-family:var(--f-display);font-weight:700;font-size:34px}
.prompt .mean{font-family:var(--f-read);font-size:28px;line-height:1.3;max-width:24ch}
.options{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-size:17px;font-weight:600;box-shadow:0 2px 0 var(--line);transition:border-color .15s,background .15s,transform .1s}
.opt:hover{border-color:color-mix(in srgb,var(--teal) 50%,var(--line))}
.opt:active{transform:translateY(1px)}
.opt kbd{flex:0 0 auto;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font-family:var(--f-ui);font-size:13px;font-weight:800;color:var(--muted)}
.opt.hw{font-family:var(--f-display);font-size:24px;font-weight:700}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.typebox{display:grid;gap:10px}
.typebox input{width:100%;padding:16px 18px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-family:var(--f-display);font-size:30px;font-weight:700;text-align:center}
.typebox input:focus{border-color:var(--teal);outline:none}
.keys{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.keys button{min-width:46px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-display);font-size:22px;font-weight:700}
.hintline{text-align:center;font-family:var(--f-read);font-style:italic;color:var(--ink-2)}

.fb{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:3px solid var(--line);box-shadow:0 -12px 30px rgba(0,0,0,.12);animation:up .25s ease;max-height:78vh;overflow-y:auto}
.fb.good{border-top-color:var(--good);background:color-mix(in srgb,var(--good-soft) 70%,var(--surface))}
.fb.bad{border-top-color:var(--bad);background:color-mix(in srgb,var(--bad-soft) 60%,var(--surface))}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.fb-in{max-width:640px;margin:0 auto;display:grid;gap:12px}
.fb h3{font-family:var(--f-display);font-size:30px;font-weight:700;display:flex;align-items:baseline;gap:10px}
.fb.good h3{color:var(--good)} .fb.bad h3{color:var(--bad)}
.fb h3 small{font-family:var(--f-ui);font-size:15px;font-weight:800;color:var(--gold)}
.fb .ans{font-size:17px}
.fb .ans b{font-family:var(--f-display);font-size:24px}
.reteach{border-radius:14px;background:var(--surface);border:1px solid var(--line);padding:14px 16px;display:grid;gap:8px}
.reteach q{font-family:var(--f-display);font-weight:700;font-size:22px}
.reteach .pic{font-weight:700;color:var(--ink-2)}
.reteach .s{font-family:var(--f-read);font-size:16px;line-height:1.6}
details summary{cursor:pointer;font-weight:700;color:var(--teal)}
.note{font-size:14px;color:var(--ink-2);background:var(--gold-soft);border-radius:10px;padding:8px 12px}

.summary{text-align:center;display:grid;gap:14px;justify-items:center;padding-top:30px}
.summary .pau{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,18vw,120px);line-height:.9;color:var(--accent)}
.sumstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
@media (max-width:520px){.sumstats{grid-template-columns:repeat(2,1fr)}}
.lit{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.lit span{padding:6px 12px;border-radius:999px;background:var(--gold-soft);color:var(--ink);font-weight:700;font-family:var(--f-display);}

/* modal sheet */
.modal{position:fixed;inset:0;z-index:70;background:rgba(5,12,16,.55);display:grid;align-items:end;justify-items:center;padding-top:40px}
.modal-in{background:var(--bg);width:100%;max-width:700px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:up .25s ease}
@media (min-width:760px){.modal{align-items:center;padding:30px}.modal-in{border-radius:22px}}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;box-shadow:var(--shadow);animation:drop .3s ease;max-width:calc(100% - 32px);text-align:center}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}}
.warn{background:var(--gold-soft);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.burst{position:fixed;inset:0;pointer-events:none;z-index:80}
.foot{margin-top:8px;padding-block:22px 10px;border-top:1px solid var(--line);color:var(--muted);font-size:15px;display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between}
.foot a{color:var(--ink-2);font-weight:700;text-decoration-color:color-mix(in srgb,var(--accent) 60%,transparent);text-underline-offset:3px}
.foot a:hover{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Hoʻopaʻa <small>1,000 words</small></div>
    <div class="chips">
      <span class="chip sun" id="streakChip" title="Day streak"></span>
      <span class="chip xp" id="xpChip" title="Points today"></span>
    </div>
  </header>

<script type="application/json" id="word-data">[["v001","v",1,"hele","HEH-leh","to go, to come","Hey, Leh!",["There is a horse race at Kapiʻolani Park, and one of the racers is a rooster named Leh. He will not move. The gate opens and he just stands there pecking at a malasada.","Then Tūtū stands up in the bleachers, cups her hands and screams \"HEY, LEH!\" and the rooster takes off like a rocket. Feathers everywhere. The second she stops yelling, he stops dead. So she yells the whole race. \"HEY, LEH! HEY, LEH!\" He passes every horse and wins by a mile. Tūtū loses her voice for a week."],"Point at the door and yell \"Heh-leh!\" like you are launching that rooster.","Hele mai is come here. Hele aku is go away.",null,"Tūtū yelling \"Hey, Leh!\" at a racing rooster"],["v002","v",2,"hoʻi","HO-ee","to return, to go back home","Ho... ee!",["You throw a rubbah slippah like a boomerang down the beach. As it flies away it yells \"HO!\" At the very end it freezes in the air for half a second (that is the ʻokina), then it squeals \"EEE!\" and flies straight back and smacks you in the face.","No matter how far you throw that slippah, it always comes home. Ho... ʻi."],"\"Ho,\" tiny freeze, \"ee.\" Throw your arm out on the ho and flinch on the ee.","Hoʻi hou means come back again.",null,"Slippah boomerang, \"Ho... EE!\""],["v003","v",3,"holo","HO-lo","to run, to sail, to ride","Hollow!",["A giant hollow chocolate bunny is running the Honolulu Marathon. Because it is hollow, every step echoes inside its body. \"HOLLOW. HOLLOW. HOLLOW.\" At mile 10 it jumps on a surfboard and sails across the Ala Wai. At mile 20 it steals a moped and rides the rest of the way, still echoing.","Run, sail, ride. The hollow bunny does all three."],"Knock on your chest like it is hollow and say \"ho-lo\" with each knock.","Holoholo means to go out cruising for fun. That bunny is always holoholo.",null,"Hollow chocolate bunny running the marathon"],["v004","v",4,"lele","LEH-leh","to fly, to jump","Le-le!",["A flea the size of a chihuahua is playing a tiny ʻukulele. Every time it strums, it jumps so high it flies over Diamond Head. Strum, \"le-le,\" launch. Strum, \"le-le,\" launch. Pilots have to swerve around it.","The name ʻukulele is built from ʻuku, flea, and lele, jump, so it literally reads \"jumping flea.\" Why the instrument got that name is not settled. One popular explanation is fingers hopping across the strings like fleas."],"Hop in place and say \"leh-leh\" on each hop.",null,null,"Giant flea with a ʻukulele"],["v005","v",5,"kū","KOOOO","to stand","Kooooo!",["A pigeon on top of a bus stop refuses to sit. It stands at full attention like a palace guard, chest out, going \"KOOOOOOO\" for hours. People throw bread. It will not bend. A kid tries to push it over. It just keeps standing and cooing.","That long coo is the kahakō. Hold it."],"Stand up straight, chest out, and let out one long \"koooo.\"",null,null,"Pigeon at attention, \"Koooo\""],["v006","v",6,"noho","NO-ho","to sit, to stay, to live","No, Ho!",["Santa shows up at your house in July. He wants to keep moving. You point at a chair and say, like a strict parent, \"NO. HO.\" He sits. You say it again. He stays. By Christmas he has moved in, gets his own mail and hogs the remote.","Sit, stay, live. Santa did all three because you said \"No, Ho.\""],"Point at a chair. \"No. Ho.\"","Noho is also the word for chair.",null,"\"No, Ho!\" Santa moves in"],["v007","v",7,"piʻi","PEE-ee","to climb, to go up","Pee... ee!",["A little kid is climbing the Koko Head stairs and he really, really needs to pee. The only bathroom is at the very top. Every step up he whimpers \"PEE.\" At every landing he freezes, crosses his legs (the ʻokina), and squeaks \"EE!\" Then keeps climbing. Pee... ee. Pee... ee. All 1,048 steps."],"\"Pee,\" freeze, \"ee.\" Lift your knee on each one like you are climbing.","Piʻi is also used for anything rising, like water or prices.",null,"Kid who needs to pee on Koko Head stairs"],["v008","v",8,"iho","EE-ho","to go down","Eeee-ho!",["A paniolo rides an elevator down from the 40th floor like it is a bucking horse. The whole way down he waves his hat and yells \"EEEE-HO!\" The doors open in the lobby and he rides the elevator right out into the street.","The kid from piʻi is going up. The paniolo is going down."],"Wave an invisible hat. \"Ee-ho!\"",null,null,"Paniolo riding the elevator down, \"Ee-ho!\""],["v009","v",9,"hāʻule","haah-OO-leh","to fall","Haaa... Oo-leh!",["A guy climbs a coconut tree, loses his grip and falls in super slow motion. \"HAAAAAA\" as he lets go (that long ā). Then he hiccups in midair (the ʻokina). Then he lands flat on the back of a bull, and the whole crowd yells \"OO-LEH!\" like a bullfight.","Haaa. Hiccup. Oo-leh."],"Flop onto the couch while you say it.",null,null,"Coconut tree fall onto a bull, \"Oo-leh!\""],["v010","v",10,"ʻau","OW","to swim","Ow!",["You jump in the ocean and every single stroke, a tiny jellyfish stings you. \"ʻOW! ʻOW! ʻOW!\" But you are stubborn, so you swim all the way to Molokaʻi, yelling ow the whole way.","The little catch at the front is your throat closing for a split second before each ow."],"Do a freestyle stroke with your arm and say \"ow\" each time.","Say it twice and you get ʻauʻau, to bathe. That one is coming up soon.",null,"Jellyfish stings, \"Ow!\""],["v011","v",11,"ʻai","EYE","to eat","Eye!",["A giant eyeball with little legs walks into an all-you-can-eat buffet. It has no mouth, so it eats straight through its pupil. Spaghetti hanging out of the eye. Kalua pig disappearing into the eye. It blinks and a whole pan of mac salad is gone. The manager just watches, horrified."],"Point at your own eye and say \"eye\" while pretending to shovel food in.","ʻAi is also the word for food, especially poi.",null,"Eyeball at the buffet"],["v012","v",12,"inu","EE-noo","to drink","Ee! New!",["A camel walks into a juice bar. The bartender slides over a brand new flavor. The camel takes one sip, its eyes go wide and it screams \"EE! NEW!\" Then it drinks the whole blender. Then the ice machine. Then the fish tank. Every time it tastes something, \"EE! NEW!\""],"Tip back an invisible cup. \"Ee-noo!\"","Inu wai means drink water.",null,"Camel at the juice bar, \"Ee! New!\""],["v013","v",13,"moe","MO-eh","to sleep, to lie down","Mo... eh",["It is 3 in the morning and you are driving home on a dark two lane road. You come around a bend and there is a cow standing in the middle of the road. This thing is the size of a two story house. It has been awake for four straight days. Its eyes are bloodshot and it is swaying side to side like a palm tree in a windstorm.","You honk. The cow slowly lifts its giant head to moo at you. \"MOOOO...\" but it is so tired it cannot finish. Halfway through, its eyelids drop and the moo just dies into a long, sleepy \"...eh.\"","\"Mo... eh.\"","Its knees buckle, it tips over in slow motion and BOOM, the whole road bounces. Now it is snoring, and every snore sounds the same. \"Moe... moe... moe...\" You cannot get around it, so you climb onto its big warm belly and go to sleep too, rising and falling with every \"moe.\""],"In a sleepy cow voice. \"Mo-eh.\" Twice. Feel dumb. That is the point.","Moe also means to lie down, which is what the cow did. Hiamoe is to sleep or fall asleep, the moment its knees gave out. A dream you have while sleeping is moeʻuhane, whatever that cow is dreaming about on the road.","Picture a whole family asleep on one big mat after a long party. Every single snore comes out the same. \"Moe... moe... moe...\"","Giant cow too tired to finish its moo"],["v014","v",14,"ala","AH-lah","to wake up, to rise","Aaah-laaa!",["Your alarm clock is an opera singer who lives in your closet. At 5 a.m. the door bursts open and she belts \"AAAAH-LAAAAA!\" so loud your eyes pop open and the windows crack. She even wakes up the sleeping cow from moe, which stands up very confused in the middle of the road."],"Throw your arms open like an opera singer. \"Ahhh-lahhh!\"","Ala is also the word for road or path. Hoʻāla means to wake someone else up.",null,"Opera singer alarm clock"],["v015","v",15,"hanu","HAH-noo","to breathe","Haaa! New!",["A scuba diver runs out of air 60 feet down. He kicks like crazy, rockets to the surface, bursts out of the water and takes the biggest gasp of his life. \"HAAAA!\" Then he tastes that first breath and it is so fresh it is like brand \"NEW\" air.","Haaa. New."],"Big gasp in on \"hah,\" slow breath out on \"noo.\"",null,null,"Diver's first gasp of brand new air"],["v016","v",16,"ʻaki","AH-kee","to bite, to nip","Ah! Key!",["You drop your car key on the reef and a crab grabs it. You reach down. The crab nips your finger, a quick little snap, and lets go. You yell \"AH! KEY!\"","You reach again. Nip, let go. \"AH! KEY!\" Reach. Nip, let go. \"AH! KEY!\" It never holds on. It just snaps and backs off, like a tiny boxer with pinchers.","A crowd gathers on the reef. Every time your hand goes down, they all yell \"AH! KEY!\" with you. After forty tiny nips the crab gets bored and drops the key. Your fingers look like they were tickled by a stapler, but you drive home a hero."],"Pinch your own finger and yelp \"Ah-kee!\"","Nahu is the general word for a real bite, like a dog bite. ʻAki is the quick nip that lets go.",null,"Crab on your car key, \"Ah! Key!\""],["v017","v",17,"momoni","mo-MO-nee","to swallow","Mo money!",["Your piggy bank comes alive. It opens its mouth and yells \"MO MONEY!\" then swallows every coin on the table. Then your wallet. Then your credit cards. Then your car keys (the crab gives them up). It gets so round it rolls down the street, still yelling \"MO MONEY!\" and gulping everything in its path."],"Say \"mo-mo-nee\" and do a big exaggerated gulp at the end.","You will also see the shorter form moni.",null,"Piggy bank yelling \"Mo money!\""],["v018","v",18,"kuha","KOO-hah","to spit","Koo-hah!",["There is a llama at the petting zoo that knows karate. Every time it spits, it throws a karate chop and yells \"KOO-HAH!\" and a loogie flies 40 feet across the parking lot. Kids line up to watch. Parents are furious. The llama bows after every shot."],"Karate chop the air. \"Koo-HAH!\"",null,null,"Karate llama, \"Koo-HAH!\""],["v019","v",19,"ʻauʻau","ow-OW","to bathe","Ow-ow!",["Remember swimming with the jellyfish, ʻau, one ow? Now you get home and jump in a bath that is way too hot. \"OW-OW!\" Two ows. One ow is swimming in the ocean. Two ows is sitting in a hot tub that is cooking you like a lobster."],"Dip your toe in invisible hot water. \"Ow-ow!\"","Lumi ʻauʻau is the bathroom, the ow-ow room.",null,"Hot bath, \"Ow-ow!\""],["v020","v",20,"hoʻomaha","ho-oh-MAH-hah","to rest, to take a break","Whoa, Ma! Ha!",["Ma has worked 30 years without a day off. She finally gets to the beach, drops into a hammock and pulls her hat over her face. The whole family runs up and yells \"WHOA, MA!\" She does not move. She just laughs \"HA!\" and goes right back to resting.","Whoa, Ma. Ha."],"Lean back with your hands behind your head. \"Ho-ʻo-MAH-hah.\"","That is the hoʻo trick. Hoʻomaha is also used for a vacation.",null,"\"Whoa, Ma!\" \"Ha!\" in the hammock"],["v021","v",21,"ʻike","EE-keh","to see, to know","Eek! Eh!",["You put on a pair of magic glasses and suddenly you can see everything. Every germ on your phone. Every crumb in your keyboard. The tiny bugs living in your pillow, waving at you. You scream \"EEK! EH!\" and now you know way more than you ever wanted to.","Seeing and knowing are the same word. Once you see it, you know it."],"Pull back like you just saw something gross. \"Eek-eh!\"","ʻIke is also the word for knowledge.",null,"Germ-vision glasses, \"Eek, eh!\""],["v022","v",22,"nānā","naah-NAAH","to look, to watch","Nana!",["Your Nana sits by the front window with binoculars the size of a car engine. She watches the whole street all day. Who parked crooked. Who came home late. Who is dating who. When you try to sneak in at midnight, a spotlight clicks on and a voice sings \"Naaaah naaaah, I seeeee you.\"","Nana is always nānā. Hold both vowels long like she is stretching out her stare."],"Make binoculars with your hands. \"Naah-naah.\"","Nānā mai! means look here!",null,"Nana with binoculars"],["v023","v",23,"lohe","LO-heh","to hear","Low. Hey.",["There is a giant ear living under your house. It hears everything. You go to the far corner of the yard and whisper really low, \"hey.\" The ground rumbles and a deep voice from under the house says \"I HEARD THAT.\"","Low. Hey. The ear hears even a low hey."],"Whisper it low. \"Lo... heh.\"","Lohe can also mean to obey, like when you hear and actually do it.",null,"Giant ear hears a low \"hey\""],["v024","v",24,"hoʻolohe","ho-oh-LO-heh","to listen","Whoa... low, hey!",["Same giant ear under the house. But now it is trying hard. It cups a huge hand around itself and leans in. When it finally catches your whisper, it goes \"WHOA... low, hey!\"","Lohe is hear. Hoʻo makes it happen on purpose. Hearing on purpose is listening."],"Cup your hand behind your ear. \"Ho-ʻo-lo-heh.\"",null,null,"Giant ear leaning in, \"Whoa!\""],["v025","v",25,"honi","HO-nee","to kiss, to sniff, to smell","Honey",["A big brown bear walks up to a jar of honey, presses its nose right against the glass and takes a long sniff. Then it gives the jar a big kiss. Then it walks over to you, presses its nose to your nose, breathes in and whispers \"honey.\""],"Lean your nose toward something and say \"ho-nee.\"","The honi is the traditional greeting where two people touch noses and share breath. That is exactly what the bear did.",null,"Bear sniffing honey"],["v026","v",26,"pā","PAAAH","to touch","Paaaa!",["There is a fresh WET PAINT sign on the wall. Your Pa cannot stand it. He has to touch it. \"Paaaaa, don't!\" But he does. Then he touches the car. Then the dog. Then the ceiling. Everything in the house has Pa's handprint on it."],"Poke the table and drag out \"Paaah.\"","Pā is also a fence, a yard or a dish. In Hawaiian, even the wind can pā you.",null,"Pa touching wet paint"],["v027","v",27,"manaʻo","mah-NAH-oh","to think; a thought","Man... ah... ow!",["A caveman is trying to think for the very first time in human history. He squeezes his head with both hands, his face turns red, steam comes out of his ears and he groans \"MAN... AH... OW!\" Thinking hurts."],"Grab your head like it hurts. \"Man-ah-ow.\"","Manaʻo is also an opinion or idea. He aha kou manaʻo? means what do you think?",null,"Caveman, \"Man, ah, ow!\""],["v028","v",28,"hoʻomanaʻo","ho-oh-mah-NAH-oh","to remember","Whoa... man... ah... ow!",["Same caveman. He lost his club. He thinks so hard it hurts, \"man, ah, ow,\" and then a ghost floats through the wall and yells \"WHOA!\" The shock knocks the memory loose. \"WHOA... MAN... AH... OW! It's under the rock!\"","Think plus hoʻo. Making the thought come back is remembering."],"Snap your fingers on the end. \"Ho-ʻo-mah-NAH-oh!\"",null,null,"Ghost jolts the caveman's memory"],["v029","v",29,"poina","po-EE-nah","to forget","Poi? Nah.",["You are at a lūʻau. Aunty offers you poi. You say \"Poi? Nah.\" Five seconds later you forget you said that. She offers again. \"Poi? Nah.\" You forget again. This goes on for three hours. \"Poi? Nah.\" \"Poi? Nah.\" By the end of the night Aunty is crying and you still have no idea what happened."],"Wave off an invisible bowl. \"Poi? Nah.\"",null,null,"\"Poi? Nah.\" on repeat"],["v030","v",30,"hoʻomaopopo","ho-oh-mah-oh-PO-po","to understand","Whoa... my... oh... Popo!",["Your Popo is teaching you how to use the TV remote for the 40th time. Blank stare. She shows you again. Blank stare. Then on the 41st try, a light bulb goes on over your head and you shout \"WHOA... MY... OH... POPO!\" You finally get it."],"Slap your forehead. \"Ho-ʻo-mao-PO-po!\"","Maopopo on its own means clear or understood. Maopopo iaʻu means I understand.",null,"\"Whoa, my, oh, Popo!\""],["v031","v",31,"ʻōlelo","oh-LEH-lo","to speak, to say; language","Oh, hello!",["There is a parrot that only knows two words. \"OH, HELLO.\" It says it to everyone. The mailman. The dog. The refrigerator. Somehow it gets booked as the keynote speaker at a giant conference. It walks out on stage, the lights hit, 5,000 people lean in, and it says \"OHHH, HELLO.\" Standing ovation.","Oh-hello, pushed together, is ʻōlelo. Stretch the first O."],"Wave like you are meeting a crowd. \"Oh-LEH-lo.\"","ʻŌlelo Hawaiʻi is the Hawaiian language.",null,"Parrot keynote, \"Oh, hello\""],["v032","v",32,"haʻi","HAH-ee","to tell","Hah... ee!",["There is an aunty at Longs who cannot keep a secret. She walks up to you and says \"Hah... ee!\" like \"Hi!\" but with a little catch, and before you can say anything back she tells you everything. Who got married. Who got divorced. What your cousin did at graduation. You only came in for toothpaste.","Every story starts with that \"Hah-ee.\""],"Lean in like you have gossip. \"Hah-ee.\"","Haʻi ʻōlelo is a speech.",null,"Gossip aunty at Longs"],["v033","v",33,"nīnau","nee-NOW","to ask","Knee now!",["A toddler is hanging onto your knee like a koala. Every two seconds she tugs and asks a question. \"Why is the sky blue? Can we go now? KNEE NOW? KNEE NOW?\" She will not let go of your knee until you answer, and she wants the answer now."],"Tap your knee. \"Knee-now?\" Hold the \"nee\" a little long for the kahakō.","Nīnau is also the word for a question.",null,"Toddler on your knee, \"Knee now?\""],["v034","v",34,"pane","PAH-neh","to answer","Pan, eh!",["You are on a game show where the only way to answer is to smack a frying pan with a spoon. BONG! \"PAN, EH!\" Every contestant is slamming pans. The host asks the capital of Hawaiʻi. BONG! \"PAN, EH! Honolulu!\" The studio is so loud people in the audience are wearing earmuffs."],"Smack the table like a buzzer. \"Pah-neh!\"",null,null,"Frying pan buzzer game show"],["v035","v",35,"kāhea","kaah-HEH-ah","to call","Car! Hey! Ah!",["You call your car like a dog. You stand in the driveway, whistle and yell \"CAR! HEY! AH!\" Your car starts itself, its headlights blink like happy eyes, and it rolls over and nuzzles your leg. The neighbors film the whole thing."],"Hands around your mouth. \"Kaah-HEH-ah!\"",null,null,"\"Car! Hey! Ah!\""],["v036","v",36,"kamaʻilio","kah-mah-ee-LEE-oh","to chat, to talk story","Come, my Leo",["There is a lion named Leo sitting alone at a coffee shop. You pat the chair next to you and say \"Come, my Leo.\" He sits down and the two of you talk story for six hours. He tells you about his ex. You tell him about work. The barista keeps refilling the lion's latte.","Come-my-Leo, said fast, is kamaʻilio."],"Pat the seat next to you. \"Kah-mah-ʻee-lee-oh.\"",null,null,"\"Come, my Leo\" lion at the coffee shop"],["v037","v",37,"ʻae","AH-eh, sounds like \"eye\"","yes, to agree","Aye!",["A pirate ship is voting on everything. \"Should we eat lunch?\" \"ʻAE!\" \"Should we paint the ship pink?\" \"ʻAE!\" \"Should we give the parrot from ʻōlelo a raise?\" \"ʻAE!\" They agree to every single thing, and by sunset the ship is pink and the parrot is the captain."],"Pirate voice, fist in the air. \"ʻAe!\"",null,null,"Pirates voting \"Aye!\""],["v038","v",38,"hōʻole","hoh-OH-leh","to refuse, to deny, to say no","Ho! ʻOle!",["There is a haunted golf hole at the course. Every time someone putts, the ball rolls right up to the hole, and the hole spits it back out and shouts \"HO! ʻOLE!\" It refuses every ball. Pros cry. Nobody has ever scored on it."],"Shake your head hard. \"Hoh-OH-leh.\"","ʻOle means not, without or zero. Hōʻole is the hoʻo trick again, making something a \"no.\"",null,"Haunted golf hole spits the ball out"],["v039","v",39,"hoʻohiki","ho-oh-HEE-kee","to promise, to swear","Whoa... hee-kee!",["A gecko on your kitchen wall makes you a pinky promise. It swears it will eat every cockroach in the house. But every time it makes a promise, it hiccups. \"WHOA... HEE-KEE!\" It raises its tiny pinky, hiccups again, and then eats a cockroach the size of a slipper to prove it."],"Hold up your pinky and hiccup. \"Ho-ʻo-HEE-kee.\"",null,null,"Hiccuping gecko pinky promise"],["v040","v",40,"hoʻopunipuni","ho-oh-poo-nee-POO-nee","to lie, to fool someone","Whoa... puny puny!",["A guy comes back from fishing and says he caught a 400 pound marlin. Then he opens his cooler. It is a fish the size of a french fry. Everybody on the pier looks in and says \"WHOA... PUNY PUNY.\" He keeps insisting it is a marlin. Nobody believes him ever again."],"Hold your fingers an inch apart. \"Ho-ʻo-puny-PUNY.\"","Punipuni on its own means fake or a lie.",null,"Puny fish, \"marlin\""],["v041","v",41,"aloha","ah-LO-hah","to love, to greet","A... low... haaa",["You already know this one, but here is a picture anyway. A humpback whale pulls up next to your kayak and sings one deep, low note that shakes your whole body. \"A... LOW... HAAAA.\" Then it gently bumps your kayak with its nose like a hug. You feel loved by a 40 ton animal.","A low ha. Aloha."],"Deep whale voice. \"Ah-LOW-hah.\"",null,null,"Whale's \"a low ha\""],["v042","v",42,"makemake","mah-keh-MAH-keh","to want, to like","Mah-keh-mah-keh!",["Warning. This is not the English word \"make.\" Every vowel gets said.","A toddler is in a coffee shop throwing a tantrum on the floor because she wants a mocha. She is kicking and screaming \"MAH-KEH-MAH-KEH! MAH-KEH-MAH-KEH!\" which sounds a lot like \"mocha mocha.\" The barista gives up and makes her one. She wants another."],"Stomp your feet on each beat. \"Mah-keh-MAH-keh!\"","Makemake au i ka poi means I want poi.",null,"Toddler screaming for a mocha"],["v043","v",43,"ʻakaʻaka","ah-kah-AH-kah","to laugh","Ah-ka ah-ka!",["There is a crow on the power line that laughs at everybody. Someone trips on the sidewalk. \"AH-KA AH-KA!\" Someone drops their plate lunch. \"AH-KA AH-KA!\" Someone walks into a glass door. The crow laughs so hard it falls off the wire, and now the whole street laughs back at it."],"Flap your arms. \"Ah-kah-AH-kah!\"",null,null,"Crow cackling at people who trip"],["v044","v",44,"uē","oo-EHHH","to cry","Ooo-ehhh!",["An ambulance comes screaming down the street, but when it stops, there is no siren. It is a giant baby strapped to the roof, crying. \"OOO-EHHHHHH! OOO-EHHHHHH!\" Cars pull over. Dogs howl along. The baby will not stop until somebody gives it a pacifier the size of a surfboard."],"Siren voice, long on the end. \"Oo-ehhhh.\"",null,null,"Baby siren on the ambulance"],["v045","v",45,"minoʻaka","mee-no-AH-kah","to smile","Me? No ʻaka.",["That laughing crow from ʻakaʻaka? Now it is stuck in a library. It sees a man trip over a book cart and it wants to laugh so bad, but the librarian is glaring. So it just smiles, a huge silent beak grin. It thinks \"Me? No ʻaka.\" Me, no laugh. Just a smile."],"Big closed-mouth grin, then whisper \"mee-no-AH-kah.\"",null,null,"Crow in the library, \"Me? No ʻaka\""],["v046","v",46,"huhū","hoo-HOOO","to be angry","Hoo-hoooo!",["An owl is furious. Somebody took its branch. Its feathers puff up to twice its size, steam shoots out of its ears and it screams \"HOO-HOOOOOO!\" The second hoo is extra long because it is extra mad."],"Scrunch your face and cross your arms. \"Hoo-HOOOO.\"",null,null,"Furious owl"],["v047","v",47,"hauʻoli","how-OH-lee","to be happy","How, Ollie?!",["Your dog Ollie is so happy to see you that his tail wags hard enough to lift him off the ground like a helicopter. He floats around the living room knocking over lamps. You just stand there and ask \"HOW, OLLIE?!\""],"Big smile, arms wide. \"How-OH-lee!\"","Hauʻoli lā hānau means happy birthday.",null,"\"How, Ollie?!\" helicopter tail"],["v048","v",48,"makaʻu","mah-KAH-oo","to be afraid","Ma! Cow!",["Remember the giant sleepy cow from moe? A little kid is walking past, and the cow suddenly wakes up and stands. Two stories tall. The kid runs screaming to his mom, \"MA! COW! MA! COW!\" He hides behind her, shaking.","Ma, cow. Makaʻu. The little catch before the last \"oo\" is the kid gulping."],"Shaky voice, hands up. \"Mah-KAH... oo.\"",null,null,"\"Ma! Cow!\""],["v049","v",49,"hopohopo","ho-po-HO-po","to worry","Hopper, hopper",["A grasshopper is pacing in the kitchen. Hop to the left. Hop to the right. Did it leave the stove on? Did it lock the door? Is the lizard from hoʻohiki coming? \"Hopper, hopper, hopper, hopper.\" It cannot stop hopping back and forth, worrying."],"Shift your weight side to side. \"Ho-po-HO-po.\"",null,null,"Pacing grasshopper"],["v050","v",50,"hilahila","hee-lah-HEE-lah","to be shy, embarrassed","Hee-la, hee-la",["A huge tough-looking football player bends over to tie his shoe and his pants rip right down the back in front of the whole stadium. His face turns bright red. He covers his face with his helmet and giggles \"hee-la, hee-la\" while tiptoeing off the field."],"Cover your face and giggle. \"Hee-lah-HEE-lah.\"","You will hear this one a lot in local English. \"No be hilahila.\"",null,"Ripped pants, \"hee-la hee-la\""],["v051","v",51,"hana","HAH-nah","to do, to make, to work","Hannah!",["Hannah is a robot with eight arms who cannot stop working. She builds a house before breakfast. She fixes your car during lunch. At night she is still going, knitting a sweater for the sleepy cow. Her boss begs her to stop. \"Hannah, please!\" She just keeps making things."],"Pretend to hammer. \"Hah-nah, hah-nah.\"","Hana hou means do it again, the encore shout at a concert. Careful, Hāna the town on Maui has a long ā. The verb is short.",null,"Hannah the eight-armed robot"],["v052","v",52,"lawe","LAH-veh","to take, to carry","Lava!",["A tourist at the volcano scoops up a bucket of glowing hot lava and carries it back to his hotel room. \"LAVA! I'm taking LAVA!\" He carries it through the lobby, into the elevator and onto his bed. The bed catches fire. The hotel catches fire. He is still carrying it.","Lava sounds like lawe. And yes, you should never take lava rocks home."],"Pretend to carry something heavy and hot. \"LAH-veh!\"",null,null,"Tourist carrying lava"],["v053","v",53,"hāʻawi","haah-AH-vee","to give","Harvey!",["There is a guy named Harvey who gives away everything. His car. His house. His couch. His shoes. His pants. He stands on the corner in his boxers handing out his last sandwich. Every time he hands something over, he laughs \"HAAAH\" and then hiccups before the \"vee.\"","Haaah, hiccup, vee. Harvey."],"Hold out your hand like you are offering something. \"Haah-AH-vee.\"",null,null,"Harvey gives away his pants"],["v054","v",54,"kiʻi","KEE-ee","to fetch, to go get","Key-ee!",["You send your dog to fetch your keys. It sprints off, comes back 3 seconds later, drops them in your hand and squeals \"KEY-EE!\" Then it goes and fetches everyone else's keys too. By noon the whole neighborhood is locked out and your dog is sitting on a mountain of keys."],"Point like you are sending the dog. \"Kee-ee!\"","Kiʻi is also the word for a picture or statue.",null,"Dog fetching keys, \"Key-ee!\""],["v055","v",55,"hopu","HO-poo","to catch, to grab","Ho-poo!",["An octopus is playing basketball. Every shot anybody takes, one of its eight arms shoots out and catches the ball. It yells \"HOOP!\" every time it grabs one, but it cannot say the P cleanly so it comes out \"HO-POO!\" Nobody on the other team scores all season."],"Snatch the air. \"Ho-poo!\"",null,null,"Octopus basketball, \"Ho-poo!\""],["v056","v",56,"kiola","kee-OH-lah","to throw away, to toss","Kee-oh-lah!",["A kid in the back seat on a road trip gets mad and starts tossing crayons out the window, one after another. \"Kee-OH-lah! Kee-OH-lah!\" It rhymes with Crayola. By the time the car reaches the North Shore, there is a rainbow trail of crayons all the way back to town."],"Flick your wrist like you are tossing something. \"Kee-OH-lah!\"",null,null,"Crayons out the car window"],["v057","v",57,"huki","HOO-kee","to pull","Hook-ee!",["A fisherman hooks a fish, but the fish is stronger. The fish pulls him off the pier, across the bay, and out to sea on water skis made of slippers. The whole way the fish is yelling \"HOOK-EE! HOOK-EE!\" and pulling harder."],"Pull an invisible rope with both hands. \"Hoo-kee!\"","Huki and pahu (next) are the pull and push pair.",null,"Fish pulls the fisherman, \"Hook-ee!\""],["v058","v",58,"pahu","PAH-hoo","to push","Pa, who?",["Your Pa is pushing a giant drum up a hill. It is taller than a truck. He is sweating and grunting. The neighbors come out and ask \"PA, WHO? Who told you to do this?\" He cannot answer. He just keeps pushing. The drum rolls back and flattens him. He gets up and pushes again."],"Push your palms forward. \"Pah-hoo!\"","Pahu is also the word for a drum or a box. That is why Pa is pushing a drum.",null,"Pa pushing a giant drum, \"Pa, who?\""],["v059","v",59,"hāpai","haah-PIE","to lift, to carry","Haaah... pie!",["A waiter comes out of the kitchen lifting a pie the size of a trampoline over his head. His arms are shaking. He groans \"HAAAAH...\" and then shouts \"PIE!\" as he lifts it the last inch. Then he carries it across the restaurant without dropping a crumb."],"Lift your arms overhead. \"Haaah-PIE!\"","Hāpai also means pregnant, carrying a baby.",null,"Waiter lifting a giant pie"],["v060","v",60,"ʻoki","OH-kee","to cut","Okie!",["A barber with scissors the size of hedge clippers says \"OKIE\" every time he snips. \"Okie.\" Snip. \"Okie.\" Snip. You only wanted a trim. He keeps saying okie. Now you are bald and so are both of your eyebrows. \"Okie dokie,\" he says, and hands you a mirror."],"Scissor your fingers. \"Oh-kee. Oh-kee.\"","ʻOkiʻoki means to cut into pieces.",null,"\"Okie\" barber"],["v061","v",61,"kuke","KOO-keh","to cook","Koo-keh!",["This one came into Hawaiian from English, so it is a gift. Picture a chef who can only cook cookies. You order a steak, you get a cookie shaped like a steak. You order soup, you get a bowl of melted cookie. He shouts \"KOO-KEH!\" every time he pulls a tray out of the oven."],"Pull an invisible tray out of the oven. \"Koo-keh!\"",null,null,"Chef who only makes cookies"],["v062","v",62,"holoi","ho-LO-ee","to wash","Hollow-eeee!",["The hollow chocolate bunny from holo finished its marathon and it is filthy. It climbs into the washing machine. The spin cycle kicks on and the bunny screams \"HOLLOW-EEEEE!\" as it whips around. The machine shakes so hard it walks across the laundry room and out the front door.","Holo plus a scream. Holoi."],"Scrub the air in circles. \"Ho-LO-ee!\"","Holoi pā means wash the dishes. Pā is dish.",null,"Hollow bunny in the spin cycle"],["v063","v",63,"kanu","KAH-noo","to plant, to bury","Canoe!",["A farmer digs a hole in the loʻi and plants a whole canoe like it is a seed. Waters it. Next morning, a giant canoe tree has shot up, and there are baby canoes hanging off every branch like mangoes. People come with ladders to pick them.","Canoe sounds like kanu."],"Pat the dirt down. \"Kah-noo.\"","Kanu also means to bury.",null,"Canoe tree"],["v064","v",64,"ʻohi","OH-hee","to gather, to harvest, to pick up","Oh, hee hee hee!",["You are under a mango tree and a storm shakes it. Mangoes start raining down on your head. Bonk. Bonk. Bonk. Instead of running, you start gathering them in your shirt, giggling like a kid. \"OH, HEE HEE HEE!\" Your shirt is so full you can barely walk."],"Scoop with both arms and giggle. \"Oh-hee!\"",null,null,"Mango rain, \"Oh, hee hee!\""],["v065","v",65,"ʻeli","EH-lee","to dig","Eh, Ellie!",["Ellie the elephant is at Waikīkī digging with her trunk. She digs so deep she hits water, then lava, then comes out the other side of the world in a rice field. A farmer looks down the hole and yells \"EH, ELLIE!\""],"Shovel motion. \"Eh-lee!\"",null,null,"Ellie the elephant digging"],["v066","v",66,"kuʻi","KOO-ee","to pound (like poi), to punch","Koo... ee!",["A kung fu master is pounding kalo on a board with a stone poi pounder. Every strike he yells \"KOO... EE!\" with a sharp catch in the middle, like a karate move. The poi comes out so smooth that people line up around the block."],"Pound your fist on your palm. \"Koo-ee!\"","Kuʻi also means to punch. Kuʻi ʻai is pounding poi.",null,"Kung fu poi pounder"],["v067","v",67,"mālama","maah-LAH-mah","to take care of, to protect","Ma, llama!",["Your mom adopts a llama and treats it better than any of her kids. It gets the good bedroom. She tucks it in. She brushes its hair. She makes it musubi. You walk in and she yells \"SHHH! Maaaa... LLAMA is sleeping!\"","Ma, llama. Mālama."],"Pet the air gently. \"Maah-LAH-mah.\"","Mālama ʻāina means care for the land.",null,"\"Ma, llama!\""],["v068","v",68,"kūkulu","koo-KOO-loo","to build","Cuckoo-loo!",["A cuckoo bird pops out of a clock, puts on a hard hat and starts building a bathroom (a \"loo\") in your backyard. It is 30 stories tall. Every time it hammers a nail it sings \"CUCKOO-LOO!\" The city tries to stop it. It keeps building."],"Hammer with each syllable. \"Koo-KOO-loo.\"",null,null,"Cuckoo building a 30 story loo"],["v069","v",69,"wehe","VEH-heh","to open","Veh-heh-heh-heh!",["There is a pickle jar that nobody can open. The strongest guy in town tries. Nothing. Then a tiny grandma walks up and twists it open with one finger. The jar lid laughs at everyone who failed. \"VEH-HEH-HEH-HEH!\""],"Twist an invisible lid, then laugh. \"Veh-heh!\"","Wehe and pani (next) are the open and close pair.",null,"Laughing pickle jar"],["v070","v",70,"pani","PAH-nee","to close, to shut","Pa! Knee!",["Pa is sneaking a midnight snack. He hears footsteps and slams the fridge door shut, right on his own knee. \"PA! KNEE!\" he screams. He hops around the kitchen holding it. Every time he closes a door for the rest of his life, he checks his knee first."],"Slam an invisible door. \"Pah-nee!\"","Pani also means to replace or substitute.",null,"Fridge door on Pa's knee"],["v071","v",71,"hoʻomaka","ho-oh-MAH-kah","to begin, to start","Whoa, Ma, car!",["It is the start of a drag race. In lane one is a souped up truck. In lane two is your Ma, 78 years old, in a shopping cart with a jet engine strapped to the back. The flag drops. The engine roars and the whole crowd screams \"WHOA, MA, CAR!\" as she blasts off the line.","Whoa, Ma, car. Hoʻomaka."],"Drop an invisible starting flag. \"Ho-ʻo-MAH-kah!\"",null,null,"\"Whoa, Ma, car!\" drag race"],["v072","v",72,"pau","POW","to be done, finished","Pow!",["Every time you finish anything, a giant comic book bubble explodes over your head. \"POW!\" Last dish washed. POW! Last email sent. POW! Last bite of poi. POW! By the end of the day your house is covered in comic book explosions."],"Punch the air. \"Pau!\"","Pau hana means done with work. You probably already know that one.",null,"Comic book \"POW!\""],["v073","v",73,"kali","KAH-lee","to wait","Collie!",["A collie dog is sitting at a bus stop in Kalihi. It has been waiting there for 17 years. Its fur is gray. It has a little beard now. People bring it food. Buses come and go. It will not get on. It is waiting for something, and it will keep waiting. Collie. Kali."],"Tap your wrist like you are checking a watch. \"Kah-lee.\"","Kali iki means wait a little.",null,"Collie at the Kalihi bus stop"],["v074","v",74,"hoʻāʻo","ho-AAH-oh","to try, to taste, to test","Whoa! Aaah! Ow!",["You try a ghost pepper on a dare. First you say \"WHOA\" because it looks tiny. Then you bite. Your face melts. \"AAAAH!\" Then the burn hits your throat. \"OW!\" Whoa. Aah. Ow. You try it again anyway because you are stubborn.","The catches in this word are you choking on the heat."],"Fan your mouth. \"Ho, AAH, oh.\"",null,null,"Ghost pepper, \"Whoa, aah, ow!\""],["v075","v",75,"hiki","HEE-kee","to be able, can; to arrive","Hiki nō!",["A tiny mouse shows up at your house to move your piano. You laugh. The mouse cracks its knuckles, says \"HIKI NŌ,\" and carries the whole piano up three flights of stairs on its back. It arrives upstairs, sets it down and plays a song.","Can do, and it arrived."],"Flex your arm. \"Hee-kee nō!\"","Hiki nō means can do, no problem. Hiki also means to arrive, like the mouse getting upstairs.",null,"Mouse moving the piano, \"Hiki nō!\""],["v076","v",76,"puka","POO-kah","to come out, to exit; to graduate","Poo-kah!",["A field is full of holes. Out of every hole pops a gopher wearing a graduation cap. \"POO-KAH!\" Pop. \"POO-KAH!\" Pop. They throw their caps in the air and dive back in. It is the world's weirdest graduation ceremony."],"Pop your head up like a gopher. \"Poo-kah!\"","Puka is also a hole, like a puka shell. Coming out of a hole is puka. Graduating is also puka.",null,"Gophers in graduation caps"],["v077","v",77,"komo","KO-mo","to enter; to put on clothes","Come, oh!",["There is a door at a party with a sign on it. Every time someone walks in, the door yells \"COME, OH!\" and a robot arm shoves a ridiculous outfit onto them. A banana suit. A tutu. A hat shaped like a spam musubi. You cannot enter unless you put something on.","Enter and wear. Same word."],"Step through a doorway. \"Ko-mo.\"","E komo mai means welcome, come on in.",null,"\"Come, oh!\" door with costumes"],["v078","v",78,"haʻalele","hah-ah-LEH-leh","to leave, to abandon","Ha! Ah! Lele!",["You are at the most boring party of all time. You grab the jumping flea with the ʻukulele from lele, laugh \"HA!\", gasp \"AH!\" and jump out the window. \"LELE!\" You fly over Diamond Head and never come back.","Ha, ah, lele. You left."],"Pretend to jump out a window. \"Hah-ah-LEH-leh!\"",null,null,"\"Ha, ah, lele!\" out the window"],["v079","v",79,"waiho","WHY-ho","to leave something, to put down","Why, Ho?",["Santa from noho finally moves out of your house. On his way out, he dumps all his presents in the middle of the street and just walks off. You chase him and yell \"WHY, HO? WHY?\" He does not answer. He just left them there.","Why, Ho. Waiho."],"Drop something on the table. \"Why-ho.\"","Haʻalele is you leaving. Waiho is you leaving something behind.",null,"\"Why, Ho?\" Santa dumps presents"],["v080","v",80,"hoʻouna","ho-oh-OO-nah","to send","Whoa, Oona!",["The post office fired all its workers and replaced them with a pelican named Oona. You hand her a letter and she swallows it and flies off. You hand her a couch and she swallows that too. Every time someone sends something, the whole line yells \"WHOA, OONA!\""],"Toss an invisible letter into the sky. \"Ho-ʻo-OO-nah!\"",null,null,"Pelican mail carrier, \"Whoa, Oona!\""],["v081","v",81,"kōkua","koh-KOO-ah","to help","Cocoa!",["A lifeguard at Hanauma Bay does not use a rescue board. When someone is in trouble, he throws them a giant steaming mug of hot cocoa. It floats. They grab it and he reels them in. Every rescue he yells \"COCOA!\" and the whole beach cheers.","Cocoa, stretched out, is kōkua."],"Hold out an invisible mug. \"Koh-KOO-ah!\"","You will see \"Please kōkua\" on signs all over Hawaiʻi.",null,"Lifeguard throwing hot cocoa"],["v082","v",82,"aʻo","AH-oh","to learn, to teach","Ah... oh!",["An owl teacher stands in front of a class of mongooses. She explains something, and the second a student gets it, its eyes go wide and it says \"AH... OH!\" Then that student turns around and teaches the one behind it, who also goes \"AH... OH!\" The whole room is a chain of light bulbs.","Learning and teaching are the same word. That \"ah, oh\" moment goes both ways."],"Raise your eyebrows like you just got it. \"Ah... oh!\"","Kumu is teacher. Haumāna is student.",null,"Owl class, \"Ah... oh!\""],["v083","v",83,"heluhelu","heh-loo-HEH-loo","to read","Hello hello!",["You open a library book and it says \"HELLO HELLO!\" in a squeaky voice. Every page you turn, it says it again. \"HELLO HELLO!\" You try to read quietly. The librarian keeps shushing the book. You finish the whole thing in one night just to make it stop."],"Open your hands like a book. \"Heh-loo-HEH-loo.\"","Helu alone means to count. Reading is counting your way through the words.",null,"Book that says \"Hello hello!\""],["v084","v",84,"kākau","kaah-KOW","to write","Car! Cow!",["A cow breaks into a parking lot with a can of spray paint tied to its tail. It swishes its tail and writes its name on every car. The owners come out screaming \"CAR! COW!\" The cow has beautiful handwriting.","Car, cow. Kākau."],"Write in the air with your finger. \"Kaah-kow.\"","Kākau is also the traditional word for tattoo, writing on skin.",null,"Cow writing on cars, \"Car! Cow!\""],["v085","v",85,"kūʻai","koo-EYE","to buy, to sell","Cool eye, yeah?",["There is a store at the mall that only sells glass eyeballs. Remember the eating eyeball from ʻai? This is its cousin. You walk in, the eyeballs all turn to look at you, and the cashier says \"Cool eye, yeah?\" You buy one. Then you sell it back. Then buy it again."],"Hand over invisible money. \"Koo-eye.\"","Kūʻai mai is to buy (the thing comes to you). Kūʻai aku is to sell (the thing going away).",null,"Glass eyeball store, \"Cool eye\""],["v086","v",86,"uku","OO-koo","to pay","Oooh... coo.",["A pigeon walks up to the register at a plate lunch place. It orders a loco moco. When the cashier asks for money, the pigeon pays in bread crumbs, one at a time. The cashier counts them and says \"Oooh... coo.\" Paid in full.","This is the same pigeon from kū. It stopped standing long enough to eat."],"Count out invisible coins. \"Oo-koo.\"","Careful. ʻUku with an ʻokina is a flea, like in ʻukulele. Uku without it is pay.",null,"Pigeon paying in crumbs, \"Oooh, coo\""],["v087","v",87,"ʻimi","EE-mee","to seek, to look for","Ee-mee?",["A kid is playing hide and seek, but he is the one who is lost. He is running through the house yelling \"EE-MEE? EE-MEE?\" like he is calling for someone named Emmy. Nobody is named Emmy. He is just searching for everyone."],"Hand over your eyes like a lookout. \"Ee-mee?\"","ʻImi naʻauao means to seek knowledge.",null,"Kid searching for \"Emmy\""],["v088","v",88,"loaʻa","lo-AH-ah","to get, to have, to find","Low... ah! Ah!",["A treasure diver goes low, low, low to the bottom of the ocean. Down there she finds a chest, opens it, and it is full of gold. \"LOW... AH! AH!\" she screams into her regulator, so loud a turtle swims over to look."],"Pretend to open a chest. \"Lo-AH-ah!\"","Loaʻa works backward from English. Loaʻa iaʻu means I have it, or literally, it was gotten by me.",null,"Diver finds treasure, \"Low, ah ah!\""],["v089","v",89,"ʻaihue","eye-HOO-eh","to steal","I? Who, eh?",["A guy is caught walking out of your house carrying your TV, your fridge and your dog. You point at him. He looks around with the most innocent face in history and says \"I? WHO, EH?\"","I, who, eh. ʻAihue."],"Point at yourself with fake innocence. \"Eye-HOO-eh?\"",null,null,"Thief says \"I? Who, eh?\""],["v090","v",90,"hui","HOO-ee","to join, to meet, to gather","Hoo-ee!",["Two canoe clubs are on opposite ends of the beach. One paddler cups his hands and yells \"HOO-EE!\" The other side yells it back. Everyone runs to the middle and joins into one giant club. By sunset the whole beach is one team."],"Wave people over. \"Hoo-ee!\"","Hui as a noun is a club, group or company. You see it in names all over Hawaiʻi.",null,"Canoe clubs yelling \"Hoo-ee!\""],["v091","v",91,"pāʻani","paah-AH-nee","to play","Paaa! Annie!",["Pa and his little girl Annie are playing tag at a family party. Pa is 300 pounds and slow. Annie is fast. She tags him and runs. He chases her through the buffet line, over the cooler and through the bouncy house, yelling \"PAAA! ANNIE!\" every time he misses.","Pa, Annie. Pāʻani."],"Tag the person next to you. \"Paah-ah-nee!\"",null,null,"\"Pa! Annie!\" playing tag"],["v092","v",92,"hula","HOO-lah","to dance hula","Hula hoop!",["A 90 year old uncle gets up at a party and starts spinning 50 hula hoops at once. Arms, legs, neck, all of them. Then he stops, drops every hoop, and does a slow, perfect hula that makes the whole room cry.","Hula is the dance and it is also the verb, to dance it."],"Sway your hips. \"Hoo-lah.\"",null,null,"Uncle with 50 hula hoops"],["v093","v",93,"mele","MEH-leh","to sing, to chant; a song","Merry!",["It is December and a choir of carolers shows up on your lawn in aloha shirts. They sing \"Mele Kalikimaka\" so loud that snow starts falling on Honolulu. Tourists panic. The carolers keep singing.","Mele is the \"merry\" in that song, but on its own it means song, and to sing."],"Sing it. \"Meh-leh!\"",null,null,"Carolers make it snow"],["v094","v",94,"hoʻokani","ho-oh-KAH-nee","to play music","Whoa, Connie!",["Connie picks up a ʻukulele at a backyard party and plays so fast the strings catch fire. The whole party yells \"WHOA, CONNIE!\" She does not stop. She switches to a steel guitar. It also catches fire. The fire department shows up and starts dancing.","Whoa, Connie. Hoʻokani."],"Strum an air ʻukulele. \"Ho-ʻo-KAH-nee!\"","Kani means to make a sound, so hoʻokani is making it sound. Hoʻokani pila means play music.",null,"\"Whoa, Connie!\" flaming ʻukulele"],["v095","v",95,"mahalo","mah-HAH-lo","to thank, to admire","Ma... hollow!",["The hollow chocolate bunny from holo shows up at your mom's door with flowers. She is so touched she hugs it and says \"Ma... HOLLOW! Thank you!\" The hug is a little too tight and the bunny cracks. She thanks it anyway.","Ma, hollow. Mahalo."],"Hand on your heart. \"Mah-HAH-lo.\"",null,null,"\"Ma, hollow!\" bunny gets a hug"],["v096","v",96,"pule","POO-leh","to pray","Pooo-leh!",["It is the Saturday before Christmas at Ala Moana and you have been circling the parking lot for an hour. You finally put your hands together and pray for a stall. You pray so hard your car starts to float. \"POOO-LEH!\" A spot opens right in front of you."],"Hands together. \"Poo-leh.\"","Pule also means week. Lāpule, Sunday, is literally prayer day, and one explanation is that the week was counted from one church day to the next.",null,"Praying for parking at Ala Moana"],["v097","v",97,"hānau","haah-NOW","to give birth, to be born","Haaah! Now!",["A baby is born already talking. The doctor holds her up and she looks around the room, laughs \"HAAAH!\" and then demands \"NOW! Milk NOW! Phone NOW!\"","Haah, now. Hānau."],"Arms up like a newborn. \"Haah-NOW!\"","Lā hānau is a birthday. Remember hauʻoli lā hānau? Happy birthday.",null,"Newborn yelling \"Haah! Now!\""],["v098","v",98,"ola","OH-lah","to live, to be healthy, to heal","Hola!",["A skeleton is lying in a museum case. Somebody sneezes. The skeleton sits up, looks around, jumps out of the case and waves at everyone. \"HOLA!\" It is alive. It dances out the front door. Spanish \"hola\" has a silent H, and it sounds just like ola."],"Wave hello. \"Oh-lah!\"","Ola is also the word for life and health.",null,"Skeleton says \"Hola!\""],["v099","v",99,"make","MAH-keh","to die, to be dead","Mah... keh...",["Warning. This is not the English word \"make.\" Say every vowel.","A very dramatic actor is doing a death scene. It lasts 45 minutes. He staggers, clutches his chest, falls, gets back up, falls again. Every time he falls he moans \"MAH... KEH...\" The audience goes home. He is still dying."],"Clutch your chest and fall on the couch. \"Mah... keh.\"","Ola and make are the life and death pair. You might hear make in local pidgin too.",null,"45 minute death scene"],["v100","v",100,"peʻe","PEH-eh","to hide","Peh... eh...",["A 300 pound uncle is playing hide and seek. He hides behind a skinny telephone pole. His whole body sticks out on both sides. He holds his breath (that is the ʻokina) and whispers to himself \"Peh... eh...\" Everyone can see him. Nobody says anything. He thinks he is winning."],"Hide behind your hand. \"Peh... eh.\"",null,null,"Uncle behind a skinny pole"],["v101","v",101,"neʻe","NEH-eh","to move along, to scoot over","\"Neh-eh!\" (a goat bleat)",["You squeeze into the last spot on the church pew on Easter Sunday. The pew is packed tight like a can of Vienna sausage. Then the back door opens and in walks Aunty Pua carrying three casseroles, and she needs a seat.","Right next to you sits a goat. A real goat, 180 pounds, wearing a little aloha shirt. Nobody knows whose goat it is. Everybody leans over and whispers, \"Scoot over.\"","The goat bleats \"NEH... eh!\" and slides exactly one inch down the pew. The whole row slides with it. \"NEH... eh!\" Another inch. Hymnals fall on the floor.","A baby rolls to the end of the pew like a bowling ball and a cousin catches it. It takes 23 bleats and 23 inches, but Aunty Pua finally sits down. The goat looks at you like it did you a big favor."],"Scoot your butt one inch along your chair and bleat. \"NEH-eh.\"","Neʻe mai means scoot this way, toward me. Neʻe aku means scoot away from me.",null,"Goat in aloha shirt scooting down pew"],["v102","v",102,"hoʻoneʻe","ho-oh-NEH-eh","to move something, to shift it","\"HO! OH! Neh-eh!\"",["The goat from neʻe is back, and this time it will not scoot. It is sitting on your couch, and you are moving to a new apartment today. The movers quit. It is just you, a 400-pound koa couch and a goat that weighs as much as a refrigerator.","You squat, grab the couch and heave. \"HO!\" Your back pops. \"OH!\" The couch slides one foot. The goat bleats \"NEH-eh!\" like a coach cheering you on. Ho! Oh! Neh-eh!","You shove that couch down the hall, down three flights of stairs, across the parking lot and up the ramp into the truck. 211 heaves. The goat never lifts one hoof.","When you finally slam the truck door, it bleats one last proud \"Neh-eh\" and falls asleep. You moved it. It did not move itself."],"Push an imaginary couch with both hands and grunt. \"Ho-oh-NEH-eh!\"","Hoʻo- in front of a word usually means to make it happen. Neʻe is to scoot yourself. Hoʻoneʻe is to make something else scoot.",null,"Pushing a couch with goat on it"],["v103","v",103,"ʻoni","OH-nee","to move, to stir, to wiggle","\"(gasp) Oh, KNEE!\"",["You are the ring bearer at your cousin's wedding at a fancy hotel in Waikīkī. The photographer is a very serious man with a camera the size of a microwave. He says, \"Nobody moves. Not one hair.\"","Everybody freezes. 140 guests, stiff as statues. Then your left knee starts to wiggle. Just a little. Then more. Then it is bouncing like it has its own heartbeat, 90 bounces a minute.","You gasp with a little catch in your throat. \"(gulp) Oh... KNEE!\" Your knee stirs the air like a spoon in a pot of stew. It bumps the ring pillow. The rings fly. The groom dives for them.","The cake wobbles. The photographer screams. The only photo from the whole wedding is 140 frozen people and one blurry knee."],"Catch your breath, then bounce your knee under the table. \"OH-nee!\"","Mai ʻoni means don't move, what a teacher or a photographer might say.",null,"Wiggling knee ruins wedding photo"],["v104","v",104,"naue","nah-OO-eh","to shake, to tremble, to sway","\"Nah... Ooh... Eh?\"",["Uncle Keoni built a haupia tower for the family party. It is 12 feet tall, pure white, coconut pudding stacked on coconut pudding, and it sits on a card table in the carport.","Then the trade winds pick up. The tower starts to tremble. It shakes. It sways left, then right, like a hula dancer who had too much coffee.","Aunty asks, \"Is it going to fall?\" Uncle folds his arms. \"Nah.\"","The tower sways so far it almost touches the mango tree. The whole party goes \"Ooooh.\" Uncle looks less sure. \"...Eh?\"","Nah. Ooh. Eh? Nah. Ooh. Eh? For three hours the tower shakes, and every guest shakes with it, knees wobbling, plates trembling. It never falls. But nobody eats it either. Too scared."],"Shake both hands like jelly on a plate. \"Nah-OO-eh.\"",null,null,"Trembling 12-foot haupia tower"],["v105","v",105,"huli","HOO-lee","to turn, to flip over; to search","\"WHO? LEE!\"",["Your friend Lee lost his car keys. Lee does not search like a normal person. Lee flips things over.","He flips the couch. He flips the fridge. He flips the dog, gently, and the dog does not mind. Then he goes outside and flips his whole pickup truck onto its roof, wheels spinning in the air like a dead cockroach.","The neighbors run out in their slippahs. \"WHO flipped the truck?!\" Everybody points. \"LEE!\" Who? Lee! Huli! Then Lee flips the neighbor's car too. \"WHO?\" \"LEE!\"","He flips the mailbox, the trash can, a picnic table and a canoe. After flipping 41 things, he finds the keys in his own pocket. Then he flips his hat and walks home."],"Flip your hand palm up, then palm down. \"HOO-lee!\"","Huli huli chicken is chicken turned over and over on the grill. Huli also means to search, like Lee hunting for his keys.",null,"Lee flipping his truck upside down"],["v106","v",106,"hoʻohuli","ho-oh-HOO-lee","to turn something over; to change someone's mind","\"Ho! Oh! Who? LEE!\"",["Lee from huli is back, and he has a new talent. He can turn things over, and he can turn people's minds.","Uncle Boy is standing at the beach park swearing it is closed today. He is so sure he bets his cooler on it. There is a giant sign on a pole that says CLOSED.","Lee walks up, grabs the 30-foot sign, grunts and turns the whole thing over. The back side says OPEN, BRING YOUR COOLER. Everybody gasps. \"Ho! Oh!\" Then they ask, \"Who?\" \"LEE!\" Ho! Oh! Who? Lee!","Uncle Boy stares at the sign for a long time. Then he changes his mind and says the beach was always open. He hands over his cooler. Lee just smiles and turns over his plate for seconds."],"Flip a huge invisible sign with both hands. \"Ho-oh-HOO-lee!\"","Huli is to turn over yourself. Hoʻohuli is to turn something or someone else over, even their opinion.",null,"Lee flipping a giant CLOSED sign"],["v107","v",107,"holoholo","ho-lo-HO-lo","to go out for fun, to cruise around","\"Hollow, hollow!\"",["It is Saturday. You have no plans, no money and no car. Then Uncle Sonny pulls into the carport driving a watermelon.","It is a watermelon the size of a minivan. He scooped out the inside, cut out windows and bolted on four wheels. He knocks on the side and it goes \"hollow, hollow.\" He grins. \"Get in. We go holoholo.\"","Nobody knows where you are going. That is the point.","You cruise to Haleʻiwa for shave ice. You cruise to Kailua to look at the water. You drive past Makapuʻu twice because the view was nice the first time.","Every time somebody asks where you are going, Uncle knocks on the dashboard. Hollow, hollow! You get home at 11 at night, sticky, sunburned and happy. You went nowhere and everywhere."],"Knock twice on the table and grin. \"Ho-lo-HO-lo!\"","Holo means to run, sail or ride. Doubling it makes it loose and wandering. Ask \"Where you going?\" and a local might answer \"Just holoholo.\"",null,"Uncle cruising in a hollow watermelon"],["v108","v",108,"kaʻapuni","kah-ah-POO-nee","to go around, to tour","\"Car? (hic) AH... PONY!\"",["You sign up for a round the island tour. You expect a big air conditioned bus. What shows up is a pony. One pony, about as tall as your hip, pulling a wagon with 30 tourists in it.","The tour guide stands on the wagon with a microphone. Somebody asks, \"Is this a car?\" The guide hiccups into the mic. \"Car? (hic) AH... PONY!\" Car, ah, pony! Kaʻapuni! The pony takes off.","That pony goes around the whole island. Around Diamond Head. Around Makapuʻu. Around the North Shore and all the way back to town. Then it goes around again, because it likes it.","Round and round, three times, 330 miles. When it finally stops, the tourists have beards. The pony stamps its hoof. It wants to go around one more time."],"Draw a big circle in the air with one finger. \"Kah-ah-POO-nee!\"","Kaʻa means to roll or turn, and today it is also the word for a car. Puni means all the way around.",null,"Tiny pony pulling tour wagon around island"],["v109","v",109,"kaʻahele","kah-ah-HEH-leh","to travel, to take a trip","\"Car! (gulp) Ah! Hey, LEH!\"",["Tūtū Rose is 84 and has never left Oʻahu. Then she wins a trip. She packs one suitcase and one travel buddy, a mongoose named Leh who rides in the side pocket.","She goes to Japan. She goes to Italy. She goes to Egypt and makes the mongoose climb a pyramid. Nine countries in 14 days.","Every morning she stands outside a new hotel, waves down a car and hollers, \"CAR! (gulp) AH! Hey, LEH, let's go!\" Car, ah, hey, Leh! Kaʻahele!","Leh jumps in the pocket. The car zooms off.","At the airport back home the whole family waits with leis. Tūtū Rose walks out with a tan, a French hat, a passport full of stamps and a mongoose wearing sunglasses."],"Grab an invisible suitcase handle and wave down a car. \"Kah-ah-HEH-leh!\"","Hele means to go. Kaʻahele is traveling about from place to place, a trip or a tour. It is close to kaʻapuni, which stresses going all the way around.",null,"Tūtū and mongoose traveling the world"],["v110","v",110,"lana","LAH-nah","to float","\"My LAWN! AH!\"",["Last night it rained so hard in Mānoa that Uncle Dennis's whole front lawn slid off the hill. This morning it is floating in the ocean off Waikīkī, 200 feet out. A perfect square of green grass, bobbing on the waves.","Uncle is still on it. He is sitting in his lawn chair with his coffee. The sprinkler is still going. His dog is chasing a seagull across the grass.","People on the beach point and scream. Uncle stands up, sees the shore getting smaller and yells, \"My LAWN! AH!\" Lawn, ah! Lana!","Then he shrugs, sits back down and floats. He floats past surfers. He floats past a cruise ship. By sunset his lawn is floating near Molokaʻi, and he is mowing it."],"Lie back with your arms out like you are floating. \"LAH-nah.\"",null,null,"Uncle floating on his lawn"],["v111","v",111,"kukuli","koo-KOO-lee","to kneel","\"Coo-KOO-lee!\"",["Grandpa's old cuckoo clock has a problem. When it strikes the hour, the little wooden bird pops out, but it does not cuckoo. It kneels.","At 3 o'clock the tiny door flips open. The bird slides out, drops down on one tiny knee and sings, \"Coo-KOO-lee!\" Then it stares at you. Nobody in the house can move until everybody kneels too.","So you kneel. Grandma kneels in the kitchen with the rice paddle in her hand. The dog kneels. Your cousin kneels on a toy block and screams. The mailman outside hears it and kneels on the lawn.","At midnight the clock goes 12 times. \"Coo-KOO-lee! Coo-KOO-lee!\" The whole family kneels up and down in their pajamas like a crazy exercise video. Your knees are purple by morning."],"Drop down on one knee. \"Koo-KOO-lee!\"",null,null,"Cuckoo clock bird kneeling on one knee"],["v112","v",112,"kūlou","KOO-loh","to bow the head","\"Cooool... LOW!\"",["Your cousin Big Mike is 7 feet 4 inches tall. Tūtū's house in Kalihi was built in 1952 for people about 5 feet tall. Every doorway is low. Every ceiling fan is at nose level.","Every time Big Mike comes for Sunday dinner, the whole family yells the same thing at the front door. \"Cooool... LOW!\" Stay cool, head low. Coooo, low! Kūlou!","He bows his head under the front door. He bows under the kitchen doorway. He bows under the fan, the hanging plants, the wind chimes and the framed picture of Tūtū's wedding. By the end of the night he has bowed his head 64 times.","He looks like the most polite man in Hawaiʻi. Then one night he forgets. BONK. Now the doorway has a dent shaped like his forehead."],"Bow your head slowly and hold the first sound long. \"KOOOO-loh.\"","Kūlou is bowing just the head. Kukuli is going all the way down on your knees.",null,"Seven-foot cousin bowing under doorway"],["v113","v",113,"hina","HEE-nah","to fall over, to topple","\"HEE! ...Nah?\"",["You take your nephew to the zoo. At the hyena yard, a hyena the size of a golf cart is standing tall on a rock, looking proud.","Then somebody tells it a joke. You do not hear the joke.","The hyena starts to laugh. \"HEE! HEE! HEE!\" It laughs so hard it starts to lean. It leans like a tree that just got chopped.","Your neph
