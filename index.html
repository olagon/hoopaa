 not move. A giant wave hits him, soaks him, and goes around him. Pa does not move. A tour group asks him to scoot for a photo. Pa does not move.","The kids cheer from the car. \"COOL PA! AH!\" Cool, Pa, ah. Kūpaʻa. Stand firm. Loyal to the spot, loyal to the family.","At sunset everyone else has gone home. Pa is still standing there, sandy and grinning, holding the umbrella like a flag. \"Told you,\" he says."],"Plant your feet wide and cross your arms. \"Koo-PAH-ah.\"","Kū means to stand and paʻa means firm or stuck. Stand stuck.",null,"Pa holding umbrella through a wave"],["v434","v",434,"kūʻokoʻa","koo-oh-KO-ah","to be independent","Coo... oh... KO-AH!",["For 80 years a little wooden bird has lived in Grandma's cuckoo clock. Every hour the door opens, it sings \"coo-coo,\" and the door slams shut. Every hour. For 80 years.","Tonight at midnight it pops out, and something is different. It sings \"COO... OH...\" and then it breaks right out of the clock. \"...KO-AH!\" It flies out the window, free.","Coo, oh, KO-ah. Kūʻokoʻa. Independent.","The bird gets its own apartment in Mōʻiliʻili. It gets a job at a bakery. It buys its own groceries, does its own taxes and pays its rent on time. Now it sings whenever it wants, which is mostly at a quarter to four in the afternoon. Nobody tells that bird what to do anymore."],"Fling your arms open like a door bursting. \"Koo-oh-KO-ah!\"","Lā Kūʻokoʻa, November 28, marks the day in 1843 when Britain and France recognized the Hawaiian Kingdom as an independent nation.",null,"Cuckoo bird breaking out of the clock"],["v435","v",435,"hoʻokaulike","ho-oh-kow-LEE-keh","to make fair, to balance","Ho, oh, COWLICK-eh",["A kid walks into a barbershop in Kalihi with the worst cowlick in history. The left side of his hair sticks straight up like a palm tree. The right side is flat. He looks like he's always leaning.","The barber is very serious about being fair. He can't fix the cowlick, so he gives the other side one too. Now both sides stick up, but the left is taller. So he adds gel to the right. Now the right is taller. Back and forth, back and forth, with a level and a ruler, muttering \"Cowlick-eh... cowlick-eh...\"","Ho, oh, COWLICK-eh. Hoʻokaulike. To make it fair, to balance.","After three hours the kid has two perfectly equal cowlicks, like horns. The barber checks them with a laser level. Dead even."],"Hold both hands out like a scale and level them. \"Ho-oh-kow-LEE-keh.\"","Like (492) means alike or the same. Kaulike means equal or fair.",null,"Barber leveling two matching cowlicks"],["v436","v",436,"lokomaikaʻi","lo-ko-mai-KAH-ee","to be generous, kind","LOCO! My car, EH!",["Uncle Kimo is the most generous man in Kaʻaʻawa. If you say you like his shirt, he takes it off and gives it to you. If you say his dog is cute, you walk home with a dog.","One day a neighbor says, \"Nice car.\" Uncle hands over the keys. The whole street screams \"LOCO!\" Uncle just shrugs and says, \"My car? EH! Take!\" Loco, my car, eh. Lokomaikaʻi.","He keeps going. He gives his canoe to the canoe club, his ladder to the church, and his lunch to a hungry cat. By sunset he is sitting on the beach in borrowed shorts, happy as a clam.","Then 40 neighbors show up, each one carrying something back for him, plus a plate lunch. That is how kindness works around here."],"Hold out your open hand like you're giving away your keys. \"Lo-ko-mai-KAH-ee.\"","Loko means inside and maikaʻi means good. Good on the inside.",null,"Uncle handing his car keys to a neighbor"],["v437","v",437,"ʻālunu","aah-LOO-noo","to be greedy","AAAH! A LOON! OOH!",["A loon bird escapes from a zoo on the continent and somehow ends up at a hotel buffet in Waikīkī. It is greedy beyond belief.","It stuffs its beak with every crab leg on the table. It hides shrimp under both wings. It drags the whole prime rib to the corner, sits on it, and hisses at anyone who comes near. The dessert table disappears down its neck. It is now shaped like a beach ball.","The manager runs out and yells \"AAAH! A LOON! OOH!\" Aaah, loon, oo. ʻĀlunu. Greedy. That long aaah is the manager seeing the empty buffet.","The loon doesn't care. It waddles out the front door dragging the chocolate fountain behind it by the cord, burping. It leaves one sprig of parsley for the other 200 guests."],"Hug an invisible pile of food to your chest. \"Aah-LOO-noo!\"","The opposite is lokomaikaʻi (436), generous.",null,"Greedy loon sitting on the prime rib"],["v438","v",438,"ʻeleu","eh-LEH-oo","to be lively, quick, active","EH! LEI! OOH!",["There is a lei maker at the airport named Aunty Mapuana. She is so fast your eyes can't follow her hands. Flower, needle, string, done. One lei per second.","A plane lands with 400 passengers. She yells \"EH! LEI! OOH!\" and a blur of flowers shoots across the terminal. Every single passenger has a lei on before their foot touches the carpet. Eh, lei, ooh. ʻEleu.","She doesn't stop. She makes lei for the pilots, the luggage, the security dog and the parking meters. She puts a tiny lei on a pigeon as it flies past.","Then she sits down and sips her coffee. It is still hot. The whole thing took eleven seconds."],"Move your hands in a fast blur like stringing flowers. \"Eh-LEH-oo!\"","ʻEleu is quick and full of energy. Its opposite is moloā (439), lazy.",null,"Blur of lei flying through the airport"],["v439","v",439,"moloā","mo-lo-AAH","to be lazy","Mo' low... AAAH",["Your brother lies down on the couch Saturday morning. By noon he is lower. \"Mo' low,\" he sighs, and slides deeper into the cushions. By dinner he is under the couch. \"Mo' low... aaaaah.\"","He does not get up for a week. He slides under the rug. He slides through the floorboards. Now he is under the house, lying in the dirt with the geckos, eating chips you drop down to him through a crack. \"Mo' low... AAAAAAH.\"","Mo' low, aah. Moloā. Lazy. That long aaah at the end is the sound of someone who has decided to never get up again.","Ma finally calls a construction crew to dig him out. When they reach him, he asks if they can carry him to the car."],"Slump way down in your chair and sigh. \"Mo-lo-AAAH.\"","You hear it in pidgin too, as in \"No be moloā!\"",null,"Brother sinking under the house"],["v440","v",440,"ikaika","ee-KAI-kah","to be strong","Eee! KAYAK-ah!",["Aunty Leilani is 72, and she is the strongest person in Kailua. Every morning she walks to the beach carrying her kayak. Not on a cart. On her head.","Then she started carrying more. Two kayaks. Five kayaks. Today she strolls down the beach with twelve kayaks stacked on her head, a canoe under each arm, and her grandson riding in the top kayak, waving. Tourists scream \"EEE! KAYAK-AH!\" Ee, kai, kah. Ikaika.","She sets them all down gently and paddles to the Mokulua islands and back before breakfast. On the way home she carries a stalled car out of the road and parks it for the owner. She is not even breathing hard. Strong."],"Flex both arms and grunt. \"Ee-KAI-kah!\"","Ikaika is also a popular name for boys in Hawaiʻi.",null,"Aunty carrying twelve kayaks on her head"],["v441","v",441,"nāwaliwali","naah-vah-lee-VAH-lee","to be weak","NAAAH, Wally, Wally",["Meet Wally. Wally is the weakest man in the world. His arms are wet noodles. His legs are wet noodles. He tries to open a jar of pickles, and the jar wins.","Today Wally is trying to lift the TV remote. He grunts. He sweats. His face turns purple. The remote does not move. His wife walks by and sighs \"NAAAH, Wally. Wally.\" like she has said it ten thousand times. Naah, Wally Wally. Nāwaliwali. Weak.","A single leaf falls on Wally and pins him to the grass for an hour. A gentle breeze pushes him into the neighbor's yard. A butterfly lands on his shoulder, and he tips over. Wally lies there and sighs. He's used to it."],"Let your arms hang limp like noodles. \"Naah-vah-lee-VAH-lee.\"","The opposite of ikaika (440), strong.",null,"Wally pinned under a single leaf"],["v442","v",442,"maikaʻi","mai-KAH-ee","to be good, to be well","MY KAI! EE!",["A dad at the park keeps yelling \"MY KAI!\" His son Kai is the best kid anyone has ever seen.","Kai helps a grandma cross the street. Then he helps her cross back, because she forgot her purse. He returns 40 shopping carts in a rainstorm. He gives his last spam musubi to a hungry dog. He picks up trash off the whole beach and sorts it by color.","Every time Kai does something good, his dad's chest puffs up and he yells \"MY KAI!\" Then his breath catches, he tears up, and a little \"EE!\" squeaks out. My Kai, ee. Maikaʻi. Good.","By sunset the whole park is chanting along. \"My Kai-ee! My Kai-ee!\" Kai is embarrassed. He goes to help somebody fix a flat tire."],"Give a big thumbs up, voice cracking a little. \"Mai-KAH-ee!\"","Ask Pehea ʻoe? (How are you?) and the usual answer is Maikaʻi. (Good.)",null,"Proud dad yelling My Kai at the park"],["v443","v",443,"nani","NAH-nee","to be beautiful","NANNY!",["The county fair holds a beauty contest for goats. Most of them look like goats. Then a nanny goat walks out on stage.","She is so beautiful the stage lights get brighter by themselves. Her coat shines like silk. Flowers bloom wherever her hooves touch the floor. A rainbow appears indoors, right over her head. The judges cry. The other goats cry. The farmer who owns her faints into a hay bale.","The announcer grabs the microphone and can only say one thing, over and over. \"NANNY! NANNY!\" Nani, nani. Beautiful.","She wins every prize at the fair, including Best Pie, which she did not enter. As she walks off the stage, three photographers follow her all the way home."],"Frame your face with your hands and pose. \"NAH-nee.\"","Nani ʻoe means you are beautiful.",null,"Glowing nanny goat winning the pageant"],["v444","v",444,"nui","NOO-ee","to be big; to be many","GNU! EEE!",["The Honolulu Zoo gets a gnu. On the first day it is normal gnu size. Then it eats. All the hay, all the bananas and the zookeeper's lunch. The next morning it is the size of a bus.","The zookeeper screams \"GNU! EEE!\" Gnu, ee. Nui. Big.","It keeps growing. By Friday its head is above the clouds. When it sneezes, it rains in Kaimukī. And it gets worse, because nui also means many. The gnu has 400 babies. Four hundred giant gnus, all standing on Kalākaua Avenue, all going \"GNU! EEE!\"","Traffic is terrible, but honestly, not that much worse than usual."],"Stretch your arms as wide as they go. \"NOO-ee!\"","Mahalo nui loa means thank you very much.",null,"Giant gnu towering over Waikīkī"],["v445","v",445,"liʻiliʻi","lee-ee-LEE-ee","to be small","Lee! ee! LEE! ee!",["Remember cousin Lee from kahuli, the one who flipped the canoe for a chip? He finds a strange glowing chip on the beach and eats it. Then he starts to shrink.","Now Lee is the size of a grain of rice. He lives inside a spam musubi wrapper. He surfs on a drop of water. A gecko keeps looking at him like he is lunch.","You can barely hear him anymore. He stands on the kitchen table waving his tiny arms and squeaking \"LEE! ee! LEE! ee!\" which is how he says his name now. Every word comes out with two tiny hiccups in it.","Lee, ee, Lee, ee. Liʻiliʻi. Small.","You feed him one grain of rice for dinner. He is full for a week."],"Squeeze your thumb and finger almost together and squeak. \"Lee-ee-LEE-ee.\"","The opposite of nui (444), big.",null,"Tiny Lee on a musubi wrapper"],["v446","v",446,"lōʻihi","loh-EE-hee","to be long, tall","LOOOOOO... ee-HEE!",["The water park opens a new slide. It starts at the top of a mountain and ends in the ocean nine miles away. It is the longest slide ever built.","You sit down at the top and push off. \"LOOOOOOOOOO...\" You slide past cows. Past a school. Past a whole town. \"OOOOOOOOOO...\" You stop for lunch on a flat part. You take a nap. Still sliding. \"OOOOOOOOO...\" Two days later you finally shoot out the bottom and hit the water. \"EE! HEE!\"","Looooo, ee, hee. Lōʻihi. Long. That long ō is the whole nine miles.","You climb out, wet and happy. The lifeguard is seven feet tall. He points at the line for the next ride. It is also very lōʻihi. It is a week long."],"Slide your hand way, way out in front of you. \"LOOOH-ee-hee!\"","Lōʻihi was the name of the undersea volcano growing off the Big Island, now called Kamaʻehuakanaloa.",null,"Nine mile long water slide"],["v447","v",447,"pōkole","poh-KO-leh","to be short","Poooke! OLÉ!",["At the rodeo in Waimea, the new rodeo clown is two feet tall. His hat is bigger than he is. The bull can't even find him.","The bull charges straight over his head. The little clown pops up and pokes the bull in the ankle with one finger. The crowd jumps to its feet. \"POOOOKE! OLÉ!\" Poke, olé. Pōkole. Short. Hold that pooo long, because it's the only long thing about him.","The bull spins around, confused. It looks left. It looks right. The clown is standing between its front hooves, waving a red napkin. \"Poke! Olé!\"","He wins the whole rodeo. His trophy is taller than he is, so the trophy carries him out."],"Hold your hand down near your knee. \"Poh-KO-leh.\"","The opposite of lōʻihi (446), long or tall.",null,"Two foot rodeo clown poking a bull"],["v448","v",448,"kiʻekiʻe","kee-eh-KEE-eh","to be high","KEE-EH! KEE-EH!",["Your little sister gets a fish shaped kite with a whistle on it. Every time it climbs, the whistle screams \"KEE-EH! KEE-EH!\"","She lets out the string. The kite goes over the trees. \"KEE-EH!\" Over the clouds. Airplanes swerve. \"KEE-EH!\" She has 40 miles of string. It goes past the moon. Astronauts on the space station look out the window and see a fish kite fly by, screaming.","Kee-eh, kee-eh. Kiʻekiʻe. High.","She reels it in for dinner. It takes three days. When it finally comes down, it is covered in frost, and a note is taped to the tail. It says, \"Nice kite.\""],"Point straight up at the sky. \"Kee-eh-KEE-eh!\"","Hoʻokiʻekiʻe (420) means to raise something up high.",null,"Fish kite whistling past the moon"],["v449","v",449,"wela","VEH-lah","to be hot","VEH! LAH!",["It is August. It is noon. You are at a black sand beach on the Big Island, and your slippahs are in the car, 200 feet away.","You take one step. Your foot sizzles like bacon. \"VEH!\" You hop to the other foot. \"LAH!\" VEH! LAH! VEH! LAH! You are doing a hot sand dance in front of 60 tourists, and they think it's a show. They start clapping to the beat.","Like \"well, AH!\" with a V. Wela. Hot. So hot.","Halfway to the car you pass a raw egg someone dropped. It is fried. Sunny side up. A mynah bird is eating it with a tiny fork. You give up on the car and dive into the ocean instead, and the water hisses and steams around you."],"Hop from foot to foot on invisible hot sand. \"VEH-lah! VEH-lah!\"","Wela ka hao, the iron is hot, is a saying for a wild, good time.",null,"Hot sand dance on black sand"],["v450","v",450,"anuanu","ah-noo-AH-noo","to be cold","Ah-NOO! Ah-NOO!",["You drive up Mauna Kea in winter wearing shorts and a tank top. Big mistake. At the top there is snow and wind, and you are the only person without a jacket.","Your teeth start to chatter. They chatter so hard they make words. \"AH-NOO-AH-NOO! AH-NOO-AH-NOO!\" Ah, noo, ah, noo. Anuanu. Cold.","Icicles grow from your nose. Your shorts freeze solid and stand up by themselves. Your eyebrows turn white. A kid builds a snowman next to you, then looks closer and realizes you ARE a snowman.","You shuffle back to the car like a penguin, still chattering. You turn the heater all the way up. It takes until Hilo for your teeth to stop."],"Hug yourself, shiver, and let your teeth chatter. \"Ah-noo-AH-noo.\"","The opposite of wela (449), hot.",null,"Frozen in shorts on Mauna Kea"],["v451","v",451,"mahana","mah-HAH-nah","to be warm","Ma! HANNAH!",["You get home from Mauna Kea still frozen. You crawl into bed under six blankets and you are still an ice cube. Your teeth are still going ah-noo, ah-noo.","Ma pokes her head in and hollers \"HANNAH!\" Hannah is the family dog, a 200 pound fluffy mountain dog. She thunders down the hall and flops right on top of you.","Warm. Instantly warm. Not hot, not cold. Just right, like a heater made of fur that snores. You mumble \"Ma... Hannah...\" and drift off smiling.","Ma, Hannah. Mahana. Warm.","In the morning you wake up toasty. Hannah is still lying on you. You can't move. You don't care one bit."],"Rub your hands together over a cozy fire. \"Mah-HAH-nah.\"","Mahana is nice warm. Wela (449) is too hot and anuanu (450) is cold.",null,"Giant fluffy dog warming you in bed"],["v452","v",452,"hou","HO-oo","to be new; again","HO! OOOO!",["Your little cousin Keoni just got brand new shoes. They are so white they glow. He opens the box and yells \"HO! OOOO!\"","Then he closes the box. Then he opens it again. \"HO! OOOO!\" He can't stop. They're new every time. He takes them out, smells them, puts them back. \"HO! OOO!\" Again. Again. Again.","He wears them to the store. Every time he looks down, \"HO! OOO!\" Strangers start joining in. By closing time the whole store shouts it every time he takes a step. Ho, oo. Hou. New. And again.","At midnight you hear it through the wall. He's opening the box one more time."],"Open an invisible box, gasp, close it, open again. \"HO-oo! HO-oo!\"","Hana hou! means do it again. It's how you shout encore in Hawaiʻi.",null,"Opening a new shoe box again and again"],["v453","v",453,"kahiko","kah-HEE-ko","to be old, ancient","KAH! HEE! KO!",["The oldest truck in Hawaiʻi lives in a farmer's yard in Waimānalo. It is so old it came with a spot to tie a horse. The rust has rust. A mango tree is growing up through the floor.","Every morning the farmer turns the key and the truck coughs like a grumpy old man. \"KAH! HEE! KO!\" Kah, hee, ko. Kahiko. Old. Ancient.","The license plate is a carved stone. The radio only plays one station, and it is the news from 1920. The farmer says his great great grandpa bought it used. Top speed is five miles an hour. Chickens pass it.","But every morning, \"KAH! HEE! KO!\" and off they go, one more time."],"Cough like an old engine starting. \"Kah... HEE... ko!\"","Hula kahiko is the older, traditional style of hula. Hula ʻauana is the modern style.",null,"Ancient rusty truck coughing to life"],["v454","v",454,"ʻoluʻolu","oh-loo-OH-loo","to be pleasant, kind, comfortable","Oh, LULL-oh-LULL",["There is a recliner at a furniture store in Kapolei that nobody can get out of. It is the most comfortable chair on earth. It is soft, it is warm, and it smells like fresh laundry.","You sit down. It shapes itself to your back. A tiny voice inside the cushion starts to sing. \"Oh... LULL-oh-LULL... oh LULL-oh-LULL...\" Oh, lull, oh, lull. ʻOluʻolu.","Your shoulders melt. Your troubles float away. The salesman is asleep in the next chair. So is a security guard, three kids and a delivery driver still holding a box. The whole store is sleeping and smiling.","The chair is so pleasant, so kind, that when the store closes it gently tucks a blanket over you."],"Sink back into your chair and sigh happily. \"Oh-loo-OH-loo.\"","Ke ʻoluʻolu ʻoe means please (literally, if you would be so kind).",null,"Singing recliner lulling a whole store"],["v455","v",455,"akamai","ah-kah-MAI","to be smart, clever","Ah-kah-MYNAH!",["There is a mynah bird at the bus stop in Kalihi who is smarter than everybody. He does the crossword in pen. He fixes the broken crosswalk light with a paper clip. He tells a lost man which bus to take and shows him a shortcut.","A kid is crying over his math homework. The mynah hops down, looks at the page, and squawks every answer in order. Then he explains fractions using a pizza. The kid's mouth drops open. \"AH-KAH-MYNAH!\" Akamai. Smart.","By noon there is a line down the block of people asking about taxes, car loans and how to cook rice without a rice cooker. The mynah charges one french fry per question. He's retired by Friday."],"Tap your temple with one finger. \"Ah-kah-MAI.\"","Akamai is used in local pidgin too, as in \"Eh, you akamai, brah!\"",null,"Mynah bird doing math homework"],["v456","v",456,"hewa","HEH-vah","to be wrong, to make a mistake","HEHHH-VAAAH!",["You are on a game show, and you are terrible. The host asks, \"What color is the sky?\" You say, \"Tuesday.\"","A giant buzzer goes off. \"HEHHHH-VAAAHHH!\" Heh, vah. Hewa. Wrong.","The floor tips and you slide into a tank of cold poi. You climb out. Next question. \"How many legs does a chicken have?\" You say, \"Seven.\" \"HEHHH-VAAAHH!\" Into the poi again.","You get every single question wrong. By the end the studio is covered in poi, the host is quietly crying, and the audience is chanting along with the buzzer. \"HEH-VAH! HEH-VAH!\" You go home with the grand prize, which is the buzzer."],"Make an X with your arms and buzz. \"HEH-vah!\"","Hewa can also mean a wrong in the moral sense. Its opposite is pono (457).",null,"Wrong answer buzzer dropping you in poi"],["v457","v",457,"pono","PO-no","to be right, proper, balanced","Po'... NO.",["You are broke. Totally po'. Your pocket has a button and some lint in it. Then, on the sidewalk outside the drugstore, you find a wallet with 900 dollars inside.","Your stomach says take it. That's 900 malasadas. A little voice in your head whispers \"you're po'...\" and then you say out loud, very firm, \"Po'... NO.\" Po', no. Pono.","You walk it to the address on the ID. It belongs to a tiny old lady. She hugs you so hard your back cracks straight.","Suddenly everything in your life lines up. Your posture is perfect. Your checkbook balances. The picture frames in your room hang level by themselves. Doing the right thing feels exactly right."],"Push an invisible wallet away, then stand up tall. \"PO-no.\"","The state motto uses it. Ua mau ke ea o ka ʻāina i ka pono, the life of the land is perpetuated in righteousness.",null,"Returning a found wallet, Po', no"],["v458","v",458,"pololei","po-lo-LAY","to be correct, straight","POLE-oh-LAY",["Aunty Rose can lay anything down perfectly straight. She has never owned a ruler. She just squints.","The city asks her to put down a 900 foot pole along Kalākaua Avenue. She picks it up, squints once, and lays it down. \"POLE-oh-LAY.\" Pole, o, lay. Pololei. Straight.","Engineers come with lasers to check. The beams line up exactly. Not off by a hair. So they quiz her too. \"What is 47 times 12?\" \"Five sixty-four.\" Correct. \"Is this line straight?\" \"Pololei.\" Correct again.","Now she lines up the plate lunch line at the beach park every weekend. It's so straight you can look through 200 heads from one end to the other."],"Slice your hand forward in a perfectly straight line. \"Po-lo-LAY.\"","Say Pololei! when someone gets an answer right. It means correct.",null,"Aunty laying a 900 foot pole straight"],["v459","v",459,"māmā","maah-MAAH","to be light (not heavy); to be quick","MAAA-MAAA!",["Your mama weighs about as much as a paper plate. When the trade winds blow, she has to hold on to the mailbox. She is also the fastest person in Waipahu.","She runs to the store so quick and so light she leaves no footprints. She runs across the top of the swimming pool without getting wet. When she's late for a lūʻau on Molokaʻi, she just runs across the ocean, hopping from wave to wave, and gets there before the plane.","People on the beach look up and shout \"MAAAA-MAAAA!\" as she floats by like a kite. Māmā. Light and quick. Two long vowels, like the wind carrying her.","At the party, she lifts a whole roast pig and it feels light too."],"Blow a feather off your palm. \"Maah-MAAH!\"","The opposite, heavy, is kaumaha, which also means sad.",null,"Light mama running across the ocean"],["v460","v",460,"ʻeleʻele","eh-leh-EH-leh","to be black","Eh, Ellie! EH-leh!",["The Nakamura family has a cat named Ellie. Ellie is black. Not dark gray. Not almost black. Ellie is so black that when she walks into a room, the lights go dim.","She sits on the white couch, and it looks like somebody cut a hole in the couch. She stares at a birthday candle and the candle goes out. You try to take her picture, and the phone shows nothing but two yellow eyes floating in space.","Everybody calls her with a little catch in the throat. \"Eh! Ellie! EH-leh!\" ʻEleʻele. Black.","At night the family can only find her by her purr. Even her shadow has a shadow."],"Squint into the dark like you lost your cat. \"Eh-leh-EH-leh.\"","Pōʻeleʻele (484) is the dark of night. You can see ʻeleʻele hiding inside it.",null,"Pitch black cat dimming the room"],["v461","v",461,"keʻokeʻo","keh-oh-KEH-oh","to be white","K.O.! K.O.!",["It is the big fight at the arena downtown. In one corner stands a boxer made completely of white rice. Not brown rice. Sticky white rice, packed tight, the color of a brand new sheet of paper.","He is so white the crowd has to wear sunglasses. Under the lights he glows like the full moon. His opponent can't even look at him. He squints, swings, and misses by a foot.","The rice boxer throws one punch. Rice everywhere. The other guy goes down. The ref counts to ten and yells \"K.O.! K.O.!\" Kay-oh, kay-oh. Keʻokeʻo. White.","The whole arena is covered in white rice like snow. The champ holds up his belt, missing a little bit of his shoulder. Somebody in row nine eats it with shoyu."],"Throw a punch, then raise your arm. \"Keh-oh-KEH-oh!\"","Keʻokeʻo is white and ʻeleʻele (460) is black.",null,"Glowing white rice boxer, K.O."],["v462","v",462,"ʻulaʻula","oo-lah-OO-lah","to be red","OOOH-la! OOOH-la!",["A visitor from the continent falls asleep on Waikīkī Beach at 8 in the morning. No sunscreen. He wakes up at 5 in the afternoon.","He is red. Not pink. RED. Red like a fire truck, like a cherry, like the inside of a watermelon. Boats think he is a warning light and turn around. A bull on a ranch 40 miles away sees him glowing and starts to charge.","He stands up and walks down the beach, and everyone he passes stares and says \"OOOH-la, OOOH-la!\" Ooh la, ooh la. ʻUlaʻula. Red.","He goes back to his hotel. He is so red the elevator thinks he is the emergency button and stops on every floor."],"Fan your hot red cheeks. \"Oo-lah-OO-lah!\"","The shorter form ʻula also means red.",null,"Sunburned visitor glowing red"],["v463","v",463,"uliuli","oo-lee-OO-lee","to be dark blue or deep green","OOOO-lee... OOOO-lee...",["You are diving off Kona, and you go deep. The water changes from light blue to blue to dark blue to deep green, the color of a swimming pool at midnight.","Out of the dark, a humpback whale the size of a school bus glides up to your mask. It looks at you with one huge eye. Then it sings. \"OOOO-lee... OOOO-lee...\" Oo, lee, oo, lee. Uliuli. Dark blue, deep green.","The song fills the whole ocean. Your mask buzzes. Fish stop to listen. The water around you gets darker and bluer and greener, like the song is painting it.","You float there in the deep blue, and the whale sings to you until your air runs low and you slowly rise back to the light."],"Cup your hands like a whale singing through the water. \"Oo-lee-OO-lee.\"","Don't mix it up with ʻulīʻulī, the feathered gourd rattle used in hula.",null,"Humpback singing in deep blue water"],["v464","v",464,"melemele","meh-leh-MEH-leh","to be yellow","Mellow mellow",["The mellowest man in Kailua lives in a yellow house. It has a yellow door, yellow curtains and yellow grass that he painted himself. He drives a yellow truck. He has a yellow dog and a yellow canary on his shoulder. He eats only bananas, pineapple and lemons.","He never hurries. He never frowns. When somebody cuts him off in traffic, he just smiles and waves a little yellow flag. Everybody in town calls him \"Mellow Mellow.\"","Mellow mellow. Meh-leh-MEH-leh. Melemele. Yellow.","After 50 years of lemons and bananas, he is yellow too. At night he glows softly in his yellow hammock like a nightlight, humming."],"Lean back all relaxed and wave a lazy hand. \"Meh-leh-MEH-leh.\"","Mele alone means song. Melemele is yellow.",null,"Mellow uncle glowing in a yellow house"],["v465","v",465,"ʻōmaʻomaʻo","oh-mah-oh-MAH-oh","to be green","Oh, Ma... oh, MOW!",["Your family's lawn is the greenest in the state. Too green. It glows. Airplanes use it as a runway light at night.","It also grows two feet every hour. Ma hands you the lawnmower. \"Ohhhh, Ma...\" you whine. \"Oh, MOW!\" she says. You mow the whole thing. You turn around. It's already grown back. \"Ohhhh, Ma!\" \"Oh, MOW!\"","Oh, ma, oh, mow. ʻŌmaʻomaʻo. Green. Hold that first oh long, like a sigh.","By sunset you have mowed the lawn 60 times. The clippings are piled into a green mountain. Your hair is green. Your arms are green. A lost goat wanders in, looks at the mountain, and decides to live there forever."],"Push an invisible mower and whine. \"Ohhh-mah-oh-MAH-oh.\"",null,null,"Mowing a glowing green lawn forever"],["v466","v",466,"poni","PO-nee","to be purple; to crown, to anoint","PONY!",["At the county fair there is a purple pony. Not lavender. Purple like ube, like a slice of purple sweet potato, deep and shiny.","The fair decides this pony is so special it must be crowned. A marching band plays. Somebody gently pours sweet coconut oil on its mane. A little girl climbs a ladder and sets a gold crown between its purple ears. The whole crowd bows and cheers \"PONY! PONY!\"","Pony. Poni. Purple. And also to crown, to anoint. Both happen to this pony at the same time.","The purple pony trots around the fairgrounds, crown shining, and eats an entire ube cake in one bite. Now its teeth are purple too. It doesn't mind. Royalty."],"Place an invisible crown on your own head. \"PO-nee.\"","Poni can mean purple, and it can also mean to crown or anoint someone.",null,"Purple pony being crowned"],["v467","v",467,"ʻāhinahina","aah-hee-nah-HEE-nah","to be gray","Aaah... HYENA-HYENA",["It is 5 in the morning on top of Haleakalā, waiting for sunrise. Everything is gray. Gray fog. Gray rocks. Gray cinder. Your gray hoodie. The sky itself, gray.","Then out of the fog walks a hyena, gray from nose to tail. Gray like old ash. It sits down on the cinder and starts to laugh. \"AAAAH... HYENA-HYENA-HYENA.\" The long aaah rolls across the crater.","Ah, hyena, hyena. ʻĀhinahina. Gray.","It laughs until the sun comes up. As the sky turns orange, it tiptoes over to a spiky silver gray plant, curls up beside it and matches it perfectly. Gray on gray on gray. You blink, and it's gone."],"Squint into the fog and do a quiet hyena laugh. \"Aah-hee-nah-HEE-nah.\"","ʻĀhinahina is also the name of the Haleakalā silversword, the silvery gray plant that grows near the summit.",null,"Gray hyena laughing on Haleakalā"],["v468","v",468,"maʻemaʻe","mah-eh-MAH-eh","to be clean","MAAH-eh! MAAH-eh!",["There is a sheep on a ranch upcountry who takes four showers a day. She uses coconut shampoo. She blow dries her wool. She has her own tiny toothbrush.","She is so clean she sparkles. Mud jumps out of her way. When the other sheep roll in the dirt, she stands under the sprinkler bleating \"MAAH-eh! MAAH-eh!\" Maʻemaʻe. Clean. The little catch between maah and eh is her spitting out shampoo bubbles.","Flies won't land on her because they would get washed. Rain falls on her and comes off cleaner than it went on. You can see your face in her wool. The rancher uses her as a mirror to shave every morning."],"Bleat like a very clean sheep. \"Mah-eh-MAH-eh!\"","Hoʻomaʻemaʻe (413) means to make clean.",null,"Sparkling sheep under a sprinkler"],["v469","v",469,"pelapela","peh-lah-PEH-lah","to be dirty, gross","PELLA! PELLA!",["Your dog Pella found the pig pen at the lūʻau. She rolled in the mud, then in some old poi, then in something nobody wants to name. She is now brown, gray and green, with a mango peel stuck to her head.","She runs straight toward 300 guests in their nicest aloha wear. You chase her yelling \"PELLA! PELLA!\" Too late. She stops in the middle of the dance floor and shakes.","Pella, Pella. Pelapela. Dirty. Gross.","Now everybody is covered. Aunty's white muʻumuʻu is spotted like a cow. The kālua pig has a paw print on it. The band keeps playing, but mud drips out of the ʻukulele. Pella lies down under the dessert table, very proud of herself."],"Hold your arms out, dripping, and grimace. \"Peh-lah-PEH-lah!\"","The opposite of maʻemaʻe (468), clean.",null,"Muddy dog shaking at a lūʻau"],["v470","v",470,"momona","mo-MO-nah","to be fat; to be sweet","Mo'? MO'! ...nah?",["Aunty Mae thinks you look too skinny. She sets a plate of butter mochi in front of you. You eat it. She says \"Mo'?\" You say \"MO'!\" She brings more. \"Mo'?\" \"MO'!\" You keep waiting for yourself to say \"nah,\" but it never comes.","Hours pass. Mo', mo', mo'... the nah never shows up. Mo, mo, nah. Momona.","Your cheeks puff out. Your shirt buttons fly off like popcorn. You roll instead of walk. And everything about you is sweet. You sweat sugar. Bees follow you home. When you smile, your teeth sparkle like frosting.","Aunty Mae stands back with her arms crossed, very satisfied. \"Now you look healthy.\""],"Pat your full belly and nod. \"Mo-MO-nah.\"","ʻĀina momona means rich, fertile, abundant land.",null,"Endless butter mochi, Mo'? MO'!"],["v471","v",471,"ʻawaʻawa","ah-vah-AH-vah","to be bitter","Aw-VAH! AW-VAH!",["Your uncle grows bitter melon. He says it's good for you. He cuts you a slice and watches you closely.","You bite. Your face folds in half. Your eyes water. Your tongue tries to crawl out of your mouth and hide under the table. You make a sound like a baby who just dropped her ice cream. \"Aw-VAH! AW-VAH!\" Aw, vah, aw, vah. ʻAwaʻawa. Bitter.","The bitterness spreads. Your ears curl. Your hair stands straight up. The dog licks your hand, tastes it, and runs out the door.","Uncle eats three slices in a row without blinking. \"Good for you,\" he says, and his face doesn't move at all."],"Pucker your whole face and wail. \"Ah-vah-AH-vah!\"","ʻAwa is kava, the bitter root drink. A handy reminder.",null,"Face folding from bitter melon"],["v472","v",472,"paʻakikī","pah-ah-kee-KEE","to be hard, difficult; to be stubborn","PA! AH! KEY! KEEEY!",["Pa locked himself out of the house. Ma has the spare key right there. She holds it out. Pa will not take it. He is stubborn. \"I can do it myself.\"","He tries the window. Stuck. He tries a credit card in the door. It snaps. He climbs onto the roof looking for a way in, and the house doesn't even have a chimney. The kids are screaming \"PA! AH! KEY! KEEEY!\" Pa, ah, key, key. Paʻakikī. Hard. Stubborn.","So he starts chipping through the wall with a spoon. Nine hours later he crawls into the living room, covered in dust. Ma is on the couch, spinning the key on her finger. Pa brushes off his shirt and says, \"See? Easy.\"","It was not easy."],"Cross your arms and shake your head hard. \"Pah-ah-kee-KEE!\"","Its opposite is maʻalahi (473), easy.",null,"Stubborn Pa chipping a wall with a spoon"],["v473","v",473,"maʻalahi","mah-ah-LAH-hee","to be easy","Mah, ah, LA-HEE",["Your car breaks down on the H-3, in the rain, in the tunnel. You panic. Aunty Pua, riding in the back, just climbs out humming a little tune. \"Mah, ah, LA-HEE... la-hee...\" It's the sound of somebody not trying at all.","She lifts the front of the car with one hand. She fixes the engine with a chopstick and a hair tie. She changes a flat tire while eating a spam musubi. Then she pushes the whole car out of the tunnel with her pinky. All while humming. \"Mah, ah, LA-HEE.\"","Maʻalahi. Easy. Like la-dee-dah.","She gets back in, buckles up, and starts the crossword. You still haven't finished panicking."],"Brush off your hands like it was nothing. \"Mah-ah-LAH-hee.\"","The opposite of paʻakikī (472), hard.",null,"Aunty fixing a car with a chopstick"],["v474","v",474,"ʻilihune","ee-lee-HOO-neh","to be poor","EE-lee... HOO-neh?",["A couple is so poor they share one grain of rice for dinner. They cut it in half with a razor blade. Their TV is a cardboard box with a TV drawn on it. Their dog is a sock puppet.","The husband opens his wallet. A moth flies out. \"Honey,\" he says, \"we're broke. Again.\" The wife looks up from patching her one sock and says \"EE-lee... HOO-neh?\" Really, honey? Ee-lee, HOO-neh. ʻIlihune. Poor.","They try to pay the rent with seashells. The landlord says no. They offer him the sock puppet. He takes it.","They're happy anyway. They split their grain of rice and toast each other with two empty cups."],"Turn your pockets inside out. \"Ee-lee-HOO-neh?\"","If a pōā (405) robs you, you end up ʻilihune.",null,"Couple sharing one grain of rice"],["v475","v",475,"hāmama","haah-MAH-mah","to be wide open","HAAAH... MAMA!",["A mother hippo at a wild animal park yawns. It is the biggest yawn in history. \"HAAAAAAAH...\" Her mouth opens wider, and wider, and wider. A bus could drive in. A tour bus actually does drive in, by mistake, then carefully backs out.","The keeper stares up and yells \"HAAAH... MAMA!\" Haaa, mama. Hāmama. Wide open.","Her mouth stays open for a full hour. Birds fly in one side and out the other. A family spreads a mat and has a picnic on her tongue. The keeper parks his golf cart in there.","Finally she closes it, very slowly, with a sound like a garage door. Everybody claps. Then she yawns again."],"Open your mouth and arms as wide as they go. \"Haah-MAH-mah!\"","Pani means to close. And don't mix it up with hāmau (417), to hush.",null,"Hippo mama's mouth wide open"],["v476","v",476,"hohonu","ho-HO-noo","to be deep","HO! HO! NOOOO!",["You are standing on the end of the pier taking a selfie. The phone slips. It falls into a hole in the ocean floor that nobody knew was there. The deepest hole in the world.","You yell as it drops. \"HO! HO! NOOOOOOO!\" Ho, ho, noo. Hohonu. Deep.","You lean over and listen. You can hear your phone ringing, getting softer, and softer, and softer. Three hours later you can still hear it falling. A submarine goes down to look for it. A week later the submarine comes back up with a note taped to the hatch. \"Too deep.\"","Somewhere down there, your phone is still getting texts from your aunty. A glowing fish is reading them."],"Point down, down, way down, and wail. \"Ho-HO-noo!\"","Hohonu can also mean profound, like deep knowledge. He kanaka hohonu o ka ʻike is a person of deep knowledge.",null,"Phone falling into a bottomless hole"],["v477","v",477,"pāpaʻu","paah-PAH-oo","to be shallow","PAAA-PA... OW!",["Pa sees the water at the beach, runs down the sand, and yells \"Watch this!\" He leaps into a huge swan dive, arms out, toes pointed, like an Olympic diver.","The water is two inches deep. SPLAT. \"PAAAA-PA... OW!\" Paa, pa, ow. Pāpaʻu. Shallow.","He sits up with sand on his face and a small crab sitting on his nose. He tries surfing. The board just sits on the sand. He tries snorkeling and sees his own knees. He tries a cannonball and makes one tiny ripple and a big dent.","The kids are crying laughing. The crab climbs down and checks the water. It doesn't even come up to the crab's ankles."],"Dip one toe in and pull it right back. \"Paah-PAH-oo!\"","The opposite of hohonu (476), deep.",null,"Pa swan diving into two inches of water"],["v478","v",478,"mānoanoa","maah-no-ah-NO-ah","to be thick","MAAAN! NO-AH! NO-AH!",["Grandpa makes his poi so thick you don't eat it, you climb it. A spoon stands straight up in it. A fork stands up in it. A small child could stand up in it.","A visitor tries to stir it. The spoon won't move. He grabs it with both hands and pulls. He puts his foot on the bowl. His face turns red. \"MAAAAAN! NO-AH! NO-AH!\" Maaan, no-ah, no-ah. Mānoanoa. Thick.","The spoon stays put. The bowl lifts right off the table with him. Somebody hands him a pry bar. The pry bar gets stuck too.","Grandpa walks over, sticks one finger in, twirls, and eats a perfect bite. \"One finger,\" he says. \"Good poi.\""],"Pull hard on an invisible stuck spoon. \"Maah-no-ah-NO-ah!\"","One finger poi is the thickest poi, thick enough to scoop with just one finger.",null,"Spoon standing straight up in thick poi"],["v479","v",479,"lahilahi","lah-hee-LAH-hee","to be thin","La-HEE, la-HEE",["Your cousin Pua is so thin she can hide behind a chopstick. When she turns sideways, she disappears. She mails herself to Hilo in a regular envelope for one stamp.","Pua has a tiny thin giggle, like air squeaking out from under a door. \"La-HEE, la-HEE.\" When the trade wind blows, she flutters on the clothesline next to Aunty's koala from kaulaʻi. She slides under doors. She reads the newspaper by standing inside it.","La hee, la hee. Lahilahi. Thin.","At the beach she uses one strand of saimin as a boogie board. A frigate bird once picked her up by mistake, thinking she was a ribbon, and dropped her off on Lānaʻi. She giggled the whole way."],"Turn sideways and suck in your cheeks. \"Lah-hee-LAH-hee.\"","The opposite of mānoanoa (478), thick.",null,"Skinny cousin hiding behind a chopstick"],["v480","v",480,"laulā","lau-LAAH","to be wide","Lau... LAAAAA!",["The biggest party in history needs the biggest laulau in history. Forty uncles wrap one in ti leaves the size of parachutes. When they finish, it is as wide as the H-1. All six lanes. Both directions.","They have to shut down the freeway. The laulau sits there steaming. Cars line up just to look at it. It is so wide you can't see around it. A small plane lands on it by accident.","Everyone stands on the overpass and sings \"LAU... LAAAAAA!\" holding that last note as long as the laulau is wide. Lau, laaa. Laulā. Wide.","It takes 3,000 people a week to eat it. They start from both sides and meet in the middle."],"Sweep both arms out as wide as you can. \"Lau-LAAAH!\"","Don't mix it up with laulau, the pork wrapped in taro leaves. Lau means leaf.",null,"Laulau as wide as the H-1"],["v481","v",481,"ʻololī","oh-lo-LEE","to be narrow","Oh, LOLLY!",["There is a shortcut to the beach through an alley between two buildings. The alley is four inches wide. Everybody tries it anyway. Nobody fits.","Uncle tries it sideways and gets stuck with his cheek smooshed against the wall. Aunty gets stuck by her purse. The dog gets stuck. A pizza delivery gets stuck. Now there is a whole line of people wedged in there, groaning.","Then skinny cousin Pua from lahilahi walks up, looks at the gap and says \"Oh, LOLLY!\" because it's as narrow as a lollipop stick. Oh, lolly. ʻOlolī. Narrow. She slides right through, holding the long leee the whole way.","She waves from the beach while everyone else waits for the fire department to bring butter."],"Squeeze your palms close together, almost touching. \"Oh-lo-LEEE.\"","Laulā (480) is wide and ʻololī is narrow.",null,"Family stuck in a four inch alley"],["v482","v",482,"kokoke","ko-KO-keh","to be near","ko-ko-KEH!",["You are sleeping on the lanai at your aunty's house on Kauaʻi. Far away you hear a chicken. \"ko-ko-KEH...\" Very soft.","A minute later, closer. \"Ko-ko-KEH.\" Closer. \"KO-KO-KEH.\" Now it's on the steps. Now it's on the railing. Now it's on your pillow. Now its beak is right in your ear, closer than anything has ever been to your ear.","\"KO! KO! KEH!\" Kokoke. Near.","You open your eyes. It is 4 in the morning. There are actually 60 chickens, all near, all touching you. One is sitting on your face like a hat. They are all staring at you. They all take a deep breath together."],"Creep your fingers closer and closer to your ear. \"Ko-KO-keh!\"","Its opposite is mamao (483), far.",null,"Chicken crowing right in your ear"],["v483","v",483,"mamao","mah-MAH-oh","to be far","MA! MA-oh!",["Ma moved really far away. Not to the next town. To the very tip of the Big Island. And you are on the far end of Kauaʻi.","You need to ask her where the rice cooker is. So you climb to the top of a mountain and yell \"MA! MA-OH!\" Your voice flies out across the ocean. It takes three days to get there. Seabirds carry it part of the way.","On Thursday Ma hears a tiny faraway \"...ma-oh.\" She yells back. Her answer reaches you on Sunday. \"It's in the cupboard!\" By then you've already eaten at the drive in every night.","Ma, ma-oh. Mamao. Far."],"Shade your eyes and call to the horizon. \"Mah-MAH-oh!\"","Kokoke (482) is near and mamao is far.",null,"Yelling for Ma across the ocean"],["v484","v",484,"pōʻeleʻele","poh-eh-leh-EH-leh","to be dark (like night)","POH! Eh, Ellie? EH-leh?",["Ellie the black cat from ʻeleʻele got out, and it's midnight. No moon. No streetlights. It is the darkest night Kaimukī has ever had. You can't see your own hand.","The Nakamuras are out in the yard in their pajamas. Little Kenji walks face first into the mango tree. \"POH!\" Then he catches his breath and calls, \"Eh, Ellie? EH-leh?\" Pō, eh, Ellie, eh-leh. Pōʻeleʻele. Dark, like night.","The dark is so thick you could spread it on toast. Somebody switches on a flashlight, and the dark just eats the beam.","Then a pair of yellow eyes blinks open, right in front of your nose. Ellie was sitting on your head the whole time."],"Shut your eyes, wave your hands in front of you, and bonk. \"Poh-eh-leh-EH-leh.\"","Pō means night and ʻeleʻele (460) means black. Black night.",null,"Searching for a black cat at midnight"],["v485","v",485,"mālamalama","maah-lah-mah-LAH-mah","to be bright, clear","Ma! LLAMA! LLAMA!",["There's a llama farm on the Big Island where the llamas glow. Nobody knows why. They are brighter than headlights. When they walk into the pasture, the sun looks dim.","The farmer's little boy loves them. Every night he runs outside and shouts \"MA! LLAMA! LLAMA!\" and his mother has to put on sunglasses before she opens the door. Ma, llama, llama. Mālamalama. Bright. Clear.","At night the whole valley is lit up like noon. Boats use the llamas as a lighthouse. Moths fly in from three islands away. The neighbors complain they can't sleep, so the farmer puts a thick blanket on each llama. They glow right through it."],"Squint and shield your eyes from the glow. \"Maah-lah-mah-LAH-mah!\"","Don't mix it up with mālama (to care for). Mālamalama has an extra lama and a lot more light.",null,"Glowing llamas lighting up a valley"],["v486","v",486,"ʻoʻoleʻa","oh-oh-LEH-ah","to be hard, stiff","Oh! Oh! LEAH!",["Leah is playing freeze tag in the park. She gets tagged. She freezes. And she takes it very, very seriously.","She stays frozen for three days. Stiff as a board. Arms sticking straight out. Her friends poke her and yell \"Oh! Oh! LEAH!\" with a little hiccup between each oh. Oh, oh, Leah. ʻOʻoleʻa. Hard. Stiff.","Her dad carries her home under his arm like a surfboard. He leans her in the corner and uses her as a coat rack. Aunty hangs her purse on Leah's arm. A gecko climbs onto her head. You knock on her elbow and it goes tock, tock, like wood.","On day four somebody finally tags her back. She blinks and says, \"Did I win?\""],"Freeze completely, arms stiff, then crack a smile. \"Oh-oh-LEH-ah!\"","The opposite of palupalu (487), soft.",null,"Frozen Leah used as a coat rack"],["v487","v",487,"palupalu","pah-loo-PAH-loo","to be soft, weak","PA! LOO(K)! PA! LOO(K)!",["A mattress store in Kapolei gets a new bed. The sign says SOFTEST BED IN THE WORLD. Pa lies down to test it.","He sinks. Slowly at first, like into warm pudding. Then deeper. The kids watch his feet disappear. They scream \"PA! LOO(K)! PA! LOO(K)!\" Pa, loo, pa, loo. Palupalu. Soft.","Only his nose is showing. Then just a bubble. The salesman pokes the bed and his arm sinks in up to the shoulder. The bed is so soft it's more like a cloud with a price tag.","After an hour Pa floats back up, sleepy and smiling. \"We'll take it,\" he says. They deliver it in a bucket."],"Squish an invisible marshmallow between your fingers. \"Pah-loo-PAH-loo.\"","The opposite of ʻoʻoleʻa (486), hard or stiff.",null,"Pa sinking into a super soft bed"],["v488","v",488,"ʻinoʻino","ee-no-EE-no","to be bad; to be stormy","EE! NO! EE! NO!",["The worst storm in 100 years hits the North Shore. The rain goes sideways. Then upward. Palm trees bend flat. A whole chicken coop flies past your window with the chickens still sitting inside, looking bored.","Your little brother watches the neighbor's trampoline float by and screams \"EE! NO! EE! NO!\" Ee, no, ee, no. ʻInoʻino. Bad. Stormy.","The roof of the shed lands in the ocean, and a surfer rides it. The wind strips the mango tree and sticks every mango to the side of the house like magnets. The dog's ears turn inside out and stay that way.","When the storm finally passes, the sun comes out, and your brother is still yelling \"Ee, no!\" out of habit."],"Hold onto an invisible doorframe against the wind. \"Ee-no-EE-no!\"","ʻIno alone means bad or wicked. Doubled, ʻinoʻino is extra bad.",null,"Trampoline flying past in a storm"],["v489","v",489,"pupule","poo-POO-leh","to be crazy","Poo-POODLE-eh!",["There is a poodle in Waikīkī who has completely lost its mind. It wears sunglasses at night. It drives a golf cart through a hotel lobby. It jumps off the pier holding an umbrella like it's going to fly.","It barks at the ocean, and the ocean barks back. It orders a plate lunch in perfect English, then eats the plate. It sings opera to the pigeons. It tries to adopt a mongoose.","Everyone on Kalākaua points and yells \"POO-POODLE-EH!\" Poo, poodle, eh. Pupule. Crazy.","At sunset it paddles out on a boogie board, catches a wave, and stands on its head the whole ride. Honestly, it's the best surfer on the beach."],"Twirl your finger next to your ear. \"Poo-POO-leh!\"","Pupule is common in local pidgin too, as in \"You pupule or what?\"",null,"Crazy poodle driving a golf cart"],["v490","v",490,"hūpō","hoo-POH","to be foolish","HOOOOP! OHHH!",["Your cousin buys 400 plastic hoops at a garage sale. He has a plan. He will put all 400 on at once, spin them all together, and become famous.","He steps into them. He can't move. He looks like a giant slinky. He tries to spin, tips over, and starts rolling down the driveway like a spring. Then down the street. Then down the hill. He's yelling the whole way. \"HOOOOOP! OHHHH!\" Hoop, oh. Hūpō. Foolish. Both vowels long, like his scream.","He rolls past the school, past the store, across the beach and into the ocean. He floats there, 400 rings around him, like a jellyfish. When the lifeguard pulls him out, he looks up and says, \"Next time, 500.\""],"Smack your own forehead. \"Hoo-POH.\"","Hūpō is foolish in the sense of not knowing better, literally swelling darkness. Pupule (489) is crazy.",null,"Cousin rolling downhill in 400 hoops"],["v491","v",491,"kaulana","kow-LAH-nah","to be famous","COW! LANA!",["There's a cow named Lana on a ranch in Kula. One day a visitor posts a video of Lana tap dancing on a wooden bridge. Overnight, Lana is famous.","By Monday there are cameras everywhere. By Wednesday she has sunglasses and a manager. Fans scream from the fence \"COW! LANA! COW! LAAANA!\" Cow, Lana. Kaulana. Famous.","She's on a cereal box. She's on a billboard over the H-1. She has a red carpet leading to her water trough. She signs autographs by dipping her hoof in poi. Even the other cows line up for selfies with her.","Lana just chews her grass, cool as ever, while a helicopter films her from above."],"Wave to your adoring fans. \"Kow-LAH-nah!\"","Kaulana Nā Pua, Famous Are the Flowers, is a beloved Hawaiian song from 1893.",null,"Famous cow Lana signing autographs"],["v492","v",492,"like","LEE-keh","to be alike, the same","LIKE, EH?",["Forty uncles show up to the family reunion, and they are all wearing the exact same aloha shirt. Same blue flowers. Same shorts. Same slippahs. Same sunglasses on the same bald head.","They look at each other for a long time. Then all forty say, at the same moment, \"LIKE, EH?\" Like, eh. Like. Alike. Same.","They all reach for the same piece of chicken. They all sneeze together. When one laughs, all 40 laugh the same laugh at the same time. Aunty tries to find her husband and gives up after twenty minutes. She just picks one to drive home. He's fine. They're all the same."],"Point at two things and nod. \"LEE-keh.\"","It's spelled like the English word like, and it even means alike. Its opposite is ʻokoʻa (493), different.",null,"Forty identical uncles in the same shirt"],["v493","v",493,"ʻokoʻa","oh-KO-ah","to be different","OH! KOA!",["The same 40 uncles from like are lined up for the family photo. Same shirts, same slippahs, same smile. The photographer counts. \"38... 39... 40... 41?\"","There is a forty first. At the end of the line stands a koa tree. It is not wearing the shirt. It does not have slippahs. It does not have arms. Everyone turns to stare. \"OH! KOA!\" Oh, koa. ʻOkoʻa. Different.","The tree just stands there, rustling a little. Somebody says it must be Uncle Boy's cousin from Hilo. Nobody argues.","The photo comes out with 40 matching uncles and one tall koa tree right in the middle. It's the only thing anyone ever looks at."],"Point at the odd one out, with a little catch first. \"Oh-KO-ah!\"","Like (492) is same and ʻokoʻa is different. It also hides inside kūʻokoʻa (434), independent.",null,"Koa tree in a line of identical uncles"],["v494","v",494,"mālie","maah-LEE-eh","to be calm, gentle","Maaah-lee, eh...",["Remember baby Molly from hoʻomālie, the twelve foot baby at the mall? She grew up. She is now a lifeguard, and she is the calmest person on the planet.","A hurricane comes. Everyone runs. Molly sits in her tower sipping tea. The wind reaches her and turns gentle, like a fan on low. The waves reach her and lie flat. Even the hurricane slows down to listen. \"Maaah-lee... eh,\" she says softly to the storm. Maah, lee, eh. Mālie. Calm. Gentle.","The hurricane curls up on the sand like a sleepy dog and turns into a nice little breeze. Molly pats it on the head. Everyone comes back and finishes their picnic."],"Lower both palms slowly, like smoothing water. \"Maah-LEE-eh.\"","Hoʻomālie (416) means to calm someone down. Mālie is the calm itself.",null,"Calm lifeguard soothing a hurricane"],["v495","v",495,"ʻami","AH-mee","to rotate the hips (a hula step)","ARMY! ʻAMI!",["A drill sergeant stands in front of 500 soldiers on the parade field. He blows his whistle. \"ARMY!\" They snap to attention. \"ʻAMI!\"","Five hundred soldiers put their hands on their hips and rotate them in a slow, smooth circle. Around and around. Perfect hula. The sergeant watches, very serious. \"Army! ʻAmi! Other way!\" Five hundred hips turn the other way, all together.","Ah, mee. Army. ʻAmi. The hip circle of hula.","By lunch the whole base is moving together like a hālau. The trucks sway. The flag sways. And later that night, alone in his office, the sergeant is secretly practicing too. He signs up for hula class that weekend."],"Hands on hips, circle them slowly. \"AH-mee.\"","ʻAmi and kāholo (496) are two of the first hula steps students learn.",null,"Army soldiers doing the hula ʻami"],["v496","v",496,"kāholo","kaah-HO-lo","to step side to side (a hula step)","CAAAR! HOLE! OH!",["The road to your house has so many potholes the city gave up. Some are small. Some are the size of a swimming pool. One has fish in it.","Your car has learned to dance. When it sees a hole, it steps to the side. Step, step, together, step. Then back the other way. Everyone inside yells \"CAAAR! HOLE! OH!\" Caaar, hole, oh. Kāholo. The side to side hula step.","It keeps rhythm the whole way home. Four steps right, four steps left, never misses a beat. The tires stay perfectly in time.","A kumu hula waiting at the bus stop watches it go by and nods. \"Good kāholo,\" she says. \"Now watch your hands.\" The car does not have hands."],"Step right, right, left, left, swaying. \"Kaah-HO-lo!\"","Holo means to run, sail or ride.",null,"Car stepping side to side around potholes"],["v497","v",497,"peʻahi","peh-AH-hee","to fan; to wave","Pay... AHH-hee!",["It's the hottest day of the year. A visitor on the beach is melting like a candle. A man walks up carrying a fan the size of a garage door and says, \"Pay, and I fan.\"","The visitor pays. The man waves the giant fan. WHOOSH. The visitor's hat blows to Molokaʻi. His face ripples. He lets out a long \"AHHH... HEE!\" of pure relief. Pay, ah, hee. Peʻahi. To fan. To wave.","Now there's a line. Pay, fan, \"Ahhh-hee!\" The waves start rolling the wrong direction. Sailboats go backward. After an hour the whole beach is so cool people are putting on jackets. The fan man waves goodbye with the same fan and blows a family's umbrella into the parking lot."],"Fan yourself hard, then sigh with relief. \"Peh-AH-hee!\"","Peʻahi is also the name of the famous big wave surf spot on Maui's north shore.",null,"Giant fan cooling the whole beach"],["v498","v",498,"ani","AH-nee","to beckon; to blow gently","Ahh... Annie.",["There is a breeze that lives on the North Shore named Annie. You can't see her, but you always know when she's around. She is the softest, gentlest breeze on earth.","When she wants you to come over, she curls her little fingers of wind. Come here. Come here. The palm leaves lean toward her. Your hair lifts gently. Even a strawberry shave ice drips in her direction. Everybody on the beach smiles and whispers \"Ahh... Annie.\"","Ah, nee. Ani. To beckon. To blow gently.","You follow her down the beach, pulled softly by the back of your shirt. She leads you to the perfect spot, in the shade, facing the sunset. Then she smooths your towel flat and floats away."],"Curl one finger toward you slowly. \"AH-nee.\"","Peʻahi (497) is to fan or wave. Ani is to beckon, and also a breeze blowing softly.",null,"Gentle breeze Annie beckoning you"],["v499","v",499,"hoʻomoana","ho-oh-mo-AH-nah","to camp","Ho... oh... MOAN, ah",["Your family goes camping at the beach park for Easter weekend. It's tradition. Forty people, twelve tents, three generators and a pig.","The first night you lie in your sleeping bag on a rock the shape of a fist. A mosquito sings in your ear. Somebody's uncle snores like a leaf blower. The chickens start at 3 in the morning. You moan. \"Ho... oh... MOAN... ah.\" Ho, oh, moan, ah. Hoʻomoana. To camp.","Every night you moan louder. By Sunday the whole campsite is moaning together in harmony, like a choir.","Then on Monday you pack up the tent, and you already miss it. You can't wait for next year."],"Roll over on a lumpy invisible rock and groan. \"Ho-oh-mo-AH-nah.\"","Moana alone means the open ocean.",null,"Moaning in a tent on a rock"],["v500","v",500,"manawaleʻa","mah-nah-vah-LEH-ah","to give freely, to be generous","Man! A VALLEY? AH!",["There's an aunty in Mānoa who gives her time and help to everyone for free. The food bank, the beach cleanup, the church bake sale, school crossing guard, all before breakfast. She never takes a dime.","One day somebody sighs, \"The whole valley needs cleaning.\" Aunty rolls up her sleeves. People laugh. \"Man! A VALLEY? AH!\" Man, a valley, ah. Manawaleʻa. To give freely, with a generous heart.","She starts at the top. She picks up every piece of trash, pulls every weed and paints every fence. She fixes 900 potholes, plants 4,000 trees and hands every kid a free musubi.","By Sunday the valley sparkles. And the people who laughed are right behind her, carrying rakes, giving their time freely too."],"Hold out both open hands like you're giving something away. \"Mah-nah-vah-LEH-ah!\"","Manawa here means heart or feelings, and leʻa means joy or pleasure. A joyful heart that gives. Hui manawaleʻa is a relief society.",null,"Aunty cleaning a whole valley for free"],["n001","n",1,"kanaka","kah-NAH-kah","person, human being","Kah? NAH. Kah!",["A robot lands at Ala Moana Beach Park. It is 9 feet tall, shiny as a new rice cooker, and it has one job. Find a human being.","It rolls up to a sandcastle shaped like a man and scans it. \"Kah?\" it beeps. Long pause. \"Nah.\" The sandcastle falls over from embarrassment.","It scans a mannequin outside a surf shop. \"Kah? Nah.\" It scans a mongoose, a boogie board and a coconut wearing sunglasses. \"Nah. Nah. Nah.\"","Then it points its big glass eye at you. You are sandy, sunburned and eating a spam musubi. Lights flash. Bells ring. \"Kah? Nah... KAH!\" Human confirmed. A real, breathing, snack-eating person.","The robot is so happy it hugs you, prints a certificate that says PERSON, and flies home."],"Point at your own chest like the robot. \"Kah-NAH-kah.\"","With a long first vowel, kānaka is the plural, people. Kanaka Maoli means Native Hawaiian people.",null,"Robot scanning beachgoers for humans"],["n002","n",2,"wahine","vah-HEE-neh","woman; wife","Vah! HEE-neigh!",["It is the big rodeo in Waimea on the Big Island. Out of the chute comes a horse the size of a delivery truck. It has thrown 214 cowboys this year. On its back is one small woman in a lauhala hat, holding on with one hand and her coffee with the other.","The horse bucks. It spins. It jumps so high it scares a passing airplane. Every time it lands it screams \"VAH! HEE-NEIGH!\"","She does not spill one drop. After 9 minutes the horse gives up, lies down and lets her use it as a couch.","The whole crowd stands and chants the horse's own sound back at her. \"Vah-HEE-neh! Vah-HEE-neh!\" Her husband yells \"That's my wife!\" and faints."],"Hold invisible reins, bounce in your seat. \"Vah-HEE-neh!\"","With a long first vowel, wāhine is the plural, women. You will see Wahine on the women's restroom door in Hawaiʻi.",null,"Tiny woman riding a giant bucking horse"],["n003","n",3,"kāne","KAAH-neh","man; husband","Caaaan, eh!",["It is a beach wedding at sunset. The groom is a big man with a neck like a tree stump. He has practiced his line for weeks. The minister asks, \"Can you promise to love her, carry her groceries, and open every stuck jar for the rest of your life?\"","The groom takes a breath so big his shirt buttons pop off. \"CAAAAAAN... EH!\" He holds that long \"caaan\" for 31 seconds. The seagulls leave. A wave stops halfway up the beach to listen.","To prove it, he opens a stuck pickle jar with two fingers, then crushes a soda can flat on his own forehead. Everybody cheers. She has a husband. A real man who caaan."],"Flex both arms and hold the long vowel. \"KAAAAH-neh.\"","Kāne is on the men's restroom door, wahine is on the women's. Do not mix them up at the beach park.",null,"Groom yelling Caaan, eh at his wedding"],["n004","n",4,"keiki","KAY-kee","child","Cakey!",["It is a baby's first birthday lūʻau in a rented hall with 300 guests. In the middle of the room is a cake 3 feet tall, covered in frosting flowers.","The birthday child crawls across the table, stands up, and dives face first into the cake like it is a swimming pool. SPLOOSH. Frosting hits the ceiling fan. The fan throws it onto Aunty's hair, Uncle's aloha shirt and the DJ.","The kid comes up for air with a face like a frosted donut. Only two eyes blinking. The whole room screams \"CAKEY! CAKEY!\"","That is a child. Loud, sticky, happy, and completely cakey. Every family party in Hawaiʻi has at least 12 of them running around under the tables."],"Wipe invisible frosting off your face. \"KAY-kee.\"","You will see keiki all over Hawaiʻi, like a keiki menu or a keiki hula class. For many children, see kamaliʻi.",null,"Baby face deep in a birthday cake"],["n005","n",5,"kamaliʻi","kah-mah-LEE-ee","children","Calm, Molly! EE!",["You agree to babysit for one hour. You open the door and 23 children run in. Every single one of them is named Molly. Nobody can explain this.","They climb the curtains. They put the cat in the rice cooker (it is off, the cat is fine). One Molly is on the roof. Another Molly is inside the piano.","You stand on a chair and yell \"CALM, MOLLY!\" All 23 Mollys freeze at once. Total silence. Then all 23 hiccup at the same time. \"EE!\" That hiccup is the ʻokina, a tiny catch in the throat.","Then they go wild again. You spend the rest of the hour yelling \"CALM, MOLLY! EE!\" over and over. Children. So many children."],"Hands out like you are stopping a stampede. \"Kah-mah-LEE,\" little hiccup, \"ee.\"","Kamaliʻi means children, a whole bunch of them. One child is a keiki. The cakey kid from keiki is probably in there somewhere.",null,"23 kids named Molly freezing mid-chaos"],["n006","n",6,"makua","mah-KOO-ah","parent; elder relative","Ma, cool ah?",["You are 16 and standing on a rock 40 feet above the ocean. Your friends are already in the water yelling at you to jump. But first you need permission.","You turn around. Way back on the beach, your mother sits in a lawn chair with a clipboard. Next to her is your father with a whistle. Behind them sit your aunty, your uncle, and a grandma holding binoculars. Every grown-up relative you have, lined up like judges at a surf contest.","You cup your hands and scream \"MA! COOL, AH?\"","The parents huddle. They argue for 11 minutes. Finally your mother holds up a sign that says NO. Your aunty holds up one that says MAYBE. Grandma is asleep. You climb down and eat a sandwich."],"Look back over your shoulder like you are asking permission. \"Mah-KOO-ah?\"","Makua can be a parent or any relative of the parents' generation, like an aunt or uncle. It is also the front half of makuahine (mother) and makua kāne (father).",null,"Teen on cliff asking parents for permission"],["n007","n",7,"makuahine","mah-koo-ah-HEE-neh","mother","Ma, cool ah? HEE-neigh!",["You are 6 years old and lost at Ala Moana Center on the Saturday before Christmas. There are 10,000 people. All you can see is knees and shopping bags. You start to cry.","Then, far away, over all the noise, you hear it. A laugh like a happy horse. \"HEE-NEIGH! HEE-NEIGH!\" Only one person on Earth laughs like that. Your mother.","You follow the sound past the food court, past the koi pond, up the escalator. There she is, laughing at a joke from a lady selling socks. She scoops you up. You sniff and ask \"Ma, cool, ah?\" and she laughs again. \"HEE-NEIGH!\"","Makua plus wahine. The parent who is a woman. Your mother."],"Laugh like a horse, then point to the sky. \"Mah-koo-ah-HEE-neh.\"","Makua (parent) plus wahine (woman) makes makuahine. Once you see the pieces, it builds itself.",null,"Lost kid following mom's horse laugh"],["n008","n",8,"makua kāne","mah-KOO-ah KAAH-neh","father","Ma, cool ah? CAAAN, eh!",["Your family truck is stuck in soft sand at the beach. The tide is coming in. Eight cousins push. Two aunties push. The dog pushes. Nothing.","You run to your mother. \"Ma, cool, ah, if we just leave it?\" She points. \"Ask your father.\"","Your father puts down his plate lunch. He walks over in rubber slippahs. He squats, grabs the back bumper, and says \"CAAAAAN... EH!\" He holds that long \"caaan\" the whole time he lifts.","The truck rises one foot, two feet, four feet. Sand pours out of the tires like a waterfall.","He carries the whole truck up to the parking lot, sets it down gently, and goes back to his lunch. It is still warm. Makua plus kāne. The parent who is a man. Your father."],"Lift an invisible truck and hold the long vowel. \"Mah-KOO-ah KAAAH-neh.\"","Makua (parent) plus kāne (man) makes makua kāne, father. Pukui-Elbert writes it as two words, while makuahine (mother) is one word. Makua kāne can also mean an uncle or any man of your parents' generation.",null,"Dad lifting stuck truck out of sand"],["n009","n",9,"kupuna","koo-POO-nah","grandparent, elder, ancestor","Coupon, ah!",["Your grandma takes you shopping at the drugstore. She walks in carrying a coupon book 4 inches thick, held together with a rubber band older than your father.","At the register the total is $412. Tūtū does not blink.","She licks her thumb and flips. \"Coupon, ah!\" Rice, minus two dollars. \"Coupon, ah!\" Toilet paper, half off. \"Coupon, ah!\" Dried mango, buy one get one.","The cashier starts to sweat. A line of 30 people forms, and nobody complains, because they are taking notes.","Final total, $3.18. The store manager comes out and shakes her hand.","In the car she tells you she learned it from her own grandmother, who learned it from hers. The wisdom of the elders, handed down, one coupon at a time."],"Hold up an invisible coupon proudly. \"Koo-POO-nah.\"","With a long first vowel, kūpuna is the plural, elders or ancestors. You will hear kūpuna used with deep respect all over Hawaiʻi.",null,"Grandma with a giant coupon book at the register"],["n010","n",10,"tūtū","too-TOO","grandma, grandpa","TOOOOT TOOOOT!",["Your grandma is 91 and just got a red electric scooter for her birthday. Big mistake. She has taken off the speed limiter with a butter knife.","She rips through the swap meet at 30 miles an hour with a basket full of mangoes. Instead of a horn, she just yells. \"TOOOOO-TOOOOO!\" Long and loud like a train, both vowels held forever. People dive out of the way. A man selling T-shirts jumps into a cooler.","Later that day your grandpa gets one too. Now there are two of them, racing each other around the church parking lot, both yelling \"TOOOO-TOOOO!\" The pastor just waves. Every grandkid in the family runs behind them trying to catch a ride."],"Pull an invisible train whistle. \"Toooo-TOOOO.\" Hold both long.","Tūtū works for grandma or grandpa. Tūtū wahine is grandma, tūtū kāne is grandpa. Pukui-Elbert lists it under the spelling kūkū, usually pronounced tūtū.",null,"Grandma on scooter yelling Toot toot"],["n011","n",11,"moʻopuna","mo-oh-POO-nah","grandchild","Mo... oh! Poo? Nah.",["Grandpa is babysitting his grandchild for the first time in 30 years. He has forgotten everything. He is holding the baby like a bowling ball.","Something smells. Grandpa lifts the baby up to his nose very slowly, like he is defusing a bomb. He sniffs. \"Mmmmmo...\" He freezes with a gulp. That is the ʻokina. \"...OH!\" He checks the diaper. \"Poo?\" Long pause. \"...NAH.\" It was the dog the whole time.","The baby grabs Grandpa's nose and laughs so hard it hiccups. Grandpa laughs too. By the time Grandma gets home, the grandchild is asleep on his chest and he is asleep in the recliner, both snoring in the same rhythm. Mo, oh, poo? Nah."],"Sniff the air, gulp, then shake your head. \"Mo-oh-POO-nah.\"","Moʻo can mean a lizard, and also a line or series, like a family line. Your grandchild continues the line.",null,"Grandpa sniff-checking the baby"],["n012","n",12,"kaikuaʻana","kai-koo-ah-AH-nah","older sibling (same gender)","Kai, cool, ah? AH... nah.",["Your big brother is named Kai. He is 17. You are 11. He has a car, a job, and a room with a lock on it. You have none of those things.","Every day you ask him something. \"Kai, cool, ah, if I borrow your skateboard?\" He does not even look up. \"Ah...\" he says, stopping with a little catch in his throat. \"...nah.\"","\"Kai, cool, ah, if I sit in the front seat?\" \"Ah... nah.\" \"Kai, cool, ah, if I eat the last malasada?\" \"AH... NAH.\" He eats it in one bite while looking at you.","One day you ask 44 times in a row just to see. He answers every time. That is an older sibling. Same gender as you, a little bigger, and always saying \"ah, nah.\""],"Cross your arms like a big brother. \"Kai-koo-ah, AH-nah.\"","Kaikuaʻana is only for the same gender. A boy's older brother, or a girl's older sister. The younger one is kaikaina.",null,"Big brother saying ah, nah to everything"],["n013","n",13,"kaikaina","kai-KAI-nah","younger sibling (same gender)","Kai! KAI! Nah!",["You and your little sister rent a two person kayak in Kailua. The plan is to paddle 3 miles out to the islands. You sit in back. She sits in front with a paddle she has no plans to use.","You push off. She points at the ocean and yells \"KAI! KAI!\" which just means sea. Yes. It is the sea. We are on it. \"Paddle!\" you say. She thinks about it. \"Nah.\"","For 3 miles she yells \"KAI! KAI!\" at every wave, every fish, and one very confused turtle. Every time you ask her to paddle, \"Nah.\" You arrive with arms like cooked noodles. She arrives with a tan.","That is a younger sibling. Same gender as you, rides for free, and never paddles."],"Point at the ocean, then fold your arms. \"Kai-KAI-nah.\"","Kai means sea. Kaikaina is a younger sibling of the same gender. The older one is kaikuaʻana.",null,"Little sister in kayak refusing to paddle"],["n014","n",14,"kaikunāne","kai-koo-NAAH-neh","a girl's brother","Guy? Cool NAAAH-nee!",["A girl in third grade has a big brother who is 6 foot 5 and plays on the high school football team. His neck is wider than her whole head.","Every morning he braids her hair into perfect double French braids. He packs her bento with a smiley face made of nori. He walks her to class carrying her unicorn backpack, which looks like a coin purse on his giant shoulder.","The other girls stare. One whispers, \"That guy?\" Her friend nods slowly. \"Cool naaaanny.\" They say it long, with their mouths open. \"Guy... cool... NAAAH-nee.\"","That is a girl's brother. Big, scary looking, and the best nanny in the whole school."],"Mime braiding hair with huge clumsy hands. \"Kai-koo-NAAAH-neh.\"","Only a girl uses kaikunāne for her brother. A boy calls his brother kaikuaʻana (older) or kaikaina (younger).",null,"Football player braiding his little sister's hair"],["n015","n",15,"kaikuahine","kai-koo-ah-HEE-neh","a boy's sister","Kai, cool, ah? HEE-heh!",["Remember Kai, the big brother who says \"ah, nah\" to everything? He has a sister. She is 9, and she has been planning her revenge for years.","It is a hot day. She walks up with a tall glass of what looks like lemonade, with ice and a little umbrella. \"Kai, cool, ah?\" she asks, sweet as a malasada.","He grabs it and chugs. It is pickle juice. Pure pickle juice, with a spoon of hot mustard. His face folds up like a paper fan.","His ears turn purple. Steam may come out.","She runs away giggling \"HEE-HEH! HEE-HEH!\" all the way down the street. That is a boy's sister. Sweet voice, evil giggle, perfect memory."],"Hand someone an invisible drink, then giggle. \"Kai-koo-ah-HEE-neh.\"","Only a boy uses kaikuahine for his sister. A girl calls her brother kaikunāne. Notice the -hine ending, like wahine, woman.",null,"Little sister giving big brother pickle juice"],["n016","n",16,"hoahānau","ho-ah-haah-NOW","cousin","Whoa, ah! HAAAH! Now!",["It is the family reunion at the beach park and the cousins decide to build a human pyramid. There are 28 of them. The oldest is 44. The youngest is 5. Most of them met today.","Cousin Boy is on the bottom because he is the biggest. Cousins climb onto cousins onto cousins. It gets 5 stories high. A small cousin at the top waves a flag.","Cousin Boy starts to shake. \"Whoa... ah...\" His knees wobble. \"HAAAAAH...\" he gasps, holding the long breath. \"NOW!\" The whole pyramid collapses into the sand in a pile of cousins, slippahs and potato chips.","Everyone is laughing. Nobody is hurt. Aunty takes a picture. That is cousins. A giant pile of people who share grandparents and fall down together."],"Wobble your knees, then fall into a chair. \"Ho-ah-haaah-NOW.\"","Hoa means companion, and hānau means birth. Your cousin is a companion from the same birth line. It can also mean a fellow church member.",null,"Pyramid of cousins collapsing on the beach"],["n017","n",17,"ʻohana","oh-HAH-nah","family","Oh, HANNAH!",["It is Sunday dinner at Grandma's house. There are 11 chairs and 14 people already. Then the door opens and Aunty Hannah walks in with more people.","She brought the neighbor. \"Oh, HANNAH!\" She brought the mailman. \"Oh, HANNAH!\" She brought the guy who fixed her tires, his wife, their three kids, and a goat that followed them from the park. \"OH, HANNAH!\"","Everyone groans. And then everyone scoots over. Grandma cooks another pot of rice. Somebody finds more chairs. The goat gets a bowl of poi.","By dessert there are 43 people squeezed into a 3 bedroom house and the mailman is calling Grandma \"Mom.\" That is family. Everyone yells \"Oh, Hannah,\" and then everybody makes room. Start with a small catch in your throat, the ʻokina, before the \"oh.\""],"Throw up your hands and then pull out a chair. \"Oh-HAH-nah.\"","One popular explanation links ʻohana to ʻohā, the young taro shoot that grows from the older corm. The family grows from the same root.",null,"Aunty Hannah bringing a goat to dinner"],["n018","n",18,"hoaloha","ho-ah-LO-hah","friend","Whoa, ah... ALOHA!",["You come home to Honolulu after 2 years on the continent. You walk out into the airport, and at the far end, 200 feet away, is your best friend.","She is wearing 40 lei. Carnation, plumeria, candy lei, one made of dried cuttlefish. She sees you and runs. Full speed. Her slippahs hit the shiny floor and she starts to slide.","\"WHOA... AH...\" She is sliding sideways past the baggage claim. \"...ALOHAAAA!\" She crashes into you at 20 miles an hour. You both go down in a pile of flowers.","She puts every one of the 40 lei on your neck. You cannot see. You smell like a flower shop that sells jerky. That is a friend. A loved companion who crashes into you on purpose."],"Open your arms wide for a crash hug. \"Ho-ah-LO-hah.\"","Hoa (companion) plus aloha (love) makes hoaloha, literally a beloved companion. You may also see it written hoa aloha, or hoaaloha in older writing.",null,"Friend in 40 lei sliding across the airport"],["n019","n",19,"hoa","HO-ah","companion, mate, partner","WHOA!",["You and your partner rent a tandem bicycle, the long one with two seats. You are in front. Your partner is behind you, and his job is to pedal and trust you.","You take it up Tantalus. Then you point it down. There are no brakes on the back seat. There are barely brakes on the front seat.","You pick up speed. 20 miles an hour. 35. 50.","Your partner holds on and yells one word through every single curve. \"WHOA! WHOA! WHOOOAAA!\" A tour bus pulls over to watch. A mongoose covers its eyes.","At the bottom you coast to a stop. Your partner's hair is straight back like a broom. He climbs off, shakes, and gets right back on. That is a partner. Your mate. The one who yells \"whoa\" and still rides with you."],"Grip invisible handlebars and lean. \"HO-ah!\"","Hoa is the root in hoaloha (friend), hoahānau (cousin) and hoalauna (neighbor). Spot it and you know it is a kind of companion.",null,"Two people screaming on a tandem bike downhill"],["n020","n",20,"hoalauna","ho-ah-LAU-nah","neighbor","Whoa, ah... LOUD, nah?",["It is 5 in the morning. Your new neighbor has a speaker the size of a refrigerator on his lanai. He is playing ʻukulele through it. The same three chords, over and over, at a volume that shakes the mangoes off your tree.","You climb on a bucket and look over the fence. \"Whoa, ah...\" you say, trying to be nice. \"LOUD, nah?\"","He smiles big and says \"NAH!\" and turns it up. Your windows rattle. Your dog howls along.","But then he hands a plate of banana bread over the fence. Warm. With butter. The next day he fixes your gate. The day after that he feeds your cat when you go to Maui. Loud, nah? Yes, loud. But that is your neighbor. Say \"whoa, ah, loud-nah\" fast and it slides into the word."],"Lean over an invisible fence. \"Ho-ah-LAU-nah.\"","Hoa (companion) plus launa (friendly, getting along). A neighbor is a companion you get along with, hopefully.",null,"Neighbor with giant speaker at 5 a.m."],["n021","n",21,"kumu","KOO-moo","teacher; source; reason","Coo... MOOOO.",["There is a school on a farm upcountry on Maui, and the teacher is a cow. A big brown one wearing reading glasses. She stands at a chalkboard holding a piece of chalk in her mouth.","The students are 30 baby calves in tiny desks. One raises a hoof. \"Where does milk come from?\" The teacher leans in and says softly, \"Coo...\" then louder, \"MOOOO.\" She points at herself.","\"Where does cheese come from?\" \"Coo... MOOOO.\" \"Why is there ice cream?\" \"Coo... MOOOO.\"","She is the teacher. She is the source. She is the reason. Every answer in that classroom is the same big brown cow. Coo-moo."],"Push up invisible glasses, then mo
