lls them parkies.","She holds up the first one and sings, \"Laaaa... PARKIES!\" One by one, 40 rabbits in 40 parkas. They hop across the snow in a line like a tiny ski team.","Laaa, parky. Lāpaki. Rabbit."],"Zip up an invisible tiny parka. \"Laah-PAH-kee.\"","Lāpaki comes from the English word rabbit, said Hawaiian style. Hawaiian has no r or b, so the r became l and the b became p.",null,"Forty rabbits in parkas on the snow"],["n447","n",447,"ʻelelū","eh-leh-LOO","cockroach","Eh! Leh! LOOOO!",["It is a hot night, and your cousin Keola, who is 6 foot 4 and plays football, is brushing his teeth. A cockroach three inches long crawls out of the drain. It looks at him. It opens its wings.","Everybody who lives in Hawaiʻi knows what happens next. It flies.","It flies straight at his face. Keola screams in a voice higher than a whistle, a yodel that echoes through the whole house. \"EH! LEH! LOOOOOOO!\" He jumps onto the toilet, then onto the towel rack, then somehow onto the top of the door.","The roach lands on his toothbrush and cleans its antennae. The whole family comes running. Grandma walks in with one slippah, SMACK, and walks out.","Keola stays on top of the door for another hour. Eh, leh, looo. ʻElelū."],"Yodel in terror. \"Eh-leh-LOOOO!\"","Lele means to fly. When an ʻelelū starts to lele, everybody screams.",null,"Football player on top of a door fleeing a roach"],["n448","n",448,"ʻuku","OO-koo","flea, louse","OOKY! OOKY!",["Your dog Poki won't stop scratching. His back leg is going like a motor. You part his fur and look closer. Tiny black dots are jumping everywhere. \"OOKY! OOKY!\" you scream, and you drop the dog.","Then you lean in with a magnifying glass. The fleas are not just jumping. They are jumping in rhythm. Four of them are hopping across Poki's belly like fingers on strings. One is bouncing on his ear like a drum. It sounds like a tiny band playing an old song right there on your dog.","Ooky. ʻUku. Flea. And here is the fun part. One popular explanation says the ʻukulele got its name from ʻuku plus lele, jumping flea, because a player's fingers jump across the strings like fleas.","Poki gets a flea bath. The band breaks up."],"Scratch behind your ear like a dog. \"OO-koo.\"","Uku without the ʻokina is a different word. It is a gray snapper fish, and it also means pay or wages.",null,"Fleas playing a band on a dog's belly"],["n449","n",449,"koʻe","KO-eh","worm","K.O.! ...Eh?",["Every summer the backyard hosts the great boxing match. In one corner, a mynah bird, loud and cocky, 18 wins and zero losses. In the other corner, a skinny earthworm named Wiggles, wearing a tiny headband.","The bell rings. The mynah hops in looking for a snack. The worm ducks, stretches out to twice its length, winds up like a spring and SNAPS back. POW. Right on the beak.","The mynah spins three times and lies flat on the dirt, snoring. The referee, a gecko, counts to ten and yells \"K.O.!\"","The worm, dizzy and confused, looks around at the cheering crowd of ants. \"...Eh?\"","K.O. Eh. Koʻe. The worm is the new champion. That little pause between KO and eh is the ʻokina, the worm catching its breath."],"Throw a punch, pause, then look confused. \"KO... eh?\"",null,null,"Worm in a headband knocking out a mynah"],["n450","n",450,"kamani","kah-MAH-nee","kamani tree","Ka-MONEY!",["There is a giant kamani tree at the beach park, 60 feet tall, with a trunk as wide as a car and big shiny leaves. Its round green nuts fall to the ground like coins, hundreds of them.","Your cousin Nohea, age five, thinks they ARE coins. She runs around filling her bucket, screaming \"KA-MONEY! KA-MONEY!\" She fills two buckets. She fills a wagon.","Then she drags the wagon to the ice cream truck and dumps 900 kamani nuts on the counter. \"One rainbow cone, please.\"","The ice cream man stares at the nuts. He stares at her. He gives her a free cone for being the richest person on the beach.","Ka-money. Kamani. The tree that rains coins on the beach park, and gives you shade while you count them."],"Throw invisible coins in the air. \"Kah-MAH-nee!\"","Kamani wood was prized for carving bowls, and the oil from its nuts is still used on skin today.",null,"Kid paying for ice cream with tree nuts"],["n451","n",451,"loulu","LO-oo-loo","native fan palm","Low... OOOH... LOO!",["It is 94 degrees at the high school baseball game. No wind. The bleachers are metal and your legs are sticking to them. People are melting.","Then Aunty Ipo walks in carrying a single loulu palm leaf. It is shaped like a giant folding fan, bigger than a satellite dish. She sits at the end of the bleachers, grips it with both hands and gives it one enormous swing.","A wave of cool air rolls down the whole row. Everyone it hits stands up and throws their arms in the air like a stadium wave. \"LOW... OOOOO... LOOOO!\"","She swings again. Another wave. \"Low, oooo, loo!\" By the seventh inning the whole stadium is doing the wave to her fan. Hats are flying. Even the umpire is doing it.","Low, ooo, loo. Loulu. The native fan palm."],"Swing a giant fan, then do the wave. \"LO-oo-loo!\"","Loulu palms are the only palms native to Hawaiʻi. Their leaves were used for thatching and weaving.",null,"Aunty's giant palm fan starting the wave"],["n452","n",452,"naupaka","now-PAH-kah","naupaka (half flower shrub)","NOW! PACK-A!",["Moving day. Your family is splitting up for a year. Half is going to live with Grandma up in Volcano, cold and misty. Half is staying down by the beach in Kona. Two trucks sit in the driveway. Uncle Lopaka stands between them with a clipboard, yelling.","\"NOW! PACK-A! NOW! PACK-A!\"","Pillows fly. Somebody packs the cat. Somebody packs the rice cooker in the wrong truck and has to run it over. Uncle keeps yelling. \"NOW PACK-A!\"","When the trucks are loaded, your aunty picks a little white flower from the bush by the beach and hands it to you. It looks torn in half, all its petals on one side. She says the other half blooms up in the mountains. In the old story, two lovers were split apart, one sent to the mountains and one to the sea, and the flower has grown in halves ever since.","Now pack-a. Naupaka."],"Throw boxes into an invisible truck. \"Now-PAH-kah!\"","There is a beach naupaka (naupaka kahakai) and a mountain naupaka (naupaka kuahiwi). Put the two half flowers together and they make one whole.",null,"Half flower between two moving trucks"],["n453","n",453,"māmaki","maah-MAH-kee","māmaki (native tea plant)","MAAA... MAH... KEEE!",["You wake up sick. Sore throat, stuffy nose, head like a bowling ball. Aunty Nani marches in with a bag of dried leaves from her backyard and a kettle the size of a trash can.","She stuffs a whole armful of leaves inside, fills it up and puts it on the stove. You wait. The kettle rumbles. Then it starts to whistle, and it is not a normal whistle. It is a long, loud scream that sounds like it is calling for its mother.","\"MAAAAA... MAAAH... KEEEE!\"","The windows shake. The dog hides. The neighbors call to check on you. Aunty pours you a giant mug of tea that tastes earthy and mild. You drink three cups. By dinner you feel good enough to eat two plates of stew.","Maaa, mah, kee. Māmaki. The native tea plant."],"Whistle like a screaming kettle. \"Maaah-MAH-kee!\"","Māmaki is related to nettles but has no sting, and people have made tea from its leaves for generations. Long ago its bark was also beaten into kapa.",null,"Giant kettle screaming on the stove"],["n454","n",454,"lauaʻe","lau-AH-eh","lauaʻe fern","Low... AHHH... eh?",["Aunty Pualani is making a lei for her son's graduation. She sends you to the side of the house, where a fern grows all over the ground, with long shiny fronds and bumpy edges.","You bend way down LOW to pick some. You crush one frond in your fingers by accident, and the smell hits you. Sweet and green, like the forest after rain. \"AHHHH.\" You forget where you are. You lie down in the ferns and sniff for ten minutes.","Aunty sticks her head out the window. \"You picking or sleeping?\" You hold up one sad frond. \"Eh?\"","Low, ahh, eh. Lauaʻe. She comes out, picks an armful and braids them into a lei so fragrant that at graduation the whole row of parents behind her son turns around to sniff him."],"Bend low, sniff deep, then look up. \"Lau-AH-eh.\"","Crushed lauaʻe smells a lot like maile, so it is a favorite for lei. Flip a frond over and you'll see neat rows of round orange-brown spots.",null,"Kid lying in ferns, sniffing"],["n455","n",455,"ʻieʻie","ee-eh-EE-eh","ʻieʻie vine","EE-EH-EE-EH!",["Deep in the wet upland forest, a skinny vine with long leaves and roots like ropes is climbing up every tree. It loops from branch to branch, from trunk to trunk.","Your cousin Makoa grabs a thick rope of it, backs up and runs. He swings off the ridge, out over the stream, beats on his chest with one fist and lets out a jungle yell. \"EE-EH-EE-EH!\"","At the top of the swing he lets go, grabs the next vine and keeps going. \"EE-EH-EE-EH!\" Tree to tree, 200 feet through the forest, knocking off leaves, scattering birds, until the last vine drops him into the stream with a splash.","He comes up with a crown of orange red ʻieʻie blossoms stuck on his head. Ee-eh-ee-eh. ʻIeʻie. The vine that climbs the whole forest."],"Swing on an invisible vine and yell. \"EE-eh-EE-eh!\"","The long aerial roots of ʻieʻie were woven into baskets and fish traps.",null,"Cousin swinging vine to vine, yelling"],["n456","n",456,"ʻohe","OH-heh","bamboo","Oh... HEY!",["You plant a little bamboo shoot in the backyard. It is the size of a pencil. You lean on it to fix your slippah.","It starts growing. With you on it.","You grab on. By 9 am you are as high as the fence. By 10 you are passing the neighbor's second floor window. She is eating cereal. You wave. \"Oh... HEY!\"","By noon you are over the roof, passing a flock of birds. \"Oh, hey!\" By 2 pm you are next to a small plane. The pilot waves. \"Oh, hey!\"","At sunset you are 90 feet up, hugging a green bamboo pole that sways in the wind, saying \"oh, hey\" to everything that goes by. Oh, hey. ʻOhe. Bamboo. Some kinds really can grow almost three feet in one day."],"Wave at a passing plane. \"OH-heh!\"","The ʻohe hano ihu is a bamboo nose flute, played with breath from the nose.",null,"Kid waving from shooting-up bamboo"],["n457","n",457,"wiliwili","vee-lee-VEE-lee","wiliwili tree","Willy... WILLY!",["Your friend Willy is not a big guy. He weighs about 110 pounds with his slippahs on. But on the dry side of the island, he walks up to a fallen wiliwili log as long as a canoe, slides his pinky under it and lifts it over his head.","You stare. \"Willy... WILLY!\"","He tosses it to you. You catch it with one hand. It is so light it's like catching a pillow. You throw it in the ocean and it floats so high you can stand on it and surf.","Willy, Willy. Wiliwili. The native tree with some of the lightest wood around. Old surfboards were made from it, and outrigger floats, and fishing net floats too. In summer it drops bright red and orange seeds, and Willy's grandma strings them into a lei."],"Lift an invisible log with your pinky. \"Vee-lee-VEE-lee!\"","Wili by itself means to twist or wind, like the wili style of lei making.",null,"Skinny guy lifting a log with his pinky"],["n458","n",458,"paipu","PAI-poo","pipe; faucet","PIPE... OOOH.",["The kitchen faucet has been dripping for a month. Uncle Nalu finally gets under the sink with a wrench as long as his arm. He says it will take five minutes.","He twists the pipe. It groans. He twists harder. It shakes. He gives it one more big crank.","KA-BOOM. The pipe bursts. A column of water blasts up through the sink, hits the ceiling and shoots Uncle out from under the cabinet like a cannonball. He slides across the kitchen floor, out the back door and lands in the hibiscus.","The whole family stands in the doorway, soaking wet, staring at the fountain in the kitchen. Uncle sits up, spits out a flower and says just two words. \"PIPE... OOOH.\"","Pipe, ooh. Paipu. Nobody lets him fix anything anymore."],"Crank an invisible wrench, then flinch. \"PAI-poo!\"","Paipu comes from the English word pipe, and it is also used for a faucet. Don't mix it up with Poʻipū, a beach area on Kauaʻi.",null,"Burst pipe blasting uncle out the back door"],["n459","n",459,"lako","LAH-ko","supplies, equipment, gear","Total LACK. Oh.",["It is your first day in the college dorm. The room is empty. No bed. No lamp. No pots. No rice. You sit on the floor and send a sad text to your family. \"Total LACK. Oh.\"","Twenty minutes later there is honking outside. Your whole family pulls up in two trucks and a borrowed van.","Out comes the lako. A mattress. A futon. Three rice cookers. 40 pounds of rice. A mini fridge full of frozen stew. A folding table, eight chairs, a lamp, a fan, a whole case of spam, an ironing board and a karaoke machine. Aunty is carrying a rocking chair on her head.","By dinner your room is so full of supplies that 12 other students come by to borrow stuff. Lack, oh? Not anymore. Lako. Supplies and gear, everything you need. The opposite of lack."],"Look around an empty room, then fill it with your arms. \"LAH-ko.\"","Lako also works as a describing word, meaning well supplied or prosperous. Lako hale means house furniture.",null,"Family unloading furniture into an empty dorm"],["n460","n",460,"kiʻi paʻi","KEE-ee PAH-ee","photograph","Key! Ee! PIE!",["It is the big family photo. 64 relatives packed onto the lawn, tall ones in the back, babies in front, three dogs, one chicken. The photographer is on a ladder, and he wants everyone smiling at the same time.","\"Okay, everybody say... KEY! EE! PIE!\"","\"KEY! EE! PIE!\" all 64 yell together. At that exact moment a coconut cream pie flies in from the left, thrown by a six year old cousin, and hits Uncle Boy square in the face.","FLASH.","The photo is perfect. 63 people smiling. One uncle covered in cream, eyes wide, mouth open. It gets framed and hung in every house in the family. It is on the Christmas card for ten years.","Key, ee, pie. Kiʻi paʻi. A photograph. Every family has a favorite, and it's never the one where everybody behaved."],"Hold up an invisible camera and grin. \"KEE-ee PAH-ee!\"","Kiʻi means picture or image, and paʻi means to print, so a photo is a printed picture.",null,"Pie hitting uncle in the family photo"],["n461","n",461,"pahupaʻikiʻi","pah-hoo-pah-ee-KEE-ee","camera","PAH! Who? Pie? KEY-EE!",["At the county fair there is an old wooden photo booth the size of a refrigerator. You put in a dollar. The box starts to shake and talk.","First the lid pops up. \"PAH!\"","A voice from inside asks, \"WHO?\" You say your name.","A little door opens and a pie slides out on a tray. \"PIE?\" You eat it.","Then comes a huge, bright flash. The box screams \"KEY-EEEE!\" and slides out a photo of you with cream all over your face.","Pah, who, pie, key, ee. Pahupaʻikiʻi. Camera. Remember kiʻi paʻi, the photo with the pie? Here the pieces come back in a new order. Pahu means box. Paʻi means print. Kiʻi means picture. A camera is a box that prints pictures, even if this one also serves pie."],"Press an invisible shutter button. \"Pah-hoo-pah-ee-KEE-ee!\"",null,null,"Talking photo booth serving pie"],["n462","n",462,"ipu heke","EE-poo HEH-keh","double gourd drum","EEP! Pooh... HECK, EH!",["Before hula class, Uncle Kapono, who drums for the hālau, asks you to carry the ipu heke to the front of the room. It is two big dried gourds joined together, one on top of the other, like a gourd snowman with a hole on top.","You pick it up. It is lighter than you think. It jumps right out of your hands. \"EEP!\" You juggle it. It bounces off your knee. \"Pooh...\" you breathe as you almost catch it. It slips again. \"HECK, EH!\"","Just before it hits the floor, Uncle Kapono catches it with one hand without even looking.","He sets it on a soft pad, lifts it and drops it. DOOOM. A deep sound that shakes the floor. Then he slaps the side. PAH. DOOM, pa, pa. Every dancer in the room starts moving to the beat.","Eep, pooh, heck, eh. Ipu heke."],"Juggle something, then catch it. \"EE-poo HEH-keh!\"","An ipu is a single gourd drum. The heke is the top gourd, and joining it on makes the double gourd ipu heke.",null,"Kid juggling a double gourd drum"],["n463","n",463,"ʻulīʻulī","oo-lee-oo-LEE","feathered gourd rattle","Ooh, Lee! Ooh, LEEE!",["Your cousin Lee is learning to dance with the ʻulīʻulī, a gourd rattle full of seeds with a round cap of red and yellow feathers on top. He practices in the backyard every day after school.","At first he shakes it like a salt shaker. Tsk tsk. Then he gets better. Faster. By week three his hand moves so fast the feathers turn into a blur. By week five he spins it, and the feathers whip up a little red and yellow tornado that lifts the neighbor's newspaper, three leaves and a very surprised gecko into the air.","At the big show he steps up with one in each hand. Shake, shake, spin. The crowd can't help it. \"OOH, LEE! OOH, LEEE!\"","Ooh, Lee, ooh, Leee. ʻUlīʻulī."],"Shake an invisible rattle beside your head. \"Oo-lee-oo-LEE!\"","ʻUlīʻulī are filled with seeds or pebbles, and the feathers on top flash as the dancer moves.",null,"Feather rattle spinning a tiny tornado"],["n464","n",464,"pūʻili","poo-EE-lee","split bamboo rattle","POOOEY, LEE!",["Lee from the ʻulīʻulī is back, and now his sister Mahina is learning the pūʻili. Two sticks of bamboo, split into thin strips at one end, so they buzz and rattle when you hit them.","She taps them on her shoulder. BZZZT. It tickles. She taps them on her knee. BZZZT. She taps them together. CLACK BZZZT. She is doing great.","Then Lee wants a turn. He grabs them, spins them like drumsticks and smacks himself right in the forehead. BZZZT. His eyebrows are buzzing.","Mahina takes them back and wrinkles her nose at him. \"POOEY, LEE!\"","He tries again. Hits his nose. \"Pooey, Lee!\" His chin. \"POOOOEY, LEE!\"","Pooey, Lee. Pūʻili. Leave the bamboo rattles to the sister."],"Tap your shoulder with invisible bamboo. \"Poo-EE-lee!\"","Pūʻili are played in pairs, struck on the body, on the floor or against each other. Don't mix them up with the feathered gourd ʻulīʻulī.",null,"Brother buzzing his own forehead with bamboo"],["n465","n",465,"ʻiliʻili","ee-lee-EE-lee","pebbles; hula stones","EELY! EELY!",["You are at a cold mountain stream looking for the perfect hula stones. They have to be smooth, flat and about the size of your palm. Four of them, two for each hand.","The stream bed is covered with round, wet stones. They are so slippery they wiggle under your feet like eels. You take one step and your legs go in two directions. \"EELY! EELY!\"","You slip. You land on your butt in the icy water. You come up holding four perfect stones, black and smooth as glass.","That night at practice you hold two in each hand. Click click. Click click. It sounds like tiny castanets, or rain on a tin roof. The whole line of dancers clicks at the same time.","Eely, eely. ʻIliʻili. Small stones, big sound."],"Click two invisible stones in each hand. \"Ee-lee-EE-lee.\"","ʻIliʻili also just means pebbles. ʻIli by itself means skin.",null,"Kid slipping in a stream, grabbing hula stones"],["n466","n",466,"hālau","haah-LOW","hula school; long house","HAAAA... LOW!",["Forty dancers stand in lines on the wooden floor of the hālau. The kumu sits at the front with her drum. She says one word, long and low.","\"HAAAAA... LOW!\"","Everyone bends their knees. Lower. \"HAAAA... LOW!\" Lower. Legs start shaking. Someone's slippah slides away. \"HAAAA... LOW!\"","In the back row, a big uncle who joined last week is trying his best. He goes lower. And lower. And lower, until he is sitting on an invisible chair, then on the floor, then lying flat on his back with his feet in the air, still doing the hand motions perfectly.","The kumu looks at him for a long second. Then she smiles. \"Maybe not that low.\" The whole room laughs. Haaa, low. Hālau. The school, the family and the long house where hula lives."],"Bend your knees deep and hold. \"Haaah-LOW.\"","Hālau first meant a long house, like the ones built to shelter canoes. Hula schools carry the name.",null,"Uncle sinking to the floor in hula stance"],["n467","n",467,"lānai","laah-NAI","porch, veranda","LAAAWN... EYE!",["Uncle Moku has not been inside his house in six years. He lives on the lānai. It has 14 chairs, a fridge, a TV, a hammock, a rice cooker on an extension cord, a fan, a karaoke machine and a sleeping cat.","He has one job out there. Keeping an eye on his lawn. The neighbor's goat keeps sneaking over to eat his grass, so Uncle sits on the lānai all day with a slippah ready.","The goat creeps through the fence. Uncle squints. \"LAAAAWN... EYE!\" He points two fingers at his eyes, then at the goat. The goat backs up. He never has to throw the slippah.","Laaawn, eye. Lānai. Every house in Hawaiʻi has one, and every family has one uncle who lives on it."],"Point two fingers at your eyes, then out at the yard. \"Laah-NAI.\"","Don't mix up lānai, the porch, with Lānaʻi, the island, which has an ʻokina.",null,"Uncle guarding his lawn from a goat"],["n468","n",468,"kīpuka","kee-POO-kah","island of old land surrounded by lava","KEEE... PUKA!",["You are hiking across a lava field at Volcano. Black rock for miles. Crunchy, sharp, hot. No trees, no birds, no shade. Your water is gone. Your shoes are melting a little.","Then up ahead you see green. A round patch of old forest, like an island in a black sea. Long ago the lava flowed all around it but never touched it. Tall ʻōhiʻa trees, ferns, red birds singing. It looks like a keyhole in a giant black door.","You push into the shade and fall on your back in the ferns. \"KEEE... PUKA!\" A key puka, a keyhole. You can hear birds. Everything smells wet and alive.","Keee, puka. Kīpuka. An island of old land that the lava went around."],"Peek through an invisible keyhole. \"Kee-POO-kah.\"","Kīpuka Puaulu at Hawaiʻi Volcanoes National Park is a well known one you can walk through.",null,"Green forest keyhole in black lava"],["n469","n",469,"pae ʻāina","PAI AAH-ee-nah","archipelago, island chain","Pie... AAAH... I, nah.",["Tūtū Lani is throwing a party, and she has baked pies. Many pies. She lines them up on a long table in a crooked row.","A tiny pie at the far left. A small one. A medium one. Then a cluster of four in the middle. And at the far right end, one gigantic pie the size of a truck tire.","You stand back and look at the row. \"Pie... AAAAH... I, nah...\" You were about to say you can't eat that many. Then you see it. It's the Hawaiian Islands. Niʻihau, Kauaʻi, Oʻahu, the four Maui County pies, and the big one at the end.","Tūtū nods. \"Pae ʻāina.\" Pie, aaah, I, nah. A chain of islands. Everyone gets a slice of their home island, and the Big Island feeds the whole party."],"Point down a row of invisible pies. \"PAI AAH-ee-nah.\"","Pae means a row or cluster, and ʻāina means land. Ka pae ʻāina o Hawaiʻi means the Hawaiian Islands.",null,"Row of pies shaped like the islands"],["n470","n",470,"kuamoʻo","koo-ah-MO-oh","backbone; path, trail","Cool! Ah! MOW! Oh!",["Uncle Palani gets a riding lawn mower and decides to mow a path along the whole mountain ridge behind the house. Three miles. Up and down every bump.","He starts at dawn. Vroom. Up the first hump. Down the dip. Up the next hump. The ridge is so narrow the mower wheels hang over the edges. You follow on foot, yelling encouragement. \"COOL! AH! MOW! OH!\"","By sunset he is done. A drone flies over and takes a picture. From the sky, the mowed path looks exactly like a giant backbone. Bump, dip, bump, dip, all the way to the top, like the spine of a sleeping lizard.","Cool, ah, mow, oh. Kuamoʻo. A backbone. And also a path or trail, because the ridge is the backbone the trail runs along."],"Run your finger down your own spine. \"Koo-ah-MO-oh.\"","Kua means back, and moʻo is a lizard, so picture the bumpy back of a lizard.",null,"Mowed ridge path shaped like a spine"],["n471","n",471,"ala hele","AH-lah HEH-leh","trail, pathway","Ah, la... HEY, LEH!",["The best trail guide in the valley is a rooster named Leh. Nobody trained him. He just showed up at the trailhead one day, and hikers started following him.","He knows every path. He struts up the trail, turns left at the big rock, hops over the roots and waits at the stream crossing. When anyone wanders off the path, he stops, turns around and glares until they come back.","When he stops to peck at a bug, the hikers call to get him going again. \"Ah, la... HEY, LEH!\" And off he goes, tail feathers bouncing, up the trail. If you ever get lost, you yell \"Ah, la, hey, Leh!\" and somewhere up the path you hear him crow.","Ala is a path. Hele is to go. Ah, la, hey, Leh. Ala hele. The path you go on."],"Point up the trail and call the rooster. \"AH-lah HEH-leh!\"","Ala means path or road, like in Ala Moana, the road by the ocean. Hele means to go.",null,"Rooster leading a line of hikers"],["n472","n",472,"hōkele","hoh-KEH-leh","hotel","HOOO, KELLY!",["A fancy hotel on the beach in Waikīkī has one bellhop. Her name is Kelly and she is five feet tall.","A tour bus pulls up. 52 guests get off. Each one has three suitcases, a golf bag and a boogie board. Kelly stacks them all on one brass cart. The stack is 40 feet high, taller than the palm trees. She pushes it through the lobby with one hand while holding a guest's baby in the other.","The guests stare. The manager stares. The doorman drops his hat. \"HOOOO, KELLY!\"","She rides the elevator up with the whole stack, delivers every bag to every room and is back in the lobby in four minutes. Hooo, Kelly. Hōkele. The whole hotel runs on Kelly."],"Push an invisible, very heavy cart. \"Hoh-KEH-leh!\"","Hōkele comes from the English word hotel, said Hawaiian style, with the t turning into a k.",null,"Tiny bellhop pushing a tower of luggage"],["n473","n",473,"hale kūʻai","HAH-leh koo-AI","store, shop","Holly! COOO! AYE!",["Holly runs the tiny corner store at the end of your street. It is the size of a garage and sells everything. Rice, bait, slippahs, dried aku, birthday cards, fishing line, crack seed and one lawn mower.","Her first customer every morning is a pigeon. It walks in at 7 am, stands on the counter and coos. \"COOOOO.\" Holly nods. \"AYE.\" She hands it one grain of rice. It pays with a shiny bottle cap. This has been going on for eleven years.","Everyone who walks into the shop greets them the same way. Her name, the pigeon noise, her answer. \"Holly! COOOO! AYE!\"","Holly, coo, aye. Hale kūʻai. A store. The little shop where everybody, even the birds, comes to buy stuff."],"Coo like a pigeon at a counter. \"HAH-leh koo-AI.\"","Hale means house and kūʻai means to buy or sell, so a store is a buying house.",null,"Pigeon buying rice at a corner store"],["n474","n",474,"aloha ʻāina","ah-LO-hah AAH-ee-nah","love of the land; patriotism","Aloha... ah... I... nah.",["It is a Saturday workday at the family taro patch. You are nine, standing in mud up to your knees. You pulled weeds all morning. You planted 60 huli, the taro tops, one by one, the way your grandpa showed you. You slipped and sat in the mud twice and laughed both times.","At sunset your mom calls from the car. \"Time to go!\"","You look at the patch. The water shining. The little green leaves. The mountain behind it turning pink. You don't want to leave. You open your mouth to say okay, and what comes out is \"Aloha... ah... I... nah.\"","Mom walks back down, rolls up her pants and stands in the mud next to you until it's dark.","Aloha, aaah, I, nah. Aloha ʻāina. The love of the land that makes you want to stay."],"Put your hand on your heart, then on the ground. \"Ah-LO-hah AAH-ee-nah.\"","Aloha ʻāina also means love of country. In 1897 a group called Hui Aloha ʻĀina gathered more than 20,000 signatures from Hawaiians against annexation.",null,"Kid in the taro patch who won't leave"],["n475","n",475,"hōʻailona","hoh-ai-LO-nah","sign, symbol, omen","Ho... I loan-a...",["Uncle Sonny is about to loan his cousin $500 for a boat that the cousin swears will make them both rich. He sits at the kitchen table, pen over the checkbook.","\"Ho... I loan-a...\" he starts to say.","A mynah bird flies through the window and steals the pen.","He gets another pen. \"Ho, I loan-a...\" Thunder, out of a clear blue sky. The lights go out.","He lights a candle. \"Ho, I loan-a...\" The rooster crows three times. A gecko drops from the ceiling right onto the check. The candle blows out by itself.","Uncle looks at the gecko. The gecko looks at him. He closes the checkbook. \"Okay. That's a sign.\"","Ho, I loan-a. Hōʻailona. A sign. An omen. Sometimes it is a gecko on your checkbook."],"Freeze with an invisible pen in your hand. \"Hoh-ai-LO-nah.\"","Hōʻailona also means a symbol or emblem.",null,"Gecko landing on uncle's checkbook"],["n476","n",476,"hiʻohiʻona","hee-oh-hee-OH-nah","appearance, feature, scenery","HEE... OH... HEE... OH... NAH!",["You drive up to the Pali Lookout for the famous view. Green cliffs, the whole windward coast, clouds racing past. The wind is blowing 60 miles an hour.","You open your mouth to say \"wow,\" and the wind grabs your cheeks. They flap like a flag. Your lips blow out. What comes out is \"HEE... OH... HEE... OH... NAH!\"","Your friend turns to look at you and cracks up. Your hair is straight up. Your ears are folded back. Your face looks like a dog with its head out a car window. She takes a picture. Then the wind gets her too. \"HEE OH HEE OH NAH!\"","Two faces with a brand new appearance, and behind them, the most beautiful scenery on the island. Hee oh hee oh nah. Hiʻohiʻona."],"Let invisible wind flap your cheeks. \"Hee-oh-hee-OH-nah!\"","Nani ka hiʻohiʻona means the view is beautiful.",null,"Wind flapping faces at a cliff lookout"],["n477","n",477,"ʻaha mele","AH-hah MEH-leh","concert","AHA! MELLY!",["Remember the ʻaha, the neighborhood meeting about the roosters? This time the same 200 people meet in the park, but nobody argues. Everybody brought an instrument.","Aunty Melly runs it. She stands on a picnic table in a muʻumuʻu covered in music notes. In front of her are 300 ʻukuleles, 12 guitars, a washtub bass and a kid with a pot and a spoon. Even the roosters are wearing earmuffs.","She raises her arms. \"AHA!\" Everybody gets ready. She points at the crowd and they shout back, \"MELLY!\" Then the whole park starts to play at once. The music is so loud the leaves shake off the trees and the waves at the beach start rolling in time.","Aha, Melly. ʻAha mele. A concert. ʻAha is a gathering and mele is a song, so a concert is a gathering for songs."],"Raise your arms like a conductor. \"AH-hah MEH-leh!\"","Mele is a song or chant, and it can also mean to sing.",null,"Park full of ʻukuleles, aunty conducting on a table"],["n478","n",478,"hōʻikeʻike","hoh-ee-keh-EE-keh","exhibit, show","HO! ICKY! ICKY!",["The 5th grade science fair is in the school cafeteria. Most tables have volcanoes and solar system models. Then there is table 17.","Table 17 belongs to a boy named Kekoa, and his exhibit is called 100 Days of Lunch. It is every lunch he did not eat since August, sealed in plastic bags and labeled. The moldy musubi. The green hot dog. The fuzzy banana, which now has a fuzzy family. A carton of milk that is somehow moving.","People walk up, lean in and jump back. \"HO! ICKY! ICKY!\"","The line to see it goes out the door. Parents take pictures. The principal takes pictures. The judges hold their noses and give him first place.","Ho, icky, icky. Hōʻikeʻike. An exhibit. A show where people come to look, even when they really shouldn't."],"Lean in to look, then jump back. \"Hoh-ee-keh-EE-keh!\"","ʻIke means to see, hōʻike means to show, and hōʻikeʻike is a big showing, an exhibit.",null,"Moldy lunch exhibit at the science fair"],["n479","n",479,"moʻokalaleo","mo-oh-kah-lah-LEH-oh","literature","Moe? Oh... call-a LEO!",["It is bedtime at your sleepover, and the six kids will not go to sleep. Pillow fights. Jumping on the bed. One kid is riding the ceiling fan.","Mom sticks her head in. \"Moe?\" she asks, which means sleep. They laugh at her.","She sighs. \"Oh... call-a LEO.\"","Leo is the family lion. He is 400 pounds and wears reading glasses. He pads in carrying a thick book of old legends, chants and great stories under one paw. He lies down across the doorway and starts to read in the softest, deepest roar you have ever heard. Heroes, voyages, volcanoes, love, all written down long ago.","In ten minutes all six kids are asleep on his mane. Moe, oh, call-a Leo. Moʻokalaleo. Literature. The great written stories of a people, read in the best voice in the house."],"Whisper like it is a bedtime story. \"Mo-oh-kah-lah-LEH-oh.\"","Leo means voice, so you can hear a voice right at the end of the word.",null,"Lion in reading glasses putting kids to sleep"],["n480","n",480,"māla","MAAH-lah","garden, cultivated field","MAAAH... LAAA!",["Your mom has a garden in the backyard, and she believes plants grow better when you sing to them. Not just sing. Opera.","Every morning at 6 am she stands in the middle of the tomatoes in her bathrobe, spreads her arms and belts out one long note. \"MAAAAAAAH... LAAAAAA!\"","The plants love it. The tomatoes swell up as big as beach balls. The green onions grow as tall as street lights. The sweet potatoes push up out of the dirt to listen. One cabbage gets so big that a family of mongooses moves in.","The neighbors used to complain. Now they come over every morning with baskets and sing along. Maaah, laaa. Ma sings la. Māla. The garden where the food grows."],"Throw your arms wide and sing. \"MAAAH-lah!\"","A māla ʻai is a food garden, and a māla pua is a flower garden.",null,"Mom singing opera to giant tomatoes"],["n481","n",481,"Lāpule","laah-POO-leh","Sunday","Laaa... POOL, eh?",["Sunday morning. You are eight, sitting in the front row at church in your stiff aloha shirt. The fans spin slowly. The choir sings. Everyone bows their head for the prayer.","You bow too, but your mind is somewhere else. All you can think about is the afternoon, when the whole family goes to the pool at the park. Grandma promised.","During the quiet prayer, a little too loud, you whisper, \"Laaa... POOL, eh?\"","Forty heads turn. Grandma gives your ear a very gentle tug, but she is smiling. After church she takes you to the pool anyway, and she jumps in first, church dress and all.","Laaa, pool, eh. Lāpule. Sunday. Lā means day and pule means prayer. Prayer in the morning, pool in the afternoon."],"Fold your hands, then mime a dive. \"Laah-POO-leh.\"","Pule also means week, so Lāpule is the prayer day of the week.",null,"Kid whispering about the pool in church"],["n482","n",482,"Pōʻakahi","poh-ah-KAH-hee","Monday","Pour... a... COFFEE!",["Monday morning at the office. Everyone walks in like a zombie. Eyes half closed, hair sticking up, one guy wearing two different slippahs.","In the break room there is a coffee pot the size of a water tank. Every person who shuffles in grabs a mug, holds it out and moans the same thing. \"Pour... a... COFFEE!\"","The pot pours. And pours. The line wraps around the building. A police officer stops by and gets in line. So does the mailman, and a stray cat.","By 9 am the whole city has had one cup and everyone is awake. Pour a coffee. Pōʻakahi. Monday. It means day one, and nobody can do day one without coffee."],"Hold out an invisible mug and moan. \"Poh-ah-KAH-hee.\"","The weekdays count up. ʻAkahi is one, ʻalua two, ʻakolu three, ʻahā four, ʻalima five and ʻaono six, so Monday through Saturday are Pōʻakahi to Pōʻaono.",null,"Zombie line at a giant coffee pot"],["n483","n",483,"Pōʻalua","poh-ah-LOO-ah","Tuesday","Poor... a... LŪʻAU.",["Your family decides to throw a big lūʻau on a Tuesday night. Nobody knows why. It's just a Tuesday.","They dig the imu. They roast two whole pigs. They set up 40 tables, a stage, a band and a slide show. They make 300 pounds of poke.","Then 6 pm comes. Everyone is at work, at school, at soccer practice. Only two guests show up. Your mailman, and a lost tourist looking for the bus stop.","Uncle looks at the 40 empty tables. He looks at the two guests. He shakes his head. \"Poor... a... LŪʻAU.\"","The two guests eat like kings for four hours. Two pigs, two guests. Pōʻalua. Tuesday. Day two, because lua means two, and that is why Tuesday is the worst day for a party."],"Look at empty tables and sigh. \"Poh-ah-LOO-ah.\"","Lua means two. You'll also hear lua used for a hole or pit, and for the bathroom.",null,"Two guests at a huge empty lūʻau"],["n484","n",484,"Pōʻakolu","poh-ah-KO-loo","Wednesday","POUR A COLA!",["Wednesday is hump day. The middle of the week. And on this Wednesday, three camels show up at your school.","Nobody knows where they came from. They are standing in the parking lot, humps in the air, looking thirsty. One is chewing on the principal's car antenna.","The principal runs out with three cups and a giant bottle of soda. The lunch lady yells, \"POUR A COLA!\" He pours one. Camel one slurps it and burps. \"POUR A COLA!\" Camel two. \"POUR A COLA!\" Camel three.","Three camels, three colas, three humps. They burp in harmony, lie down in the shade and nap until Thursday.","Pour a cola. Pōʻakolu. Wednesday. Day three. Kolu means three."],"Pour three invisible cups. \"Poh-ah-KO-loo.\"","Kolu means three, so Pōʻakolu is day three of the week.",null,"Three camels drinking cola at school"],["n485","n",485,"Pōʻahā","poh-ah-HAAH","Thursday","Pohhh... ahhh... HAAAAH!",["It's Thursday. The weekend is almost here, so Thursday night is comedy night at your house. Four uncles sit on the couch. Each one tells one joke.","The first uncle tells a joke about a chicken. Everybody laughs one short laugh. \"Ha.\"","The second uncle's joke is about a fisherman. \"Ha ha.\"","The third uncle's joke is about Aunty's cooking. Aunty throws a slippah. \"Ha ha HA.\"","The fourth uncle stands up, says nothing and slowly sits down on a whoopee cushion. PFFFFFT. The whole room explodes into one long, huge laugh that lasts four minutes. \"POHHH... AHHH... HAAAAAAH!\"","Four uncles, four jokes, one big long HAAAH. Pōʻahā. Thursday. Hā means four, and you stretch it out like the best laugh of the week."],"Laugh long and loud. \"Poh-ah-HAAAH!\"","Hā means four, and the same word also means breath.",null,"Four uncles, one whoopee cushion, big laugh"],["n486","n",486,"Pōʻalima","poh-ah-LEE-mah","Friday","POW! Ah... LEE-MAH!",["It is 5 pm on Friday. The whistle blows at the construction site, and 50 workers drop their tools at the exact same second.","Then they start the Friday tradition. Everyone high fives everyone. Five fingers smacking five fingers. POW! POW! POW! 50 workers means over 1,200 high fives. Hands turn red. Birds fly away from the noise.","The foreman stands in the middle holding up one giant hand. \"POW! Ah... LEE-MAH!\" He wiggles his five fingers. Lima means hand, and lima also means five.","The workers chant with him. \"POW! Ah, LEE-MAH!\" Then they all run to the parking lot and go straight to the beach.","Pow, ah, lima. Pōʻalima. Friday. Day five. High five."],"Give an invisible high five. \"Poh-ah-LEE-mah!\"","Lima means both five and hand, which makes sense because a hand has five fingers.",null,"Fifty workers high fiving at 5 pm"],["n487","n",487,"Pōʻaono","poh-ah-OH-no","Saturday","Po... ah... OH NO!",["It is Saturday. You sleep till 11. You wake up stretching and happy, thinking about the beach, a plate lunch and a nap in the hammock.","Then you notice something stuck to your forehead. A list, taped there while you were sleeping. Mom's handwriting. Six chores.","Clean the bathroom. Wash the car. Mow the lawn. Fold 18 loads of laundry. Bathe the dog. Paint the house.","\"Po... ah... OH NO!\"","You try to hide under the blanket. Mom is standing in the doorway holding a mop like a sword. The dog has already heard the word bath and is hiding under the house.","Po, ah, oh no. Pōʻaono. Saturday. Day six, one chore for each."],"Read an invisible list and grab your head. \"Poh-ah-OH-no!\"","Ono means six. Don't mix it up with ʻono, with an ʻokina, which means delicious. Ono without it is also the name of a tasty fish, the wahoo.",null,"Chore list taped to a sleeping kid's forehead"],["n488","n",488,"ʻino","EE-no","storm","EEE! NO!",["You set up the perfect beach picnic at Kailua. Tent, cooler, plate lunches, a cake, a kite and a little inflatable pool for the baby.","Then the sky turns black in 30 seconds. The wind hits 80 miles an hour. Rain comes sideways, like somebody is spraying a hose at your face.","The tent lifts off like a rocket. \"EEE! NO!\" The plate lunches fly out of the cooler like frisbees. \"EEE! NO!\" The cake lands in a tree. The kite takes Uncle for a ride down the beach. The baby's pool, with the rubber duck still in it, sails out to sea.","Five minutes later the sun comes out. The beach is calm. The only thing left is you, holding one chopstick. Eee, no. ʻIno. Storm."],"Hold on to an invisible tent in the wind. \"EE-no!\"","ʻIno also means bad or wicked, and hana ʻino means to treat someone badly.",null,"Beach picnic blowing away in a storm"],["n489","n",489,"ʻōkole","oh-KO-leh","butt, rear end","OHHH! COLE...!",["It's the graduation party in the garage. Eight long tables of food. Uncle Keoki has been dancing for three hours, and finally he is tired. He backs up to sit on a folding chair without looking.","The chair is not there. What is there is a bowl of coleslaw as big as a washtub, sitting on a low stool.","SQUISH.","He sits right in it. Cabbage up to his waist. Mayo everywhere. He stands up, and the whole bowl comes with him, stuck to his rear end like a big white skirt.","He looks back over his shoulder and yells \"OHHH! COLE...\" He can't even finish the word slaw. The kids start chanting it. \"Oh, cole! Oh, cole! Oh, cole!\"","Oh, cole. ʻŌkole. Your rear end. Uncle Keoki wears that bowl for the rest of the party."],"Pat your own back pocket. \"Oh-KO-leh.\"","ʻŌkole is a casual, not very polite word. The more polite word is lemu. The toast ʻōkole maluna, bottoms up, is common today, but many older Hawaiians consider it vulgar, so use it with care.",null,"Uncle stuck in a giant bowl of coleslaw"],["n490","n",490,"waimaka","vai-MAH-kah","tears","Why, Ma? KAAAH!",["It's the day before the big family lūʻau, and Ma hands you the job nobody wants. Fifty pounds of onions to chop for the lomi salmon. You start at 7 am.","By onion number three your eyes are watering. By onion twenty you are crying so hard the tears fill a bowl. By onion forty, a bucket. By noon the tears have filled the kitchen sink and spilled onto the floor, and your little brother is floating past on a boogie board.","You turn to Ma, sobbing. \"WHY, MA? KAAAH!\"","She hands you swim goggles. You finish the onions in goggles, standing in a lake of your own tears, while a few little fish swim around your feet.","Why, Ma, kah. Waimaka. Tears. Wai is water and maka is eye. Tears are eye water."],"Rub your eyes and wail. \"Vai-MAH-kah!\"","Maka by itself means eye.",null,"Kid in goggles chopping onions in a flood of tears"],["n491","n",491,"hā","HAAH","breath","HAAAAAH!",["Great Grandma Luana is turning 100. The cake has 100 candles and is so bright the neighbors think the house is on fire. She is too small to blow them all out by herself.","So all 60 grandkids and great grandkids gather around the table. Everyone leans in. Everyone takes the biggest breath of their lives. And together they let out one long breath.","\"HAAAAAAAAAH!\"","Every candle goes out at once. The napkins fly. A little cousin's hat blows off. The curtains flutter. Grandma's hair lifts up, and she laughs.","Then she does it the old way. She pulls you close, presses her nose and forehead to yours and breathes in. A honi. Sharing breath. Haaah. Hā. The breath of life, passed down and shared."],"Take a deep breath and let it out long. \"Haaaah.\"","Hā also means four, like in Pōʻahā, Thursday.",null,"Sixty kids blowing out 100 candles"],["n492","n",492,"hae","HAI","flag","HI! HI! HI!",["Field day at school. The principal raises the biggest flag you have ever seen up the tall pole. It is 60 feet long, and the trade winds are blowing hard.","The flag flaps out over the field. It flaps so hard it looks like it's waving at people. Everyone waves back. \"HI!\"","It dips lower and knocks a kid's hat off. \"HI!\" It sweeps across the bleachers and gives every parent a gentle pat on the cheek. \"HI! HI! HI!\" It swings over the parking lot and wraps around the ice cream truck like a hug.","By the end of the day every person at school has been personally greeted by the flag. Hi. Hae. The flag that says hi to everybody."],"Wave your whole arm like a flag in the wind. \"HAI!\"","Ka Hae Hawaiʻi, the Hawaiian flag, has eight stripes for the eight main islands. Hae can also mean to bark, like a dog.",null,"Giant flag waving hi at everyone"],["n493","n",493,"makamaka","mah-kah-MAH-kah","close friend","MOCK-A, MOCK-A!",["Uncle Kona and Uncle Bert have fished from the same little boat every Saturday for 40 years. And for 40 years they have not stopped teasing each other.","\"Nice hat. Did a bird make it?\" \"Nice cast. Were you trying to catch the moon?\"","The whole harbor calls them the Mock-a Mock-a Brothers, even though they are not related. When Bert pulls up in his truck at 4 am, Kona yells from the dock, \"MOCK-A, MOCK-A!\" and they both cackle.","But when Kona's truck broke down, Bert drove him to work for three months. When Bert's roof leaked, Kona showed up with shingles before breakfast. Neither one has ever kept score.","Mock-a, mock-a. Makamaka. A close friend. The one you can tease forever and give anything to."],"Poke an invisible friend in the ribs. \"Mah-kah-MAH-kah!\"","A makamaka is the kind of friend you give to and take from freely, with no counting.",null,"Two old fishermen teasing each other on a boat"],["n494","n",494,"kumu hula","KOO-moo HOO-lah","hula teacher","Come. Move. HULA.",["You are in the back row of hula class, the very last line. You figure the kumu hula can't possibly see you back here. So you stop moving. You check your nails. You fix your slippah strap. You sneak a bite of a granola bar.","The kumu is at the front with her back to everybody, beating the drum. She doesn't turn around. She just says, calm and clear, \"Come. Move. Hula.\"","You freeze. How? You start dancing again. Five minutes later you slow down. Without turning, \"Come. Move. Hula.\"","After class she tells you she has been teaching for 40 years. She learned from her kumu, who learned from theirs, all the way back. She sees everything. Come, move, hula. Kumu hula. The teacher who holds the dances and passes them on."],"Tap your foot twice and start dancing. \"KOO-moo HOO-lah.\"","Kumu hula trace their knowledge through their own teachers, a line going back many generations.",null,"Kumu seeing the back row without turning around"],["n495","n",495,"hanauna","hah-NOW-nah","generation","HA! Now? NAH.",["Five generations of your family line up for a photo. Great great grandma, 101. Great grandma, 82. Grandma, 60. Mom, 38. And you, 15, holding your phone.","Great great grandma starts. \"In my day we walked five miles to school with no shoes. HA! Now? NAH.\" She points at great grandma.","Great grandma turns to grandma. \"In my day there was one phone for the whole street. HA! Now? NAH.\"","Grandma turns to Mom. \"In my day we had to get up to change the TV channel. HA! Now? NAH.\"","Mom turns to you. \"In my day we waited a whole week for the next show. HA! Now? NAH.\"","You turn to the family dog and open your mouth. Everyone cracks up. Ha, now, nah. Hanauna. A generation. Every one thinks the next one has it easy."],"Wag your finger at an invisible kid. \"Hah-NOW-nah.\"","Hanauna is related to hānau, to be born, but hanauna itself has no kahakō. Hauʻoli lā hānau means happy birthday.",null,"Five generations wagging fingers down the line"],["n496","n",496,"paniolo","pah-nee-OH-lo","cowboy","PONY! Oh... LOW!",["A cowboy rides into the Waimea rodeo. Big hat with a lei around it. Leather chaps, spurs, a rope coiled at his side. Very serious face.","He is riding a pony. A very, very small pony. So small that the cowboy's boots drag in the dirt on both sides, leaving two long lines behind him.","The whole crowd stands up and shouts. \"PONY! OH... LOW!\"","He doesn't care. He enters every event. He ropes a calf with his boots still dragging. He wins the race because the pony is so low it runs right under the fence. He tips his hat, the lei falls onto the pony's head, and the pony looks very proud.","Pony, oh, low. Paniolo. The Hawaiian cowboy."],"Ride an invisible tiny pony with your knees bent. \"Pah-nee-OH-lo!\"","The word comes from español. Cowboys from Mexico came in the 1800s to teach cattle work, and the paniolo tradition grew from there.",null,"Cowboy on a tiny pony, boots dragging"],["n497","n",497,"ʻāpana","aah-PAH-nah","piece, section","Aaah... PAN, ah?",["Aunty Wehi brings a pan of butter mochi to the park. Sixty kids line up. She has one pan.","She cuts it into 12 pieces. Not enough. She cuts each piece in half. Not enough. In half again. And again. By the time she's done, each piece is the size of a grain of rice, and she is handing them out with tweezers.","A kid holds his tiny piece up to the sun and squints at it. \"Aaah... PAN, ah?\" He looks at the empty pan, then back at his crumb.","Aunty shrugs and pulls a second pan from behind her back. Everyone screams.","Aaah, pan, ah. ʻĀpana. A piece. A section. Big or tiny, everyone gets one."],"Slice an invisible pan into tiny pieces. \"Aah-PAH-nah.\"","ʻĀpana is also used for a section of land or a district.",null,"Aunty handing out mochi with tweezers"],["n498","n",498,"hapa","HAH-pah","part, portion; mixed","HALF-A!",["Uncle Keahi is on a diet, so he only eats half of everything. Half a musubi. Half a donut. Half a malasada. Half a plate lunch. He walks around with a bag full of the other halves, saving them for later.","At the drive in he orders \"Half-a hamburger, half-a fries, half-a shake.\" The worker squints. \"Half-a?\" \"HALF-A!\" Say it fast and it sounds like hah-pah.","Then he looks up at the menu and sees the mixed plate. Chicken, beef, fish, rice and mac salad. A little part of everything, all together on one plate. His eyes light up. \"That one! Little bit of this, little bit of that. Hapa everything.\"","Half-a. Hapa. A part, a portion. And also mixed, like a mixed plate."],"Break an invisible musubi in two. \"HAH-pah.\"","Hapa comes from the English word half. Hapa haole music mixes Hawaiian style with English lyrics, and hapa is also used, warmly, for a person of mixed background.",null,"Uncle with a bag full of half foods"],["n499","n",499,"kumukūʻai","koo-moo-koo-AI","price","KOO-MOO! KOO-AYE!",["You walk into a fancy new store at Ala Moana. Everything is white and shiny. You pick up one mango. The price tag says $400.","On the wall, a cuckoo clock pops open and the little bird shoots out. But the prices here are so crazy they broke it. Instead of cuckoo it screams \"KOO-MOO! KOO-AYE!\"","You pick up a pair of slippahs. $900. \"KOO-MOO! KOO-AYE!\" A bag of rice. $2,000. The bird is shooting in and out so fast it gets dizzy.","Every time anyone looks at a price, the cuckoo goes cuckoo. You put everything down and walk back to Holly's corner store from hale kūʻai, where a mango costs 50 cents and the pigeon still pays in bottle caps.","Koo-moo, koo-aye. Kumukūʻai. The price."],"Look at a price tag and grab your chest. \"Koo-moo-koo-AI!\"","Kumu means base or source, and kūʻai means to buy or sell. You saw kūʻai in hale kūʻai, the store.",null,"Broken cuckoo clock screaming at price tags"],["n500","n",500,"ʻauhau","ow-HOW","tax","OW! HOW?!",["You buy a plate lunch. Two scoops rice, mac salad, chicken katsu. You sit down at the picnic table, lift your chopsticks, and a big gray goose in a green visor lands on the table holding a clipboard.","It looks at your plate. It checks the clipboard. Then it leans in and bites off a piece of katsu, and a little of your finger too. \"OW!\" You stare at it. \"HOW?!\"","It pecks a scoop of rice. \"OW! HOW?!\" It takes a spoon of mac salad. \"OW! HOW?!\" By the time it's done, a fifth of your lunch is gone. The goose writes something on the clipboard, hands you a tiny receipt and waddles to the next table.","Ow, how. ʻAuhau. Tax. The piece of what you have that somebody always comes around to collect."],"Guard your plate and flinch. \"Ow-HOW!\"","In old Hawaiʻi, goods like food, kapa and feathers were brought as tribute to the chiefs during the Makahiki season.",null,"Goose with a clipboard taxing your lunch"]]</script>
<script>
(function(){
"use strict";
/* ---------- data ---------- */
const RAW = JSON.parse(document.getElementById('word-data').textContent);
const WORDS = RAW.map(a => ({id:a[0], t:a[1], n:a[2], h:a[3], p:a[4], e:a[5], k:a[6], s:a[7], y:a[8], b:a[9], u:a[10], c:a[11]}));
const BY = new Map(WORDS.map(w => [w.id, w]));
const VERBS = WORDS.filter(w => w.t === 'v'), NOUNS = WORDS.filter(w => w.t === 'n');
const norm = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[ʻ'‘’`]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const exact = s => (s||'').normalize('NFC').replace(/['‘’`]/g,'ʻ').toLowerCase().replace(/\s+/g,' ').trim();
WORDS.forEach(w => { w.q = norm(w.h); w.qe = w.e.toLowerCase(); });

const MIN = 60e3, HOUR = 36e5, DAY = 864e5;
const INT = [0, 10*MIN, DAY, 3*DAY, 7*DAY, 16*DAY, 40*DAY];
const MASTER = 6;
const PRAISE = [['Maikaʻi!','good'],['Akamai!','smart'],['Nani!','beautiful'],['Hiki nō!','can do'],['ʻAe!','yes'],['Kūleʻa!','success'],['Mahalo!','thanks']];
const MILESTONES = [1,10,25,50,100,150,200,300,400,500,600,700,800,900,1000];

/* ---------- storage ---------- */
const KEY = 'hoopaa-progress-v1';
let storageOK = true;
function fresh(){ return {v:1, w:{}, days:{}, xp:0, streak:{cur:0,best:0,last:null}, set:{newPerDay:8, order:'mixed', strict:false, goal:150}, pin:[], seenMs:[]}; }
let S = null;
try { S = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e) { storageOK = false; }
if (!S || S.v !== 1) S = fresh();
S.set = Object.assign(fresh().set, S.set || {}); S.pin = S.pin || []; S.seenMs = S.seenMs || []; S.streak = S.streak || {cur:0,best:0,last:null};
let saveT = null;
function save(){ clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) { storageOK = false; } }, 120); }
function saveNow(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) { storageOK = false; } }
window.addEventListener('pagehide', saveNow);

/* ---------- time + state helpers ---------- */
const pad = n => String(n).padStart(2,'0');
const dkey = (t=Date.now()) => { const d = new Date(t); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const day = k => (S.days[k] = S.days[k] || {a:0,c:0,n:0,m:0,xp:0});
const lvl = id => S.w[id] ? S.w[id].l : -1;
function touchStreak(){
  const k = dkey(), st = S.streak;
  if (st.last === k) return;
  const y = dkey(Date.now() - DAY);
  st.cur = (st.last === y) ? st.cur + 1 : 1;
  st.best = Math.max(st.best, st.cur); st.last = k;
}
function liveStreak(){ const st = S.streak; if (!st.last) return 0; return (st.last === dkey() || st.last === dkey(Date.now()-DAY)) ? st.cur : 0; }
function order(){
  const o = S.set.order;
  let base;
  if (o === 'verbs') base = VERBS.concat(NOUNS);
  else if (o === 'nouns') base = NOUNS.concat(VERBS);
  else { base = []; for (let i=0;i<500;i++){ base.push(VERBS[i]); base.push(NOUNS[i]); } }
  const pinned = S.pin.map(id => BY.get(id)).filter(Boolean);
  return pinned.concat(base.filter(w => !S.pin.includes(w.id)));
}
function nextNew(n){ const out=[]; for (const w of order()){ if (!S.w[w.id]) { out.push(w.id); if (out.length>=n) break; } } return out; }
function dueList(now=Date.now()){ return Object.keys(S.w).filter(id => S.w[id].d <= now && S.w[id].l < 99).sort((a,b) => S.w[a].d - S.w[b].d); }
function counts(list=WORDS){
  let m=0,g=0,l=0,n=0;
  for (const w of list){ const L = lvl(w.id); if (L>=MASTER) m++; else if (L>=3) g++; else if (L>=0) l++; else n++; }
  return {m,g,l,n};
}
function newLeftToday(){ return Math.max(0, S.set.newPerDay - day(dkey()).n); }

/* ---------- small utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const cap = h => h.startsWith('ʻ') && h.length>1 ? 'ʻ'+h[1].toUpperCase()+h.slice(2) : h.charAt(0).toUpperCase()+h.slice(1);
const kindName = w => w.t==='v' ? 'Verb' : 'Noun';
const fmtNum = n => n.toLocaleString('en-US');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
function when(t){
  const d = t - Date.now();
  if (d <= 0) return 'now';
  if (d < HOUR) return Math.max(1,Math.round(d/MIN))+' min';
  if (d < DAY) return Math.round(d/HOUR)+' hr';
  const days = Math.round(d/DAY); return days+(days===1?' day':' days');
}
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
const ICON = {
  sun:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></g></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.7 6.2 6.8.6-5.1 4.5 1.5 6.7L12 17l-5.9 3.5 1.5-6.7L2.5 9.3l6.8-.6z"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

/* ---------- header ---------- */
function renderChips(){
  $('#streakChip').innerHTML = ICON.sun + '<span>' + liveStreak() + '</span>';
  $('#xpChip').innerHTML = ICON.star + '<span>' + fmtNum(day(dkey()).xp) + '</span>';
}

/* ---------- sky (star map) ---------- */
const PTS = (() => {
  const pts = [], ga = Math.PI*(3-Math.sqrt(5));
  const all = VERBS.concat(NOUNS);
  for (let i=0;i<all.length;i++){
    const r = Math.sqrt(i+0.6)/Math.sqrt(all.length), a = i*ga;
    const jit = ((i*9301+49297)%233280)/233280;
    pts.push({id:all[i].id, x:Math.cos(a)*r, y:Math.sin(a)*r, ph:jit*Math.PI*2, sz:0.7+jit*0.6});
  }
  return pts;
})();
const skies = new Set();
function mountSky(canvas, {interactive=false, onPick=null} = {}){
  const ctx = canvas.getContext('2d');
  const obj = {canvas, ctx, interactive, onPick, w:0, h:0, dpr:1, hi:null};
  function resize(){
    const r = canvas.getBoundingClientRect();
    obj.dpr = Math.min(2, window.devicePixelRatio||1);
    obj.w = r.width; obj.h = r.height;
    canvas.width = Math.round(r.width*obj.dpr); canvas.height = Math.round(r.height*obj.dpr);
    draw(obj, performance.now());
  }
  obj.resize = resize;
  const ro = new ResizeObserver(resize); ro.observe(canvas); obj.ro = ro;
  if (interactive){
    canvas.addEventListener('click', ev => {
      const r = canvas.getBoundingClientRect(); const x = ev.clientX - r.left, y = ev.clientY - r.top;
      let best=null, bd=18*18;
      for (const p of PTS){ const px = obj.cx + p.x*obj.R, py = obj.cy + p.y*obj.R; const d=(px-x)**2+(py-y)**2; if (d<bd){bd=d;best=p;} }
      if (best && onPick) onPick(best.id);
    });
  }
  skies.add(obj); resize(); loop();
  return obj;
}
function starStyle(L){
  if (L >= MASTER) return {c:'#F6CD62', r:3.0, glow:12};
  if (L >= 3) return {c:'#8FE7EC', r:2.4, glow:6};
  if (L >= 0) return {c:'#63B9C9', r:2.0, glow:3};
  return {c:'rgba(200,222,238,.36)', r:1.15, glow:0};
}
function draw(o, t){
  const {ctx, dpr} = o; const W = o.w, H = o.h;
  if (!W || !H) return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const cx = W/2, cy = H/2 - (o.interactive?0:H*0.04), R = Math.min(W,H)*0.43;
  o.cx=cx; o.cy=cy; o.R=R;
  // star compass rings
  ctx.strokeStyle='rgba(170,200,220,.10)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(cx,cy,R*1.04,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy,R*0.707,0,Math.PI*2); ctx.stroke();
  for (let i=0;i<32;i++){ const a=i/32*Math.PI*2; const r1=R*1.04, r2=R*(i%8===0?1.13:1.08);
    ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*r1, cy+Math.sin(a)*r1); ctx.lineTo(cx+Math.cos(a)*r2, cy+Math.sin(a)*r2); ctx.stroke(); }
  if (o.interactive){
    ctx.fillStyle='rgba(190,210,225,.55)'; ctx.font='700 12px "Alegreya Sans", system-ui, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    const lr = R*1.2;
    ctx.fillText('ʻĀKAU', cx, cy-lr); ctx.fillText('HEMA', cx, cy+lr);
    ctx.save(); ctx.translate(cx+lr, cy); ctx.rotate(Math.PI/2); ctx.fillText('HIKINA',0,0); ctx.restore();
    ctx.save(); ctx.translate(cx-lr, cy); ctx.rotate(-Math.PI/2); ctx.fillText('KOMOHANA',0,0); ctx.restore();
  }
  const sc = Math.max(0.8, Math.min(1.6, R/170));
  for (const p of PTS){
    const L = lvl(p.id), st = starStyle(L);
    const x = cx + p.x*R, y = cy + p.y*R;
    let r = st.r*sc*p.sz;
    if (L >= MASTER && !reduced){ r *= 0.85 + 0.25*Math.sin(t/700 + p.ph); }
    if (st.glow){ ctx.shadowColor = st.c; ctx.shadowBlur = st.glow*sc; } else ctx.shadowBlur = 0;
    ctx.fillStyle = st.c; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  ctx.shadowBlur = 0;
  if (o.hi){ const p = PTS.find(q=>q.id===o.hi); if (p){ ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(cx+p.x*R, cy+p.y*R, 7*sc, 0, Math.PI*2); ctx.stroke(); } }
}
let rafOn = false;
function loop(){
  if (rafOn) return; rafOn = true;
  let last = 0;
  const step = t => {
    for (const o of [...skies]) if (!o.canvas.isConnected){ o.ro.disconnect(); skies.delete(o); }
    if (!skies.size){ rafOn=false; return; }
    const anyM = WORDS.some(w => lvl(w.id) >= MASTER);
    if (t - last > 45){ last = t; for (const o of skies) draw(o, t); }
    if (reduced || !anyM){ rafOn=false; return; }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function redrawSkies(){ for (const o of skies) draw(o, performance.now()); loop(); }

/* ---------- views ---------- */
let TAB = 'home';
function greeting(){ const h = new Date().getHours(); if (h<11) return 'Aloha kakahiaka'; if (h<13) return 'Aloha awakea'; if (h<17) return 'Aloha ʻauinalā'; return 'Aloha ahiahi'; }
function ringSVG(frac){
  const r=40, c=2*Math.PI*r, f=Math.min(1,frac);
  return '<svg viewBox="0 0 92 92"><circle cx="46" cy="46" r="'+r+'" fill="none" stroke="var(--surface-2)" stroke-width="10"/><circle cx="46" cy="46" r="'+r+'" fill="none" stroke="'+(f>=1?'var(--gold)':'var(--accent)')+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+(c*f)+' '+c+'"/></svg>';
}
function renderHome(){
  const d = day(dkey()), due = dueList().length, nl = newLeftToday(), total = counts();
  const upcoming = nextNew(4).map(id => BY.get(id));
  const vc = counts(VERBS), nc = counts(NOUNS);
  const bar = (c, tot) => '<div class="stack" role="img" aria-label="'+c.m+' mastered, '+c.g+' growing, '+c.l+' learning of '+tot+'"><i class="c-m" style="width:'+(c.m/tot*100)+'%"></i><i class="c-g" style="width:'+(c.g/tot*100)+'%"></i><i class="c-l" style="width:'+(c.l/tot*100)+'%"></i></div>';
  const canStart = due>0 || nl>0;
  const started = Object.keys(S.w).length;
  $('#main').innerHTML = `
  <section class="view">
    <p class="greet"><b>${greeting()}.</b> ${started ? (due ? 'Some stars need you tonight.' : 'Your sky is looking good.') : 'Every word you master lights a star.'}</p>
    <div class="sky sky-hero" id="heroSky" role="button" tabindex="0" aria-label="Open your sky map">
      <canvas></canvas>
      <div class="sky-over"><div class="sky-count">${fmtNum(total.m)}<span>of 1,000 stars lit</span></div><div class="sky-note">${total.g+total.l ? fmtNum(total.g+total.l)+' more stars are warming up' : 'Learn a word and watch a star appear'}</div></div>
    </div>
    ${storageOK ? '' : '<div class="warn">This browser is not letting the app save. Progress will reset when you close the page.</div>'}
    <div class="card today">
      <div class="ring">${ringSVG(d.xp/S.set.goal)}<div class="num">${fmtNum(d.xp)}<small>of ${S.set.goal}</small></div></div>
      <div>
        <h2>${canStart ? "Today's session" : 'All caught up'}</h2>
        <div class="meta"><span><b>${due}</b> to review</span><span><b>${nl}</b> new words left today</span><span><b>${liveStreak()}</b> day streak</span></div>
      </div>
      <div class="today-actions">
        ${canStart ? '<button class="btn primary big" id="go">'+(due && !nl ? 'Review '+due+(due===1?' word':' words') : 'Start session')+'</button>' : '<button class="btn primary big" id="extra">Learn 5 more words</button>'}
        ${canStart && !nl ? '<button class="btn teal" id="extra">Learn 5 more words</button>' : ''}
        <button class="btn ghost" id="practice" ${started? '' : 'disabled'}>Practice round</button>
      </div>
      ${!nl && started ? `<p class="muted" style="grid-column:1/-1;font-size:15px">You have met today's ${S.set.newPerDay} new words. Tap Learn 5 more words for more, or raise the daily number under Progress.</p>` : ''}
    </div>
    <div class="card upnext">
      <div class="eyebrow">Coming up next</div>
      <div class="upnext-row">${upcoming.map(w => `<button class="teaser" data-open="${w.id}"><div class="kind">${kindName(w)} ${w.n}</div><div class="w">${esc(w.h)}</div><div class="h">“${esc(w.k)}”</div></button>`).join('') || '<p class="muted">You have met every word. Now light up the rest of the sky.</p>'}</div>
    </div>
    <div class="card prog">
      <div class="prow"><div class="lab">Verbs <span>${vc.m} mastered · ${vc.g+vc.l} learning</span></div>${bar(vc,500)}</div>
      <div class="prow"><div class="lab">Nouns <span>${nc.m} mastered · ${nc.g+nc.l} learning</span></div>${bar(nc,500)}</div>
      <div class="legend"><span><i class="c-m"></i>Mastered</span><span><i class="c-g"></i>Growing</span><span><i class="c-l"></i>Learning</span></div>
    </div>
  </section>`;
  const sky = $('#heroSky'); mountSky(sky.querySelector('canvas'));
  sky.addEventListener('click', () => go('sky'));
  sky.addEventListener('keydown', e => { if (e.key==='Enter') go('sky'); });
  $('#go') && $('#go').addEventListener('click', () => startSession('daily'));
  $('#extra') && $('#extra').addEventListener('click', () => startSession('extra'));
  $('#practice').addEventListener('click', () => startSession('practice'));
  document.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => openWord(b.dataset.open)));
}
function renderSky(){
  const c = counts();
  $('#main').innerHTML = `
  <section class="view">
    <div>
      <p class="eyebrow">Your sky</p>
      <h2 class="greet" style="font-size:26px"><b>${fmtNum(c.m)} stars lit.</b> ${fmtNum(1000-c.m)} to go.</h2>
      <p class="muted" style="margin-top:6px;max-width:60ch">Every word is a star. Verbs sit near the center and nouns spread to the edge. A star brightens as you learn the word and turns gold once it is mastered. Tap any star to see its story.</p>
    </div>
    <div class="sky sky-full"><canvas id="bigSky"></canvas></div>

function barsSVG(vals, labels, {h=120, color='var(--teal)', color2=null, vals2=null}={}){

  s += `<line x1="0" x2="${W}" y1="${h}" y2="${h}" stroke="var(--line)"/>`;
  s += `<text x="0" y="10">${max}</text><line x1="24" x2="${W}" y1="6" y2="6" stroke="var(--line)" stroke-dasharray="3 4"/>`;
  vals.forEach((v,i) => {
    const x = i*gap + (gap-bw)/2, bh = v/max*(h-12);
    s += `<rect x="${x}" y="${h-bh}" width="${bw}" height="${bh}" rx="4" fill="${color}"><title>${labels[i]}: ${v}</title></rect>`;

}

let SES = null;
function startSession(mode){
  const tasks = [];
  if (mode === 'daily'){
    const due = dueList().slice(0, 30);
    const news = nextNew(Math.min(newLeftToday(), 8));
    due.forEach(id => tasks.push({k:'quiz', id}));
    news.forEach((id,i) => tasks.splice(Math.min(tasks.length, i*3), 0, {k:'meet', id}));
  } else if (mode === 'extra'){
    nextNew(5).forEach(id => tasks.push({k:'meet', id}));
    dueList().slice(0,10).forEach(id => tasks.push({k:'quiz', id}));
  } else {
    const known = Object.keys(S.w);
    const now = Date.now();
    let pool = known.filter(id => S.w[id].l < MASTER && now - (S.w[id].s||0) > 5*MIN);
    if (pool.length < 8) pool = known.filter(id => now - (S.w[id].s||0) > 5*MIN);
    if (pool.length < 4) pool = known.slice();
    shuffle(pool).slice(0, 15).forEach(id => tasks.push({k:'quiz', id, practice:true}));
  }
  if (!tasks.length){ toast('Nothing to do right now. Try a practice round.'); return; }
  SES = {mode, tasks, i:0, combo:0, best:0, a:0, c:0, xp:0, met:[], lit:[], lvUp:0, retries:{}};
  TAB_PREV = TAB; TAB = 'session';
  $('#session').hidden = false; document.body.style.overflow='hidden';
  nextTask();
}

function distract(w, hard){

  else { const known = pool.filter(x => S.w[x.id]); cands = known.length >= 6 ? shuffle(known).slice(0,10).concat(shuffle(pool.slice()).slice(0,4)) : shuffle(pool.slice()).slice(0,12); }

  const hwOpts = type !== 'h2e';
  sesFrame(`<div class="prompt">${prompt}</div>
    <div class="options" id="opts">${opts.map((o,i)=>`<button class="opt${hwOpts?' hw':''}" data-id="${o.id}"><kbd>${i+1}</kbd><span>${esc(hwOpts ? o.h : o.e)}</span></button>`).join('')}</div>
    <div class="actions"><button class="btn link" id="idk">I don't know</button><span class="muted" style="font-size:13px">Keys 1 to 4 work too</span></div>`);
  const btns = [...document.querySelectorAll('.opt')];
  let answered = false;
  const choose = b => {
    if (answered) return; answered = true;
    const ok = b && b.dataset.id === w.id;
    btns.forEach(x => { if (x.dataset.id===w.id) x.classList.add('right'); x.disabled = true; });
    if (b && !ok) b.classList.add('wrong');
    answer(t, w, ok, {});
  };
  btns.forEach(b => b.addEventListener('click', () => choose(b)));
  $('#idk').addEventListener('click', () => choose(null));
  keyHandler = e => { if (answered) return; const n = parseInt(e.key,10); if (n>=1 && n<=btns.length){ e.preventDefault(); choose(btns[n-1]); } };
}
function showType(t, w){
  sesFrame(`<div class="prompt"><div class="eyebrow">${t.test ? 'Prove it. Type the Hawaiian word' : 'Type the Hawaiian '+(w.t==='v'?'verb':'noun')}</div><p class="mean">${esc(w.e)}</p></div>
    <form class="typebox" id="tform" autocomplete="off">
      <input id="tin" type="text" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Your answer" placeholder="type here">
      <div class="keys" aria-label="Hawaiian letters">${['ʻ','ā','ē','ī','ō','ū'].map(k=>`<button type="button" data-k="${k}">${k}</button>`).join('')}</div>
      <p class="hintline" id="hintline" hidden></p>
      <div class="actions"><span><button type="button" class="btn link" id="idk">I don't know</button><button type="button" class="btn link" id="hint">Show the sound hook</button></span><button class="btn primary" type="submit">Check</button></div>
    </form>`);
  const inp = $('#tin'); inp.focus({preventScroll:true});
  let hinted = false, answered = false;
  inp.addEventListener('input', () => { const p = inp.selectionStart; const v = inp.value.replace(/['‘’`]/g,'ʻ'); if (v!==inp.value){ inp.value = v; inp.setSelectionRange(p,p); } });
  document.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.k, s = inp.selectionStart ?? inp.value.length, e2 = inp.selectionEnd ?? s;
    const vowel = {'ā':'a','ē':'e','ī':'i','ō':'o','ū':'u'}[k];
    if (vowel && s===e2 && s>0 && inp.value[s-1].toLowerCase()===vowel){ inp.value = inp.value.slice(0,s-1)+k+inp.value.slice(s); inp.setSelectionRange(s,s); }
    else { inp.value = inp.value.slice(0,s)+k+inp.value.slice(e2); inp.setSelectionRange(s+1,s+1); }
    inp.focus();
  }));
  $('#hint').addEventListener('click', () => { hinted = true; const h = $('#hintline'); h.hidden = false; h.textContent = '“'+w.k+'”  ·  '+w.p; $('#hint').disabled = true; inp.focus(); });
  $('#idk').addEventListener('click', () => { if (answered) return; answered = true; answer(t, w, false, {typed:true, given:''}); });
  $('#tform').addEventListener('submit', e => {
    e.preventDefault(); if (answered) return;
    const v = inp.value; if (!v.trim()) { inp.focus(); return; }
    const perfect = exact(v) === exact(w.h), loose = norm(v) === w.q;
    const ok = perfect || (loose && !S.set.strict);
    answered = true; inp.disabled = true;
    answer(t, w, ok, {typed:true, hint:hinted, marks: loose && !perfect, given:v});
  });
  keyHandler = null;
}
let keyHandler = null;
document.addEventListener('keydown', e => {
  if (!SES || $('#session').hidden) return;
  if (!$('#fb').hidden && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); const b = $('#fbgo'); b && b.click(); return; }
  if (keyHandler && $('#fb').hidden) keyHandler(e);
  if (e.key==='Escape') endSession(false);
});
function answer(t, w, ok, info){
  const now = Date.now(), r = S.w[w.id] || (S.w[w.id] = {l:0,d:now,r:0,w:0,s:now});
  const dd = day(dkey()); touchStreak();
  dd.a++; SES.a++;
  const before = r.l; let gain = 0, note = '';
  if (ok){
    dd.c++; SES.c++; SES.combo++; SES.best = Math.max(SES.best, SES.combo);
    r.r++;
    const dueNow = r.d <= now || t.learn || t.retry || t.test;
    if (t.test){ r.l = Math.max(r.l, 5); r.d = now + INT[5]; note = 'Nice. You know this one. It will check back once in about two weeks, then it is mastered.'; }
    else if (info.hint){ r.d = now + DAY; note = 'You used the hook, so this one stays at its level for now.'; }
    else if (!t.practice || dueNow){ r.l = Math.min(MASTER, r.l + 1); r.d = now + INT[r.l] * (0.9 + Math.random()*0.2); }
    gain = (info.typed ? 15 : 10) + Math.min(10, 2*(SES.combo-1));
    if (info.hint) gain = Math.round(gain/2);
    if (info.marks) note = 'Right. Now add the marks next time: ' + w.h;
    if (before < MASTER && r.l >= MASTER){ dd.m++; SES.lit.push(w.id); gain += 50; }
  } else {
    r.w++; SES.combo = 0;
    if (t.test){ r.l = 0; r.d = now + INT[1]; insertTask(3, {k:'quiz', id:w.id, learn:true}); insertTask(8, {k:'quiz', id:w.id, learn:true}); }
    else { r.l = r.l >= 3 ? r.l - 2 : Math.max(0, r.l - 1); r.d = now + INT[1]; SES.retries[w.id] = (SES.retries[w.id]||0) + 1; if (SES.retries[w.id] <= 2) insertTask(4, {k:'quiz', id:w.id, retry:true}); }
  }
  r.s = now;
  if (gain) addXP(gain);
  save(); renderChips();
  showFeedback(t, w, ok, gain, note, info);
  if (ok && before < MASTER && r.l >= MASTER) setTimeout(() => celebrate(w), 150);
  checkMilestone();
}
function showFeedback(t, w, ok, gain, note, info){
  const fb = $('#fb');
  const [pw, pe] = PRAISE[Math.floor(Math.random()*PRAISE.length)];
  fb.className = 'fb ' + (ok ? 'good' : 'bad');
  if (ok){
    fb.innerHTML = `<div class="fb-in"><h3>${pw} <small>+${gain}</small></h3>
      <p class="ans"><b>${esc(w.h)}</b> · ${esc(w.e)} <span class="muted">(${pw.replace('!','').toLowerCase()} means ${pe})</span></p>
      ${note ? `<p class="note">${esc(note)}</p>` : ''}
      <div class="actions"><button class="btn link" id="fbknow">I know this one. Stop asking.</button><button class="btn primary" id="fbgo">Continue</button></div></div>`;
  } else {
    const first = w.s[0];
    fb.innerHTML = `<div class="fb-in"><h3>Auwē!</h3>
      <p class="ans">It's <b>${esc(w.h)}</b> <span class="pron" style="margin:0 6px">${esc(w.p)}</span> ${esc(w.e)}</p>
      ${info.typed && info.given ? `<p class="muted">You typed “${esc(info.given)}”${S.set.strict && norm(info.given)===w.q ? ', which is right except for the marks' : ''}.</p>` : ''}
      <div class="reteach"><span class="lbl">Remember the story</span><q>“${esc(w.k)}”</q><p class="pic">${esc(w.c)}</p><p class="s">${esc(first)}</p>
        ${w.s.length>1 ? `<details><summary>Read the whole story</summary><div class="story" style="font-size:16px">${w.s.slice(1).map(p=>'<p>'+esc(p)+'</p>').join('')}</div></details>` : ''}
        <p><b>Say it.</b> ${esc(w.y)}</p></div>
      <div class="actions"><button class="btn link" id="fbknow">I know this one. Stop asking.</button><button class="btn primary" id="fbgo">Got it</button></div></div>`;
  }
  fb.hidden = false;
  $('#fbgo').focus({preventScroll:true});
  $('#fbgo').addEventListener('click', () => { SES.i++; nextTask(); });
  let karm = false;
  $('#fbknow').addEventListener('click', e => {
    if (!karm){ karm = true; e.target.textContent = 'Tap again to mark it mastered'; return; }
    const r = S.w[w.id]; const was = r.l;
    r.l = MASTER; r.d = Date.now() + INT[MASTER];
    if (was < MASTER){ day(dkey()).m++; SES.lit.push(w.id); }
    SES.tasks = SES.tasks.filter((x, j) => j <= SES.i || x.id !== w.id);
    save(); toast(w.h + ' is mastered. It will not come up for about 6 weeks.'); checkMilestone();
    SES.i++; nextTask();
  });
}
function checkMilestone(){
  const m = counts().m;
  for (const ms of MILESTONES){ if (m >= ms && !S.seenMs.includes(ms)){ S.seenMs.push(ms); save(); setTimeout(()=>toast(ms===1 ? 'Your first star is lit!' : ms+' stars lit. Your sky is filling up.'), 900); } }
}
function celebrate(w){
  if (reduced) { toast('Star lit: '+w.h); return; }
  const c = $('#burst'); c.hidden = false; const ctx = c.getContext('2d');
  const dpr = Math.min(2, devicePixelRatio||1); c.width = innerWidth*dpr; c.height = innerHeight*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols = ['#F6CD62','#FF5E66','#4CC6CF','#FFF3D1'];
  const ps = [...Array(90)].map(() => { const a = Math.random()*Math.PI*2, v = 3+Math.random()*7; return {x:innerWidth/2, y:innerHeight*0.38, vx:Math.cos(a)*v, vy:Math.sin(a)*v-3, r:2+Math.random()*3, c:cols[Math.floor(Math.random()*4)], life:1}; });
  const t0 = performance.now();
  const f = t => {
    const k = (t-t0)/1300; ctx.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=0.18; p.vx*=0.985; ctx.globalAlpha = Math.max(0,1-k); ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); });
    ctx.globalAlpha = Math.max(0, 1-k); ctx.fillStyle = '#F6CD62'; ctx.font = '800 32px Alegreya, Georgia, serif'; ctx.textAlign='center'; ctx.fillText('Star lit: '+w.h, innerWidth/2, innerHeight*0.3);
    ctx.globalAlpha = 1;
    if (k < 1) requestAnimationFrame(f); else { c.hidden = true; }
  };
  requestAnimationFrame(f);
}

/* ---------- boot ---------- */
go('home');
document.addEventListener('visibilitychange', () => { if (!document.hidden && TAB==='home' && !SES) renderHome(); });
})();
</script>
