ord, is to lift it.",null,"Cop knocking on a mannequin's head"],["v354","v",354,"hoʻonoa","ho-oh-NO-ah","to lift a kapu, to make free","Ho, oh, NO... AHHH!",["Dad put in a brand new pool in the backyard. Then he said the scariest word. \"No.\" The cement has to cure. Three weeks. Nobody goes in.","He puts a rope around it. He hangs a sign that says KAPU. Every day the kids stand at the rope and stare at the blue water like hungry dogs at a steak. Every day Dad says \"No.\"","Twenty one days go by. On the morning of day 22, the whole family is lined up in swimsuits. Dad walks out with scissors. He cuts the rope. He takes down the sign.","\"Ho, oh...\" he says. \"NO more no.\" Everybody screams \"AHHH!\" Nine people cannonball in at once. Water flies over the fence. The neighbor's cat gets wet. The rule is lifted. The pool is free."],"Snip an invisible rope and throw up your arms. \"Ho-oh-NO-ah!\"","Noa means free of kapu, open to everyone. Hoʻonoa is to make something noa again.",null,"Dad cutting the rope around new pool"],["v355","v",355,"hoʻopōmaikaʻi","ho-oh-poh-mai-KAH-ee","to bless","Ho, oh, BOW, my GUY!",["Your friend Kekoa just bought his first food truck. It is shiny and yellow and smells like garlic chicken. Before he sells one plate, he asks the kahu to come bless it.","Thirty people stand around the truck. The kahu dips a ti leaf in a bowl of salt water. Everyone goes quiet.","Except Kekoa's nephew, six years old, who is staring at a mynah on the roof. Kekoa leans over and whispers, \"Ho, oh... BOW, my GUY!\" The nephew drops his head. So does the dog. So does a delivery guy who was just walking by. Even the mynah looks down.","The kahu says a gentle prayer and sprinkles water on the truck, the grill, the cash box, and Kekoa. It feels like sunshine. That afternoon Kekoa sells 400 plates. Blessed."],"Bow your head a little. \"Ho-oh-poh-mai-KAH-ee.\"","Pōmaikaʻi by itself means blessed or fortunate. In Hawaiʻi many new homes and businesses get a blessing, often with a ti leaf and salt water.",null,"Everyone bowing at a food truck blessing"],["v356","v",356,"mōhai","moh-HAI","to make an offering","Mooo' HIGH!",["It is the keiki Christmas program at church. Each child walks up to the manger scene and gives an offering. Most bring a canned good or a dollar.","Then comes Kapono, five years old. He is carrying a shoebox with both hands like it holds the crown jewels. Inside is everything he owns that matters. His loose tooth in a baggie. His favorite smooth rock from the beach. A half eaten malasada. A photo of his dog.","He does not just set it down. He lifts it. Higher. \"MOOO' HIGH!\" he says, stretching his arms as far as they go, standing on his tiptoes. The whole church can see it.","He places it down very gently. The pastor wipes his eyes. Kapono gave his best, and he held it up high first so it would count. The malasada is gone by the end of the service, though."],"Lift both hands up high like presenting something. \"Moh-HAI.\" Hold that long ō.","Mōhai can also be a noun, an offering or a sacrifice.",null,"Boy lifting his treasure box up high"],["v357","v",357,"hoʻokupu","ho-oh-KOO-poo","to give a ceremonial gift","Oh... COUPON?",["A voyaging canoe is coming home after months at sea, and the whole community will gather at the beach to welcome it. Your little cousin Leilani, five years old, hears that everyone brings a hoʻokupu.","She thinks hard. \"Can I give a... coupon?\" she asks. She has one for a free shave ice. She is very proud of it.","Aunty laughs gently. \"Not a coupon. A hoʻokupu. A gift from your heart, given with respect.\" She shows Leilani how to wrap a sweet potato in ti leaves and tie it with a string.","On the day of the ceremony, Leilani carries her little bundle with both hands. She walks down the beach so slowly and so carefully that it takes her ten minutes to go 200 feet. She sets it down and bows. The crew bows back. She never forgets that day. Her coupon is still in her pocket."],"Hold your hands out together, palms up, giving something. \"Ho-oh-KOO-poo.\"","Kupu means to sprout or grow. One popular explanation is that a hoʻokupu is a gift that makes something grow, like respect between people.",null,"Little girl carrying ti leaf bundle slowly"],["v358","v",358,"ʻōʻili","oh-EE-lee","to appear, to pop up","OHHH! EEE! ...LEE.",["Your cousin Lee has a talent. He appears. Out of nowhere. Anywhere.","You open the fridge. Lee is sitting inside next to the mayonnaise. \"OHHH! EEE! ...Lee.\" You close it fast. You open the mailbox. Lee pops up like a jack in the box. \"OHHH! EEE! ...Lee.\" You pull back the shower curtain. Lee. You lift the lid of the rice cooker. Lee, holding a spoon.","Nobody knows how he does it. He shows up at your job interview behind the potted plant. He pops up at the bottom of the pool when you dive in, waving.","It happens so much that your scream is now just \"OHHH, EEE, LEE.\" Long ō, gasp, and then the name. Last week you went on a plane to Kauaʻi. The overhead bin opened. You didn't even scream. \"Oh, eee... Lee.\""],"Pop your head up from behind your hands. \"Oh-EE-lee!\"","Don't mix ʻōʻili, to pop up, with hoʻoili, to transfer or pass down. The long ō at the start is the scream.",null,"Cousin popping out of the fridge"],["v359","v",359,"pale","PAH-leh","to ward off, to shield","PADDLE, EH!",["You sit down at the beach park with your plate lunch. Garlic chicken, two scoops rice, mac salad. Then you hear them. Chickens. Twenty wild chickens coming across the grass like a gang.","They surround the table. A rooster jumps on the bench. Your plate is in danger.","Then Aunty Nani stands up. She grabs her canoe paddle. She plants her feet. \"PADDLE, EH!\" she shouts, and swings it in a big circle over the table. The chickens scatter. The rooster comes back. \"PADDLE, EH!\" She holds the flat side up like a shield and blocks him in mid flight. He bonks off it and lands in a trash can.","For the next hour she guards your lunch like a warrior. Every chicken that comes near gets \"Paddle, eh!\" You finish every grain of rice."],"Hold up your forearm like a shield. \"PAH-leh.\"","Palekana, built on pale, means safe or safety. Say PAH-leh, not like the English word pale.",null,"Aunty blocking chickens with canoe paddle"],["v360","v",360,"kani","KAH-nee","to ring, to make a sound","Can he? CAN HE?",["The farm in Kula gets a new rooster. He is tiny. The size of a coffee mug. The other roosters laugh at him.","At dawn, all the animals gather. \"Can he?\" whispers a goat. \"Can he even crow?\" the cows ask each other. \"CAN HE?\"","The little rooster climbs onto the fence post. He puffs out his chest. He opens his beak. And the sound that comes out is enormous. \"KAAAH-NEEEE!\"","It rings like a church bell. It rings like a fire alarm. Forty car alarms go off in town. Windows buzz. The church bell down the road starts ringing by itself. People hear it all the way over on Lānaʻi.","The other roosters never laugh again. Every morning at 5:30 the tiny one rings out, and the whole island wakes up. Can he? Yes. He can."],"Cup your hands around your mouth and ring it out. \"KAH-nee!\"","Kani is any sound, like a bell ringing, a phone ringing, or a rooster crowing.",null,"Tiny rooster crowing loud as a bell"],["v361","v",361,"ʻume","OO-meh","to pull toward, to attract","Ooh... ME?",["You buy a belt from a guy at the swap meet. He says it is a magnet belt. It is good for your back. You put it on and walk into Ala Moana.","A fork flies out of the food court and sticks to your stomach. \"Ooh... me?\" Then a spoon. Then 40 forks. A shopping cart rolls across the parking lot and slams into your side. \"OOH... ME?\"","Keys fly out of people's pockets. Coins shoot out of the fountain. A security guard's flashlight. A little kid's toy truck. Every metal thing in the mall is pulled toward you like you are the center of the universe.","By the time you get to the exit, you are wearing a giant ball of metal like a shell. You can only move one inch at a time. Somewhere inside it, your phone is ringing."],"Curl your fingers and pull the air toward you. \"OO-meh.\"","ʻUme is a pull toward you. Pale, from before, pushes things away. So ʻume pulls in and pale shields off.",null,"Magnet belt pulling every fork in mall"],["v362","v",362,"hoʻopaʻahao","ho-oh-pah-ah-HAH-oh","to jail, to lock up","Ho, oh, PA... AH... HOW?",["Your niece Malia is seven, and she just got a toy sheriff badge. She takes her job very seriously.","At the party, someone eats the last spam musubi. Malia investigates. There is rice on Pa's shirt. There is nori in his teeth. Case closed.","She marches him to the backyard and locks him in the big dog kennel. She puts the padlock on and tucks the key in her sock. The dog is inside too. The dog looks at Pa. Pa looks at the dog.","\"Ho, oh... PA... AH... HOW?\" he says. How did he end up in jail? Everyone at the party walks by and waves. Somebody hands him a plate through the bars. Three hours later Malia lets him out on good behavior. He has to promise to share next time. He does not."],"Grip invisible bars and look sad. \"Ho-oh-pah-ah-HAH-oh.\"","Paʻahao means a prisoner, and hale paʻahao is a jail. Inside it is paʻa, meaning stuck.",null,"Pa locked in the dog kennel"],["v363","v",363,"luku","LOO-koo","to destroy, to wipe out","LOOK! OOOO!",["Your whole family spent nine hours at Waimānalo building a sandcastle. It is nine feet tall. Towers, a moat, a drawbridge made of a boogie board, little flags made of chopsticks. People are taking pictures.","Then two year old Kaleo wakes up from his nap.","He toddles over. He stares up at the castle with big eyes. \"LOOK!\" he says, pointing. Everyone smiles. \"OOOO!\" he says.","Then he raises both fists like a tiny monster and charges. He stomps the moat. He knocks down the east tower. He sits on the drawbridge. He bites a flag. Nine hours of work, wiped out in 45 seconds.","When the dust clears there is nothing but a flat patch of sand and one proud baby in the middle. \"Look! Oooo!\" he says again. He totally destroyed it."],"Stomp your feet like a tiny monster. \"LOO-koo!\"","Luku is a big word for total wipeout, like a storm flattening a town. For one broken thing you would use a smaller word.",null,"Toddler stomping a giant sandcastle flat"],["v364","v",364,"hoʻopōʻino","ho-oh-poh-EE-no","to harm, to damage","Oh-oh... POH! EEE... NO!",["You just bought your first car. It is used but it is shiny and yours. You park it in the driveway and stand there admiring it.","Uncle is backing his truck out next door. He has three surfboards, a kayak, and a ladder sticking out the back. He is looking at his phone.","\"Oh-oh,\" you say. POH! The ladder hits your windshield. POH! The kayak hits your door. POH! POH! The surfboards hit the side mirror.","\"EEE... NO!\" you scream.","Uncle finally looks up. Your car has a cracked windshield, a door shaped like a taco, and a mirror hanging by a wire. He gets out, looks at it for a long time, and says \"Ho, sorry, eh.\" Then he backs up again and hits the mailbox. Harm, damage, POH, eee, no."],"Wince like you just heard a crash. \"Ho-oh-poh-EE-no.\"","Pōʻino means harm or misfortune. Don't mix it with hōʻino, the next word, which is harming with insulting words.",null,"Uncle's truck denting your new car"],["v365","v",365,"hōʻino","hoh-EE-no","to insult, to desecrate","HŌŌŌ... EEE... NO.",["Your aunty buys a new robot vacuum. It is smart. Too smart. It rolls around the house and it judges everybody.","It rolls up to your cousin's shoes. It stops. It looks up with its little blue light. \"Hōōō... eee... no.\" It rolls away. It rolls up to Uncle's aloha shirt, the one with the flamingos. \"HŌŌŌ... EEE... NO.\" It rolls over your plate lunch and refuses to clean it. \"Hōōō... eee... no.\"","It insults the couch. It insults the cat. It insults Grandma's new hairdo, and Grandma chases it around the house with a broom for twenty minutes.","Now nobody will walk past it. It sits in the corner going \"Hōōō, eee, no\" at the wall. Aunty wants to return it, but the box just says No Refunds."],"Look someone up and down and shake your head. \"Hoh-EE-no.\"","Hōʻino is insulting or disrespecting with words. Hoʻopōʻino is harming things. Both share ʻino, which means bad.",null,"Rude robot vacuum insulting everyone"],["v366","v",366,"hoʻowahāwahā","ho-oh-vah-haah-vah-HAAH","to look down on, to scorn","Ho, oh, WAH-HAH, WAH-HAAAH!",["You pull up to the red light on your little moped. It is pink. It has a basket. It goes 25 miles an hour, 30 downhill.","Next to you rolls a monster truck. Tires taller than you. The driver sits 30 feet up, wearing mirrored sunglasses. He looks down at you. All the way down.","\"Ho, oh,\" he says. Then he laughs a big, long, scornful laugh. \"WAH-HAH, WAH-HAAAAH!\" He looks at your basket. \"WAH-HAAAH!\" He looks at your helmet with the stickers. \"WAH-HAH, WAH-HAAAAAH!\"","The light turns green. He roars off in a cloud of smoke and drives straight into a huge mud puddle, where he gets stuck up to the doors.","You putt putt past him at 25 miles an hour. You do not laugh. You just ring your little bell. Ding ding."],"Look down your nose and laugh long. \"Ho-oh-vah-haah-vah-HAAH.\"",null,null,"Monster truck driver laughing at a moped"],["v367","v",367,"hoʻohenehene","ho-oh-heh-neh-HEH-neh","to tease, to make fun of","Heh-neh, HEH-neh!",["There is one bald rooster on the farm. He lost all his neck feathers in a fight with a mango. He looks like a plucked hot dog with legs.","The hens will not let it go. Every morning they line up on the fence, all eleven of them, and sing their teasing song. \"Heh-neh, HEH-neh! Heh-neh, HEH-neh!\" The same sing song you used on the playground.","He tries to crow. \"Heh-neh, HEH-neh!\" He struts. \"HEH-neh!\" One hen puts a tiny pink bow on her own neck just to make fun of him. The goats laugh. The pig laughs. Even the eggs look like they are giggling.","He finally gets a little knitted scarf from the farmer's wife. He wears it proudly. The hens stop for exactly one day. Then, \"Heh-neh, HEH-neh!\" They tease the scarf."],"Wiggle your fingers by your ears and sing it. \"Ho-oh-heh-neh-HEH-neh.\"",null,null,"Hens teasing a bald rooster"],["v368","v",368,"kolohe","ko-LO-heh","to be naughty, to act up","Go LOW, HEY!",["Big fancy wedding. White tablecloths down to the floor. Under the head table crawl two little rascals, your nephews, five and seven.","\"Go low, hey!\" whispers the big one. They slide along on their bellies. One by one, they tie guests' shoelaces together. Uncle's shoe to Aunty's shoe. The groom's to the best man's. Grandma's to the table leg. The nakinaki uncle would be proud.","Then the dad of the bride taps his glass. \"Everybody, please stand for a toast!\"","Forty people stand up. Forty people fall down. Glasses fly. Cake lands on the minister. The best man is hopping in a circle, tied to the groom.","Under the table two little faces giggle. \"Go low, hey!\" They are already crawling toward the dessert table. That is kolohe. Pure naughty, with a big grin."],"Duck down low, look both ways, and grin. \"Ko-LO-heh.\"","Kolohe is used all the time in local English for a rascal, a playful troublemaker. Calling a kid kolohe is usually said with a smile. There is no kahakō, so every o is short.",null,"Kids tying wedding guests' shoes together"],["v369","v",369,"wikiwiki","vee-kee-VEE-kee","to hurry; to be fast","Quicky, QUICKY!",["Your flight leaves at 9:15. It is 9:02. You are just getting out of the car at the airport with Grandma, who is 84 and has three suitcases and a cooler full of frozen fish.","\"QUICKY, QUICKY!\" she yells. She grabs two suitcases and takes off running. You did not know she could run.","She goes through security like a bowling ball. She jumps over a luggage cart. \"Quicky, QUICKY!\" She dodges a family of six and a guy with a surfboard. She runs down the terminal so fast her slippers make smoke.","At 9:14 she reaches the gate. The door is closing. She sticks the cooler in the gap. The door opens. She turns around, fish cooler under one arm, and waves you in. \"Quicky, quicky,\" she says, not even out of breath."],"Pump your arms like you're running late. \"Vee-kee-VEE-kee!\"","The Honolulu airport shuttle was named the Wiki Wiki, and that shuttle is where the web word wiki got its name.",null,"Grandma sprinting through airport with fish cooler"],["v370","v",370,"lohi","LO-hee","to be slow; to be late","(S)LOW... HEE.",["You are already late for work. You jump on the bus. The driver is a sea turtle. A big old honu with a little driver's cap.","He turns the key. Very slowly. He checks the mirror. Very slowly. He puts on the blinker. It blinks four hundred times. He pulls out into traffic at one mile an hour.","You lean over. \"Uh, can we go faster?\" He turns his head. It takes 45 seconds. He opens his mouth to say \"slowly,\" but he is so slow that he misses the S completely. \"...LOW... HEE.\"","It takes four hours to go one block. You are late. The bus is late. Everybody on the bus is late. A snail passes you on the sidewalk and waves. Low, hee. That is lohi. Slow and late."],"Move your hand across the table, super slow. \"LO... hee.\"","Lohi means both slow and late. Next comes hoʻolohi, to slow something down.",null,"Sea turtle driving the city bus"],["v371","v",371,"hoʻolohi","ho-oh-LO-hee","to slow down","WHOA! Oh! LOW-HEE!",["You are a paniolo up in Waimea. The ranch gives you a new horse. His name is Rocket. You should have asked why.","You climb on. Rocket takes off. Seventy miles an hour. You fly past cows. You fly past fences. A tourist's hat flies off. You are headed straight for the edge of a cliff.","You pull back on the reins with everything you've got. \"WHOA! OH! LOW! HEE!\"","Rocket starts to slow down. \"WHOA! OH!\" Slower. Slower. He slows so much he ends up at turtle speed, the same speed as the bus driving honu from lohi. His front hooves stop one inch from the edge. A pebble falls off and takes eight seconds to hit the bottom.","You slide off. Your legs are jelly. From now on you ride Rocket very, very slowly."],"Pull back on invisible reins. \"Ho-oh-LO-hee.\"","Lohi is being slow. Hoʻolohi is making something slow. Good for traffic, horses, and people who talk too fast.",null,"Paniolo stopping runaway horse at cliff"],["v372","v",372,"hoʻokuʻi","ho-oh-KOO-ee","to join together; to crash into","Ho, oh, GOO-(hic)-EE!",["Bumper cars at the county fair. Right before your turn, you drop your cotton candy all over the front of your car. The bumper is pink and sticky.","The ride starts. You crash into Aunty. BONK. Your cars stick together. \"Ho, oh, GOO... EE!\" You can't get loose. You crash into your cousin. BONK. Stuck. Into a guy from Kāneʻohe. Stuck. Into a kid with a shave ice, who adds more goo.","Every crash joins another car. By the end of the ride there are twelve bumper cars glued together into one giant bumper car blob, spinning in a circle, everybody laughing and screaming \"GOO... EE!\"","The ride operator has to use a spatula to pull you apart. It takes an hour. Now they post a sign. No cotton candy on the bumper cars."],"Smack your fists together and keep them stuck. \"Ho-oh-KOO-ee!\"","Hoʻokuʻi can mean to join and also to crash into, and bumper cars do both. Next, hoʻokuʻikahi joins things into one.",null,"Bumper cars stuck together with cotton candy"],["v373","v",373,"hoʻokuʻikahi","ho-oh-koo-ee-KAH-hee","to unite, to make peace","Ho, oh, GOOEY KAH-HEE!",["Uncle Ben and Uncle Kalani have been fighting for 20 years. It is about a mango tree on the property line. Whose mangoes? Nobody knows. They do not wave. They do not talk. One built a fence. The other built it higher.","One morning Aunty has had enough. She sets up a card table right on the property line. She makes a pot of coffee. She pours in a whole can of sweet condensed milk. It is so thick it barely pours. Gooey coffee.","\"Ho, oh,\" she says. \"GOOEY KAH-HEE. Sit.\"","They sit. They sip. They get sticky. Neither one can stay mad while drinking something that sweet. Uncle Ben laughs first. Uncle Kalani laughs second. By noon they are picking mangoes together. They tear down both fences. Two families, one yard."],"Hook two pinky fingers together and shake. \"Ho-oh-koo-ee-KAH-hee.\"","Kahi means one, so hoʻokuʻikahi is to join into one. It is used for making peace and uniting people.",null,"Two uncles making peace over sweet coffee"],["v374","v",374,"hoʻomālamalama","ho-oh-maah-lah-mah-LAH-mah","to light up, to enlighten","Ho, oh, MAAA, LLAMA, LLAMA!",["Remember Mom's spoiled llama from mālama? He got bored one night and ate a whole box of glow sticks. Four hundred of them.","At 8 p.m. the power goes out on the whole street. Pitch black. You cannot see your hand. Then the llama walks into the living room. He is glowing. Green, pink, blue, like a disco ball with legs.","\"Ho, oh, MAAA!\" you yell. \"LLAMA, LLAMA!\" The whole house lights up.","The neighbors come over. Everybody sits around the llama like a campfire. Kids do homework by llama light. Grandpa reads the newspaper. A lost moth flies in from outside and thinks it has found heaven.","When the power comes back on, nobody turns on the lights. Why would they? The llama lights up the room, and the room likes it."],"Spread your fingers open like a light turning on. \"Ho-oh-maah-lah-mah-LAH-mah.\"","Mālamalama means light or clear. Don't mix it up with mālama, to take care of. Hoʻomālamalama also means to enlighten a person, to help them understand.",null,"Glowing llama lighting up the house"],["v375","v",375,"hoʻonipo","ho-oh-NEE-po","to court, to romance","Oh... NEED POKE?",["Kainalu works at the fish market. Every day at 11:45, a woman in a green visor comes to buy fish. He is in love. He cannot talk.","On day one he holds out a little bowl of ʻahi poke. \"Oh... need poke?\" She takes it and smiles. On day two, shoyu poke. \"Oh... need poke?\" Day three, limu poke. Day ten, spicy. Day forty, a poke bowl shaped like a heart.","He writes her a song. He leaves flowers on her car. He learns to play the ʻukulele just to sing \"Need poke? Need poke?\" under the window of her office.","On day one hundred, she walks in holding her own bowl. She holds it out to him. \"Oh... need poke?\" He drops a whole tuna. That is courting. One hundred bowls of poke."],"Hold out an invisible bowl, shy and hopeful. \"Ho-oh-NEE-po.\"","Hoʻonipo is to court, to try to win someone's heart. The next word, nipo, is the feeling itself, being in love or longing.",null,"Fish market guy offering poke every day"],["v376","v",376,"nipo","NEE-po","to long for, to be in love","KNEE... POP!",["Your cousin Makoa is in love. The girl moved to the continent for college, 2,500 miles away, and now he just misses her. All day. All night.","Every afternoon at 2:15 he waits by the mailbox for her letter. He stares down the street. He sighs so hard the mailbox flag goes up by itself.","When the mail truck finally turns the corner, his knees go weak. Literally. \"KNEE...\" they buckle, \"...POP!\" You can hear them crack from the house. He drops to the sidewalk every single day.","One Tuesday there is a pink envelope with a heart on it. Makoa's knees do not just pop. They pop, pop, POP, like popcorn in a microwave, and he lies in the grass holding the letter to his chest for an hour. That is nipo. Longing so hard your knees give out."],"Put a hand on your heart and let your knees wobble. \"NEE-po.\"","Nipo is the feeling, longing or being in love. Hoʻonipo is acting on it, courting.",null,"Lovesick cousin collapsing by the mailbox"],["v377","v",377,"hoʻomanawanui","ho-oh-mah-nah-vah-NOO-ee","to be patient, to hang in there","Oh, MAAAN... ah, WAH... NOO-EE!",["There is a new malasada shop in town, and the line is 300 people long. It wraps around the block twice. You are number 287. Your little brother is seven.","After ten minutes he starts. \"Oh, maaan... ah, wahhh... noo-eee!\" It is the sound of a kid falling apart. Twenty minutes. \"OH, MAAAN... AH, WAHHH... NOO-EEE!\"","Grandpa does not get upset. He just takes the whine and finishes it for him, calm as a rock. \"Hoʻo... manawa... nui.\" Hang in there.","Across the street, a heron has been standing on one leg by the drain for six hours waiting for a fish. It does not move. It does not whine. Your brother watches it. He stands on one leg too.","Two hours later you get to the window. The malasadas are still warm. The heron gets its fish at the same time."],"Take a deep breath, stand on one leg, stay calm. \"Ho-oh-mah-nah-vah-NOO-ee.\"","Manawa can mean heart or disposition, and nui means big, so a big, steady heart. Many people also remember it as manawa, time, plus nui, giving it lots of time. People say E hoʻomanawanui to each other for be patient, hang in there.",null,"Kid and heron both waiting on one leg"],["v378","v",378,"noʻonoʻo","no-oh-NO-oh","to think it over, to reflect","No? Oh... NO... oh.",["Uncle Kawika walks up to the counter at the plate lunch place. There are 38 choices on the board. He has been coming here for 30 years. It does not matter. He still has to think.","He strokes his chin. \"Chicken katsu? No... oh... NO... oh.\" He nods slowly. \"Loco moco? No... oh...\" His eyes go up to the ceiling. His lips move. He counts on his fingers.","The line behind him grows. Twenty people. Forty. Somebody orders a pizza to the line. A lady knits a whole sweater. Uncle is deep in thought, bobbing his head with a little catch each time. \"No... oh... NO... oh.\"","Forty five minutes later he looks up, very sure. \"I'll have the usual.\" The cashier already made it. It's been sitting on the counter for 40 minutes."],"Tap your chin and look up at the ceiling. \"No-oh-NO-oh.\"","Noʻonoʻo is thinking something over. It can also mean the mind or a thought. Manaʻo is more like an opinion or idea.",null,"Uncle thinking 45 minutes over plate lunch"],["v379","v",379,"hoʻoiho","ho-oh-EE-ho","to lower, to bring down","Ho! Oh! EEEE... HO!",["A cat named Biscuit is stuck at the top of a 60 foot coconut tree. She has been up there all day, yelling at everyone.","The fire truck comes. The ladder is too short. So the firefighters try something else. One climbs the tree like a gecko, puts Biscuit into a bucket, and ties it to a rope. Now they have to lower her. Slowly.","Six firefighters hold the rope. \"HO! OH!\" they chant together, and let out a little rope. The rope squeaks. \"EEEEE...\" The bucket drops a foot. \"HO!\" Another foot. \"HO! OH! EEEEE... HO!\"","It takes half an hour. The whole neighborhood counts along. Biscuit sits in the bucket like a queen being carried down from her throne. When she touches the ground, she hops out, licks one paw, and walks away. Not one thank you."],"Lower both hands slowly, like letting out a rope. \"Ho-oh-EE-ho.\"","Iho means down or downward. Hoʻoiho is to bring something down.",null,"Firefighters lowering a cat in a bucket"],["v380","v",380,"ʻalawa","ah-LAH-vah","to glance","Ah... LARVA!",["You are at a fancy lunch. The waiter sets down a beautiful salad. Greens from Waimānalo, edible flowers, tiny tomatoes like jewels.","You pick up your fork and give the plate one quick look. Just one. A glance. And there, curled on a lettuce leaf, is a fat little white bug baby, waving at you.","\"Ah... LARVA!\"","That is all you need. One glance. You do not need to study it. You do not need a second look. You put the fork down. You look out the window. You look at the ceiling. You glance back one more time, super quick, like touching a hot stove. Still there. \"Ah, larva.\"","The waiter comes by. He glances at the plate. He glances at you. He takes it away without a word and brings you fried rice instead."],"Flick your eyes to the side and back, fast. \"Ah-LAH-vah.\"","ʻAlawa is a quick sideways look. Kilo, the next word, is the opposite, watching closely for a long time.",null,"Diner glancing at a larva in salad"],["v381","v",381,"kilo","KEE-lo","to watch closely; to read the stars","KEE-LO... KEE-LO...",["Uncle Masa has been buying fish at the early morning auction for 50 years. He can guess any ʻahi within one kilo just by looking. But today the numbers matter. A big one is on the scale.","He leans in with a magnifying glass. He watches the needle. It wobbles. \"Kee-lo... kee-lo...\" He does not blink. He watches the needle for two minutes. Four minutes. Ten.","A fly lands on his eyeball. He does not blink. The other buyers get bored and go get coffee. The fish gets bored. Uncle keeps watching, eyes wide, nose one inch from the dial.","Finally the needle stops. Uncle nods. \"Forty two kilo, 300 grams.\" He was right before it even stopped. He always watches that closely. At night he goes home and watches the stars the same way."],"Lean in close and stare without blinking. \"KEE-lo.\"","A kilo hōkū is a star watcher, someone who reads the stars. Kilo is also used for reading the weather and the ocean.",null,"Uncle staring at the fish scale needle"],["v382","v",382,"hākilo","haah-KEE-lo","to spy on","HAWK... EE... LOW.",["Aunty Winnie wants to know everything happening on her street. Binoculars are not enough anymore. So she buys a hawk costume. Brown feathers, yellow beak, big fake wings.","At dawn she climbs the mango tree across from the neighbor's house and settles in on a branch. She whispers to herself, \"Hawk... ee...\" and sinks lower into the leaves, \"...LOW.\"","She watches everything. Who got a new car. Who is dating who. Which cousin came home at 3 a.m. She writes it all down in a tiny notebook tucked under her wing.","When the neighbor steps outside, she freezes and goes \"Hawk, ee, low,\" and slides down even lower. Her feathers are shaking. The neighbor looks up, sees a giant hawk with reading glasses, and waves. \"Morning, Aunty Winnie.\" She pretends she did not hear."],"Peek over the top of your hands like binoculars. \"Haah-KEE-lo.\"","Hākilo has kilo inside it. Kilo is watching closely. Hākilo is watching when you're not supposed to be, spying.",null,"Aunty in a hawk costume spying from tree"],["v383","v",383,"makaʻala","mah-kah-AH-lah","to be alert, to watch out","My CAR! AH... LAAARM!",["Your car alarm is broken. It goes off every four minutes, all night, for no reason. WEE-OO WEE-OO WEE-OO.","At 11:04 p.m. you jump out of bed. \"My CAR! Ah... LAAARM!\" You run outside. Nothing. At 11:08 again. At 11:12 again.","By 2 a.m. you are the most alert person on the island. Your eyes are as wide as pie plates. You hear a leaf fall two streets away. You can see in the dark like an owl. You catch a mosquito with chopsticks while standing in the driveway in your boxers.","At dawn the neighbors come out to complain, and you already know what they're going to say before they say it. You do not sleep for three days. You become a lifeguard. Nobody has ever been more alert."],"Snap your eyes wide open and look side to side. \"Mah-kah-AH-lah.\"","Maka means eye. Older dictionaries explain the rest as ala, awake, so eyes awake, on the lookout. Notice the ʻokina in makaʻala.",null,"You wide-eyed from all-night car alarm"],["v384","v",384,"akahele","ah-kah-HEH-leh","to be careful, to go easy","Uh-kah... HEY, LEH!",["Your cousin Lehua, everybody calls her Leh, has one job. Carry the six tier wedding cake down 40 steep concrete steps from the house to the backyard. The cake is taller than she is. It wobbles like jello.","The whole family lines the stairs, whispering, \"Uh-kah... hey, Leh!\" Easy, Leh. Careful, Leh.","She takes one step. The cake leans. \"HEY, LEH!\" She stops. She leans the other way. One step. \"Uh-kah... hey, Leh.\" A gecko runs across her foot. Everyone gasps. She freezes for a full minute.","It takes her an hour and ten minutes to go down 40 steps. Grandma prays. Uncle can't watch. But Leh sets the cake down on the table, perfect, not one flower out of place. The whole family collapses on the grass. Then the ring bearer runs straight into the table."],"Hold out both hands flat and walk like you're on ice. \"Ah-kah-HEH-leh.\"","Hele means to go. Akahele is going with care, and people say it the way you'd say drive safe or take it easy.",null,"Cousin carrying giant cake down steep stairs"],["v385","v",385,"hoʻokamaʻāina","ho-oh-kah-mah-AAH-ee-nah","to get to know, to get familiar","Camera? Ahhh... ee... NAH.",["Your new neighbor, Brad, moves from the continent. The first week he takes pictures of everything. The rainbow. The mango tree. A chicken crossing the road. His plate lunch. Your aunty. He takes 4,000 photos in seven days.","But then he starts learning. He learns your names. He learns which beach is safe. He learns to take off his shoes at the door. He learns the shortcut to Kalihi and how to say \"shoots.\" He learns that the chicken crossing the road happens every day at 7 a.m.","A year later you are all at the beach. A double rainbow comes out. You hand him your phone. \"Camera?\" He looks at it. He looks at the rainbow. \"Ahhh... ee... nah.\" He just sits and enjoys it. He knows this place now. He got familiar."],"Lower an invisible camera and relax your shoulders. \"Ho-oh-kah-mah-AAH-ee-nah.\"","A kamaʻāina is a local, someone born or long settled in a place. Kama means child and ʻāina means land, so child of the land.",null,"New neighbor putting camera down for rainbow"],["v386","v",386,"hoʻolauna","ho-oh-LAU-nah","to introduce","HOOO... OH... LOWWW... NAH!",["You take your dog Kolohe Boy to the dog park for the first time. You are new here. You don't know anybody.","Kolohe Boy walks you straight up to a big poodle. He sits, lifts his head, and howls. \"HOOO... OH... LOWWW... NAH!\" The poodle's owner laughs and shakes your hand. That's an introduction.","He walks you to a husky. \"HOOO... OH... LOWWW... NAH!\" The husky's owner says hi. To a tiny chihuahua in a sweater. \"HOOO... OH... LOWWW... NAH!\" To a guy with three pugs. A lady with a pig on a leash. Kolohe Boy howls at each one, then sits back like a proud emcee.","By sunset you know 34 dogs and 29 people. You have been invited to two birthday parties and a barbecue. Your dog introduced you to the whole park."],"Hold out an open hand from one friend toward another. \"Ho-oh-LAU-nah.\"","Hoʻolauna is to introduce. The next word, launa, is to be friendly and hang out. Hoʻolauna is what gets the hanging out started.",null,"Dog howling introductions at the dog park"],["v387","v",387,"launa","LAU-nah","to be friendly, to hang out with","LOUNGE, AH!",["You set up your beach chair at Kailua. Umbrella, cooler, a bag of chips. You lean back. \"Lounge, ah.\"","A ghost crab pops out of the sand next to you. He is dragging a tiny beach chair of his own, the size of a matchbox. He sets it up right next to yours. He leans back. \"LOUNGE, AH.\"","He is very friendly. He waves at every dog. He offers you a crumb. You offer him a chip. He shares his tiny cooler, which has one drop of water in it. You talk story all afternoon. He tells you about the time he got carried off by a wave.","At sunset he folds his chair and waves one claw. The next Saturday he is waiting for you. You hang out every weekend now. You even bring him a tiny umbrella."],"Lean back in your chair and put your hands behind your head. \"LAU-nah.\"","Launa is being friendly and getting along with people. Hoʻolauna, with hoʻo in front, is to introduce people.",null,"Friendly crab in a tiny beach chair"],["v388","v",388,"hoihoi","hoy-HOY","to be interested, to enjoy","AHOY! HOY!",["A pirate ship is sailing past Waikīkī. The captain is bored. He has seen a hundred islands. He has seen gold. Nothing interests him anymore.","Then his telescope stops. Floating on a raft in the middle of the ocean is a shave ice stand. Rainbow syrup. Li hing powder. A little sign that says Ice Cream On Bottom.","\"AHOY! HOY!\" he shouts, leaning so far over the rail that his hat falls in. He is very interested. \"HOY! HOY!\"","He turns the whole ship around. He rows over himself. He tries every flavor, all 24 of them. He asks the shave ice guy how the machine works, where the syrup comes from, if he could learn. He stays for three days. His crew sails off without him. He does not even notice."],"Put a hand over your eyes like a pirate spotting something. \"Hoy-HOY!\"","Hoihoi can mean interested and also interesting or enjoyable. Next, hoʻohoihoi is making something fun for others, to entertain.",null,"Pirate captain excited by a shave ice raft"],["v389","v",389,"hoʻohoihoi","ho-oh-hoy-HOY","to entertain, to make interesting","HO! OH! HOY-HOY!",["Remember the pirate who fell in love with shave ice? He needs money now, so he takes a job as the entertainment at kids' birthday parties.","First party. Thirty bored kids sitting on the grass, looking at their phones. The pirate jumps out of a cardboard box. \"HO! OH! HOY-HOY!\"","He juggles five coconuts. He juggles three pineapples and a watermelon. He tells a story about a shark with a toothache. He does a magic trick where the birthday boy's slipper turns into a chicken. The chicken runs away. The kids scream with joy.","By the end, the kids are dancing on the picnic tables and the parents are filming. The pirate bows so low his hook gets stuck in the grass. \"HO! OH! HOY-HOY!\" He entertained them all, and he did not use a single phone."],"Spread your arms like a showman. \"Ho-oh-hoy-HOY!\"","Hoihoi is being interested. Hoʻohoihoi is making others interested, entertaining them.",null,"Pirate juggling pineapples at a birthday party"],["v390","v",390,"hoʻomakaʻu","ho-oh-mah-KAH-oo","to scare","MA! KA... BOO!",["Your little brother wants to scare Ma. So he hides in the laundry basket. He waits. Under the dirty towels. For two hours. He falls asleep once.","Finally, Ma walks in to do laundry. She hums a song. She reaches into the basket.","He explodes out of the towels. \"MA! KA...\" a gulp as he takes a breath, \"...BOOOO!\"","Ma jumps so high her head hits the ceiling fan. She screams so loud the neighbor's dog starts howling. She drops the detergent. Soap bubbles fill the whole laundry room. She runs out the door and halfway down the street before she stops.","When she comes back, she is holding her chest and laughing. Your brother is so proud. Then she sits down, very calm, and says, \"Okay. Now you do all the laundry.\" That scared him more."],"Jump out and throw up your hands. \"Ho-oh-mah-KAH-oo!\"","Makaʻu means afraid or scared. Hoʻomakaʻu is to make someone afraid, to scare them.",null,"Kid bursting out of the laundry basket"],["v391","v",391,"hoʻohuhū","ho-oh-hoo-HOO","to make someone angry","HOO-HOOOOO!",["Uncle Keola is trying to take a nap on the couch. Your little cousin decides to poke him. Once on the arm. Uncle's eye opens a little.","Poke. Uncle's ears turn pink. Poke. His face turns red. Poke poke poke. Now his face is purple, like a plum.","At poke number 40, steam starts coming out of both his ears. It gets louder and louder until it sounds just like an old train whistle. \"HOO-HOOOOOOO!\" The windows fog up. The smoke detector goes off. The cat hides in the rice cooker.","Your cousin looks up, very innocent. \"What?\" Uncle stands up, still whistling steam. \"HOO-HOOOOO!\" He chases your cousin around the house three times, then outside, then down the block. The steam trail hangs in the air for an hour. That is how you make somebody angry."],"Poke the air three times, then make a train whistle. \"Ho-oh-hoo-HOO!\"","Huhū means angry. Hoʻohuhū is to make someone angry. Ukiuki, next, covers being annoyed, irritated or peeved.",null,"Steam whistling out of an angry uncle's ears"],["v392","v",392,"ukiuki","oo-kee-OO-kee","to be annoyed","UKEY, UKEY!",["The kid next door got a ʻukulele for his birthday. He knows one chord. It is the wrong chord.","At 5 a.m. he starts. \"Ukey, ukey. Ukey, ukey.\" Strum strum. Strum strum. The same chord. Over and over.","At 6 a.m. your left eye starts to twitch. At 7 a.m. your jaw is tight. At 8 you are eating breakfast with your teeth clenched. \"Ukey, ukey, ukey, ukey.\" At 9 you put a pillow on your head, then two pillows, then the couch cushions.","At noon you walk over, knock on the door, and politely offer to teach him a second chord. He learns it. Great. Now he plays two chords. Wrong ones. \"UKEY, UKEY!\" Your eye is twitching so hard it is keeping the beat. That is ukiuki. Annoyed, all the way down to your eyelid."],"Twitch one eye and grit your teeth. \"Oo-kee-OO-kee.\"","Ukiuki covers being annoyed, irritated, peeved or resentful. Hoʻoukiuki is to irritate someone on purpose.",null,"Neighbor kid strumming one wrong chord at dawn"],["v393","v",393,"pīhoihoi","pee-hoy-HOY","to be excited, upset, alarmed","PEEEEE! HOY! HOY!",["Aunty Momi is asleep in the hammock on a Sunday afternoon. Snoring. A plate of half eaten poke on her belly.","Her grandson finds a whistle in the junk drawer. He tiptoes up. He puts it right next to her ear. He blows as hard as he can. \"PEEEEEEEE!\"","Aunty launches out of the hammock like a rocket. \"HOY! HOY!\" She flies over the fence. The poke flies over the roof. She lands in the kiddie pool with a big SPLASH. She sits there in six inches of water, heart pounding, eyes as big as plates. \"HOY! HOY!\"","Then she sees the ice cream truck turning onto the street, playing its song. Now she is excited instead of scared. She jumps up, dripping wet, and runs after it. \"PEEEE! HOY! HOY!\" Alarmed, then excited, all stirred up in one minute. Pīhoihoi."],"Blow an imaginary whistle, then jump. \"Pee-hoy-HOY!\"","Pīhoihoi is being all stirred up, excited, worried or alarmed. Hikilele, next, is the jump that comes with a shock.",null,"Aunty launched from hammock by a whistle"],["v394","v",394,"hikilele","hee-kee-LEH-leh","to jump in fright","HEE! KEE! LEH-LEH!",["You slide your foot into your slipper by the back door. Something inside moves. Something with a hundred legs. It is a centipede, seven inches long, and it is not happy.","\"HEE!\" you squeal. \"KEE!\"","Then your body jumps without asking you. \"LEH-LEH!\" Remember lele, to jump or fly? You jump so high you hit the ceiling and stick there, flat, arms and legs out like a cat in a cartoon. Your slipper stays on the floor.","The centipede crawls out, looks around, and walks off into the garden. Nobody chases it.","Your mom walks into the kitchen. She sees you stuck to the ceiling. She looks at the slipper. She knows. \"Centipede?\" You nod. She hands you a broom to help you climb down. That is hikilele. Jumping out of your skin."],"Jump a little in place with both hands up. \"Hee-kee-LEH-leh!\"","Lele means to jump or fly, like in hoʻolele and ʻukulele. Hikilele is the jump that comes with a fright.",null,"You stuck to ceiling from centipede scare"],["v395","v",395,"kāhāhā","kaah-haah-HAAH","to be amazed","CAAAR! HAAAH! HAAAAH!",["A magician comes to the school carnival. He is wearing a top hat and a cape. He looks at the crowd. \"For my last trick,\" he says, \"I will pull something out of this hat.\"","He reaches in. He pulls out a steering wheel. Then a bumper. Then a whole front tire. Then, very slowly, he pulls out an entire car. A red station wagon. Full size. With a surfboard on top.","Three hundred people stare with their mouths hanging open. \"CAAAR!\" gasps one kid. \"HAAAH!\" says her mom. \"HAAAAH!\" says the principal, who drops his shave ice.","Nobody claps. They are too amazed. Then the car honks. Then the magician climbs into it, waves, and drives away out the gate. Everyone is still standing there with their jaws on the ground."],"Open your mouth wide and gasp three times, each one longer. \"Kaah-haah-HAAH!\"","Kāhāhā is the big wow. It is used when you are amazed or astonished, and the long ā sounds are the gasps.",null,"Magician pulling a whole car from his hat"],["v396","v",396,"ʻaʻapo","ah-AH-po","to catch on fast, to be quick to learn","Ah! A HIPPO!",["A baby hippo enrolls in the second grade. Nobody expects much. He is gray and round and he sits on two desks at once.","Monday, the teacher writes long division on the board. The hippo looks at it once. He solves it. \"Ah! A hippo!\" the kids say. Tuesday, he learns to play ʻukulele in 20 minutes. \"AH! A HIPPO!\" Wednesday he learns hula. By Thursday he is teaching the teacher how to fix the printer.","Every time he picks up a new thing in about five seconds, the whole class shouts \"Ah! A HIPPO!\" He catches on faster than anybody ever has. He catches on so fast he graduates by Friday.","The principal gives him a diploma. He eats it. He learned everything else fast, but table manners take longer."],"Snap your fingers like you just got it. \"Ah-AH-po!\"","ʻApo means to catch. ʻAʻapo is catching on, being quick to learn, just like English says you catch on.",null,"Baby hippo acing second grade"],["v397","v",397,"hoʻopaʻanaʻau","ho-oh-pah-ah-nah-OW","to memorize","Pa! Ah... NOW... OW!",["It is the night before the spelling bee. You have 400 words to learn. Pa is quizzing you at the kitchen table with a pile of flash cards.","\"Pa! Ah...\" you say. \"I can't remember.\" Pa has an idea. The old folks say you learn things by heart in your gut, not your head. So he hands you a flash card. You eat it. \"Now!\" he says. Another card. Chew. Swallow. \"Now!\"","By card 200 your stomach hurts. \"OW!\" By card 400 you are round as a ball. \"Pa! Ah... now... OW!\"","Next morning at the spelling bee, the judge says \"necessary.\" You burp. The word comes up spelled perfectly. N, E, C, E, S, S, A, R, Y. You win the whole thing. You memorized it all. Every word is stuck in your gut forever."],"Tap your belly and then your head. \"Ho-oh-pah-ah-nah-OW.\"","Paʻa means stuck and naʻau means gut. Hoʻopaʻanaʻau is making something stick in your gut, learning it by heart.",null,"Kid eating flash cards before spelling bee"],["v398","v",398,"hoʻopaʻa","ho-oh-PAH-ah","to fasten; to study; to book","Ho! Oh! PAH... AH!",["You climb into the front car of the biggest roller coaster at the fair. The ride operator is a seven foot tall aunty with a whistle. She takes safety very seriously.","She pulls down your lap bar. \"HO! OH! PAH!\" It locks. You gasp, \"AH!\" She adds a seatbelt. PAH. AH. Another seatbelt. A strap across your chest. A clip on your ankle. She fastens you in with 14 straps. You can't move your eyebrows.","Then she hands you a thick textbook. \"You gonna study while you ride,\" she says. \"Test is Monday.\" You read chapter one while the coaster goes upside down.","When it stops, she checks her clipboard. \"I booked you for nine more rides.\" PAH. AH. That is hoʻopaʻa. Fasten, study, and book, all in one day at the fair."],"Click an invisible seatbelt with a snap. \"Ho-oh-PAH-ah.\"","Hoʻopaʻa has three everyday meanings. You hoʻopaʻa a seatbelt, you hoʻopaʻa for a test, and you hoʻopaʻa a table at a restaurant.",null,"Aunty strapping you in with 14 seatbelts"],["v399","v",399,"paʻa","PAH-ah","to be solid, stuck; to be done","PAW! (hic) AH!",["Your dog, Tank, finds the peanut butter jar on the floor. He shoves his whole front paw inside to get the last bit. Now it is stuck. Solid. Like it was cemented in.","\"PAW!\" you yell. He looks at you. He shakes his paw. The jar stays on. \"(hic) AH!\" You grab the jar and pull. Tank slides across the floor with you. Nothing. The jar is on there tight as a bolt.","Your brother pulls Tank. You pull the jar. Your mom holds the couch. Everyone counts to three. Pull. The jar will not budge. It is paʻa.","Then Tank does the only smart thing anyone does all day. He licks the jar clean from the inside, and his paw slides right out. The jar is empty. Totally finished. Paʻa. Stuck, and then done."],"Grip one fist with the other hand and pull hard. \"PAH-ah.\"","Paʻa also means finished or done. Ua paʻa ka hana means the work is done.",null,"Dog's paw stuck in peanut butter jar"],["v400","v",400,"hoʻāla","ho-AAH-lah","to wake someone up; to revive","Ho! AAAH-la(rm)!",["Your cousin Kainoa sleeps like a rock. Fire trucks do not wake him. Thunder does not wake him. Last year he slept through his own birthday party.","So Tūtū buys the loudest alarm clock on the island. It is shaped like a rooster, and instead of beeping, it yells. At 6 a.m. it goes off. \"HO! AAAH-LA(RM)! HO! AAAH-LA(RM)!\"","Kainoa rolls over. Tūtū turns the knob up to ten. \"HO! AAAAAAH-LA!\" The windows rattle. The neighbor's dogs wake up. The whole street wakes up. A cat napping on Maui opens one eye.","Ho, aaah, la. Hoʻāla. To wake someone up.","Finally Kainoa sits up, hair sticking straight out. \"Okay, okay, I'm awake.\" Tūtū hands him a cup of coffee. The rooster clock even revives the wilted plant on the windowsill. It stands up straight and looks around."],"Shake an invisible sleeper by the shoulder. \"Ho-AAH-lah!\"","Ala means to wake up. Hoʻāla is to wake someone else up, and it can also mean to stir up, revive or restore. A mele hoʻāla is a chant to wake a sleeper.",null,"Rooster alarm clock waking the whole street"],["v401","v",401,"kahuli","kah-HOO-lee","to capsize, to overturn","Kah! Hoo! Lee!",["You are paddling a tiny two seat canoe off Kailua, but somehow three passengers climbed in. A crow up front. An owl in the middle. Your cousin Lee in the back, eating a family size bag of chips.","A little wave comes. The crow leans left and screams \"KAH!\" The owl leans right and hoots \"HOO!\" Lee leans way out over the side to grab a floating chip and yells \"LEE!\"","Kah. Hoo. Lee. The canoe flips completely upside down. Now all four of you are under it in a little air pocket. The crow is soaked, the owl is furious, and Lee is still chewing.","You flip it back over and everybody climbs in. Then Lee spots another chip. \"KAH! HOO! LEE!\" Over you go again. Kahuli. Round two."],"Tip your flat hand over like a flipping canoe. \"Kah-HOO-lee!\"","Hoʻokahuli means to tip something over on purpose.",null,"Crow, owl and Lee flipping a canoe"],["v402","v",402,"poʻi","PO-ee","to cover; to break (like a wave)","Po... EE!",["Sunset Beach, winter. A wave rises up 40 feet tall, and it is not water. It is purple. It is poi. Somebody dumped the biggest bowl of poi in history into the ocean, and now it is coming for the beach.","The wave curls high over everyone's heads. People start yelling \"POI!\" but right at the top the wave gets a hiccup and freezes for one full second. \"PO...\" freeze... \"EE!\"","SPLOOSH. It breaks. Poʻi. It covers everything. The cars, the lifeguard tower, the guy selling shave ice, the shave ice. The whole beach is under two feet of sticky purple blanket.","You dig yourself out and lick your arm. Honestly? Not bad. A little sour. Two day poi."],"Curl your hand over like a breaking wave, and catch your breath in the middle. \"Po... ee!\"","Poʻi (with the ʻokina catch) is not poi (the food). As a noun, poʻi is also a lid, like the cover on a pot. Compare uhi (403), another word for cover.",null,"Giant purple poi wave covering the beach"],["v403","v",403,"uhi","OO-hee","to cover","Ooh! Hee!",["Aunty Pua just bought a roll of plastic wrap one mile long. She has a mission. Cover everything.","She covers the couch. She covers the TV. She covers the rice cooker, the fan, the mailbox and the mailman. Every time she stretches the plastic over something new, it squeaks \"OOH... HEE!\" Ooh, hee. Uhi.","By lunchtime she has covered the car, the mango tree and the whole house, like a giant leftover plate in the fridge. The neighbors walk by and their voices sound muffled.","The next morning you wake up and try to get out of bed. Squeak. You can't move. She covered you too, tucked in tight like a plate of chow fun. \"Ooh-hee!\" says the plastic. \"Keep you fresh,\" says Aunty."],"Pull an invisible sheet of plastic over the table. \"Oo-hee!\"","Uhi is also the word for a yam, a starchy food plant grown across the Pacific. Poʻi (402) is more like a lid on top, uhi is spreading a covering over something.",null,"Aunty plastic wrapping the whole house"],["v404","v",404,"kāʻili","kaah-EE-lee","to snatch","Caaar... EEL-y!",["There is an eel living in the cup holder of your car. Nobody knows how it got in there. It is nine feet long, and it is fast.","You pull up to a drive thru. The worker holds out your fries. Before your hand even moves, the eel shoots out the window and SNATCHES them. You scream the longest scream of your life. \"CAAAAAR...\" Then a little hiccup of shock. \"...EEL-EE!\" Caaar eely. Kāʻili.","It doesn't stop. It snatches the worker's hat. It snatches a malasada from the car behind you. It snatches the sunglasses off a guy on a moped at the red light. Snatch, snatch, snatch.","By the time you get home, the back seat is full of stolen stuff, and the eel is wearing all the hats."],"Snatch at the air fast, then gasp. \"Kaah... EE-lee!\"","Kāʻili is a quick grab. Pōā (405) is a full robbery.",null,"Car eel snatching fries at drive thru"],["v405","v",405,"pōā","poh-AAH","to rob","Po'! AAAH!",["You are sitting at a beach park with the best plate lunch of your life. Two scoop rice, mac salad, kalbi. Then, out of the naupaka bushes, come 30 mongooses wearing tiny black masks.","They rob you. Completely. They take the plate lunch. They take your wallet, your phone, your slippahs, your car keys and the cooler. One of them takes the shirt right off your back and puts it on. They leave you exactly one grain of rice.","You stand there in your shorts and let out the longest scream of your life. \"POOOOO'! AAAAAAH!\" As in, I am po' now. Poor. AAAAH. Pōā. Both vowels long, because the robbery was that thorough.","Far away in the bushes, you hear 30 tiny mongooses chewing kalbi."],"Pat your empty pockets and wail. \"Pohhh-AAAH!\"","Pōā can also be the noun, a robber.",null,"Masked mongoose gang robbing plate lunch"],["v406","v",406,"hoʻopilikia","ho-oh-pee-lee-KEE-ah","to bother, to cause trouble","Ho! Oh! Pili! Key! Ah!",["Your cousin has a goat named Pili. Pili makes trouble every single day. He eats the laundry. He headbutts the mailbox. He climbs onto the car roof and dents it into a bowl.","Today you have a job interview, and Pili eats your car key. Just swallows it. Gulp. You chase him around the yard yelling \"HO! OH! PILI! KEY! AH!\" He runs through Aunty's orchids, tips over the pūpū table, jumps the fence and stops traffic on Kamehameha Highway.","Ho, oh, Pili, key, ah. Hoʻopilikia. To bother. To make pilikia, trouble.","The whole neighborhood joins the chase. Pili is having the best day of his life. Three days later the key comes back out on its own. You don't want to talk about it. You take the bus."],"Shake your fist at an invisible goat. \"Ho-oh-pee-lee-KEE-ah!\"","Pilikia means trouble. In pidgin you hear \"No make pilikia,\" don't make trouble. Hoʻo- turns it into causing the trouble.",null,"Goat Pili swallowing the car key"],["v407","v",407,"hoʻohiwahiwa","ho-oh-hee-vah-HEE-vah","to cherish, to honor","Ho! Oh! Heave-ah! HEAVE-ah!",["Tūtū turns 100 today, and the whole neighborhood wants to honor her. Not with a card. Not with a cake. Something bigger.","Forty uncles grab the legs of her recliner. She is sitting in it with 60 lei stacked up to her nose. The uncles lift together and chant \"HO! OH! HEAVE-AH! HEAVE-AH!\" Hee-vah, hee-vah. Up she goes. Above their heads. Above the carport. Level with the mango tree.","They carry her down the street like royalty. Traffic stops. Cars honk. A little kid runs up and offers a spam musubi, and Tūtū raises it high like a trophy.","Every time the uncles get tired, somebody yells \"Heave-ah! HEAVE-AH!\" and she rises again. That is how you cherish your Tūtū. Hoʻohiwahiwa."],"Lift both hands up slowly, like raising a chair. \"Ho-oh-hee-vah-HEE-vah!\"","Hiwahiwa alone means precious, dearly loved.",null,"Uncles lifting Tūtū's recliner up high"],["v408","v",408,"ʻiʻini","ee-EE-nee","to desire strongly","Ee! EE-ny!",["There is one tiny piece of butter mochi left at the potluck. It is the size of a dice. You want it more than you have ever wanted anything. More than a new car. More than summer vacation.","You point at it with a shaking finger. Your throat catches. \"EE!\" Hiccup. \"EEEE-NY!\" The eeny one. The teeny eeny one. \"Ee... EE-nee!\"","Your wanting gets so strong that you start to float. Your feet leave the floor. Your eyes turn into two little mochi squares. The whole room goes quiet as you drift across the table toward it, whimpering \"ee... EE-nee...\" like a puppy at the door.","Just as your fingers reach it, Uncle leans in and eats it. You float there, crying, for three hours."],"Reach for something tiny with a trembling finger. \"Ee... EE-nee!\"","ʻIʻini is a strong craving or yearning. Ake (409) is another word for wanting, being eager or yearning for something.",null,"Floating toward the last butter mochi"],["v409","v",409,"ake","AH-keh","to desire, to yearn, to be eager","Ache, eh...",["Two slippahs went to Ala Moana Beach. Only one came home. The right slippah was carried off by a wave in 1998.","The left slippah has been sitting in the window by the front door ever since, staring at the ocean. Every sunset it lets out a long sigh. \"Aaaah... KEH.\" Its little rubber heart aches. \"My heart... it ACHE, eh.\"","Ake. Wanting something back so much it aches. The slippah has written 4,000 letters. It dreams about the right slippah every night. Some mornings it hops, alone, all the way to the beach, and just stands in the sand, looking out.","So if you ever find a lonely right slippah on a beach, bring it home. Somebody is waiting."],"Put your hand on your heart and sigh at the window. \"AH-keh.\"","Ake is also the word for the liver.",null,"Lonely slippah staring at the sea"],["v410","v",410,"lomi","LO-mee","to knead, to massage, to press","LOW! ME!",["You go to a massage place in Chinatown. The massage therapist is a giant octopus named Aunty. Eight arms. Every one of them strong like a forklift.","She kneads your back like bread dough. Push, fold, roll. Two arms on your shoulders, two on your legs, one on your head, and three kneading the air just to warm up. You try to say \"Lower, please,\" but you are so squashed it comes out \"LOW... ME! LOW... ME!\"","Lomi, lomi, lomi. She rolls you out flat like a pizza. She presses you into a ball. She kneads you so long you forget your own name.","After one hour you walk out loose, soft and floppy, like a wet noodle with a smile. You tip her eight dollars. One for each arm."],"Knead invisible dough with both hands. \"LO-mee, LO-mee.\"","Lomilomi is Hawaiian massage. Lomi salmon is salted salmon mashed by hand with tomato and onion.",null,"Octopus kneading you like dough"],["v411","v",411,"kaomi","kah-OH-mee","to press down","Cow! OH ME!",["There is a food truck in Haleʻiwa that makes the flattest sandwiches on the island. Their secret is not a grill. It is a 1,400 pound cow named Bessie.","You order a grilled cheese. The cook lays the bread down, whistles, and Bessie sits on it. The whole truck tips sideways. The cook yells \"COW! OH ME!\" Kaomi. Pressed down.","The sandwich comes out as thin as paper. You can read the menu through it. So you ask for another one, extra pressed. Bessie climbs the ladder to the roof of the truck and does a cannonball onto the bread. \"COW! OH ME!\"","The sandwich goes six inches into the ground. You dig it out with a shovel and eat it anyway. Best sandwich of your life."],"Press your palm flat down on the table, hard. \"Kah-OH-mee!\"","Kaomi is pressing straight down. Lomi (410) is kneading and rubbing.",null,"Cow sitting on a sandwich"],["v412","v",412,"ʻūmiʻi","oo-MEE-ee","to pinch, to clamp","OOOH! ME! EE!",["You are walking on the reef at low tide, minding your business. A crab the size of a car tire is waiting under a rock. It has been waiting there for eleven years for exactly your big toe.","CLAMP. You scream a long \"OOOOOOOOH!\" Then your breath catches. \"ME!\" Catches again. \"EE!\" Ooooh, me, ee. ʻŪmiʻi.","You hop all the way up the beach with the crab hanging off your foot like a heavy slippah. You shake it. It pinches harder. You try to bribe it with a spam musubi. It pinches harder.","A lifeguard tries to pry it off with a surfboard. The crab clamps the surfboard with its other claw. Now you have a crab, a surfboard and a lifeguard all attached to your foot, hopping together toward the tower."],"Pinch your own earlobe and yelp. \"OOO... MEE... ee!\"","As a noun, ʻūmiʻi can also mean a clamp or pincers.",null,"Car tire crab clamped on your toe"],["v413","v",413,"hoʻomaʻemaʻe","ho-oh-mah-eh-MAH-eh","to clean","Ma, eh? MA, EH!",["Company is coming in ten minutes, and Ma switches into cleaning mode. Her eyes glow. Steam comes out of her ears. She has a mop in one hand, a vacuum in the other, and a pressure washer strapped to her back.","You walk in and ask \"Ma, eh?\" She doesn't hear you. \"MA, EH!\" She blasts the couch clean. She vacuums the dog. She scrubs the ceiling. She polishes the goldfish bowl until the goldfish can see its own face.","Ho, oh, Ma, eh, MA, EH! Hoʻomaʻemaʻe. To make clean.","Then she sees your dirty slippah feet. She lifts you by the collar, dips you in the sink, and scrubs behind your ears until they squeak. The doorbell rings. The house is so clean it echoes."],"Scrub the air in fast circles. \"Ho-oh-mah-eh-MAH-eh!\"","Maʻemaʻe (468) means clean. Add hoʻo- and it means to make clean.",null,"Ma pressure washing the whole house"],["v414","v",414,"kaulaʻi","kow-LAH-ee","to hang out to dry","Koala? EE!",["Aunty brings home a koala from a trip. Don't ask. On the very first day it falls into the fishpond. It comes out soaked and smells like a wet carpet.","So Aunty does what she does with anything wet. She hangs it on the clothesline. The koala grabs the line with both arms, because that is what koalas do, and Aunty clips a few clothespins on its fur for style. It swings there in the trade wind, dripping, slowly getting fluffy.","The neighbor looks over the fence and yells \"IS THAT A KOALA? EE!\" Koala, ee. Kow-LAH-ee. Kaulaʻi. Hung out to dry.","By afternoon it is so dry and fluffy it looks like a cloud. It refuses to come down. Now Aunty hangs her sheets right next to it, and it hugs them."],"Pin an invisible shirt on a line. \"Kow-LAH-ee.\"","Kaulaʻi lole means to hang clothes out to dry.",null,"Wet koala on the clothesline"],["v415","v",415,"mimiki","mee-MEE-kee","to recede, to pull back (of the sea)","Me! ME! KEY!",["You drop your car key off the end of the pier. Plop. Gone. You stand there with your mouth open.","Then the ocean does something strange. It pulls back. Way back. The water slides away from the beach like someone pulled the plug in a giant bathtub. A hundred feet. Five hundred feet. Half a mile. Fish flop on the sand. And there, glittering way out on the wet reef, is your key.","You yell \"ME! ME! KEY!\" and start to run for it. Then you stop. Tūtū taught you this one. When the sea pulls back like that, you do not run toward it. You run UP.","So you and everyone on the beach race to high ground, still yelling \"Me, me, key!\" because you are still sad about the key. Mimiki. The sea pulling back."],"Pull both hands back toward your chest slowly. \"Mee-MEE-kee.\"","A real safety lesson. If the ocean suddenly pulls back far from shore, a tsunami may be coming. Get to high ground right away.",null,"Ocean pulling back, key on the sand"],["v416","v",416,"hoʻomālie","ho-oh-maah-LEE-eh","to calm, to quiet down","Ho, oh, Maaah-lee, eh...",["There is a baby at Ala Moana Center who is twelve feet tall, and she is having a tantrum. Her name is Molly. She is throwing strollers. She is kicking the fountain. Security is hiding behind the pretzel stand.","You walk up slowly. You do not yell. You sway side to side and hum, very low and very soft. \"Hooo... ohhh... MAAAAH-lee... eh...\" Ho, oh, Mah-lee, eh. The long maaah wraps around her like a warm blanket.","Molly stops. Her lip shakes. You keep going. She sits down with a boom that rattles every window in the mall. Her eyes close. She sucks her giant thumb. The whole mall goes silent.","Two thousand shoppers tiptoe out holding their bags over their heads. Hoʻomālie. To calm down, to quiet."],"Sway and pat the air softly. \"Ho-oh-maah-LEE-eh.\"","Mālie (494) means calm. Hoʻo- makes it to calm someone down.",null,"Calming a twelve foot baby at the mall"],["v417","v",417,"hāmau","haah-MOW","to be quiet, to hush","HAAA... mow.",["It is 3 in the morning. Outside your window, 40 cats are having a singing contest. \"MEOW! MREEEOW! MAAAOW!\"","The retired librarian next door steps outside in her robe. She walks to the middle of the street, plants her feet, and lets out one long, giant hiss. \"HAAAAAAAAH!\" Every cat freezes. The loudest one opens its mouth, and all that comes out is a tiny little \"...mow.\"","Haaa... mow. Hāmau. Hush.","She points one finger at each cat. They sit down in a neat row like kids at church. The dogs stop barking. A gecko on the wall stops chirping and holds its breath. The neighbors' lights go off one by one. She goes back inside. The whole valley sleeps."],"Put a finger to your lips and hiss long. \"HAAAH... mow.\"","Hāmau! works as a command, like Shh! Be quiet! Don't mix it up with hāmama (475), wide open.",null,"Librarian hissing 40 cats silent"],["v418","v",418,"haʻaheo","hah-ah-HEH-oh","to be proud","Ha! Ah! HEY-OH!",["Uncle catches a fish. It is four inches long. It may be the smallest fish ever caught at Magic Island.","He holds it over his head like an Olympic gold medal. He puffs up his chest until his shirt buttons pop off. He struts down the beach like a rooster, knees high, and crows at every person he passes. \"HA! AH! HEY-OHHH!\" Ha, ah, hey, oh. Haʻaheo.","He makes everybody take a picture. He calls the newspaper. He has the fish framed. He wears a T-shirt with the fish on it for three years.","He tells the story at every party, and every time the fish gets bigger. At Christmas it was a marlin. By New Year's it was a whale. \"HA! AH! HEY-OH!\" Proud, proud, proud."],"Puff out your chest and crow. \"Hah-ah-HEH-oh!\"","The song Aloha ʻOe starts with Haʻaheo ka ua i nā pali, proudly the rain on the cliffs.",null,"Uncle strutting with a tiny fish"],["v419","v",419,"haʻahaʻa","hah-ah-HAH-ah","to be humble; to be low","ha-ah, HA-ah",["Remember proud Uncle with the four inch fish? He enters the limbo contest at the family lūʻau, still strutting, still crowing.","Then he meets Tūtū. Tūtū has won the limbo 52 years in a row. She goes under a bar two inches off the ground without spilling her fruit punch.","Uncle goes low. Lower. His back cracks like popcorn. He ends up flat on the grass like a dropped beach towel, and his big rooster crow shrinks into a tiny little laugh. \"ha-ah... HA-ah.\" Haʻahaʻa. Low. Humble.","He crawls out and bows to Tūtū, lower than the bar. The crowd claps. From that day on, when people ask about the fish, Uncle just smiles and says, \"Small one.\""],"Bow low and give a tiny laugh. \"Hah-ah-HAH-ah.\"","Haʻaheo (418) is proud, haʻahaʻa is humble. Haʻahaʻa also just means low, like low land.",null,"Uncle flat under the limbo bar"],["v420","v",420,"hoʻokiʻekiʻe","ho-oh-kee-eh-KEE-eh","to raise up, to elevate","kee-eh... KEE-EH!",["Uncle wants to look under his truck, so he slides a jack under it. It is an old squeaky jack. Every pump screams \"kee-eh... KEE-EH!\"","Pump. \"Kee-eh!\" The truck goes up a foot. Pump. \"KEE-EH!\" Up past the carport roof. Uncle is enjoying this. He keeps pumping. The truck rises above the mango tree, above the power lines, above the clouds. A plane flies under it. Birds build a nest in the tire well.","\"Ho, oh, kee-eh, KEE-EH!\" Hoʻokiʻekiʻe. To lift up, to raise high.","Now the truck is so high the neighbors on Maui can see it. Uncle stands underneath with a flashlight, squinting up at the tiny dot. \"Yup,\" he says. \"Needs one oil change.\""],"Pump an invisible jack handle. \"Ho-oh-kee-eh-KEE-eh!\"","Kiʻekiʻe (448) means high. Hoʻo- makes it to raise something up.",null,"Squeaky jack lifting truck to the clouds"],["v421","v",421,"pilau","pee-LOW","to stink","PILLOW!",["Your brother has had the same pillow since fifth grade. It has never been washed. Not once. Not in 14 years.","It smells like old fish, gym socks and a dead mongoose had a party inside it. It is yellow. It is crunchy. Flies fly toward it and then faint. When he leaves it in the sun, the grass under it dies.","Your sister finally picks it up with barbecue tongs, holds her breath, and runs outside screaming \"PILLOW! PEE-LOW! PILAU!\" She throws it in the ocean. The ocean throws it back.","So she buries it in the backyard, six feet deep. Nothing grows there now. But on hot nights, when the wind is right, you can still smell it."],"Pinch your nose and hold a pillow far away. \"Pee-LOW!\"","People use pilau in pidgin too, for stink, and for somebody acting rotten, as in \"That's pilau, brah.\"",null,"Stinky pillow held with tongs"],["v422","v",422,"ʻala","AH-lah","to smell sweet, to be fragrant","Ah! LAAA!",["You are on a crowded city bus on a hot afternoon. It smells like the bus. Then a lady gets on wearing a lei made of 900 plumeria and pīkake flowers.","The smell hits you like a wave. You catch your breath, close your eyes, breathe in, and cannot stop yourself. You belt it out like an opera singer. \"AAAAH... LAAAA!\" Everybody on the bus breathes in too. \"AAAAH... LAAAA!\" The driver sings. A guy in the back with headphones sings. Ah, la. ʻAla.","By the next stop the whole bus is a choir, floating two inches off the road, carried by the sweet smell. People at the bus stop sniff the air and start singing too. The lady just smiles and fixes her lei."],"Sniff a flower, then sing it out. \"AH-lah!\"","The opposite of pilau (421). Watch the ʻokina. ʻAla is fragrant, but ala means path or road.",null,"Whole bus singing at a plumeria lei"],["v423","v",423,"hoʻolālā","ho-oh-laah-LAAH","to plan","Ho, oh, LAAA... LAAA!",["Aunty is planning your cousin's first birthday lūʻau. The baby is two months old. The party is ten months away. Aunty has been planning for a year already.","The whole living room wall is covered in charts. A seating plan. A food plan. A parking plan. A backup plan for the backup plan. She has a color coded pen for every aunty and a map showing where each cooler goes. As she writes, she sings, holding each note forever. \"Ho, oh, LAAAA... LAAAA!\"","Hoʻolālā. To plan. The two long laaa's are the two long kahakō.","The big day comes. It pours rain. Aunty calmly pulls Plan R, the rain plan, from folder 47. Three hundred guests eat under 30 tents that were already set up. Nobody gets wet. \"LAAA... LAAA,\" she sings."],"Tap an invisible clipboard and sing. \"Ho-oh-laah-LAAH!\"","Lālā means branch. A good plan branches out every which way.",null,"Aunty's wall of lūʻau plans"],["v424","v",424,"hoʻokumu","ho-oh-KOO-moo","to found, to establish","COO! MOO!",["A long time ago, a pigeon and a cow wash up together on a raft on an empty island. There is nothing there. No houses, no roads, no plate lunch.","The pigeon says \"COO.\" The cow says \"MOO.\" They look at each other and decide to start a town. The pigeon lays down the very first stone. The cow sits on it to make it level. \"COO!\" \"MOO!\" Koo, moo. Hoʻokumu. To found, to set up from the base.","They build a school, a post office and a very small bank. The pigeon is the mayor. The cow is the whole police force.","Today 12,000 people live there. In the town square stands a bronze statue of a pigeon on a cow's head. Every morning the town bell rings. \"Coo. Moo.\""],"Set an invisible stone down firmly. \"Ho-oh-KOO-moo!\"","Kumu means base, foundation or source, and also teacher.",null,"Pigeon and cow laying the first stone"],["v425","v",425,"kūkala","koo-KAH-lah","to proclaim, to announce publicly","KOOOO... CALL-ah!",["Uncle's mango tree finally has ripe mangoes. This is the biggest news in the history of the valley. So at 5 in the morning he climbs onto the carport roof with a megaphone the size of a canoe.","He holds the first sound forever. \"KOOOOOOOO...\" Dogs wake up. Chickens fall off fences. Then \"CALL-AH EVERYBODY! MANGO TIME!\" Kooo, call-ah. Kūkala. To proclaim, to announce to the public.","People hear it in Kaimukī. They hear it on Maui. A fishing boat 60 miles out turns around.","By six there is a line down the block with empty bags. Uncle announces every single mango as he hands it out. \"KOOOO... CALL-AH! THIS ONE FOR AUNTY LEI!\" A news helicopter hovers overhead to catch every word."],"Cup your hands around your mouth. \"Koo-KAH-lah!\"","Kū means to stand. Picture standing up tall on the roof when you kūkala.",null,"Uncle proclaiming mangoes by megaphone"],["v426","v",426,"hoʻokaʻaʻike","ho-oh-kah-ah-EE-keh","to communicate","Caw! Ah! EEK! Eh!",["Four strangers are stuck in an elevator at the Ala Moana building. A parrot, a mouse, a tired baby, and your uncle, who only talks in sighs. Nobody speaks the same language. They need to communicate to get out.","The parrot says \"CAW!\" Uncle says \"AH.\" The mouse says \"EEK!\" The baby says \"EH?\" Caw, ah, eek, eh. And somehow, it works. They understand each other perfectly.","The parrot explains the button is stuck. Uncle sighs that he has a butter knife. The mouse squeaks that he can fit behind the panel. The baby asks everyone to please hurry, she needs a nap.","Ten minutes later the doors slide open. They walk out chattering a mile a minute in four different noises. Hoʻokaʻaʻike. To communicate."],"Point back and forth between you and a friend. \"Ho-oh-kah-ah-EE-keh.\"","Inside it hides ʻike, to see or to know. Communicating is passing ʻike back and forth.",null,"Parrot, mouse, baby and uncle in elevator"],["v427","v",427,"hōʻoi","hoh-OY","to sharpen","HOOOO... OY!",["There is a man at the swap meet with a sign that says I SHARPEN ANYTHING. He has a grinding wheel as big as a Ferris wheel. You walk over to ask about scissors. He sees your car.","Before you can stop him, he pushes your whole car against the wheel. Sparks fly for a block. \"HOOOOOOO...\" he howls, holding the note the whole time like a man on a roller coaster. Then he steps back and points. The front bumper now comes to a point like a kitchen knife. \"OY!\"","Hooo, oy. Hōʻoi. To sharpen.","You pay him twelve dollars and drive home. The car slices through traffic cones like butter. It splits a coconut clean in half at a red light. You pull into the driveway and it cuts right through the garage door. Very sharp. Very bad for parking."],"Slide one hand along the other like a blade on a stone. \"Hoh-OY!\"","ʻOi (428) means sharp. Hō- in front makes it cause, so hōʻoi is to make sharp. Hoʻokala is another word for sharpening.",null,"Swap meet man sharpening a whole car"],["v428","v",428,"ʻoi","OY","to be sharp; to be the best","OY!",["There is a knife contest in Hilo. Every chef on the island brings their sharpest knife. One slices a tomato in midair. One cuts a single sheet of paper into 40 sheets.","Then a tiny 93 year old retired sushi chef steps up with his old kitchen knife. He holds it to the light. It is so sharp it cuts the sunbeam in half, and half the room goes dark. The whole crowd catches its breath and gasps \"OY!\"","He waves it gently. It splits the wind. A fly zooms past and comes out the other side with the best haircut of its life.","The judges don't even vote. They just yell \"OY!\" and hand him the trophy. The sharpest one is the best one. ʻOi. Sharp. The best."],"Hold up an invisible knife, tiny gasp, then say it. \"OY!\"","ʻOi aku means more than, surpassing. ʻOi aku ka maikaʻi means better.",null,"Old chef's knife cutting a sunbeam"],["v429","v",429,"hoʻomakeʻaka","ho-oh-mah-keh-AH-kah","to be funny, to joke","Make a... AH-KAH!",["There is a gecko living behind your fridge who thinks he is a comedian. Every night at 10 he climbs onto the counter, taps the rice cooker like a microphone, and tells jokes.","\"Why don't geckos pay rent? Because we just stick around!\" Terrible. But the way he tells it, you laugh so hard rice comes out your nose. Then he yells his catchphrase, \"Ho, oh, MAKE a... AH-KAH!\" which is how he says make a cackle. Everybody cackles. \"AH-KAH! AH-KAH!\"","Ho, oh, make a, ah-kah. Hoʻomakeʻaka. To be funny, to make people laugh.","By the end of the week he has a real show. Forty geckos come to watch. They sit on the walls chirping with laughter, and one laughs so hard it falls into the sink."],"Slap your knee and cackle. \"Ho-oh-mah-keh-AH-kah!\"","ʻAkaʻaka means to laugh.",null,"Gecko doing stand up on the rice cooker"],["v430","v",430,"hoʻokamani","ho-oh-kah-MAH-nee","to be a hypocrite, to act fake","Ho! Oh! Car MONEY!",["Your neighbor gives a speech at every block party. \"Never waste money on fancy things,\" he says, wagging his finger. \"Money is for saving.\" Then he walks home and parks a shiny gold sports car in his driveway.","Except it isn't real. It is made of cardboard, painted gold, and covered in fake money he printed himself. There's no engine. He sits inside and pushes it with his feet. He waves at everybody yelling \"HO! OH! CAR! MONEY!\"","Then it rains. The cardboard melts. The fake bills slide off in a gold puddle. There he is, sitting in the rain, still pedaling with his feet, still pretending. \"Car... money...\" he whispers.","Hoʻokamani. Kah-MAH-nee. Fake. Saying one thing, doing another."],"Flash fake money, then hide it behind your back. \"Ho-oh-kah-MAH-nee.\"","Don't mix it up with hoʻokano, which means stuck up or conceited.",null,"Fake gold cardboard car melting in rain"],["v431","v",431,"hōʻuluʻulu","hoh-oo-loo-OO-loo","to sum up, to collect","Ho! ʻULU! ʻULU!",["A storm blows through Kona in the night. In the morning, 4,000 breadfruit are scattered all over the neighborhood. On roofs. In pools. One is on top of a stop sign. One is inside a mailbox.","Your job is to collect every single one and add them up. You drag a red wagon everywhere. Each time you find one you yell \"HO! ʻULU! ʻULU!\" with a catch in your throat, because they are heavy. You roll them all into one giant pile at the park.","By sunset the pile is as tall as a church. You climb to the top and give the neighborhood your summary. \"Total. Three thousand nine hundred ninety nine. One is still in Uncle's truck.\"","Hōʻuluʻulu. Collected, counted, summed up."],"Scoop invisible breadfruit into a pile. \"Hoh-oo-loo-OO-loo!\"","ʻUlu (breadfruit) is a separate word, but piling up ʻulu makes a great hook for collecting and summing up.",null,"Breadfruit pile as tall as a church"],["v432","v",432,"ʻākoakoa","aah-ko-ah-KO-ah","to gather, to assemble","Aaah! Cocoa! Cocoa!",["The family is spread all over the island. Cousins in Waiʻanae, cousins in Kāneʻohe, and one cousin who has been lost somewhere in Waikīkī since 2019.","Grandpa steps onto the porch with a pot of hot cocoa the size of a hot tub. He bangs a ladle on it and hollers \"AAAAAH! COCOA! COCOA!\"","Within four seconds, 300 people assemble on his lawn. They come on bikes, in trucks, on surfboards. One uncle arrives by parachute. The lost cousin shows up in a wetsuit, still holding a snorkel. Everyone gathers in one big circle with their cups held out.","Ah, cocoa, cocoa. ʻĀkoakoa. To gather. The long aaah at the start is Grandpa's lungs warming up."],"Wave everyone in with both arms. \"Aah-ko-ah-KO-ah!\"","Don't mix it up with kōkua (help), which also sounds like cocoa. ʻĀkoakoa is when everyone comes together.",null,"Grandpa calling 300 cousins with cocoa"],["v433","v",433,"kūpaʻa","koo-PAH-ah","to be loyal, to stand firm","COOL PA! AH!",["Pa sets up the family beach umbrella at Waimānalo at 7 in the morning and says, \"Nobody takes this spot.\" Then the wind comes.","Forty mile an hour gusts. Pa grabs the pole and plants his feet. A beach cleaning tractor rolls up and beeps. Pa does
