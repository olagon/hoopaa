ew asks the keeper, \"Is he going to fall?\" The keeper says \"Nah.\" The hyena goes \"HEE!\" The keeper says, \"...nah?\" Hee! Nah! Hina! And TIMBERRR.","It topples straight over, stiff as a board, right off the rock. It lands with a boom that shakes the snack stand. It lies there on its back with its legs in the air, still giggling."],"Tip over sideways onto the couch. \"HEE-nah!\"","Hina can also mean gray, like gray hair.",null,"Laughing hyena toppling off a rock"],["v114","v",114,"lālau","laah-LAU","to reach for, to grab","\"Laaaa... laaaa... OW!\"",["There is one malasada left at the bakery. It is on the very top shelf, up near the ceiling, and it is still warm. Sugar is falling off it like snow.","You reach for it. You stretch your arm up so far your shirt comes untucked. You go up on your toes, and because stretching makes you sing, you sing. \"Laaaaa... laaaaa...\" Two more inches. One more inch.","Then your shoulder goes pop. \"OW!\" Laaa-laaa-OW! Lālau!","You grab it anyway. You come down on your heels holding the malasada high like a trophy. Everybody in line claps. Your arm is now 3 inches longer than the other one, and you do not care one bit."],"Stretch one arm to the ceiling and sing the first part long. \"Laaaah-lau!\"",null,null,"Reaching for the last malasada"],["v115","v",115,"kolo","KO-lo","to crawl, to creep","\"My COLA!\"",["Grandpa sets his cold cola on the coffee table and goes to find the bottle opener. Across the living room, 40 feet away, baby Kaimana sees it.","Kaimana is 10 months old and she cannot walk yet. But she can crawl.","She drops to her belly like a soldier and creeps. Under the dining table. Under the sleeping dog. Between the legs of three uncles watching football.","Slow. Silent. Elbows and knees. Grandpa comes back and sees her one foot from the table, reaching up with one sticky hand. He yells, \"My COLA!\" Cola! Kolo!","She freezes. He freezes. Then she grabs the bottle and crawls backward, faster than any baby in history, all the way to her blanket. She pretends to be asleep, hugging the cola."],"Creep your fingers across the table like a crawling baby. \"KO-lo.\"",null,null,"Baby army crawling toward the cola"],["v116","v",116,"peku","PEH-koo","to kick","\"PECK! OOH!\"",["Next door lives a rooster named Sensei. He wears a tiny black belt. He trained in the mountains for 7 years.","You kick a soccer ball over the fence by accident. Sensei walks up to it. He pecks it once. \"PECK!\" Then he spins in the air and kicks it with one yellow foot. \"OOH!\" Peck! Ooh! Peku!","The ball flies 90 yards, over your house, over the street, into the school field. The whole neighborhood comes out.","Somebody tosses him a coconut. PECK! OOH! It sails over the church. Somebody tosses a slippah. PECK! OOH! It lands on the roof of the store.","By sunset Sensei has kicked 26 things into the next town. Then he crows once and goes to bed."],"Kick the air in front of you like a kung fu rooster. \"PEH-koo!\"",null,null,"Karate rooster kicking a coconut"],["v117","v",117,"hehi","HEH-hee","to step on, to stomp","\"Heh! Hee!\"",["Aunty Lani ordered a new TV and it came wrapped in bubble wrap. A LOT of bubble wrap. Enough to cover the whole backyard, 2,000 square feet of fat plastic bubbles.","She steps on one. POP. She giggles. \"Heh!\" She stomps on another. POP. \"Hee!\" Heh! Hee! Hehi! Now she cannot stop. She stomps across the yard, knees up high, slippahs slapping, giggling at every pop.","The neighbors think it is fireworks. The dogs on the street start howling. Uncle comes out, steps on one by accident, POP, and starts giggling too. Now two grown adults are stomping in circles.","It takes them 4 hours to step on every single bubble. When they finish, they look at each other and call the store to order another TV."],"Stomp your foot on the floor and giggle. \"HEH-hee!\"",null,null,"Aunty stomping a yard of bubble wrap"],["v118","v",118,"eʻe","EH-eh","to climb aboard, to get on","\"Eh! (hic) Eh!\"",["It is the last ride to the beach and Uncle's old pickup is the only ride left. There are 22 cousins, one cooler and a truck bed made for maybe six.","Uncle yells, \"Everybody climb aboard!\" The first cousin jumps on the bumper and says \"Eh!\" Then he hiccups, that little catch in the throat. \"Eh... (hic) eh!\"","The next one climbs on. \"Eh! (hic) eh!\" Every cousin who climbs aboard hiccups the same way.","They climb on the tailgate. They climb on the roof. They climb on each other's shoulders. One little cousin climbs on the cooler and sits there like a king. Eh (hic) eh! Eʻe!","Twenty-two hiccups later the truck is full. It sinks so low the tires squeal. Uncle drives 4 miles an hour all the way to the beach."],"Hop up like you are getting on a bus, with a catch in the middle. \"Eh-(catch)-eh!\"","You eʻe a bus, a canoe, a plane or a horse. Anything you climb onto to ride. Pukui-Elbert spells it eʻe. You may also see it written ʻeʻe, but Pukui-Elbert uses ʻeʻe for a different word meaning hard or stiff.",null,"22 cousins climbing aboard a pickup"],["v119","v",119,"luʻu","LOO-oo","to dive","\"LOOO... (glub) OO!\"",["A loon from the continent is on vacation at Hanauma Bay. It is a big black and white diving bird the size of a canoe, wearing tiny swim goggles.","The lifeguard walks over. \"Sir, be careful out there.\" The loon ignores him.","It stands up tall, takes a huge breath and calls out, \"LOOO...\" Then its head hits the water with a gulp. \"...(glub) OO!\" Loo-oo! Luʻu! Down it goes.","The crowd waits. One minute. Five minutes. Eleven minutes. Tourists start to worry. Then the loon shoots up out of the water holding a lost slippah, a gold ring, a waterproof camera and a very confused sea cucumber.","It drops the treasure at the lifeguard's feet. It says \"Loo-oo\" one more time and dives again."],"Pinch your nose and bend forward like you are diving. \"LOO-oo!\"","Luʻu is diving down under the water. Jumping feet first off a cliff into water is lele kawa.",null,"Loon in goggles diving at Hanauma Bay"],["v120","v",120,"hoe","HO-eh","to paddle, to row","\"HOE! EH!\"",["It is the big canoe race from Molokaʻi to Oʻahu. Your team is ready. The canoe is ready. Then you open the truck and there are no paddles. None. Somebody forgot.","Aunty Mae marches into her garden and comes back with six garden hoes. Rusty ones, with dirt still on them. She hands them out. \"You paddle with this.\"","The gun goes off. Everybody digs in. \"HOE!\" you yell on every stroke. \"EH!\" Hoe! Eh! Hoe! Eh! The hoes chop the water like it is a vegetable patch. One cousin accidentally plants a row of onions in the ocean.","But the team keeps rowing, 41 miles, blisters on blisters. You finish last, but you finish. The coach says you are the best weeders the ocean has ever seen."],"Paddle three strokes on one side, then switch. \"HO-eh!\"","Hoe is also the paddle itself. The famous canoe race across the channel from Molokaʻi is called the Molokaʻi Hoe.",null,"Canoe team paddling with garden hoes"],["v121","v",121,"heʻe nalu","HEH-eh NAH-loo","to surf","\"HEY! EH! NAH, LOU!\"",["It is a giant day at the North Shore. The waves are 40 feet high and the whole beach is watching. Then out walks Lou.","Lou is 78 years old and weighs 310 pounds. He is carrying an ironing board.","The crowd starts yelling. \"HEY! EH! NAH, LOU!\" Everybody means don't do it. Hey, eh, nah, Lou! Lou just waves.","He paddles out on the ironing board. A mountain of water stands up behind him. He jumps up and slides down the face of it, arms out, ironing board rattling, aloha shirt flapping. He carves left. He carves right. He irons a wrinkle right out of the wave.","He rides it all the way to the sand and steps off dry. The crowd is silent. Lou shrugs. \"What? It's just surfing.\""],"Stand sideways, bend your knees, arms out. \"Heh-eh-NAH-loo!\"","Heʻe means to slide and nalu means wave, so heʻe nalu is wave sliding. You will also see it written as one word, heʻenalu. Heʻe is also the word for octopus.",null,"Old man surfing ironing board on huge wave"],["v122","v",122,"lele kawa","LEH-leh KAH-vah","to jump off a cliff into water","\"LEH-LEH... ka-GUAVA!\"",["At the jump rock, a line of kids waits to leap feet first into the deep water. Then Aunty Florence pushes to the front. She is 71. She is holding a basket of fresh guavas from her yard.","\"Aunty, what are you doing?\" She does not answer. She takes three steps and jumps off the 25-foot cliff, feet first, basket held high over her head, yelling the whole way down, \"LEH-LEH... ka-GUAVA!\" Lele, ka guava! Lele kawa!","She slices into the water feet first, straight as a pencil, with barely a ripple. No splash at all. A second later 30 guavas rain down on everybody like pink hail. Aunty pops up, spits out water and floats on her back eating a guava.","The kids look at each other. Then all 14 of them jump off together, screaming \"LEH-LEH-KAH-VAH!\""],"Hold your nose and jump in place, feet together. \"Leh-leh-KAH-vah!\"","Lele means to jump or to fly. Lele kawa is the feet first leap off a cliff into water, done so cleanly there is almost no splash.",null,"Aunty jumping off cliff with guavas"],["v123","v",123,"ʻauana","ow-AH-nah","to wander, to drift","\"OW! Ah... nah.\"",["Uncle Roy falls asleep on a pool noodle at Waikīkī at 2 in the afternoon. The current does the rest.","He drifts. No plan, no map, no paddle. He bumps into a buoy. There is a little catch in his throat. \"(hic) OW!\"","He opens one eye and looks around. \"Ah... nah.\" Too much work. He closes the eye. Ow! Ah, nah! ʻAuana!","He drifts past Diamond Head. He bumps a surfer. \"OW! Ah, nah.\" He drifts past Hawaiʻi Kai and bumps a buoy full of seabirds. \"OW! Ah, nah.\" He wanders across the whole channel, snoring, one arm dragging in the water.","The next morning he washes up on a beach on Molokaʻi. A fisherman asks how he got there. Uncle scratches his head. \"Ah, nah. I just wandered.\""],"Sway side to side like you are drifting, with a little catch at the start. \"Ow-AH-nah.\"","Hula ʻauana is the modern, free flowing style of hula. The older style is hula kahiko.",null,"Uncle drifting on pool noodle to Molokaʻi"],["v124","v",124,"hoʻokokoke","ho-oh-ko-KO-keh","to come near, to approach","\"HO! OH! Coco-KAY!\"",["You are lying on your towel at the beach. Twenty feet away sits a coconut. Brown, hairy, normal. You close your eyes.","When you open them, the coconut is fifteen feet away. You did not see it move. You close your eyes again. Now it is ten feet away, and it has a face.","You sit up and yell, \"HO! OH!\" The coconut whispers, \"My name is Coco Kay.\" Ho! Oh! Coco-KAY!","You blink. It is five feet away. You blink. Three feet. It comes closer every time you look away, like the scariest game ever, and it is humming.","Finally it is right next to your face. You hold your breath. Coco Kay smiles. \"Sorry. I just wanted some shade.\" It snuggles under your umbrella and falls asleep."],"Slide your hand toward your face, one inch at a time. \"Ho-oh-ko-KO-keh!\"","Kokoke means near. Hoʻokokoke is to get near, to come closer.",null,"Coconut creeping closer on the beach"],["v125","v",125,"hoʻokaʻawale","ho-oh-kah-ah-VAH-leh","to separate, to set apart","\"HO! OH! Cut! Ah... WALLY!\"",["At the school cafeteria there is a lunch man named Wally. Wally believes food should never touch. Ever.","You hand him your plate lunch. Two scoops rice, one scoop mac salad, teri beef. He pulls out tweezers and a tiny ruler.","He separates every grain of rice so it sits apart from the others. He moves the mac salad two inches away and builds a little wall out of a napkin.","Then he separates each macaroni, one by one. The line behind you is now 300 kids long. You finally yell, \"HO! OH! Cut it! Ah... WALLY!\" Ho! Oh! Cut, ah, Wally! Hoʻokaʻawale!","He hands back your plate. Every single thing on it is sealed in its own separate bag. Your lunch took 48 minutes."],"Slide two things on the table far apart. \"Ho-oh-kah-ah-VAH-leh!\"","Kaʻawale means apart or free. Hoʻokaʻawale is to make things apart, to separate them.",null,"Lunch man separating rice with tweezers"],["v126","v",126,"kaʻawale","kah-ah-VAH-leh","to be apart; to be free, available","\"Car? (gulp) Ah! WALLY!\"",["Wally the lunch man from hoʻokaʻawale has a day off, so he goes to Ala Moana Beach on the Fourth of July. There are 10,000 people there. Towels touch towels. Umbrellas touch umbrellas.","There is not one free spot of sand. Except one. Around Wally there is an empty circle 40 feet wide.","Why? Wally brought his lunch, which is a three-week-old fish in a bucket, and he smells exactly like it.","Every family that walks up to the free spot sniffs, gags and backs away. \"Car? (gulp) Ah! WALLY!\" they cry, and run back to their cars. Car, ah, Wally! Kaʻawale!","So Wally sits happily apart from everybody, in the biggest, freest, most available spot on the whole beach. The seagulls do not even land near him."],"Hold your nose and scoot far away. \"Kah-ah-VAH-leh.\"","Kaʻawale also means free or available, like a free seat or a free afternoon. Hoʻokaʻawale is to separate things.",null,"Stinky Wally alone on crowded beach"],["v127","v",127,"hoʻomoe","ho-oh-MO-eh","to lay down, to put to bed","\"HO! OH! Mo... eh.\"",["The giant sleepy cow from moe had a baby. The calf is only two weeks old, but it is already the size of a delivery truck, and it will not go to bed.","You are the babysitter. It is 11 at night. The calf is running laps around the ranch. You grab it around the belly and lift. \"HO!\" Your knees shake. \"OH!\"","You carry it to a crib the size of a swimming pool and lay it down on 300 pillows. The calf blinks. It tries to moo, but it is too sleepy to finish. \"Mo... eh.\" Ho! Oh! Mo... eh! Hoʻomoe!","You tuck a blanket made of 16 bedsheets under its chin. You turn off the light. You lie down on the floor next to the crib, and you fall asleep first."],"Lay an imaginary baby down very gently. \"Ho-oh-MO-eh.\"","Moe is to lie down or sleep yourself. Hoʻomoe is to lay someone else down, like putting a baby to bed.",null,"Tucking giant calf into swimming-pool crib"],["v128","v",128,"hoʻonoho","ho-oh-NO-ho","to seat, to set in place, to install","\"HO! OH! NO! HO!\"",["Santa from noho is back, and this year he is working at the mall. He weighs 600 pounds. Nobody asks why. His big red chair is on a stage three feet high, and he cannot climb up.","So they bring a crane. A real yellow construction crane, 80 feet tall, parked in the middle of the mall. They strap Santa into a harness. The crane lifts him slowly into the air above the food court.","He swings over the kids in line. He waves. \"HO!\" He swings the wrong way. \"OH! NO! HO!\" Ho, oh, no, ho! Hoʻonoho!","It takes 45 minutes to set him in place. The crane lowers him inch by inch until his big bottom lands perfectly on the chair. The workers bolt the chair to the stage so he stays installed. Then he says he needs the restroom."],"Point at a chair and press down with both hands. \"Ho-oh-NO-ho!\"","Noho means to sit or to live somewhere. Hoʻonoho is to make someone sit, or to set something in its place.",null,"Crane lowering Santa onto his chair"],["v129","v",129,"hoʻokomo","ho-oh-KO-mo","to put in, to insert","\"Ho! Oh! COME, OH!\"",["Grandma's purse is black, shiny and small. It is also bottomless. Everything you put in it disappears, and the purse always wants more.","You put in her phone. Fine. The purse clicks open by itself and calls out in a deep voice, \"Come, oh!\" So you put in her umbrella. \"COME, OH!\" You put in a ʻukulele, a rice cooker and a bag of 40 manapua. \"Ho! Oh! COME, OH!\" Hoʻokomo!","Grandma just nods. You put in a surfboard, a folding table, the dog's bed and a cousin who volunteered. You slide in a kayak, one inch at a time. The purse burps.","At church Grandma opens it to find a tissue. She pulls out the cousin. He blinks, waves at the pastor and asks when lunch is."],"Push something into an imaginary bag. \"Ho-oh-KO-mo!\"","Komo means to enter. E komo mai means come in, welcome. Hoʻokomo is to put something in.",null,"Grandma's purse swallowing a kayak"],["v130","v",130,"hoʻopuka","ho-oh-POO-kah","to bring out, to say out loud, to issue","\"HO! OH! From the PUKA!\"",["Uncle Ikaika does magic at every birthday party. His trick is simple. He has a black hat with a puka, a hole, in the bottom. He reaches into the puka and brings things out.","At your 9th birthday he reaches in and yells, \"HO! OH! From the PUKA!\" He pulls out a rabbit. Everybody claps.","He reaches in again. \"Ho! Oh! PUKA!\" He brings out a live pig. Then a lawnmower. Then a 20-foot canoe, still dripping wet.","Every time he pulls something out, he announces it out loud like a radio man. \"A CANOE, ladies and gentlemen!\" The neighbors come over to see.","At the end he reaches in one last time and pulls out your report card, the one you hid under your bed. He reads it out loud to everybody. Worst trick ever."],"Reach into your pocket, pull out your hand and announce it loud. \"Ho-oh-POO-kah!\"","Puka means a hole, and also to come out or appear. Hoʻopuka is to bring something out, including words said out loud.",null,"Uncle pulling a canoe out of a hat"],["v131","v",131,"hoʻihoʻi","ho-ee-HO-ee","to give back, to return something","\"HOY! HOY!\"",["Twenty-six years ago you borrowed one plastic food container from Aunty Momi. You filled it with her chicken long rice, took it home and never gave it back.","Every evening since then, Aunty Momi stands at the end of your street and calls out, \"HOY! HOY!\" like a fisherman calling in a boat. Twenty-six years. Rain or shine. \"Hoy! Hoy!\" Ho-ee! Ho-ee! Hoʻihoʻi!","One day you open your cupboard and find out you did not borrow one container. You borrowed 312. Every family party, every graduation, a little more. So you rent a forklift. You stack them on a pallet eight feet high and drive them down the street.","She counts every single lid. Then she fills them all with food and makes you take them home again."],"Hold out both hands like you are giving something back. \"Ho-ee-HO-ee!\"","Hoʻi is to go back yourself, like going home. Hoʻihoʻi is to send something back where it belongs.",null,"Forklift returning 312 food containers"],["v132","v",132,"hoʻolei","ho-oh-LAY","to throw; to put a lei on someone","\"HO! OH! LEI!\"",["Aunty Gwen greets visitors at the airport, and she is the fastest lei thrower in the Pacific. She does not walk up and place leis on people. She throws them.","The doors open. 200 tourists come out of the gate. Aunty Gwen stands 50 feet back with a mountain of plumeria leis on her arm, like a ring toss champion. \"HO!\" she winds up. \"OH!\" she spins. \"LEI!\" Ho! Oh! Lei! Hoʻolei!","FLING. A lei sails across the room and lands perfectly around a man's neck. FLING. A grandma. FLING. A baby in a stroller. FLING. A pilot. She never misses. She even rings a dog in a pet carrier.","By the end, 200 people are wearing leis and smiling. The security guard is wearing three, because she likes him."],"Toss an invisible lei across the room like a ring toss. \"Ho-oh-LAY!\"","Hoʻolei means to throw anything, and it is also the word for putting a lei on someone.",null,"Aunty ring-tossing leis at the airport"],["v133","v",133,"kau","KOW","to place, to hang up; to get on (a ride)","\"COW!\"",["At the county fair a cow walks up to the Ferris wheel and waits in line like everybody else. She has a ticket in her mouth.","The ride man looks at her. She looks at him. He shrugs.","He places her carefully in the seat, all four legs sticking out the sides. He takes her straw hat and hangs it up on the hook by the ticket booth. Then he yells to the crowd, \"COW!\" Kau! And he pulls the lever.","Up she goes, 90 feet in the air, over the whole fairground. She moos all the way around. The wheel turns 8 times while people take pictures.","When she gets off, she walks over to the hook, takes her hat back and gets right back in line to ride again."],"Hang an invisible hat on a hook. \"KOW!\"","Kau has many meanings. It can also mean a season, like kau wela, the hot season.",null,"Cow riding the Ferris wheel"],["v134","v",134,"hoʻokau","ho-oh-KOW","to put on top of, to impose","\"HO! OH! COW!\"",["The cow from kau is back, and now she works at your office. Your boss thinks this is funny.","Friday, five minutes before quitting time, you are packing up to go home. Your boss rolls in with a forklift. On the forklift is the cow. He sets her right on top of your desk, on top of your keyboard, on top of your 400-page report. \"HO! OH! COW!\" you scream. Ho! Oh! Cow! Hoʻokau!","\"She is your job this weekend,\" he says, and just like that he puts the whole load on you. The desk creaks. The cow chews your sticky notes.","All weekend the cow sits on top of everything you own. Your couch. Your bed. The roof of your car. On Monday you set her on top of your boss's desk. Fair is fair."],"Put your hand flat on top of your head like a heavy load. \"Ho-oh-KOW!\"","Kau is to put something somewhere. Hoʻokau is to put it on top of something, or to put a burden on someone.",null,"Boss setting a cow on your desk"],["v135","v",135,"pili","PEE-lee","to cling, to stick to; to be related","\"PEEL-Y! PEEL-Y!\"",["Your cousin Kekoa is four years old and he clings. To be exact, he clings to your left leg, arms and legs wrapped around it like a sticky octopus.","You try to walk. He comes with you. You try to peel him off like a stuck sticker. \"Peel-y! PEEL-Y!\" He sticks harder. You shake your leg. He laughs. Peel-y! Pili!","You go to the beach. He clings. You go into the water. He clings, snorkeling. At dinner you eat with a 38-pound cousin hanging off your leg under the table.","Finally Aunty says, \"Leave him. He's family.\" That is the other meaning. You are stuck together because you are related. By bedtime he is asleep, still on your leg, snoring."],"Grab your own arm tight and try to peel your hand off. \"PEE-lee!\"","Pili also means close or related, like family. Pili is also the name of the grass that old Hawaiian houses were thatched with.",null,"Little cousin clinging to your leg"],["v136","v",136,"hoʻopili","ho-oh-PEE-lee","to attach; to copy, to imitate","\"HO! OH! PEEL-Y!\"",["A mynah bird lands on your head at the bus stop and attaches itself there. Its claws grip your hair like a sticker. It will not leave.","Worse, it copies you. You say, \"Get off.\" It says, \"Get off.\"","You sneeze. It sneezes. You tug at it and yell, \"HO! OH! PEEL-Y!\" The bird yells back in your exact voice, \"HO! OH! PEEL-Y!\" Hoʻopili!","It copies everything all day. At work your boss asks for the report. The bird says, \"Report? Nah.\"","You get in trouble. At dinner with your crush it repeats your nervous laugh 50 times.","After a week you give up. The bird is part of your look now. People think you are wearing a very realistic hat that does impressions."],"Copy the last thing someone said, in their voice. \"Ho-oh-PEE-lee.\"","Pili is to stick. Hoʻopili is to make something stick, or to copy someone so closely you are stuck to their words.",null,"Mynah on your head copying you"],["v137","v",137,"hāliu","haah-LEE-oo","to turn toward","\"HAAAAH... LEO!\"",["You are at a fancy dinner in a hotel ballroom. 200 people in their best aloha wear, all facing the stage, all bored by a long speech.","Then, in the back of the room, a lion walks in. His name is Leo. Nobody invited him. He sits down at table 14 and opens his mouth in a giant, slow yawn. \"HAAAAAAH...\" Then he burps. \"...LEO!\" Haaah, Leo! Hāliu!","Every head in the room turns. Like a field of sunflowers turning toward the sun, 200 heads swivel slowly away from the stage and toward the lion. The speaker turns. The waiters turn. Even the fish on the buffet turn.","Leo loves it. He yawns again, \"HAAAAH... LEO,\" just to watch the whole room turn toward him one more time."],"Turn your whole head slowly toward the door and hold the first sound. \"Haaah-LEE-oo.\"",null,null,"Ballroom turning toward a yawning lion"],["v138","v",138,"ʻalo","AH-lo","to dodge, to duck","\"(gulp) AH! LOW!\"",["Uncle Walter built a poi machine for the family lūʻau. It was supposed to scoop poi into bowls. Something went wrong. Now it fires poi balls across the yard at 90 miles an hour.","SPLAT. A poi ball hits the tent. SPLAT. One knocks the hat off an aunty. The machine swings toward you. You catch your breath with a little gulp and scream, \"(gulp) AH! LOW!\" You duck. Ah! Low! ʻAlo!","A ball whooshes over your head. You dodge left. You duck under the table. You roll behind the imu. \"AH! LOW!\" The whole family is dodging and ducking now, like the world's stickiest dodgeball game.","Finally Grandma pulls the plug. There is poi on the roof, poi on the dog and poi on the mango tree. You did not get hit once."],"Duck your head fast, with a catch in the throat. \"AH-lo!\"","Careful. Alo, with no ʻokina, means the front or the face, like being in someone's presence. ʻAlo, with the catch, means to dodge.",null,"Dodging poi balls from runaway machine"],["v139","v",139,"ʻaʻe","AH-eh","to step over; to break a rule","\"Ah... (catch) EH!\"",["Tūtū has drawn a white chalk line across the kitchen doorway. The rule is simple. Nobody steps over the line while she is cooking. For 40 years, nobody has.","But the smell of her shoyu chicken is drifting through the door, and you are hungry. You lift one foot. Slowly. Over the line. \"Ah...\" Your foot hangs in the air. There is a catch in your throat. \"...EH!\" Ah, eh! ʻAʻe!","Your toe touches the kitchen floor. Every pot lid in the house rattles. The lights flicker. The dog hides. From the stove, without turning around, Tūtū says, \"I heard that.\"","You step back over the line so fast you fall on the rug. The rule is broken. Your dinner is now mostly rice."],"Lift your foot high and step over an invisible line, with a catch. \"AH-eh!\"","ʻAʻe means both to step over something and to break a rule, which is really stepping over a line.",null,"Foot stepping over Tūtū's chalk line"],["v140","v",140,"ukali","oo-KAH-lee","to follow along, to tag along","\"Ooh... CARLY.\"",["Your cousin Carly is five, and she tags along everywhere you go. Everywhere.","You go to the store. Carly follows two steps behind. You go to the beach. Carly follows, dragging a boogie board twice her size.","You go to your job interview downtown and sit down across from the manager. Carly sits down right next to you in a tiny chair she brought herself.","The manager asks, \"Who is this?\" You sigh. \"Ooh... CARLY.\" Ooh, Carly! Ukali!","You walk into the ocean to get away. Carly follows in goggles. You climb a tree. Carly follows.","You sneak out at 5 in the morning. Carly is already in the car with her seatbelt on.","You get the job. Carly gets a name tag too."],"Walk two steps behind someone, then sigh. \"Oo-KAH-lee.\"","Ukali also means a follower or attendant, like a governor's aide. In modern Hawaiian, ukali is also the word for a satellite, which follows a planet around.",null,"Little cousin tagging along to job interview"],["v141","v",141,"hahai","hah-HAI","to follow, to chase after","\"HA! HI!\"",["At sunrise you find footprints in the sand at Waimānalo. Tiny ones, in a neat line. You decide to follow them.","You follow them past the lifeguard tower. Past a sleeping uncle. Past a family setting up a tent.","The footprints go on and on, three miles down the beach, around a rock and into the bushes. You are sweating now. You have to know.","At the very end of the trail there is a crab. It is wearing tiny slippahs, one on each of its eight feet. It turns around, raises one claw and says, \"HA! HI!\" Ha! Hi! Hahai!","Then it walks off, and you follow it again. Then it follows you back. For the next two hours, a crab and a person follow each other up and down the beach, saying hi."],"Point at the floor and tiptoe like you are following footprints. \"Hah-HAI!\"","Hahai covers both following along and a real chase, even hunting. Hoʻohahai is to lure someone into following you.",null,"Following tiny footprints to a crab"],["v142","v",142,"alualu","ah-loo-AH-loo","to chase, to pursue","\"A LOO! A LOO!\"",["Your family is having a picnic on top of Tantalus. The only restroom is a portable toilet, a big blue plastic box, parked at the edge of the lookout.","Then somebody bumps it. It tips. It starts to roll. Down the road it goes, bouncing and spinning, door flapping open and shut.","The whole family takes off after it. Uncle in his slippahs. Aunty holding a plate of chicken. Grandpa on a skateboard.","\"A LOO! A LOO!\" they scream all the way down the mountain. A loo! A loo! Alualu!","The loo takes 17 hairpin turns. It passes a tour bus and a man on a bike.","The family chases it for 5 miles. At the bottom it rolls gently into a parking stall and stops. Uncle opens the door and goes inside."],"Run in place, pumping your arms. \"Ah-loo-AH-loo!\"","Alualu is also used for running for political office, chasing after votes. Alualu loloa is to keep chasing and never give up.",null,"Family chasing a runaway porta-potty"],["v143","v",143,"hoʻōki","ho-OH-kee","to stop, to put an end to","\"HO! OOOH-KEY!\"",["It is Uncle Clyde's birthday party, and Uncle Clyde found the karaoke machine. He started singing at 6 in the evening. It is now 8 in the morning. He has sung the same love song 211 times.","The neighbors called. The police came, listened and left. The birds outside have learned the words. Uncle's voice sounds like a rusty gate, but he will not stop.","Finally Aunty Leilani walks across the room. She grabs the cord. She holds up her other hand like a crossing guard and yells, \"HO! OOOOOH-KEY!\" Ho! Okey! Hoʻōki! And she pulls the plug.","Silence. Beautiful silence. Everybody cheers. Uncle Clyde stands there with the dead microphone for a long time. Then he starts singing without it."],"Hold up one hand like a crossing guard and stretch the middle. \"Ho-OOOH-kee!\"","Pau means finished. Hoʻōki is when someone makes it stop.",null,"Aunty pulling the karaoke plug"],["v144","v",144,"kūʻē","koo-EH","to oppose, to resist","\"COOOO... (catch) EH!\"",["The city wants to take out the old bench at the park and put in a new one. Nobody asked the pigeons.","The workers show up at 7 in the morning with a truck. On the bench sits one pigeon, a big gray one with a torn ear. It does not move.","The worker says, \"Shoo.\" The pigeon puffs out its chest and says, \"COOOO...\" Then a sharp catch in its throat. \"...EH!\" Coo, eh! Kūʻē!","The worker tries to lift the bench. More pigeons land. 40. 90. 300. They cover the bench, the truck and the worker's hard hat, all puffed up, all going \"COOOO... EH!\" in one angry choir.","By noon the workers give up. The old bench stays. The pigeons hold a meeting on it to celebrate."],"Plant your feet, cross your arms and puff out your chest. \"Kooo-EH!\"","Kūʻē is to stand against something. You hear it at protests, for people standing in opposition.",null,"Pigeons refusing to give up the bench"],["v145","v",145,"hālāwai","haah-laah-VAI","to meet, to have a meeting","\"Haaaah... laaaah... WHY?!\"",["It is Monday at 9 in the morning. Your boss has called a meeting. It is about the stapler.","There are 14 people around the table. The meeting has slides. 86 slides. Slide 12 is a photo of the stapler. Slide 13 is the same photo, closer.","By hour two, everybody is yawning long, loud, slow yawns. \"Haaaah...\" Somebody else. \"...Laaaah...\" Then from the back of the room one voice cries out what everybody is thinking. \"WHY?!\" Haaah! Laaah! Why! Hālāwai!","The boss says you will all meet again tomorrow to discuss why. By Friday you have had 11 meetings about the stapler. On Saturday the stapler quits."],"Yawn two long yawns, then throw your hands in the air. \"Haaah-laaah-VAI!\"","The same word is also a noun. A meeting at work is a hālāwai.",null,"Office yawning through a stapler meeting"],["v146","v",146,"kipa","KEE-pah","to visit, to drop by","\"Ma! It's the KEEPAH!\"",["Your doorbell rings on a Sunday afternoon. It is the zookeeper. Nobody knows how he got your address.","He is just dropping by for a visit, he says. He brought a friend. The friend is an elephant. The elephant is holding a plate of cookies.","You yell back into the house, \"Ma! It's the KEEPAH!\" Keepah! Kipa! Ma yells back, \"Tell him take off his shoes!\" So the keeper takes off his shoes. The elephant takes off four giant slippahs.","They stay for two hours. The keeper drinks coffee and talks about the weather. The elephant sits on the lanai, which is now a little lower. When they leave, the keeper says, \"Same time next week?\" He means it."],"Knock twice on the table like you are dropping by. \"KEE-pah!\"","Kipa is a quick visit. Hoʻokipa is when you are the one hosting the visitors.",null,"Zookeeper and elephant visiting on Sunday"],["v147","v",147,"hoʻokipa","ho-oh-KEE-pah","to host, to welcome guests","\"HO! OH! Welcome to the KEEPAH'S!\"",["The zookeeper from kipa decides it is his turn to host. He invites everybody to his house for a lūʻau. He means everybody.","You arrive and he is standing at the gate with an armful of leis, greeting each guest. \"HO! OH! Welcome to the KEEPAH'S!\" Ho, oh, keepah! Hoʻokipa!","Behind you come the other guests. The elephant from last week. Two giraffes, ducking under the tent.","A family of flamingos. 16 tortoises. A hippo who brought potato salad. The keeper puts a lei on every single one.","He brings every guest a plate. He refills every drink. He even gives the hippo seconds. At midnight he stands at the gate and waves as each animal goes home, telling every one of them to come back soon."],"Open your arms wide like you are standing at the front door. \"Ho-oh-KEE-pah!\"","Hoʻokipa is the island spirit of hospitality. There is also a famous windsurfing beach on Maui called Hoʻokipa.",null,"Zookeeper hosting a lūʻau for animals"],["v148","v",148,"noi","NOY","to ask for, to request","\"You are so a-NOY-ing!\"",["You take your nephew Bronson to the drugstore for one thing. Toothpaste.","He starts asking the second you walk in. \"Can I get gum? The robot? The pool float shaped like a shark? The big bag of li hing mui?\"","He asks for things in every aisle. He asks the cashier. He asks a lady who does not even work there.","By aisle 9 he has asked for 214 things. You are about to explode. You turn around and hiss, \"You are so a-NOY-ing!\" Annoy! Noi!","He looks up at you with big eyes and asks for one more thing. \"Can I have a hug?\" You give him the hug. Then he asks for the shark float again."],"Hold out your hand, palm up, and ask. \"NOY!\"","When you ask for something, add \"e ʻoluʻolu,\" which means please.",null,"Kid asking for everything in the store"],["v149","v",149,"kono","KO-no","to invite","\"A cone? OH!\"",["Aunty Tessie does not mail her invitations. She sends them in ice cream cones.","One day a delivery man hands you a waffle cone with a scoop of lychee sherbet. Written on the sherbet in chocolate is PARTY SATURDAY 5 PM BRING ICE. You stare at it. \"A cone? OH!\" Cone, oh! Kono!","You want to say you are busy. But the only way to say no is to not eat the cone, and it is already melting down your arm. So you eat it. Now you are going.","She invites 300 people this way. Cones arrive at offices, schools and one fire station. On Saturday the whole island shows up, sticky, happy and carrying ice. Nobody has ever turned her down."],"Hold out an imaginary ice cream cone to a friend. \"KO-no!\"",null,null,"Party invitation written on ice cream"],["v150","v",150,"hōʻike","hoh-EE-keh","to show, to reveal, to demonstrate","\"HOOOO! EEK! EH!\"",["It is show and tell in the third grade class. The first kid shows a shell. The second shows a rock.","Then Kaleo walks up with something under a bedsheet. It is six feet tall and it is humming.","He pulls off the sheet. It is a volcano. He built it himself, and it is smoking.","The class leans in. Kaleo presses a button.","BOOM. Red goo shoots up to the ceiling. The whole class screams, \"HOOOO! EEK! EH!\" Hoooo, eek, eh! Hōʻike! The goo rains down on the desks, the goldfish tank and the teacher's glasses.","When it stops, Kaleo bows. \"That,\" he says, \"is my demonstration.\" He gets an A. The janitor gets a raise."],"Whip off an invisible sheet and reveal what is under it. \"Hooo-EE-keh!\"","Hōʻike also means a test or a recital, a time to show what you know. ʻIke means to see or to know.",null,"Kid revealing an erupting volcano"],["v151","v",151,"hoʻolaha","ho-oh-LAH-hah","to announce, to advertise","\"HO! OH! LAAAA-HAAAA!\"",["Aunty Rosalind works at the grocery store, and today she finally gets to use the loudspeaker. She used to sing opera. She has been waiting 20 years for this.","She grabs the microphone. \"HO! OH!\" The whole store stops. Then she sings the announcement at the top of her lungs. \"SPAM IS ON SALE IN AISLE SIIIX! LAAAA-HAAAAAA!\" Ho, oh, la-ha! Hoʻolaha!","The windows shake. The produce misters turn on by themselves. Her voice rolls out the door, across the parking lot and down the whole street. Drivers on the freeway hear it and take the next exit.","In 10 minutes there are 800 people in aisle six. By closing time she has announced sales on rice, eggs and slippahs, and the store has no windows left."],"Cup your hands around your mouth and sing it out. \"Ho-oh-LAH-hah!\"","Hoʻolaha is also the word for an ad or a notice. Laha means to spread, so an announcement makes news spread.",null,"Opera aunty announcing sale over loudspeaker"],["v152","v",152,"laha","LAH-hah","to spread, to be widespread","\"LA-HA!\"",["It is the quietest moment of the big football game. 30,000 fans are holding their breath. Then one man in section 12 laughs. \"LA-HA!\"","Nobody knows why. But the lady next to him catches it. \"La-ha!\" Then her whole row. \"LA-HA! LA-HA!\" It spreads across section 12, then 13, then 14, then all the way around the stadium like a wave. La-ha! Laha!","The players start laughing. The referees laugh so hard they drop their flags. The laugh spreads out the gates into the parking lot, where the tailgaters catch it too.","By 9 at night it has spread to Pearl City. By midnight people are laughing in Kona. The next morning the news says it is everywhere. It all started with one \"La-ha!\""],"Laugh twice and point at the person next to you so they catch it. \"LAH-hah!\"","Laha is to spread out, like news or a cold going around. Hoʻolaha is to make news spread, to announce it.",null,"A laugh spreading across a stadium"],["v153","v",153,"hohola","ho-HO-lah","to spread out, to unroll","\"Ho... HOLA!\"",["Uncle Ben bought a new beach mat at the swap meet. It is rolled up tight, about the size of a paper towel roll. He sets it on the sand at Kaimana Beach and gives it a little push.","It unrolls. And unrolls. And keeps unrolling. It rolls down the whole beach, past the hotels, over sandcastles. It rolls across Kalākaua Avenue and stops traffic. It keeps going for three miles.","The whole family runs after it. At the very end it finally spreads out flat, right at the feet of a tourist from Spain eating a malasada. He looks at the mat. He looks at the 40 people running toward him. He waves. \"Ho... HOLA!\" Ho, hola! Hohola!","Uncle now owns the biggest beach mat in Hawaiʻi. It takes 9 hours to roll it back up."],"Push both hands forward like you are unrolling a mat. \"Ho-HO-lah!\"",null,null,"Beach mat unrolling three miles long"],["v154","v",154,"pelu","PEH-loo","to fold","\"Pay, LOU!\"",["Lou the ironing board surfer from heʻe nalu has retired. Now he runs a folding shop. He folds anything, for a price.","You bring him a fitted sheet, the kind nobody on Earth can fold. Lou folds it into a perfect square in 4 seconds. You say, \"Wow.\" He holds out his hand. \"Pay Lou.\" Pay, Lou! Pelu!","The line behind you is long. A lady brings a tent, and Lou folds it into a wallet. A man brings a map of the whole island, and Lou folds it into a paper crane that flies away.","A guy drives up in a pickup truck. Lou folds the truck in half, then in half again, and hands it back the size of a lunch box. Every time, he holds out his hand. \"Pay Lou.\" Nobody argues. Nobody wants to get folded."],"Fold a piece of paper in half and hold out your hand. \"PEH-loo!\"",null,null,"Lou folding a pickup truck"],["v155","v",155,"ʻōwili","oh-VEE-lee","to roll up","\"Ohhhhh... WILLY!\"",["It is sushi night at your friend Willy's house. Willy wants to make the world's biggest sushi roll. He buys a sheet of nori as big as a garage door and lays it on the lawn.","He spreads 200 pounds of rice on it. He adds cucumber, crab, egg and a whole row of spam. Then he lies down on top to press it flat.","He is still lying there when his three cousins start to roll it up. They roll. And roll. Willy disappears inside. His head sticks out one end and his feet stick out the other. You catch your breath and gasp, long and slow, \"Ohhhhh... WILLY!\" Oh, Willy! ʻŌwili!","They slice the roll into pieces for 60 guests. Very carefully. Around Willy."],"Roll your hands over each other like rolling up a mat. \"Ohhh-VEE-lee!\"","ʻŌwili is rolling something up into a bundle, like a mat or a sleeping bag. Wili is twisting or winding.",null,"Willy rolled inside giant sushi roll"],["v156","v",156,"wili","VEE-lee","to wind, to twist, to grind","\"WILLY! WILLY!\"",["Willy from ʻōwili has just been unrolled from the sushi, and he is so dizzy he cannot stop spinning.","He spins on the spot. Faster. Faster. His body twists up like a wet towel being wrung out.","His arms wind around his body three times. His legs wind around each other. He looks like a giant corkscrew with a head.","The cousins yell, \"WILLY! WILLY!\" but he is spinning too fast to hear. Willy! Wili! He drills down into the lawn and grinds a hole 6 feet deep.","Aunty is smart. She drops a bag of coffee beans into the hole. Willy grinds them into perfect coffee in 30 seconds. She scoops it up and makes coffee for everybody. Willy finally stops, twisted, dizzy and very proud."],"Twist an invisible jar lid round and round. \"VEE-lee!\"","A lei wili is made by winding leaves or flowers around each other instead of stringing them, like a maile lei. Do not mix up wili, to twist, with kāwili, to mix.",null,"Spinning Willy grinding coffee in the ground"],["v157","v",157,"hili","HEE-lee","to braid, to twist","\"HILLY!\"",["Tūtū Hattie has not cut her hair since 1961. It is gray, it is shiny and it is 2 miles long. Every morning it has to be braided.","She sits on her porch at the bottom of the mountain road. Her hair runs all the way up the hilly road behind her, around 14 curves, over 3 hills and down the other side. Three grandkids stand along the road twisting it together. Over, under, over, under.","Cars drive by and honk. A tourist leans out the window and yells, \"Why is this road so HILLY?\" The grandkids yell back, \"It's not the road! It's her HAIR!\" Hilly! Hili!","It takes 5 hours. The finished braid is so thick that birds nest in it. At night Tūtū coils it up in the yard like a giant rope and sleeps with her feet on it."],"Braid three fingers together, over and under. \"HEE-lee.\"","A lei hili is a braided lei, often made with ferns.",null,"Grandkids braiding Tūtū's two-mile hair"],["v158","v",158,"ulana","oo-LAH-nah","to weave","\"Ooooh... LANA!\"",["A spider named Lana moves in under an overpass on the H-1. She is the size of a dinner plate and she is an artist.","One night she starts weaving. Over, under, over, under. By morning her web stretches across all six lanes of the freeway. It has a pattern like a lauhala mat, with little flowers woven in.","The morning traffic stops. Hundreds of drivers get out of their cars to look. Nobody is mad. They all say the same thing. \"Ooooh... LANA!\" Ooh, Lana! Ulana!","Lana keeps weaving. She weaves a little welcome sign. She weaves a hammock for a tired commuter. By noon the city puts up a sign that says SLOW, WEAVING AHEAD, and everybody takes the back roads."],"Weave your fingers over and under each other. \"Oo-LAH-nah.\"","Ulana lauhala is weaving mats, hats and baskets from hala leaves.",null,"Spider weaving a web across H-1"],["v159","v",159,"humu","HOO-moo","to sew","\"HUMMM... ooo.\"",["Grandma's sewing machine is 70 years old, and it is loud. When she turns it on, it hums so deep the whole house shakes. \"HUMMM... ooo. HUMMM... ooo.\" Hum, ooo! Humu!","This week she is sewing a muʻumuʻu for the biggest wedding in family history. The bride wants one dress so big the whole family can wear it at the same time.","Grandma sews for five days straight. The needle goes up and down 1,000 times a minute.","Flowered fabric pours off the table, out the window and across the yard. The neighbors think it is an earthquake. The dog hums along.","At the wedding, 43 relatives stand inside one giant muʻumuʻu, heads poking out of 43 holes, humming together. Grandma cries into her tissue. \"HUMMM... ooo.\""],"Push fabric through an invisible sewing machine and hum deep. \"HOO-moo.\"",null,null,"Grandma sewing one giant family muʻumuʻu"],["v160","v",160,"kui","KOO-ee","to string (a lei), to thread","\"GOOEY!\"",["Aunty Noe has to string a lei for every graduate at the high school. That is 5,000 plumerias, and her lei needle is as long as a broom handle.","She pokes the needle through the middle of the first flower. White sap oozes out all over her fingers. \"GOOEY!\" she says. She threads the next one. \"GOOEY!\" Gooey! Kui!","She strings flowers all day on the lanai. Her fingers are sticky. Her arms are sticky. Her hair is stuck to the needle.","By sunset she has strung one lei that is 400 feet long. It wraps around the house twice.","At graduation she cuts it into pieces and gives one to every kid. She puts the extra 30 feet on the principal. She is still sticky on Tuesday."],"Push an invisible needle through a flower. \"KOO-ee!\"","Careful. Kui, smooth, is to string a lei. Kuʻi, with the catch, is to pound, like pounding poi.",null,"Aunty stringing plumerias with a giant needle"],["v161","v",161,"hoʻonani","ho-oh-NAH-nee","to beautify, to glorify","\"HO! OH! NANNY!\"",["Your family hires a nanny. She is five feet tall and carries a glitter cannon on her back. She believes everything should be beautiful.","On the first day she walks into the kitchen and sees a dirty pot. She yells \"HO! OH!\" and fires the glitter cannon. The pot sparkles. She finds the garbage can. HO! OH! Now it has pink flowers painted on the side.","She finds Dad asleep on the couch in his old shorts. HO! OH! He wakes up in a tuxedo with a flower behind his ear. The whole family runs around yelling, \"HO! OH! NANNY!\" Ho, oh, nanny! Hoʻonani!","By Friday she has made the garbage truck look like a parade float. The street is so beautiful the mail carrier cries."],"Sprinkle glitter over everything with both hands. \"Ho-oh-NAH-nee!\"","Nani means beautiful. Hoʻonani is to make something beautiful, and also to praise or glorify.",null,"Nanny with glitter cannon beautifying Dad"],["v162","v",162,"kāhiko","kaah-HEE-ko","to dress up, to wear finery","\"Caaaar... GEE-ko!\"",["You wake up on the morning of the Christmas parade and walk out to your car. It is not your car anymore.","Overnight, it got all dressed up in finery. There are 800 plastic flowers glued to the hood. There are 90 strings of lights. There is a disco ball hanging from the mirror and a pink feather boa around every tire.","On the roof stands a gecko. He is wearing a tiny tuxedo, a bow tie and a sequin hat. He is dressed up for the parade too. You stare at him and stretch out the first sound. \"Caaaar... GEE-ko!\" Caaar, gecko! Kāhiko!","You drive in the parade. You win first prize. The gecko rides on the dashboard, waving at the crowd, taking all the credit."],"Straighten an invisible bow tie and hold the first sound. \"Kaaah-HEE-ko!\"","Do not mix it up with kahiko, no long vowel, which means old or ancient, like hula kahiko. Kāhiko, with the long ā, is dressing up.",null,"Gecko in tuxedo on dressed-up car"],["v163","v",163,"ʻaʻahu","ah-AH-hoo","to get dressed, to put on clothes","\"Ah! (catch) AH! WHO is that?\"",["Your family goes to see snow for the first time. You land on the continent and it is 5 degrees outside. Nobody owns a coat.","So Dad makes everybody put on every piece of clothing in the suitcases. Three t-shirts. Two aloha shirts. Four pairs of shorts over one pair of jeans. Socks on your hands and a beach towel for a scarf. Grandma wears six muʻumuʻus, one on top of the other.","You walk out of the airport looking like a pile of laundry with eyes. Mom looks around and gasps with a catch in her throat. \"Ah! (catch) AH! WHO is that?\" Ah! Ah! Who! ʻAʻahu!","It is Dad. He is wearing 19 layers. He cannot bend his arms. He tips over in the snow and has to be rolled to the car like a snowball."],"Pull an invisible shirt over your head, with a catch. \"Ah-AH-hoo!\"","ʻAʻahu is also the noun for clothing or a garment.",null,"Family wearing every piece of clothing in snow"],["v164","v",164,"ʻānai","aah-NAI","to rub, to scrub","\"(sigh) Aaaaah... NICE!\"",["Uncle Gordon has not showered since the canoe race. Nine days. He smells like fish, sunscreen and old rubber slippahs. The family drives him to the car wash.","He stands in the middle of the car wash in his swim shorts. The giant spinning brushes come at him.","They scrub his back. They rub his belly. They scrub behind his ears. Soap flies everywhere.","Uncle closes his eyes, catches his breath and lets out one long happy sigh. \"Aaaaaah...\" Then he grins. \"...NICE!\" Aaah, nice! ʻĀnai!","The brushes scrub so hard they rub off three layers of dirt, a tattoo that turned out to be marker and some of his eyebrows. He comes out shiny as a new truck. He pays extra for the wax."],"Scrub your forearm hard with the other hand. \"Aaah-NAI!\"",null,null,"Uncle getting scrubbed in a car wash"],["v165","v",165,"kāwili","kaah-VEE-lee","to mix, to blend","\"Caaaar... WHEELIE!\"",["There is a cement mixer truck on the H-1, but it is not full of cement. Aunty Josie rented it for the family party. It is full of mango, guava, pineapple, poi, ice cream and three whole papayas.","The drum spins, mixing and blending, round and round. Everything turns into one giant orange smoothie. But Aunty wants it smoother.","She hits the gas. The truck goes faster and the drum spins faster.","The front wheels lift off the road. The whole truck pops a wheelie down the freeway. People in other cars point and yell, \"Caaaar... WHEELIE!\" Caaar, wheelie! Kāwili!","She pulls into the party still on two wheels. She opens the chute and pours out 400 cups of perfectly mixed smoothie. The line goes around the block."],"Stir an invisible bowl fast, then lift your front wheels up. \"Kaaah-VEE-lee!\"","Kāwili is mixing things together. Wili, without the kā, is twisting or winding.",null,"Smoothie mixer truck popping a wheelie"],["v166","v",166,"hoʻomoʻa","ho-oh-MO-ah","to cook, to heat up","\"HO! OH! MO... (catch) AH!\"",["Uncle Kalani's oven is broken, and he has a chicken to cook for dinner. So he wraps the chicken in foil, straps it to the engine of his old truck and drives around the island.","He drives from Kāneʻohe to Haleʻiwa and back. The engine gets hotter.","At every stoplight he jumps out, opens the hood, pokes the chicken and yells, \"HO! OH! MO... AH!\" with a catch in the middle. Ho, oh, mo, ah! Hoʻomoʻa!","By Kailua it smells so good that three cars follow him home. People roll down their windows and sniff.","He pulls into his driveway, pops the hood, and the chicken is cooked perfectly, crispy on the outside and juicy inside. He serves it to the whole block. It tastes a little like motor oil. Nobody complains."],"Poke an imaginary chicken with a fork. \"Ho-oh-MO-ah!\"","Moa means chicken. Moʻa, with the catch, means cooked. So hoʻomoʻa is to make something cooked.",null,"Chicken cooking on a truck engine"],["v167","v",167,"kālua","kaah-LOO-ah","to bake in an underground oven (imu)","\"Caaall... LUA!\"",["Your family has a dog named Lua. Lua is a digger. She has dug 300 holes in the yard, and your dad is tired of it.","Then comes the graduation lūʻau, and Uncle needs an imu, an underground oven, big enough for a whole pig. Nobody wants to dig. Uncle stands in the middle of the yard and yells, \"Caaall... LUA!\" Caaall, Lua! Kālua!","Lua comes running, ears flapping. She digs. Dirt flies over the fence. In 10 minutes the pit is 6 feet deep and perfectly round. Uncle fills it with hot rocks and banana leaves, lays in the pig, covers it up and lets it cook all night.","The next day the pig comes out smoky, soft and falling apart. Everybody eats. Lua gets the biggest plate, and she buries half of it for later."],"Pretend to dig a hole, then pat the dirt down on top. \"Kaaah-LOO-ah!\"","Kālua pig is pork baked in an imu until it falls apart. You can kālua other foods too, like turkey or sweet potato.",null,"Dog named Lua digging an imu"],["v168","v",168,"pūlehu","poo-LEH-hoo","to broil over hot coals","\"POOOOL... EH? WHO did this?\"",["The hotel pool has been drained for repairs. Uncle Frank sees an opportunity.","Overnight, he fills the whole empty swimming pool with kiawe charcoal. 6,000 pounds of it. By morning the coals are glowing orange from the shallow end to the deep end. He lays a giant metal grill across the top and puts on 400 steaks and 90 sweet potatoes.","Smoke rises into the sky. The lifeguard shows up for work, stares at the pool and yells, \"POOOOL... EH? WHO did this?\" Poool, eh, who? Pūlehu!","Uncle flips a steak with a canoe paddle. \"Broiling,\" he says. The lifeguard thinks about it for 3 seconds. Then he grabs a plate."],"Flip an imaginary steak over hot coals and hold the first sound. \"Poooo-LEH-hoo!\"","Traditionally pūlehu meant roasting foods like sweet potato, breadfruit or banana right on hot embers. Today you will also see pūlehu steak and ribs at local parties.",null,"Uncle grilling steaks in empty pool"],["v169","v",169,"palai","pah-LAI","to fry","\"Pa... LIE!\"",["Pa loves to fry. And Pa lies about it.","You come home and the TV remote is golden brown and crispy. \"Pa, did you fry the remote?\" Pa shakes his head. \"No.\" You point at him and shout, \"Pa... LIE!\" Pa, lie! Palai!","The next day the mail is fried. The dog's chew toy is fried. The newspaper is in tempura batter.","There is a whole fried pineapple on the table like a trophy, and Pa is standing next to it with a spatula and oil on his shirt. \"I don't know who did this.\"","\"PA, LIE!\" the whole family yells. By Friday he has fried a slippah, a ʻukulele and your homework. The homework actually tastes pretty good with ketchup."],"Shake an invisible frying pan. \"Pah-LAI!\"","Palai is also the name of a native Hawaiian lace fern.",null,"Pa lying next to a fried remote"],["v170","v",170,"hoʻolapalapa","ho-oh-lah-pah-LAH-pah","to boil","\"HO! OH! LAPA LAPA!\"",["Grandma is boiling peanuts in the backyard. Her pot is not a pot. It is an old hot tub.","She fills it with water, salt, star anise and 900 pounds of peanuts, and she lights a fire under it. At first nothing happens. Then little bubbles come up and pop with a tiny sound. \"Lapa... lapa...\" Then bigger bubbles. \"LAPA! LAPA!\"","Now the whole tub is boiling hard, bubbles the size of beach balls popping and splashing. Grandma stands over it with a canoe paddle, stirring and yelling, \"HO! OH! LAPA LAPA!\" Ho, oh, lapa lapa! Hoʻolapalapa!","A wave of boiling water sloshes over the side and cooks the grass. By dinner the peanuts are perfect. The whole neighborhood lines up with bags, and the yard smells like peanuts for a year."],"Wiggle your fingers up from the table like bubbles rising. \"Ho-oh-lah-pah-LAH-pah!\"","Lapalapa is the bubbling itself. Hoʻolapalapa is to make it bubble, to boil it.",null,"Grandma boiling peanuts in a hot tub"],["v171","v",171,"kaha","KAH-hah","to draw a line, to mark; to slice open","\"KA... HAH!\"",["The fish market has a new worker. He is a karate master in a white uniform and a black belt.","A fisherman brings in a 60-pound ʻahi. The master bows to it. He raises one hand high. \"KA...\" he says quietly.","Then he chops down. \"...HAH!\" Ka-HAH! Kaha! The ʻahi slices open, clean and straight, right down the middle.","The crowd gasps. He does it again with a mahimahi. KA-HAH! Then he draws a line in the sawdust on the floor with one finger, perfectly straight, and says, \"Line starts here.\" KA-HAH!","Soon he is marking the price on each fish with one karate chop. The line of customers goes out the door and down the street. Everybody wants their fish opened with a yell."],"Karate chop the air in one straight line. \"KAH-hah!\"","Kaha is to draw a line or mark, and also to cut open, like a fish. Kaha kiʻi means to draw a picture.",null,"Karate master slicing an ʻahi"],["v172","v",172,"helu","HEH-loo","to count","\"HEL-LOO! One!\"",["The new store greeter is a man named Mr. Bill, and he takes his job very seriously. He counts every customer who walks through the door, and he says hello to each one.","\"HEL-LOO! One!\" \"HEL-LOO! Two!\" \"HEL-LOO! Three!\" Hello! Helu! By lunchtime he is at 2,400. He does not stop to eat.","A tour bus pulls up and 60 people get off at once. He counts every one, so fast he sounds like a woodpecker. \"Hel-loo-hel-loo-hel-loo!\"","A pigeon walks in. He counts the pigeon. A gecko runs in. He counts the gecko.","At closing time he stands at the door and announces the total. \"8,812.\" Then someone walks out, and he counts backward. He is still out there at midnight, counting the lights in the parking lot."],"Point at things around you and count them. \"HEH-loo!\"","Helu also means a number. Your phone number is your helu kelepona.",null,"Store greeter counting every customer"],["v173","v",173,"hoʻohui","ho-oh-HOO-ee","to add, to join together","\"HO! OH! HOOEY!\"",["It is the big family reunion at the park, and the cousins want to build the tallest human tower in Hawaiʻi.","The biggest uncle stands at the bottom. The next cousin climbs onto his shoulders and yells, \"HO! OH! HOOEY!\" Another cousin joins. \"HO! OH! HOOEY!\" Ho, oh, hooey! Hoʻohui! Every person who joins adds another level to the tower.","10 cousins. 20. 31. The tower is taller than the banyan tree. It sways in the wind. The tiniest cousin climbs all the way up and adds herself to the very top, and the whole tower cheers, \"HOOEY!\"","Then Grandma adds one plate of chicken to the top cousin's hands, and the whole thing wobbles. They add, they join, they hold. They do not fall. For about 8 seconds."],"Clap your hands together, like joining two things. \"Ho-oh-HOO-ee!\"","Hui is a club or a group, or to join. Huʻi, with the catch, is an ache or a chill. Hoʻohui is to put things together or add them up.",null,"Cousins joining into a giant human tower"],["v174","v",174,"hoʻolilo","ho-oh-LEE-lo","to spend; to turn into","\"Ho! Oh! LEEEE... low.\"",["It is Saturday at the swap meet and you have 100 dollars. You feel rich. Your voice is high and happy. \"Ho! Oh! LEEEEE!\"","You spend 20 on a hat. You spend 15 on a coconut with a face painted on it. You spend 30 on a lamp shaped like a fish.","Every time you spend, the money in your pocket gets lower, and so does your voice. \"Leeee... low.\" Ho, oh, lee, low! Hoʻolilo!","By noon you have 3 dollars left. Your voice is so low it sounds like a foghorn. \"LOOOOOW.\"","Then you catch yourself in a mirror at one of the booths. You have turned into a totally different person. Fish lamp. Coconut face. Hat with a propeller on top. You spent everything, and it turned you into a swap meet uncle."],"Slide your voice from high to low while you count out invisible money. \"Ho-oh-LEE-lo.\"","Hoʻolilo is to make something gone, like spending money, or to turn something into something else. Lilo is being gone, or becoming.",null,"Spending money at swap meet, voice dropping"],["v175","v",175,"lilo","LEE-lo","to be gone, to be taken; to become","\"LEEEEE... looooow.\"",["You leave your favorite slippahs on the bus seat. You notice the second the bus pulls away.","You run after it barefoot. The bus honks its horn, and the sound fades away down the street like a sad whistle. \"LEEEEE...\" It turns the corner. \"...looooow.\" Lee, low. Lilo! Gone.","You stand on the hot sidewalk at 2 in the afternoon, hopping from foot to foot like a frog. The slippahs are gone. Taken. On a trip around the island without you.","Three weeks later you see the same bus. The driver is wearing your slippahs. They have become his lucky slippahs now.","He honks, \"LEEEE... looow,\" waves and drives off. They are gone for good, and they have become somebody else's."],"Wave goodbye as your voice fades from high to low. \"LEE-lo.\"","Lilo is used when something is lost or taken, and also when something becomes something new. Compare hoʻolilo, to spend or to turn into.",null,"Bus driving away with your slippahs"],["v176","v",176,"hūnā","hoo-NAAH","to hide something, to conceal","\"Hoo? NAAAAH.\"",["There is one spam musubi left on the plate at the party. Then there are zero. Everybody turns to look at Uncle Kimo.","Uncle Kimo is standing very still. His left cheek is huge, the size of a softball. A little corner of nori is poking out of his mouth.","Aunty points at him. \"Who took the musubi?\" Uncle Kimo shakes his head slowly and says, through a full mouth, \"Hoo? NAAAAAH.\" Who? Nah! Hūnā!","The kids check his pockets. Three more musubi. They check his hat. Two more.","They check his slippahs. One more, a little flat. He has hidden 11 musubi on his body.","Still he says, \"Hooo? Naaaaah.\" Nobody believes him, but nobody can prove it, because he eats the evidence."],"Hide something behind your back and shake your head slowly. \"Hoo-NAAAH.\"",null,null,"Uncle hiding a musubi in his cheek"],["v177","v",177,"hoʻomaʻamaʻa","ho-oh-mah-ah-MAH-ah","to practice, to get used to","\"Ma. (catch) Ah. Ma. (catch) Ah.\"",["Baby Leilani is ten months old, and she has decided today is the day she says her first word. She will practice until she gets it right.","She sits in her high chair and concentrates. \"Ma.\" A tiny catch in her throat. \"Ah.\" Again. \"Ma... ah. Ma... ah.\" Her big brother cheers every try. \"HO! OH!\" Ho, oh, ma, ah, ma, ah! Hoʻomaʻamaʻa!","She practices all morning. She practices through lunch with rice on her face. She practices at the beach, at the store and in the bath.","By the end of the week she has said \"Ma-ah\" 10,000 times. Her voice is strong. She sounds like a little coach.","Finally her mom walks in the door. Baby Leilani looks right at her, takes a big breath and says, perfectly, \"DAD.\" All that practice."],"Say it slowly five times in a row, like you are practicing. \"Ho-oh-mah-ah-MAH-ah.\"","Maʻa means used to it. Hoʻomaʻamaʻa is doing something over and over until you are used to it.",null,"Baby practicing ma-ah in high chair"],["v178","v",178,"maʻa","MAH-ah","to be used to, to be accustomed","\"MA!\" \"(catch) Ah.\"",["Your mom has 11 kids, 4 dogs and a pet chicken. Nothing surprises her anymore. She is used to it.","The ceiling fan falls. She sips her tea. The twins ride the dogs through the kitchen. She turns the page of her magazine.","Your brother sets the toaster on fire. She hands him the extinguisher without looking up.","You run in screaming, \"MA!\" She raises one eyebrow. There is a little catch in her throat. \"Ah.\" Ma! Ah. Maʻa.","\"MA! THE CAR IS IN THE POOL!\" \"Ah.\" \"MA! GRANDPA IS ON THE ROOF!\" \"Ah.\" \"MA! THERE IS A PIG IN YOUR BED!\" She thinks about it. \"Ah.\"","She has heard it all before, 10,000 times. At this point she would be surprised if nothing happened."],"Shrug and sip your drink like nothing could ever surprise you. \"MAH-ah.\"","Maʻa is being used to something. Hoʻomaʻamaʻa is practicing until you get used to it.",null,"Calm mom sipping tea in total chaos"],["v179","v",179,"hoʻoikaika","ho-oh-ee-KAI-kah","to strengthen; to try hard","\"HO! OH! EEE! KAI! KAH!\"",["Uncle Pono is the skinniest man in Waiʻanae. His arms look like two chopsticks. But he has decided he will lift his own canoe over his head by summer.","Every morning he trains on the beach. He grabs a coconut and lifts it. \"HO! OH! EEE! KAI! KAH!\" Ho, oh, ee, kai, kah! Hoʻoikaika! He grunts so loud the fish swim away.","He lifts a bucket of sand. He lifts a cooler. He lifts his neighbor, who did not agree to this.","He tries hard every single day for 190 days. His arms grow. His legs grow. His grunt gets deeper.","On the first day of summer he grabs the canoe, all 400 pounds of it, and lifts it over his head. The whole beach cheers. Then he carries it into the ocean and goes fishing."],"Flex both arms and grunt out every sound. \"Ho-oh-ee-KAI-kah!\"","Ikaika means strong. Hoʻoikaika is to make strong, and people also say it to mean try hard, keep going.",null,"Skinny uncle lifting a canoe overhead"],["v180","v",180,"hoʻonui","ho-oh-NOO-ee","to enlarge, to increase","\"HO! OH! NOOO-EEE!\"",["Your cousin builds a machine in his garage that makes things bigger. It has a funnel on one end and a door on the other, and when it runs it groans, \"NOOO-EEE.\"","He drops in a malasada. The machine shakes. \"HO! OH! NOOO-EEE!\" Ho, oh, nui! Hoʻonui! Out rolls a malasada the size of a car tire. He drops in a gecko. Out comes a gecko the size of a dog, and it licks your face.","Everybody gets excited. You put in a shave ice, and out comes a snow mountain. You put in a dollar, and out comes a dollar the size of a bedsheet that no store will take.","Then the machine accidentally makes itself bigger. \"NOOOO-EEEE!\" It grows right through the roof. Now the whole garage is the machine, and you live inside it."],"Stretch your hands apart, wider and wider. \"Ho-oh-NOO-ee!\"","Nui means big. Hoʻonui is to make bigger. The opposite is hoʻēmi, to make smaller.",null,"Machine making a giant malasada"],["v181","v",181,"hoʻēmi","ho-EH-mee","to reduce, to cut down","\"HO! EHHH? ME?\"",["You order a plate lunch at your favorite lunch wagon. Two scoops rice, one scoop mac, chicken katsu. The same thing you have ordered every day for 9 years.","But there is a new manager, and he is cutting down. He takes your plate and scrapes off one scoop of rice. Then half the other one.","He trims the katsu with scissors until it is the size of a postage stamp. The mac salad is now one macaroni.","He hands it back. You stare at it. You look up at him. \"HO! EHHH? ME?\" Ho! Eh? Me? Hoʻēmi!","He nods. Then he takes back the one macaroni. Now it is a plate with a single grain of rice on it. \"Price is the same,\" he says. You eat it in one bite and stay hungry for 9 more years."],"Pinch your fingers closer and closer together. \"Ho-EH-mee!\"","Hoʻēmi is to make smaller or cut down. The opposite is hoʻonui, to make bigger.",null,"Plate lunch shrunk to one grain"],["v182","v",182,"hoʻopiha","ho-oh-PEE-hah","to fill up","\"HO! OH! PEE-HAH!\"",["Up on a ranch in Waimea there is a paniolo named Jimmy who fills things up. That is all he does, and he yells the whole time.","The water trough is empty. Jimmy grabs a fire hose. \"HO! OH! PEE-HAH!\" Ho, oh, pee-hah! Hoʻopiha!","In 4 seconds the trough is full to the top. He fills the horse's bucket. He fills the rain barrel.","He fills his hat and puts it back on his head. He cannot stop. He fills the bed of the pickup until the fish from the pond jump in. He fills his boots. He fills the barn so high the hay bales float out the door.","The boss rides up and asks what is going on. Jimmy grins, soaking wet, and fills the boss's coffee cup to the brim. \"PEE-HAH!\""],"Swing an imaginary rope over your head and whoop. \"Ho-oh-PEE-hah!\"","Paniolo are Hawaiian cowboys. Piha means full, so hoʻopiha is to make something full.",null,"Paniolo filling a barn with fire hose"],["v183","v",183,"piha","PEE-hah","to be full","\"PEE-HAH!\" (a cowboy burp)",["Jimmy the paniolo from hoʻopiha has finished work, and he is at the plate lunch place with a coupon for all you can eat.","He eats one plate. Two plates. Six plates. Loco moco, beef stew, chili pepper water on everything. By plate 13 his belt pops off and shoots across the room. By plate 14 his cheeks are round like a pufferfish.","He cannot fit one more bite. He is full to the top, full like a water balloon. He leans back, pats his giant belly and lets out a burp that sounds like a cowboy yell. \"PEE-HAH!\" Pee-hah! Piha!","The windows rattle. The cook peeks out of the kitchen and takes the coupon sign off the wall. Jimmy has to be rolled out to his horse."],"Pat your belly and lean way back. \"PEE-hah.\"","Piha means full, of food, water or people. A packed room is piha too.",null,"Paniolo burping after 14 plate lunches"],["v184","v",184,"ninini","nee-NEE-nee","to pour","\"Nee-NEE-nee!\"",["At the diner, Aunty Carol is in charge of the gravy for the loco moco. She does not use a ladle. She uses a fire truck.","The fire truck backs up to the kitchen window. The siren goes on. \"Nee-NEE-nee! Nee-NEE-nee!\" Aunty grabs the hose and starts pouring. Nee, nee, nee! Ninini!","Brown gravy arcs across the room and lands on the rice, the patty and the egg. She pours it on every plate. She pours it on the counter. She keeps pouring until the gravy is up to everybody's ankles.","Customers lift their feet. A kid floats by on a menu. When the siren finally stops, everybody agrees it is the best loco moco they ever had. It just needs a little less gravy."],"Tip an imaginary pitcher and make a siren sound. \"Nee-NEE-nee!\"",null,null,"Fire truck pouring gravy on loco moco"],["v185","v",185,"kahe","KAH-heh","to flow","\"KAH-heh! KAH-heh!\"",["The little stream behind Uncle Sam's house in Mānoa has always stayed in its bed. Today it gets bored.","It climbs up the bank. It flows under the back door, across the kitchen floor, around the table legs and down the hall. It chuckles as it goes. \"KAH-heh! KAH-heh!\" Kah-heh! Kahe!","Uncle Sam is asleep on the couch. The stream flows right under the couch, lifts it up and carries it, with him on it, out the front door. \"KAH-heh!\" It flows down the driveway, past the school and past the store.","Uncle wakes up floating past the zoo. He waves at a monkey. The stream flows all the way to Waikīkī, sets him gently on the sand, then turns around and flows back home."],"Wave your hand in a long, flowing S shape. \"KAH-heh.\"","Kahe is used for any liquid flowing, even tears running down your face.",null,"Stream carrying Uncle's couch down the street"],["v186","v",186,"hū","HOO","to swell, to rise, to overflow","\"HOOOOOOOO!\"",["Aunty Helen makes sweet bread for the church bake sale. She puts the dough in a big bowl, covers it with a towel and goes to sleep. She put in too much yeast. 40 times too much.","At midnight the dough starts to rise. It swells over the bowl. It swells over the counter. It pushes the kitchen door open and swells down the hallway like a big soft whale.","At 3 in the morning Aunty wakes up because the dough is in her bed. She screams, one long sound, \"HOOOOOOOO!\" Hū!","By sunrise the dough has swelled out every window and overflowed into the yard. It is rising up the telephone pole. The neighbors come out and cut off pieces with a knife. The bake sale sells out by 7."],"Puff up your cheeks and slowly raise both arms. \"HOOOOO!\"","Hū is used for dough rising and for water swelling up and spilling over.",null,"Sweet bread dough swelling out the windows"],["v187","v",187,"pohā","po-HAAH","to burst, to crack open","\"Po... HAAAAAH!\"",["The biggest water balloon in the world is being filled on the lawn at the school fair. It is filling from a fire hydrant. It is already the size of a minivan, green and wobbly, and it is shaking.","The crowd steps back. The principal keeps saying it is safe. The balloon gets bigger.","The rubber is so thin you can see through it. Every kid holds their breath.","Then a mosquito lands on it. \"Po...\" says the principal. The balloon bursts. \"...HAAAAAAH!\" Po, HAAAH! Pohā!","A wall of water 20 feet high knocks over the cotton candy stand. It sweeps the principal off his feet and slides him down the lawn like a waterslide. Every kid is soaked. It is the best day in school history."],"Puff up your cheeks, then pop them with both hands. \"Po-HAAAH!\"","Pohā is also the name of the cape gooseberry. You will see pohā berry jam in local stores.",null,"Giant water balloon bursting at the fair"],["v188","v",188,"nahā","nah-HAAH","to be cracked, broken","\"Nah... HAAAAAH.\"",["Uncle Rudy just bought a brand new phone. It cost more than his car. He is showing it off on the balcony of his apartment on the 14th floor.","Then he drops it. It falls 14 floors and smacks the sidewalk. Everybody runs downstairs. Uncle picks it up and slowly turns it over.","His nephew asks, \"Is it broken?\" Uncle looks at the front. It looks OK. \"Nah.\"","Then he flips it. The back is cracked into 800 pieces, like a spiderweb. He lets out a long, sad sound. \"HAAAAAAH.\" Nah... HAAAH. Nahā.","He tries to make a call and the screen cracks more. He tries to take a picture and it cracks more. Now the sidewalk under his feet is cracked too. He puts the phone in a bag of rice and cries."],"Stare at an imaginary cracked phone and let out a long sigh. \"Nah-HAAAH.\"","Nahā is for something cracked or broken, like a dish or a phone. Haki is for something that snaps in two, like a stick.",null,"Uncle staring at his cracked phone"],["v189","v",189,"haki","HAH-kee","to break (like a stick), to snap","\"HOCKEY!\"",["Grandma needs firewood for the imu. The hardware store is closed. But the kid next door plays hockey and has a garage full of hockey sticks.","Grandma walks over. She picks up a hockey stick. She holds it with both hands, raises it over her knee and SNAP! Breaks it in half like a pencil. \"HOCKEY!\" she yells. Hockey! Haki!","She snaps another. SNAP. \"HOCKEY!\" She snaps 70 sticks. She snaps a broom, a curtain rod and a pool cue. The kid watches with his mouth open.","By the end the garage is empty and Grandma has a pile of wood as tall as a truck. She pays the kid with a plate of kālua pig from the imu. He says it was worth every stick."],"Snap an invisible stick over your knee. \"HAH-kee!\"","Haki is for things that snap in two, like sticks and bones. For a cracked dish, use nahā.",null,"Grandma snapping hockey sticks over her knee"],["v190","v",190,"wāwahi","vaah-VAH-hee","to break open, to tear down","\"WAAAH! WAH! HEE!\"",["The city wants to tear down the old building on the corner. They bring a wrecking ball. It does not work.","The building is too strong. So they call in a specialist.","The specialist is a baby. A giant baby, 50 feet tall, in a diaper, cranky from her nap. She sits down in front of the building and starts to cry. \"WAAAH! WAH!\"","Then she swings one chubby arm. BOOM. A whole floor falls off. She giggles. \"HEE!\"","Waaah, wah, hee! Wāwahi! She knocks down the next floor. \"WAAAH! WAH! HEE!\" She pulls the roof off like the lid of a cookie tin. She breaks open a wall and finds a snack machine inside.","By lunchtime the building is a pile of bricks, and the baby is asleep on top of it with a bag of chips."],"Cry like a baby, then smash your fist down and giggle. \"Vaaah-VAH-hee!\"",null,null,"Giant baby knocking down a building"],["v191","v",191,"pahū","pah-HOO","to explode","\"PAAA... HOOOOO!\"",["It is New Year's Eve, and Pa from palai has put down the frying pan. Tonight he is in charge of fireworks.","Pa has one firecracker. It is 9 feet long and as thick as a telephone pole. He bought it from a man at the swap meet who said, \"Don't ask.\" The whole neighborhood gathers at a safe distance, which is two streets away.","Pa lights it with a very long stick. He walks back very, very slowly. Everybody counts down. Three. Two. One. Pa turns around and yells, \"PAAA...\" Then it explodes. \"...HOOOOO!\" Pa! Hooo! Pahū!","The blast knocks every mango off every tree for a mile. Car alarms go off in the next town. Pa stands in the smoke with his hair straight up and yells, \"Happy New Year!\""],"Throw your hands open from your chest like a blast. \"Pah-HOOO!\"","Careful. Pahu, with no long ū, means to push, and also a box or a drum. Pahū, with the long ū, means to explode.",null,"Pa lighting a giant firecracker"],["v192","v",192,"hiolo","hee-OH-lo","to collapse, to tumble down","\"HE... OH... LOOOW.\"",["Twelve cousins spent all day building a sandcastle at Waimānalo. It is the size of a hotel. It has towers, a moat, a drawbridge made from a boogie board and a flag made from somebody's t-shirt.","At sunset everybody steps back to admire it. It is perfect. Then one sand crab walks out of the main tower.","The tower starts to lean. Somebody whispers, \"He...\" It leans more. \"...OH...\" It starts to fall. \"...LOOOW!\" He, oh, low! Hiolo! The main tower collapses into the next tower, which tumbles into the next, which falls into the wall.","The whole thing slumps down, lower and lower, into one giant wet pile. The crab walks away. The cousins stand in silence. Then everybody starts building again."],"Let your whole body slump down, lower and lower. \"Hee-OH-lo.\"",null,null,"Hotel-sized sandcastle collapsing"],["v193","v",193,"ʻā","AAH","to burn, to be lit","\"(gulp) AAAAAAAH!\"",["It is Tūtū Violet's 99th birthday. Her grandkids bake a cake the size of a coffee table and put 99 candles on it.","They light the first candle. They light the second. By the time they light number 99, the cake is burning like a campfire.","The flames are 3 feet high. The smoke alarm is screaming. The paper plates catch fire.","Everybody in the room opens their mouth at the same time. There is a tiny catch in every throat, and then one long, loud scream. \"(gulp) AAAAAAAH!\" ʻĀ!","Tūtū just sits there, warm and happy, holding her hands out to the fire like it is a cold night. \"Nice,\" she says. \"Burning bright. Just like me.\""],"Hold your hands toward a pretend fire, catch your breath and let it out long. \"AAAAH!\"","Ahi means fire. ʻĀ can also mean rough ʻaʻā lava. Hoʻā is to set something on fire.",null,"99 candles blazing on Tūtū's cake"],["v194","v",194,"puhi","POO-hee","to blow; to burn; to smoke","\"POOOH! HEE!\"",["The cake from ʻā is still burning. 99 candles. Three-foot flames. The fire alarm is still screaming. Tūtū Violet decides it is time to blow them out.","She stands up. She takes the biggest breath of her whole life. Her chest puffs up like a balloon. Then she blows. \"POOOH!\" The flames bend over flat. \"HEE!\" The last candle goes out. Pooh! Hee! Puhi!","The smoke rolls across the room. The curtains fly up. The dog slides across the floor. The front door blows open, and Uncle's hat sails out and lands in the neighbor's mango tree.","She sits back down, calm as can be, while the smoke puffs out the windows. \"Done,\" she says. \"Who wants cake?\""],"Blow out an invisible candle as hard as you can. \"POO-hee!\"","Puhi is also the word for an eel. Same sound, totally different thing.",null,"Tūtū blowing out 99 candles"],["v195","v",195,"hoʻā","ho-AAH","to light, to set on fire","\"HO! AAAAAH!\"",["It is the grand opening of the new beach hotel, and Uncle Makoa gets the honor of lighting the first tiki torch. A big crowd is watching.","They hand him a match. It is not a normal match. It is the size of a telephone pole, and it takes four men to carry it. Uncle braces his feet, lifts the giant match and drags it across a matchbox as big as a garage door.","SSSKRRRT. FWOOM. A fireball blooms. Uncle yells, \"HO!\" Then he feels the heat on his eyebrows and screams a long, long \"AAAAAH!\" Ho, aaah! Hoʻā!","He runs down the beach with the flaming match, lighting all 300
