 the fridge. On the way you stub your toe on the rice cooker. \"OW!\"","You grab the musubi. You take one bite. And the sleep hits you all at once, like a wave. Your eyes close. Your knees bend. You try to say \"more,\" but it comes out \"Mo... eh.\" You are asleep standing up, right there in front of the open fridge, holding the musubi.","\"OW! Mo... eh.\"","In the morning Mom finds you curled up on the kitchen floor with rice on your face and the fridge still open. The musubi has one bite out of it.","Aumoe. Midnight. There is moe, sleep, hiding in it."],"Stub your toe, then slump asleep. \"ow-MO-eh.\"","Aumoe hides the word moe, to sleep. Midnight is sleeping time.",null,"Sleeping standing up at the fridge at midnight"],["n279","n",279,"hola","HO-lah","hour; o'clock","HOLLER! HO-LAH!",["Grandpa's old clock in the hallway doesn't ding and it doesn't bong. It hollers. Every hour, on the hour, a little door pops open, a tiny wooden man leans out and HOLLERS.","\"HO-LAH!\"","One o'clock, one holler. Two o'clock, two. At noon it's twelve in a row, \"HO-LAH! HO-LAH! HO-LAH!\", and the whole street sets their watches by it. Midnight is the worst. Twelve hollers in the dark, and the dog howls along with every one.","In Spanish, hola means hello, so visitors think the clock is being friendly. It isn't. It's telling you the hour.","Holler. Hola. The hour, the o'clock."],"Point at a clock and holler. \"HO-lah!\"","ʻEhia ka hola? means what time is it?",null,"Grandpa's clock hollering every hour"],["n280","n",280,"minuke","mee-NOO-keh","minute","ME! NUKE, eh?",["Uncle Wendell nukes everything in the microwave for exactly one minute. Leftover laulau? One minute. Cold coffee? One minute. His slippahs when they're wet? One minute. Beep beep beep.","Every time he reaches for the button, the whole family yells \"ME! NUKE, EH?!\" because they know what's coming, and he yells back \"ONE MINUTE!\"","One day he puts in a whole frozen turkey. One minute. It comes out still frozen solid. He puts it back in. \"ONE MINUTE.\" Again. \"ONE MINUTE.\" After 300 minutes, one at a time, the turkey is finally done and the whole house smells like Thanksgiving in June.","Me, nuke, eh. Minuke. A minute."],"Punch in one minute on a pretend microwave. \"mee-NOO-keh.\"","Minuke comes from the English word minute.",null,"Uncle microwaving a turkey one minute at a time"],["n281","n",281,"kekona","keh-KO-nah","second (time)","HECK! CONE, ah!",["The hottest day of the year in Kona. You buy a rainbow shave ice, the biggest one, piled high on a paper cone.","You turn around. One second. The whole thing melts. One second, and it's a puddle of red and blue and yellow syrup on your slippahs, and you're holding an empty soggy paper cone.","\"HECK! CONE, AH!\"","You buy another one. One second. Melted. \"HECK... CONE, AH!\" A kid behind you starts timing it on his phone. One second, every time. The shave ice man gives up and starts handing them to you already in a cup with a straw.","Heck, cone, ah. Kekona. One second."],"Stare at an empty cone. \"keh-KO-nah.\"","Kekona comes from the English word second. Hawaiian has no s sound, so it changed to fit.",null,"Shave ice melting in one second"],["n282","n",282,"manawa","mah-NAH-vah","time","Ma! NAH! WAIT!",["Bedtime is 8 o'clock, and Ma has a timer. It's a giant hourglass the size of a refrigerator, standing in the middle of the living room. The sand is almost gone.","You beg. \"Ma! NAH! WAIT!\" She says time's up. You grab the hourglass and try to flip it over. It weighs 400 pounds. \"Ma, NAH, WAIT!\" You try to hold the sand up with your hand. It pours through your fingers.","The last grain drops with a tiny click. Ma points down the hall. You drag yourself to bed yelling \"Ma, nah, wait!\" the whole way, like there's any time left.","Ma, nah, wait. Manawa. Time."],"Tap your wrist where a watch goes. \"mah-NAH-vah.\"","I kēlā me kēia manawa means all the time, at every moment.",null,"Kid fighting a giant hourglass at bedtime"],["n283","n",283,"wā","VAAH","period, era, season","WAAAAH!",["When your baby cousin turned two, the family started calling it \"the WAAAH era.\" For a whole season, from summer all the way to Christmas, he cried. At breakfast. \"WAAAAH.\" At the beach. \"WAAAAAH.\" At birthday parties, at the car wash, at graduations, at the zoo.","Every cry was long. Very long. Grandma timed one at four minutes. The family's whole history is split into two parts, before the waaah and after the waaah.","Then one day he stopped. Just like that. The era was over. Now he's 16, and at every party somebody still says \"Remember the waaah?\"","Wā. A period of time, an era, a season. Hold it long like the baby."],"Cry like a baby, one long note. \"VAAAH.\"","I ka wā kahiko means in the old days, in ancient times.",null,"Baby crying through a whole season"],["n284","n",284,"makahiki","mah-kah-HEE-kee","year","Ma! Car! HEE! KEY!",["You are 15. Ma says you can have the car keys when you turn 16. One year. Exactly one year. So you make a calendar with 365 boxes and tape it to the fridge.","Every night you cross one off. Day 1. Day 90. Day 200. Rainy season, dry season, rainy again. You grow two inches. Your voice cracks. On day 364 you can't sleep.","Day 365. You run into the kitchen at 6 a.m. with your hand out. \"MA! CAR!\" You squeal. \"HEEE!\" Then, \"KEY!\" Ma hands them over. You're so excited you just keep saying it. \"Ma! Car! HEE! KEY!\"","Ma, car, hee, key. Makahiki. One whole year."],"Hold out your hand for keys and squeal. \"mah-kah-HEE-kee!\"","Hauʻoli Makahiki Hou means Happy New Year. Makahiki is also the traditional season of harvest, games and peace in honor of Lono.",null,"Kid crossing off 365 days for the car keys"],["n285","n",285,"hoʻoilo","ho-oh-EE-lo","winter, rainy season","HO! OH! EEE... it's LOW!",["It's winter in Hawaiʻi. The temperature drops to 64 degrees. The whole island panics.","Your neighbor comes out in a parka, snow boots and earmuffs. Your uncle has three hoodies on and a beanie. The dog is wearing a sweater. Somebody at the bus stop is standing inside a sleeping bag with holes cut out for the arms. The rain has been coming down for a week, gray and steady.","The weatherman on TV is shivering. He points at the number and yells \"HO! OH! EEE... it's LOW!\"","The whole island says it together, teeth chattering. \"Ho, oh, EEE, LOW!\" Everybody makes chili. Somebody lights a fireplace they didn't know they had.","Ho, oh, ee, low. Hoʻoilo. The winter, the rainy season. The ʻokina is the shiver between ho and oh."],"Hug yourself and shiver. \"ho-oh-EE-lo.\"","The old Hawaiian year has two seasons, kau for the warm dry months and hoʻoilo for the cool wet ones.",null,"Islanders in parkas at 64 degrees"],["n286","n",286,"nehinei","neh-hee-NAY","yesterday","Neh-hee-NAAAY!",["Yesterday you tripped in the school cafeteria and your whole plate lunch went flying. Mac salad on the principal. Rice in the fish tank. Gravy on the ceiling fan.","Today there is a horse outside your classroom window. Nobody knows whose horse it is. Every time you walk past, it looks right at you and laughs. \"NEH-HEE-NAAAY!\" It's laughing about yesterday. It saw the whole thing.","You try to explain. \"That was YESTERDAY!\" It does not care. \"Neh-hee-NAAAY!\" It follows you to the bus stop. \"NEH-HEE-NAAAY!\" It's still out there when you go to bed.","Neh, hee, nay. Nehinei. Yesterday. The horse will never let it go."],"Laugh like a horse. \"neh-hee-NAY!\"","Nehinei is yesterday, i kēia lā is today, and ʻapōpō is tomorrow.",null,"Horse laughing about yesterday's lunch disaster"],["n287","n",287,"ʻapōpō","ah-poh-POH","tomorrow","(gulp) AH! POP! POP!",["A box shows up at your house. Inside is a sheet of bubble wrap as big as a football field. Every kid on the street comes running.","Ma says \"Not today. Tomorrow.\"","So everybody waits. Nobody sleeps. Twelve kids lie on the lawn all night staring at the bubble wrap in the moonlight. At sunrise Ma opens the door and nods. You all jump on it at once.","\"AH! POP! POP!\" You're so excited there's a little gulp before every \"ah.\" \"(gulp) AH! POPPP! POPPP!\" It sounds like fireworks. The neighbors think it's New Year's.","Halfway through, Ma yells \"Save the rest for tomorrow!\" Everybody groans.","Ah, pop, pop. ʻApōpō. Tomorrow. Hold the pops long."],"Stomp on pretend bubbles. \"ah-poh-POH!\"","Pair it with nehinei, yesterday. ʻApōpō is always one day away.",null,"Kids jumping on giant bubble wrap"],["n288","n",288,"ʻīlio","ee-LEE-oh","dog","EEEEE! LEO!",["Leo is a tiny dog. He weighs 4 pounds. At the family lūʻau, while everybody is dancing, he slips into the kitchen and comes out dragging the whole kālua pig. It's 30 times bigger than him. He's walking backward, pulling it with his teeth, tail going crazy.","Aunty sees him. She screams so high the glasses on the table crack. \"EEEEEE! LEO!\"","He keeps pulling. \"EEEEEE! LEO!\" He gets it all the way under the house. Twenty people crawl under after him with flashlights. They find him lying on top of the pig, belly round as a ball, sound asleep.","Eee, Leo. ʻĪlio. The dog. Hold that ī long, like Aunty's scream."],"Scream high, then call a dog. \"eee-LEE-oh!\"","Take off the ʻī and you get lio, the horse. ʻĪlio is the dog.",null,"Tiny dog dragging a whole kālua pig"],["n289","n",289,"pōpoki","poh-PO-kee","cat","Pohhh... POKEY!",["Your cat wants breakfast. It's half past four in the morning. She climbs onto your chest, sits on your face, and starts poking.","Poke. Your cheek. Poke. Your eyelid. Poke. Up your nose. Soft paw, tiny claws, zero mercy. You pull the blanket over your head. She pokes through the blanket.","\"Pohhh... POKEY!\" you groan. \"Stop being so POKEY!\"","She keeps going. Poke, poke, poke. Fifteen minutes later she knocks your phone off the table. Five minutes after that she pokes your ear so hard you sit straight up. One minute later she is eating breakfast, purring, and you are awake forever.","Pohhh, pokey. Pōpoki. The cat. Hold that first ō like a long sleepy groan."],"Poke the air with one finger. \"poh-PO-kee.\"","Pōpoki is the cat and ʻīlio is the dog.",null,"Cat poking your face before sunrise"],["n290","n",290,"lio","LEE-oh","horse","LEO!",["Leo is a horse. A huge one. Brown, shiny, 2,000 pounds. But Leo thinks he is a lion.","He lies in the sun on the ranch in Waimea with his mane all fluffed out. He practices roaring. It comes out \"NEIGH-RRRR.\" He tries to sneak up on the chickens through the tall grass. He is eight feet tall. They see him coming from a mile away and don't even stop pecking.","The paniolo just call him by name. \"LEO! Come!\" And he trots over proud, mane blowing in the wind, sure he's the king of the jungle. There is no jungle. There is a pasture. He is a horse.","Leo. Lio. The horse. Not the tiny dog from ʻīlio, the big one."],"Gallop in place. \"LEE-oh!\"","A paniolo is a Hawaiian cowboy, and paniolo ride lio.",null,"Horse named Leo pretending to be a lion"],["n291","n",291,"kao","KOW","goat","COW.",["There is a goat on the roof of your truck. Nobody knows how it got up there. It is standing on the very top, looking down at everybody, chewing on your windshield wiper.","You tell it to get down. It looks you right in the eye and says, very clearly, \"COW.\"","\"You're a goat.\" \"COW.\" You show it a picture of a cow on your phone. It licks the phone. \"COW.\" A real cow walks by. The goat looks at the cow. The cow looks at the goat. The goat says \"COW.\" The cow walks away very confused.","The goat is still up there. It ate the antenna. It is now wearing your sun shade like a cape.","Cow. Kao. It sounds like cow, but it's the goat."],"Make goat horns with your fingers. \"KOW.\"","The real cow is pipi, which also means beef.",null,"Goat on a truck roof insisting it's a cow"],["n292","n",292,"hipa","HEE-pah","sheep","HEAP, ah!",["You come out in the morning and your car is gone. In its place there is a heap. A heap of sheep. Forty sheep piled on top of each other in the shape of a car, fluffy, warm and chewing.","\"HEAP, AH!\" you yell. Forty heads turn and look at you.","Somewhere under there is your car. You can see one side mirror sticking out of the wool. You start digging. More sheep. \"HEAP, AH!\" Every sheep you pull off, another one climbs back on. They like it up there. The hood is warm from the sun.","You take the bus to work. When you come home, the heap is on your couch watching TV.","Heap, ah. Hipa. The sheep."],"Stack your hands one on top of the other. \"HEE-pah.\"","Hipa comes from the English word sheep.",null,"Heap of sheep piled on your car"],["n293","n",293,"manu","MAH-noo","bird","Ma, NEW!",["Ma buys a new hat for the big party. It's gorgeous. Round, feathery, bright green and yellow, with a little beak on the front. Wait.","At the party everybody compliments her. \"Ma, NEW hat?\" \"Ooh, Ma, NEW!\" She beams and turns her head so everybody can see.","Then, in the middle of the speeches, the hat stands up. It stretches its wings. It flies off her head, lands in the mango tree, and starts to sing. It was a bird the whole time. It just liked sitting on her head.","The whole party stares. Ma, very calm, pats her hair down. \"Yes. New.\"","Ma, new. Manu. The bird."],"Flap your arms like wings. \"MAH-noo.\"","Manu is also the name for the carved end pieces at the front and back of a canoe.",null,"Ma's new hat flies off, it was a bird"],["n294","n",294,"nēnē","neh-NEH","Hawaiian goose","Nehhh-NEHHH (nay, nay)",["You're driving slow through the national park, and a goose is standing in the middle of the road. Gray and brown, stripes down its neck, little black face. It doesn't move. You roll forward one inch. It shakes its head.","\"NEHHH-NEHHH.\" Like, \"Nay, nay.\" No. Not today.","You wait. Another car pulls up behind you. The goose gives them a look too. \"NEHHH-NEHHH.\" A tour bus comes. A motorcycle. A guy on a bike. By the time the goose decides to cross, there's a line of 50 cars, and it walks across the road like a queen, one flat foot at a time, not hurrying at all.","Nay, nay. Nēnē. Stretch both ē's, like the goose."],"Shake your head slow and honk. \"nehh-NEHH.\"","The nēnē is Hawaiʻi's state bird. Slow down for them on the road.",null,"Goose stopping 50 cars with \"nay nay\""],["n295","n",295,"pueo","poo-EH-oh","owl","PEW! Eh? ...OH.",["Sunny afternoon in an open field upcountry. A little mouse is sitting in the grass eating a crumb of malasada it found. Feeling good. No worries.","Most owls hunt at night. Not this one. High above, a brown and white owl hangs in the wind with big yellow eyes, perfectly still. Then it folds its wings and drops.","\"PEW!\"","Like a laser. The grass shakes. The mouse is gone. The owl is already gliding away low over the field.","Your uncle, sitting on the fence with his lunch, looks at the empty spot. \"Eh?\" Then he looks up and sees it. \"...OH.\"","Pew, eh, oh. Pueo. Hawaiʻi's own owl, hunting in broad daylight."],"Swoop your hand down fast. \"poo-EH-oh.\"","For some Hawaiian families the pueo is an ʻaumakua, a family guardian, and it is treated with deep respect.",null,"Owl diving in daylight, uncle saying \"Oh.\""],["n296","n",296,"ʻiwa","EE-vah","frigatebird","EEE! EVA!",["Out over the ocean, a big black seabird with long pointy wings and a forked tail glides around like she owns the sky. Her name is Eva. She is a diva.","Eva can catch her own fish, but why bother? Eva waits. When a smaller bird catches a fish, Eva dives at it, chases it, tugs its tail, until it drops the fish. Then she snatches the fish out of the air before it hits the water. She doesn't even get her feet wet.","Every bird on the beach screams at her. \"EEE! EVA!\" She doesn't care. She tilts her long wings and floats away with lunch, not flapping once.","Eee, Eva. ʻIwa. The frigatebird, the best thief in the sky."],"Snatch something out of the air. \"EE-vah!\"","Because this bird steals fish from other birds, ʻiwa is also used to mean a thief.",null,"Diva frigatebird stealing a fish midair"],["n297","n",297,"ʻiʻiwi","ee-EE-vee","scarlet honeycreeper","Eee... EEvie!",["Great aunty's house up in the rainforest has a rusty screen door. Every time it opens, it squeaks. \"Ee... EEE-vee.\"","One morning a small bright red bird lands on the gate. Red like a fire truck, black wings, and a long curved orange beak like a hook. It looks at the screen door. Aunty opens it. \"Ee... EEE-vee.\" The bird opens its beak and answers with the exact same squeak. \"Ee... EEE-vee.\"","Now they talk every day. Door squeaks. Bird squeaks. Door. Bird. Aunty names the bird Evie. \"Eee, EVIE!\" she says when it shows up. She refuses to ever oil that door again.","Eee, Evie. ʻIʻiwi. The scarlet honeycreeper. The squeak in the middle is the ʻokina."],"Squeak like a rusty hinge. \"ee-EE-vee.\"","The ʻiʻiwi's red feathers were used in featherwork like capes and cloaks for aliʻi. Don't mix it up with ʻiwa, the frigatebird.",null,"Red bird squeaking back at a screen door"],["n298","n",298,"ʻalalā","ah-lah-LAAH","Hawaiian crow","Uh-la-LAAARM!",["Every car on the street has an alarm, and there is a big black crow sitting on the telephone wire listening to all of them.","One morning it starts copying. \"Uh-la-LAAAAH! Uh-la-LAAAAH!\" A perfect car alarm. Everybody runs outside in their pajamas to check their cars. Nothing wrong. They go back in. \"UH-LA-LAAAAH!\" Everybody runs out again.","It's the crow. A smart, loud, show-off crow. By lunch it can also do the ice cream truck, a rooster and your mom calling you for dinner.","\"Is that an ALARM?\" \"No. It's the crow.\" \"Uh-la-LAAAAAH!\"","Uh-la-LAAAH. ʻAlalā. The Hawaiian crow. Hold that last ā like the alarm."],"Wave your arms like a car alarm going off. \"ah-lah-LAAAH!\"","The ʻalalā is one of the rarest birds on earth. Conservation programs are working to bring it back to Hawaiʻi's forests.",null,"Crow copying car alarms on a wire"],["n299","n",299,"koloa","ko-LO-ah","duck","Co-LOOOAH! (a cola burp)",["At the family picnic somebody leaves a two liter bottle of cola open on the grass. A little brown duck waddles over, sticks its bill in and drinks the whole thing. Glug glug glug. Two liters. The duck is about the size of the bottle.","It sits back. Its eyes go wide. It shakes. Then it lets out a burp so big the paper plates blow off the table. \"CO-LOOOAH!\"","It waddles around the picnic burping. \"Co-LOAH!\" Each one bigger than the last. The kids are rolling on the grass laughing. The duck jumps into the pond and burps a bubble the size of a beach ball.","Cola. Koloa. The duck."],"Waddle and burp. \"ko-LO-ah!\"","The koloa maoli is the native Hawaiian duck.",null,"Duck burping after drinking two liters of cola"],["n300","n",300,"ʻio","EE-oh","hawk","EE... OH!",["An old farmer is out in his field singing the farm song. \"Old farmer had a farm, EE-I-EE-I-OH.\" He has a big straw hat on and a chicken under each arm.","High above him, a brown hawk circles. Slow. Patient. Waiting for the right moment.","The farmer gets to the end of the song. \"EE-I-EE-I...\" On the last \"EE\" the hawk dives and snatches the straw hat right off his head. \"...OH!\"","\"EE... OH!\" The hawk flies up to the top of a tall tree and sits there wearing the hat. The chickens are fine. The farmer is bald, sunburned and still singing. \"EE... OH!\"","Ee, oh. ʻIo. The hawk. A little catch before the ee."],"Swoop your hand down and grab. \"EE-oh!\"","The ʻio lives only on Hawaiʻi Island and was seen as a symbol of royalty.",null,"Hawk stealing the singing farmer's hat"],["n301","n",301,"kōlea","koh-LEH-ah","plover","Cole! Eh! Ah!",["Every August a small golden bird lands on the exact same patch of grass in Aunty Momi's front yard. Same patch. Same bird. He just flew nonstop from Alaska, about 3,000 miles, and he looks skinny and tired, like he drove all night.","Aunty has been waiting in her folding chair since 5 in the morning. She named him Cole. When he lands she jumps up and yells \"Coooooole! Eh! Ah!\" She holds that first sound so long the neighbors come out to check on her.","All winter Cole walks around her yard, bobbing his head and eating bugs. By April he is so fat he looks like a golf ball with legs. Then one morning he is gone, back to Alaska. Aunty sits in her chair and waves at the sky anyway."],"Wave at the sky like Aunty. \"Kooooh-leh-ah.\"","Kōlea fly between Alaska and Hawaiʻi every year, arriving around August and leaving around April.",null,"Aunty waving at a fat golden bird"],["n302","n",302,"ʻiole","ee-OH-leh","rat, mouse","Eee! OLÉ!",["It is midnight and you go to the kitchen for leftover rice. You flip on the light. In the middle of the floor is a rat the size of a corgi, holding a whole spam musubi in its little hands.","It sees you. It drops the musubi. It lowers its head and scrapes the floor with one foot like a bull.","Before you can run, Grandma bursts in with a red dish towel. She plants her feet and holds the towel out to the side. The rat charges. Grandma swings the towel away at the last second and screams \"Eeeee! OLÉ!\" The rat shoots past her, slides across the floor and bonks into the rice cooker.","It charges again. \"Eee! OLÉ!\" Nine times. Three little mice cheer from the doorway. Finally the rat gets dizzy, bows, and leaves through the cat door with the musubi."],"Swing an invisible towel to the side. \"Ee-OH-leh!\"","Do not skip the ʻokina at the front. ʻIole is the rat. Say the little catch before the ee.",null,"Grandma bullfighting a giant rat"],["n303","n",303,"moʻo","MO-oh","lizard; dragon; succession","Mo... ʻoh!",["A tiny gecko sits on your bedroom wall. You point and say \"Mo.\" You don't know why. It just looks like a Mo.","Then you notice a bigger lizard behind it. And a bigger one behind that. They go out your window in a line, each one bigger than the last, like a family photo. A cat-sized lizard. A dog-sized lizard. One as long as a canoe.","You follow the line out into the yard. At the very end, lying on the lawn and crushing the mango tree, is a dragon the size of a city bus. It blinks one yellow eye at you.","You gulp so hard your throat clicks. \"Mo... ʻoh!\"","A lizard, a dragon, and a whole succession of them lined up in a row. That is moʻo."],"Gulp, then say it with a catch in the middle. \"MO-ʻoh.\"","Moʻo as succession hides inside moʻolelo (a story passed along) and moʻokūʻauhau (genealogy).",null,"Line of lizards ending in a dragon"],["n304","n",304,"nalo","NAH-lo","fly (insect)","Nah, LOW!",["Family beach potluck. Forty people. One fly. But this fly is the size of a guava and it has a plan.","It lands on the potato mac salad. Uncle Kimo raises his slippah high over his head and swings. The fly just says \"Nah... LOW!\" and dives under the table.","Uncle ducks under the table and swings low. The fly zips up to the tent roof, waits, then dives again. \"Nah, LOW!\" It lands in the chili. Uncle smashes the chili. Chili everywhere. Aunties screaming.","After twenty minutes Uncle is covered in mac salad and the fly is sitting on his forehead, rubbing its little hands together. He swings one last time and smacks himself. The fly is gone. Nobody ever sees it again."],"Duck under an invisible slippah. \"NAH-lo.\"","Nalo also means to vanish or be lost, which is what every fly does the second you swing. Nalo meli is the honeybee.",null,"Uncle swinging slippah at giant fly"],["n305","n",305,"naonao","now-NOW","ant","Now! NOW!",["You drop one grain of rice on the kitchen counter. Just one.","Four seconds later a single ant marches out of the crack by the sink. He wears a tiny sergeant hat and has a whistle. He looks at the grain. Then he looks at your whole spam musubi sitting on the plate. He blows the whistle and screams \"NOW! NOW! NOW!\"","Out of every crack in the house pour 4,000 ants in perfect lines. They lift the musubi over their heads like a float in a parade and carry it across the counter, down the cabinet, across the floor and under the door. \"Now! Now! Now!\" You can hear the sergeant the whole way.","Nine seconds. The plate is empty. The grain of rice is still there. They left it for you."],"Blow an invisible whistle. \"Now-NOW!\"",null,null,"Ant sergeant stealing spam musubi"],["n306","n",306,"makika","mah-KEE-kah","mosquito","Ma! KICK-ah!",["Backyard party at dusk. The sun goes down and here it comes. A mosquito the size of a hummingbird, with a nose like a drinking straw and a tiny napkin tucked under its chin.","It lands on your arm and starts slurping like it is finishing a smoothie. You freeze. You can't slap it. It's too big. You scream across the yard \"MA! KICK-ah! KICK-AH!\"","Your mom puts down her paper plate. She runs across the grass in her muʻumuʻu, jumps off the cooler, and does a flying spin kick. The mosquito sails over the fence, over the neighbor's roof and lands somewhere near Pearl City.","Everyone claps. Ma picks up her plate and goes back for more teriyaki. You have a bump on your arm the size of a malasada."],"Point at your arm and yell for Mom. \"Mah-KEE-kah!\"","Mosquitoes were not in Hawaiʻi until a ship brought them to Lahaina in 1826.",null,"Mom spin kicking a giant mosquito"],["n307","n",307,"pulelehua","poo-leh-leh-HOO-ah","butterfly","Pool! Lay, lay... HOO-ah!",["At the hotel pool, a butterfly with wings as big as beach towels is lying on a lounge chair. Orange and black wings, spread out flat, catching sun. It has on tiny sunglasses.","The lifeguard walks over. \"Excuse me, is this your chair?\" The butterfly points one leg at the water and says \"Pool.\" Then it points at the chair. \"Lay. Lay.\" It lies back down.","It lays there all morning. It lays there all afternoon. Kids float by and stare. Then at exactly 3 o'clock it sits up, flaps once, blows every umbrella into the pool, and yells \"HOO-AH!\" It flies off over Waikīkī with a pink noodle float stuck on one leg.","Pool, lay, lay, HOO-ah. That is the whole butterfly routine, every single day."],"Flap your arms slowly, then fast. \"Poo-leh-leh-HOO-ah.\"","The Kamehameha butterfly, a pulelehua found only in Hawaiʻi, is the state insect. Lele, to fly, is hiding in the middle of the word.",null,"Giant butterfly sunbathing by hotel pool"],["n308","n",308,"nananana","nah-nah-NAH-nah","spider","Nah-nah-NAH-nah!",["You walk into the garage with a broom. In the corner, in a web as big as a garage door, sits a spider. Eight legs. A tiny slippah on every one.","You swing the broom. The spider hops left. You swing again. It hops right. Then it sticks out its tongue, wiggles all eight legs at you and sings \"Nah-nah-NAH-nah! Nah-nah-NAH-nah!\" Two legs wiggle for every nah. It keeps perfect count.","You swing for ten minutes. You knock down the fishing poles, the Christmas box and Dad's old surfboard. The spider never stops singing.","When you finally give up and sit on a bucket, it drops down on a thread, pats you on the head with one leg and climbs back up. \"Nah-nah-NAH-nah.\" It still lives there. It pays no rent."],"Wiggle your fingers like spider legs and tease. \"Nah-nah-NAH-nah.\"","Another word for spider is lanalana.",null,"Spider taunting you from its web"],["n309","n",309,"kanapī","kah-nah-PEE","centipede","Can-a-PEEEEE!",["You are camping at the beach under a blue canopy tent. Uncle Keoni is asleep in his chair with his mouth open.","Something moves in the fold of the canopy right over his head. It is a centipede. Not a normal one. This one is six feet long, dark red, with dozens of legs clicking like tiny typewriters.","You try to warn him but you are so scared you can't say the word right. You point up and squeak \"Can-a... PEEEEEEE!\" The last part comes out long and high like a tea kettle.","Uncle opens one eye. Looks up. The centipede looks down. Uncle goes straight up out of the chair, leaves his slippahs on the sand, and lands in the ocean forty feet away. He stays out there until sunrise."],"Point up in terror and hold the last sound. \"Kah-nah-PEEEE!\"","Kanapī bites really hurt, so locals shake out their shoes and slippahs before putting them on.",null,"Six foot centipede in beach canopy"],["n310","n",310,"ʻūhini","oo-HEE-nee","grasshopper","ʻOoooo! HEE-KNEE!",["Uncle Bert is walking through a field of tall grass to get to the beach, in short pants. From the grass, a grasshopper watches him. It is green, it is the size of a surfboard, and its back legs are folded up like two giant springs.","Uncle gets closer. Closer. He is humming. The grasshopper does not like humming.","It turns around and kicks with both back legs. BOOM. It gets Uncle square in the knee. He stops. He gulps. His face goes through six colors. Then he hops on one foot in a circle howling \"ʻOoooooooo! HEE... KNEE! OOOOO, HEE-KNEE!\"","The grasshopper springs off over the trees and lands three streets away on somebody's car. Uncle ices his knee for a week. Now he takes the long way to the beach."],"Grab your knee and hop. \"ʻOooo-HEE-nee!\"",null,null,"Grasshopper kicking Uncle in the knee"],["n311","n",311,"ʻōpeʻapeʻa","oh-peh-ah-PEH-ah","bat","Oh! Pay-ʻah! PAY-ʻah!",["Late at night you drive over the old bridge in Hilo. There is a new toll booth that was not there this morning. Hanging upside down inside it is a tiny fuzzy bat, gray and brown with frosty tips like a coffee drink, wearing a little visor.","You roll down the window. The bat squeaks \"Ohhhh! Pay-ʻah! PAY-ʻah!\" You say you have no money. It points one tiny wing at the mosquito buzzing around your head.","Oh. It wants mosquitoes.","You catch one and hand it over. The bat gulps it, stamps your hand with a little bat stamp and flips the gate up. \"Pay-ʻah!\" it squeaks at the next car. By morning there is not one mosquito left in Hilo, and that bat is the richest thing on the island."],"Hold out your palm like a toll booth. \"Oh-peh-ah-PEH-ah!\"","The Hawaiian hoary bat is the only native land mammal in Hawaiʻi and the official state land mammal.",null,"Tiny bat collecting mosquito tolls"],["n312","n",312,"honu","HO-noo","turtle","HO! NEW!",["You are on the beach at sunset when a green sea turtle hauls itself out of the water. Big one, four feet long, older than your grandpa.","But something is different. Its shell is shiny. Too shiny. It still has the sticker on it. A price tag flapping in the wind, $49.99, and a little sign that says NEW.","The old lifeguard, who has been sitting in his tower since 1987, sits up and yells \"HO! NEW!\" The turtle turns its head slowly, blinks at him, and very slowly nods. It is proud.","Everyone comes to look, from a respectful distance. The turtle poses. It turns left. It turns right. Then it falls asleep on the warm sand, snoring, while the price tag flaps."],"Point at an imaginary shiny shell. \"HO-noo!\"","Honu ʻea is the hawksbill turtle. Give resting honu at least 10 feet of space.",null,"Sea turtle with price tag on new shell"],["n313","n",313,"manō","mah-NOH","shark","Man, NOOOOOO!",["You are floating off Waikīkī on an inflatable pizza slice. Sun is out. Life is good. You have a juice box.","Then a gray fin cuts past. It circles once. It circles twice. Then a shark pokes its head up next to your pizza. It is wearing a bib. It has a fork in one fin and a knife in the other.","It looks at the pizza. It looks at you. It licks its lips.","You yell \"Man... NOOOOOOOOO!\" and you hold that no so long that you paddle all the way back to shore with your hands and it is still going. The lifeguard hears it. The hotels hear it. Ships in the harbor hear it.","The shark shrugs, takes one bite out of the pepperoni corner and swims away happy."],"Throw your hands up and hold the last sound. \"Mah-NOOOH!\"","Some Hawaiian families honor the manō as an ʻaumakua, a family guardian.",null,"Shark with bib circling pizza float"],["n314","n",314,"koholā","ko-ho-LAAH","humpback whale","Ko-ho-LAAAAAAH!",["You are kayaking off Maui in February. The water is flat and quiet. Then the kayak starts to shake.","Right next to you, a humpback whale rises up. It is 45 feet long. It has barnacles on its chin like a beard. It looks you in the eye, opens its huge mouth, and starts to sing.","\"Ko... ho... LAAAAAAAAAAAAAH!\"","It holds that last note for twenty minutes. Your kayak buzzes. Your teeth buzz. Fish float up to see what is going on. Somewhere on Lānaʻi a dog starts howling along.","When the whale finally runs out of air, it slaps its giant tail on the water, soaks you from head to toe, and dives. You sit there dripping, clapping, alone in the quiet."],"Put your hand on your chest like an opera singer. \"Ko-ho-LAAAH!\"","Koholā come to Hawaiʻi every winter, from about December to April, to have their babies.",null,"Humpback singing opera beside kayak"],["n315","n",315,"naiʻa","NAI-ah","dolphin","NIGH-ʻah! (a teasing nyah with a hiccup)",["You are on a tour boat off the Waiʻanae coast. Somebody yells and a whole pod of spinner dolphins shows up. Two hundred of them.","One gray dolphin with a smile on its face shoots out of the water and spins in the air. Once, twice, seven times. It splashes down, pops up next to the boat, looks right at you and sticks out its tongue. \"NIGH... ʻah!\" A teasing little noise with a hiccup in the middle.","You try to spin on the deck. You make it halfway around and fall into the ice chest.","\"NIGH-ʻah!\" says the dolphin. It spins eleven times this time. The others join in. \"NIGH-ʻah! NIGH-ʻah!\" Two hundred dolphins laughing at you in perfect circles while you sit in the ice with a soda can stuck to your leg."],"Spin halfway around, then tease. \"NAI-ʻah!\"","Mahimahi is sometimes called dolphinfish, but it is a fish, not a naiʻa.",null,"Spinning dolphin teasing you from water"],["n316","n",316,"ʻīlioholoikauaua","ee-lee-oh-ho-lo-ee-kah-oo-ah-OO-ah","monk seal","Ee, LEO! Holo-ee! KAOW! OW-ah!",["Early morning at the beach. From way up the sand you see a big gray dog asleep by the water. Seven feet long, whiskers, flippers, and it smells like a fish market. You whisper \"Eee... LEO?\" because it looks like a Leo.","It opens one black eye. Not a dog. A Hawaiian monk seal, and it is not interested in you.","It humps down the sand toward the sea like a giant rolling sleeping bag. Your little brother cheers it on like a cowboy. \"HOLO-EE! HOLO-EE!\" It hits the biggest, roughest wave of the morning. KAOW! The spray blasts all the way up the beach and soaks you both. \"OW-ah! Cold!\"","The seal pops up past the break, totally happy in the rough water, and looks back at you like a wet puppy.","Ee-Leo, holo-ee, KAOW, OW-ah. The dog that runs in rough seas."],"Say it in slow chunks, then fast. \"Ee-lee-oh ho-lo-ee kah-oo-ah-OO-ah.\"","Built from ʻīlio (dog), holo (run), i ka (in the) and uaua (rough). Monk seals live only in Hawaiʻi and are endangered, so stay about 50 feet away.",null,"Monk seal plowing into rough wave"],["n317","n",317,"uhu","OO-hoo","parrotfish","Ooh... HOO!",["You are snorkeling at the reef. A fish swims up, bright blue and green and pink, like somebody spilled a whole box of crayons. Its mouth looks like a parrot beak made of teeth.","It bites the coral. CRUNCH. It bites again. CRUNCH CRUNCH. It sounds like a kid chewing ice.","You think, ooh. Nice fish.","Then the fish stops, lifts its tail, and out the back end pours a long cloud of fine white sand. It just keeps coming. A whole bucket's worth. You yell through your snorkel \"Ooh... HOO!\" and bubbles go everywhere.","You look at the beach. You look at your towel lying on the white sand. You look at the fish. The fish winks."],"Crunch your teeth together, then hoot. \"OO-hoo!\"","Uhu really do grind up coral and poop out sand. A lot of the white sand on Hawaiʻi beaches went through a parrotfish first.",null,"Parrotfish pooping white sand"],["n318","n",318,"kūmū","koo-MOO","goatfish","Koooooo... MOOOOOO!",["You are at the fish market and a red goatfish on the ice is having a crisis. It has two long whiskers under its chin, like a little goat beard. Everybody keeps calling it a goat. It has had enough.","It sits up on the ice and tries to figure out what animal it really is. First it tries being a pigeon. \"Kooooooo.\" No. It tries being a cow. \"MOOOOOOO.\" Better.","It puts them together. \"Kooooooo... MOOOOOOO!\" Both sounds long, like it is holding them for a contest.","The fish guy drops his scale. An aunty buying ʻahi faints into the tako. And out in the parking lot, a real cow in the back of a truck lifts its head and moos back. The goatfish smiles. It has found its people."],"Coo like a pigeon, then moo like a cow. \"Koo-MOO!\"","Other goatfish in Hawaiʻi include weke and moano.",null,"Red goatfish cooing and mooing on ice"],["n319","n",319,"mahimahi","mah-hee-MAH-hee","dolphinfish","MA! HE! MA! HE!",["You are on a fishing boat with your little cousin Kai. Something hits the line so hard the pole bends into a U. Kai grabs the pole and gets yanked off his feet.","Out of the water jumps a fish, four feet long, glowing electric green and gold, with a big square forehead like a bulldozer. It flips once and lands right in the boat. Right on Kai.","Kai is pinned. He can barely breathe. He can only point at the fish and scream for his mom, one word at a time. \"MA! HE! MA! HE!\" Meaning, Ma, he is on me, he is huge, help.","Ma walks over, lifts the fish off Kai with one arm, and says \"Dinner.\" Kai lies on the deck whispering \"Ma... he... ma... he...\" all the way back to the harbor."],"Point at the fish twice. \"Mah-hee-MAH-hee!\"","Mahi means strong, and one popular explanation is that doubling it makes mahimahi extra strong. Just ask Kai.",null,"Glowing green fish landing on cousin"],["n320","n",320,"ulua","oo-LOO-ah","giant trevally","OOOH! LURE-ah!",["It is 2 in the morning on the lava rocks. Uncle Sonny has three fishing poles jammed into the cracks, each one with a little bell on the tip. He has been out here four nights in a row. He has one bag of chips left.","Then the middle bell goes crazy. DING DING DING DING.","Uncle grabs the pole. Something huge and silver takes off toward Molokaʻi. It is an ulua, 110 pounds, with a head like a cinder block and the attitude of a nightclub bouncer. It drags Uncle across the rocks, through a tide pool and halfway into his own cooler.","Uncle does not let go. He yells at the sea \"OOOH! LURE-ah! You like my LURE-ah? Come get um!\" After forty minutes he pulls it up onto the rocks. He sits down next to it and they both breathe hard."],"Crank an invisible reel with both hands. \"Oo-LOO-ah!\"","A young ulua is called a pāpio.",null,"Uncle dragged across rocks by ulua"],["n321","n",321,"ʻoʻopu","oh-OH-poo","goby (stream fish)","Uh-ʻOH... poo.",["You are hiking in a valley on Kauaʻi and you stop at a waterfall 300 feet tall. On the wet black rock, halfway up, is a tiny fish. It is climbing. A fish. Climbing.","It sticks onto the rock with a little cup under its belly, wiggles up one inch, sticks on again. One inch. Another inch. It has been doing this for eleven days.","Then a bird flies over and drops a big white splat right on its head.","The fish stops. It says \"Uh... ʻOH.\" A little catch in the throat. \"Poo.\"","Then it keeps climbing. It doesn't wipe it off. It doesn't complain. Nothing in the world is going to stop this fish. You stand at the bottom clapping as it flops over the top of the waterfall like it just won a marathon."],"Say it with a hiccup in the middle. \"Oh-ʻOH-poo.\"","Some ʻoʻopu really do climb waterfalls hundreds of feet high, using a sucker made from their belly fins.",null,"Tiny fish climbing waterfall with bird poop"],["n322","n",322,"ʻōpelu","oh-PEH-loo","mackerel scad","Ohhhhh, pay LOU!",["Last month you borrowed twenty dollars from Uncle Lou, the fisherman down the road. You forgot. Uncle Lou did not forget.","Saturday morning you open your front door and the whole porch is moving. It is covered in ʻōpelu, thousands of them, silver and blue and slim as hot dogs, flipping and flopping all the way down the driveway and into the street.","They are chanting. Every single fish. \"Ohhhhhhh... pay LOU! Ohhhhhhh... pay LOU!\" The ohhh part is long and spooky, like ghosts. The pay Lou part is sharp.","The neighbors come out in their pajamas. The mailman won't come up the walk. You find a twenty in the couch cushions and throw it out the window. The fish cheer and flop back to the ocean. That night Uncle Lou fries six of them for your dinner anyway."],"Hold out an invisible twenty dollar bill. \"Oh-PEH-loo!\"","ʻŌpelu is a local favorite, fried whole or dried in the sun.",null,"Chanting fish covering your porch"],["n323","n",323,"ʻaʻama","ah-AH-mah","black rock crab","Ah! ʻAH! MAAAA!",["Low tide at the lava rocks. You and your mom are looking in tide pools. The rocks are covered in black crabs, hundreds of them, flat and shiny, with little eyes on stalks. The second you move they all run sideways at once, like a black carpet sliding off the rock.","Your mom leans over to look closer. One crab does not run. It is the biggest one. It walks right up to her toe, looks up, and pinches.","\"AH!\" she yells. Then she hiccups from the shock. \"ʻAH!\" Then she screams for her own mother. \"MAAAAA!\"","Ah, ʻah, Maaa. The crab lets go, runs sideways at about forty miles an hour and disappears into a crack. Then all the other crabs come back out to see if she is okay."],"Grab your toe and hiccup. \"Ah-ʻAH-mah!\"","Don't mix it up with ʻaʻā, the rough, jagged lava these crabs run across.",null,"Black crab pinching Mom's toe"],["n324","n",324,"wana","VAH-nah","sea urchin","WANNA hug?",["You are wading on the reef in reef shoes. Down between two rocks sits a sea urchin, a round purple ball covered in 300 long black spines. Each spine is as sharp as a sewing needle.","It sees you. It slowly spreads out all its spines like a hundred little arms and says in a sweet voice \"Wanna? Wanna hug?\"","You say no. You step back. It rolls closer. \"Wanna? Wanna hug?\"","You run. It rolls after you across the reef, bouncing off rocks like a spiky soccer ball, still asking \"WANNA? WANNA?\" You jump onto your big brother's shoulders. It sits at his feet, spines out, waiting. He does not want a hug either. You both stand there until the tide comes in and floats it away, still asking."],"Hold your arms out for a hug, then pull back fast. \"VAH-nah?\"","People eat the orange insides of some wana raw, like uni.",null,"Spiky purple urchin chasing for hugs"],["n325","n",325,"loli","LO-lee","sea cucumber","LOLLY!",["Your five year old cousin is poking around the tide pools and finds a sea cucumber. It is brown, squishy, about as long as a loaf of bread, and lying there doing absolutely nothing.","She thinks it is candy. \"LOLLY!\" she screams. \"A giant LOLLY!\"","She picks it up with both hands. It feels like a warm water balloon. She opens her mouth wide for a big lick.","The sea cucumber does not want to be a lolly. It squeezes itself and shoots a spray of sticky white strings right in her face. Her hair, her eyebrows, her sunglasses. She looks like a spider web with legs.","She gently puts it back in the water. She stands there dripping. Then she says, very quietly, \"Worst lolly ever.\""],"Pretend to lick a lollipop, then make a face. \"LO-lee.\"","Loli also means to change. Hoʻololi means to change something.",null,"Sea cucumber spraying cousin's face"],["n326","n",326,"holoholona","ho-lo-ho-LO-nah","animal","Hollow! Hollow! LOAN-ah!",["At the end of the park there is a giant hollow log with a sign nailed on it. HOLLOW HOLLOW LOANER. Animals for borrow. Bring back by 5.","You knock. An aunty with reading glasses pops her head out of the log like a librarian. \"Hollow, hollow... LOAN-ah?\" You nod.","She stamps your card and starts pulling animals out of the log one by one. A goat. A pig. Twelve chickens. A horse, somehow. A mongoose. A donkey that has to back out slowly. They keep coming. The log is only nine feet long.","You walk home with 27 animals following you in a line down the street. At one minute to 5 you bring them all back. Aunty counts them. \"Twenty-six.\" You look down. The mongoose is in your backpack."],"Knock on the table like it is a hollow log. \"Ho-lo-ho-LO-nah.\"","You can hear holo, to run or go, inside it. Holoholo, a word you hear all the time here, means to go out for fun.",null,"Animals pouring out of a hollow log"],["n327","n",327,"lāʻau","laah-OW","tree, plant; medicine; stick","LAAAAAA... ʻOW!",["You are lying under the big tree in Tūtū's yard, singing to yourself. \"Laaaaaaaaaa...\" A long, lazy note.","The tree does not like your singing. Crack. A stick drops forty feet and bonks you right on top of the head. Your song stops with a hiccup. \"Laaaaaaa... ʻOW!\"","Tūtū walks out. She looks at the tree. She looks at the stick. She looks at the bump rising on your head like a baking bun. She pulls a few leaves off a plant by the steps, crushes them in her hand, and presses them on the bump. It stops hurting right away.","So in one minute you met all three. The tree. The stick. The medicine. Laaaa... ʻow."],"Sing a long note, then rub your head. \"Laaah-ʻOW.\"","Lāʻau lapaʻau is traditional Hawaiian plant medicine.",null,"Stick bonks singer, Tūtū heals bump"],["n328","n",328,"pua","POO-ah","flower; offspring","Poo? ...AHHH.",["Your aunty hands you her new baby for five minutes and runs to the store. The baby is chubby, smiling, and the pride of the whole family. Everybody calls her a pua.","Four minutes in you smell something. You sniff the air. You sniff the baby. You make a face and say \"Poo?\"","You lift her up to check. But the smell is not bad. It is sweet. Tucked in her little headband is a fresh white plumeria. You sniff it and your whole body relaxes. \"Ahhhh.\"","Poo? Ahhh. A flower, and a baby. The two nicest things you can smell in one house.","Except when the baby smell actually is the other thing. Which it is, eleven minutes later. Aunty is still at the store."],"Sniff the air, then smile. \"POO-ah.\"","Pua also means to bloom or come out, and it can mean children or descendants, the flowers of a family.",null,"Baby with plumeria in her headband"],["n329","n",329,"lau","LOW","leaf","Duck LOW!",["It is windy at the lūʻau. Up on the hill, a single ti leaf breaks loose and starts floating down. But it is not a normal leaf. It is the size of a king-size mattress, green and shiny, and it is heading straight for you.","Uncle sees it first. \"DUCK! LOW! LOOOW!\" You duck low. Too late. The leaf lands on you with a soft flap and wraps around you like a burrito.","The aunties rush over. They tie the ends with string. They pick you up and carry you toward the imu. You yell from inside the leaf. One aunty taps on it and says \"Ho, this one one good laulau.\"","They unwrap you just in time. You smell like kālua pig for three days."],"Duck low and cover your head. \"LOW!\"","Laulau is food wrapped in leaves, so lau is right there in the name. Lau is also the number 400.",null,"Giant ti leaf wraps you like laulau"],["n330","n",330,"ʻanoʻano","ah-no-AH-no","seed","ʻAh, NO! ʻAH, NO!",["You are six years old at a family picnic, eating watermelon as fast as you can. Your older cousin says \"Careful, if you swallow one seed, one tree going grow inside you.\"","Gulp. You swallowed one.","That night you feel a tickle. In the morning a little green sprout is poking out of your left ear. \"ʻAh... no.\" At lunch a vine is curling out your nose. \"ʻAH, NO!\" By dinner there are leaves in your hair and a baby watermelon hanging off your elbow. \"ʻAH, NO! ʻAH, NO!\" A little hiccup of panic every time.","Your mom takes one look, picks the watermelon, cuts it and serves it for dessert. Then she plants the rest of you in the backyard and waters you twice a day. You grow 14 more watermelons."],"Pat your ear in panic, with a catch each time. \"ʻAh-no-ʻAH-no!\"","Kanu means to plant, so kanu i ka ʻanoʻano means plant the seed.",null,"Watermelon vine growing out of your nose"],["n331","n",331,"lālā","laah-LAAH","branch","LAAAA-LAAAA!",["You climb the mango tree in your backyard and crawl out on a branch. You sing to scare away the mynah birds. \"LAAAA-LAAAA!\"","The branch creaks. It grows. It stretches out one foot.","Interesting. You sing longer. \"LAAAAAAAA-LAAAAAAAA!\" The branch shoots out over the fence, over the neighbor's carport, over their dog. The longer you hold the note, the longer it grows.","You take a huge breath and hold it for thirty seconds. The branch reaches across the whole street and taps on Aunty Fay's kitchen window. She opens it and hands you a malasada.","Then you run out of air. The branch snaps back like a tape measure and you land in your own yard, still holding the malasada."],"Hold both sounds long, like the branch is growing. \"Laaah-LAAAH.\"",null,null,"Singing kid on a stretching mango branch"],["n332","n",332,"ʻōhiʻa","oh-HEE-ah","ʻōhiʻa lehua tree","Ohhh... HERE-ʻah!",["You are standing on a brand new lava field on the Big Island. Everything is black and shiny and cracked for miles. No grass. No bugs. Nothing.","A park ranger with a clipboard is taking roll call for the plants. \"Grass?\" Silence. \"Fern?\" Silence. \"Mango?\" Definitely not.","\"ʻŌhiʻa?\"","From a tiny crack, a little tree about six inches tall pokes up through the rock. It has gray-green leaves and one bright red pom-pom flower on top. In a tiny proud voice it answers \"Ohhhhhh... HERE-ʻah!\" A long oh, then a hiccup of nerves.","The ranger smiles and checks the box. You clap. The little tree stands up straighter. It is going to be here for hundreds of years, and it was the first one to show up."],"Raise your hand for roll call. \"Oh-HEE-ʻah!\"","ʻŌhiʻa is often the first tree to grow on new lava. A disease called Rapid ʻŌhiʻa Death is killing many of them, so clean your shoes before and after forest hikes.",null,"Tiny tree answering roll call on lava"],["n333","n",333,"lehua","leh-HOO-ah","lehua blossom","Lay... WHOA!",["Up in the rainforest you find an ʻōhiʻa tree covered in lehua blossoms. Each one is a fluffy red pom-pom made of a hundred tiny threads, like a cheerleader's pom-pom that shrank in the wash.","You reach out to pick one for a lei. \"Lay...\"","Out of the blossom pops a tiny red bird with a curved black beak. It has had its whole face buried in the nectar, and it comes out wearing a yellow pollen mustache. It looks at you. You look at it. \"Lay... WHOA!\"","It chirps, dives back in, and drinks some more. You decide this one is not for you. You leave it for the bird. Good choice, because the old folks say if you pick lehua on the way up the mountain, it will rain on you."],"Reach for a flower, then jump back. \"Leh-HOO-ah!\"","Red lehua is the official flower of Hawaiʻi Island. The ʻapapane, a red native honeycreeper, loves its nectar.",null,"Red bird with pollen mustache in blossom"],["n334","n",334,"hala","HAH-lah","pandanus tree; fault, sin","HAH-LAH!",["Uncle parks his brand new truck under the hala tree at the beach. The hala tree has roots that stand up like stilts, long spiky leaves, and fruit that looks like a pineapple somebody built out of orange building blocks.","You say \"Uncle, maybe no park there.\"","Uncle says \"Ah, no worry.\"","THUNK. A hala fruit the size of a basketball drops right on the hood. Uncle hollers \"HAH-LAH!\" He points at you. \"Your fault!\" You point at your cousin. Your cousin points at the dog. The dog points at the tree with its nose.","The tree just stands there on its stilt legs, guilty. The hala was the hala all along."],"Holler and point at the tree. \"HAH-lah!\"","The long leaves of the hala, lauhala, are woven into mats, hats and baskets. Hala also means to pass by or to miss.",null,"Hala fruit dents Uncle's new truck"],["n335","n",335,"maile","MAI-leh","maile vine","MY LEI!",["It is graduation night. Your cousin Kanoe walks off the stage with so many lei she can only see out of a small hole at the top. Candy lei, money lei, ribbon lei, a lei made of gummy bears.","But one lei is special. Uncle hiked six hours up into the mountains to find the maile vine. He carefully slipped out the woody centers and draped it open around her neck, long and green and smelling like sweet forest.","At the party a little kid grabs the end of it. Kanoe does a karate move she did not know she had and yells \"MY LEI!\" The whole tent goes quiet. The kid lets go. Kanoe pats the maile softly. \"MY lei.\"","She wears it all night. She sleeps with it next to her pillow."],"Hug your chest like you are guarding a lei. \"MAI-leh!\"","Maile lei are usually worn open, hanging down on both sides, not tied, at weddings and graduations.",null,"Graduate guarding her maile lei"],["n336","n",336,"ʻilima","ee-LEE-mah","ʻilima flower","ʻEEE, LEE-MAH!",["Aunty Lima is making an ʻilima lei for a wedding. The ʻilima flower is small, orange-yellow and thin as tissue paper. One lei takes hundreds and hundreds of them. Aunty wants exactly 700.","You have been picking since sunrise. Your fingers are orange. There is orange in your hair. You walk in with a bucket and dump it on the table. Aunty Lima counts. And counts. \"699.\"","She looks at you over her glasses. You run back out.","You search every bush. You search your pockets. At last you find one tiny flower stuck to the bottom of your slippah, a little flat but still orange. You gasp so hard you hiccup, then run in holding it up like a gold medal. \"ʻEEE, LEE-MAH! Number 700!\"","She strings it on. Perfect."],"Hold up one tiny flower. \"ʻEe-LEE-mah!\"","ʻIlima is the official flower of Oʻahu.",null,"Kid holding up the 700th flower"],["n337","n",337,"pīkake","pee-KAH-keh","jasmine; peacock","PEEEEEK-a-CAKE!",["It is your birthday and the cake is huge. Three layers, white frosting, and tiny white jasmine flowers all over the top that make the whole room smell sweet.","You lean in to blow out the candles. Something moves behind the cake. A peacock pops up, all blue neck and shiny eyes, and screams \"PEEEEEEK... a CAKE!\" Then it throws open its tail. Two hundred green and gold eyes fan out and knock every plate off the table.","It does it again. Ducks down behind the cake. Pops up. \"PEEEEEK-a-CAKE!\" Long first sound every time, like a squeaky door.","Everyone is terrified, but the cake is fine. The peacock eats one jasmine flower off the top, very politely, and walks out the back door."],"Pop up from behind your hands. \"Peeee-KAH-keh!\"","The word means both jasmine and peacock. A Hawaiian princess loved her peacocks and the flower so much that the flower got the bird's name.",null,"Peacock playing peekaboo behind jasmine cake"],["n338","n",338,"melia","meh-LEE-ah","plumeria","MEL! LEE-AH!",["Grandma has twins, Mel and Leah, and a plumeria tree in the front yard the size of a house. The tree has one strange habit. Every time somebody yells, it drops flowers.","Mel and Leah are always in trouble. \"MEL! LEE-AH!\" Grandma yells from the porch. Fifty pink and white flowers rain down.","\"MEL! LEE-AH! Get in here!\" Two hundred more.","By the end of the day the twins are standing waist deep in plumeria. They smell amazing. The mailman is sneezing. Grandma cannot even see the driveway. She stops yelling and just waves them in with a broom. The tree drops one last flower, very gently, right behind Grandma's ear."],"Yell for the twins from the porch. \"Meh-LEE-ah!\"","Melia probably comes from the English word plumeria.",null,"Twins waist deep in plumeria flowers"],["n339","n",339,"aloalo","ah-lo-AH-lo","hibiscus","ALLO? AH-lo?",["In Aunty's garden there is a red hibiscus the size of a satellite dish. Five big petals open wide, and the long yellow stick in the middle pokes out like an antenna.","It picks up phone calls.","You walk by and it rings. BRRRING. The flower turns toward you and a voice comes out of it. \"Allo? AH-lo? Allo?\" You lean in and answer. It is a bee in Kona asking for directions.","Now it rings all day. \"Allo? Allo?\" Bees, moths, a gecko who wants to order pizza. Aunty puts a sign in the yard that says FLOWER IS NOT A PHONE. Nobody listens. Somebody from Kauaʻi calls at 3 in the morning to ask what time it is."],"Hold an invisible flower to your ear. \"Ah-lo-AH-lo?\"","The native yellow hibiscus, maʻo hau hele, is the state flower of Hawaiʻi.",null,"Giant hibiscus answering phone calls"],["n340","n",340,"kou","KO-oo","kou tree","Kohhhh... OOOOH!",["Uncle Ben is a woodcarver. For three months he has been carving one bowl out of a single chunk of kou wood, from a tree with orange flowers that grows near the beach.","Today he finishes. He rubs on the oil. The whole family is sitting in the garage waiting.","He lifts the cloth. The bowl glows. The wood has swirls of gold and dark brown like a sunset caught in a wave. Everybody leans in at once and makes the same sound.","\"Kohhhhhh... OOOOOH.\"","The neighbors come over to see. \"Kohhhh... OOOH.\" The mailman. \"Kohhhh... OOOH.\" A dog. \"Kohhhh... wooo.\" Uncle has to hide the bowl in his closet so people stop coming over. They still stand in his yard, saying it at the house."],"Admire an invisible bowl. \"KO-oo.\"","Kou also means your. ʻO wai kou inoa? means What is your name?",null,"Family oohing at a glowing wooden bowl"],["n341","n",341,"milo","MEE-lo","milo tree","ME? LOW?",["At the beach park there is a big milo tree with heart-shaped leaves and yellow flowers. Its branches hang so low over the sand that you have to bend to get under them.","Your cousins turn it into a limbo contest. First round is easy. Round two you bend back. By round five the only way through is under the lowest branch, one foot off the sand.","It is your turn. Everybody is chanting. You point at yourself. \"ME? LOW?\" You bend back. Your knees shake. Your sunglasses slide into your hair. \"ME! LOW!\" You shimmy under so low your back leaves a trench in the sand.","You win. The prize is you get to lie in the shade of the milo for the rest of the day while everybody else sets up the tent."],"Bend back like you are doing the limbo. \"MEE-lo.\"","Milo wood is prized for bowls, just like kou. Milo also means to twist, like twisting cord.",null,"Limbo under a low milo branch"],["n342","n",342,"wauke","VOW-keh","paper mulberry","WOW. KAY.",["Your friend Kay comes over and finds Aunty in the carport with a strip of bark and a wooden beater. The bark is from the wauke plant, soaked for days, and it is two inches wide.","Aunty beats it. Tok tok tok. Hours of tok tok tok. The strip gets thinner and wider. Four inches. A foot. Two feet. A sheet as soft as paper.","Kay watches all afternoon. When Aunty finally holds up the finished sheet, it is big enough to wrap Kay like a present. You turn to her and say \"WOW. KAY.\" She says \"Wow is right.\"","So Aunty wraps Kay in it, ties it with string, and stands her in the front yard. The neighbor thinks it is a present and leaves a card."],"Pound your fist on the table, tok tok tok. \"VOW-keh.\"","Wauke bark is beaten into kapa, Hawaiian bark cloth.",null,"Aunty beating bark into a giant sheet"],["n343","n",343,"noni","NO-nee","noni fruit","NO, NEE!",["Your little sister Nee is two and she has found a noni fruit under the tree. It is lumpy, pale yellow, covered in little bumps like a toad, and it smells like stinky cheese left in a hot car for a week.","She thinks it is a ball.","She picks it up and waddles toward you with it held up high. The smell arrives three seconds before she does. Your eyes water. The dog runs under the house.","\"NO, NEE! NO! NEE!\" She thinks it is a game. She laughs and speeds up. You run. She runs. Around the house, twice.","Tūtū steps out, takes the noni from Nee, squeezes it into a cup and drinks it. The whole family stares. Tūtū says \"What? Good for you.\""],"Hold your nose and back away. \"NO-nee!\"","Noni is a canoe plant, one of the plants early voyagers carried to Hawaiʻi.",null,"Toddler chasing you with stinky fruit"],["n344","n",344,"hāpuʻu","haah-POO-oo","tree fern","HAAAAA... POOF! ʻOoh.",["You are hiking near the volcano on the Big Island in a forest of tree ferns. They are twenty feet tall, like giant green umbrellas. New fronds curl up at the top like huge fuzzy question marks.","The trunks are covered in soft golden fuzz. Your friend says \"Pat it.\" You pat it.","\"HAAAAAAA...\" A long sigh comes out of the tree. Then POOF. A cloud of golden fluff blows out all over you, into your hair and up your nose. You sneeze, you hiccup, and you say \"ʻOoh.\"","Haaaa, poof, ʻooh. Now you look like a baby chick. Your friend laughs so hard he falls into another tree fern. HAAAAAA... POOF. Now you are both chicks."],"Pat the air, then flinch at the fluff. \"Haaah-POO-ʻoo.\"","Long ago, the golden fluff from hāpuʻu, called pulu, was used to stuff pillows and mattresses.",null,"Tree fern poofing golden fluff on you"],["n345","n",345,"kiawe","kee-AH-veh","kiawe tree (mesquite)","KEE! AHHHH! Vehhh.",["The beach on the west side is lined with kiawe trees. Twisty gray trunks, tiny leaves, and thorns an inch long that fall on the sand and wait for you.","You forget your slippahs. You step on one.","The pain comes in three stages. First a small squeak. \"KEE!\" Then the real scream. \"AHHHHHH!\" Then you run out of breath and it comes out like a sad goat. \"Vehhhh.\"","Uncle pulls out the thorn with the tweezers he keeps in his tackle box for this exact reason. Then he picks up the dead branch that dropped it, breaks it up and throws it in the grill. The kiawe smoke makes the best teri beef you ever had. You eat it with your foot up on the cooler."],"Hop on one foot. \"Kee-AH-veh!\"","Kiawe wood is a favorite for smoking and grilling meat, and kiawe honey comes from its flowers.",null,"Barefoot kid stepping on kiawe thorn"],["n346","n",346,"mauʻu","MOW-oo","grass","MOW... ʻOOH!",["You live in Mānoa, where it rains every day. The grass in your yard grows so fast you can hear it. Creak, creak, creak.","Dad hands you the mower. \"MOW.\" You start at the front. By the time you reach the back, the front is up to your knees again. You mow faster. The grass grows faster. It is up to your waist. Then your chest.","Dad comes out to check. The grass is ten feet tall. There are wild pigs living in it. A family from the continent is lost in it with a map. You pop out the top, green from head to toe, and gasp with a catch in your throat. \"MOW... ʻOOH.\"","Dad nods, goes back inside, and comes out with a goat."],"Push an invisible mower, then gasp. \"MOW-ʻoo.\"","Mauʻu covers grasses, sedges and rushes in general.",null,"Kid lost in ten foot grass"],["n347","n",347,"olonā","oh-lo-NAAH","olonā fiber plant","HOLD ON... naaaaah.",["You are dangling off the edge of a cliff, holding a cord no thicker than a spaghetti noodle. Below you is a 500 foot drop into the sea.","Your friend at the top panics. \"HOLD ON!\" Then he looks closer at the cord and waves his hand. \"Naaaaah. Relax. Is olonā.\"","The cord is made from olonā fiber. You are holding it with one hand. Your friend ties a piano to your foot to prove it. Then a canoe. Then his grandpa, who is eating a plate lunch. The cord does not even stretch.","\"HOLD ON... naaaaaaah,\" your friend says again, holding the nah long and lazy because he is not worried at all. He goes to get a snack. You hang there with the piano, the canoe and the grandpa, watching the sunset."],"Grip an invisible rope and relax. \"Oh-lo-NAAAH.\"","Olonā makes one of the strongest plant fibers in the world. It was used for fishing line, nets and the backing of feather capes.",null,"Spaghetti cord holding piano and grandpa"],["n348","n",348,"palapalai","pah-lah-pah-LAI","lace fern","Pa! La... Pa, LIE still!",["Tūtū wants a new pattern for Pa's aloha shirt. She has an idea. She lays Pa on the lawn in his plain white shirt, then covers him with palapalai, the lacy fern that looks like green snowflakes.","Then she gets out a can of blue spray paint.","Pa wiggles. \"PA!\" Pa scratches his nose. She starts to yell \"La...\" for lay, then remembers she was an English teacher for forty years and fixes it. \"PA, LIE STILL!\"","Pa, la, Pa, lie. She sprays. She lifts off the ferns. Pa's shirt is covered in perfect white lace ferns on a blue background. He looks like the fanciest man in Kāneʻohe.","He wears it to church. Six aunties ask where he bought it."],"Hold perfectly still, then say it. \"Pah-lah-pah-LAI.\"","Palapalai is a favorite fern for hula lei and is linked to Laka, the goddess of hula. Don't mix it up with palapala, which means a document.",null,"Tūtū spray painting fern pattern on Pa"],["n349","n",349,"ʻōhelo","oh-HEH-lo","ʻōhelo berry","Ohhhh, HELLO!",["Your friend Jake is visiting from the continent. You take him hiking at the volcano. It is cold and foggy and the ground is black lava and low shrubs.","Jake is hungry and complaining. Then he sees a bush covered in little red berries, shiny and round like tiny cherry tomatoes. His eyes go wide. He says it the way people do when they see a brand new sports car. \"Ohhhhhhh... HELLO!\"","He reaches for a handful. Your aunty grabs his wrist. \"Wait.\" She picks a few berries and sets them aside first, as an offering to Pele, whose home this is. She nods at the crater. Then she nods at Jake.","Jake eats one berry. It is sweet and a little tart. \"Ohhhh, hello,\" he whispers, much more politely."],"Spot a berry bush and light up. \"Ohhh-HEH-lo!\"","ʻŌhelo berries are sacred to Pele. Traditionally, you offer some to her before eating any.",null,"Hiker spotting red berries at the volcano"],["n350","n",350,"kaona","kah-OH-nah","town; hidden meaning","CAR OWNER!",["There is a tiny town on the island with one gas station, one store and exactly one car. It belongs to Uncle Pono, a 1972 station wagon. When he drives by, the kids run along beside it yelling \"CAR OWNER! CAR OWNER!\"","Every evening he drives slow down the one street with the windows down, singing songs he wrote himself. Tonight he sings \"The sweet mango on the high branch is waiting for me after the rain.\"","Everybody in town knows what it means. It is not about a mango. It means Aunty Leilani better not buy the last mango in the store, because he wants it.","Aunty Leilani hears the song, walks to the store and eats that mango on the front steps. The car owner honks. The whole town laughs."],"Wave at a passing car. \"Kah-OH-nah!\"","Kaona meaning town comes from English. Kaona meaning hidden meaning is a treasured part of Hawaiian poetry and song, where the words say one thing and mean another.",null,"Car owner singing through tiny town"],["n351","n",351,"kūlanakauhale","koo-lah-nah-kow-HAH-leh","city","COOOL, LANA! COW, HOLLY!",["Two country cows, Lana and Holly, ride into Honolulu in the back of a truck for their very first trip to the big city.","Lana cannot stop saying cool. Tall buildings. \"Coooool.\" Traffic lights. \"Coooool.\" Escalators. She rides one up and down eleven times. \"Cooooooool.\"","Holly is too shocked to talk. She just stands in the middle of the crosswalk staring up at the skyscrapers while the light changes and a hundred cars honk.","The farmer runs back and forth trying to keep them together. \"COOOOL, LANA! COW, HOLLY! Let's go!\" Cool Lana. Cow Holly. People on the bus start chanting it. By the end of the day the whole city is chanting it. They only came to buy feed."],"Point up at tall buildings like Lana. \"Koo-lah-nah-kow-HAH-leh.\"","Kauhale is a group of houses, like an old Hawaiian homestead. A city is a whole lot of them.",null,"Two country cows gawking in Honolulu"],["n352","n",352,"alanui","ah-lah-NOO-ee","street, road","Ahh! La! NEW-ee!",["The city just paved your street. It is jet black, smooth as a bowling ball, and still steaming. The road crew guy is so proud he is standing on the sidewalk with his hands on his hips.","Then a chicken walks onto it.","Tiny chicken footprints, right down the middle. The crew guy screams \"AHHH!\" He grabs his rake. \"La! La! La!\" he yells, waving at the chicken. He chases it up the street, stepping in the hot road himself, leaving huge boot prints. \"My NEW-ee! My NEW-ee road!\"","The chicken escapes into a hedge. The crew guy looks back. His brand new street is covered in chicken tracks, boot prints and one lost slippah. He sighs and orders another truck of asphalt."],"Wave a rake at a chicken. \"Ah-lah-NOO-ee!\"","Ala means path and nui means big, so an alanui is a big path.",null,"Road crew chasing chicken on new asphalt"],["n353","n",353,"keʻena","keh-EH-nah","office","Kay? ʻEh... NAH.",["There is an office downtown with 400 desks, 400 phones and one person who is actually in charge. Her name is Kay. She sits in the corner office with the window, the good stapler and the key to the supply closet.","All day long people stand in line at her door. \"Kay, can I have a new chair?\" \"Kay, can I leave early?\" \"Kay, can I borrow the good pen?\"","Kay looks up. She thinks. She makes a little catch in her throat. \"Kay? ʻEh... NAH.\"","Every time. Forty times a day. The chair guy cries. The early guy stays till 9. By Friday the whole office just says it for her. They walk up, point at themselves, say \"Kay? ʻEh, nah,\" and walk back to their desks. Kay has never been prouder of her office."],"Lean back in an imaginary office chair. \"Keh-ʻEH-nah.\"","Keʻena can also mean a room or a department in a building.",null,"Office line while Kay says nah"],["n354","n",354,"mākeke","maah-KEH-keh","market","MAAAAA! CAKE-eh!",["Saturday morning at the farmers market. You and your mom walk past tables of papaya, apple bananas, big bunches of green onion and bags of boiled peanuts. Everybody is shouting prices.","Your mom is supposed to be buying vegetables. She is not buying vegetables. She has smelled something.","At the end of the last row an aunty is selling cake. Chocolate haupia cake. A whole one, as big as a truck tire. You grab Mom's arm and yell \"MAAAAAAA! CAKE-eh!\" holding the Ma as long as you can so she hears it over the crowd.","She hears it. She buys it. It takes the two of you, a hand truck and the guy from the papaya table to get it to the car. You forget the vegetables."],"Tug an invisible sleeve. \"Maaah-KEH-keh!\"","Mākeke comes from the English word market.",null,"Mom and kid hauling a giant cake"],["n355","n",355,"kahua","kah-HOO-ah","foundation; field, site","Ka-WHOOOA!",["Uncle Dennis builds a house on the hillside in one weekend. No foundation. He says foundations are for people who worry. He just sets the whole house down on the grass and moves in.","That night it rains. At 2 in the morning, the house starts to slide. Slowly at first. Then faster. Uncle wakes up in his bed going down the hill at twenty miles an hour. He yells out the window \"Ka-WHOOOOOA!\" all the way down, past three houses and a church, until he stops in somebody's taro patch.","The next weekend he tries again. This time he pours a foundation first. Forty trucks of concrete. He jumps on it. He drives on it. He has the whole family stomp on it. It does not move. Now Uncle Dennis worries a little, and sleeps great."],"Surf an invisible sliding house. \"Kah-HOO-ah!\"","Kahua also means a field or site. Kahua mokulele is an airport, a field for airplanes.",null,"House sliding downhill with no foundation"],["n356","n",356,"pāka","PAAH-kah","park","PAAAA! CAR!",["Sunday picnic at the park by the beach. Thirty relatives, four tents, a rice cooker plugged into the pavilion, kids everywhere.","Pa is late. He drives up in his old van, sees the parking lot is full, and keeps going. Right off the pavement. Onto the grass. Past the swings.","The aunties see him first. \"PAAAAAAAA! CAR!\" They hold the Pa so long it turns into a siren. Pa does not hear. He drives across the lawn, around the banyan tree, between two tents and parks right next to the food table.","He gets out and grabs a plate. \"What? Close to the food.\" The park ranger writes him a ticket. He eats with the ticket sticking out of his pocket, very happy."],"Point at a van on the grass. \"PAAAH-kah!\"","Pāka comes from the English word park.",null,"Pa's van parked beside the picnic table"],["n357","n",357,"kulanui","koo-lah-NOO-ee","university","COOL! A NEW ME!",["Move-in day at the university. Your parents drive you across the island in a car so full your little brother is riding inside the laundry basket.","You step out. There are buildings everywhere, students on skateboards, a library as big as a mountain. You have a new haircut. New shoes. New backpack. You throw your arms up and yell \"COOL! A NEW ME!\"","Everybody on the lawn turns around.","For the first week you really are the new you. You go to every class. You eat salad. You join the chess club, the canoe club and a club for people who like clubs.","By week three the old you shows up with a bag of chips and moves in. The two of you share the dorm room."],"Throw your arms up on move-in day. \"Koo-lah-NOO-ee!\"","Kula means school and nui means big, so a university is a big school. Kula kiʻekiʻe is high school.",null,"Freshman shouting on move-in day"],["n358","n",358,"heiau","hay-OW","temple","Hey... WOW.",["Your cousin Brandon is loud. He is loud in the car. He is loud eating chips. On the family drive around the island he is loud for three straight hours.","Then Tūtū has everybody stop and walk to a heiau. Brandon runs ahead with his bag of chips, talking the whole way.","He comes around the trees and stops. In front of him are stone walls taller than a man, built from thousands of rocks fitted together by hand without cement, standing for hundreds of years. The wind is the only sound.","Brandon's mouth opens. He whispers, very small, \"Hey... wow.\"","He puts the chips in his pocket. He does not climb. He does not touch the stones. He just stands next to Tūtū and looks. It is the quietest he has been in his whole life."],"Stop walking and whisper. \"Hay-OW.\"","Heiau are Hawaiian places of worship, and many are still sacred today. Look, but do not climb on, move or take the stones.",null,"Loud cousin silent before stone walls"],["n359","n",359,"ahupuaʻa","ah-hoo-poo-AH-ah","land division from mountain to sea","A HOOP! Poo... ʻAH-ah!",["You stand at the very top of the mountain with a giant hoop and give it a push.","It rolls down through the cool forest where the birds live. Along the stream. Past the terraces of kalo and the sweet potato patches. Past the houses. Across the fishpond wall. Down to the beach and out onto the reef. It never leaves your valley.","You run after it yelling \"A HOOP! A HOOP!\" And everywhere it passes, somebody has what they need. Wood, water, food, fish, all in one slice of land from the mountain to the sea.","At the very bottom it plops into the ocean. You run in after it. The cold water hits your legs and you gasp. \"Poo... ʻAH-ah!\"","A hoop, poo-ʻah-ah. The whole slice, top to bottom, feeding everybody."],"Trace a line from high to low with your hand. \"Ah-hoo-poo-ʻAH-ah.\"","The name comes from ahu (a stone pile) and puaʻa (pig). Boundaries were marked by a stone altar where a pig carving or pig offering was placed.",null,"Hoop rolling from mountain to sea"],["n360","n",360,"aupuni","ow-POO-nee","government","OW! PUNY!",["You go to the government office to get a permit for a doghouse. You take a number. You are number 4,812. They are on number 12.","Six hours later you reach the window. The clerk is a tiny man with tiny arms. He needs to stamp your form. The official stamp is the size of a surfboard and made of solid brass.","He tries to lift it. His arms shake. His face turns purple. He gets it two inches up and drops it on his own foot. \"OW!\" He looks at his arms in disgust. \"PUNY!\"","It takes him, two security guards and a lady from the next window to lift it. KA-THUNK. Approved. You go home and find your dog has already moved into your bed."],"Lift an invisible giant stamp. \"Ow-POO-nee!\"","Aupuni can also mean nation or kingdom. The Hawaiian Kingdom had its own aupuni too.",null,"Puny clerk lifting a giant stamp"],["n361","n",361,"mokuʻāina","mo-koo-AAH-ee-nah","state","Mo, COO! AAAAH... EE-nah!",["The school play is called Fifty States. Fifty kids, fifty costumes. Your little brother Mo is number 50, Hawaiʻi, the last one out, wearing eight cardboard islands on a string.","His one job is to make a soft cooing sound, like the doves in the backyard, when the lights hit him.","The lights hit him. He freezes. The teacher hisses from the side \"Mo, COO!\" He coos. The whole audience melts. \"Aaaaaaaah.\" Next, your little sister Ina, dressed as the ocean in three blue bedsheets, is supposed to roll across the stage. She doesn't. The teacher hisses again. \"EE-NAH!\"","Ina rolls. She rolls right into Mo. The islands go flying into the audience. Standing ovation. Mo, coo, aaah, Ina. Best state in the show."],"Coo like a dove, then let out a long ahh. \"Mo-koo-AAAH-ee-nah.\"","Moku means island or district and ʻāina means land. Hawaiʻi became the 50th state in 1959.",null,"Kid wearing cardboard islands in school play"],["n362","n",362,"kaʻa","KAH-ah","car","KA... ʻAH!",["Aunty Mae's car is forty years old. It is three colors, none of them original. The driver's seat is a beach chair. It has 600,000 miles on it, and it has the hiccups.","Every time she turns the key it goes \"KA... ʻAH!\" and jumps a foot in the air. Hiccup. She puts it in drive. \"KA... ʻAH!\" Hiccup. The car hops down the street like a kangaroo.","She tries everything. She pours water in it. She scares it with a horn. She tells it to hold its breath. Nothing works.","She drives it to the drive-in anyway. It hiccups so hard in the line that the lady has to hand Aunty Mae her plate lunch through the sunroof."],"Turn an invisible key and hiccup. \"KAH-ʻah!\"","Kaʻa also means to roll or to turn, which is exactly what wheels do.",null,"Old car hiccuping down the street"],["n363","n",363,"kaʻaahi","kah-ah-AH-hee","train","Kah... ʻah... AH... HEEE! (a fire sneeze)",["The old sugar train on the plantation is tired. It is black and rusty, and it has a cold.","Every mile it slows down, wobbles, and wheezes like it is about to sneeze. \"Kah... ʻah... AHHH...\" All the passengers grab their seats. \"...HEEEE!\" It sneezes fire. A big orange blast out of the smokestack. It singes the tops of the cane, lights up the sky and scares every mynah bird for a mile.","Then it feels better and chugs on. Choo choo. Another mile. \"Kah... ʻah... AHHH... HEEE!\" Fire sneeze.","The conductor keeps a box of tissues the size of a refrigerator. The tissues catch fire. He gives up and hands out marshmallows to the passengers in the back car."],"Wind up a big sneeze. \"Kah-ah-AH-hee!\"","Kaʻa means car and ahi means fire. A train is a fire car, named for the old steam trains.",null,"Sugar train sneezing fire"],["n364","n",364,"kaʻa ʻōhua","KAH-ah oh-HOO-ah","bus","Kaʻa... OHHH, WHOA!",["You get on the bus in the morning. It is full. You squeeze in anyway. Somebody's surfboard is in your ear. Somebody's aunty is standing on your foot. There is a guy with a tuba, a lady with nine chickens in a box and a kid holding a birthday cake over his head.","The bus pulls out. Then the driver takes the corner onto the highway way too fast.","Everybody slides to the left at the same time. Surfboard, aunty, tuba, chickens, cake. Fifty people say it together, long and loud. \"Ohhhhhhh... WHOA!\"","Next corner, they all slide right. \"Ohhhhhhh... WHOA!\"","When you finally get off at your stop, you have somebody else's slippah, a feather in your hair and frosting on your elbow."],"Lean hard to one side. \"KAH-ʻah oh-HOO-ah!\"","ʻŌhua means passengers, so a bus is a passenger car. Remember the hiccuping kaʻa?",null,"Packed bus with everyone sliding left"],["n365","n",365,"mokulele","mo-koo-LEH-leh","airplane","MO' UKULELE!",["The airplane to Maui is ready to take off. The pilot gets on the speaker. \"Fo
