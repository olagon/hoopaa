lks, we have a problem. The engines are not working. We need... mo' ʻukulele.\"","Every passenger pulls out an ʻukulele. Two hundred of them. The pilot counts. \"Not enough. MO' UKULELE!\"","The flight attendants pass out more from the overhead bins. An aunty in row 12 has four in her purse. Everybody starts strumming the same song, and the plane starts to rise. Faster strumming, higher plane. Somebody plays a wrong chord and the plane dips over Molokaʻi. Everybody screams and strums harder.","You land in Kahului to a standing ovation from the whole airport. Your fingers are numb. Nobody remembered the luggage."],"Strum an invisible ʻukulele faster and faster. \"Mo-koo-LEH-leh!\"","Moku means ship and lele means to fly, so an airplane is a flying ship. ʻUkulele has lele in it too.",null,"Plane flying on ʻukulele strumming"],["n366","n",366,"waʻa","VAH-ah","canoe","WAAAAH... ʻAH!",["The canoe club is racing tomorrow and they have a secret weapon. It is Aunty's baby.","The baby sits in the middle of the canoe in a tiny life jacket. When the baby is happy, the canoe just floats. But when the baby cries \"WAAAAAH... ʻAH!\", with that little hiccup at the end, all six paddlers panic and dig in at once, so hard the canoe jumps out of the water.","At the race, the horn goes. The baby is asleep. Nobody moves. The other canoes are gone.","Aunty takes away the pacifier. \"WAAAAAH... ʻAH!\" The canoe takes off like a rocket. It passes every boat, crosses the finish line, slides up the beach and ends up on a lawn at a birthday party. The baby gets the pacifier back and a trophy."],"Do a baby cry with a catch at the end. \"VAH-ʻah!\"","A waʻa kaulua is a double-hulled voyaging canoe.",null,"Crying baby powers racing canoe"],["n367","n",367,"kalaka","kah-LAH-kah","truck","Ka-LAH-ka! Ka-LAH-ka!",["Your big brother Kawika's truck is lifted so high you need a ladder to get in. The tires are taller than you. The exhaust pipe is the size of a trash can.","When he starts it in the morning the whole neighborhood hears it. \"Ka-LAH-ka... ka-LAH-ka... ka-LAH-ka...\" Windows rattle. Car alarms go off. A dog down the street packs a little bag and leaves.","He drives you to school in it. You climb down from the passenger door on a rope. Kids stare. The principal stares. The truck idles at the curb. \"Ka-LAH-ka, ka-LAH-ka.\" The flag on the pole flaps from the exhaust.","At pickup you can hear it coming from three neighborhoods away. The whole class says it at the same time. \"Ka-LAH-ka.\""],"Rev an invisible engine. \"Kah-LAH-kah!\"","Kalaka comes from English truck. English words borrowed into Hawaiian often swap t for k and r for l.",null,"Monster truck shaking the neighborhood"],["n368","n",368,"paikikala","pai-kee-KAH-lah","bicycle","PIE! KEY! CAR-la!",["Your big sister Carla is riding her bicycle to Grandma's house on the other side of the hill. In the basket is a warm apple pie. Around her neck is the key to Grandma's house.","She pushes off. Mom runs out of the house yelling after her. \"PIE! KEY! CARLA!\" She wants to make sure Carla has both.","Carla hears \"pie\" and checks the basket. She hears \"key\" and checks her neck. She hears \"CARLA\" and looks back, and that is exactly when she hits the bump.","The bicycle flies. The pie flies. The key flies. Carla flies. They all land in Grandma's yard in one neat little pile. Grandma looks down from the porch. Pie, key, Carla. \"Right on time.\""],"Pedal your hands in circles. \"Pai-kee-KAH-lah!\"","Paikikala comes from the English word bicycle.",null,"Carla, pie and key flying off a bike"],["n369","n",369,"uapo","oo-AH-po","wharf, pier","WHOA, PO!",["Uncle Po goes fishing at the end of the old wooden pier every Saturday. He does not believe in packing light. He brings nine coolers, sixty fishing poles, a grill, a couch and a TV.","Every step he takes, the planks bend lower. Creeeeak. Creeeeak. The fish underneath look up nervously.","The kids on the pier point and scream \"WHOA, PO! WHOA, PO!\" He does not listen. He sets down the couch. The end of the pier sinks into the water like a slide. Uncle Po rides down it on his couch, into the harbor, still holding a pole.","He comes up with his hat still on, spits out water, and holds up a fish. Somehow he caught one. He climbs back up onto the wharf and nobody says another word."],"Tiptoe on an invisible creaky pier. \"Oo-AH-po!\"","Uapo comes from the English word wharf.",null,"Uncle on couch sliding off pier"],["n370","n",370,"loko iʻa","LO-ko EE-ah","fishpond","LOCO! EE-ʻah!",["Along the shore there is a big fishpond with a rock wall around it. In the wall is a wooden gate with little slots, called a mākāhā. Baby mullet swim in through the slots from the ocean. The pond is full of food. They eat. And eat. And eat.","Three months later one fat mullet decides to swim back out to sea. He goes to the gate. Too fat. He tries sideways. Too fat. He tries backwards.","He goes loco. He spins in circles, slaps the water with his tail and screams \"LOCO! EE-ʻah! I'm going LOCO!\"","The other fat fish float by, chewing, not worried. A tiny new fish swims in through the slot, looks at him, and says \"What? The food is good.\" The fat mullet sighs and eats another bite of algae."],"Spin your finger next to your head. \"LO-ko EE-ʻah!\"","Loko means pond or inside, and iʻa means fish. Small fish swim in through the mākāhā gate, grow fat, and cannot swim back out.",null,"Fat mullet stuck behind fishpond gate"],["n371","n",371,"haʻawina","hah-ah-VEE-nah","lesson; homework","HA! ʻAh... VIENNA!",["You walk into class. Your teacher holds out her hand for the homework. You say \"My dog ate it.\"","She laughs. \"HA!\"","You dig in your backpack to prove it. You pull out your homework. It is soaked, greasy and wrapped around an open can of Vienna sausage. You forgot you packed your snack in there. There are little sausage bites all through the page.","She gasps with a little catch. \"ʻAh...\" She stares. \"VIENNA?\"","Ha. ʻAh. Vienna. The whole class leans in. The paper smells like lunch. She thinks about it for a long time. Then she gives you an A for honesty, and a lesson you will never forget. Do not pack meat with your homework."],"Hold up a soggy paper. \"Hah-ʻah-VEE-nah.\"","Haʻawina is related to hāʻawi, to give. A lesson is something given to you.",null,"Homework wrapped around Vienna sausage can"],["n372","n",372,"huaʻōlelo","hoo-ah-oh-LEH-lo","word","WHO? AH! Ohhh, HELLO!",["There is an egg on the kitchen table. Nobody knows who put it there. It starts to shake.","Your brother says \"WHO?\" The egg cracks. \"AH!\" says Mom.","Out climbs something small and wet and wobbly. It is not a chick. It is a word. Five little letters standing in a row, H, E, L, L, O, shaking off bits of shell.","It looks up at the family and says in a tiny voice \"Ohhhh... HELLO!\"","Remember the ʻōhelo berries? Same greeting, but this time it hatched. The word runs around the table, jumps in the rice, and hides under a napkin. By dinner there are twelve more eggs. Every one hatches a different word. By bedtime your kitchen is full of words."],"Crack an invisible egg and greet what comes out. \"Hoo-ah-ʻoh-LEH-lo!\"","Hua means egg, fruit or seed, and ʻōlelo means speech or language. A word is a little egg of speech.",null,"Egg hatching the word HELLO"],["n373","n",373,"māmalaʻōlelo","maah-mah-lah-oh-LEH-lo","sentence","Maaaaama lla... oh, HELLO!",["The words that hatched in your kitchen have a problem. They run around one at a time and nobody can understand them. \"Rice!\" \"Tuesday!\" \"Slippah!\" It makes no sense.","So you call in a mama llama. She is big and fluffy and very organized. She walks into the kitchen and the words fall in line behind her like ducklings. Then she hooks them together, nose to tail, into one long train.","\"Grandma. Wants. The. Rice. On. Tuesday.\"","It finally makes sense. You start to say \"Maaaaaama lla...\" but the train of words turns around and cuts you off. \"Oh, HELLO!\"","That little train of words is a sentence. The llama bows, eats a slippah, and leaves."],"Line up your fingers like a train. \"Maaah-mah-lah-ʻoh-LEH-lo.\"","Māmala means a piece or fragment, so a sentence is a piece of speech.",null,"Mama llama leading a train of words"],["n374","n",374,"moʻolelo","mo-oh-LEH-lo","story; history","Mo... ʻoh, HELLO!",["Remember the lizards from moʻo, lined up from the little gecko to the giant dragon? They are back, and tonight they are telling a story.","The tiny gecko on your wall starts it. \"Mo... ʻoh, HELLO. Long time ago...\" He tells the first part and passes it to the lizard next to him. That one tells the next part and passes it on. Down the line it goes, out the window and across the yard, bigger lizard, bigger voice, same story.","At the very end, the dragon, still lying on your crushed mango tree, finishes it in a voice like thunder. You have been listening for three hours.","Then the little gecko on the wall says \"Mo... ʻoh, HELLO,\" and starts it all over again for your little brother."],"Lean in like it is story time. \"Mo-ʻoh-LEH-lo.\"","Moʻo means succession and ʻōlelo means speech, so a story or history is speech passed along a line.",null,"Lizards passing a story down the line"],["n375","n",375,"inoa","ee-NO-ah","name","Eeee, NOAH?",["It is the first day of school. The new teacher has a class of thirty kids. She looks at her list. Something is wrong with the list.","She says \"Okay, when I call your name, raise your hand. Noah?\"","Thirty hands go up.","She squints at the list. Every single name is Noah. Noah K. Noah M. Noah with the curly hair. There are even two girls named Noah. She squeaks \"Eeeeee... NOAH?\" and all thirty kids stand up at once, knocking over their chairs.","Name tags do not help. Every name tag says Noah. By lunch she gives up and calls everyone by their shoe color. Blue Shoes Noah. Red Slippah Noah. It works great until everybody goes barefoot for PE."],"Point to your chest. \"Ee-NO-ah.\"","ʻO wai kou inoa? means What is your name? Answer with ʻO ... koʻu inoa, like ʻO Noah koʻu inoa.",null,"Thirty kids all named Noah"],["n376","n",376,"huahelu","hoo-ah-HEH-loo","numeral, digit (written number)","WHOA, hey LOU!",["Remember Uncle Lou, the fisherman with the chanting ʻōpelu? On Friday nights he runs bingo at the community hall. Two hundred aunties, two hundred dauber pens, total silence.","Lou turns the cage. The balls tumble. He pulls one out and reads the number. \"B... 7!\" An aunty in the back jumps up. \"WHOA! HEY, LOU!\"","He pulls another. \"G... 52!\" \"WHOA, HEY LOU!\" Every time a number hits, somebody screams it.","By 9 o'clock twelve aunties are standing on their chairs shouting \"WHOA, HEY LOU!\" at every single number, even the ones not on their cards. Lou keeps calling. Numbers, numbers, numbers. He has to stand on the table to be heard. Somebody wins a rice cooker. Somebody else cries."],"Dab an invisible bingo card. \"Hoo-ah-HEH-loo!\"","Helu means to count. Helu kelepona is a phone number.",null,"Aunties screaming at bingo numbers"],["n377","n",377,"palapala","pah-lah-PAH-lah","document; writing","PAULA! PAULA!",["Paula works at the county office in charge of documents. Forms, letters, permits, receipts. She has not seen the floor of her office in eleven years.","Today the boss needs one document, one single sheet from 2004. He walks into her office and it is paper to the ceiling. Nine feet of stacks. He cannot see her. He yells \"PAULA! PAULA!\"","The stacks shift. From somewhere in the middle, a hand pops up holding exactly the right sheet.","Then the stacks start to fall. Documents avalanche out the door, down the hall and into the elevator. The whole fourth floor is buried in writing. From under the pile you hear the boss, very small. \"Paula... Paula...\" Paula climbs out on top, sits down and starts filing."],"Wave a sheet of paper over your head. \"Pah-lah-PAH-lah!\"","Palapala hānau is a birth certificate. Don't mix it up with palapalai, the lace fern, which adds an i.",null,"Boss buried in an avalanche of paper"],["n378","n",378,"haʻuki","hah-OO-kee","sport","HA... ʻOO-KEE! (hockey with a hiccup)",["Coach Kalani decides Hawaiʻi needs ice hockey. There is no ice. He does not care.","He rents the biggest shave ice machine he can find and runs it for nine hours straight on the tennis court. Rainbow shave ice, two feet deep, from net to fence. Strawberry at one end. Lemon lime in the middle. Both teams in slippahs and helmets.","He drops the puck. It is a frozen spam musubi. Everybody goes for it. Everybody slips. A kid does a triple spin on the lemon lime and scores. The crowd screams \"HA... ʻOO-KEE!\" like hockey with a hiccup in the middle.","By the third period the court is one big syrup puddle and both teams are sticky and blue. The coach calls it the greatest sport ever invented."],"Slap an invisible puck. \"Hah-ʻOO-kee!\"","Haʻuki is sport in general. Pōpeku, football, is one haʻuki.",null,"Hockey game on a shave ice court"],["n379","n",379,"pōpeku","poh-PEH-koo","football","POOOOKE! PECK! OOOO!",["Big football game at the park. Last play. Your team is down by three. Your cousin lines up to kick a field goal. Everybody holds their breath.","He kicks. The ball flies high, spinning, perfect. And a wild rooster flies up out of the bushes and meets it in the air.","The rooster lands on top of the ball and rides it down like a surfboard. The whole crowd calls out what happens next. It pokes the ball with its foot. \"POOOOOKE!\" It pecks the laces. \"PECK!\" The ball starts hissing air. \"OOOOOO!\"","Poke, peck, ooo. The ball lands in the end zone, flat as a pancake, with the rooster standing on it. The ref thinks for a long time. Then he signals good. Three points. The rooster gets carried off the field on everybody's shoulders."],"Kick an invisible ball. \"Pohhh-PEH-koo!\"","Peku means to kick, so pōpeku is a kick ball.",null,"Rooster riding a football to the end zone"],["n380","n",380,"ʻoihana","oy-HAH-nah","job, profession, business","OY! HANNAH!",["Hannah has fourteen jobs. At 4 a.m. she fries malasadas. At 7 she drives the school bus. At 9 she is a lifeguard. At noon she cleans teeth. At 3 she teaches ʻukulele. At 6 she fixes cars. At 9 at night she is a DJ on the radio.","Everywhere she goes, somebody needs her. \"OY! HANNAH! The malasadas are burning!\" \"OY! HANNAH! My tooth!\" \"OY! HANNAH! My car!\"","She is so good at every job that people follow her from one to the next. The kid from the bus is at the dentist. The dentist is at ʻukulele class. The ʻukulele class is getting their cars fixed.","Her business card is the size of a pizza box. She never sleeps. She says she is fine."],"Wave both arms to get Hannah's attention. \"ʻOy-HAH-nah!\"","You can hear hana, the word for work, hiding inside ʻoihana.",null,"Hannah juggling fourteen jobs"],["n381","n",381,"mea","MEH-ah","thing; person who","Meh. AH!",["Aunty is having a garage sale. Her garage holds 3,000 things. She has not thrown away one thing since 1979.","You pick up a thing. A lamp shaped like a pineapple. \"Meh.\" You put it down. You pick up another thing. A box of rubber slippahs, all left feet. \"Meh.\" A cassette tape. \"Meh.\" A frozen turkey from 2011. \"MEH.\"","Aunty is watching you like a hawk. Then you pick up a thing and your eyes go wide. It is an old ʻukulele, perfect and beautiful. \"AH!\"","Aunty snatches it back. \"That one not for sale.\"","Meh, meh, meh, AH. Every thing in that garage is a mea. And Aunty is the mea who keeps them all."],"Pick up a thing and shrug. \"MEH-ah.\"","Mea ʻai means food, a thing to eat. Mea kōkua is a helper, a person who helps.",null,"Garage sale of three thousand things"],["n382","n",382,"wahi","VAH-hee","place","WAAAH-HEEEE!",["A paniolo rides across the ranch lands of Waimea looking for the perfect place to camp. He is picky.","He stops at a spot. Too windy. He stops at another. Too many cows. Another. A pig already lives there. Another. The view is only okay.","Six days. Three tired horses. Then he rides over a hill and sees it. Green grass, a little stream, a giant shade tree, and a view all the way down to the ocean. He stands up in the stirrups, throws his hat in the air and yells \"WAAAAH-HEEEEE!\"","He plants a flag. He builds a fire. He takes off his boots. This is the place. He sleeps under the tree like a baby. In the morning he finds out it is his cousin's backyard."],"Throw an invisible hat in the air. \"VAH-hee!\"","A wahi pana is a storied or legendary place.",null,"Cowboy yelling at the perfect spot"],["n383","n",383,"ʻaoʻao","ow-OW","side; page","ʻOW! ʻOW!",["In the library there is a book so big it takes up a whole wall. Every page is ten feet tall. You want to read it.","You grab the edge of the first page and pull. The paper slices across your finger. Paper cut. \"OW!\"","You back up, turn around and walk right into the side of the book. It is as hard as a wall. BONK. \"OW!\"","So now you know. One ow for the page. One ow for the side. You stand there sucking your finger and rubbing your forehead while the librarian tells you to shush.","You try again and get the same two ows, each with a little hiccup at the start. \"ʻOw! ʻOw!\" After forty pages you have the hang of it. After eighty you just say it for fun."],"Suck your finger, then rub your head. \"ʻOw-ʻOW!\"","Ma ka ʻaoʻao ʻākau means on the right side.",null,"Paper cut from a ten foot page"],["n384","n",384,"kihi","KEE-hee","corner","KEY! Hee hee!",["Grandpa hides the house key in a corner every night so burglars can't find it. The problem is Grandpa's house has 400 corners. He built it himself and he loves corners.","You get home from school. Locked. You start looking. Corner of the porch. Nothing. Corner of the carport. Nothing. Corner of the mailbox, the doghouse, the hose reel, the window. Nothing, nothing, nothing.","Three hours. 399 corners. Then you see it, in the very last corner, the tiny one where the fence meets the wall. You grab it and yell \"KEY! Hee hee hee!\"","Grandpa opens the front door from the inside. It was never locked. While you are hugging the key, he takes it and hides it again. Hee hee."],"Point into a corner and giggle. \"KEE-hee!\"","Doubled, kihikihi is the name of the Moorish idol, a fish that is all points and corners.",null,"Kid finding the key in a corner"],["n385","n",385,"waena","vah-EH-nah","middle; garden","WHY, ENA?!",["Your neighbor Ena loves gardening, but her yard is full. So one morning she walks out into the middle of the alanui with a shovel.","She digs. She plants kalo. She plants sweet potato. She plants tomatoes, a mango tree and a whole row of green onions. Right down the middle of the road, from one stop sign to the next.","The garbage truck stops. The driver leans out. \"WHY, ENA? WHY?!\" A lady in a minivan honks. \"WHY, ENA?\" The mailman walks around it holding his hat. \"Why, Ena...\"","She does not answer. She just waters. Three months later the whole street is eating her tomatoes, and the city puts up a sign. GARDEN IN THE MIDDLE. DRIVE AROUND."],"Throw your hands up at a garden in the road. \"Vah-EH-nah?!\"","Ma waena o means between, among, or in the middle of.",null,"Garden planted in the middle of the street"],["n386","n",386,"lalo","LAH-lo","below, down","La... LOW!",["The movers have to get Grandma's piano down from a tenth floor apartment. It will not fit in the elevator. So they tie a rope around it and lower it out the window.","The boss mover down on the sidewalk is directing. He sings every order, like he is warming up for church. \"Laaaa... LOW! Laaaa... LOW!\" Lower. Lower.","The piano swings past the ninth floor. Somebody is eating breakfast. It goes past the fifth floor. A cat jumps on it. Past the third. The cat plays a song on the keys going down.","\"La... LOW! La... LOW!\" His voice gets lower and lower until he is singing so low only whales can hear him. The piano touches down on the sidewalk, soft as a pillow. The cat takes a bow."],"Point down and drop your voice. \"LAH-lo.\"","Lalo means below, and its opposite is luna, up above. I lalo means downward.",null,"Piano lowered from a tenth floor window"],["n387","n",387,"waho","VAH-ho","outside","WAH-HOOOO!",["It is a perfect sunny Saturday. Fourteen cousins are inside the house playing video games in the dark with the curtains shut. Nobody has seen the sun since Thursday.","Aunty Lani walks in. She opens the curtains. Fourteen cousins hiss like vampires. She opens the front door, points one finger into the yard, and says one word. \"Waho.\"","Nobody moves.","She unplugs the TV. That does it. The cousins explode out the door like a cannon, all fourteen at once, screaming \"WAH-HOOOOO!\" They fly across the porch, over the steps and land in the grass in one pile.","Then they discover outside. There is a tree. There is a hose. There is a ball. By dark, Aunty Lani has to drag them back in, and they all beg to stay waho."],"Point at the door. \"VAH-ho!\"","I waho means outside. The opposite is i loko, inside, the same loko as in loko iʻa.",null,"Fourteen cousins blasting out the door"],["n388","n",388,"mua","MOO-ah","front; before","MWAH!",["Grandma has 23 grandkids and one rule. Whoever is in front gets the first kiss.","Sunday lunch. She walks in the door. All 23 grandkids charge. They shove. They elbow. One climbs over the couch. One comes down the stairs on a boogie board. One army crawls under the table.","Little Keala, age four, somehow ends up at the very front. Grandma bends down, grabs her cheeks and gives her the loudest kiss in the history of the family. \"MWAAAAH!\"","Everyone else groans. Then Grandma goes down the line. \"Mwah. Mwah. Mwah.\" But none of them are like the first one. The one in front always gets the big one. From then on, the grandkids start lining up in the driveway at 6 a.m."],"Blow a big kiss to whoever is in front. \"MOO-ah!\"","Ma mua means before or in front. I mua! means forward! and is a common cheer.",null,"Grandma kissing the grandkid in front"],["n389","n",389,"hope","HO-peh","back; after; end","HOPE, eh?",["The line for the malasada shop wraps around the block. You are at the very back. Person number 400.","Up at the front, people walk away with pink boxes. The smell drifts all the way to the back of the line and hits you in the face. Warm dough. Sugar. You are shaking.","The guy in front of you turns around. \"You think they going have any left by the time we get there?\" You grip your wallet. You say \"HOPE, eh?\"","Three hours pass. The line inches forward. Every so often you whisper \"Hope, eh? Hope, eh?\"","You finally reach the window. There is one malasada left, at the very back end of the tray, all alone. The lady hands it to you. It is the best one. The one at the end always is."],"Cross your fingers at the back of a line. \"HO-peh.\"","Ma hope means after or behind. It pairs with ma mua, before or in front.",null,"Last in line for the last malasada"],["n390","n",390,"uka","OO-kah","uplands, inland","OOOOO... KAH!",["Grandma's car is older than your dad. It is a little blue sedan, and it hates hills.","Today she drives the whole family inland, up the mountain road into the uplands. The car climbs and groans. \"OOOOOOO...\" It coughs. \"KAH!\" It climbs a little more. \"OOOOOOO... KAH!\"","The higher you go, the cooler it gets. Fog rolls in. Ferns everywhere. The trees change from mango to tall forest. Grandma rolls down the window and the air smells like wet leaves. The car keeps going \"OOOO-KAH, OOOO-KAH,\" like it is trying to say where you are.","At the top, it lets out one long tired \"OOOOO,\" and parks itself. You get out. It is cold. You can see the ocean far, far below."],"Groan like an old car going uphill. \"OO-kah!\"","Mauka, toward the mountains, comes from uka. Makai means toward the sea.",null,"Old car groaning up to the uplands"],["n391","n",391,"ʻākau","aah-KOW","north; right side","Ahhhh... COW!",["Farmer Mitch is lost in the fog. He doesn't have a compass. He doesn't have a phone. What he has is Bessie.","Bessie is a cow who always, always faces north. You turn her around, she turns back. You spin her, she spins back. Nobody knows why.","He also taught her to walk on his right side. Always the right. So he walks north through the fog with Bessie beside him. When he loses track, he reaches out, finds her on his right, and says with a big sigh of relief \"Ahhhhhh... COW.\"","Right side. North. Cow. After six hours in the fog he walks out at the north end of the ranch, exactly where he wanted to be. He gives Bessie a whole bale of hay and a kiss on the nose."],"Pat an invisible cow on your right. \"Aaah-KOW!\"","ʻĀkau means both north and right. If you stand facing west, north is on your right hand and south, hema, is on your left.",null,"Farmer following a north-facing cow"],["n392","n",392,"hema","HEH-mah","south; left side","HEM-ah!",["Down at the south end of the Big Island lives Aunty Dot, the seamstress. She is the best in the islands, but she has one quirk. She only hems the left side.","You bring her your new pants. She pins. She sews. She hands them back. The right leg drags on the floor. The left leg stops at your knee.","\"HEM-ah!\" you complain. \"Aunty, the other side!\"","She smiles and points at the left leg. \"Hema.\" Then she points at the map on her wall, at the bottom of the island. \"Also hema.\"","You walk out with one short left leg. For the rest of the day you keep drifting left, south, south, south, until you end up at the very tip of the island, staring at the ocean."],"Pinch your left pant leg. \"HEH-mah!\"","Lima hema is the left hand, and lima ʻākau is the right hand.",null,"Aunty hemming only the left pant leg"],["n393","n",393,"hikina","hee-KEE-nah","east","He KEEN, ah!",["Your cousin Makoa wants to be the first person on the island to see the sun come up. Every day. First. Nobody else.","He sets eleven alarms. At 3 a.m. he is out the door in his pajamas, running east with a flashlight and a spam musubi. He runs past the sleeping neighbors, past the closed store, all the way to the lookout on the east side.","Grandpa, up early to go fishing, sees him fly by. He shakes his head and says \"He KEEN, ah!\"","Makoa sits on the rock facing east. The sky goes gray. Then pink. Then the first sliver of sun comes up out of the ocean and hits him right in the face. He throws his arms up. First! Behind him, the rest of the island is still snoring."],"Face where the sun comes up. \"Hee-KEE-nah!\"","Hikina comes from hiki, to arrive, because the east is where the sun arrives.",null,"Cousin racing east to catch sunrise"],["n394","n",394,"komohana","ko-mo-HAH-nah","west","Come on, HANNAH!",["Remember Hannah with the fourteen jobs? Once a day, for exactly four minutes, she takes a break. Only for one thing. The sunset.","Her friends have to drag her. She is holding a wrench and a stack of dentist forms. They pull her out to the beach on the west side and point at the sky. \"Come on, HANNAH! It's going down!\"","She sits in the sand. The sun turns orange and slides down toward the water, then into the ocean, like it is going home for the night. Everybody watches. Nobody talks.","It goes under. Hannah stands up, brushes off the sand, and runs back to her fifth job. Her friends yell after her \"Same time tomorrow! Come on, HANNAH!\""],"Point to where the sun goes down. \"Ko-mo-HAH-nah.\"","Komo means to enter. The west is where the sun enters the sea. Hikina, east, and komohana, west, make a pair.",null,"Friends pulling Hannah to watch sunset"],["n395","n",395,"naʻauao","nah-ow-AH-oh","wisdom, learning","Now... WOW... oh.",["You have a problem you cannot figure out. Your canoe leaks, your boss is mad, and your cousin owes you money. So you go see the oldest fisherman in the harbor, Uncle Sol, 97 years old, sitting on an upside down bucket.","You tell him everything. It takes forty minutes. He does not say one word. He just mends his net.","Then he asks you one small question. Just one.","You stop. You think. And slowly, like a light bulb warming up in your stomach, you understand the whole thing. \"Now...\" you say. Then \"WOW...\" Then, very quietly, \"...oh.\"","Uncle Sol goes back to his net. You walk away knowing exactly what to do. Later you cannot even remember his question. But the light in your stomach stays on."],"Tap your stomach like a light just turned on. \"Nah-ʻow-AH-oh.\"","Naʻau means gut or heart, and ao means light or daytime. Wisdom is light in the gut.",null,"Old fisherman lighting up your gut"],["n396","n",396,"mana","MAH-nah","spiritual power","Ma... NAH.",["It is your family reunion. Two hundred people in one backyard. Kids running, uncles arguing about football, three radios playing three different songs. Total chaos.","Then your great-grandma, Ma, 94 years old, stands up from her chair. She is five feet tall. She does not raise her voice. She just lifts one hand and says one word. \"Nah.\"","Everything stops. The radios go off. The kids freeze mid-run. An uncle stops with a rib halfway to his mouth. Even the dog sits.","Nobody told them to. Nobody had to. A quiet power fills the whole yard. You whisper to your cousin \"Ma... nah,\" and he nods like he felt it too.","Ma sits back down. The party starts again, a little softer, and everybody brings her a plate."],"Raise one calm hand. \"MAH-nah.\"","Mana lives in people, places and things, and people can gain or lose it by how they act. Don't mix it up with manaʻo, which means thought or idea.",null,"Tiny great-grandma quiets the reunion"],["n397","n",397,"kuleana","koo-leh-AH-nah","responsibility; right; land claim","COOL, LEANNA!",["Leanna is nine. Today her dad gives her a kuleana. She is in charge of feeding the family's 42 chickens. Every morning. Before school.","She takes it more seriously than any nine year old in history. She makes a chart. She names every chicken. She wakes up at 4 a.m., puts on a hard hat and a whistle, and marches the chickens into lines. She measures the feed with a ruler.","Her dad peeks out the window in his pajamas. The chickens are lined up by height. One is saluting. He gives her a thumbs up. \"COOL, LEANNA!\"","She does not even look up. \"Not now, Dad. I have kuleana.\" A month later the chickens are laying twice as many eggs, and the neighbor asks if Leanna can take care of his dog too."],"Salute like Leanna. \"Koo-leh-AH-nah!\"","Kuleana also means a right, and the Kuleana Act of 1850 let commoners claim the land they lived on. Not my kuleana means not my business.",null,"Nine year old commanding 42 chickens"],["n398","n",398,"lōkahi","loh-KAH-hee","unity, harmony","LOOOOW... ka-HEEE!",["Your family band has one problem. Nobody plays together. Uncle on bass plays a slow song. Aunty on ʻukulele plays a fast one. Your little sister just screams. The dog howls along. It sounds like a truck full of pots rolling down a hill.","At the party, right before they play, Grandpa stands up. He points at Uncle. \"You. Sing low.\" Uncle sings \"LOOOOOOW.\" He points at your sister. \"You. Sing high.\" She squeaks \"ka-HEEEE!\"","He waves his arms and they do it together. \"LOOOOOOW... ka-HEEEE!\" The low note and the high note fit together like rice and shoyu. Then Aunty joins. Then everybody.","For the first time ever, the whole family sounds like one voice. People stop eating to listen. Even the dog howls in tune."],"Sing one low note, then one high note. \"Lohhh-KAH-hee.\"","Lōkahi and laulima go together. Everyone as one, and many hands doing the work.",null,"Family band finally singing in harmony"],["n399","n",399,"laulima","lau-LEE-mah","cooperation, many hands","LOUD LIMA!",["Remember Aunty Lima and her ʻilima lei? Now she has a bigger job. The school wants a lei long enough to go all the way around the football field for graduation.","She cannot do it alone. So she gets on a bullhorn. Her voice is so loud people in the next town hear it. That is why everybody calls her Loud Lima. \"EVERYBODY! BRING YOUR HANDS!\"","Two hundred people show up. Kids, aunties, uncles, the mailman, the whole football team. Four hundred hands. Everyone picks, strings, ties and passes, in one long line around the field.","It takes four hours. When it is done, two hundred people stand up and cheer, \"LOUD LIMA! LOUD LIMA!\" and she cries into the bullhorn, which is also very loud."],"Hold up both hands with everybody. \"Lau-LEE-mah!\"","Lau means many (it is also the number 400) and lima means hand. Laulima is many hands working together.",null,"Four hundred hands stringing a giant lei"],["n400","n",400,"ʻuhane","oo-HAH-neh","spirit, soul","ʻOoh, HAH-neh (like Ooh, honey)",["You are sitting on your aunty's porch at night with your ʻukulele. You are playing an old song Grandpa used to sing. Grandpa passed away last year.","You don't know all the words. Your voice cracks. You keep going anyway.","Aunty comes out and sits next to you. She doesn't say anything at first. When you finish, she puts her hand on your chest, right over your heart. Her eyes are wet. There is a little catch in her voice. \"ʻOoh, honey.\" Then, softly, \"That came from your ʻuhane.\"","A soft breeze comes through and the wind chimes ring once, even though there was no wind a second ago. You both just sit there, smiling.","Ooh, honey. ʻUhane. The part of you that sings."],"Put your hand on your heart. \"ʻOo-HAH-neh.\"","ʻUhane can mean the soul of a living person or the spirit of someone who has passed.",null,"Aunty's hand over your heart"],["n401","n",401,"akua","ah-KOO-ah","god","Ah... AQUA!",["Your little nephew Keoni is five and has never seen the ocean at sunrise. Grandpa drives him to Makapuʻu at 5 in the morning. The wind is pushing, the waves are booming, the sky turns orange, and the water goes a blue so bright it looks fake.","Keoni stands there with his tiny plastic bucket. He opens his mouth and all that comes out is \"Ah... AQUA!\" Then he runs down and tries to scoop the whole ocean into the bucket. He fills it, runs back, dumps it on the sand, runs back again. Forty trips.","Grandpa laughs and sits him down. \"Too big for your bucket,\" he says softly. \"Our kūpuna looked at power this big, the sea, the sky, the rain, the growing forest, and they saw akua there.\"","Keoni looks at the ocean again, very quiet now. Ah... kua. Akua."],"Spread your arms wide at something huge. \"Ah-KOO-ah.\"","The four great akua of old Hawaiʻi are Kū, Kāne, Lono and Kanaloa, and Kanaloa is tied to the ocean. In church today, Ke Akua is used for God.",null,"Kid trying to scoop the ocean into a bucket"],["n402","n",402,"ʻaumakua","ow-mah-KOO-ah","family god, ancestral guardian","Ow! Ma! Koo-ah.",["You are eleven, on your first night hike with your mom at the back of the valley. It is darker than the inside of a rice pot. Your flashlight dies. You take one step, catch your toe on a root and yell \"OW!\" You freeze. Hiccup. \"MA!\"","From the tree right above you comes a soft, low call. \"Koo... ah.\"","Two big yellow eyes. A pueo, a Hawaiian owl, wings spread as wide as your arms, looking right at you like it has been waiting. It drops off the branch and glides slowly down the trail, landing every twenty feet and turning to look back. You follow it all the way to the car.","Your mom is not surprised at all. She hugs you and says that in some families the ancestors watch over you in a form like this. Ow. Ma. Koo-ah. ʻAumakua."],"Grab your toe, tiny catch, then look up softly. \"Ow-mah-KOO-ah.\"","The plural is ʻaumākua. Family guardians can take forms like the pueo (owl), manō (shark) or honu (turtle), and families treat their ʻaumakua with deep respect.",null,"Owl guiding a kid down a dark trail"],["n403","n",403,"kapu","KAH-poo","taboo, sacred rule","Kah... POOF!",["Aunty Rose has one mango tree, and this year it grew exactly one perfect mango, gold and red, the size of a football. She ties a sign to the trunk. KAPU. That means keep off.","Your cousin Junior does not read signs. At midnight he tiptoes across the yard with a fruit picker pole 30 feet long. The second his foot crosses the rope around the tree, BOING. An invisible wall, soft like a bouncy castle, flings him backward into the bird bath. \"KAH... POOF!\"","He tries again with a running start. \"KAH... POOF!\" Into the hibiscus bush. Seventeen tries. Seventeen poofs.","In the morning Aunty finds him asleep in the hedge and laughs. In old Hawaiʻi a kapu was a sacred rule that everyone respected. Today a KAPU sign on a gate still means the same thing. Do not cross."],"Bounce backward off an invisible wall. \"KAH-poo.\"","Kapu can also describe something, meaning forbidden or sacred. Kapu aloha is a code of respectful, peaceful behavior, even when people strongly disagree.",null,"Cousin bouncing off an invisible wall by a mango tree"],["n404","n",404,"moʻokūʻauhau","mo-oh-koo-ow-HOW","genealogy","Moo, oh, koo, ow, HOW?",["It is the family reunion at the beach park. 212 relatives, 9 pop up tents. The kids decide to build a human family tree.","Aunty Moana gets down on her hands and knees at the bottom and moos like a cow. \"MOO... oh!\" Her son climbs onto her back and coos like a pigeon, a long one. \"Koooooo.\" His daughter climbs up next and bonks her head on the tent pole. \"OW!\" At the very top, the smallest baby wobbles, looks down at the whole shaky tower and asks, \"HOW?\" As in, how are all of us connected?","Moo. Oh. Koo. Ow. How.","The tower collapses into the sand, laughing. Then Tūtū stands up and answers the baby. She recites names, parent to child, back twenty generations, without looking at one piece of paper. Every tent goes quiet to listen. That long line of names is your moʻokūʻauhau."],"Stack your fists one on top of the other as you say it. \"Mo-oh-koo-ow-HOW.\"","Moʻo means a succession or series, one after another. The same word is also used for a lizard.",null,"Family human tower on the beach"],["n405","n",405,"ʻano","AH-no","kind, type, nature","Ah, no.",["You walk up to a shave ice truck parked at the beach. It has 400 bottles of syrup lined up on the counter like an army. Behind them stands Uncle Sonny with a scoop the size of a canoe paddle.","\"What ʻano you like?\" he asks.","\"Strawberry?\" He holds up the bottle and squints. \"Ah, no. Not your kind.\" \"Lilikoʻi?\" \"Ah, no.\" \"Li hing mango?\" \"Ah, no.\" He goes through every single kind. Coconut, lychee, pickle, spam flavor, tuna flavor. \"Ah, no. Ah, no. Ah, no.\"","Forty minutes later the line behind you is 90 people long. Uncle Sonny finally gets tired, grabs all 400 bottles and pours every kind at once. Your shave ice turns into a rainbow tower six feet tall. \"There,\" he says. \"Every ʻano.\""],"Shake your head at a bottle. \"AH-no.\"","Put ʻano in front of a describing word and it means kind of, somewhat. ʻAno maikaʻi means kind of good.",null,"Uncle pouring 400 syrups on one shave ice"],["n406","n",406,"pilikia","pee-lee-KEE-ah","trouble, problem","Pee! Leaky! Ah!",["It is Uncle Kimo's birthday and he has filled a giant inflatable whale pool on the lānai. It is 20 feet long and holds 3,000 gallons of water. Everybody is in swim shorts. The karaoke machine is plugged in right next to it.","Then your little cousin points and screams. \"PEE! LEAKY! AHHH!\"","There is a hole in the whale's tail. A thin stream of water is shooting sideways, straight into Uncle Kimo's plate lunch. Then into the karaoke machine, which sparks and starts singing by itself. Then the whale starts to sag, the tail slaps the table, and 40 musubi go flying into the yard where the dogs are waiting.","Water, sparks, dogs, flying rice. Pee, leaky, ah. Now that is pilikia."],"Point at the leak and panic. \"Pee-lee-KEE-ah!\"","\"No pilikia\" is a common local way to say no problem, no trouble.",null,"Leaking whale pool shorting out the karaoke"],["n407","n",407,"kaua","KOW-ah","war, battle","COW! AH!",["On a ranch in upcountry Maui, two herds of cows have been arguing for years about who gets the good grass by the water trough. Today it becomes a full war.","The black cows line up on the left hill. The brown cows line up on the right hill. Each side has a pile of rotten mangoes as tall as a house. A goat hops up on the fence post and blows a conch shell. The black cows charge first and scream their war cry. \"COW! AH!\" The brown cows scream it right back. \"COW! AAAH!\"","Mangoes fly like cannonballs. SPLAT. SPLAT. A cow gets hit so hard its spots slide off. The fence breaks. The water trough tips over. By sunset the whole hill is yellow and sticky, and nobody got any grass.","Cow, ah. Kaua. War is messy."],"Shake your fist and charge. \"KOW-ah!\"","Don't mix it up with kāua, with a long ā, which means \"you and I, we two.\" One long vowel turns a war into a friendship.",null,"Cows in a mango war on a hill"],["n408","n",408,"maluhia","mah-loo-HEE-ah","peace","Ma... loo... hee, ahhh.",["It is 6 pm and your house is chaos. Six kids are fighting over one TV remote. Two dogs are chasing the cat. The neighbor's pig got in again and is standing on the rice cooker. Somebody is practicing the trumpet.","Ma walks in the front door from work. She does not say one word. She walks straight to the bathroom, the loo, as fancy British people call it, and locks the door.","\"MA?\" the kids yell. From inside you hear the bathtub filling. The click of the radio. Slow ʻukulele music. A candle smell drifts under the door. Then comes the happiest sound in the world. Ma sinking into hot water and letting out a long \"Hee... ahhhhh.\"","Ma. Loo. Hee. Ahh. Even the pig lies down. For twenty whole minutes, the house has maluhia."],"Sink into an invisible bathtub and sigh. \"Mah-loo-HEE-ah.\"","Maluhia is the calm, quiet kind of peace, like a still morning or a sleeping baby.",null,"Ma in a bubble bath, chaos outside the door"],["n409","n",409,"waiwai","vai-VAI","wealth, value","Why? Why?",["You are on a treasure hunt with a pirate who is 80 years old and missing one slippah. The map leads to a spot under a hala tree. You dig for six hours. Finally your shovel hits wood. A chest! It weighs 500 pounds. You drag it out, bust the lock and throw open the lid.","It is full of water. Fresh, cold, clear water. That's it.","The pirate grabs his head and screams at the sky. \"WHY? WHY?\"","Then an old farmer walks by with a bucket, looks into the chest and smiles. \"Brah, that's the real treasure.\" In old Hawaiʻi, fresh water fed the taro patches, and the taro fed everybody. A popular saying goes that water was wealth, so wai said twice became waiwai.","Why, why. Wai, wai. Waiwai."],"Scoop water in cupped hands like it is gold. \"Vai-VAI.\"","One popular explanation says waiwai is wai, fresh water, said twice, because water meant wealth. Pukui-Elbert thinks it more likely comes from a different wai that means to keep or retain.",null,"Pirate yelling at a treasure chest of water"],["n410","n",410,"pōmaikaʻi","poh-mai-KAH-ee","blessing, good luck","Pooo, my kah! EEE!",["A storm hits your street at 2 in the morning. The neighbor's giant mango tree, 60 feet tall and a hundred years old, cracks and falls. It crushes the fence. It crushes the mailbox. It flattens the chicken coop, but the chickens are fine, sitting on the roof.","Your neighbor Po runs out in his pajamas to check his old rusty car, his kah, as they say around here. He can't look. He covers his eyes and moans, \"Pooo... my KAH...\"","Then he peeks. The whole tree fell in a perfect circle AROUND the car. Not one scratch. And on the hood, right in the middle, sits one perfect ripe mango.","He screams with joy. \"POOO! MY KAH! EEEE!\" He eats the mango in his pajamas at 2 am. The whole street calls it the luckiest night ever. Pōmaikaʻi."],"Peek through your fingers, then cheer. \"Poh-mai-KAH-ee!\"","Pōmaikaʻi can also mean to be lucky or blessed.",null,"Fallen tree circling an untouched car"],["n411","n",411,"manaʻolana","mah-nah-oh-LAH-nah","hope","Man, oh... LANA!",["Your little canoe drifts for three days after the paddle breaks. No land in sight. No food except one soggy rice ball. The sun is cooking you like a laulau.","So you hold on to one thought. Mom's beef stew waiting at home, the big pot, the rice, the chili pepper water. You think about it so hard that the thought puffs out of your head as a bubble. A real one. It keeps growing. As big as a car. As big as a house. It turns into a giant balloon, the canoe lifts off the water, and you float over the sea toward home.","You look up at it and yell \"MAN, OH... LANA!\" Manaʻo is a thought. Lana means floating. A floating thought that carries you when nothing else can. That is manaʻolana. And the stew is still hot when you land."],"Point up at a balloon over your head. \"Mah-nah-oh-LAH-nah.\"","Manaʻo means thought and lana means floating, and lana ka manaʻo, the mind floats, is another way to say hopeful. Pukui-Elbert treats the -lana in manaʻolana as a noun ending, so the floating thought is a memory picture more than a proven word history.",null,"Thought balloon lifting a canoe"],["n412","n",412,"ʻoiaʻiʻo","oy-ah-EE-oh","truth","Oy! Ah! EE-oh!",["Mom comes home and the last malasada is gone. The box is on the counter, empty except for sugar. There are three kids in the house. Everyone says it wasn't them.","So Mom brings out the family parrot, Kolohe, who is 60 years old and has one job. He sits on your shoulder while you talk. When you lie, he does nothing. He just stares.","Your brother says a dog ate it. Stare. Your sister says a ghost ate it. Stare. You say you were asleep. Stare. The parrot leans closer. There is sugar all over your shirt.","Finally you blurt it out. \"I ate it.\"","The parrot explodes. Wings flapping, feathers everywhere, dancing in a circle on your shoulder. \"OY! AH! EE-OH! OY! AH! EE-OH!\" That is the truth alarm. ʻOiaʻiʻo."],"Hand on your heart, then flap your arms. \"Oy-ah-EE-oh!\"","ʻOiaʻiʻo can also be said on its own, like \"Really! Truly!\" Its opposite is wahaheʻe, a lie, which comes next.",null,"Parrot dancing when you finally tell the truth"],["n413","n",413,"wahaheʻe","vah-hah-HEH-eh","a lie","Wa... ha ha... heh... eh?",["Your cousin Kainoa has chocolate cake all over his face. Frosting on his nose. Crumbs in his eyebrows. A candle stuck in his hair. The birthday cake is gone. Kolohe the parrot from ʻoiaʻiʻo is on top of the fridge, staring.","\"Did you eat the cake?\" Aunty asks.","Kainoa laughs nervously. \"Wa... ha ha... heh... eh? No.\"","The second the lie comes out, his mouth turns slippery. His lips go loose and wiggly like an octopus. They slide off his face, down his neck, across the floor, and try to escape under the fridge, still giggling \"wa ha ha heh eh\" all by themselves.","Aunty just crosses her arms and waits. Kainoa has to crawl under the fridge and bring his mouth back. Waha is mouth. Heʻe means to slide, and it is also the word for octopus. A lie is a slippery mouth."],"Laugh nervously and wiggle your lips. \"Vah-hah-HEH-eh.\"","The opposite is ʻoiaʻiʻo, the truth.",null,"Octopus lips sliding under the fridge"],["n414","n",414,"kānāwai","kaah-naah-VAI","law","Caaan? Naaah. WHY?",["The neighborhood board passes a new book of laws. It is 900 pages long and weighs as much as a pig. They chain it to the telephone pole in front of your house.","Your little sister is four. She can't read yet, so she makes you read every law out loud, and after each one she asks the same thing.","\"Caaaan I ride my bike on the sidewalk?\" You check. \"Naaaah.\" \"WHY?\"","\"Caaaan I keep a goat in the bathtub?\" \"Naaaah.\" \"WHY?\"","\"Caaaan I yell at the ice cream truck after 9 pm?\" \"Naaaah.\" \"WHY?\"","Long can, long nah, loud why. For six hours. Page 900 is a law that says no asking why after dark. She thinks about it for a second and says \"Caaaan... naaaah... WHY?\" Kānāwai. Law."],"Stretch the first two and pop the last. \"Kaaah-naaah-VAI.\"","Some say kānāwai comes from wai, water, because early laws dealt with water rights. Pukui-Elbert doubts this, since many ancient kānāwai had nothing to do with water.",null,"Four year old questioning a giant law book"],["n415","n",415,"ea","EH-ah","sovereignty; life, breath","Eh... AHHH!",["You are free diving at a calm reef off the Waiʻanae coast. You go down 25 feet and hold your breath while a turtle drifts past and a school of yellow fish swirls around you. Your chest starts to burn. Time to go up.","You kick hard toward the silver light. Twenty feet. Ten. Five. You break the surface and the first thing out of your mouth is \"EH... AHHHHH!\" Air rushes into your lungs. Your whole body comes back to life. The turtle pops up next to you and breathes out too. Pfff.","That first breath is ea. Life. Breath. And the same word means sovereignty, a people living free on their own land, breathing on their own. When you hear ea in a song or a speech, that is the meaning. The life of a nation."],"Come up from an invisible dive and gasp. \"EH-ah!\"","The Hawaiʻi state motto, Ua mau ke ea o ka ʻāina i ka pono, means the life (or sovereignty) of the land is perpetuated in righteousness. July 31 is celebrated as Lā Hoʻihoʻi Ea, Sovereignty Restoration Day.",null,"Diver bursting up for air beside a turtle"],["n416","n",416,"kūlana","koo-LAH-nah","position, status","Koooool, LANA!",["It is the Giant Pumpkin Contest at the county fair. Three farmers have pumpkins so big they came on flatbed trucks. There is a podium with three steps. First place on top, second on the left, third on the right.","The judge is a tiny old man with a clipboard. He walks around each pumpkin, knocks on it, sniffs it. Then he points at the top step and calls out the winner, a nine year old girl named Lana with a pumpkin as big as a school bus.","\"Koooooool, LANA!\"","Lana climbs to the top step and stands tall. The second place farmer stands one step lower and pouts. The third place farmer stands on the lowest step and pretends he doesn't care. Everybody knows exactly where they stand.","Kū means to stand. Your kūlana is where you stand."],"Stand up straight on a step. \"Koooo-LAH-nah.\"","Kū means to stand and noho means to sit. Your kūlana is your standing, whether on a team, at work or in a community.",null,"Girl on the top step with a bus-size pumpkin"],["n417","n",417,"hanana","hah-NAH-nah","event","Ha! NANA!",["Nana is turning 90, and the family decides this has to be the biggest event in the history of the neighborhood. They rent the park. They hire a band. They build a paper mache banana as long as a city bus and park it in the middle of the lawn.","At exactly 7 pm the lights go down and the drummers start. 300 people hold their breath. The giant banana starts to peel itself. One side. Two sides. Three sides. Smoke. Fireworks.","Out steps Nana in a sparkly gold muʻumuʻu, holding a microphone.","The whole crowd jumps up and screams \"HA! NANA!\" She sings three songs, dances a hula, and then eats a slice of cake the size of a door.","Ha, Nana. Hanana. People will talk about that event for 40 years."],"Throw your arms up like Nana just stepped out. \"Hah-NAH-nah!\"","Don't mix it up with the fruit. Banana in Hawaiian is maiʻa.",null,"Nana stepping out of a giant banana"],["n418","n",418,"papahana","pah-pah-HAH-nah","project, program","Papa... ha... NAH.",["Papa gets a new drill for Christmas and decides his big weekend project will be a roller coaster. In the backyard. Made from old water pipes, two surfboards and a shopping cart.","He works Friday, Saturday and Sunday. Plans taped to the fridge. Nails everywhere. The coaster climbs over the roof, loops around the mango tree and ends in the neighbor's pool. He names it Program Number One.","He puts on a helmet and waves at the family. \"Who wants the first ride?\"","Everybody looks at the shopping cart. Everybody looks at the loop. Your sister shakes her head and says it for all of you. \"Papa... ha... NAH.\"","So Papa rides it himself and lands in the neighbor's pool with a huge splash. The neighbor hands him a towel and says it's the best project on the street."],"Look at a scary ride and shake your head. \"Pah-pah-HAH-nah.\"","You can hear hana, work, at the end. A papahana is a planned piece of work, like a school program or a big project.",null,"Papa's backyard roller coaster into a pool"],["n419","n",419,"hopena","ho-PEH-nah","result, ending","Hope, eh? Nah.",["You decide to bake your best friend a nine layer cake for her birthday. You follow the recipe for six hours. Nine bowls, 27 eggs, flour on the ceiling, the dog white like a ghost.","The cake goes into the oven as tall as a fire hydrant. You sit on the floor in front of the oven window with your hands pressed together. You HOPE. The timer dings. This is it. The ending. The big result.","You open the door. PFFFFFT. The cake sighs and collapses into a pancake one inch thick.","Your brother looks over your shoulder. \"Hope, eh?\" He shakes his head. \"Nah.\"","You serve it anyway. Your friend eats three slices and says the result is the best cake she ever had, because nobody ever baked her one before. Hope, eh, nah. Hopena."],"Open an invisible oven door and wince. \"Ho-PEH-nah.\"","Don't confuse it with manaʻolana, which is hope itself. Hopena is what actually happened in the end.",null,"Nine layer cake collapsing into a pancake"],["n420","n",420,"kumuhana","koo-moo-HAH-nah","topic, subject","Kumu: Ha! NAH!",["It is speech day in 7th grade. The topic is written on the board in giant letters. THE OCEAN. The kumu, the teacher, is a tall lady with a pointer stick 12 feet long.","The first kid gets up. \"My speech is about my chicken.\" The kumu taps the board. \"Ha. Nah.\" Next kid. \"My speech is about video games.\" Tap. \"Ha. Nah.\" Next kid. \"My speech is about why we should have no homework.\" TAP. \"HA! NAH!\"","By the tenth kid, the pointer is circling THE OCEAN so hard it drills a hole right through the whiteboard, and you can see the actual ocean through the wall.","Finally a small girl stands up and says her speech is about sharks. The kumu smiles and puts down the stick. Kumu, ha, nah. Kumuhana. Stick to the topic."],"Tap an invisible board. \"Koo-moo-HAH-nah.\"","Kumu means teacher, and also source or foundation. You'll see it again in kumu hula.",null,"Teacher's giant pointer drilling through the board"],["n421","n",421,"pahuhopu","pah-hoo-HO-poo","goal","Pa! Who? HOOP-oo!",["The family basketball game is at the park. Pa is 72 years old, wearing black socks pulled up to his knees and slippahs. He announces his goal for the day. He will make a basket from the top of the monkeypod tree.","Everyone laughs. He climbs anyway. 40 feet up, leaves in his hair, a mynah bird yelling at him. He takes aim at the hoop across the court.","The whole family stares up. \"PA? WHO...?\" Nobody can finish the sentence. He throws. The ball flies over the court, over a car, bounces off a picnic table, rolls up a slide, flies off the top and drops straight through the hoop. Swish.","Everyone screams. \"PA! WHO! HOOP! OOO!\" Pa climbs down, bows, and asks for his plate lunch. Goal reached. Pahuhopu."],"Shoot an invisible hoop. \"Pah-hoo-HO-poo!\"","Pahu can mean a post or a box, and hopu means to catch. In sports it is the goal you score in, and in life it is the goal you aim for.",null,"Grandpa shooting hoops from a tree"],["n422","n",422,"ʻaha","AH-hah","meeting, assembly","...AHA!",["The neighborhood meeting at the community center has been going for four hours. 200 people on folding chairs. The only topic is roosters. There are 600 wild roosters on the street and they crow at 3 am.","One man wants a fence. One aunty wants to start a rooster choir. Somebody brought a rooster to the meeting and it is standing on the podium.","Then a six year old in the back raises her hand. \"Just give everybody earmuffs.\"","Silence. Then all 200 people say it at once, with the same little catch in their throats. \"...AHA!\" It is so loud the roof lifts off for a second and lands back down. The rooster faints. The meeting ends. Everybody goes home in earmuffs.","That gathering of people is an ʻaha. Short and sharp, with a catch at the start."],"Snap your fingers and gasp. \"AH-hah!\"","ʻAha also means a cord braided from coconut fiber. You'll see ʻaha in ʻahahui (association) and in the phrase ʻaha mele (concert).",null,"200 people shouting AHA at a rooster meeting"],["n423","n",423,"ʻahahui","ah-hah-HOO-ee","association, society","Aha! Hooey!",["Every Thursday night, 60 aunties meet at the church hall for the Society of Very Serious Spam Musubi. They have rules. They have dues, $2 a month. They have matching purple muʻumuʻu, a president, a treasurer, and a secret handshake that takes 45 seconds.","The meeting opens the same way every week. The president bangs a rice paddle on the table like a judge. All 60 aunties stand up and shout the society chant. \"AHA! HUI!\" Then they sit down and argue for two hours about furikake.","When one member sees another across the grocery store parking lot, she yells \"HUI!\" and waves her rice paddle in the air.","Aha plus hui. A real group with rules, officers and members. That is an ʻahahui."],"Bang an invisible rice paddle. \"Ah-hah-HOO-ee!\"","A hui is a club or group, and \"Hui!\" is also what you shout to get a friend's attention. An ʻahahui is the more formal kind, like a society or association.",null,"Sixty aunties banging rice paddles"],["n424","n",424,"kaiāulu","kai-aah-OO-loo","community, neighborhood","Kai! Aaah! ʻULU!",["Your neighbor Kai has a breadfruit tree that has gone crazy. This year it drops 300 ʻulu in one afternoon. They thump on the roof, roll down the driveway and chase the mailman down the hill.","Kai stands in the street and screams. \"KAI... AAAH... ʻULU!\" Kai, aah, oo, loo.","Doors open up and down the block. The aunty from the corner shows up with a laundry basket. The boys from the end of the street bring a wheelbarrow. The retired fireman sets up a folding table. Somebody starts a fire in a drum and roasts them. Someone else makes ʻulu chips. The family who just moved in last week goes home with 40 and a recipe.","By dark every house has breadfruit, and people who never talked before are sitting in the same driveway laughing. That is a kaiāulu. The people around you."],"Catch invisible breadfruit falling from the sky. \"Kai-aah-OO-loo!\"","The hook borrows ʻulu, breadfruit, which is a great Hawaiian word to know too. But kaiāulu itself means the neighborhood and the people in it.",null,"Whole street sharing a breadfruit avalanche"],["n425","n",425,"pilina","pee-LEE-nah","relationship, connection","Peel, Lina.",["Two old ladies sit on a bench at the senior center. Lina is 88. You are 88 too. You have been friends since third grade.","Every single day for 80 years, Lina has peeled you an orange. At recess in third grade. At lunch in high school. At your wedding. In the hospital the day your first baby was born. Today her fingers are slow, but she still peels, one long curl of skin, and hands you half.","Somebody once counted. 29,000 oranges.","A young nurse walks by and asks what the secret is to a friendship that lasts that long. You smile and point. \"Peel, Lina.\" And she does.","Peel, Lina. Pilina. The thing that sticks two people together, one small act at a time."],"Mime peeling an orange and hand half over. \"Pee-LEE-nah.\"","Pili means to cling or stick close, so pilina is what sticks people together.",null,"Old friend peeling an orange for 80 years"],["n426","n",426,"hoʻoilina","ho-oh-ee-LEE-nah","legacy, inheritance","Ho... oily... NAH.",["Grandpa passes away at 96 and leaves you just one thing. His old metal tackle box.","You open it. It is filthy. Every lure, every hook, every reel is coated in 60 years of fish oil. It smells like a tuna ran a marathon. You hold it away from your face. \"Ho... oily... NAH.\" You almost put it out with the rubbish.","Then you notice a folded paper taped inside the lid. It is a map, drawn by hand, of every secret fishing spot on the whole coast. Next to each spot, a name. Grandpa's name. His father's name. His grandfather's name. 100 years of your family finding fish in the same places.","You close the box and hold it tight, oil and all. Ho, oily, nah. Hoʻoilina. The thing that gets handed down."],"Hold something gross at arm's length, then hug it. \"Ho-oh-ee-LEE-nah.\"","A hoʻoilina can be money or land, but also songs, stories, skills and names.",null,"Oily tackle box with a secret map inside"],["n427","n",427,"waihoʻoluʻu","vai-ho-oh-LOO-oo","color","Why? Ho! Oh... LULU!",["Uncle Boy decides to tie dye 100 T-shirts for the family reunion. He fills a kiddie pool in the backyard with dye. Red on one end, blue on the other, yellow and purple and green in the middle.","Lulu, the family poodle, is pure white. She has been told to stay inside.","She does not stay inside.","She sprints across the yard and cannonballs into the kiddie pool. SPLOOSH. She comes out every color at once. Red ears, green legs, a blue tail, a purple face. She shakes, and every T-shirt on the line, the car and the neighbor's cat all turn rainbow too.","Uncle Boy grabs his head. \"WHY? HO! OH... LULU!\" Why, ho, oh, Lu-u. Waihoʻoluʻu. She stays colors for three weeks, and everybody at the reunion wants a picture with her."],"Grab your head at a rainbow dog. \"Vai-ho-oh-LOO-oo!\"","Wai is liquid and hoʻoluʻu means to dye, so color is literally dye water.",null,"Rainbow poodle shaking dye everywhere"],["n428","n",428,"ʻōlelo noʻeau","oh-LEH-lo no-eh-OW","proverb, wise saying","Ohhh, hello! No, eh... OW!",["A wise old man sits on the same bench at the shopping center every day. White beard to his belly, lauhala hat, a cane made from a guava branch. When you walk past he says \"Ohhh, hello!\"","Then he gives you a wise saying. \"Watch where you walk, not where you want to go.\"","You are texting. You don't even look up. \"No, eh.\"","Three steps later, BONK. You walk straight into a pole. \"OW!\"","He does not laugh. He just says \"Ohhh, hello\" to the next person and gives them the same saying.","Oh, hello. No, eh. OW. That is how most people learn an ʻōlelo noʻeau. The first time you hear a wise saying, you ignore it. The second time, you remember the pole."],"Wave, shake your head, then rub your forehead. \"Oh-LEH-lo no-eh-OW.\"","A famous one is ʻAʻohe pau ka ʻike i ka hālau hoʻokahi, which means not all knowledge is learned in one school.",null,"Texting kid walking into a pole"],["n429","n",429,"mea kanu","MEH-ah KAH-noo","plant","Meh... ah... CANOE!",["Aunty Pua has an old wooden canoe in her front yard, 40 feet long, retired after 30 years of racing. She did not throw it away. She filled it with dirt.","Now it is the most famous garden on the street. Tomatoes as big as softballs. A banana tree growing out of the back seat. Taro in the middle. Chili peppers along the sides. Sweet potato vines hanging over the edge like the canoe is still in the water.","The first time you see it, you are not impressed. You glance and say \"Meh.\" Then you look again. \"Ah...\" Then you see the whole thing. \"CANOE!\"","A papaya drops off the tree right into your arms. Meh, ah, canoe. Mea kanu. A plant. Aunty Pua has a canoe full of them."],"Shrug, look again, then point. \"MEH-ah KAH-noo!\"","Mea means thing and kanu means to plant, so a plant is a planted thing.",null,"Old racing canoe turned into a garden"],["n430","n",430,"kaʻao","kah-OW","legend, fanciful tale","Ka... OW!",["Uncle Joe tells the same fishing story at every lūʻau, and every year the fish gets bigger.","This year he stands up by the imu. \"Was THIS big,\" he says, and stretches his arms out. His right hand smacks Aunty in the face. \"Ka... OW!\"","\"No, no, was THIS big.\" He stretches wider. His left hand knocks over the poi. \"Ka... OW!\"","By the end of the story the fish is as long as a school bus, it had wings, it sang karaoke, and it pulled his boat to Tahiti and back before breakfast. Everybody sitting near him has a bruise. Nobody believes a single word, and everybody wants to hear it again next year.","That is a kaʻao. A fanciful tale. Ka, catch, OW."],"Stretch your arms out wide and flinch. \"Kah-OW!\"","Moʻolelo is the general word for a story or history. A kaʻao leans toward the fanciful kind, full of wonders.",null,"Uncle's giant fish story smacking everyone"],["n431","n",431,"leina","LAY-nah","leap; leaping place (of spirits)","The lane, ah...",["Tūtū takes you on a long walk to the far western tip of Oʻahu at sunset. The road ends. The trail keeps going over rocks and sand. Albatross sit on their nests and watch you pass. A monk seal sleeps on the beach and does not even open one eye. Your slippah breaks, so you walk the last mile barefoot.","Finally the land runs out, like a lane at the end of the world. The rocks point straight out into the sea. Tūtū stops and holds your hand.","\"The lane, ah...\" you say, looking at the end of it.","She nods. In the old way of thinking, this is a leina, a place where the spirits of the dead leap from the land into the sea to go on to the next world. You don't talk for a while. You just watch the sun go down into the water together."],"Stand still at the edge and speak softly. \"LAY-nah.\"","Kaʻena Point on Oʻahu is a famous leina. The full phrase is leina a ka ʻuhane, the leaping place of the soul.",null,"Grandma and kid at land's end at sunset"],["n432","n",432,"pia","PEE-ah","arrowroot starch","The PIER!",["Aunty Lehua makes haupia the old way, with pia, arrowroot starch, and she makes it strong. Her haupia is so firm you can stand on it.","For the beach party she makes 400 pans. The kids start stacking the squares at the water's edge. Then they lay more squares out over the water, one after another, like planks. White coconut squares, wobbling but holding.","By noon it stretches 30 feet into the ocean. A real pier. The kids run to the end and cannonball off. A fisherman walks out with his pole and a folding chair. A white egret stands at the very end like it owns the place.","Everyone points and shouts \"THE PIER!\" Pier. Pia. And at the end of the day the kids eat the whole pier, one square at a time."],"Point out at the water. \"PEE-ah!\"","You can hear pia at the end of haupia. Before cornstarch, arrowroot starch is what made haupia set.",null,"Haupia pier stretching into the ocean"],["n433","n",433,"ʻawapuhi","ah-vah-POO-hee","ginger","Ah... wah... POO-EE!",["You have been hiking in the rain forest for nine hours. Mud on your legs, sweat in your hair, a spider living on your hat. Your hiking buddy walks upwind and holds his nose. \"Ah... WAH... POO-EE! You stink!\"","He grabs a red, pine cone looking thing from a ginger plant by the trail and squeezes it over your head like a sponge. SQUISH. Clear, slippery juice runs down your hair. He rubs it in. Suds! Bubbles! It smells clean and fresh, like a fancy hotel lobby.","He squeezes six more. By the time you reach the waterfall you are foaming like a washing machine and you smell like a flower.","Ah, wah, poo-ee. ʻAwapuhi. Ginger. Nature's shampoo, growing right there on the trail."],"Hold your nose, then squeeze an invisible cone over your head. \"Ah-vah-POO-hee.\"","The shampoo kind is ʻawapuhi kuahiwi, wild mountain ginger. Its red cones hold the slippery juice.",null,"Hiker's hair foaming with ginger juice"],["n434","n",434,"lāʻī","laah-EE","ti leaf","Laaaa... EEEE!",["It is a rainy Saturday, and the grass hill behind the school is slick, green and 200 feet long. Your cousins show up with armfuls of ti leaves, long, green and shiny.","You sit on a bundle of ti leaves at the top, grab the stems like handlebars and push off.","\"LAAAAAAA...\"","You pick up speed. 20 miles an hour. 30. The wind flattens your cheeks. You pass a jogger. You pass a dog. You pass a car on the road below. At the bottom you hit a bump and catch air, and your throat catches too.","\"...EEEEEEE!\"","You slide 40 more feet into a pile of leaves. Everyone is cheering. Laaaa, catch, EEEE. Lāʻī. Ti leaf. The same leaf wraps your laulau, but today it is a sled."],"Push off on an invisible sled. \"Laaah... EEEE!\"","Lāʻī is short for lau kī, the leaf of the kī (ti) plant.",null,"Kid sledding down a hill on ti leaves"],["n435","n",435,"paʻi ʻai","PAH-ee AI","pounded taro, not yet thinned into poi","PIE? ...AY!",["Uncle Kalani pounds cooked taro on a long wooden board with a heavy stone pounder. Thump. Fold. Thump. Fold. After an hour it becomes a thick, sticky, purple gray lump. Not poi yet. Too thick to pour. It is paʻi ʻai.","He wraps a chunk in ti leaves, the same ones from the sledding hill, and sets it on the table. Your little brother sees it and thinks it's dessert. \"PIE?\" He grabs a handful and stuffs it in his mouth.","He tries to chew. His jaw will not open. It is glued shut. He tries to talk. \"Mmmf! Mmmf!\" Finally it pops free. \"AY!\"","Pie? Ay! Paʻi ʻai. Uncle laughs and shows him the trick. Add water, a little at a time, and mix it with your hand. Now it becomes poi."],"Chew something sticky, then pop your jaw free. \"PAH-ee AI!\"","Also written paʻiʻai. The board is a papa kuʻi ʻai and the stone is a pōhaku kuʻi ʻai. Paʻi ʻai plus water makes poi.",null,"Kid's jaw glued shut with pounded taro"],["n436","n",436,"ʻōʻio","oh-EE-oh","bonefish","OH! EE! OH!",["You are wading on the shallow sand flats with a thin fishing pole when something grabs your line and takes off. The reel screams. The line zips out 200 yards. The fish is so fast and strong it pulls you off your feet, and now you are water skiing on your belly across the flats.","\"OHHH! EEE! OH!\" you scream like a siren, all the way to the reef.","It turns out to be a bonefish. Silver, sleek, not even two feet long.","You bring it home to Aunty. She cooks it and you take one big bite. It is like chewing a bag of toothpicks. \"OHHH! EE! OH!\" again. Aunty laughs and takes the plate away. She scrapes the meat off the bones with a spoon and makes the best fish cake you have ever had."],"Hold on to a runaway fishing pole. \"Oh-EE-oh!\"","ʻŌʻio is so bony that people often scrape out the flesh and make it into fish cake.",null,"Bonefish dragging you across the flats"],["n437","n",437,"akule","ah-KOO-leh","bigeye scad","A COOLER!",["One summer morning the bay turns black. Not from a storm. From fish. A school of akule so big it looks like an oil spill, millions of silver fish with giant eyes, all swimming in one slow circle.","The uncles on the beach go crazy. They grab a long net, jump in the boat and surround the whole school. When they haul it in, the net is so full it takes 30 people to drag it up the sand. Silver fish everywhere, big eyes staring at you.","Uncle turns around and yells. \"A COOLER!\"","You bring a cooler. Full. \"A COOLER!\" Another one. Full. Every cooler in the neighborhood. Then bathtubs. Then the back of a truck.","A cooler. Akule. Enough for the whole town, fried with shoyu for a week."],"Point at the fish and yell for help. \"Ah-KOO-leh!\"","Young akule are called hahalalū. Akule are often fried or dried.",null,"Net full of big-eyed silver fish"],["n438","n",438,"ʻōpakapaka","oh-pah-kah-PAH-kah","pink snapper","Oh, pack-a! PACK-a!",["Aunty Mele enters a deep sea fishing contest. Everyone else brings fancy boats and sonar. She brings a hand line, a bucket and a thermos of coffee.","She drops her line 600 feet down into the deep blue. She waits four hours. Then the line goes tight, and she hauls up a pink snapper so big it glows like a sunrise. Pink scales, big dark eyes, longer than she is tall.","The problem is getting it home. Her boat is small. The fish won't fit. At the dock she points at every cousin she has. \"Oh, pack-a! PACK-a! Pack-a!\"","They pack it into three coolers, two surfboard bags and a baby stroller. They pack it into the back seat of a car with its tail sticking out the window. It wins first place and becomes the fanciest dinner in town.","Oh, pack-a, pack-a. ʻŌpakapaka."],"Stuff something big into an invisible bag. \"Oh-pah-kah-PAH-kah!\"","ʻŌpakapaka is one of the Deep 7, the prized bottomfish caught in deep water around Hawaiʻi. Pukui-Elbert calls it blue snapper, but in Hawaiʻi markets it is sold as pink snapper.",null,"Giant pink snapper packed into a stroller"],["n439","n",439,"hīnālea","hee-naah-LEH-ah","wrasse (reef fish)","Heee... naaah... LAYER!",["You are snorkeling at the reef, and a tiny fish swims right up to your mask. It is only six inches long, but it is painted like the fanciest henna art you have ever seen. Neon green swirls. Purple stripes. An orange face. A blue line down the side. Layer on top of layer on top of layer.","You try to say \"Henna layer\" through your snorkel. It comes out \"HEEEE... NAAAH... LAYER!\"","The fish is a show off. It spins around so you can see the other side. It swims to a bigger fish and starts picking tiny bits off it like a barber. Then it comes back and pecks at its own reflection in your mask.","Heee, naaah, layer. Hīnālea. Every snorkeler meets one."],"Talk through an invisible snorkel. \"Hee-naah-LEH-ah.\"","Hīnālea is the name for many kinds of wrasses. Some kinds work as cleaners, picking tiny pests off bigger fish.",null,"Henna-painted fish staring into your mask"],["n440","n",440,"manini","mah-NEE-nee","convict tang (striped reef fish)","Ma! Knee! Knee!",["Ma is wading at the beach, water up to her knees, eating a spam musubi. She holds it up high to keep it dry. Rice falls in the water. Big mistake.","A school of manini shows up. Two hundred little fish, pale yellow with black stripes, like tiny prisoners in striped jail uniforms. They eat the rice. Then they start nibbling Ma's knees. Nibble nibble nibble.","\"MA! KNEE! KNEE!\" you yell from the sand.","Ma looks down. Her knees are covered in striped fish like a pair of zebra kneepads. She tries to walk out, and they follow her like a marching band, all 200, stripes lined up. She drops the rest of the musubi. They don't care. They like her knees better.","Ma, knee, knee. Manini."],"Point at your own knees. \"Mah-NEE-nee!\"","In local slang, manini also means small or stingy. \"That's one manini slice of cake.\"",null,"Striped fish nibbling Ma's knees"],["n441","n",441,"ʻalae","ah-LAI","Hawaiian mudhen (gallinule)","A LIE!",["Someone has stolen your spam musubi from the edge of the taro patch where you left it. You walk down the muddy bank looking for the thief.","Standing in the water is a black bird with a bright red forehead and big green feet. It has rice on its beak. Nori on its face. Spam grease on its feathers.","\"Did you eat my musubi?\"","The bird shakes its head. No.","\"A LIE!\" you yell, pointing. The bird freezes. It gulps, a big catch in its throat, and a tiny piece of spam pops out. Its red forehead flashes even brighter, like a stop light.","It runs across the taro leaves on its giant feet, wings flapping, to the other side of the patch. A lie. ʻAlae. The Hawaiian mudhen. Watch your lunch."],"Point at the thief. \"Ah-LAI!\"","In an old story the ʻalae knew the secret of fire, and its forehead turned red when Māui rubbed it with a fire stick. Today the ʻalae ʻula is endangered and lives in wetlands and taro patches.",null,"Red-foreheaded mudhen caught with musubi"],["n442","n",442,"ʻelepaio","eh-leh-PAI-oh","ʻelepaio (forest flycatcher bird)","Eh! Leh! My PIE! Oh!",["Uncle Kawika, a canoe builder, finds the biggest koa tree he has ever seen, deep in the upland forest. Enough wood for a six person canoe. He sets down his lunch, a whole apple pie, and raises his adze.","A tiny brown bird with a cocked up tail lands on the trunk. It hops. It pecks. Peck peck peck. Bugs pour out of the tree like pie filling. The whole inside is rotten.","Then the bird hops over and lands right in Uncle's pie.","\"Eh! Leh... my PIE! Oh!\"","He looks at the bird. He looks at the bugs. He puts down the adze. That little bird just saved him three months of work on a bad tree. So he lets it finish the pie.","Eh, leh, pie, oh. ʻElepaio."],"Shoo a bird off your lunch. \"Eh-leh-PAI-oh!\"","Canoe builders watched the ʻelepaio. If it pecked at a koa tree, the wood was full of insects and no good for a canoe. Many people say its name imitates its call.",null,"Tiny bird sitting in uncle's pie"],["n443","n",443,"ʻapapane","ah-pah-PAH-neh","ʻapapane (red honeycreeper)","Ah, Papa, NAY!",["High in the ʻōhiʻa forest at Volcano, a baby ʻapapane sits in its nest. Bright red feathers, black wings, a curved beak made for flowers.","Its papa flies in with breakfast. A green caterpillar. Very healthy. Wiggling.","The baby turns its head away. \"Ah, Papa... NAY.\"","Papa flies off and comes back with a beetle. \"Ah, Papa, NAY!\" A spider. \"Ah, Papa, NAAAY!\"","The baby points its beak at the tree next to the nest, covered in fluffy red lehua blossoms dripping with sweet nectar. Papa lets out a tiny bird sigh, flies over, and brings back a beak full of nectar. The baby drinks it and sings so loud the whole forest can hear.","Ah, Papa, nay. ʻApapane. The red bird that lives on lehua."],"Turn your head away from an invisible spoon. \"Ah-pah-PAH-neh.\"","The ʻapapane is one of the most common native forest birds, and it sips nectar from red ʻōhiʻa lehua blossoms.",null,"Red baby bird refusing a caterpillar"],["n444","n",444,"hoki","HO-kee","mule","HO! KEY!",["You are visiting a ranch way upcountry. The rancher, Uncle Ikaika, drops the keys to his truck in the grass by the barn. His mule, Pōhaku, sniffs them. Then eats them. GULP.","\"HO! KEY!\" Uncle yells. He shakes the mule. Jingle jingle. The keys are definitely inside.","The truck is not going anywhere. The only way down the mountain is the mule. Uncle climbs on, you climb on behind him, and the mule starts down a steep trail with a hundred switchbacks, slow and steady, never slipping once. With every step you hear the keys jingling in its belly.","Four hours later you reach the bottom. The mule burps. The keys fall out onto the grass, shiny and clean. Uncle picks them up and says the mule was the better ride anyway.","Ho, key. Hoki."],"Pat your pocket for your keys. \"HO-kee!\"","A mule is half horse and half donkey. Horse is lio, and donkey is kēkake, the next word.",null,"Mule jingling with swallowed truck keys"],["n445","n",445,"kēkake","keh-KAH-keh","donkey","Keh! KAAAH! Keh!",["There is a birthday party on a coffee farm in Kona. On the table sits a three layer chocolate cake with 12 candles. Behind the fence stands the farm donkey, Keala, staring at the cake like it is the love of his life.","Nobody sees him open the gate with his nose.","When you turn around, the cake is gone, and the donkey has frosting on his ears, his nose and his eyelashes. A candle sticks out of his mouth, still lit.","He lifts his head, opens his mouth and brays. \"KEEEH! KAAAH! KEH!\" It sounds exactly like \"A CAKE! A CAKE!\" Crumbs spray across the yard.","The kids try to be mad but they are laughing too hard. Keh, kah, keh. Kēkake. The donkey who loves cake."],"Bray like a donkey with a mouth full of cake. \"Keh-KAH-keh!\"","The word comes from the English word jackass. The donkeys that hauled coffee in Kona were nicknamed Kona nightingales because of their loud braying.",null,"Donkey covered in frosting braying \"Cake!\""],["n446","n",446,"lāpaki","laah-PAH-kee","rabbit","Laaa... PARKIES!",["Your class has 40 pet rabbits, and the teacher decides they should see snow. So in winter the whole class drives them up Mauna Kea, 13,000 feet high, in a van that smells like carrots.","The rabbits hop out into the snow and start shivering. Their ears shake. Their noses turn pink. One tries to hide inside your sock.","Your little sister opens her backpack. For three months she has been secretly knitting. Out come 40 tiny rabbit parkas, each one a different color, each with a hood that has two holes for the ears. She ca
