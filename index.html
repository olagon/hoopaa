is letters come out like wet noodles. The water fills the street. It rises over the curb. It rises to your knees.","She yells \"POOL!\" By the end, the whole street is one big swimming pool, and she is floating in the middle of it on an inner tube, wearing sunglasses.","She wet everybody. She soaked the whole block. Hose, oh, pool."],"Aim an invisible hose. \"Ho-oh-POO-loo!\"","Pulu is to be wet. Hoʻopulu is to make something wet, from watering a plant to dunking your brother.",null,"Old lady with fire hose flooding street"],["v276","v",276,"hoʻomahana","ho-oh-mah-HAH-nah","to warm up","HO! OH! MONTANA!",["A cowboy from Montana steps off the plane in Honolulu. He has been cold for 40 years. He is wearing three coats, two hats, and a scarf wrapped around his neck eleven times. There are icicles in his mustache.","He walks out into the sunshine, throws his arms wide, and shouts \"HO! OH! MONTANA!\" like he is saying goodbye to it forever.","He lies down on the hot sand at Waikīkī. Steam rises off him. The icicles melt and drip. He peels off one coat. Then the second. Then the third. His toes turn from blue to pink. His frozen belt buckle thaws and falls off.","After six hours he is finally warm all the way through. He sits up, smiles, and orders a hot chocolate anyway, because old habits die hard.","He warmed up. Ho, oh, Montana."],"Rub your hands together and blow on them. \"Ho-oh-mah-HAH-nah.\"","Mahana means warm. Its opposite in this list is hoʻomaʻalili (#277), to cool down.",null,"Frozen cowboy thawing on Waikīkī sand"],["v277","v",277,"hoʻomaʻalili","ho-oh-mah-ah-LEE-lee","to cool down","MA... (gulp) AH... LILY!",["It is the chili cook off. The final judge takes one spoonful of the hottest chili ever made. It has 90 peppers in it.","His face turns red. Then purple. Then a color no one has ever seen. Steam blows out of his ears like a train whistle. His hair stands straight up and smokes.","He staggers out of the tent looking for anything cold. Then he spots the pond behind the tent, covered in lily pads. He points and croaks \"MA...\" His throat catches, a little gulp. \"...AH... LILY!\" He means the lily pond.","He dives in head first. SSSSSSSSSS. A cloud of steam rises 30 feet. The frogs leap out. The water starts bubbling like a hot tub.","Finally he floats on his back, cooled down, while the frogs fan him with little leaves."],"Fan your face fast. \"Ho-oh-mah-ah-LEE-lee.\"","Maʻalili means cooled off, like hot food that has cooled or anger that has calmed. Hoʻomaʻalili is cooling something down on purpose.",null,"Chili judge steaming in a lily pond"],["v278","v",278,"lū","LOO","to scatter, to shake off","LOOOOO...",["The lūʻau is perfect. Two hundred guests. White tablecloths. The kālua pig just came out of the imu.","Then the host's dog, Keiki, a 150 pound fluffy monster, comes running up from the beach. He is dripping wet and covered in sand.","He stops right in the middle of the tables. Everybody knows what is coming. The whole party tries to yell \"LOOK OUT!\" but only the first part comes out, long and slow. \"LOOOOOOOOOO...\"","Keiki shakes. He shakes from nose to tail like a washing machine. Water and sand scatter in every direction. It hits the guests, the pig, the band, the dessert table, the dancers and the roof of the tent.","He shakes one more time for good measure. \"LOOOOOOO!\" Everybody is sandy. Keiki is dry and happy. He scattered everything."],"Shake your whole body like a wet dog. \"LOOOO.\"","Lū is also used for scattering seeds on the ground or flinging something off. The long ū is the long shake.",null,"Wet dog shaking sand on the lūʻau"],["v279","v",279,"kāpīpī","kaah-pee-PEE","to sprinkle","CAAAR! BEEEEP! BEEEEP!",["Every Saturday a tiny rainbow car drives through your neighborhood. It is the size of a golf cart. On its roof is a giant salt shaker, but it is full of rainbow sprinkles.","You hear it before you see it. \"CAAAAAR! BEEEEEP! BEEEEEP!\" Every sound held long, like an old horn.","It drives slowly past each house, sprinkling everything. Sprinkles on the lawns. Sprinkles on the cats. Sprinkles on the bald man washing his car. He does not mind. He licks his head.","Kids chase it with bowls of ice cream. Birds follow it like a parade. By the end of the block, the whole street looks like a birthday cake.","Then it drives away. \"CAAAR... BEEEEP... BEEEEP...\" It never dumps. It never pours. Just tiny little sprinkles. That is kāpīpī."],"Sprinkle salt from your fingertips. \"Kaah-pee-PEE.\"","Lū (#278) is a big shake or scatter. Kāpīpī is a light little sprinkle, like salt on a tomato or water on plants.",null,"Tiny car sprinkling the whole neighborhood"],["v280","v",280,"mahiʻai","mah-hee-AI","to farm","Old MA had a farm... EE (gulp) EYE!",["Your Ma quits her office job, sells the car, and buys a farm up in Kula. She has never grown anything except mold on leftovers.","On day one she stands in the field in rubber boots and sings as loud as she can. \"Old MA had a farm... EE...\" Then she gets choked up and gulps. \"...EYE!\" She stops right there because she is too happy to finish.","She plows the field with a rototiller that drags her 40 feet. She plants taro, sweet potato and cabbage in perfectly straight rows. She buys six chickens and a goat that eats her hat.","Every morning at sunrise you hear her out in the field. \"Ma... ee... EYE!\" The cabbages grow to the size of beach balls. The sweet potatoes come up purple and huge. Ma is a farmer now."],"Hoe an invisible row. \"Mah-hee-AI!\"","A mahiʻai is also a farmer. Growing kalo, taro, is the classic Hawaiian kind of farming.",null,"Ma singing on her new farm"],["v281","v",281,"lawaiʻa","lah-VAI-ah","to fish","La, la, la... WHY? AH!",["Uncle sits at the end of the pier with his fishing pole. He sings the same little song every time he goes fishing. \"La, la, la...\"","Nine hours. Nothing. Not one nibble. The sun goes down. He looks up at the sky and sings \"La... WHY?\" His voice catches in his throat.","Then his pole bends in half. Something huge is on the line. \"AH!\" He braces his feet. He pulls. The fish pulls back. The pier creaks. Uncle leans back so far he is almost lying down. People come running with flashlights.","\"LA! WHY! AH!\" He hauls up an ulua bigger than a surfboard. It flops onto the pier, knocks over his cooler, and looks at him like it is annoyed.","Uncle sits back down, opens a soda, and starts singing again. \"La, la, la...\" He will be back tomorrow."],"Reel in an invisible fish. \"Lah-VAI-ah!\"","A lawaiʻa is also a fisherman.",null,"Uncle singing, hauling up giant ulua"],["v282","v",282,"kālai","kaah-LAI","to carve","CAAAR? LIE!",["There is a 90 year old woodcarver down the road who can carve anything. A bowl. A canoe paddle. A spoon so thin you can see through it. A perfect wooden pineapple.","One day he tells the neighborhood kids \"Today I carve a car.\"","The kids laugh. \"CAAAAR? LIE!\"","He does not argue. He picks up a mango log the size of a school bus and starts carving. Chips fly. Sawdust fills the air like snow. He carves wheels. He carves seats. He carves a steering wheel, a mirror and a pair of fuzzy dice.","At sunset he blows off the last of the dust. The kids are still saying \"Car? LIE!\" He climbs in, turns the wooden key, and drives off down the road at 40 miles an hour, honking a wooden horn.","The kids stand there with their mouths open. Not a lie. He carved a car."],"Chip at an invisible block with a chisel. \"Kaah-LAI.\"","Kālai kiʻi means to carve an image or statue. Kālaiʻāina, carving up the land, is the word for politics.",null,"Old carver drives off in wooden car"],["v283","v",283,"kāpili","kaah-PEE-lee","to build, to glue together","CAAAR! PEEEL! EEE!",["Soapbox derby day. You built your race car out of 10,000 popsicle sticks and every tube of glue in the house. It took you all summer.","You line up at the top of the hill. The flag drops. You roll. Faster. Faster. Then you hear it. The car is peeling apart. \"CAAAAR!\" you yell as a board flies off. \"PEEEEL!\" Another one. \"EEEEEE!\"","But your little sister is running right next to you holding a hot glue gun like a firefighter with a hose. She glues the wheel back on. She glues the seat back on. She glues the steering wheel back on. She glues your hat to your head by accident.","You cross the finish line with half a car and a sister stuck to the side of it. First place.","Build it. Glue it together. Kāpili."],"Press your two palms together like gluing. \"Kaah-PEE-lee.\"","Kāpili is used for building a house or a boat, and for gluing a broken plate back together.",null,"Sister hot gluing a race car mid-race"],["v284","v",284,"hoʻohana","ho-oh-HAH-nah","to use","HO! OH! HANNAH!",["Your friend Hannah can use anything for anything.","The TV remote is lost? She uses a spatula. The front door won't stay open? She uses a slippah. A gecko gets in the house? She catches it with a colander. She uses a cooler as a chair, a surfboard as a table, and a rice paddle to fix the lawn mower.","Every time she does it, everybody yells \"HO! OH! HANNAH!\"","Today your car breaks down on the side of the road. Hannah opens the hood, looks inside, and pulls a musubi out of her purse. She eats the musubi. Then she uses the plastic wrapper to fix the fan belt. The car starts.","\"HO! OH! HANNAH!\" Around her, nothing goes to waste. Everything gets used."],"Pick up whatever is near you and pretend it is a phone. \"Ho-oh-HAH-nah.\"","Hana means work, or to do. Hoʻohana makes a thing do work, so it means to use.",null,"Hannah fixing car with musubi wrapper"],["v285","v",285,"hoʻonohonoho","ho-oh-no-ho-NO-ho","to arrange, to organize","NO! HO! NO! HO!",["The wedding planner has a clipboard, a whistle and a headset. She has 600 folding chairs to set up on the lawn in exactly 60 rows.","Your family is helping. That is the problem. Uncle sets a chair facing backward. \"NO! HO!\" she yells, blowing the whistle. Your cousin stacks three chairs in a pyramid. \"NO! HO! NO! HO!\" Grandma drags her chair into the shade under a tree, far from everything. \"NOOOO! HO!\"","She marches through the rows with a tape measure. She moves each chair a quarter inch. She lines up the legs with a laser. She makes every flower face the same direction.","By sunset the rows are so straight you could use them as a ruler. She lowers the whistle and smiles. Then the wind blows one chair over. \"NO! HO!\""],"Line up invisible chairs in a row. \"Ho-oh-no-ho-NO-ho.\"","Noho means to sit, or a chair. Hoʻonohonoho is putting things in their place, like chairs, flowers, or your whole schedule.",null,"Wedding planner arranging six hundred chairs"],["v286","v",286,"hoʻomākaukau","ho-oh-maah-kow-KOW","to prepare, to get ready","HO! OH! MOCK! Ka-POW!",["Tūtū has signed up for the boxing tournament. The fight is in one month. She is 81.","She gets ready. Every morning at 4 am she runs up the Koko Head stairs with a 25 pound bag of rice on her back. She jumps rope with a garden hose. She does pushups with a grandchild sitting on her back.","Then she does mock fights in the carport against a punching bag made from an old futon. \"MOCK! Ka-POW! MOCK! Ka-POW!\" Each punch is louder. One punch sends the futon flying into the neighbor's yard.","She prepares her meals. She prepares her gloves. She prepares a playlist. She even prepares a victory speech and practices it in the bathroom mirror.","The night before the fight everything is laid out on the bed. Shoes. Gloves. Mouthguard. Two musubi. She is prepared."],"Throw two practice punches. \"Ho-oh-maah-kow-KOW.\"","Hoʻomākaukau is getting ready. Mākaukau (#287) is being ready, or being skilled.",null,"Tūtū training with rice bag and futon"],["v287","v",287,"mākaukau","maah-kow-KOW","to be ready; to be skilled","MAAAA... CAW! CAW!",["The pet store has a parrot. A big red and blue macaw named Captain.","Captain can do everything. It can juggle three mangoes. It can flip pancakes with its feet. It can play the ʻukulele, badly, and do your taxes, very well.","When it is ready for the next trick, it screams \"MAAAAAA... CAW! CAW!\" A long start, then two sharp caws. Everybody knows that means it is ready.","Today a kid brings in a wooden puzzle box that nobody has ever opened. Captain looks at it. It stretches its wings. It cracks its neck. \"MAAAAAA... CAW! CAW!\" It opens the box in four seconds.","The kid asks \"Can you do my homework?\" Captain is already on page two. Ready. Skilled. Ma, caw, caw."],"Flap your elbows and squawk. \"Maah-kow-KOW!\"","Teachers ask \"Mākaukau?\" meaning Ready? and the class answers \"Mākaukau!\"",null,"Macaw that can do everything"],["v288","v",288,"hoʻolako","ho-oh-LAH-ko","to supply, to provide","HO! OH! A LOT, OH!",["There is one old man in the valley who supplies everybody. Nobody knows where he gets it all.","When a storm is coming, he drives down the road in an old flatbed truck piled 20 feet high. Rice. Water. Batteries. Toilet paper. Canned sardines. A generator. A spare canoe.","He stops at every house. \"How much rice you need?\" You say \"Uh, a little?\" He shakes his head. \"HO! OH! A LOT, OH!\" He throws three bags on your porch. \"Batteries?\" \"A few?\" \"HO! OH! A LOT, OH!\" Forty batteries.","By the end of the road, every family has enough for a year. The truck is empty. He drives home whistling.","The next morning the truck is full again. Nobody asks how. He supplies. He provides. A lot, oh."],"Stack invisible boxes higher and higher. \"Ho-oh-LAH-ko.\"","Lako means well supplied, having plenty. Hoʻolako is giving people what they need.",null,"Old man's truck supplying the valley"],["v289","v",289,"lawa","LAH-vah","to be enough","LAVA! LAVA!",["You order a loco moco at the diner. Rice, hamburger patty, fried egg. Then you grab the gravy pitcher.","You pour. Brown gravy flows over the egg like lava. It covers the patty. It buries the rice. It spills over the edge of the plate. It creeps across the table like a slow river, bubbling.","The waitress yells \"LAVA! LAVA!\" meaning stop, enough. You keep pouring. The gravy reaches the floor. It flows out the front door. A man on the sidewalk has to jump over it.","\"LAVA! LAVA!\" she yells again, and grabs the pitcher right out of your hands. She points at your plate. \"That is enough.\"","You look down. She is right. It is enough. You never need more gravy than that. Well. Maybe a little more."],"Hold up your palm to say stop. \"LAH-vah!\"","Ua lawa means that is enough. Just Lawa! by itself works like Enough! or That's plenty. Listen to the ending. Lawe (take) ends in \"eh.\" Lawa (enough) ends in \"ah,\" like a happy sigh after a big plate. Ahh, enough.",null,"Gravy lava flowing off a loco moco"],["v290","v",290,"hoʻomau","ho-oh-MOW","to keep going, to continue","HO! OH! MOW!",["Uncle starts mowing his lawn on Saturday morning. He finishes the front yard. But it feels so good he keeps going.","He mows the neighbor's lawn. He mows the park. He mows across the school field and down the side of the H-1. Traffic slows down to watch. \"HO! OH! MOW!\" he shouts, waving.","He mows through the night with a flashlight taped to his hat. He mows past Ala Moana. He mows a golf course. He does not stop for lunch. His wife drives next to him and passes him musubi through the car window.","On Sunday he is in Waimānalo. On Monday he reaches the North Shore. Behind him the grass looks perfect for 60 miles.","When people ask him why he doesn't stop, he just yells \"HO! OH! MOW!\" and keeps going."],"Push an invisible mower forward, and do not stop. \"Ho-oh-MOW.\"","Hoʻomau is often used as a motto, meaning keep going, persevere, never give up.",null,"Uncle mowing across the whole island"],["v291","v",291,"hoʻopau","ho-oh-POW","to finish off, to use up, to waste","HO! OH! POW!",["Your big brother is home from college for the weekend. That means everything in the house is about to disappear.","He opens the fridge. POW. The rice pot is empty. POW. A gallon of ice cream, gone. POW. The whole family pack of chicken katsu, gone. Every time he finishes something off, there is a little explosion of crumbs and a POW.","He takes a 45 minute shower. POW. No hot water for anyone. He uses the last roll of toilet paper. POW. He leaves every light in the house on. POW POW POW.","Mom stands in the kitchen staring at the empty cabinets. \"HO! OH! POW!\"","By Sunday he has finished off everything, used up everything, and wasted whatever was left. He hugs everybody goodbye and asks for gas money."],"Clap once, loud, like something just ran out. \"Ho-oh-POW!\"","Pau means done or finished, and locals use it in everyday English, like pau hana for after work. Hoʻopau means to make something pau.",null,"Brother emptying the fridge, POW"],["v292","v",292,"hoʻokoe","ho-oh-KO-eh","to save some for later, to leave some","HO! OH! KOI... EH!",["Dad has one rule at dinner. Always save some for the koi.","He has a pond in the backyard with 12 koi. After every meal, before anyone can finish, he takes one scoop off every plate. Rice. Noodles. Half a musubi. He drops it all in a bucket and says \"HO! OH! KOI... EH!\"","He has done this for 20 years. The family has learned. Nobody eats the last bite. They leave it on the plate for later.","The koi are now enormous. Each one is the size of a golden retriever. They wait at the edge of the pond with their mouths open at 7 pm sharp. One of them has learned to ring a bell.","When Dad passes you a slice of cake, you already know what to do. You eat half. You leave some. \"Koi, eh!\""],"Push half your plate aside. \"Ho-oh-KO-eh.\"","Koe (#293) is what is left over. Hoʻokoe is making sure some is left, saving it on purpose.",null,"Giant koi waiting for saved leftovers"],["v293","v",293,"koe","KO-eh","to be left over","Coy, eh?",["It is the end of the party. On the long table there is one piece of fried chicken left over in the tray. Just one.","Forty people want it. Nobody takes it. Everybody is being polite. Everybody is being coy. Aunty looks at it, then looks away. Uncle reaches for it, then pretends he was scratching his arm.","Somebody whispers \"Coy, eh?\" Everybody laughs nervously.","An hour goes by. The chicken is still there. The party ends. People go home. The chicken stays on the table, alone, under a paper towel.","Three days later it is still there. It gets a name. The kids visit it. Somebody builds a little fence around it. Five years later it sits in a glass case at the family reunion with a sign that says LEFT OVER. Nobody ever took it."],"Point at the last piece on an invisible plate. \"KO-eh.\"","Koe also means the rest, what remains. Hoʻokoe (#292) is leaving some on purpose, koe is whatever ends up left.",null,"Last chicken piece nobody takes"],["v294","v",294,"hoʻopaneʻe","ho-oh-pah-NEH-eh","to postpone","Pa? NAY (hic) EH.",["There is a leak in the roof over the living room. Mom asks Pa to fix it.","Pa is on the couch. He waves his hand. \"Pa? NAY...\" A little hiccup. \"...eh. Tomorrow.\"","Tomorrow comes. \"Pa, the roof?\" \"NAY, eh. Next week.\" Next week comes. \"NAY, eh. After football season.\" The bucket under the leak fills up. Then a second bucket. Then a kiddie pool.","Eleven years pass. The living room is now an indoor pond. There are fish in it. Pa paddles an inflatable raft across the room to get to the fridge. Every time someone mentions the roof, he pushes it back again. \"Nay, eh. Next year.\"","Finally the whole roof falls in. Pa looks up at the open sky and says \"Tomorrow.\" Ho, oh, Pa, nay, eh."],"Wave a lazy hand and push something away. \"Ho-oh-pah-NEH-eh.\"","Neʻe means to scoot or move along. Hoʻopaneʻe is like scooting a date further down the calendar.",null,"Pa rafting across flooded living room"],["v295","v",295,"hoʻopōkole","ho-oh-poh-KO-leh","to shorten","Pooo', COLLIE!",["Your neighbor's collie, Duke, has the longest fur on the island. It drags behind him like a wedding dress. He sweeps the sidewalk when he walks. Birds nest in it.","Summer comes. It is 92 degrees. Duke is overheating. So the neighbor takes him to the groomer.","The groomer brings out the clippers. BZZZZZ. Off comes the fur, pile after pile, until it fills the shop to the ceiling. When she is done, Duke is tiny and skinny and pink. He looks like a chicken with ears.","Everybody on the street sees him and says \"Poooooo' COLLIE!\" holding that oh sound long out of pity. The groomer shortened his fur. She also shortened his leash, his tail bow, and his name. Now he is just Du.","Ho, oh, pooo' collie. Everything about him is shorter."],"Snip invisible scissors close together. \"Ho-oh-poh-KO-leh.\"","Pōkole means short. Loa means long. Hoʻopōkole makes something short, like cutting a long story short.",null,"Shaved collie looking like a chicken"],["v296","v",296,"hoʻoluhi","ho-oh-LOO-hee","to wear out, to burden","HO! OH! LOUIE!",["Your nephew Louie is three. He has more energy than a power plant.","He wants a piggyback ride. You say okay. He climbs on your back at 9 in the morning and never gets off. You carry him around Ala Moana. He points left. \"HO! OH! LOUIE!\" you gasp, and go left. He points up the escalator. You go up. He points down. You go down.","By noon your legs are shaking. By 2 pm you are crawling on your hands and knees, and he is still riding you like a horse, kicking your sides, yelling \"Faster!\" He also has three shopping bags on his lap that you are somehow carrying too.","By 5 pm you lie face down on the food court floor. Louie climbs off, fresh as a daisy, and asks \"Again?\"","He wore you out. He was the burden. HO, OH, LOUIE."],"Hunch over like you are carrying someone heavy. \"Ho-oh-LOO-hee.\"","Luhi (#297) is to be tired. Hoʻoluhi is to make someone tired, to wear them out or weigh them down.",null,"Louie riding piggyback all day"],["v297","v",297,"luhi","LOO-hee","to be tired, worn out","LOUIE... hee.",["Remember Louie from hoʻoluhi? After wearing out the whole family, it finally happens. Louie runs out of power.","It happens at dinner. He is holding a spoon of rice halfway to his mouth. His eyes start to close. His head starts to drop. Slower. Slower. His whole body goes soft like melted butter.","Everybody at the table leans in and whispers \"Louie...\"","He lets out one tiny, tired giggle. \"...hee.\" Then his face lands in his mac salad. FLOMP. Asleep. Snoring. Mac salad on his cheek.","They carry him to bed. He is so worn out he sleeps for 16 hours straight. A rooster crows right on the windowsill. He does not move. The dog licks his face. Nothing. He is totally, completely worn out. Louie... hee."],"Let your head drop slowly onto your hands. \"LOO-hee.\"","Luhi can also mean tiring or tedious, a burden that wears you out.",null,"Louie asleep face down in mac salad"],["v298","v",298,"ʻuā","oo-AAH","to shout, to yell","OOH (gulp) AAAAAAH!",["At the high school football game there is one fan everybody knows. He is a tiny old man, 80 pounds, four foot ten, with a foam finger bigger than he is.","When the home team scores, he climbs up on the bleachers. He takes a breath. There is a little catch in his throat. Then he yells.","\"OOH... AAAAAAAAAAAAAAAAH!\"","The long AAAAH goes on for 20 seconds. The goalposts bend. The ref's whistle flies out of his mouth. The quarterback's helmet spins around backward. Car alarms go off in the parking lot. A flock of birds turns around.","The team scores again. \"OOH... AAAAAAAAAAH!\" Windows in the school rattle. The principal crawls under his desk.","Nobody knows how that much yell fits inside such a tiny man. But everybody on the island has heard it."],"Cup your hands around your mouth. \"Oo-AAAAH!\"","Three ways to be loud in this list. ʻUā is shouting, hea (#299) is calling out to someone, hoʻōho (#300) is crying out in surprise.",null,"Tiny old fan's yell bending goalposts"],["v299","v",299,"hea","HEH-ah","to call out; to name","HEY, AH!",["The lady next door calls her kids home for dinner the same way every night. She stands on her porch, takes a breath so big her apron lifts, and yells \"HEY, AH! KEONI! HEY, AH! MALIA!\"","Her kids are two miles away at the beach. They hear it. Surfers out at the reef hear it and start paddling in, just in case. A fishing boat turns around. A dog at the park drops its ball and runs toward her house.","Then she calls everybody by name, one at a time. The kids. The cousins. The dog. The cat. The chickens. The mailman. \"HEY, AH! Pualani! HEY, AH! Uncle! HEY, AH! Mister Rooster!\"","In five minutes her dinner table has 32 people and 3 animals around it. Only 2 of them are her kids."],"Cup your hands and call across a valley. \"HEH-ah!\"","The same spelling hea also means where, as in Aia i hea? Where is it?",null,"Neighbor calling the whole island to dinner"],["v300","v",300,"hoʻōho","ho-OH-ho","to cry out, to exclaim","HO! OHHHHH! HO!",["It is your birthday. You come home after a long day. The house is dark. You flip on the light.","Sixty people jump out. \"SURPRISE!\" You drop your bag and scream \"HO!\"","Then the giant cake on the table starts shaking. The top pops off and a full grown horse jumps out, covered in frosting, wearing a party hat. You gasp and hold it long. \"OHHHHHHHHHHH!\"","The horse gallops across the living room, knocks over the punch bowl, and does a little dance. The confetti cannon goes off. The dog starts howling. Grandma faints onto the couch, then sits right back up to take a picture.","You stand in the middle of it all with both hands on your head and let out the biggest exclamation of your life. \"HO! OHHHHH! HO!\"","That is hoʻōho. A cry of surprise with a long oh in the middle."],"Throw your hands up in surprise. \"Ho-OHHH-ho!\"","Locals shout Ho! for everything, good food, big waves, bad traffic. Hoʻōho is the proper word for crying out like that.",null,"Horse jumping out of birthday cake"],["v301","v",301,"hoʻolono","ho-oh-LO-no","to listen, to pay attention","Ho! Oh! LOW! NO!",["You are the DJ at a backyard party in Waimānalo. Your speakers are as big as refrigerators and the bass is making the chicken long rice hop off the paper plates.","Uncle Boy runs over waving both arms like he is landing a plane. \"HO! OH! LOW! NO!\" Turn it low. No more music. Right now.","You kill the sound. Uncle holds up a tiny radio the size of a matchbox. They are about to read the winning number for a free pickup truck. Two hundred people lean in at the same time. Nobody chews. A baby stops crying halfway through. The dog tilts one ear at the radio.","\"Ho, oh, low, no,\" Uncle whispers again. Listen. Pay attention.","The number is read. It is on your ticket. Two hundred heads turn and stare at you. You were listening so hard you forgot to breathe."],"Cup one hand behind your ear and lean in. \"Ho-oh-LO-no.\"","Lono means news or a rumor, the thing you hear. Hoʻolohe is another common word for to listen.",null,"Party freezing to hear a tiny radio"],["v302","v",302,"walaʻau","vah-lah-OW","to talk, to chat, to chatter","Wah! La! OW!",["You get the middle seat on a five hour flight to the continent. On your left is Aunty Lei. On your right is Aunty Pua. They have not seen each other in 11 years.","They talk across you the whole way. Words fly past your nose like popcorn. Cousins, weddings, a guy who owes somebody $40 since 1996, a dog that ate a whole ham. They talk through takeoff. They talk through the snack. They talk through the movie and nobody is watching the movie.","By hour three your left ear is ringing. By hour four your right ear goes numb. You finally cry out \"WAH... LA... OW!\"","They do not even notice. Aunty Lei hands you a cracker without looking and keeps going. When the plane lands they are still chattering on the jet bridge."],"Flap your hand open and shut like a mouth that won't stop. \"Vah-lah-OW.\"","Local folks sometimes use walaʻau in everyday talk too, meaning to just chat and talk story.",null,"Two aunties chattering across your face"],["v303","v",303,"haʻiʻōlelo","hah-ee-oh-LEH-lo","to give a speech","Hi! Oh! HELLO!",["You are the class speaker at graduation. The stadium holds 10,000 people. Every one of them has a lei and an air horn.","You walk up to the podium. You tap the microphone. It booms like thunder over Aloha Stadium. And then, right there, you get the hiccups.","\"Hi! (hic) Oh! (hic) HELLO!\"","Ten thousand people yell back \"HELLO!\" Somebody's tutu blows an air horn. You try again. \"Hi! (hic) Oh! (hic) HELLO!\" Every hiccup is a little catch in your throat, right where the word has its ʻokina.","You give up on fixing it and just go. You give the whole speech with hiccups. Forty five minutes about dreams and hard work and thanking your mom. When you finish, the crowd stands and chants \"HI! OH! HELLO!\" like it is your name."],"Hold an invisible mic and hiccup twice. \"Hah-ee-oh-LEH-lo.\"","Haʻi means to tell and ʻōlelo means words or language. So a speech is telling words.",null,"Graduation speaker with loud hiccups"],["v304","v",304,"hōʻoiaʻiʻo","hoh-oy-ah-EE-oh","to confirm, to prove","Hōōō! Oy! Ah, EE-OH!",["Uncle Kimo swears his donkey can do math. Nobody at the feed store believes him. \"Prove it,\" they say. \"Prove it or buy everybody lunch.\"","So Uncle backs up his truck and out comes the donkey. It is wearing reading glasses. Uncle holds up a chalkboard. Two plus two.","\"HŌŌŌ! OY!\" Uncle yells, a long proud shout. The donkey stamps its hoof. One. Two. Three. Four. Then it throws back its head and brays \"AAAH, EE-OH!\"","The feed store goes silent. Somebody tries seven plus five. Twelve stamps. \"AAAH, EE-OH!\" Nine times nine. The donkey stamps for three minutes straight while a guy counts on his fingers. Eighty one. \"AAAH, EE-OH!\"","It is confirmed. Uncle proved it. The feed store buys him lunch, and the donkey gets a whole bag of carrots."],"Stamp your foot four times, then bray. \"Hoh-oy-ah-EE-oh.\"","ʻOiaʻiʻo means truth or true. Hōʻoiaʻiʻo is to show that something is true, to prove or confirm it.",null,"Donkey in glasses stamping out math"],["v305","v",305,"manaʻoʻiʻo","mah-nah-oh-EE-oh","to believe, to have faith","Ma, NOW? Oh... YEE-OH!",["You are nine years old, standing on the top platform of a zipline in the mountains. The line runs 2,000 feet across a valley. Down below, the trees look like broccoli.","Your mom is already on the other side, waving. She calls over the radio, \"You gotta believe, baby. The rope going hold. Just trust and go.\"","Your knees knock. You grip the handle. \"Ma... NOW?\" You gulp so hard it makes a little click in your throat. \"Oh...\"","Then something in your chest decides to believe. You jump. \"YEE-OH!\"","You fly over the valley like a bird with a helmet on. A goat on a cliff watches you go by. You land in your mom's arms, and she says \"See? Ma, now, oh, yee-oh. You believed.\""],"Close your eyes, lean forward like you're jumping. \"Mah-nah-oh-EE-oh.\"","Manaʻo means thought and ʻiʻo means true or real, so to believe is to hold a thought as true. Same ʻiʻo as in hōʻoiaʻiʻo.",null,"Kid on a zipline shouting yee-oh"],["v306","v",306,"hilinaʻi","hee-lee-NAH-ee","to trust, to rely on","He LEAN! NAH... EEE!",["Company picnic at Magic Island. The boss decides everyone must do the trust fall.","First up is Big Uncle Sonny. He is 350 pounds and made of pure plate lunch. He climbs onto the picnic table. Behind him, twelve coworkers lock arms and hold a beach towel.","\"You gotta trust us!\" they shout. Uncle Sonny closes his eyes. He starts to tip back. Everyone yells \"He LEAN! He LEAN!\"","Halfway down, his faith runs out. \"NAH... EEEEE!\"","Too late. He falls like a tree. The twelve coworkers catch him. Their knees shake. The towel rips. One guy's slipper flies into the ocean. But Uncle Sonny does not touch the grass.","He opens his eyes and smiles. \"Okay,\" he says. \"I trust you guys now.\" And from that day on, he relies on them for everything."],"Lean back a little, then squeal. \"Hee-lee-NAH-ee.\"","Hilinaʻi is also a noun, trust or confidence. You can hilinaʻi a friend, a plan, or a rope.",null,"Twelve coworkers catching a falling uncle"],["v307","v",307,"hoʻokaʻulua","ho-oh-kah-oo-LOO-ah","to put off, to procrastinate","Ho, oh... gotta go LŪʻAU.",["Your mom says the house needs painting. One gallon for each wall. The brushes are right there. You say sure, you'll start today.","Then your phone buzzes. A cousin's baby is turning one. \"Ho, oh... gotta go lūʻau,\" you say, and you leave.","Next day, brush in hand. Buzz. A graduation party. \"Ho, oh... gotta go lūʻau.\" Next day, a retirement party. Then a wedding. Then a party for a guy's new boat. You go to 31 lūʻau in 31 days. You eat so much kālua pig that you have to buy new shorts.","The paint cans sit on the porch. A family of geckos moves into one of them. Moss grows on the brushes. Your mom paints the whole house herself while you are out.","When you finally come home, she hands you a brush. \"Ho, oh... gotta go lūʻau?\" she says. \"Not today.\""],"Wave at a paint can and turn away. \"Ho-oh-kah-oo-LOO-ah.\"",null,null,"Paint cans ignored while you party"],["v308","v",308,"hoʻolana","ho-oh-LAH-nah","to give hope; to float something","Hold on, LANA!",["Your fishing boat sank in the middle of Kāneʻohe Bay. You are treading water, and your arms feel like cooked noodles. No boats in sight. You start to lose hope.","Then from the shore, a little kid throws something. It lands with a SPLOOSH next to you. It is a giant pink inflatable llama named Lana, the size of a pickup truck, with sunglasses painted on.","\"HOLD ON, LANA!\" the kid yells. You grab her neck. Lana floats you. She floats you so well your head is dry. The sun comes out. You feel hope come back into your whole body.","You ride Lana like a parade float all the way back to the sandbar. People cheer. You wave. Lana smiles her painted smile. She floated you, and she gave you hope. Hold on, Lana."],"Hug an invisible floatie. \"Ho-oh-LAH-nah.\"","Lana by itself means to float. Hoʻo makes something else float, and hope works the same way. It keeps you up.",null,"Giant pink llama floatie saving you"],["v309","v",309,"paipai","pai-PAI","to encourage, to urge on","PIE! PIE!",["Your little cousin Keoni is learning to ride a bike on a hill in Mānoa. He is scared. He wobbles. He stops. He wants to quit.","So the whole family lines the street. Forty people. Grandpa, the aunties, the neighbors, a guy delivering mail. And at the bottom of the hill, Tūtū holds up a coconut cream pie as big as a car tire.","\"PIE! PIE! PIE! PIE!\" everybody chants, clapping. Keoni pushes off. He wobbles. \"PIE! PIE!\" He pedals harder. \"PIE! PIE! PIE!\" The mailman is jumping. The dog is barking in rhythm.","Keoni rolls all the way down and crashes face first into the pie. He comes up covered in cream, grinning. That is what encouragement looks like. A whole street yelling \"Pie, pie!\" until you go."],"Clap twice and chant. \"Pai-PAI!\"",null,null,"Crowd chanting pie at a kid on a bike"],["v310","v",310,"hoʻohālike","ho-oh-haah-LEE-keh","to imitate, to model after","Ho, oh, HAAAH... like-eh!",["A mynah bird moves onto your lanai and starts copying you. Everything.","You yawn. It yawns. You scratch your ʻōkole. It scratches its tail feathers. You sneeze, and it does a perfect fake sneeze. You say \"Ho, oh,\" and it says \"Ho, oh.\" You sigh a big long \"HAAAH,\" and it sighs \"HAAAH.\"","By Tuesday it is wearing tiny slippers. By Friday it has learned to walk like you, a little bowlegged, with a musubi in one claw.","Your friend comes over and looks back and forth between you and the bird. \"Ho, oh, haaah... like eh! Alike!\" You two are exactly alike. The bird imitates the shocked look on your face.","It even answers your phone now. Your aunty cannot tell the difference."],"Copy someone's move and add a long sigh. \"Ho-oh-haah-LEE-keh.\"","Like means alike or the same. Hoʻohālike is to make yourself like something else, to copy it. The long ā is that big sigh.",null,"Mynah bird copying your every move"],["v311","v",311,"hoʻohālikelike","ho-oh-haah-lee-keh-LEE-keh","to compare","Haaah... LIKE-eh, LIKE-eh?",["County fair, the giant pumpkin contest. Two farmers wheel in two orange monsters, each one the size of a small car. They look exactly the same.","The judge is a tiny old aunty with a clipboard and a measuring tape. She walks around pumpkin one. She walks around pumpkin two. She holds her hands up like a scale, one hand for each.","\"Haaah... like-eh... like-eh?\" she mutters. Are they alike? She measures the stems. She knocks on each one like a door. She sniffs them. She lies down on the grass and compares the bottoms.","The crowd waits two hours. The mynah from hoʻohālike lands on top of pumpkin one and copies her.","Finally she finds it. Pumpkin two has one extra freckle. She holds up the blue ribbon. \"Compared!\" The crowd goes wild."],"Hold your hands out like a scale, up and down. \"Ho-oh-haah-lee-keh-LEE-keh.\"","Hoʻohālike can mean to copy or to compare. Doubled, hoʻohālikelike is a comparison, holding two things side by side to see how alike they are.",null,"Aunty judging two identical giant pumpkins"],["v312","v",312,"kaʻana","kah-AH-nah","to share","Ka...? AH! NAH!",["Your little brother gets a box of 80 malasadas for his birthday. He hugs the box like a baby. His cheeks are already full of sugar.","Your cousin walks up. \"Can I ka...\" Before he even finishes, your brother goes \"AH! NAH!\"","Another cousin. \"Ka...?\" \"AH! NAH!\" The dog walks over. \"AH! NAH!\" A neighbor, the mailman, a pigeon. \"AH! NAH! AH! NAH!\"","Then Tūtū steps out of the kitchen. She is holding a bread knife the size of a canoe paddle. She takes the box, cuts every malasada into four, and walks around the yard handing out pieces to all 26 people and the dog. There is just enough for everyone.","Your brother stares. Tūtū hands him the last piece. \"That,\" she says, \"is how we share.\""],"Hold out an open hand to everyone. \"Kah-AH-nah.\"","Kaʻana like means to share equally, everyone getting the same.",null,"Tūtū cutting 80 malasadas for everyone"],["v313","v",313,"kuapo","koo-AH-po","to swap, to exchange","COO! AH... POH!",["There is a pigeon who runs a booth at the swap meet. Nobody knows how he got the spot. He wears a tiny visor and keeps his cash in a fanny pack.","You bring a broken toaster. The pigeon looks at it. \"COO!\" Then he slaps down a surfboard. \"AH... POH!\" That is how he seals a deal, with a little pop of his beak. Swap done.","You swap the surfboard for a ʻukulele. \"COO! AH... POH!\" The ʻukulele for a rice cooker. \"COO! AH... POH!\" The rice cooker for a lawnmower, the lawnmower for a goat, the goat for a canoe.","By noon you have traded your way up from one broken toaster to a used ice cream truck. The pigeon pats you on the shoulder with one wing. \"Coo, ah, poh.\" Pleasure doing business."],"Pretend to hand something over and grab something back. \"Koo-AH-po.\"","Kuapo works for any trade, like swapping seats, swapping shifts, or swapping lunches.",null,"Pigeon in a visor running swap trades"],["v314","v",314,"ʻaiʻē","ai-EH","to owe, to be in debt","I... EHHH...",["In third grade you borrowed $5 from your cousin Makana to buy shave ice. You forgot about it. Makana did not.","Every birthday since then, he shows up with a bill. With interest it keeps growing. At age 15 you owe him $80. At age 25 you owe him $900. Now you are 40 and he hands you a scroll that rolls out across the whole yard and into the street. It says $4,312.50.","Everyone at the party turns to look at you. You open your mouth, you catch your breath, and all that comes out is \"I... ehhhhh...\"","That is the sound of owing money. Makana nods. \"I, eh. Yeah. You ʻaiʻē me.\"","You pay him back with a shave ice. He sighs and accepts. The interest keeps going."],"Scratch the back of your head, nervous. \"Ai-EH.\" Stretch that last eh.","Don't mix it up with ʻai, to eat. The long ē at the end is the groan of someone who owes.",null,"Cousin unrolling a giant debt scroll"],["v315","v",315,"kāpae","kaah-PAI","to set aside","CAAAR PIE!",["Thanksgiving at Aunty Noelani's. There are 30 pies on the table. Apple, pumpkin, sweet potato haupia, chocolate, you name it.","But Aunty is smart. Before anybody arrives, she takes the best one, the sweet potato haupia with the extra thick crust, and walks it out to her car. She buckles it into the front seat with a seatbelt.","\"That one,\" she says, \"is the CAAAR PIE.\" Set aside. Nobody touches the car pie.","All night 60 relatives destroy the other 29 pies. Crumbs everywhere. A cousin licks a pie tin. When the last guest leaves, Aunty walks out to the car in her slippers, opens the door, and eats the car pie alone in the dark, with the radio on."],"Put something on an imaginary shelf behind you. \"Kaah-PAI.\" Hold the kaah long.","Kāpae is also used for putting a plan on hold or setting an idea aside for later.",null,"Pie buckled into the front seat"],["v316","v",316,"hoʻouka","ho-oh-OO-kah","to load; to attack","HO! OH! OO-KAH!",["Summer water balloon war on your street. Your side is the kids from the even numbered houses.","Step one, you load. You fill 600 water balloons and pile them into Grandpa's old pickup. Each time a bucket goes in, your captain, a six year old named Bula, yells like a caveman, \"HO! OH! OO-KAH!\" Load it! Another bucket. \"OO-KAH!\" The truck sags down to the tires.","Step two, you attack. Grandpa drives slowly down the street at 3 miles an hour. Bula stands on the tailgate and screams \"HO! OH! OO-KAH!\" and all 12 kids throw at once.","The odd numbered houses never had a chance. One kid gets hit so many times he just lies down on the lawn like a starfish. You load up again. Attack again. Load. Attack. OO-KAH!"],"Scoop up an armful, then throw it forward. \"Ho-oh-OO-kah!\"","Hoʻouka kaua means to attack, to start a battle. On a computer, hoʻouka is to load or upload, and hoʻoili, next, is to download.",null,"Kid on a tailgate yelling oo-kah"],["v317","v",317,"hoʻoili","ho-oh-EE-lee","to transfer, to hand over; to pass down","Ho, oh, EEL-EE!",["Grandpa's fishing boat pulls into the harbor riding low in the water. It is full of eels. Hundreds. Slimy, grumpy, snapping eels.","Time to transfer them to the dock. Grandpa stands in the boat and hands the eels over to you one at a time. \"Ho, oh, EEL-EE!\" Every time, one slips out of your hands. It slides down your shirt. It goes up your shorts. You dance around the dock like you're on fire. \"EEL-EE!\"","Three hours later the boat is empty. Grandpa climbs out, wipes his hands, and gives you his old eel trap. It is made of wood and wire and it smells like 60 years of the ocean.","\"This was my father's,\" he says. \"Now it is yours.\" He is passing it down. You hold it like gold, even though it stinks. Hand over the eels, pass down the trap. Ho, oh, eel-ee."],"Pass an imaginary slimy thing to the person next to you. \"Ho-oh-EE-lee.\"","Hoʻoili is moving something from one holder to another, like cargo set on shore, money moved between bank accounts, a football handed off, or a family treasure passed down in a will. On a computer it means to download.",null,"Grandpa handing over eels, then his old trap"],["v318","v",318,"alakaʻi","ah-lah-KAH-ee","to lead, to guide","All a' car... EEE!",["A mother hen decides it is time. She has 60 chicks and she needs to get them across Kalanianaʻole Highway to the other side, where somebody dropped a whole bag of rice.","She steps into the road. She does not look left or right. She just leads. Sixty fluffy chicks follow in one perfect line behind her, like a train.","A traffic guy in an orange vest sees them and throws up both hands. \"ALL A' CAR... STOP!\" Brakes squeal. \"EEEEE!\" Every car stops. A bus stops. A cement truck stops.","The hen marches the whole line across, slow and proud. At the end, one chick gets lost and runs in a circle. She turns, clucks once, and guides it back into line. The traffic guy wipes a tear. \"All a' car... eee,\" he whispers."],"Point forward like you're leading a line. \"Ah-lah-KAH-ee.\"","Alakaʻi is also a noun, a leader or guide. Older dictionaries explain it as ala, road or path, plus kaʻi, to lead, so it is the one who leads you along the path.",null,"Mother hen leading 60 chicks across highway"],["v319","v",319,"kaʻi","KAH-ee","to lead (a procession)","KAH! EE!",["It is the big parade down Kalākaua Avenue. Pāʻū riders on horses, a marching band, 12 floats covered in flowers. And who leads the whole thing? A three year old boy with a baton.","He marches in front, knees up high, very serious. The whole procession follows him. Every time he lifts the baton, the band plays. Every time he stops, 400 people behind him stop.","Then he gets the hiccups. \"KAH! (hic) EE!\" He turns left. The whole parade turns left, down a side street. \"KAH! (hic) EE!\" He turns into a parking lot. The horses follow. The band follows. The floats squeeze in.","He leads them through the drive-thru of a burger stand and out the other side. Nobody questions it. He is the leader of the procession. When he stops for a juice box, everybody waits."],"March in place with your knees high. \"KAH-ee!\" Hiccup in the middle.","Kaʻi is not the same as kai, the sea. The ʻokina splits it into two beats, KAH-ee. Callback to alakaʻi, which is leading in general.",null,"Toddler with baton leading a parade"],["v320","v",320,"hoʻokele","ho-oh-KEH-leh","to steer, to navigate","Hold 'er, KELLY!",["You are on a voyaging canoe in the middle of the Pacific. It is night. The wind is howling. Waves the size of houses.","At the back, holding the big steering paddle, is Tūtū Kelly. She is 91. She weighs about as much as a bag of rice. She has one hand on the paddle and a spam musubi in the other.","A wave hits. The canoe tips. The whole crew screams \"HOLD 'ER, KELLY!\" She leans on the paddle and the canoe swings straight. Another wave. \"HOLD 'ER, KELLY!\" She doesn't even put down the musubi.","She looks up at the stars, points at one, and turns the canoe a little to the right. No map. No phone. Just stars. At sunrise, land appears exactly where she said it would. She finishes her musubi."],"Grip an invisible paddle and lean. \"Ho-oh-KEH-leh.\"","Hoʻokele also means a navigator or helmsman, the person who steers, like the navigators of voyaging canoes.",null,"Tiny tutu steering canoe with a musubi"],["v321","v",321,"kalaiwa","kah-LAI-vah","to drive","CAR! ALIVE! AH!",["You are sitting in the driver's seat of Uncle's old station wagon in the driveway. The keys are not even in it. You are just pretending to drive, making engine noises.","Then the car coughs. The headlights blink like eyes. The steering wheel turns by itself.","\"CAR! ALIVE! AH!\" you scream.","The car backs out of the driveway and takes off down the street. It drives. It drives really well. It signals. It lets a grandma cross. It merges onto the H-1 like a pro. You are just holding the wheel with your eyes wide open while it drives you to the beach, to the drive-in, to Ala Moana, and back home.","It parks perfectly. The headlights wink at you. Uncle comes out. \"You drove?\" You nod. You did not drive. The car did."],"Grip an invisible steering wheel and turn. \"Kah-LAI-vah.\"","Kalaiwa came from the English word driver, sounded out the Hawaiian way. It can also mean the driver.",null,"Station wagon coming alive and driving"],["v322","v",322,"pae","PAI","to land, to come ashore","Pa! EH!",["Pa has been bodysurfing at Makapuʻu all afternoon. He catches one last wave. It is the biggest one of the day, a monster, 15 feet of white water.","He rides it in like a torpedo, arms out in front, cheeks puffed. The wave carries him, and carries him, and does not stop at the sand. It shoots him right up the beach, past the towels, past the coolers, past the lifeguard tower.","The whole family watches him slide by on his belly. \"PA! EH!\" everybody yells.","He finally comes to a stop in the parking lot, right next to the car, still in his bodysurfing pose. Sand in his hair. Seaweed on his ear. He stands up, bows, and says \"Landed.\" Pa, eh. He came ashore all right."],"Slide your hand flat across the table and stop. \"PAI.\"","Pae ʻāina means a group of islands. Ka pae ʻāina o Hawaiʻi is the Hawaiian island chain.",null,"Pa sliding up the beach on his belly"],["v323","v",323,"kauō","kow-OH","to drag, to haul","COW! OHHH!",["There is a cow lying in the middle of the only road to your house. She is 2,000 pounds and she refuses to move. She is chewing slowly and looking at you like you are the problem.","You get a rope. You loop it around her. You pull. \"COW! OHHH!\" Nothing. You get your brother. You both pull. \"COW! OHHH!\" She moves one inch and burps.","You get Uncle's truck. You tie the rope to the hitch. The truck strains. Smoke comes off the tires. Slowly, slowly, you drag her across the road. She does not stand up. She just slides on her side like a giant furry sled, still chewing, never once looking worried.","Twenty minutes later she is in the grass. You untie the rope. She stands up by herself and walks right back into the road."],"Grab an invisible rope and pull hard. \"Kow-OH!\" Hold that long ō.","Kauō is for heavy hauling, the kind of pulling where your feet dig in.",null,"Truck dragging a lazy cow off the road"],["v324","v",324,"hoʻolele","ho-oh-LEH-leh","to fly (a kite), to launch","Ho! Oh! UKU-LELE!",["Windy day at Kapiʻolani Park. Everybody is flying kites. You forgot your kite. All you have is Grandpa's old ʻukulele.","So you tie fishing line to the neck. You run. \"HO! OH!\" The wind grabs it. Up it goes. \"UKU... LELE!\"","The ʻukulele flies higher than all the kites. Fifty feet. A hundred feet. The wind blows across the strings and it starts playing music by itself, a sweet little song floating over the whole park. People stop their picnics. A dog howls along. A kid drops his plate lunch.","Grandpa walks up, looks way up at his ʻukulele in the sky, and just nods. \"Good launch.\" You let out more line. The ʻukulele plays louder. By sunset there are 20 more ʻukuleles flying next to it."],"Tug an invisible kite string up into the sky. \"Ho-oh-LEH-leh.\"","Lele means to fly or jump. ʻUkulele is often said to mean jumping flea, from ʻuku, flea, and lele, to jump.",null,"ʻUkulele flying like a kite and playing"],["v325","v",325,"pepehi","peh-PEH-hee","to beat, to strike; to kill","PEH! PEH! HEE!",["It is 11 at night. Aunty is watching her show. Then she sees it. A flying cockroach, as big as a matchbox car, sitting on the wall above the TV. Its antennas are waving at her like it owns the place.","Aunty takes off one slipper. Slowly. She stands. The whole house holds its breath.","The roach takes off and flies straight at her face. Aunty swings. \"PEH!\" Miss. It lands on the lampshade. \"PEH!\" Direct hit. The roach drops to the carpet like a rock.","Aunty lets out a high little victory squeal. \"HEEEE!\"","She puts her slipper back on, sits down, and turns her show back up. Two strikes and it's over. Peh, peh, hee."],"Whack the table twice with an open hand and squeal. \"Peh-PEH-hee.\"","Pepehi is a strong word. It can mean to beat or to kill, so save it for cockroaches and not your brother.",null,"Aunty killing a flying cockroach with slipper"],["v326","v",326,"pakī","pah-KEE","to splash, to squirt","PAH! KEE!",["You are tide pooling at low tide, barefoot, stepping from rock to rock. You step on something soft. It is a sea cucumber, fat and brown and as long as your arm.","It does not like that. \"PAH!\" It squirts a jet of water straight up your leg, into your shorts, and across your face. You shriek \"KEE!\"","You jump back and land on another sea cucumber. \"PAH!\" Squirt. \"KEE!\" And another. The whole tide pool is full of them. Every step is a squirt. PAH, KEE. PAH, KEE. You splash around like you are dancing on a trampoline made of water guns.","Your friends on the beach are laughing so hard they cannot breathe. You crawl out soaked from hair to toenails. Somewhere behind you, one last sea cucumber goes \"pah\" just to be mean."],"Flick your fingers out like you're squirting water. \"Pah-KEE!\" Short pah, long kee.","Watch the marks. Pakī, with a short a, is to splash or squirt. Pākī, with a long ā, means to smash or crush.",null,"Sea cucumbers squirting you in tide pool"],["v327","v",327,"hoʻolauleʻa","ho-oh-lau-LEH-ah","to celebrate","Ho, oh, LOUD, LAY-AH!",["Great-grandma Tūtū Lani turns 100. The whole family rents the park. Five hundred people. Twelve imu pigs. A band with three ʻukuleles, two guitars, and one very old trumpet.","The party is so loud the plates rattle on the tables. Car alarms go off down the block. Birds leave the trees and do not come back until Tuesday.","At 9 p.m. Tūtū Lani climbs up onto the picnic table with her walker. Somebody hands her the microphone. She raises one fist and shouts \"HO, OH, LOUD, LAY-AH!\" The crowd roars back \"LOUD, LAY-AH!\"","She dances hula on the table for 20 minutes. Nobody can stop her. The trumpet player passes out from happiness. That is how you celebrate. Loud, all night, and grandma on the table."],"Throw both arms up like you're at a party. \"Ho-oh-lau-LEH-ah!\"","A hoʻolauleʻa is also a big street party or festival, like the block parties in Waikīkī. Leʻa means joy.",null,"100-year-old tūtū dancing on a table"],["v328","v",328,"hoʻonaʻauao","ho-oh-nah-ow-AH-oh","to educate","Now... OW! AHH, OH!",["Night school in a portable classroom. The teacher is an octopus. She holds eight pieces of chalk in eight arms and writes on eight chalkboards at the same time. Math, history, science, Hawaiian, all at once.","You are trying to keep up. The octopus taps her board with one arm and says \"Now!\" Then she taps your head with another arm. \"OW!\" Then she writes the answer.","You stare at it. Something clicks. \"AHHH... OH!\"","That is the sound of learning. Now, ow, ahh, oh. All night long the room is full of it. Forty students getting bonked and understanding. \"Now... OW... AHHH, OH!\"","At graduation the octopus hands out 40 diplomas at the same time, eight at a time, and every student yells \"AHH, OH!\" together. She educated all of you."],"Tap your forehead and then light up. \"Ho-oh-nah-ow-AH-oh.\"","Naʻauao means learned or wise. Naʻau is the gut and ao is daylight, so learning puts light inside you.",null,"Octopus teacher with eight pieces of chalk"],["v329","v",329,"aʻoaʻo","ah-oh-AH-oh","to advise, to counsel","AH-OH! AH-OH!",["You have a small green parrot who lives on your shoulder. His whole job is to give you advice. He has only one piece of advice, and he says it every time you are about to do something dumb.","You reach for the fourth plate of kālua pig. \"AH-OH! AH-OH!\" You think about texting your ex at 2 a.m. \"AH-OH! AH-OH!\" You try to fix the toilet yourself with a butter knife. \"AH-OH! AH-OH! AH-OH!\"","At first you ignore him. The toilet floods the bathroom. The kālua pig gives you a stomachache for two days.","So now you listen. Before any big choice, you look at the parrot. If he stays quiet, you go. If he says \"Ah-oh, ah-oh,\" you sit down and think. Best counselor you ever had, and he works for sunflower seeds."],"Wag your finger slowly, like giving advice. \"Ah-oh-AH-oh.\"","Aʻo means to teach or learn. Doubled, aʻoaʻo is to give advice, and it can also mean the advice itself.",null,"Parrot on shoulder warning ah-oh"],["v330","v",330,"kūkā","koo-KAAH","to talk it over, to consult","Coo? KAAAH.",["Your car will not start. You open the hood and stare at the engine like it is a puzzle in another language.","Up on the power line, two birds are watching. A dove and a big black crow. The dove leans over. \"Coo?\" The crow thinks. \"KAAAH.\" The dove shakes her head. \"Coo, coo.\" The crow points a wing at the battery. \"KAAAH.\"","They talk it over for two hours. They argue. They draw diagrams in the dirt with their feet. Other birds come by to listen. A mynah gives an opinion and gets ignored.","Finally the dove and the crow shake wings. They fly down, land on your engine, and the crow tightens a loose wire with his beak. You turn the key. VROOM. Coo, kaaah. They consulted, they decided, and they did not even send you a bill."],"Lean your head toward a friend, like discussing a plan. \"Koo-KAAH.\"","Kūkākūkā means to discuss or hold a meeting. You will hear it for any sit-down talk story about a problem.",null,"Dove and crow discussing your car engine"],["v331","v",331,"nīnauele","nee-now-EH-leh","to interview","KNEEEE, now, ELLIE!",["A TV reporter shows up at the zoo to interview Ellie the elephant. Ellie is famous. She paints pictures with her trunk.","Problem. The reporter is five feet tall. Ellie is eleven feet tall. He holds the microphone up as high as he can and asks, \"Ellie, what inspires you?\" Ellie cannot hear him. She is looking at a banana.","He jumps. He stands on a bucket. Nothing. Finally he yells, long and loud, \"KNEEEEE, NOW, ELLIE!\"","Ellie folds her front legs and kneels down. Now her giant ear is right next to his microphone. He asks his questions. She answers with a trunk toot for yes and two toots for no. It is the best interview of the year. They run it on the six o'clock news. Knee, now, Ellie."],"Hold a fist up to someone's mouth like a microphone. \"Nee-now-EH-leh.\" Hold the nee long.","Nīnau means to ask a question. A nīnauele is an interview, a lot of questions in a row.",null,"Reporter interviewing a kneeling elephant"],["v332","v",332,"lawelawe","lah-veh-LAH-veh","to serve, to handle","LAVA! LAVA!",["You get a job as a waiter at the world's hottest restaurant. It is built right on the edge of a lava flow on the Big Island. The cook does not have a stove. He just holds a pan over the lava.","When an order is ready, he rings the bell and yells \"LAVA! LAVA!\" That means serve it now, before it melts the plate.","You run out with a sizzling steak in fireproof gloves. \"LAVA! LAVA!\" Another order. You juggle four plates of glowing hot garlic shrimp. Your eyebrows are gone by 7 p.m. Your shoes are smoking by 8.","But you serve 300 people and handle every table like a pro. Nobody waits. Nobody gets cold food. How could they? At closing time the cook pats your back and slides you a lava dessert. \"Lava, lava,\" you say. You served it."],"Carry an invisible hot plate with both hands. \"Lah-veh-LAH-veh.\"","Lawe means to take or carry. Lawelawe is to serve, and also to handle or take care of things, like handling your business.",null,"Waiter running plates from a lava flow"],["v333","v",333,"ʻapo","AH-po","to catch, to grasp; to embrace","(Gulp) UP... OH!",["Family softball game at the park. The batter is Uncle Tiny, who is not tiny. He swings, and the ball goes UP. Way up. Higher than the coconut trees. Out of sight.","Everybody looks at you. You are playing catcher. You swallow hard, a little catch in your throat. \"UP... OH!\"","You wait. Ten seconds. Twenty. A plane goes by. Then the ball comes screaming down like a meteor. You put out your glove. SMACK. You catch it. The ball is smoking.","The whole park goes crazy. Uncle Tiny runs over. He is not mad. He picks you up in a giant embrace and spins you around three times. First you caught the ball. Then he caught you. Up, oh, twice in one day."],"Snap your hand shut like catching a ball, then hug yourself. \"AH-po.\"","ʻApo means to catch and also to embrace. Watch for ʻaʻapo later in the list (#396), which is to catch on fast, to learn quick.",null,"Catching a sky-high softball, then hugged"],["v334","v",334,"pūliki","poo-LEE-kee","to hug","POOOO... LEAKY!",["You land at the airport after two years away. Tūtū is waiting at the gate. She is five feet tall and four feet wide, and she has been waiting for this hug since 2 a.m.","She grabs you. She squeezes. Your ribs creak. Your juice box, still in your hand, bursts and squirts across the floor.","\"POOOO...\" you wheeze, all the air leaving you in one long sound. Then your eyes start leaking. Then Tūtū's eyes start leaking. Then the shave ice in your little cousin's hand starts leaking down his arm. \"LEAKY!\"","She holds the hug for eleven minutes. A security guard walks by and starts crying too. A family from the next flight joins in. When she lets go, everybody is damp and happy. Poo, leaky. Best hug of your life."],"Wrap your arms around yourself and squeeze. \"Poo-LEE-kee.\" Stretch the poo.","Pūliki is the hug. ʻApo can also mean to embrace, but pūliki is the everyday word for a squeeze.",null,"Tūtū hugging so hard everything leaks"],["v335","v",335,"hoʻopuni","ho-oh-POO-nee","to surround","Ho, oh, PONY!",["You go out to feed your one pony on the farm in Waimea. You open the gate with one bucket of oats.","You hear hooves. Then more hooves. Then thunder. Over the hill come three hundred ponies. Brown ones, white ones, spotted ones, one wearing a hat. You have no idea where they came from.","\"Ho, oh... PONY!\" you whisper.","They form a circle around you. Then another circle around that one. Then another. You are surrounded, ten ponies deep in every direction. You can't see the fence. You can't see your truck. All you see is pony faces staring down at your one bucket of oats.","You hold it up. \"Ho, oh, pony,\" you say again, very politely. Three hundred ponies lean in at once. You are going to need more oats."],"Draw a big circle around yourself with your finger. \"Ho-oh-POO-nee.\"","Puni means surrounded, and also to be fond of something. Hoʻopuni is to make a circle around.",null,"Hundreds of ponies circling you"],["v336","v",336,"kāhinu","kaah-HEE-noo","to rub with oil","Kaaah! HE... NEW!",["Uncle Walter has a 1978 pickup truck that is more rust than truck. One day he decides to fix it up. Not with paint. With oil.","He buys five gallons of coconut oil. He rubs it on the hood with his bare hands, slow circles, like he is waxing a surfboard. He rubs the doors, the tires, the bumper. He rubs oil into the steering wheel. The whole street smells like a suntan.","By sunset the truck shines like a mirror. The neighbors gather. \"Kaaah!\" one says. \"HE... NEW!\"","Then Uncle gets in, starts it, and the truck slides right down the driveway on its own oily tires, into the street, and parks itself sideways against the mailbox. Uncle climbs out, grinning, and rubs a little more oil on the dent."],"Rub slow circles on your arm like lotion. \"Kaah-HEE-noo.\"","Hinu means oily, greasy, or shiny. Kāhinu is to rub that oil on.",null,"Uncle rubbing coconut oil on rusty truck"],["v337","v",337,"hamo","HAH-mo","to smear, to spread on","HAM! OH!",["Christmas Eve. Uncle is in charge of the ham. It is the size of a canoe. He needs to smear pineapple glaze all over it, and he does not own a brush big enough.","So he uses a paint roller.","He dips the roller in a bucket of glaze and rolls it across the ham. \"HAM!\" Another roll. \"OH!\" The glaze drips on the floor. He rolls faster. \"HAM! OH! HAM! OH!\" Glaze on the counter. Glaze on the fridge. He slips and smears a stripe across the dog.","By the time dinner starts, the ham is perfect and shiny. So is the kitchen. So is the dog, who is sticky and very proud of it. Uncle is glazed from his elbows to his eyebrows. \"Ham, oh,\" he says, and licks a finger."],"Swipe your hand back and forth like spreading butter. \"HAH-mo.\"","Kāhinu is rubbing with oil. Hamo is any smear or spread, like glaze, butter, lotion, or paint.",null,"Uncle paint-rolling glaze on a huge ham"],["v338","v",338,"hāʻawe","haah-AH-veh","to carry on the back","HAAAH... AWAY!",["Family picnic at the beach. A tiny ant finds a spam musubi that fell in the sand. The musubi is about 500 times bigger than the ant.","The ant does not care. She crawls under it, braces her six legs, and lifts the whole thing onto her back. \"HAAAH...\" she grunts in a tiny voice. Then she starts walking. \"AWAY!\"","She carries it on her back across the sand. Up and over a slipper. Around a bucket. Through a forest of beach umbrella poles. Kids stop to watch. A crab offers to help and she waves him off with one leg.","It takes her four hours. At the ant hole, 200 cheering ants help her set it down. The musubi feeds the whole colony for a year. She carried it on her back the whole way. Haaah, away."],"Hunch forward like you're carrying a heavy backpack. \"Haah-AH-veh.\"","Hāʻawe is carrying on the back. Next, ʻauamo is carrying with a pole across the shoulder.",null,"Tiny ant carrying spam musubi on back"],["v339","v",339,"ʻauamo","ow-AH-mo","to carry on the shoulder with a pole","OW! Ah... MO'?",["The kids want to take the watermelons from the farm stand down to the beach party. Uncle Sol grabs a long bamboo pole and sets it across his shoulders. A net hangs on each end.","A cousin drops a watermelon in the left net. \"OW!\" says Uncle. Another in the right. \"OW!\" Then he smiles. \"Ah... mo'?\" More?","So they give him more. Two more. \"OW! Ah, mo'?\" Four more. The pole bends into a big smile shape. Eight watermelons. Twelve. A cousin climbs in one net for a ride. A dog jumps in the other.","Uncle walks the whole mile to the beach, pole on his shoulder, bouncing with every step, saying \"Ow... ah, mo'?\" the whole way. When he sets it down, he stands up straight and asks if anybody needs anything else carried."],"Put a broom across your shoulders and bounce. \"Ow-AH-mo.\"","ʻAuamo is carrying with a pole on the shoulder. Hāʻawe is carrying on your back. ʻAuamo can also mean a responsibility you carry.",null,"Uncle carrying watermelons on a bamboo pole"],["v340","v",340,"hiʻi","HEE-ee","to hold a child in the arms","HEE! (hic) EE!",["Baby Kaiʻa is turning one. The first birthday lūʻau is huge. Four hundred guests. And every single one wants to hold the baby.","Aunty holds her first, rocking her in her arms. Baby squeals \"HEE! (hic) EE!\" Then Uncle. \"HEE! (hic) EE!\" Then Grandpa, then the neighbors, then the band leader. She gets passed down the line like the most precious package in the world.","Every person cradles her the same way, one arm under, one arm around, careful as if she is made of glass. And every time, she giggles that same little hiccup giggle. \"Hee! (hic) Ee!\"","At midnight she finally comes back to her mom, who holds her in her arms and sways. Baby is asleep. Four hundred people whisper \"hee, ee\" at the same time, very softly."],"Cradle an invisible baby and rock it. \"HEE-ee.\" Little hiccup in the middle.","Hiʻi is holding a child in the arms. A related word, hiʻialo, means a beloved one, a child held close.",null,"Baby passed arm to arm at lūʻau"],["v341","v",341,"kūleʻa","koo-LEH-ah","to succeed","COOL! LAYER!",["You decide to make a 40 layer cake for Aunty's retirement party. Nobody has ever done it. You watched one video.","Try one. You get to layer 12 and the cake leans like a drunk palm tree and falls on the floor. Try two. Layer 20, the cat jumps on it. Try three. Layer 31, an earthquake. Not a big one, just enough.","You try 39 times. The kitchen is a disaster. There is frosting on the ceiling fan.","On try 40, you stack the last layer. It holds. The cake is as tall as you. It does not lean. It does not wobble. Your whole family is holding their breath.","Your little brother says it first, quietly. \"Cool... layer.\" Then everyone screams it. \"COOL! LAYER!\" You succeeded. You eat a piece off the top with a ladder."],"Pump your fist once. \"Koo-LEH-ah!\"","Kū means to stand and leʻa means joy. Kūleʻa is used for any success, like passing a test or finishing a big job.",null,"Forty layer cake finally standing"],["v342","v",342,"holomua","ho-lo-MOO-ah","to move forward, to make progress","HELLO! MWAH!",["Family reunion. The food table is at the far end of the yard. Between you and the food are 45 aunties. They are standing in a line like a gauntlet.","You take one step forward. The first aunty grabs your face. \"HELLO! MWAH!\" Big kiss on the cheek. One step. \"HELLO! MWAH!\" Another aunty. Lipstick on the other cheek.","You keep moving forward. Slowly. Every step is a hello and a mwah. Aunty number 20 pinches your cheek. Aunty number 31 asks when you're getting married. Aunty number 38 kisses you twice to make up for last year.","It takes you two hours to cross the yard. Your face is covered in lipstick. But you keep going. Inch by inch. Hello, mwah. You make progress. Finally you reach the food table and there is exactly one scoop of mac salad left."],"Take one step forward and kiss the air. \"Ho-lo-MOO-ah.\"","Holo means to run or sail, and mua means forward or in front. E holomua means go forward, keep making progress.",null,"Walking through a line of kissing aunties"],["v343","v",343,"hoʻokolo","ho-oh-KO-lo","to track, to follow a trail","Ho, oh, COLA!",["Somebody stole the last can of cola from the fridge. Grandpa is furious. It was his.","So he hires a detective. The detective is a gecko named Sly, wearing a tiny trench coat. Sly sniffs the fridge. He finds a drop of cola on the floor. \"Ho, oh... COLA.\"","He follows it. Another drop by the door. \"Cola.\" Another on the steps. A sticky print on the garage. A drip on the lawn. He follows the trail through the neighbor's yard, under a fence, over a wall, up the mango tree.","At the top, sitting on a branch, is the neighbor's cat with the empty can and a guilty burp. \"Ho, oh, cola,\" says Sly, and snaps his little notebook shut. He tracked it all the way. Grandpa pays him in fruit flies."],"Bend down and follow an invisible trail with your finger. \"Ho-oh-KO-lo.\"","Kolo means to creep or crawl, like a gecko on the trail. Hoʻokolo is to follow along after something.",null,"Gecko detective tracking cola drips"],["v344","v",344,"hoʻopololei","ho-oh-po-lo-LAY","to straighten, to correct","Ho, oh, POLO, LAY!",["Aunty Marlene is the queen of straight. She cannot stand anything crooked.","Your polo shirt is wrinkled. She takes it right off you, lays it on the ironing board, and yells \"HO, OH, POLO, LAY!\" She irons it so flat and straight you could cut paper with the collar.","Then she looks at you. You are slouching. \"Polo, lay!\" She lays you on the ironing board too. Not with the iron, don't worry. She just pulls your shoulders back and presses your spine against the board until you are straight as a surfboard.","Then she hears you talk. \"Me and him went...\" she says \"He and I went.\" She corrects your grammar. She straightens the pictures on the wall. She straightens the dog's ears. By the time you leave, even your car is parked straighter."],"Straighten your back and smooth your shirt. \"Ho-oh-po-lo-LAY.\"","Pololei means straight or correct. You will hear \"Pololei!\" for \"That's right!\"",null,"Aunty ironing a polo and your posture"],["v345","v",345,"ʻako","AH-ko","to trim, to cut (hair), to pluck","AHHH... KO!",["You go to a new barber. He has the worst allergies on the island. His eyes are red. His nose is running. He picks up the scissors.","He leans in. \"Ahhh...\" Snip. \"...KO!\" The sneeze stops in his throat halfway, with a hard little catch, and his hand jerks. A chunk of hair is gone. \"Ahhh... KO!\" Another chunk. \"AHHH... KO!\" Snip snip.","He trims your eyebrows by accident. He plucks one hair out of your ear with a sneeze. Behind you, the hedge outside the window is somehow trimmed too.","Twenty minutes later you look in the mirror. You look like a pineapple. But he did cut and trim everything. The barber blows his nose, holds out his hand, and says, \"That will be $12.\""],"Snip your fingers like scissors, with a stop-sneeze. \"AH-ko.\"","You can ʻako hair, a hedge, or flowers for a lei. It is any kind of trimming or plucking.",null,"Sneezing barber trimming chunks of hair"],["v346","v",346,"nakinaki","nah-kee-NAH-kee","to tie, to bind","Knotty, KNOTTY!",["Your Uncle Rex was a sailor for 40 years. Now he is retired and he cannot stop tying things.","You wake up and your shoes are tied to your slippers. The dog is tied to the mango tree. The mango tree is tied to the fence. Uncle walks through the house with a big coil of rope, humming to himself, \"Knotty, knotty. Knotty, KNOTTY.\"","He ties the car to the house. He ties the rice cooker lid shut. He ties the TV remote to the couch so nobody loses it. He ties a bow on the cat.","By dinner the whole house is one giant web of rope and knots. You have to crawl under the lines to get to the table. Uncle sits down, very happy, and ties his napkin around his neck with a sailor's knot you will never get off."],"Pretend to tie a big knot and yank it tight. \"Nah-kee-NAH-kee.\"","Nakinaki works for any tying or binding, from shoelaces to a boat at the dock.",null,"Retired sailor uncle tying up everything"],["v347","v",347,"male","MAH-leh","to marry","Ma! LEI!",["It is your wedding day on the beach. You are standing under the arch. The minister is ready. Your future spouse is walking down the sand.","Then Ma steps up. \"Ma! LEI!\" somebody yells, and she puts a lei on you. Then another. Then another. Ma brought a whole shopping bag. Pīkake, tuberose, orchid, maile, candy lei, money lei, a lei made of spam musubi.","By the time the minister says \"Do you take,\" there are 200 leis around your neck. They go up past your nose. He can't find your face. \"Ma! LEI!\" people keep shouting as she adds more.","You say \"I do\" through a foot of flowers. You kiss your spouse through a maile lei. You are married. You smell amazing. Ma is crying and looking for more lei."],"Drape an invisible lei over someone's neck. \"MAH-leh.\"","Male comes from the English word marry, sounded the Hawaiian way. Don't read it like the English word male.",null,"Groom buried in 200 leis"],["v348","v",348,"hoʻopalau","ho-oh-pah-LOW","to get engaged","Ho, oh, PAL... LOW!",["Your friend Kainoa is going to propose on the sand at sunset. He has the ring in his pocket. All his buddies are hiding behind a lifeguard tower.","He gets down on one knee. His buddies whisper, \"Ho, oh, pal... LOW! Go low!\" He wants it to be romantic, so he goes lower. The sand is soft. His knee sinks. \"LOW!\" He sinks to the thigh. \"LOWER!\" Now he is in the sand up to his belly button.","He holds up the ring with sand in his hair. \"Will you marry me?\"","His girlfriend looks down at him, at the ring, at the giant hole. \"Yes!\" she laughs. She takes the ring and pulls him out of the sand by both arms. They are engaged. The buddies jump out cheering, and one falls in the hole."],"Drop down on one knee and hold up a ring. \"Ho-oh-pah-LOW.\"","First comes hoʻopalau, getting engaged. Then comes male, getting married.",null,"Proposal kneeling so low he sinks"],["v349","v",349,"hemo","HEH-mo","to come loose, to come off; to be divorced","HEM! OH!",["You are at a fancy party at a hotel. You are wearing your best aloha shirt. You walk past a door and a thread from your hem catches on the doorknob.","You don't notice. You keep walking. The thread keeps coming. \"HEM!\" says a guy behind you, pointing. You turn around. \"OH!\"","Your shirt is unraveling. Slowly the bottom disappears. Then the pockets. Buttons pop loose one at a time, tink, tink, tink, rolling across the ballroom. The sleeves come off by themselves. The collar hangs on by one thread and then lets go too.","By the time you reach the buffet, you are standing in your undershirt with a long thread trailing all the way back to the door. Everything came loose. Everything came off. Hem, oh."],"Pull an invisible loose thread and watch it go. \"HEH-mo.\"","Hemo is also used for being divorced, when two people come loose from each other. Next, hoʻohemo is taking something off on purpose.",null,"Aloha shirt unraveling from a door"],["v350","v",350,"hoʻohemo","ho-oh-HEH-mo","to take off, to remove","Ho! Oh! HEAVE-OH!",["You spent all day working in the loʻi, planting kalo up to your knees in mud. Now your rubber boots are stuck to your legs. The mud is like glue. They won't come off.","Grandpa grabs one boot with both hands. He braces his foot on your butt. \"HO! OH! HEAVE... OH!\"","Nothing. You are sliding across the porch. Your cousin grabs Grandpa's waist. Your aunty grabs your cousin. \"HO! OH! HEAVE... OH!\"","SCHLOOP. The boot pops off with a sound like a giant kiss. Everybody flies backward into a pile. Mud sprays the whole house. There is a gecko in the boot. It looks surprised.","\"One more,\" Grandpa says. \"HO! OH! HEAVE... OH!\" The second boot pops off, flies over the roof, and lands in the neighbor's yard. Both boots removed."],"Pull hard on an invisible boot. \"Ho-oh-HEH-mo!\"","Hemo is coming off by itself. Hoʻohemo is you taking it off, like shoes, a lid, or a bandage.",null,"Family pulling off muddy boots"],["v351","v",351,"kanikau","kah-nee-KOW","to mourn, to chant a lament","Connie... CIAO.",["Connie is the family truck. She is a 1983 pickup, faded blue, and she carried this family for 41 years. First day of school, every beach day, every trip to the hospital when a baby was born, every move, every funeral, every graduation.","One Sunday morning she will not start. The mechanic shakes his head. Connie is done.","The whole family gathers around her in the driveway. Grandpa takes off his hat. In a low, slow voice, he starts to chant a goodbye. He names every place she took them. Makapuʻu. Kaʻena Point. The old house in Kalihi. The hospital. The cemetery. Every line ends the same. \"Connie... ciao.\"","By the end, everybody is crying, even the teenagers, even the mechanic. The kids pat her hood one last time. Connie, ciao. That is mourning. You name what you shared, and you say goodbye out loud."],"Put your hand over your heart and say it low and slow. \"Kah-nee-KOW.\"","A real kanikau is a traditional Hawaiian chant of grief for a loved one who has died, often naming the places shared together. Kani means sound.",null,"Grandpa chanting goodbye to the old truck"],["v352","v",352,"hoʻomana","ho-oh-MAH-nah","to worship","Ho, oh, MAH-nah! (Hosanna)",["Palm Sunday in a small wooden church up in the country. The windows are open. Chickens wander past the door. Tūtū has sat in the same pew for 62 years, and she sings louder than the organ.","Next to her is her great-grandson, four years old, in a tiny aloha shirt. He is trying very hard. The choir sings \"Hosanna!\" and he belts it out with his whole chest, but it comes out wrong. \"HO... OH... MAH-NAH!\"","The whole church hears it. People smile. The minister smiles. The kid does not care. He sings it again, even louder, arms up. \"HO, OH, MAH-NAH!\"","After the service Tūtū kneels down and fixes his collar. \"You know what?\" she says. \"You said it right. Hoʻomana. That's what we do in here. We worship.\" He grins. He sings it all the way to the car."],"Lift both hands gently, like singing in church. \"Ho-oh-MAH-nah.\"","Hoʻomana also means religion. Inside it is the word mana, spiritual power.",null,"Little boy singing loud in church pew"],["v353","v",353,"hoʻokapu","ho-oh-KAH-poo","to make sacred, to forbid","Ho! Oh! CAR POOL!",["It is 6 a.m. on the H-1 and traffic is not moving. You look over at the zipper lane. Empty. Beautiful. But it is only for carpools. Forbidden to drivers alone.","So you get an idea. You put a mannequin in your passenger seat. You give it sunglasses, a lei, and a straw hat. You slide into the zipper lane.","Two minutes later, lights flash behind you. The officer walks up, looks at your passenger, and taps the mannequin on the head. Knock knock. \"HO! OH!\" he says. \"CAR POOL!\" Meaning, this lane is for car pools. Kapu for solo drivers like you.","He writes you a ticket as long as your arm. The mannequin gets a warning. You drive the rest of the way in the slow lane, and the mannequin will not even look at you."],"Hold up your hand like a stop sign. \"Ho-oh-KAH-poo.\"","Kapu means sacred or forbidden. Hoʻokapu is to make something kapu, and hoʻonoa, the next w
