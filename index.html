d your nose over an imaginary gourd. \"EE-poo.\"","An ipu is also the gourd drum used in hula. An ipu heke is a double gourd, one on top of another.",null,"Kid inside a giant smelly gourd"],["n110","n",110,"pola","PO-lah","bowl","Po-lah! (Polar!)",["A polar bear walks into a little saimin stand in Waipahu. It is sweating. It is 88 degrees. It has come a very long way for noodles.","The cook asks what size. The bear cannot say the letter R, so it just pounds its chest. \"PO-LAH. Big. PO-LAH.\" Then it spreads its arms as wide as they go.","The cook goes out back and comes in rolling a bowl the size of a hot tub. He fills it with 80 gallons of saimin, 400 slices of kamaboko and a whole green onion field. The bear lifts the bowl with both paws and drinks it in one long slurp. Then it climbs into the empty bowl, curls up, and falls asleep because the bowl is cool on its belly.","The stand now sells a Po-lah size."],"Hold up both hands like you are cradling a big bowl. \"PO-lah.\"","Pola comes from the English word bowl. Ipu is the older word for any kind of container.",null,"Polar bear drinking saimin from a hot tub bowl"],["n111","n",111,"kīʻaha","kee-AH-hah","cup, glass","Keeeee... AH-hah!",["At the family party, Uncle lines up 40 drinking glasses on the table, each filled with a different amount of water. He wets his finger and starts rubbing the rims.","\"KEEEEEEEEE.\" It is a high, thin, glassy sound. It goes right through your teeth. The dogs in the whole neighborhood start howling. A light bulb flickers. Uncle plays for three straight hours in the hot garage, moving down the row of glasses like a piano player.","When he finally finishes, he is so thirsty he picks up the first glass and chugs it. Gulp. He stops dead for a second, that little catch in his throat. Then \"AHHH-HAH!\" He does it 39 more times. Keeeee, gulp, ahh-hah. Keeeee, gulp, ahh-hah. By the end he is sloshing when he walks."],"Run a wet finger around a real glass. \"Keeee,\" tiny catch, \"AH-hah.\"","Kīʻaha can be a cup, a glass or a mug. The long ī is that high keeeee note held out.",null,"Uncle playing 40 water glasses, then chugging"],["n112","n",112,"puna","POO-nah","spoon; spring of water","(S)POONA!",["Your baby niece is 2 and she cannot say the letter S. Her favorite thing in the world is a big metal soup spoon. She carries it everywhere and holds it up to strangers. \"POONA!\"","One afternoon she takes her spoon to the backyard and starts digging. Everybody laughs. She digs for three hours without stopping. The hole gets knee deep, then waist deep. Tiny scoop, tiny scoop, tiny scoop.","Then her spoon goes clink on a rock, and a spring of cold fresh water shoots 30 feet into the air. It makes a rainbow over the carport. The water keeps coming, clean and cold, and it never stops.","She stands in the spray with her spoon held high like a trophy and yells \"POONA!\" Now the whole block fills their water jugs in your backyard."],"Dig with an imaginary spoon. \"POO-nah!\"","Puna means both a spoon and a spring of water. The Puna district on Hawaiʻi Island carries the same word.",null,"Baby with spoon striking a water spring"],["n113","n",113,"pahi","PAH-hee","knife","PAH! Hee!",["The family is cooking for a lūʻau for 300 people, and your job is chopping onions. Two hundred onions. Everyone in the kitchen is crying like it is a sad movie.","Except the knife. Aunty's big old kitchen knife has been in the family for 60 years, and somewhere along the way it learned to laugh. Every time it chops, it hits the board with a \"PAH!\" and then it giggles. \"Hee!\"","PAH. Hee. PAH. Hee. PAH. Hee hee hee.","The faster you chop, the harder it laughs. By onion 150 it is cackling so hard it vibrates in your hand. You are sobbing, snot running, and this knife is having the best day of its life. When you finish, it winks at you in the light and says \"Pah... hee,\" one last time, very pleased with itself."],"Chop the air with a flat hand. \"PAH-hee.\" Giggle on the hee.","Pahi kaua, a fighting knife, is a word for sword.",null,"Giggling knife chopping 200 onions"],["n114","n",114,"ipu hao","EE-poo HOW","cooking pot","Eee, poo! HOW?",["Remember the giant gourd from ipu? Your cousin decides to cook beef stew in it. He sets it right on the campfire at the beach.","The gourd catches fire in about 9 seconds. Black smoke everywhere. It smells like burnt hair and old socks. Your cousin backs away holding his nose. \"EEE, POO!\" Then he looks at the pile of raw beef and carrots. \"HOW are we supposed to cook now?\"","Six uncles come walking up the beach carrying something on two poles. It is a black iron pot, 4 feet wide, heavy as a car engine. They hang it over the fire, dump in the whole cooler of stew stuff, and it bubbles for five hours without a problem.","Your cousin looks at the iron pot, then the ashes of his gourd. \"Iron ipu. Ipu... HOW. Ohhh.\""],"Stir a huge pot with both arms. \"EE-poo HOW.\"","Ipu means container and hao means iron, so an ipu hao is literally an iron container. Today it means any cooking pot or saucepan, even one made of aluminum or glass.",null,"Burning gourd next to giant iron pot"],["n115","n",115,"kapuahi","kah-poo-AH-hee","stove","Ka-POOF! AH! Hee!",["Grandpa's gas stove is older than your parents. The pilot light has been broken since 1994, so to light it he turns the knob, waits, looks for the matches, finds the matches, drops the matches, picks up the matches, and THEN strikes one.","By then the kitchen is full of gas.","\"KA-POOF!\" A fireball the size of a beach ball rolls up to the ceiling. Grandpa's eyebrows are gone. His comb-over is standing straight up and smoking. \"AH!\" Then he pats his head, sees he is fine, and starts giggling. \"Hee hee hee.\"","The burner is lit, blue and perfect. He puts on the rice pot like nothing happened. Every morning, same thing. Ka-POOF, AH, hee. The neighbors set their clocks by it."],"Flick an imaginary match and jump back. \"Kah-poo-AH-hee!\"","Ahi means fire. Do not mix it up with ʻahi, with an ʻokina, which is the yellowfin tuna.",null,"Grandpa's stove fireball, smoking hair"],["n116","n",116,"hau","HOW","ice, snow; hau tree","HOW?!",["It is 91 degrees at Ala Moana beach park. A shave ice truck is parked by the lagoon with a line of 200 kids. The owner has just bought a brand new shave ice machine that is way too powerful.","He flips it on. The machine shudders. Then it explodes out the side of the truck like a snow cannon.","It snows. Actual snow, all over the park. It piles up 3 feet deep on the grass and on the picnic tables. The kids stop, look up, and scream \"HOW?!\" A lady in a bikini is building a snowman. An uncle slides down the little hill on a boogie board.","The owner does not panic. He walks around pouring strawberry, lilikoʻi and blue vanilla syrup on the whole park, and sells it by the scoop."],"Hold your hands out to catch snowflakes. \"HOW?!\"","Snow really does fall on the tall mountains of Hawaiʻi Island in winter. Hau is also the hau tree with yellow flowers. Do not mix it up with hao, which is iron.",null,"Shave ice machine snowing on Ala Moana"],["n117","n",117,"kukui","koo-KOO-ee","lamp, light; candlenut tree","Cuckoo-EE!",["A storm knocks out power on the whole island. Your house is pitch black. You cannot find the flashlight. Your little brother is crying because the refrigerator stopped humming.","Then, at exactly 9 o'clock, the old cuckoo clock on the wall clicks. The tiny door swings open and out pops the little wooden bird. But tonight it is holding a burning nut on a stick, like a torch.","\"KOO-KOO-EE!\"","The whole living room lights up warm and orange. The bird does not go back inside. It just stays out there, holding up its little lamp, for five hours. The family plays cards by cuckoo light. Every hour it adds another burning nut to the stick and yells \"KOO-KOO-EE!\" a little louder, very proud of itself."],"Hold up an imaginary torch. \"Koo-KOO-ee!\" like a cuckoo.","Old Hawaiians strung oily kukui nuts on a stick and burned them one at a time for light. Kukui is the state tree of Hawaiʻi.",null,"Cuckoo bird holding a kukui nut torch"],["n118","n",118,"uila","oo-EE-lah","electricity; lightning","Oooh, EEE, LAAAH!",["Aunty is singing karaoke in the backyard during a thunderstorm, which everyone told her not to do. She is holding a metal microphone on a long metal stand. She is going for the big note.","The sky flashes. A bolt of lightning comes straight down and hits the microphone.","Aunty's hair shoots 3 feet straight up. Her eyes glow blue. Sparks jump off her earrings. And she hits the note of her life. \"OOOOOH... EEEEEEE... LAAAAAH!\"","Every light on the street turns on at once. The garage door opens by itself. The neighbor's TV turns on. The rice cooker starts cooking. The karaoke machine gives her a score of 100 and then melts.","Aunty is totally fine. She says she has never sounded better. She now sings only in storms."],"Wiggle your fingers like sparks. \"Oo-EE-lah!\" Hit that EE high.","Uila means lightning and electricity. Hekili is thunder.",null,"Aunty struck by lightning at karaoke"],["n119","n",119,"kī","KEE","key; ti plant","KEEEEEY!",["You are locked out of the house. You call Mom. She says she hid the spare key in the kī. You think she means \"in the key,\" which makes no sense, so you hang up.","Then you turn around and see the hedge. It is 300 ti plants, tall green and red leaves, all around the yard. She meant the ti. The key is somewhere in there.","You dig through the leaves for an hour. Leaf after leaf after leaf. Finally you just stand in the middle of the hedge and scream \"KEEEEEEEEEY!\" and hold it as long as you can.","Every ti plant rustles. One of them slowly lowers a leaf. Tied inside it, wrapped up like a tiny laulau, is the key. You unwrap it and it smells faintly like dinner."],"Hold up a key between two fingers and stretch it out. \"Keeeee.\"","Ti leaves are what wrap laulau. The same short word kī means both the key and the plant.",null,"Key wrapped in a ti leaf in the hedge"],["n120","n",120,"kīwī","kee-VEE","TV","KIWI! TV!",["A kiwi fruit the size of a beanbag chair rolls in through your front door. Brown, fuzzy, smelling a little sour. It rolls straight to the couch and plops down in front of the television.","You reach for the remote. The kiwi rolls on your hand. Squish. You try again. Squish. It will not let you change the channel. It only wants cooking shows, and only the ones about fruit salad, which is honestly a little dark.","When you unplug the television, the kiwi starts vibrating and screaming. \"KEE-VEE! KEE-VEE! KEE-VEEEE!\" The fuzz stands straight up. The windows rattle.","You plug it back in. It settles down, fuzz flat, happy. It has now watched 14 straight hours. It is getting a little fuzzy around the eyes. It does not have eyes."],"Point a remote at the TV. \"Kee-VEE.\" The w sounds like a v.","Hawaiian uses a k where English has a t, so TV became kīwī. The w here sounds like a v.",null,"Giant kiwi fruit hogging the TV"],["n121","n",121,"kelepona","keh-leh-PO-nah","telephone","Kelly, PHONE-ah!",["The old phone hangs on the kitchen wall with a curly cord. Your sister Kelly is 15 and she has stretched that cord all the way down the hall, into her room, out her window, down the street, and around the corner to the bus stop. It is 3 miles long now.","Every time the phone rings, Mom picks up and screams down the hallway. \"KELLY! PHONE-AH!\" Then she yanks the cord.","Somewhere in Kaimukī, Kelly gets pulled off a bench and dragged backwards through a plate lunch line, across a parking lot, and past three mongooses, the cord snapping back like a giant rubber band. She lands in the kitchen, grabs the phone, says \"Hello?\"","It is a wrong number. She walks back to the bus stop."],"Hold your fist to your ear like a phone. \"Keh-leh-PO-nah.\"","Hawaiian turns T into K and F into P, so telephone became kelepona.",null,"Sister yanked home by a 3 mile phone cord"],["n122","n",122,"lekiō","leh-kee-OH","radio","LUCKY-OHHH!",["You are stuck in traffic on the H-1 with the radio on. The DJ says caller number 9 wins a year of free spam musubi.","You dial. You get through. You are caller number 9. The DJ yells \"You are the LUCKY caller!\" and you scream so loud the car shakes. \"LUCKY... OHHHHHHHH!\"","You hold that OH for so long that the cars around you start honking along. The radio dial spins by itself. The antenna shoots up 20 feet like a periscope.","The next morning a dump truck backs into your driveway and pours out 3,650 spam musubi, a hill of them taller than the house. The radio on your kitchen counter keeps saying \"Lucky, oh... lucky, oh...\" by itself for a week."],"Turn an invisible radio knob. \"Leh-kee-OHHH.\" Hold the ō.","Radio became lekiō the same way telephone became kelepona. R turns into L, and D turns into K.",null,"Dump truck of musubi from a radio contest"],["n123","n",123,"pepa","PEH-pah","paper","Pepper? No, PAPER!",["Uncle Sonny gets a fancy pepper grinder for his birthday. It is 3 feet tall and made of shiny black wood. At dinner he holds it over his steak and twists.","Instead of pepper, out comes paper. Little white squares, like confetti, pouring onto the steak. He twists harder. Now whole sheets come curling out, then notebook paper, then a phone book.","Everyone yells \"PEPPER!\" and Uncle yells back \"No! PEH-PAH!\"","Then he sniffs the grinder and sneezes. A giant sneeze. FWOOSH. Five hundred sheets of paper blast out and fill the dining room like a blizzard. It is up to your knees.","The kids are thrilled. They do all their homework on the table right there, and Uncle keeps grinding out more paper whenever they need it."],"Twist an imaginary pepper grinder. \"PEH-pah.\"","Pepa comes from the English word paper. Nūpepa is newspaper. Pepa can also mean playing cards, and even pepper, so the grinder in the story is not totally wrong.",null,"Pepper grinder spewing paper blizzard"],["n124","n",124,"puke","POO-keh","book","POOK! EH!",["Your dog is named Pook. Pook is a fat brown poi dog and Pook eats books. Not shoes. Not slippahs. Books.","He ate a whole cookbook in one afternoon. He ate the phone book. He ate a 900 page dictionary and now he burps big words. You come home and there are shredded pages all over the living room and a library sticker stuck to his nose.","You scream \"POOK! EH!\" and he looks up at you with a mouth full of chapter 7.","The library now knows him by name. When you walk in to return a chewed-up book, the librarian just sighs and says \"Pook, eh?\" Pook sits by the shelf, very calm, reading the spines. Deciding what is for dinner."],"Wag your finger at a dog. \"POO-keh.\" Two soft syllables, not the English word for throwing up.","Puke comes from the English word book. B turned into P.",null,"Poi dog eating a dictionary"],["n125","n",125,"peni","PEH-nee","pen","PENNY! Pen!",["Aunty Penny works at the post office and she never loses a pen, because she keeps all of them in her hair. She has a tall bun on top of her head with 312 pens stuck in it, pointing out in every direction.","When anybody in the line needs to sign something, they just yell \"PENNY!\" and she leans over. You pull one out. Blue, black, red, a gold one that lights up, one that is also a tiny flashlight.","Once a customer took the last pen from the middle and the whole bun collapsed. Pens rained down onto the counter for a full minute. Aunty Penny did not flinch. She scooped them up and stacked her hair back up in 40 seconds flat.","When she clicks all 312 at once, it sounds like popcorn."],"Click an imaginary pen three times. \"PEH-nee.\"","Peni is a pen or pencil. Pukui-Elbert also lists peni for a penny, but the usual word for a cent is keneka.",null,"Aunty Penny with 312 pens in her bun"],["n126","n",126,"penikala","peh-nee-KAH-lah","pencil","Penny, COLLAH!",["Aunty Penny from peni has run out of room in her hair. So now she keeps her pencils in her shirt collar. Eighty-eight yellow pencils, sharpened to needle points, sticking straight up all around her neck like a sea urchin.","Today she is subbing for a fourth grade class on test day, and 30 kids forgot their pencils. The regular teacher panics and yells across the room. \"PENNY! COLLAH!\"","Aunty Penny walks slowly down each row and bends her neck. Each kid pulls one pencil out of her collar. Pip, pip, pip. By the end her collar is bare and her neck is covered in little gray dots.","At lunch she sits in the corner with an electric sharpener and reloads. Grrrrr. Grrrrr. Eighty-eight times."],"Pull an imaginary pencil out of your collar. \"Peh-nee-KAH-lah.\"","Peni is a pen and penikala is a pencil. Both came from English.",null,"Aunty Penny with pencils around her collar"],["n127","n",127,"leka","LEH-kah","letter (mail)","LEH! CAR!",["The mailman on your street is Uncle Leh, and Uncle Leh does not get out of his car. Ever. He delivers every letter by flinging it out the window at 60 miles an hour.","The envelopes spin through the air like ninja stars and stick into your front door. Thunk. Thunk. Thunk. Birthday cards, electric bills, a letter from Grandma in Hilo, all stuck in the wood in a neat row.","When the kids on the street hear his engine, they scream the warning. \"LEH! CAR!\" Everyone dives behind a wall. The cats run. A letter slices through a hedge and trims it perfectly.","Grandma writes back every week. She always adds a note at the bottom of her letter that says \"Tell Leh to slow down.\" He reads it. He speeds up."],"Flick an invisible envelope across the room. \"LEH-kah!\"","Leka comes from the English word letter.",null,"Mailman flinging letters like ninja stars"],["n128","n",128,"ʻeke","EH-keh","bag, pocket","(hic) Eh, CAKE!",["You are at the bus stop digging in your shorts pocket for bus fare. Your hand keeps going down. Past your wrist. Past your elbow. Your whole arm is in your pocket, and it is still going.","You pull things out one by one. A slippah. A mango. A live crab that pinches you and runs away. A ʻukulele. A fishing pole. A cousin you have not seen since 2019.","Then your fingers touch something soft and sticky. You pull out a whole birthday cake, three layers, chocolate, with nine candles already lit.","You get such a shock you hiccup, a little catch in your throat, and then you yell \"EH... CAKE!\" The bus pulls up. The driver sees the cake. He lets you ride free if you share, and you pull out paper plates from the same pocket."],"Pat your pocket, hiccup, then \"EH-keh!\"","ʻEke can be a bag, a sack or a pocket in your clothes. That little catch at the start is the ʻokina.",null,"Birthday cake pulled from a shorts pocket"],["n129","n",129,"pākeke","paah-KEH-keh","bucket","PAAAH! Keh-keh!",["A wild goat wanders down from the hills into your backyard. It is thirsty. It finds the mop bucket by the hose, full of soapy water, and sticks its whole head in.","Now the bucket is stuck on its head.","The goat panics and runs in circles around the yard, bleating. \"PAAAAAAH!\" But inside the metal bucket, the sound bounces around and comes out as this weird echo. \"Keh-keh-keh-keh.\" PAAAAH, keh-keh. PAAAAH, keh-keh.","It runs into the car. Clang. It runs into the fence. Clang. It runs into Dad, who was carrying a plate of barbecue chicken. The chicken goes flying. The goat, still wearing the bucket, somehow catches a drumstick in the bucket.","It stands still for a second, chewing inside its bucket. Then it goes back up the mountain with it. Keh-keh."],"Bleat like a goat with a bucket on your head. \"Paaah-KEH-keh.\"","Pākeke comes from English bucket. It rhymes with lākeke, which is a jacket.",null,"Goat with a bucket stuck on its head"],["n130","n",130,"ʻumeke","oo-MEH-keh","calabash bowl","You MAKE, eh!",["You ask the old master carver down the road if you can buy one of his wooden bowls. He looks at you for a long time. Then he rolls a koa log into your arms. It is 3 feet wide and weighs as much as you do. He hands you a stone adze.","\"YOU MAKE, EH!\"","So you carve. Every day after school for six months. The wood chips pile up to the ceiling of your garage. Your arms get so big your shirt sleeves rip. You dream about wood grain.","Finally you hold it up. A smooth, round calabash, shining like honey, big enough to hold poi for the whole family. The carver taps it with one knuckle and it rings like a bell. He nods.","Then he rolls another log over. \"Good. Now you make ANOTHER, eh.\""],"Cup your hands into a round bowl. \"Oo-MEH-keh.\"","An ʻumeke is the classic bowl for poi. It can be carved from wood like koa or made from a gourd.",null,"Carving a koa calabash in a pile of chips"],["n131","n",131,"waihona","vai-HO-nah","storage place, depository; account; file","WHY, HONA?!",["Hona is a hermit crab who lives under your lanai, and Hona cannot throw anything away. His shell used to be small. Now it is the size of a rice cooker, and it is packed.","Inside it he stores 4,000 bottle caps, 60 keys, every receipt from the corner store since 2011, and a whole metal filing cabinet somehow folded up. The shell creaks when he walks. It is so heavy he leaves a trench in the sand.","You lift the shell and look in. \"WHY, HONA? WHY?\"","But the neighbors started trusting him. They drop off their spare change and he keeps it in a little drawer inside his shell. He is basically the neighborhood treasury now, a safe place for everyone's savings. When you need your money back, he digs through his files for ten minutes and hands you exactly the right coins."],"Hug a huge imaginary pile of stuff. \"Vai-HO-nah.\"","Hale waihona puke means library, a house for storing books.",null,"Hermit crab with a shell full of files"],["n132","n",132,"kāmaʻa","kaah-MAH-ah","shoe","KAAAR-MA... ah.",["At Aunty's birthday party there are 300 pairs of shoes piled at the front door, like everyone in Hawaiʻi does. A mountain of slippahs, sneakers and work boots.","When you leave, you do not take your own old slippahs. You take the shiny new sneakers on the very top. Nobody sees.","At 3 a.m. the sneakers wake you up by kicking you. They tie their own laces onto your feet. Then they march you out of bed, out the door, and down the street in your pajamas. Five miles. Uphill. In the rain.","As you pass the corner store, the night clerk shakes his head. \"Kaaaar-MA.\" You gulp. \"...ah.\"","The shoes walk you right back to Aunty's porch, kick themselves off, and hop neatly onto the pile. Your old slippahs are sitting there waiting."],"Point at your feet with a guilty face. \"Kaah-MAH,\" tiny catch, \"ah.\"","The long ā is the drawn out Kaaar, and the ʻokina is your guilty gulp before the last ah.",null,"Stolen sneakers marching you back at 3 a.m."],["n133","n",133,"pāpale","paah-PAH-leh","hat","Paaa! PALE!",["Pa has worn the same lauhala hat every single day for 31 years. He wears it fishing. He wears it to church. He sleeps in it. Nobody in the family has ever seen his forehead.","Then one day at Makapuʻu the wind comes screaming over the cliff and rips the hat right off his head. It sails away over the ocean like a frisbee, 2 miles out.","The whole beach goes silent. Pa's face is brown as a coconut. But his forehead is WHITE. Glowing white, like powdered sugar on a malasada. It is so bright the lifeguards put on sunglasses. A plane circles, thinking it is a landing light.","The kids scream \"PAAAA! PALE!\"","Pa slaps both hands on his forehead, runs into the ocean, and swims after his hat."],"Tip an imaginary hat. \"Paah-PAH-leh.\" Stretch the first paah.","A lei pāpale is a lei made to wrap around the band of a hat.",null,"Pa's glowing pale forehead, hat flying off"],["n134","n",134,"lole","LO-leh","clothes; dress","ROLL, EH!",["You are packing for a trip to the continent. You throw everything in the suitcase. It will not close. You sit on it. It still will not close.","Then Aunty walks in. She was in the Navy for 22 years. She looks at your suitcase like it insulted her family. \"ROLL, EH!\"","She dumps it out and grabs every piece of clothing you own. Shirts, shorts, your good dress, your pajamas, your socks. She rolls each one into a tight little log, like a musubi, in about half a second. Roll, roll, roll. Forty-seven pieces of clothes.","They all fit in a lunch box. She hands it to you. Then she looks at your big suitcase, rolls that up too, and puts it in your pocket."],"Roll an invisible shirt tight between your hands. \"LO-leh.\"","Lole means clothes in general and also a dress. Lole wāwae (leg clothes) means pants.",null,"Navy aunty rolling clothes into tiny logs"],["n135","n",135,"pālule","paah-LOO-leh","shirt","PAAA! LOUD, eh!",["Pa is back with a new aloha shirt from the swap meet. It is the loudest shirt ever made. Not loud colors. Loud. It makes noise.","The parrots printed on it squawk. The hibiscus flowers honk like car horns. The little ʻukuleles on the pocket strum by themselves. There is a volcano on the back and every few minutes it rumbles.","At the family party nobody can hear anything. Grandma is trying to say grace and a parrot on Pa's shoulder is screaming over her. Ma finally stands up and points at him across the yard. \"PAAA! LOUD, EH!\"","Pa buttons his jacket over the shirt. It is still loud. He goes and sits in the car. You can still hear it from the car. Grandma finishes grace with earplugs."],"Cover your ears and point at someone's shirt. \"Paah-LOO-leh.\" Stretch the first paah.","Pālule is a shirt. Lole is clothes in general. Keep the long ā at the front, because palule with a short a is a rare word for a commoner.",null,"Pa's aloha shirt squawking and honking"],["n136","n",136,"kīhei","kee-HAY","shawl, cape","Keeeeee... HEY!",["You are on the beach in Kīhei on Maui, which has the same name as this word, and the afternoon wind is blowing 35 miles an hour. You tie a big kapa cloth over one shoulder, knotted at the side, the old style way.","A gust grabs it. The cloth fills up like a sail. Your feet leave the sand.","\"KEEEEEEEE!\" You are 20 feet up. Then 40. The cape is flapping behind you, and you are flying over the beach like a kite with no string. The ʻiwa birds fly next to you and look annoyed.","You see your family below and wave. \"HEY! HEY!\" They wave back and keep eating their plate lunch.","The wind finally drops you gently in the ocean. You swim to shore with your cape and your family says you missed the mac salad."],"Throw an imaginary cape over one shoulder. \"Kee-HAY!\"","A kīhei is traditionally worn tied over one shoulder. It is still worn for hula and special events. Kīhei is also a town on Maui.",null,"Flying over a Maui beach on a cape"],["n137","n",137,"malo","MAH-lo","loincloth","Marsh... MALO!",["Your cousin is 4 years old. At the canoe festival he watches the paddlers come in, strong men wearing malo, long strips of cloth wrapped around the waist and between the legs, with a flap hanging in front.","He is in love. He has one question, and he asks it loud enough for the whole beach. \"Where do I get a MARSHMALLOW?\"","The steersman, a big uncle with arms like tree trunks, laughs so hard he almost tips the canoe. He kneels down. \"Not marsh-mallow. MAH-lo. Malo.\"","Then he takes a strip of red cloth and wraps a tiny malo for your cousin, right over his swim trunks. Your cousin stands up proud as a chief, grabs a boogie board, and paddles out 200 yards. He will not take it off for three weeks. He sleeps in it."],"Stand up tall and proud. \"MAH-lo.\" Short and strong.","The malo was the everyday garment for men in old Hawaiʻi, and it is still worn for hula kahiko and canoe events.",null,"Tiny cousin proudly wearing a red malo"],["n138","n",138,"pāʻū","paah-OO","skirt (sarong)","PAAAH... OOOOH!",["Aunty is riding her horse in the big flower parade in Honolulu. She is wearing a pāʻū, a long wrapped riding skirt made from 16 yards of bright yellow satin. It drapes down over both sides of the horse almost to the ground.","They turn the corner onto Kalākaua, and a huge gust of wind comes off the ocean. The skirt catches it. \"PAAAAAH!\" It snaps open like a ship sail.","For one second everything freezes. Then Aunty, the horse and 16 yards of satin get pushed backwards down the street at walking speed. The horse is still walking forward. They are just going the wrong way.","The whole crowd goes \"OOOOOOOH!\" The parade marshal just points her the right direction. She sails back to the start and does the whole thing again."],"Spread your arms wide like a skirt in the wind. \"Paaah,\" catch, \"OOOH.\"","Pāʻū riders on horseback wear long wrapped skirts in parades, each in a color for one island. Hula dancers also wear a pāʻū.",null,"Parade rider's giant skirt catching the wind"],["n139","n",139,"muʻumuʻu","moo-oo-MOO-oo","long loose dress","Moo? Oo! MOO? Oo!",["A cow shows up at your family lūʻau wearing a muʻumuʻu. A giant one, bright red with white hibiscus, long enough to reach the grass, loose enough to fit a cow. Nobody knows where she got it. It looks great on her.","She walks straight to the buffet. She eats the whole tray of lomi salmon, then the poi, then the haupia. Her belly gets bigger and bigger, but the muʻumuʻu is so loose it just flows. No problem. That is the whole point of a muʻumuʻu.","The aunties are jealous. They want to know where she got it. The cow just shakes her head, making tiny catches in her throat. \"Moo? (hic) Oo. MOO? (hic) Oo.\"","By the end of the night she is doing hula with the aunties in a line, all in muʻumuʻu, all eating."],"Moo like a polite cow, with a tiny catch. \"Moo-oo-MOO-oo.\"","A muʻumuʻu is loose and flowing. A holokū is a long fitted dress, often with a train.",null,"Cow in a red muʻumuʻu at the buffet"],["n140","n",140,"lei","LAY","garland, lei","LAY another one on!",["It is your graduation. You walk off the stage and your family is waiting on the grass with a mountain of lei. Plumeria, orchid, ti leaf, candy, money lei, a lei made of spam musubi.","Aunty puts the first one on. Then the next. Then Uncle yells \"LAY another one on!\" and everyone starts piling them over your head. LAY. LAY. LAY.","By lei 30 they are up to your chin. By 45 they are over your nose. By 60 you are just a walking tower of flowers with two feet sticking out the bottom. You cannot see. You smell like a flower shop. A bee has moved in.","You try to walk to the car and wander into the wrong family's photo. They put one more lei on you too."],"Drape an invisible lei over someone's head. \"LAY.\"","May 1 is Lei Day in Hawaiʻi. Lei can also mean to wear a lei.",null,"Graduate buried in 60 lei"],["n141","n",141,"aniani","ah-nee-AH-nee","mirror; glass","Annie? ANNIE!",["The twin Annies from pukaaniani are back. Their dad just put up a huge new mirror in the hallway, 8 feet tall.","One Annie walks down the hall, sees her reflection, and stops. She thinks it is her sister. \"Annie?\" The reflection says \"Annie?\" right back. \"ANNIE!\" \"ANNIE!\"","She sticks out her tongue. The reflection sticks out its tongue. She does a dance. It does the same dance, perfectly, at the same time. She is furious. They copy each other for 45 minutes. Hopping, spinning, making faces.","Then the real other Annie walks up behind her. Now there are two Annies in the hallway and two Annies in the glass, all yelling \"ANNIE! ANNIE!\" at each other. Their dad walks by, looks at four Annies, and goes back to bed."],"Wave at yourself in a mirror. \"Ah-nee-AH-nee.\"","Aniani means mirror and also glass. Pukaaniani, a window, is a hole in the glass.",null,"Twin Annies copying each other in a mirror"],["n142","n",142,"kopa","KO-pah","soap","K.O.! PAH!",["Every night in your bathtub there is a secret wrestling league. The champion is a big white bar of soap. Nobody can beat him, because nobody can hold him.","Tonight the challenger is a plastic army man. The rubber duck is the referee. The bell rings. The army man charges and grabs the soap in a headlock. The soap squirts out of his arms, shoots across the tub, bounces off the faucet, and slams into the army man. He flies out of the tub and lands in the sink.","The rubber duck squeaks over the edge and counts. One, two, three. \"K.O.!\" The soap blows a bubble, pops it, and spits a little foam. \"PAH!\"","He has won 312 matches in a row. He is getting smaller every week, but he says that is just him cutting weight."],"Throw a slippery punch and then spit. \"KO-pah!\"","Kopa comes from English soap. Careful, kōpaʻa with a long ō and a catch is sugar.",null,"Soap bar wrestling champ in the bathtub"],["n143","n",143,"kāwele","kaah-VEH-leh","towel","Kaaaa... WHALE, eh!",["You lay out the biggest beach towel in the world at Waikīkī. It is 50 feet long and has a picture of a sunset on it. You go get a shave ice.","When you come back, a humpback whale is lying on your towel. It flopped all the way up the beach. It is rolling back and forth, drying its belly, then its back, then its tail. Sand sticks everywhere. It sighs a big fishy sigh.","The lifeguard walks up next to you and just stares with his mouth open. \"Kaaaaaa... WHALE, eh!\"","The whale finishes drying, wraps the towel around its head like a turban, and scoots back into the ocean. You watch your towel swim out past the reef. Every winter it comes back and waves at you from the water, still wearing it."],"Dry your hair with an invisible towel. \"Kaah-VEH-leh.\"","The w in kāwele is often said like a v, which is why the whale hook works. It came from English towel, with T turned to K.",null,"Humpback whale drying off on a beach towel"],["n144","n",144,"pūlumi","poo-LOO-mee","broom","Poor LOOMY!",["The lady next door sweeps her lanai every morning at 6 a.m. with a broom that has bristles 4 feet long. It is the biggest broom on the island. She calls it her car.","Under her couch lives a dust bunny named Loomy. Loomy is the size of a golden retriever, gray and fluffy, made of hair, sand and old rice. Every morning she sweeps him. WHOOSH. Loomy tumbles across the lanai, bounces down the steps, rolls down the driveway, and stops in the middle of the street.","The kids waiting for the school bus all say it together. \"Poooor LOOMY!\"","By lunch Loomy has rolled all the way back up the driveway, picked up a few more crumbs, and is hiding under the couch again. He gets bigger every day. The broom is getting nervous."],"Sweep the floor with big strokes. \"Poo-LOO-mee.\" Stretch the first poo.","Pūlumi comes from the English word broom. B turned to P, R turned to L. Keep the long ū, because pulumi with a short u is a flume or gutter.",null,"Giant broom sweeping a huge dust bunny"],["n145","n",145,"lākeke","laah-KEH-keh","jacket","Laaaa... keh-keh-keh!",["Your friends drag you up to the top of Haleakalā to watch the sunrise. You wear shorts, a tank top and slippahs because you live in Hawaiʻi and you think it is always warm.","It is 3 a.m. and 36 degrees. The wind is blowing sideways. You are 10,000 feet up and your legs are turning blue.","You try to ask the guy next to you if you can borrow his jacket. \"Laaaaaa...\" But your teeth start chattering so hard nothing else comes out. \"Keh-keh-keh-keh-keh.\" \"LAAAA... keh-keh-keh.\"","He understands. He unzips his puffy jacket, which is the size of a sleeping bag, and zips you inside it with him. You watch the whole sunrise from inside the jacket like two peas in a pod. It is beautiful. Your teeth are still going keh-keh."],"Hug yourself and chatter your teeth. \"Laah-KEH-keh.\"","Lākeke comes from English jacket. It rhymes with pākeke, a bucket.",null,"Shivering in slippahs at a mountain sunrise"],["n146","n",146,"kākini","kaah-KEE-nee","socks","KHAKI KNEE!",["Uncle Bully shows up at the beach wearing slippahs with socks. Not just socks. Tan khaki socks pulled all the way up to his knees. Tight. Crisp. Ironed.","The whole beach stops. A surfer falls off his board. A man drops his plate lunch. The kids point and chant. \"KHAKI KNEE! KHAKI KNEE!\"","Uncle does not care. He says socks keep the sand off. He walks right into the ocean in them. When he comes out, each sock is holding about 4 pounds of water and sloshing like a water balloon. Squish. Squish. Squish.","He lies down on his towel, and a crab crawls out of the left sock and waves at him. He says it was in there before he went in the water."],"Pull invisible socks up to your knees. \"Kaah-KEE-nee.\"","Kākini came from the English word stocking. Do not mix it up with kini, which is a can.",null,"Uncle in knee-high khaki socks with slippahs"],["n147","n",147,"ukana","oo-KAH-nah","luggage, baggage","You CAN, ah?",["Aunty is coming home from a week in Las Vegas. You go to pick her up at the airport. She left with one small bag.","She comes back with 14 giant suitcases. Every single one is stuffed with snacks from the casino gift shop, plus six boxes tied with string and a cooler that is making noise. The baggage carousel is groaning under it.","She points at the pile, then at you. You are 5 feet tall. \"YOU CAN, AH?\"","You stack all 14 suitcases on your back in a tower 20 feet high. You wobble through the airport like a camel. You go through the automatic doors sideways. People film you. At the car you realize none of it will fit, so Aunty just sits on top of the pile and you push the whole thing home down the street."],"Pretend to lift a very heavy suitcase. \"Oo-KAH-nah.\"","Ukana is any luggage, baggage, or cargo that gets carried somewhere.",null,"Tower of 14 suitcases on your back"],["n148","n",148,"pūʻolo","poo-OH-lo","bundle, package","POOOOOO... OH, LOW!",["Grandma in Hilo always sends you home with a bundle. Dried fish, mochi, sweet bread, all wrapped in ti leaves and tied up with string. This time she is late. Your plane is already boarding.","She runs up to the fence by the runway and throws the bundle like a football. It goes up, up, 200 feet into the sky. On the way down it whistles like a bomb in a cartoon. \"POOOOOOOOOOO...\"","You run under it. You see it dropping fast. Your throat catches. \"OH... LOW!\" You dive across the tarmac, slide on your belly past two luggage carts, and catch the bundle 1 inch from the ground.","The whole plane cheers through the windows. The dried fish smell follows you all the way to Honolulu. Nobody sits next to you."],"Whistle a falling sound, then catch it low. \"Poo,\" catch, \"OH-lo!\"","A pūʻolo is often a bundle wrapped in ti leaves, like food wrapped up to carry home.",null,"Diving catch of Grandma's ti leaf bundle"],["n149","n",149,"kini","KEE-nee","can (tin)","TEENY!",["You find a can in the back of the pantry. It is teeny. It is the size of your thumbnail. The label just says \"Vienna Sausage.\"","You laugh. \"TEENY!\" You peel back the lid with your pinky.","Out comes a Vienna sausage. Then another. Then 40 more. They keep coming out of that teeny can like clowns out of a tiny car. They pour onto the counter, off the counter, onto the floor. Two hundred. Five hundred. They fill the kitchen up to your waist. The dog swims through them in pure joy.","After 40 pounds of sausage, the can finally goes quiet. You look inside. There is one more at the bottom. It waves at you.","You quickly close the lid and put it back in the pantry for next time."],"Pinch a teeny can between two fingers. \"KEE-nee.\"","Kini comes from English tin. The T turned into K, just like kīwī from TV.",null,"Teeny can pouring out 40 pounds of sausage"],["n150","n",150,"ʻōmole","oh-MO-leh","bottle","OHHH, MOLE-eh!",["A glass bottle washes up on the North Shore. It is 9 feet long. There is a cork in the top as big as a tree stump, and you can see something moving inside.","It takes three surfers and a tow rope to pull the cork. POP. Out climbs a mole. A little brown mole, wearing tiny swim goggles and a captain's hat, with a sunburn on his nose. He has sailed that bottle all the way from California. He is very tired.","Everyone on the beach steps back. You gasp and hold your breath for a second, then point. \"OHHHH... MOLE, EH!\"","He asks where he can get a plate lunch. Then he climbs back into the bottle to sleep because it is the only home he knows. It is still parked there on the sand."],"Hold up an invisible bottle and peek in. \"Oh-MO-leh.\" Start with a little catch.","Kini (can) and ʻōmole (bottle) are the two words you need at the recycling bin.",null,"Mole in goggles climbing out of a giant bottle"],["n151","n",151,"kāleka","kaah-LEH-kah","card","Kaaa... LECK-ah! (Collect-ah!)",["Family game night. Uncle Dennis wants to show off his fancy card shuffle. He bends the whole deck into an arch and lets it fly between his hands.","Except he is standing right under the ceiling fan, which is on high.","FFFWAPPP. Fifty-two cards get sucked up into the blades and shot out in every direction like a machine gun. One sticks in the wall. One lands in the rice pot. One goes in Grandma's coffee. One slices a banana in half in midair. The queen of hearts is somehow stuck to the dog.","Uncle stands there with empty hands. Then he points at the kids and yells \"CAAAH... COLLECT-AH! COLLECT-AH!\" The kids run around the house for 40 minutes picking up cards. They find 51. The last one shows up a week later in somebody's slippah."],"Fan out an imaginary deck of cards. \"Kaah-LEH-kah.\"","Kāleka comes from the English word card.",null,"Ceiling fan blasting cards everywhere"],["n152","n",152,"uaki","oo-AH-kee","watch, clock","Ooh, WACKY!",["Grandpa's big wall clock has been perfect for 50 years. Today it goes wacky.","At noon, the hour hand starts spinning like a helicopter blade. The minute hand goes backwards. Then the two hands start fighting each other, slapping back and forth. The clock chimes 47 times in a row. The cuckoo from kukui pops out of the clock next door, looks at this mess, and goes back inside.","Everyone checks their watch. Every watch in the house is spinning too. Dad's watch says it is Tuesday of next year. Your little sister's watch is playing music.","Grandpa stares at the wall and just says \"Ooooh... WACKY.\"","He smacks the side of the clock once with his palm. Everything stops. It says a quarter past three. It is actually a quarter past three. Nobody ever finds out why."],"Tap your wrist where a watch goes. \"Oo-AH-kee.\"","Uaki comes from English watch. To ask the time, people say Hola ʻehia kēia?",null,"Grandpa's clock hands spinning and fighting"],["n153","n",153,"lolouila","lo-lo-oo-EE-lah","computer","LOLO! Oooh-EE-lah!",["The karaoke aunty from uila is back. Since the lightning hit her, she has too much electricity in her fingers. Today she tries to check her email on the family computer.","She touches the keyboard. ZAP. The computer screen flashes. The fan starts spinning so fast the computer slides across the desk. Then it goes totally lolo. It opens 900 windows at once. It orders 60 pounds of rice online. It starts talking to the printer, and the printer is printing pictures of cats.","Then it starts singing, in her voice. \"Ooooh... EEEEE... LAAAAH!\"","The whole family stands in the doorway. Your cousin shakes his head. \"Lolo. Ooh-ee-lah.\"","Now the computer and Aunty sing duets every Saturday. It is better at the high notes than she is."],"Tap your head, then wiggle your fingers like sparks. \"Lo-lo, oo-EE-lah.\"","Lolo means brain (and also crazy), and uila means electricity. A computer is an electric brain.",null,"Crazy computer singing karaoke with Aunty"],["n154","n",154,"nūpepa","noo-PEH-pah","newspaper","NEWWW PAPER!",["The Sunday newspaper kid in your neighborhood is 11 years old and has an arm like a cannon. This week the paper is 900 pages thick and weighs 40 pounds.","He winds up on his bicycle and throws. It smashes through your screen door, skids across the kitchen floor, and slams into Dad's chair at breakfast. Dad is launched 3 feet into the air.","Dad picks it up and opens it. The paper unfolds and unfolds. It covers the table. It covers the kitchen. It covers Dad. You cannot see him anymore. You can only hear crinkling.","Then from somewhere deep inside the pages you hear a muffled voice, very happy. \"Nuuuuuu... PAPER!\"","He does not come out until Tuesday. He has finished the crossword."],"Snap open a big newspaper with both hands. \"Noo-PEH-pah.\" Stretch the noo.","Nūhou means news. Nūpepa came from English newspaper, and pepa by itself is paper.",null,"Dad swallowed by a giant Sunday paper"],["n155","n",155,"kiʻiʻoniʻoni","kee-ee-oh-nee-OH-nee","movie","KEE! (hic) EE! Oh, KNEE! (hic) Oh, KNEE!",["You are at the movie theater. The movie is about a giant crab attacking Honolulu, and it is right at the scariest part. The theater is pitch dark.","A big guy with a bucket of popcorn the size of a trash can is climbing over the whole row to get to his seat. He bangs his knee on the first seat. \"KEE!\" Hiccup. \"EE!\" He bangs it on the next one. \"OH, KNEE!\" Hiccup. \"OH, KNEE!\"","He does this all the way down a row of 20 seats. Every bang has a little hiccup in the middle. Kee, ee, oh knee, oh knee.","Everyone in the theater is watching him now instead of the movie. When he finally sits down, the whole crowd claps. On the screen, even the giant crab turns around and claps."],"Grab your knee and hop. \"Kee-ee, oh-nee, OH-nee.\" A little catch before each ee and oh.","Kiʻi means picture and ʻoniʻoni means moving. A movie is a moving picture.",null,"Man banging his knee down a dark theater row"],["n156","n",156,"makana","mah-KAH-nah","gift, present","Ma, CAN, ah?",["There is a present in the living room that is 12 feet tall. It is wrapped in gold paper and it has your name on it. Your birthday is in three days.","You stand next to it. You look at Ma. \"Ma, CAN, ah?\" She says no. You ask again after dinner. \"Ma, can, ah?\" No. You ask 700 times over three days. You ask in your sleep.","Finally the day comes. You tear it open. Inside is another box, a little smaller. And another. And another. There are 40 boxes, each one inside the last, and the living room fills up with gold paper to the ceiling.","The last box is the size of a matchbox. You open it. One perfect, warm malasada. It is the best malasada you have ever eaten. You would ask 700 times again."],"Hold out both hands and beg. \"Mah-KAH-nah?\"","Makana is also the name of a mountain on Kauaʻi. Makana aloha is a gift given with love.",null,"12 foot present with 40 boxes inside"],["n157","n",157,"kālā","kaah-LAAH","money; dollar","COLLAH! DOLLAH!",["There is a tiny Chihuahua in Kāhala who is richer than everyone on your street. His owner made him a dog collar out of real dollar bills. Hundreds of them, folded into little fans, going all the way around his neck.","The collar is so big the dog looks like a lion. It rustles when he walks. When the wind blows, dollar bills flutter off it and float down the sidewalk.","Every kid in the neighborhood follows him on his walk like a parade, picking up loose bills. They sing a little song. \"Collaaaah, dollaaaah! Collaaaah, dollaaaah!\"","The dog does not care about money. He only wants the bread crust your little brother is holding. They trade. Your brother walks home with the whole collar around his neck, looking like a very rich lion."],"Rub your thumb and fingers together like money. \"Kaah-LAAAH.\" Both vowels long.","Kālā came from English dollar. ʻEhia kālā? means how much money?",null,"Chihuahua wearing a collar of dollar bills"],["n158","n",158,"keneka","keh-NEH-kah","cent, penny","Kenny, NECK-ah!",["Your classmate Kenny has been saving every penny he finds for eight years. He has 5,000 pennies. He does not trust piggy banks. So he drilled a hole in every penny and strung them all into one giant necklace.","It weighs 30 pounds. When he wears it to school, he walks bent over like an old man. It clanks like a pirate.","His teacher looks at him and gasps. \"Kenny, your NECK, ah!\"","In P.E. he tries to run and the necklace swings out and knocks over three kids. When he sits down, his chair cracks. In the hallway, other kids toss pennies at him and they stick to the necklace like magnets.","He finally cashes it in at the bank. It is fifty dollars. He buys a neck brace."],"Flip an invisible penny. \"Keh-NEH-kah.\"","Keneka comes from English cent. One hundred keneka make one kālā. Peni can also mean penny, but keneka is the usual word for a cent.",null,"Kid bent over by a 30 pound penny necklace"],["n159","n",159,"kaula","KOW-lah","rope, cord","COWWW... LAAAA!",["Remember the cow sitting on top of your roof from kaupaku? She is still up there. It has been a week. She has made friends with the pigeons. The fire department says it is not their problem.","So the old paniolo from up the road comes over with a rope. It is 200 feet long and as thick as your arm. He swings it three times over his head and lassos the cow on the first try.","Then the whole neighborhood holds the other end, like tug of war, and they lower her down slowly off the edge of the roof. She dangles there, spinning gently.","The cow is not scared at all. She loves it. As she floats down she starts to sing like an opera singer. \"COWWWW... LAAAAAAA!\" Her hooves touch the grass and everyone claps."],"Pull on an invisible rope, hand over hand. \"KOW-lah.\"","Hawaiian style beef jerky is called pipi kaula, rope beef, because it dries in long strips.",null,"Singing cow lowered off a roof by rope"],["n160","n",160,"ʻupena","oo-PEH-nah","net","(hic) OO... PEN-ah! (Open-ah!)",["The best throw net fisherman on the island is a tiny old lady who is 4 feet 10 inches tall. She stands on the rocks at the harbor, folds the net over her arm, and spins.","She holds her breath for a second, a little catch in her throat. Then she lets it go and yells \"OOOO... PEN-AH!\" Open, ah!","The net flies out and opens into a perfect circle. It keeps opening. Bigger and bigger. Soon it is as wide as the whole harbor. It comes down over everything.","When she pulls it in, she has 300 fish, an octopus, two confused kids on boogie boards, a canoe, a lifeguard in his chair, and an ice cream cart. She lets everything go except the fish and one ice cream.","Then she folds the net back over her arm like it was nothing."],"Throw an invisible net in a big circle. \"Oo-PEH-nah!\"","An ʻupena can be any net, from a small hand net for the tide pools to a huge net for a whole school of fish.",null,"Tiny lady's throw net covering the harbor"],["n161","n",161,"makau","mah-KOW","fishhook","MA-CAW!",["Your neighbor has a big red and blue macaw parrot, and the macaw loves to go fishing. Every morning it flies down to the pier holding a fishhook in its beak on a long line.","It hovers over the water and drops the hook down. It waits. Very patient. Then a fish bites and the macaw screams \"MACAW!\" and flaps up hard. A fish comes flying out of the water.","It catches 30 fish before breakfast. MACAW. MACAW. MACAW. The fishermen on the pier with their fancy poles have caught nothing. They are so mad.","One morning the hook snags a fisherman's hat instead. The macaw screams \"MACAW!\" and flies off with the hat. It wears it now. It is a very good fisherman and it knows it."],"Flap your arms and squawk. \"Mah-KOW!\"","Carved fishhook pendants called makau are popular necklaces in Hawaiʻi.",null,"Macaw fishing off the pier with a hook"],["n162","n",162,"ihe","EE-heh","spear","EEEEE... HEH!",["At the Makahiki games there is a spear throwing contest. The target is a banana trunk stuck in the ground, far away. Big strong guys go first. They grunt, they throw, the spears wobble and fall short.","Then your Aunty Mele steps up. She is 70 years old and 5 feet tall. She is still holding her purse.","She throws the spear so hard and so fast it screams through the air. \"EEEEEEEEEEE!\" It flies for 90 yards. The crowd turns their heads to follow it.","Then \"HEH!\" It sinks right into the center of the banana trunk and hums there, shaking.","The big guys are silent. Aunty Mele just says \"Heh,\" fixes her hair, and goes back to her lawn chair. The banana tree gives up and falls over."],"Throw an invisible spear. \"EEEE,\" as it flies, \"heh!\" as it lands.","Spear throwing at a target is one of the old Makahiki games that people still play today.",null,"Tiny aunty spearing a banana trunk"],["n163","n",163,"pū","POO","conch shell trumpet; gun","POOOOOOOOOOO!",["It is the start of a big canoe race. Twelve canoes are lined up in the water. The paddlers are ready. A big uncle stands on the beach with a conch shell as big as a football to blow the start.","He lifts it to his lips. \"POOOOOOOOOOOOOOOOO...\"","He does not stop. One minute. Two minutes. His face turns red, then purple. The paddlers are still holding their paddles in the air. A kid's shave ice melts. A cloud passes.","Three minutes. Out in the ocean, a humpback whale lifts its head out of the water and answers. \"POOOOOOOO...\"","Four minutes. Uncle finally runs out of air and sits down in the sand. The race starts. Nobody remembers who won. They only remember the POOOO. The whale still calls back every year on race day."],"Cup your hands to your mouth and hold one long note. \"POOOOOO.\" The ū is extra long.","Pū also means gun, from the loud blast.",null,"Uncle blowing a conch shell for 4 minutes"],["n164","n",164,"koʻi","KO-ee","adze, axe","KO... (freeze) ...EE! (Koi!)",["In the pond at the botanical garden lives a koi fish the size of a canoe. Orange and white, with whiskers like an old man. Everybody thinks it is just a fish.","One night it hops out of the pond. It grabs a stone adze in its fins. It flops over to a huge log that has been lying by the path for years.","Then it gets to work. CHOP. Wood chips fly 20 feet. CHOP. CHOP. It carves in a blur, faster than any machine, for four minutes straight. When it stops, the log is a perfect canoe, smooth and shiny.","The night guard sees the whole thing. He freezes halfway through saying the name. \"KO...\" Freeze. \"...EE?\"","The koi puts down the adze, hops back into the pond, and pretends to eat a lily pad."],"Swing an invisible adze down. \"KO,\" freeze, \"ee!\"","Old koʻi blades were made from hard basalt stone lashed onto a wooden handle.",null,"Giant koi fish carving a canoe with an adze"],["n165","n",165,"ʻōʻō","oh-OH","digging stick","(hic) OHHH! (hic) OHHH!",["Your grandpa wants to plant sweet potatoes, but he refuses to use a shovel. He uses a long wooden digging stick, sharp at one end, as tall as he is. He says it is how they did it long ago and it works better.","He jabs it into the ground. Every jab, he makes the same noise. A catch in his throat, and then a long \"OHHH!\" Catch, \"OHHH!\" Catch, \"OHHH!\" OH, OH. OH, OH.","He digs 200 holes in one afternoon. Perfect straight rows. The neighbor with the gas powered tiller only did 30.","On hole 201 the stick hits something hard. Grandpa digs it out. It is an old cooler somebody buried in 1987. He opens it. Inside are four cans of soda and a musubi that has turned to stone. \"OH... OH.\""],"Stab the ground with an invisible stick twice. \"Oh,\" catch, \"OH.\" Both long.","ʻŌʻō is also the name of a black forest bird with yellow feathers that is now extinct.",null,"Grandpa jabbing holes with a digging stick"],["n166","n",166,"pila","PEE-lah","musical instrument; bill","PEEEEE... LAAAAH!",["It is the third grade recorder concert. Forty kids, each holding a plastic recorder, standing on the risers. The parents are smiling nervously.","The music teacher lifts her hands. Forty kids blow at once. \"PEEEEEEEEE!\" A horrible squeak. Then they find the note. \"LAAAAAAAH.\" Then squeak again. PEEEE. LAAAAH. PEEEE. LAAAAH.","Every dog in Kalihi starts howling. The school windows crack, one by one, in a line. A car alarm goes off. A myna bird falls out of a tree.","They play for 22 minutes. Everybody claps very hard because they are so glad it is over.","The next day the school gets a bill for 34 broken windows. The principal sends that bill home with every kid, rolled up and stuck inside each little recorder."],"Play an invisible recorder. \"PEEE,\" squeak, \"lah.\"","Pila means any musical instrument and also a bill you have to pay. Kanikapila means to play music together, a jam session.",null,"Forty kids squeaking recorders, windows cracking"],["n167","n",167,"kīkā","kee-KAAH","guitar","KEEEEE-KAAAAH!",["Backyard jam session. Everybody has an ʻukulele and they are playing sweet slow songs. Then your cousin shows up with an electric guitar and an amplifier the size of a refrigerator.","He plugs in. He turns every knob all the way up. He stands too close to the amp. It screams with feedback.","\"KEEEEEEEEEEEEE... KAAAAAAAAAAH!\"","The sound knocks the chickens onto the roof. The ʻukuleles all go out of tune at once. Aunty's wig spins around backwards. The lid flies off the pot of chili.","Your cousin thinks this is amazing. He jumps in the air and does it again. \"KEEEEEE... KAAAAH!\" Then the amp blows up in a puff of smoke, and he finishes the song on a regular guitar with no plug, very quiet, like a gentleman."],"Air guitar one big windmill strum. \"Kee-KAAAH!\"","Kī hōʻalu, slack key, is the famous Hawaiian style of guitar where the strings are loosened.",null,"Guitar feedback blasting chickens onto roof"],["n168","n",168,"ʻukulele","oo-koo-LEH-leh","ʻukulele","Ooh, KOO! LAY-lay!",["You look closely at your ʻukulele and realize there is a flea living inside it. A flea the size of a hamster. It pops its head out of the sound hole and says \"Ooh, koo!\"","It climbs out onto the strings. It starts jumping. Its legs hit the strings on the way up and on the way down, bouncing so fast it plays a song. Boing, strum, boing, strum. Jump, jump, jump. It is playing the fastest ʻukulele solo you have ever heard.","As it jumps it sings along in a squeaky voice. \"Ooh, KOO! LAY-lay! LAY-lay!\"","The whole family comes to watch. The flea bows. Then it jumps onto the dog and starts playing him too. The dog does not know what is happening, but he is humming."],"Wiggle your fingers like they are hopping on strings. \"Oo-koo-LEH-leh.\" Start with a tiny catch.","ʻUku means flea or louse and lele means to jump, so ʻukulele is literally the leaping flea. Pukui-Elbert says the name probably came from the nickname of a small, quick man who helped make the instrument popular. Another popular explanation is fingers hopping on the strings.",null,"Hamster sized flea jumping on uke strings"],["n169","n",169,"kinipōpō","kee-nee-poh-POH","ball","TEENY Popo!",["Popo is a scruffy little mutt who weighs 3 pounds. He is teeny. He fits in a coffee cup. But he has one dream, and it is a beach ball that is 8 feet tall.","At the beach he gets behind it and pushes with his little head. It does not move. He backs up and charges. It rolls. Just an inch. He pushes again. It rolls a foot. Then it starts going downhill toward the water, and Popo is running full speed behind it, legs spinning.","The whole beach cheers him on. \"TEENY POPO! TEENY POPO!\"","The ball hits the water and bounces over a wave. Popo swims after it. Twenty minutes later he comes back pushing it up the beach like a champion, then lies down on top of it and falls asleep, rolling slowly back and forth."],"Bounce an invisible ball, one bounce per syllable. \"Kee-nee-poh-POH.\" Hold both ō sounds.","Pōpō by itself means a round ball or lump.",null,"Tiny dog pushing a giant beach ball"],["n170","n",170,"mīkini","mee-KEE-nee","machine","MEEE. KEE. NEE. (robot voice)",["Uncle builds a machine in his garage out of a lawn mower, a washing machine, a rice cooker, two old fans and a car battery. It is taller than the garage door. It hums.","He flips the switch. The lights in the whole house dim. Two headlight eyes open on the front. Then it talks in a flat robot voice. \"MEEE. KEE. NEE.\"","It rolls to the kitchen. It starts making spam musubi. One every second. Then ten every second. Rice is flying, nori is flying, musubi are shooting out the side and stacking themselves on the counter. Five hundred a minute.","By dinner there are 20,000 musubi in the house, on the stairs, in the bathtub. Uncle cannot find the off switch. The machine just keeps saying \"MEEE. KEE. NEE.\" The neighbors are not complaining."],"Walk stiff like a robot. \"MEE. KEE. NEE.\" Then say it smooth. \"Mee-KEE-nee.\"","Mīkini comes from English machine. Mīkini holoi lole is a washing machine, a machine for washing clothes.",null,"Garage robot machine firing out musubi"],["n171","n",171,"hao","HOW","iron, metal","HAH! ...oh. (HOW)",["At the beach park, a big strongman flexes next to a solid iron bar that weighs 800 pounds. A crowd gathers. He chalks his hands. He squats. He grabs it.","\"HAH!\" He lifts it over his head in one move. The crowd screams. His arms are shaking. His face turns red.","Then the iron starts to bend. Very slowly, it droops on both sides like a cooked noodle, until the ends are touching the sand. He looks up at it. \"...oh.\"","HAH, oh. Said fast it is just HOW.","He sets it down. Now it is shaped like a horseshoe. A little girl walks up and uses it as a bench. The strongman sits next to her and eats a musubi. He says the iron was probably cheap."],"Lift something heavy over your head. \"HAH-oh,\" said fast, \"HOW.\"","Hao sounds a lot like hau (ice, snow, and the hau tree). Hao ends in o, hau ends in u. An ipu hao, literally an iron container, is a cooking pot.",null,"Strongman's iron bar drooping like a noodle"],["n172","n",172,"meaʻai","meh-ah-AI","food","Meh. Ah... AIIII!",["Your nephew is the pickiest eater in the family. At the lūʻau there are 40 feet of food on the table. Kalua pig, poke, chicken long rice, lomi salmon, haupia. He walks down the whole line and looks at every dish.","\"Meh.\" \"Meh.\" \"Meh.\" \"Meh.\"","At the end of the table there is a tiny bowl of little red chili peppers. He thinks they are candy. He pops a whole handful in his mouth.","\"Meh... ah...\" A little catch in his throat. Then \"AIIIIIIIII!\"","Smoke comes out of his ears. He runs back down the line and eats everything to put out the fire. The poke, the rice, the pig, a whole tray of haupia. By the end he is lying on the grass, stuffed, holding his belly, whispering \"Food...\""],"Shrug, then fan your burning mouth. \"Meh-ah,\" catch, \"AI!\"","Mea means thing and ʻai means to eat, so meaʻai is the thing you eat.",null,"Picky kid eating chili peppers at a lūʻau"],["n173","n",173,"ʻaina","AI-nah","meal","EYE? NAH.",["Sunday dinner at Tūtū's house. The whole family is squeezed around the table. The main dish is a giant steamed fish, 3 feet long, with the head still on.","Tūtū reaches over with her chopsticks and pops out the fish eye. It is big and white and wobbly. She says it is the best part and the guest of honor gets it. You are the guest of honor.","She holds it right in front of your face. It stares at you. \"EYE?\"","You freeze. Little catch in your throat. \"...NAH.\"","She waits. The eye waits. The whole table is waiting. The meal cannot go on until somebody eats that eye. Finally Grandpa leans over and slurps it off her chopsticks. \"Mmmm.\" The family cheers, and the meal finally starts."],"Lean back from a pair of chopsticks. \"AI-nah.\" Start with a tiny catch.","ʻAina (meal) is not ʻāina (land), which has a long ā. ʻAina kakahiaka is breakfast, ʻaina awakea is lunch, ʻaina ahiahi is dinner.",null,"Tūtū offering a fish eye on chopsticks"],["n174","n",174,"pāʻina","paah-EE-nah","party with food, small meal","PAH! ...HYENA!",["Your sister's graduation party in the backyard. Thirty people. Folding tables, a tent, pans of chicken wings, mac salad, a cooler of drinks. Nice and small.","Then a hyena shows up. Nobody invited it. It is wearing a plumeria lei. It walks right under the tent and starts laughing that crazy hyena laugh. \"Hee hee hee HEE!\"","It laughs at every joke Uncle tells, even the bad ones, which Uncle loves. It eats all 90 chicken wings. It does the limbo. It dances with Grandma.","When your dad walks in from parking the car, he sees it on the dance floor and makes a disgusted face. \"PAH!\" Then he looks closer. Catch in his throat. \"...HYENA?\"","The hyena waves at him with a chicken wing. By the end of the night it is his best friend."],"Make a disgusted face, then a surprised one. \"Paah,\" catch, \"EE-nah.\"","A pāʻina is a small party with food. The bigger versions are ʻahaʻaina and lūʻau.",null,"Hyena in a lei at a backyard party"],["n175","n",175,"ʻahaʻaina","ah-hah-AI-nah","feast","AHA! Eye? NAH.",["Remember Tūtū and the fish eye from ʻaina? You thought you escaped. Now it is the giant family feast. Eight hundred people. Tables a quarter mile long. Twelve whole pigs from the imu. A fish as big as a canoe.","You hide at the very end of the last table, behind a tower of poi bowls, wearing sunglasses and a hat.","Tūtū walks the whole quarter mile, checking every face. Then she spots you. She points. \"AHA!\" From the pocket of her muʻumuʻu she pulls out chopsticks holding an eye. It is the size of a baseball this time.","\"EYE?\"","You gulp. \"...NAH.\"","The entire feast goes quiet. Eight hundred people are staring. Grandpa, bless him, walks the whole quarter mile to eat it for you."],"Point at someone and shout. \"Ah-HAH,\" catch, \"AI-nah!\"","ʻAha means a gathering, and ʻaina means a meal. A feast is a gathering meal.",null,"Tūtū finding you at the feast with a huge eye"],["n176","n",176,"lūʻau","loo-OW","taro leaves; feast","LOOOO... (catch) OW!",["You are helping cook for the big party, and your job is the taro leaves. Aunty says to cook them for at least an hour. You get impatient after 10 minutes and taste one.","It is dark green and soft and smells great. You chew. You swallow.","Then your throat starts to itch. Not a little. It feels like you swallowed a cactus wearing a wool sweater. You open your mouth to say \"Looks done,\" but all that comes out is \"LOOOOOO...\" Then a catch in your throat. \"OW! OW! OW!\"","You run around the yard scratching your neck with a fork. Aunty does not even look up. She just says \"Told you. One hour.\"","An hour later the leaves are cooked in coconut milk, creamy and perfect, and you eat three bowls. No itch. Just happiness."],"Grab your itchy throat. \"Looo,\" catch, \"OW!\"","The feast called a lūʻau is named after the taro leaf dish served there. Raw taro leaves really do itch, so they must be cooked a long time.",null,"Scratching your throat after raw taro leaves"],["n177","n",177,"poi","POY","poi (pounded taro)","A-POI, matey!",["A pirate ship sails into Honolulu harbor. The captain climbs up on the rail, raises his hook, and instead of \"Ahoy!\" he bellows \"A-POI!\"","He only eats poi. The whole ship smells like it. There are barrels of purple gray poi in the hold, some fresh and sweet, some three days old and sour.","The captain tests it by fingers. One finger poi is thin and drippy, for the cabin boy. Two finger poi is for the crew. Three finger poi is so thick it holds your fingers together when you scoop it. That is for the captain.","Then a cannonball blasts a hole in the side of the ship. Water pours in. The captain does not panic. He scoops a big glob of three finger poi and slaps it on the hole. It seals. \"A-POI!\" The crew cheers."],"Hold up two fingers like you are scooping. \"POY.\"","Poi is made by pounding cooked kalo (taro) and adding water. It is described as one finger, two finger or three finger poi depending on how thick it is.",null,"Pirate patching his ship with three finger poi"],["n178","n",178,"kalo","KAH-lo","taro","CAR, LOW!",["Uncle spent all day pulling kalo from the wet patch in the valley. Big purple corms, each one as heavy as a bowling ball, still muddy, with the green leaves sticking up like elephant ears. He has 900 pounds of it.","He loads it all into his little old two door car. The trunk. The back seat. The front seat. His lap.","The car sinks. And sinks. The tires squash flat. The bottom of the car is 1 inch off the road. When he drives onto the freeway, sparks shoot out from underneath like a fireworks show.","Every car he passes honks and people lean out the windows yelling \"CAR! LOW!\" He waves at everyone. He drives slowly and carefully. Not one taro gets bruised. He gets home and the car sighs and rises back up 6 inches."],"Crouch down low like a sinking car. \"KAH-lo.\"","In Hawaiian tradition kalo is the elder brother of the Hawaiian people, which is why it is treated with so much respect.",null,"Tiny car sparking under 900 pounds of taro"],["n179","n",179,"ʻuala","oo-AH-lah","sweet potato","Oooh... AH... LAH!",["A very fancy chef from Paris comes to a farmers market in Hawaiʻi. He wears a tall white hat and has a mustache that curls up at both ends. He does not believe anything here can impress him.","Then he picks up a sweet potato. Brown and dusty on the outside. He cuts it open with a tiny silver knife.","Inside it is bright purple. Glowing purple, like a sunset. The chef takes a step back. His mustache uncurls. \"Oooooooh...\"","He roasts a slice right there on a camp stove and takes a bite. It is soft and sweet and melts in his mouth. He holds it up to the sky. \"AHHHH... LAAAAH!\"","He buys all 400 pounds of them. He opens a restaurant that only serves purple sweet potato and never goes home."],"Kiss your fingers like a fancy chef. \"Oo-AH-lah!\" Start with a tiny catch.","The purple sweet potatoes so popular in Hawaiʻi are often called Okinawan sweet potatoes.",null,"Fancy chef amazed by a purple sweet potato"],["n180","n",180,"ʻulu","OO-loo","breadfruit","OOH! My LOO!",["At the beach park there is one portable toilet, the loo, parked right under a giant breadfruit tree. The tree is 60 feet tall and loaded with fruit. Each breadfruit is green, bumpy, and as big and heavy as a bowling ball.","Uncle goes in. He shuts the door. The wind blows.","BOOM. A breadfruit drops 60 feet and hits the roof of the loo. The whole thing rocks. From inside you hear \"OOOH!\"","BOOM. BOOM. BOOM. Fourteen breadfruit, one after another, like drums. The roof dents in. The door rattles. \"OOOH! MY LOO! OOOH! MY LOO!\"","When it stops, Uncle opens the door slowly. There is breadfruit piled up to his knees all around the loo. He walks out, picks up the two best ones, and takes them home to roast."],"Duck like something is falling on you. \"OO-loo.\" Tiny catch at the start.","ʻUlu with the ʻokina is breadfruit. Ulu without it means to grow, which breadfruit trees do very well.",null,"Breadfruit bombing a beach portable toilet"],["n181","n",181,"maiʻa","MAI-ah","banana","MY! (hic) AH!",["Tūtū has a banana tree in the backyard, and today the bunch is finally ripe. It is huge. One hundred and forty little yellow bananas all in one bunch, hanging down like a giant chandelier.","Your 2 year old nephew toddles out in his diaper. He sees it. His eyes get huge. He has just learned one word, and it is \"MY.\"","He wraps both arms around the whole bunch, which is bigger than him. \"MY!\" Then he hiccups, that little catch. \"...AH!\"","He drags the whole thing across the yard. It takes him 20 minutes. He will not let anyone help. He gets it into the living room and sits down next to it and eats bananas one by one, saying \"My... ah. My... ah,\" until he falls asleep on the peels."],"Hug an invisible bunch of bananas. \"MAI,\" catch, \"ah!\"","The short sweet apple bananas are a backyard favorite in Hawaiʻi.",null,"Toddler hugging a 140 banana bunch"],["n182","n",182,"niu","NEE-oo","coconut","KNEE! OOOH!",["Your cousin climbs a coconut tree that is 70 feet tall. No rope. No ladder. Just his hands and feet, walking up it like a gecko. At the top he waves.","He starts twisting coconuts off and dropping them. They are big, green and as heavy as bowling balls. You are standing underneath to collect them.","The first one lands right on your knee. BONK.","\"KNEE! OOOOOOH!\"","You hop around the yard holding your knee. He drops another one. BONK. Other knee. \"KNEE! OOOOH!\" Now you are hopping on no legs, somehow.","Finally he climbs down, cracks one open, and hands it to you with a straw. The coconut water is cold and sweet. You sip it with both knees wrapped in ice, and you forgive him. A little."],"Grab your knee and wince. \"NEE-oo!\"","Niu Valley on Oʻahu carries the same word.",null,"Coconut bonking your knee from 70 feet"],["n183","n",183,"mīkana","mee-KAH-nah","papaya","Mee-CAN-ic! (Mechanic, ah!)",["A papaya grows so big in your neighbor's yard that he decides to drive it. It is 12 feet long, orange and green, shaped like a fat little car. He cuts a door in the side, puts a seat inside, sticks four wheels on the bottom and drives it to the store.","Halfway down the street it breaks down. It starts leaking orange juice and making noises.","He calls the mechanic. \"MECHANIC, AH!\" The mechanic comes out, rolls under it, frowns, and opens the hood.","Out pour 10,000 shiny black papaya seeds, like ball bearings, rolling down the whole street. Kids slip on them. A bus slides sideways.","The mechanic shakes his head and says the engine is fine, it is just ripe. He scoops out a piece with a spoon and squeezes lime on it. Best repair he ever did."],"Wipe your hands on a rag like a mechanic. \"Mee-KAH-nah.\"","Papaya with a squeeze of lime is a classic Hawaiʻi breakfast.",null,"Mechanic opening a papaya car full of seeds"],["n184","n",184,"manakō","mah-nah-KOH","mango","Ma? NAH... GOOOO!",["It is mango season. The tree in the backyard is so overloaded that the branches are touching the ground. Mangoes are dropping every ten seconds. THUD. THUD. THUD.","You want to go out and pick them. You ask Ma. She says \"NAH.\" She is scared. Last year a mango knocked out the mailman.","Then a mango crashes right through the kitchen window and lands in her hand. She looks at it. Red and gold, the size of a football, smelling like heaven. She takes one bite. Juice runs down to her elbow.","She grabs a laundry basket and a helmet. She looks at you. You say \"Ma?\" She says \"Nah...\" and then she yells \"GOOOOOOO!\"","You both charge into the yard with baskets, dodging falling mangoes like it is a war, and you come back with 300."],"Put on an invisible helmet and charge. \"Mah-nah-KOOOH!\" Hold the ō.","Manakō came from the English word mango.",null,"Ma charging the mango tree in a helmet"],["n185","n",185,"hala kahiki","HAH-lah kah-HEE-kee","pineapple","HOLLA! CAR KEY!",["You are driving through the pineapple fields in central Oʻahu. You stop to take a picture. You drop your car key.","It bounces once and disappears into the field. Two million pineapples, in rows, all the way to the mountains. Each one has a spiky crown on top. Each one looks exactly like the one next to it.","You start searching. You pick up one pineapple. No key. Another. The spiky leaves scratch your arms. Your legs are cut up. You get more and more desperate and start hollering across the field. \"HOLLA! CAR KEY! CAR KEEEEEY!\"","After three hours, one pineapple starts jingling. You lift it. Your car key is stuck right in its crown, like a little flag.","You buy that pineapple. You also buy 40 more, because you are too tired to explain."],"Cup your hands and holler across a field. \"HAH-lah kah-HEE-kee!\"","Hala is the pandanus tree, whose fruit looks a lot like a pineapple, and kahiki means a foreign land. So pineapple is the foreign hala.",null,"Hunting a car key in a pineapple field"],["n186","n",186,"ʻōhiʻa ʻai","oh-HEE-ah AI","mountain apple","OHIO?... EYE!",["A friendly visitor from Ohio is on a rainforest hike with you. Along the trail there is a tall tree with little red fruit hanging off the trunk, shaped like tiny bells, shiny like they were painted.","You tell him the name. He lights up. \"OHIO? Like me?\"","You hand him one. He bites it. The skin is thin and the inside is white and crunchy and so full of water that the juice squirts sideways 6 feet and hits him right in the eye.","\"OHIO... EYE!\"","He is laughing and crying at the same time. He eats 30 more. He fills his backpack. He says they taste like a pear and a rose had a baby. He tries to take one home to Ohio but eats it at the airport."],"Take a bite and wipe your eye. \"Oh-HEE-ah AI.\" A little catch before each vowel sound that has one.","ʻŌhiʻa ʻai means the ʻōhiʻa you eat. It is different from ʻōhiʻa lehua, the native tree with the red lehua flowers.",null,"Mountain apple squirting juice in a hiker's eye"],["n187","n",187,"iʻa","EE-ah","fish; meat","EE! (slap) AH!",["You are standing knee deep in the water at the beach, minding your own business. A fish jumps out of the ocean. A big one, 3 feet long, silver, very wet, very angry.","It flies through the air and slaps you across the face with its tail.","\"EE!\" SLAP. For a second you just freeze, a catch in your throat, water dripping off your nose. Then \"AH!\"","Another fish jumps. SLAP. \"EE! AH!\" Then another. It is a whole school of fish, taking turns slapping you, like they have been planning this for years.","You run up the beach. The last fish jumps out, lands in your cooler, and the lid snaps shut. You take it home and grill it with rice and shoyu. That fish did not think it through."],"Pat your own cheek. \"EE,\" catch, \"ah.\"","Iʻa can mean fish or meat, the main dish you eat with poi. Do not mix it up with ia, with no catch, which means he, she or it.",null,"Fish slapping you in the face"],["n188","n",188,"puaʻa","poo-AH-ah","pig, pork","POO? ...AH! AH!",["You wake up at 2 in the morning because something smells terrible. Mud, garbage, and old wet dog. You sniff the air. \"Poo?\"","You tiptoe into the kitchen and turn on the light. A wild pig is standing on the counter. It is 300 pounds, hairy, with little tusks, and it has its whole head inside the rice cooker.","You freeze. A catch in your throat. Then \"AH! AH!\"","The pig looks up with rice all over its face and grunts. It knocks over the fridge. It eats a whole pan of mac salad. It drinks from the sink like a dog. Then it walks out the front door, which it opens with its nose.","In the morning, Dad finds its muddy hoof prints on the ceiling. Nobody can explain the ceiling."],"Hold your nose, then jump back. \"Poo,\" catch, \"AH-ah!\"","Kālua puaʻa is kālua pig, roasted in an imu. Do not mix up puaʻa with pua, which means flower.",null,"Wild pig with its head in the rice cooker"],["n189","n",189,"moa","MO-ah","chicken","MORE?! AHHH!",["You land on Kauaʻi for vacation. At the airport parking lot, one chicken walks up to you. A pretty rooster with red and gold feathers. Cute.","Then another. Then 10 more.","They follow you to the rental car. They follow you to the hotel. When you open your hotel room door, there are 40 chickens on the bed. You look at them. \"MORE?!\" A rooster crows right in your ear. \"AHHHH!\"","They are on the beach. They are at the restaurant. One climbs onto your plate lunch and steals your fried chicken, which is a lot to think about.","On the last day you have 400 chickens following you to the airport like a parade. At the gate you turn around and say goodbye. One follows you onto the plane. You still do not know how."],"Flap your elbows like wings. \"MO-ah!\"","Kauaʻi really is famous for its wild chickens. Moa is also the name of a giant extinct bird of New Zealand, the same old Polynesian word.",null,"Hundreds of chickens following you on Kauaʻi"],["n190","n",190,"pipi","PEE-pee","cow, beef","PEEP PEEP!",["Up on a ranch on the Big Island there is a cow that weighs 1,400 pounds. Black and white, huge shoulders, horns as long as your arm. The toughest looking cow on the whole ranch.","But it does not moo. It peeps. Like a baby chick. \"Peep peep. Peep peep.\"","It was raised by a hen when it was a calf, and nobody ever told it. It follows the chickens around. It tries to sit on eggs. It tried to roost in the chicken coop once and the whole coop fell over.","The paniolo ride out to round up the herd. Two hundred cows go \"MOOOO.\" One
