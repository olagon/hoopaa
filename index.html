o politely. \"KOO-moo.\"","Kumu hula means hula teacher. Kumu can also mean the source or base of something, like the trunk of a tree.",null,"Cow teacher at chalkboard with calves"],["n022","n",22,"haumāna","how-MAAH-nah","student","How, MAAA'AM? ...Nah.",["There is one student in the front row whose hand is always up. Always. He raised it on the first day of school and it has not come down since. His arm is now very strong.","The teacher explains fractions. His hand shoots up. \"How, MAAAAAA'AM?\" She explains again. He thinks. \"...Nah.\" She draws a pizza. \"How, MAAAAAA'AM?\" She draws a bigger pizza. \"...Nah.\"","He asks 212 times in one day. Once his hand shoots up so fast it launches him out of his chair and he sticks to the ceiling like a gecko. He asks from up there too.","By June he knows more than anyone in the school. That is a student. Hand up, always asking how. Stretch the middle like he does. \"How... MAAAH... nah.\""],"Shoot your hand up in the air. \"How-MAAAH-nah.\"","A kumu teaches, a haumāna learns. Put the two words together in your head like a teacher and a student in one room.",null,"Student stuck to ceiling with hand raised"],["n023","n",23,"kaikamahine","kai-kah-mah-HEE-neh","girl; daughter","My tyke... a MACHINE, eh!",["Your daughter is 8. She has been locked in the garage for 3 days. You hear banging, drilling, and one small explosion.","On the fourth morning the garage door opens. Out rolls a machine the size of a pickup truck, made from a rice cooker, 600 rubber slippahs, a lawnmower engine, and your good toaster.","It stomps into the kitchen and starts making spam musubi. 50 a minute. Perfectly wrapped.","She sits on top of it like a queen, wearing welding goggles. You fall to your knees. \"My tyke... a MACHINE, EH!\"","The neighbors come over. The news comes over. By noon she has a line down the block and a business license.","That is a girl. That is your daughter. Tyke, a machine, eh. Kaikamahine."],"Point proudly at an invisible machine. \"Kai-kah-mah-HEE-neh.\"","Kaikamahine means girl or daughter. Notice the -hine ending again, like wahine and makuahine. It is a hint the word is female.",null,"Girl riding a giant musubi machine"],["n024","n",24,"keiki kāne","KAY-kee KAAH-neh","boy, son","Cakey... CAAAN, eh?",["Remember the cakey kid from keiki? Now he is a boy of 6, and he has watched his uncles crush soda cans on their foreheads at every party. He wants to be a man. Today is the day.","He still has birthday cake on his face. He picks up a full, unopened can of soda. He stares at it with total confidence. \"Caaaan, eh?\" he asks himself. He decides yes.","BONK. The can does not dent. BONK. Nothing. BONK. The can is fine. The boy has three little frosting prints on his forehead and he is a bit dizzy.","His uncle takes the can and pops it open for him instead. The soda sprays all over his cakey face. He laughs. Half keiki, half kāne. Still cakey, still asking if he can."],"Tap your forehead with an invisible can. \"KAY-kee KAAAH-neh.\"","Keiki (child) plus kāne (male) makes keiki kāne, a boy or a son. Pukui-Elbert writes it as two words. The same pieces you already know.",null,"Cakey boy bonking a can on his forehead"],["n025","n",25,"pēpē","peh-PEH","baby","PAAAY. PAAAY.",["There is a new baby in the family, and every aunty in Hawaiʻi wants to pinch its cheeks. The line goes out the front door, down the driveway and around the block.","The first aunty reaches in. The baby opens its eyes, holds out one tiny hand, palm up, and says \"PEHHH. PEHHH.\" It sounds exactly like \"pay, pay.\" Long and slow, both vowels stretched.","The aunty laughs and puts a dollar in the little hand. The baby lets her pinch. Next aunty. \"PEHHH. PEHHH.\" Another dollar. By dinner the baby has $340 stuffed in its diaper bag and is wearing a tiny money lei.","That is a baby. Chubby, bald, and already running the family business."],"Hold out your palm like a tiny boss. \"Pehhh-PEHHH.\"","Both e's in pēpē are long, so stretch them. Short and quick sounds wrong.",null,"Baby holding out palm for pinch money"],["n026","n",26,"ʻōpio","oh-PEE-oh","youth, young person","Ohhh! P.E., yo!",["Grandpa is 78 and says he is still young. To prove it, he signs up for high school P.E. for one day.","He walks onto the field in knee socks. 30 teenagers are waiting.","The coach blows the whistle and the teenagers explode like popcorn in a pot with no lid. One runs laps backward. One does a backflip off the bleachers. One does 200 push-ups while eating a bag of chips. They all scream the same thing. \"OHHHHH! P.E., YO!\"","That first \"oh\" is long, and it starts with a tiny catch in the throat, the ʻokina.","Grandpa does one jumping jack. His knee makes a noise like a stick breaking. He sits down in the shade with a juice box and watches them run circles until sunset. That is youth. So much energy it bounces off the fence."],"Pump your fist like a teenager. \"Oh-PEE-oh!\"","Think teenager. A kupuna is an elder, and an ʻōpio is a young person with energy to burn.",null,"Teens exploding onto the P.E. field"],["n027","n",27,"ʻelemakule","eh-leh-mah-KOO-leh","old man","Eh, lemme COOL, eh!",["It is 98 degrees at the beach park in Waiʻanae. No wind. The slippahs are melting. Everyone is hiding under the pop-up tent.","Then the old man gets up. He is 94, with white hair, suspenders and a cane made from a guava branch. He walks to the family's giant 120 quart cooler. He takes out every drink, one at a time, and lines them up on the sand. 48 cans in a row.","Then he climbs in. He sits down in the ice, up to his neck, and sighs. \"Eh... lemme COOL, eh.\" He pulls the lid halfway shut like a garage door.","For 3 hours the kids knock on the lid to bring him snacks. He comes out fresh as a head of lettuce, beats everyone at cards, and goes back in. That is an old man. He has earned the cooler."],"Lower yourself slowly into an invisible cooler. \"Eh-leh-mah-KOO-leh.\"","An ʻelemakule is an old man. An old woman is a luahine, the next word.",null,"Old man sitting in a cooler of ice"],["n028","n",28,"luahine","loo-ah-HEE-neh","old woman","Lure, ah! HEE-heh!",["It is 4 in the morning on the rocks at Kaʻena. Thirty young fishermen have been casting all night. They have caught nothing but seaweed and one slippah.","Then an old woman shuffles out. She is 88, with her hair in a bun and a bucket that says DO NOT TOUCH. From her pocket she takes a fishing lure that is older than everyone there. She kisses it. \"LURE, AH!\"","She casts 200 feet. Before the lure even lands, the water explodes. A 90 pound ulua. She fights it with her tiny arms for 20 minutes while the young guys hold their breath.","She drags it onto the rocks and giggles. \"HEE-heh.\" Then she goes home to make breakfast. That is an old woman. Wrinkled, patient, and better than all of you."],"Kiss an invisible lure and cast it far. \"Loo-ah-HEE-neh.\"","Luahine is an old woman, and ʻelemakule is an old man. Say them as a pair.",null,"Old woman landing a giant fish off the rocks"],["n029","n",29,"ʻanakala","ah-nah-KAH-lah","uncle","Ah, NAH! COLLAR!",["Your uncle is on the living room floor, and 11 nephews are piled on top of him. The rule is simple. He has to say \"UNCLE!\" to give up.","\"Say uncle! Say uncle!\" they scream. The pile is 5 kids high. One is sitting on his head. One is chewing on his ankle.","Uncle does not say uncle. He is too proud.","He takes a deep breath and roars \"AH, NAH!\" Then he stands up. All 11 nephews slide off like laundry off a chair. He grabs the two biggest by the backs of their shirts. \"COLLAR!\" He holds them up in the air, one in each hand, feet kicking.","Then he lets them go and asks who wants shave ice. That is an uncle. Ah, nah, collar. ʻAnakala. Start it with a little catch in the throat."],"Lift two invisible kids by their collars. \"Ah-nah-KAH-lah.\"","ʻAnakala comes from the English word uncle, said with Hawaiian sounds. Its partner, ʻanakē, comes from aunty.",null,"Uncle lifting nephews by their collars"],["n030","n",30,"ʻanakē","ah-nah-KEH","aunty","Ah, nah... CAAAKE!",["Every family has this aunty. She comes to every party with a cake. It does not matter what the party is. A funeral. A garage sale. A dog's graduation. She has a cake.","You are already full. She holds up a knife. \"Cake?\" You politely say \"Ah, nah.\" She does not hear the \"nah.\" She only hears the \"cake.\"","\"Ah, nah... CAAAAAKE!\" She cuts you a slice the size of a phone book and slams it on your plate. The table bends.","You say it again. \"Ah, nah.\" Another slice lands on top. Then another. Now you have a tower of cake as tall as a fire hydrant and Aunty is smiling like an angel.","Hold the end long like she does. \"Ah-nah-KEHHH.\" That is your aunty. You will eat that cake."],"Wave off an invisible plate, then accept it. \"Ah-nah-KEHHH.\"","ʻAnakē comes from the English word aunty. Pair it with ʻanakala, uncle.",null,"Aunty stacking cake on a full plate"],["n031","n",31,"kahu","KAH-hoo","caretaker; pastor","Car? WHO?",["The little country church has one man who does everything. He preaches on Sunday. He mows the lawn on Monday. He fixes the roof, feeds the church cat, unclogs the sink and visits every sick person in the valley. He is the caretaker of the whole place and everyone in it.","Today there is a wedding. 300 guests. The bride's car is coming. And somebody has parked a rusty truck right across the gate.","The old man walks out with a rake in one hand and a Bible in the other. He looks at the truck. He looks at the crowd. \"CAR?\" Long pause. \"WHO?\"","Nobody talks. So he puts the truck in neutral and pushes it out of the way himself, all 70 years of him, and still gets back in time to start the song. That is the one who takes care."],"Point at an invisible car and look around. \"KAH-hoo?\"","A kahu can be a pastor, or anyone who is the keeper or caretaker of something, like a special place.",null,"Old pastor pushing a truck from the gate"],["n032","n",32,"kahuna","kah-HOO-nah","priest, expert","Call WHO? Nah...",["Great-grandpa's old koa ʻukulele has a crack down the front. It is the most precious thing in the family. Everyone is at the kitchen table, panicking.","\"Call WHO?\" says your cousin. \"The music store?\" \"Nah.\" \"The guy who fixed the fence?\" \"Nah.\" \"Look it up online?\" \"NAH.\" Call who? Nah. Call who? Nah. This goes on for an hour.","Finally Tūtū speaks. \"Call the master.\" Two days later an old woodworker arrives. He has built 2,000 instruments. He closes his eyes, runs one finger along the crack, and knows the whole story of that wood. He fixes it without a single mark. When he plays it, the room goes quiet.","In old Hawaiʻi, the kahuna were trained experts and priests, the true masters of their craft. Not a joke title. Call who? Call the one who really knows."],"Say it slowly and with respect. \"Kah-HOO-nah.\"","Kahuna kālai waʻa is a canoe carving expert, and kahuna lapaʻau is a healer who uses medicine.",null,"Master craftsman fixing a cracked ʻukulele"],["n033","n",33,"aliʻi","ah-LEE-ee","chief, royalty","Ah, LEE! ʻEE!",["It is May Day at the elementary school. The whole field is covered in lei. 400 parents are in folding chairs, filming on their phones. The teachers have chosen one quiet 7 year old named Lee to lead the royal court.","He wears a lei of yellow flowers and a cape. The announcer calls his name into the microphone. \"Ah... LEE!\" Lee is so nervous he hiccups right into the mic. \"ʻEE!\" That little hiccup is the ʻokina.","Then he stands tall. He walks slow and proud across the field, chin up, like the chiefs his teacher told him about. A little girl drops her lei. He stops, picks it up, and puts it back on her.","Everyone stands. That is what a chief does. Takes care of the people first."],"Stand up straight, chin up. \"Ah-LEE,\" tiny hiccup, \"ee.\"","Aliʻi nui means high chief. The aliʻi were the ruling chiefs of old Hawaiʻi.",null,"Nervous boy leading the May Day court"],["n034","n",34,"mōʻī","moh-EE","king, monarch","Moooow... EE!",["Tūtū has played chess on the lanai every afternoon for 50 years. She teaches you when you are 6. She picks up the tallest piece, the one with the little cross on top, and holds it up to the sun.","\"This is the king,\" she says. Then, every time she moves him, she announces it like a royal horn. \"MOOOOOOW...\" She freezes for a split second. That is the ʻokina. \"...ʻĪĪĪĪ!\"","The neighbor's rooster answers every time. The mail lady starts saying it too. You lose 212 games in a row.","Then one day, at age 12, you trap her king. Checkmate. Tūtū stands up, bows to your king, and says it one more time, softly. \"Mōʻī.\" Hold both vowels long."],"Lift an invisible chess king high. \"Mooooh,\" catch, \"EEEE.\"","Hawaiʻi had its own mōʻī. ʻIolani Palace in Honolulu was home to the last Hawaiian monarchs.",null,"Tūtū raising the chess king to the sun"],["n035","n",35,"mōʻī wahine","moh-EE vah-HEE-neh","queen","Mow-EE... vah-HEE-neigh!",["It is the big floral parade in Waikīkī. Thousands of people line the avenue. The pāʻū riders come first, women on horses, each wearing a long flowing skirt, each horse covered in flowers.","At the very front is the queen of the riders. Her horse is white, draped in 200 lei.","Her skirt is so long it flows down past the stirrups like a waterfall. She sits perfectly still. The crowd goes quiet and someone whispers \"Mōʻī...\" like she is royalty.","Then her horse lifts its head and adds the rest. \"Vah-HEE-NEIGH!\" Loud, proud, perfectly on time.","The whole avenue laughs and cheers. King plus woman. The horse did the second half. Mōʻī, wahine."],"Sit tall and proud like the rider, then whinny. \"Moh-EE vah-HEE-neh.\"","Mōʻī (monarch) plus wahine (woman) makes mōʻī wahine, queen, written as two words. The same wahine from the rodeo.",null,"Horse in 200 lei whinnying at a parade"],["n036","n",36,"kiaʻāina","kee-ah-AAH-ee-nah","governor","Key? AHHH! I... nah.",["It is the new governor's first day. On the steps of the State Capitol, 40 reporters wait with cameras. Someone hands the governor a golden ceremonial key to the state. It is 4 feet long and weighs as much as a small dog.","The governor gives a speech, poses for photos and goes inside. Then stops at the office door. Pats every pocket. \"KEY?\" Freezes with a gasp. \"AHHH!\" Checks behind the potted plant. \"I... nah.\"","For 2 hours the whole staff searches. Under desks. Inside the koi pond. A police dog sniffs the elevators.","Then a little kid on a school tour points. The 4 foot golden key is hanging from the back of the governor's lei the whole time. Key? Ahh! I... nah. That is the governor. Holds up the whole state, cannot find a 4 foot key."],"Pat all your pockets in a panic. \"Kee-ah-AAH-ee-nah.\"","Kia means a pillar or post, and ʻāina means land. The governor is like a pillar holding up the land.",null,"Governor hunting for a giant golden key"],["n037","n",37,"luna","LOO-nah","boss, supervisor; up above","LOONA!",["At the construction site in Kakaʻako, the boss never comes down. He sits in the crane, 200 feet up, in a little glass box. From down there he looks like a peanut.","He runs the whole job with a megaphone. \"MORE CEMENT! LEFT! NO, THE OTHER LEFT!\" His bento goes up in a bucket on a rope. When it rains, he opens an umbrella inside the box.","The workers have a nickname for him. He is so high up he is basically on the moon. So when they need him, they all tip their heads back and howl at the sky like wolves. \"LOOOO-NAAAA!\" Like lunar.","That is the boss. The supervisor. The one way up above. Luna."],"Tip your head back and howl at the sky. \"LOO-nah!\"","Luna also means up or above. I luna means upward, and its opposite is i lalo, downward.",null,"Boss in a crane cab high above workers"],["n038","n",38,"haku","HAH-koo","master, lord, owner","HAH! COO!",["On a rooftop in Kalihi lives an uncle with 400 racing pigeons. He built the coop himself out of old doors. He owns every bird and every bird knows it.","At sunset he steps out in his undershirt and claps once. \"HAH!\" All 400 pigeons blast into the sky at once, like somebody shook a pillow the size of a bus. They circle the whole neighborhood in one giant swirl. The laundry on the lines flaps like flags.","Then he whistles. The whole cloud turns and lands on him. His head. His arms. His shoulders. His belly. He is a man-shaped pile of birds, and all of them say \"COO.\"","\"HAH!\" \"COO.\" \"HAH!\" \"COO.\" He is the master. The owner. The lord of the rooftop."],"Clap once, then coo softly. \"HAH-koo.\"","Haku also means to braid or compose. A haku lei is a braided lei worn on the head, and a haku mele is a composer of songs.",null,"Uncle covered in 400 pigeons"],["n039","n",39,"limahana","lee-mah-HAH-nah","worker, employee","Lee! Ma! HANNAH!",["There is a tiny shave ice shack on the North Shore with a line of 300 people. It has exactly three workers. Lee, a teenager. Ma, who is 70. And Hannah, the same Aunty Hannah who brought the goat to Sunday dinner.","When the owner rings the bell at 10 a.m., she yells roll call. \"LEE! MA! HANNAH!\" All three jump into action. Lee shaves the ice. Ma pours the syrup, three colors, never a drop wasted. Hannah takes the money and talks to every single customer like they are family, which they will be soon.","By 3 p.m. they have made 2,400 shave ice. Their hands are rainbow colored. Their arms are shaking. Lee, Ma, Hannah. Workers."],"Point at three invisible workers fast. \"Lee-mah-HAH-nah.\"","Lima means hand and hana means work. A limahana is a worker, somebody whose hands do the work.",null,"Three workers slamming out rainbow shave ice"],["n040","n",40,"kauka","KOW-kah","doctor","KOW-kah! KOW-kah!",["At the little clinic in the country town, the waiting room is full. An aunty with a sore wrist. A boy with a bean in his ear. And a cow. A whole brown cow, sitting in a plastic chair, holding number 14.","The cow has a cold. Every few seconds it coughs, and a cow cough sounds just like this. \"KOW-KAH! KOW-KAH!\" The magazines fly off the table. The fish tank sloshes.","The doctor comes out in a white coat. She takes one look, puts a stethoscope the size of a garden hose on the cow's chest, and hands it a cough drop as big as a hockey puck. The cow stops coughing and moos politely.","Then she calls \"Number 15\" and fixes your sprained ankle too. That is the doctor. She takes whoever walks in."],"Cough like a cow into your elbow. \"KOW-kah.\"","Kauka comes from the English word doctor, said with Hawaiian sounds. D and t both become k.",null,"Cow coughing in a doctor's waiting room"],["n041","n",41,"loio","lo-EE-oh","lawyer","Lo-EE-OHHH!",["It is a big court case. A farmer is suing his neighbor over a runaway pig. The courtroom is packed. The judge looks tired already.","The farmer's lawyer stands up in a shiny suit and a tie with little pigs on it. The other side says something wrong. The lawyer jumps up, throws back his head and yodels. \"LO-EE-OHHHHH!\" Like a mountain goat herder. The windows buzz. The court reporter drops her pen.","The other side says something else wrong. \"LO-EE-OHHHH!\" He yodels every objection. He yodels his whole closing argument. The jury starts swaying.","He wins. The pig is returned. The judge secretly yodels in the parking lot on the way home. That is a lawyer. Always objecting, and very, very loud."],"Stand up fast and yodel an objection. \"Lo-EE-oh!\"","Loio comes from the English word lawyer, reshaped with Hawaiian sounds.",null,"Lawyer yodeling in a courtroom"],["n042","n",42,"mākaʻi","maah-KAH-ee","police officer","MAAA! CAR! EE!",["Your mother parks at the top of a steep hill in Mānoa and forgets the parking brake. The car starts rolling. Nobody is in it. It picks up speed straight down toward a bakery.","You scream \"MAAAAA! CAR!\" and then you gulp so hard it catches in your throat. \"EE!\"","Out of nowhere comes a police officer on a tiny bicycle. Full uniform, shiny badge, sunglasses. He pedals so fast his legs are a blur. He catches the car, jumps off the bike onto the hood, climbs in through the window, and pulls the brake 3 inches from the bakery door.","The baker hands him a malasada. He writes your mother a ticket and hands her a malasada too. That is a police officer. Maaa, car, ee."],"Hold out a hand like a traffic stop. \"Maah-KAH-ee.\"","Do not mix it up with mākaʻikaʻi, which means to go sightseeing or visit around.",null,"Cop on a bicycle chasing a runaway car"],["n043","n",43,"koa","KO-ah","soldier, warrior; koa tree","KO-AH!",["In a little ʻukulele shop in Kaimukī, the most expensive ʻukulele sits on the top shelf. It is made of koa wood, golden with dark stripes, like a tiger that plays music.","One night a thief sneaks in through the back. He reaches for the cash drawer. The koa ʻukulele jumps off the shelf. It lands in a fighting stance. It strums one loud chord like a war cry. \"KO-AH!\"","The thief freezes. The ʻukulele leaps and bonks him on the head with its neck. \"KO-AH!\" Bonk. \"KO-AH!\" Bonk. The thief runs out the door and all the way to Kapahulu.","In the morning the owner finds the shop safe and the ʻukulele back on its shelf, perfectly in tune. Made from the koa tree. Brave as a warrior."],"Take a fighting stance and strum hard. \"KO-ah!\"","Koa wood is famous for ʻukulele and canoes. The same word means warrior and brave. Do not mix it up with kua, back.",null,"Koa ʻukulele fighting off a thief"],["n044","n",44,"kāpena","kaah-PEH-nah","captain","CAAAAH! PEN-ah!",["The captain of the fishing boat has a white beard, a salty hat, and a big green parrot on his shoulder. The captain is in charge of everything. The boat, the crew, the course, the fish.","But he always loses his pen. He needs it to write in the ship's log. So the parrot helps. Every morning it screams \"CAAAAAAAH! PEN-AH!\" with a long, long first sound, until somebody finds a pen.","Today the pen falls into the ocean. The parrot dives in after it, swims under the boat, and comes back up with the pen in its beak and a small octopus on its head.","The captain writes, \"Day 44. Parrot better than crew.\" The crew agrees. Hold that long first sound. That is the captain."],"Squawk like a parrot on your shoulder. \"Kaaah-PEH-nah!\"","Kāpena comes from the English word captain.",null,"Parrot fetching the captain's pen from the sea"],["n045","n",45,"kelamoku","keh-lah-MO-koo","sailor","Hey, lah! MO-CO!",["A sailor comes home after 9 months at sea. His beard is crusty with salt. His arms have anchor tattoos. He has not stood on dry land since last year.","He walks off the ship and his legs still think they are on the ocean. He sways left. He sways right. He walks sideways down the pier like a crab, bumping into poles.","He wobbles all the way into a diner and slams his hand on the counter. \"Hey, lah! MOCO!\" One loco moco. Then another. Then 14 more. Rice, hamburger, egg, gravy. Stacked like a tower.","He eats all 14 without sitting down, because the stool keeps rocking like a boat. That is a sailor. Hey, lah, moco. Kelamoku."],"Sway side to side like you are on a deck. \"Keh-lah-MO-koo.\"","Kela sounds like sailor, and moku means ship (it also means island). A kelamoku is a ship's sailor.",null,"Wobbly sailor ordering 14 loco mocos"],["n046","n",46,"pailaka","pai-LAH-kah","pilot","Pie! Lock-ah!",["You are on a small plane from Honolulu to Kona. The pilot comes on the speaker. \"Good morning, this is your pilot. I have 30 coconut pies up here with me. Nobody touch my pies.\"","Then you hear a click. \"PIE... LOCK... AH!\" She has locked the pies in a special cabinet.","Halfway there, the plane hits a bump. The pie lock breaks. The cockpit door flies open. 30 coconut pies float down the aisle like flying saucers.","The pilot does not panic. She tips the plane left, then right, then does a gentle loop. Every pie lands back in its box. She locks them up again. \"PIE, LOCK, AH!\"","The plane lands softly. Everyone claps. She gives each passenger one slice. That is a pilot. Flies the plane, saves the pies."],"Hold an invisible steering yoke and click a lock. \"Pai-LAH-kah.\"","Pailaka comes from the English word pilot.",null,"Coconut pies flying through a plane cabin"],["n047","n",47,"kuene","koo-EH-neh","waiter","Queue, eh? NAY!",["The new restaurant in town is so popular that the line of people, the queue, goes out the door, around the block, and back again. 400 people, standing in the sun, hungry and grumpy.","Then the waiter comes out. He is on roller skates. He looks at the long line. \"Queue, eh?\" he says. Then he shakes his head. \"NAY!\"","He will not let anybody wait. He skates up and down the whole line with plates stacked up both arms, all the way to his shoulders.","Saimin for the grandma. Fried rice for the surfers. Pancakes for the baby. He pours coffee while skating backward. He takes orders by pointing.","In one hour he serves all 400 people without anyone sitting down. That is a waiter. Queue, eh? Nay."],"Balance invisible plates up your arm. \"Koo-EH-neh.\"",null,null,"Waiter on skates serving a long line"],["n048","n",48,"pelekikena","peh-leh-kee-KEH-nah","president","Pelly Key KENNA!",["The school is voting for student council president. One of the candidates is a pelican. A big white one with a bow tie. His name, it says right on the poster, is Pelly Key Kenna.","He gives a speech by flapping. He promises longer recess and free fish on Fridays. The kids go crazy. They chant his full name. \"PELLY! KEY! KENNA!\"","On voting day, he carries the ballot box around in his giant beak pouch so nobody can cheat. 400 votes in there. When they count, he wins all 400.","He is sworn in on the lunch table, one wing raised. His first act is to eat the principal's sandwich. That is a president. Pelly Key Kenna. Say it fast and it becomes pelekikena."],"Raise one hand like you are being sworn in. \"Peh-leh-kee-KEH-nah.\"","Pelekikena comes from the English word president. Hawaiian turns r into l, and s, d and t into k. That is how president becomes pelekikena.",null,"Pelican in a bow tie winning election"],["n049","n",49,"malihini","mah-lee-HEE-nee","visitor, newcomer","Molly! HEE! NEE!",["Molly just landed from Minnesota, where it snowed yesterday. It is her first hour in Hawaiʻi and she runs straight to the beach, kicks off her shoes, and steps onto the sand.","It is noon. The sand is 140 degrees. Her feet start to cook. She hops. \"HEE!\" She hops on the other foot. \"NEE!\" Her friends scream \"MOLLY!\" as she hops in a zigzag all the way to the water, 50 yards, \"HEE! NEE! HEE! NEE!\"","She jumps in the ocean and her feet sizzle like bacon. A turtle swims away from the steam. Then she gets out and does it all again, because she forgot her towel.","That is a visitor. A newcomer. Fresh off the plane, and hopping. Molly, hee, nee."],"Hop from foot to foot on hot sand. \"Mah-lee-HEE-nee.\"","The opposite of malihini is kamaʻāina, somebody from here. That is the next word.",null,"Visitor hopping on burning hot sand"],["n050","n",50,"kamaʻāina","kah-mah-AAH-ee-nah","local person, native-born","Calm, ma'am. AAAH. I? Nah.",["Molly the visitor is still hopping on the hot sand. \"HEE! NEE!\" Then she sees an aunty strolling toward her across the same sand. Barefoot. Slow. Holding a hot coffee.","The aunty has walked this beach every day for 60 years. Her feet are like old leather. She does not hop. She does not sweat. She stops right next to Molly and says, \"Calm, ma'am.\"","Then she digs her toes into the burning sand and sighs happily. \"AAAAAH.\" Molly stares. \"Don't you need slippahs?\" The aunty sips her coffee. \"I? Nah.\"","She shows Molly the shady path, the good shave ice place, and the rock where the turtles nap. That is a local. Calm, ma'am. Ah. I? Nah."],"Dig your toes in slowly and sigh. \"Kah-mah-AAH-ee-nah.\"","Kama means child and ʻāina means land. A kamaʻāina is a child of the land. Many businesses in Hawaiʻi give a kamaʻāina discount to residents.",null,"Barefoot local strolling across hot sand"],["n051","n",51,"haole","HOW-leh","foreigner, white person","HOWL, eh.",["Your new coworker just moved here from Alaska. He brought his sled dog, a huge fluffy husky. Neither of them has ever felt 88 degrees with no wind.","The first afternoon, they sit on the curb outside the office, both panting. The husky tips its head back and howls at the sun. \"HOOOWL!\" Your coworker, sweating like a glass of iced tea, tips his head back too. \"Howl, eh,\" he agrees.","Aunty from the corner store walks over with two shave ice, one for him and one for the dog. She shows them the shady side of the street and where the trade winds come through. By summer the husky sleeps on cold tile and your coworker says \"shoots\" like he was born here.","Long ago haole just meant someone or something from outside. From somewhere else. Howl, eh."],"Tip your head back and howl softly. \"HOW-leh.\"","Long ago haole meant any foreigner or foreign thing. Today it often means a white person. It also shows up in plant names like koa haole, an introduced shrub whose name means foreign koa.",null,"Coworker and husky howling in the heat"],["n052","n",52,"ʻōiwi","oh-EE-vee","native, indigenous","Oh... ivy? ʻŌiwi.",["The 3rd grade class is weeding the school garden with a volunteer uncle who is 75 and has dirt permanently under his nails. A girl finds a vine climbing the fence. It is 15 feet long. \"OHHH, IVY!\" she yells.","It takes 20 kids to pull it. They tug like it is a rope in a tug of war. It snaps and all 20 land on their ʻōkole in the mud.","The uncle laughs and holds up a small plant with little yellow flowers. \"Not ivy. This one is ʻōiwi.\" He says it slow. A little catch in the throat, a long \"ohhh,\" then \"EE-vee.\"","He explains. The ivy came from far away. This ʻilima was here long before any of us. It belongs. Its roots go deep, like bones in the land. The kids plant it in the best spot."],"Hold a small plant with care. \"Oh-EE-vee.\"","ʻŌiwi contains iwi, bone. Native to the bone. Kanaka ʻŌiwi means Native Hawaiian people.",null,"Kids planting a native flower"],["n053","n",53,"lāhui","laah-HOO-ee","nation, people, race","LAAAAAH... HOO-ee!",["It is a free concert at the park. 30,000 people are on the grass. Tūtū in folding chairs. Babies on shoulders. Surfers, nurses, farmers, kids from every island, all packed in with coolers and mats.","The singer starts the last song. She hits the big note and holds it. \"LAAAAAAAAH...\" She holds it for 20 seconds. Then 30,000 people join her on the same note. The ground hums. A bird in a tree stops to listen.","When the note ends, the whole crowd shouts together. \"HOO-ee!\" So loud the ocean feels it.","Look around. Every face is different and every voice is the same song. That is a people. A nation. Stretch that first sound long. \"Laaaah... HOO-ee.\""],"Sing one long note, then cheer. \"Laaah-HOO-ee!\"","Lāhui Hawaiʻi means the Hawaiian nation, the Hawaiian people as a whole.",null,"Huge crowd singing one long note"],["n054","n",54,"poʻe","PO-eh","people, a group","Pole? EH!",["It is rush hour on the city bus. There is one metal pole in the middle. And there are 64 people holding it.","They are stacked like spam musubi. A nurse. A guy with a surfboard. Two grandmas with shopping carts. A kid holding a fish in a bag. Hands on hands on hands, all the way from the floor to the ceiling.","A new guy climbs on and looks for something to hold. \"Pole?\" he asks. Then the bus brakes hard. Everyone lurches forward at once and catches with a gulp. \"EH!\" That gulp is the ʻokina.","All 64 swing back together like a school of fish. Not one lets go. That is a group of people. Pole, eh. Poʻe."],"Grab an invisible bus pole and lurch. \"PO,\" gulp, \"eh.\"","Ka poʻe means the people. Put poʻe in front of a word to talk about a group, like the fishing people or the singing people.",null,"64 people clinging to one bus pole"],["n055","n",55,"kino","KEE-no","body","Key? NO!",["You are locked out of your car at the beach. The sun is going down. The keys are somewhere on your body. Probably.","You start at the top. You pat your head. \"Key?\" Nothing. \"NO!\" Your ears. \"Key? NO!\" Your shirt pocket, your armpits, your belly button. \"Key? NO! Key? NO!\"","You check your shorts, all 6 pockets. Your socks. Inside your slippahs. You bend over and shake your whole body like a wet dog. Sand flies everywhere. A family nearby covers their plate lunch.","Finally you do a handstand. CLINK. The key falls out of your hair. Every part of you got checked. Head, arms, chest, legs, feet. That is your body. Key? No. Kino."],"Pat yourself from head to toe. \"KEE-no.\"",null,null,"Person doing a handstand to find keys"],["n056","n",56,"poʻo","PO-oh","head","POW... OH!",["You are lying on the beach under a coconut tree, 60 feet tall. Everybody knows not to do this. You do it anyway. You close your eyes.","Way up at the top, a coconut the size of a bowling ball lets go. It falls for 2 full seconds. Then it lands right on the top of your head. POW!","Everything freezes. Birds stop. Waves stop. Your eyes cross. There is a tiny pause, a catch, and then it hits you. \"...OHHHH.\"","A bump grows on your head as big as a musubi. Tūtū comes over, puts a frozen bag of peas on it, and sits you somewhere else. POW, freeze, OH. Head."],"Tap the top of your head, freeze, then groan. \"PO,\" catch, \"oh.\"","Poʻo also means the top or the leader, the head of anything, like the head of a group.",null,"Coconut bonking a head at the beach"],["n057","n",57,"lauoho","lau-OH-ho","hair (on the head)","Turn it LOW! OH-HO!",["Aunty has not cut her hair since 1987. It is 30 feet long. She keeps it wrapped around her body like a shiny black bath towel. She sweeps the floor with it by walking backward.","One hot day, she unwraps it to cool off. The ceiling fan is on high. The tips of her hair float up. The fan grabs them.","It starts winding her hair like fishing line on a reel. Aunty rises up off the couch.","\"TURN IT LOW!\" she screams. Her feet leave the ground. \"OH-HO!\" Now she is spinning under the fan like a tetherball. The cousins are laughing too hard to help.","Finally Uncle unplugs it. Aunty drops back onto the couch, hair perfectly braided by the fan. She says it is the best it has ever looked."],"Run your fingers through your hair. \"Lau-OH-ho.\"","Lauoho is the hair on your head. Hair on the body, or fur and feathers, is hulu.",null,"Aunty spinning by her hair under a fan"],["n058","n",58,"maka","MAH-kah","eye; face","MAH-KAW!",["At the zoo there is a big red macaw with a yellow face. It hops down to the fence, puts its face one inch from yours, and stares. Its eye is the size of a quarter. Round and shiny with a little black dot in the middle.","You stare back. A staring contest. Five minutes. Ten minutes. A crowd gathers. Your eyes are drying out like raisins. The macaw does not blink. It does not even breathe.","At minute 40, you blink. The macaw leans back, flaps both wings and screams in your face, \"MAH-KAW!\"","You go home and every time you close your eyes you see that face and that eye. Eye. Face. Macaw. Maka."],"Point at your own eye, then your face. \"MAH-kah.\"","Maka also means raw, so iʻa maka is raw fish. And maka is inside kuʻemaka, eyebrow.",null,"Staring contest with a macaw"],["n059","n",59,"ihu","EE-hoo","nose","AH... EE... HOO!",["You walk into the lei stand at the airport. There are 800 lei hanging from the ceiling. Plumeria, pīkake, tuberose, ginger. The smell is like being punched by a garden.","Your nose starts to twitch. It gets bigger. It turns red. The pollen crawls up inside it and starts a party. You try to hold it in. You cannot. \"AH... EEEE... HOO!\"","The sneeze blows every lei off every hook. They fly across the room like frisbees and land on the heads of 40 surprised tourists getting off a plane. The lady who runs the stand just shrugs and charges them.","Your nose is fine. It is proud of itself. Ee-hoo. That is your nose."],"Wrinkle your nose, then sneeze. \"EE-hoo!\"","The old Hawaiian greeting called honi touches nose to nose and shares breath. Ihu to ihu.",null,"Giant sneeze blowing lei across the room"],["n060","n",60,"waha","VAH-hah","mouth","WAH-HAH!",["Uncle has the biggest mouth on the island. Not because he talks too much. Well, also that. But mostly because it is physically huge.","He can fit a whole spam musubi in there sideways. Three at once, if nobody is watching. At the lūʻau, he eats a scoop of rice without chewing, like a hippo.","But the best part is his laugh. When somebody tells a joke, his mouth opens so wide you can see his lunch, his dinner, and what he had last Tuesday. \"WAH-HAH! WAH-HAH!\" The sound echoes off the mountains. The dog hides.","One time a moth flew in, looked around, and flew back out. Too big in there. That is a mouth. Wah-hah. Waha."],"Open your mouth wide and laugh. \"VAH-hah!\"","In Hawaiʻi slang, someone with a big waha talks too much. \"Eh, no be big waha.\"",null,"Uncle laughing with a giant open mouth"],["n061","n",61,"niho","NEE-ho","tooth","KNEE... HO!",["Your little cousin has a loose front tooth. It has been hanging there for 3 weeks, wiggling like a door on one hinge. Nobody can get it out.","So Uncle ties one end of a string to the tooth. He ties the other end to his own knee. He stands in the yard like a football kicker. He counts. \"One... two...\"","On three he swings his leg and shouts \"KNEE... HO!\" The tooth rockets out, sails over the carport, over the mango tree, and lands on the neighbor's roof 40 feet away. PING.","The neighbor climbs up with a ladder, finds it in the gutter, and brings it back in a little plastic bag. Your cousin grins, one tooth short. Knee, ho. Niho. Tooth."],"Kick one leg out fast. \"NEE-ho!\"","Niho manō means shark tooth. Old Hawaiian tools and weapons used rows of them.",null,"Uncle kicking a tooth out on a string"],["n062","n",62,"alelo","ah-LEH-lo","tongue","Ahh... (h)ELLO!",["You are at the doctor. She holds a wooden stick and says \"Open wide and say AHH.\"","You open wide. \"AHHHH.\" And your tongue keeps going. It slides out of your mouth like a pink carpet unrolling. One foot. Two feet. Three. It flops onto the doctor's desk, lifts its tip like a little head, and waves at her.","Then it talks. \"...LLO!\" So you said \"Ah,\" and your tongue said \"hello.\" Ah, hello. Alelo.","The doctor does not even blink. She shakes the tip of your tongue like a hand and writes something on her clipboard. The kid in the waiting room faints."],"Stick out your tongue, then pull it back in. \"Ah-LEH-lo.\"","Alelo can also mean a language, the same way English says tongue. The everyday word for language is ʻōlelo, as in ʻōlelo Hawaiʻi.",null,"Tongue flopping out to wave hello"],["n063","n",63,"pepeiao","peh-pay-OW","ear","PAY! PAY! OW!",["Grandpa is 80 and has decided he wants his ears pierced. The whole family comes to the mall to watch. He sits in the tall chair at the kiosk like it is a throne.","The girl with the piercing gun tells him the price. He pays. She does the left ear. CLICK. \"OW!\" She says the right ear costs extra. He grumbles and pays again. CLICK. \"OW!\"","Pay, pay, OW. That is how he tells the story for the rest of his life. \"Pay! Pay! OW!\"","He walks out with two tiny gold studs, both ears glowing red like stoplights, grinning at his reflection in every store window. That is an ear."],"Tug on your ear, then wince. \"Peh-pay-OW!\"","Local bakeries and manapua shops sell pepeiao, a folded bun named for its ear shape.",null,"Grandpa getting his ears pierced"],["n064","n",64,"papālina","pah-paah-LEE-nah","cheek","Pa-PAAAH... Lina!",["Your grandpa is blowing up a pool float for his granddaughter, Lina. It is a unicorn. It is 12 feet long. He does not own a pump.","He takes a giant breath and blows. His cheeks puff out like two watermelons. They turn red. Then purple. Then a color that does not have a name. Every time he stops to breathe, his lips pop. \"Pa... PAAAAAH...\" And then he gasps her name. \"...Lina.\"","It takes 45 minutes. At the end his cheeks are so stretched that they stay puffed for the rest of the day. He looks like a squirrel storing nuts. When he smiles, they bounce.","Lina rides the unicorn all afternoon. Grandpa sits in the shade and pats his tired cheeks."],"Puff both cheeks, then pop them. \"Pah-PAAAH-lee-nah.\"",null,null,"Grandpa with huge puffed cheeks inflating a float"],["n065","n",65,"lehelehe","leh-heh-LEH-heh","lips","Lay-hey, LAY-hey!",["You are skydiving over the North Shore. You jump out of the plane at 13,000 feet. You are falling at 120 miles an hour, and the wind hits your face like a fire hose.","Your lips have never been through this. The wind grabs them and flaps them like two flags in a hurricane. They make a sound all on their own. \"LAY-HEY-LAY-HEY-LAY-HEY!\" The top lip goes up to your nose. The bottom lip slaps your chin.","People on the beach look up and wonder what that noise is.","When you land, your lips are still flapping on their own for 10 minutes. You cannot eat your plate lunch. The rice keeps flying off. That is lips."],"Blow air through loose lips like a horse. \"Leh-heh-LEH-heh.\"","Lehelehe is a doubled word, like lihilihi (eyelashes) and manamana (fingers). Lots of body words double up.",null,"Skydiver with lips flapping in the wind"],["n066","n",66,"ʻāʻī","aah-EE","neck","AAAAH... EEEE!",["The giraffe at the zoo slept wrong. Its whole neck is stuck, bent sideways, 7 feet of stiff neck. It cannot reach its leaves. It walks around looking at the world tilted.","So the zoo calls in a tūtū who does massage. She is 4 foot 10. She climbs up a ladder, then another ladder on top of that ladder, and gets to work. She pushes her thumbs into the giraffe's neck.","Every time she presses, the giraffe groans, long and deep, then squeaks at the end. \"AAAAAAAH...\" little catch... \"EEEEEE!\" She works her way from the top to the bottom. Crack. Crack. Crack.","When she is done, the giraffe stands up straight, happy, and eats every leaf in the zoo. Neck. Long sounds, both of them."],"Roll your head slowly, then wince. \"Aaah,\" catch, \"EEE.\"",null,null,"Tiny tutu massaging a giraffe's stiff neck"],["n067","n",67,"poʻohiwi","po-oh-HEE-vee","shoulder","Po! Oh... HEAVY!",["It is New Year's Eve and the fireworks are about to start. Your nephew Po is 5 and cannot see. So you put him up on your shoulders.","He weighs 40 pounds. No problem. Then Aunty hands him a malasada. Then another. Then a bag of popcorn, a musubi and a whole plate of fried noodles. He eats everything up there like a king on a throne.","Every time he takes a bite, your shoulders sink a little lower. \"Po!\" you say. \"Oh... HEAVY!\" By midnight your shoulders are down by your hips. Your knees are shaking. Po is asleep up there with sugar on his face.","Po, oh, heavy. Say it fast and that is where the kids ride. Shoulders."],"Lift an invisible kid onto your shoulders and groan. \"Po-oh-HEE-vee.\"","Poʻohiwi starts with poʻo, head. Your shoulders sit right under it.",null,"Kid eating snacks on sinking shoulders"],["n068","n",68,"lima","LEE-mah","arm, hand; five","LIMA!",["Tūtū makes lima beans for dinner. You hate lima beans. You have hated them since you were born.","So you get sneaky. You hide one bean between each finger. Thumb, pointer, middle, ring, pinky. Five fingers on one hand, five lima beans, squeezed tight. You keep your hand under the table, very calm, very innocent.","Then Grandpa says, \"Good job cleaning your plate! Up high!\" He raises his hand for a high five. You cannot say no to Grandpa. You slap his hand. SPLAT.","Five lima beans explode across the kitchen. One sticks to the ceiling. One lands in the rice cooker.","Tūtū stares at you. \"LIMA,\" she says. Hand. Five fingers. Five beans. Lima."],"Hold up your hand and spread all five fingers. \"LEE-mah.\"","Lima means hand or arm, and also the number five, because a hand has five fingers.",null,"Lima beans exploding from a high five"],["n069","n",69,"manamana","mah-nah-MAH-nah","finger, toe","Man-a-MAN-a!",["Your little cousin is learning to count. She gets to 10 on her fingers. But her homework says count to 100. So she takes off her slippahs and puts both feet on the dinner table. Now she has 20.","Not enough. She makes her brother put his feet up too. Then her mom. Then Uncle, whose toes look like 10 little sweet potatoes. Soon 5 people have their hands and feet on the table. 100 fingers and toes, all wiggling.","Tūtū walks in carrying a pot of stew. She stops. She looks at all those toes next to the rice. \"MAN-A-MAN-AH!\"","Everyone freezes with their feet in the air. Man oh man, ah. Fingers and toes, all over the table."],"Wiggle all your fingers in front of your face. \"Mah-nah-MAH-nah.\"","Manamana lima is a finger and manamana wāwae is a toe. Lima is hand, wāwae is foot.",null,"Whole family with feet on the dinner table"],["n070","n",70,"maiʻuʻu","mai-OO-oo","fingernail, claw","My! ʻOO! ʻOO!",["Aunty just came back from the nail salon. Her nails are 3 inches long, gold, with little rhinestones and a tiny palm tree on each one. They click when she walks.","She comes to the school fundraiser to help. Somebody asks her to write the prices on the old chalkboard. She lifts one hand, sets her nails on the board and drags them down, slow.","SKREEEEEEEEE. Every kid in the room grabs their ears. \"MY!\" Their bodies shake. \"ʻOO! ʻOO!\" Each \"oo\" starts with a little gulp, a catch in the throat. The class cat hisses and shows its own claws.","Aunty looks at the cat. The cat looks at Aunty. They respect each other. Fingernails. Claws. My, ʻoo, ʻoo."],"Scratch the air with curled fingers, then cringe. \"Mai-OO-oo.\"",null,null,"Aunty's long nails on a chalkboard"],["n071","n",71,"umauma","oo-mah-OO-mah","chest","Ooh, MA! OOH, MA!",["Your cousin has been lifting weights every day for 2 years. Today he walks out onto the beach and takes a deep breath. His chest puffs out like two slabs of kālua pig.","He wants his mother to see. \"Ooh, MA!\" he calls. Puff. \"OOH, MA!\" Puff, puff. His chest keeps getting bigger. He thumps it with both fists. BOOM, BOOM, like a drum.","His shirt buttons cannot take it. They pop off one at a time like bullets. PING. One hits a seagull. PING. One lands in a lady's shave ice. PING. One goes so far it may still be flying.","His mother looks up from her magazine for one second. \"Very nice, dear,\" she says. Chest."],"Puff your chest and thump it. \"Oo-mah-OO-mah!\"",null,null,"Buff cousin popping his shirt buttons"],["n072","n",72,"ʻōpū","oh-POO","stomach, belly","Ohhh... POOH.",["Uncle at the lūʻau. Plate number one, kālua pig and rice. Plate two, lomi salmon and poi. Plates three through seven, everything else. His belly grows with each plate like a beach ball being pumped up.","By plate seven it is so round the kids use it as a table for their cards. When he laughs, the cards bounce. His belt has given up and gone home.","Then Aunty walks by with a tray of haupia, cold, sweet, perfect. His favorite. He looks at the haupia. He looks down at his giant stomach. He sighs, long and sad. \"Ohhhhh... POOOOH.\" Like when you miss the bus.","That is a belly. It has limits. Hold both long sounds, the long o and the long u."],"Pat your stomach and sigh. \"Ohhh-POOOO.\"","People in Hawaiʻi use opu in everyday English, like \"my opu is full.\"",null,"Uncle too full to eat the haupia"],["n073","n",73,"piko","PEE-ko","belly button; summit","PEEK-O!",["Your little nephew is 3 and has one trick. He lifts up his shirt, shows you his belly button, and yells \"PEEK-O!\" Like peekaboo, but for belly buttons. He does it to everyone. The mailman. The pastor. A dog.","One morning the whole family hikes to the top of the mountain for the sunrise. It takes 2 hours in the dark. He rides most of it on your back.","At the very top, the summit, the sun pops up over the clouds. Everyone goes quiet. And your nephew stands on the highest rock, lifts his shirt at the sun, and shouts \"PEEK-O!\"","The sun, as far as anyone can tell, laughs. Belly button. Summit. Both of them are a piko."],"Lift the bottom of your shirt an inch. \"PEE-ko!\"","Piko also means the center of something, the summit of a mountain, or the top of the head.",null,"Toddler flashing his belly button at sunrise"],["n074","n",74,"kua","KOO-ah","back","KOO-AH!",["A koala escapes from a visiting zoo show and climbs straight onto your back. It wraps its arms around your neck and its legs around your waist. It will not let go. It makes a little sound in your ear. \"KOO-AH.\"","You go to work with a koala on your back. You go to the bank. You go to the dentist. You lie on your stomach at the beach so it can nap. It eats a lei off a lady walking by.","Every time you try to peel it off, it squeezes tighter and says \"KOO-AH!\" louder, right in your ear.","After 3 days you just give up and name it. You sleep on your stomach now. That is your back. Koo-ah. Kua."],"Reach over your shoulder and pat your back. \"KOO-ah.\"","Kua (KOO-ah) is back. Koa (KO-ah) is warrior or the koa tree. One little vowel.",null,"Koala clinging to someone's back"],["n075","n",75,"kuli","KOO-lee","knee","COOL! EEEEE!",["You slide into second base at the family softball game. Bad idea. You are wearing shorts. Your knee drags through the dirt for 6 feet. It looks like a hamburger patty.","Aunty runs out from the bleachers carrying the whole 50 quart cooler. She does not bother with a bag of ice. She dumps the entire cooler right on your knee. Ice, cans, two pieces of fried chicken, everything.","First you feel the cold. \"COOOOL!\" Then the sting. \"EEEEEEEE!\" Your voice gets higher and higher until only the dogs can hear it.","Your knee is now the coldest knee in history. It has a can of soda sitting on it like a trophy. Cool, eee. Knee."],"Hold your knee and wince. \"KOO-lee.\"","Kuli can also mean deaf. Context tells you which one.",null,"Aunty dumping a cooler on a scraped knee"],["n076","n",76,"wāwae","vaah-VAI","leg, foot","WAAAAH! WHY?!",["It is 3 in the morning. You get up for a glass of water. You walk barefoot into the dark living room. You do not know that your nephew left 2,000 plastic building blocks on the floor.","Your right foot comes down on the first one. The pain shoots up your whole leg like lightning. \"WAAAAAAAAH!\" You hop onto your left foot. It lands on three more. \"WHY?!\"","Now you are hopping through the dark, foot to foot, leg to leg. \"WAAAAH! WHY?! WAAAAH! WHY?!\" The neighbor's lights come on. A dog two streets away starts barking. The cat leaves home.","You finally reach the kitchen, drink your water, and realize you have to go back the same way. Leg. Foot. Waaah, why."],"Lift one foot and hop in pain. \"Vaaah-VAI!\"","Wāwae means the whole leg and foot, the same way lima means the whole arm and hand.",null,"Barefoot hopping on toy blocks at 3 a.m."],["n077","n",77,"kapuaʻi","kah-poo-AH-ee","sole of the foot; footprint","Carpool? AH! EE!",["Eleven cousins, one tiny car, one trip to the beach. It is a carpool. You got there last, so you get the worst seat, the back corner, squished against the window.","Everyone takes off their slippahs. Suddenly there are 22 bare feet in the car, and all of them are in your face. Sandy soles. Stinky soles. One sole with a sticker stuck to it. A foot rests on your head like a hat.","\"CARPOOL?\" you gasp. A heel lands on your cheek. \"AH!\" A big toe goes up your nose. \"EE!\"","When you finally get out at the beach, the car windows are covered in footprints. The ceiling too. The sole of every foot, printed everywhere. Carpool, ah, ee. Kapuaʻi."],"Hold up the bottom of your foot like a stop sign. \"Kah-poo-AH-ee.\"","Kapuaʻi means both the sole of the foot and the footprint it leaves behind.",null,"Car full of bare feet and footprints"],["n078","n",78,"puʻuwai","poo-oo-VAI","heart","Boo-hoo... WHY?",["It is Saturday and Aunty has invited you over for a Korean drama marathon. 14 episodes. She has 3 boxes of tissues, a bag of dried mango and a heart shaped pillow.","By episode 9 the two main characters finally meet in the rain. By episode 12 one of them forgets who the other one is. Aunty is squeezing the heart pillow so hard it pops. She is crying. You are crying. The cat is crying.","\"BOO-HOO...\" Aunty hiccups mid-sob, a little catch in the throat. \"...WHY?\"","You feel it right in your chest, thumping and aching and full. At 2 in the morning the last episode ends happy and you both scream with joy. That is the heart. Boo, hoo, why. Puʻuwai."],"Put your hand on your chest and sniff. \"Poo-oo-VAI.\"","Puʻu means a hill or lump, and wai means water. Hawaiians also speak of the naʻau, the gut, as a deep seat of feeling.",null,"Aunty sobbing into a heart pillow"],["n079","n",79,"iwi","EE-vee","bone","EE... VEE!",["You tried to skateboard down the steepest street in Mānoa. It did not go well. Now you are at the clinic with your arm in a sling and your helmet still on.","The doctor clips the x-ray to the glowing board. There it is. Your arm bone, long and white. And right in the middle, a crack. It is shaped exactly like the letter V. A perfect V.","You lean in and squint. \"EE...\" you say, because it hurts. \"...VEE!\" Because it really is a V.","The doctor puts on a bright green cast. 60 people sign it. In 6 weeks the bone knits back together, stronger than before. You keep the x-ray on your wall. EE, VEE. Bone."],"Draw a V in the air with one finger. \"EE-vee.\"","Iwi kūpuna means the bones of ancestors. They are sacred and cared for with deep respect in Hawaiian culture.",null,"X-ray of an arm bone with a V crack"],["n080","n",80,"koko","KO-ko","blood","Mmm... COCOA.",["It is dusk at a backyard party in Hilo. The mosquitoes come out. One of them is the size of a chicken. It lands on your arm with a thump.","It pokes its long straw nose into your arm, closes its eyes, and slurps. Loud. Like a kid at the bottom of a milkshake. Then it smacks its lips and sighs, \"Mmmm... COCOA.\"","To it, your blood is hot cocoa. It even drops in two tiny marshmallows it brought from home. It sips slowly, pinky out, like a fancy lady at a tea party.","When it is done, it pats you on the head, burps, and flies off wobbling, too full to fly straight. Cocoa. Koko. That is blood."],"Sip from an invisible mug. \"KO-ko.\" Both o's short.",null,null,"Chicken-size mosquito sipping blood like cocoa"],["n081","n",81,"ʻili","EE-lee","skin; land section","EELY!",["Before the beach, Aunty grabs you for sunscreen. She does not do a little. She does three whole bottles. Face, neck, ears, the back of your knees, between your toes. You shine like a glazed donut.","You step onto your towel and slide right off it. You slide down the sand, 30 feet, straight into the water. A fish bumps into your leg and shoots away like it hit ice.","Your cousin tries to grab your arm to pull you out. You squirt out of his hands like a wet bar of soap. He tries again. Squirt. \"EELY!\" he yells. \"Your skin is EELY!\"","Say it with a little catch in the throat first. ʻIli. Skin. The slippery stuff that holds you together."],"Rub your arm like it is slippery. \"EE-lee.\"","ʻIli also means a land section, a smaller piece of land inside an ahupuaʻa.",null,"Kid shooting out of hands like soap"],["n082","n",82,"naʻau","nah-OW","gut, mind, heart","Nah... OW.",["Uncle is at a used car lot. A salesman with very white teeth shows him a shiny red truck. \"Only $900,\" he says. Deep in Uncle's belly, something speaks up. \"Nah.\"","Uncle ignores it. He buys the truck. He drives it off the lot. After one block the engine falls out onto the road. Then the doors fall off. Then the steering wheel comes off in his hands. \"OW.\"","He walks home carrying the steering wheel. Grandma is on the porch. She does not even ask. She just pats his stomach twice. \"Next time,\" she says, \"listen to your naʻau.\"","That gut feeling, that deep knowing in the middle of you, that is the naʻau. It said nah. You went anyway. Ow. Put a little catch between them."],"Put your hand on your belly and listen. \"Nah,\" catch, \"OW.\"","In Hawaiian thinking the naʻau, the gut, is where deep feeling and knowing live, much like English uses heart.",null,"Uncle holding a steering wheel from his truck"],["n083","n",83,"lolo","LO-lo","brain","LOW... LOW...",["It is 2 p.m. in math class, right after lunch. You ate two plates of chicken katsu. Suddenly you hear a beep in your head. Your brain has a battery, and it just hit 3 percent.","\"LOW... LOW...\" says a robot voice inside your skull. Your eyes get heavy. Your head drops toward the desk.","The teacher asks you what 7 times 8 is. Your brain answers, \"Low... low...\" and then shows you a picture of a sandwich.","You try to plug your ear into the wall socket. It does not work. A classmate hands you a juice box and your brain goes up to 11 percent, just enough to spell your name.","That is the brain. Lolo, with two short, quick vowels. When it runs low, all you hear is low, low."],"Tap your head like a dead battery. \"LO-lo.\"","Do not mix up lolo (brain) with lōlō, with two long vowels, which means numb, paralyzed or crazy. The local slang \"No act lolo\" comes from lōlō.",null,"Student with a low battery brain"],["n084","n",84,"leo","LEH-oh","voice","LEH-oh.",["The traveling animal show has a lion named Leo. He weighs 500 pounds. His mane is like a giant golden bush. Kids hide behind their parents when he walks out.","The trainer says, \"Leo, ROAR!\" Leo opens his huge mouth, shows every tooth, and out comes a tiny squeaky voice. \"leh-oh.\" Like a mouse whispering its own name.","Then a real mouse walks out behind him, opens its tiny mouth, and ROARS. The bleachers shake. Popcorn flies. Somebody's hat blows off.","They switched voices. Leo is embarrassed. The mouse is thrilled. The show sells out for 3 years. That is a voice. Big or small, it is yours. Leo."],"Say it once deep, once tiny. \"LEH-oh.\"","Leo can also mean any sound or tone, not just a person's voice.",null,"Lion with a mouse voice"],["n085","n",85,"hulu","HOO-loo","feather; body hair; fur","WHO? LOU!",["Nine kids at a sleepover. One pillow fight. One pillow that cannot take it. It bursts, and 90,000 feathers explode into the room. It looks like a snow globe that somebody shook too hard.","The door opens. Mom stands there. \"WHO?\" she says. Every kid points at the same boy. \"LOU!\"","Lou is covered from head to toe in feathers. They are stuck to his hair, his eyebrows, his pajamas, even the hair on his arms. He looks like a chicken who lost a bet. He flaps his arms. Feathers fly.","Then the family dog runs in, shakes its fur, and adds its own hair to the pile. Feathers, fur, body hair. Who? Lou. Hulu."],"Brush invisible feathers off your arms. \"HOO-loo.\"","Hulu (feather) and hula (dance) differ by one vowel. A lei hulu is a feather lei.",null,"Boy covered in feathers after a pillow fight"],["n086","n",86,"lae","LAI","forehead; cape (land point)","LIE!",["Your little brother has a very big forehead. Big and shiny. And it has a problem. Every time he tells a lie, it lights up. Bright white, like a lighthouse.","\"Did you eat the last malasada?\" \"No.\" FLASH. His forehead beams a light that sweeps across the room. \"LIE!\" everyone yells. \"Did you feed the dog?\" \"Yes.\" FLASH. \"LIE!\"","At night, ships out at sea see the light coming from your house and think it is the lighthouse on the point. One fishing boat turns and heads for your yard.","So now your family uses him. He stands out on the cape at night and tells little lies to guide the boats in. Forehead. Point of land. Both lae. Lie."],"Tap your forehead. \"LAI.\"","Lae also means a cape or point of land. Many coastal place names start with Lae.",null,"Kid's forehead glowing like a lighthouse"],["n087","n",87,"kuʻemaka","koo-eh-MAH-kah","eyebrow","Coo! EH? MOCHA!",["Grandpa's eyebrows are so bushy that one of the pigeons from the rooftop uncle moved in. It built a nest in his left eyebrow. It lives there now. Grandpa does not mind.","He walks into the coffee shop. The pigeon says \"COO!\" The girl at the counter stares. Grandpa raises his left eyebrow at her, the pigeon riding up with it like an elevator. \"EH?\" he says, like what are you looking at.","Then he orders. \"MOCHA.\"","She makes it with a little heart on top. And a tiny cup for the pigeon. Coo, eh, mocha. And notice it ends with maka, eye. The eyebrow sits right over it."],"Raise one eyebrow slowly. \"Koo-eh-MAH-kah.\"","Kuʻemaka ends with maka, eye. The eyebrow is part of the eye family.",null,"Pigeon nesting in grandpa's eyebrow"],["n088","n",88,"lihilihi","lee-hee-LEE-hee","eyelashes; edge","Lee-hee! LEE-hee!",["At the county fair there is a camel. The camel has eyelashes 2 feet long. Thick, curly, beautiful. Every lady walking by is jealous.","You get close to pet it. The camel looks at you and blinks. The lashes sweep across your face like two feather dusters. It tickles so much you giggle. \"Lee-hee!\" It blinks again. \"LEE-hee!\"","The camel likes this. It blinks faster and faster. Flutter flutter flutter. You are laughing so hard you fall down in the hay. \"LEE-HEE! LEE-HEE!\" The breeze from its lashes blows three hats off.","Eyelashes. Right on the edge of the eye. Lihilihi."],"Flutter your eyelashes and giggle. \"Lee-hee-LEE-hee.\"","Lihi means edge or border. Lihilihi, the eyelashes, grow along the edge of the eyelid.",null,"Camel tickling someone with long eyelashes"],["n089","n",89,"ʻauwae","ow-VAI","chin","OW! WHY?",["It is mango season. You lie down on the grass under Tūtū's mango tree. You tilt your head back, chin up, and close your eyes.","PLOP. A ripe mango lands right on your chin. \"OW!\" Another one. PLOP. \"WHY?\" Then another. The tree is aiming. It hits the same spot every time. \"OW! WHY? OW! WHY?\"","By the end there are 11 mangoes around your head and your chin is sticky, yellow and shaped a little bit like a mango.","Start with a tiny catch in your throat, then ow, why. That is your chin. Different from wāwae, the leg, which starts with a long \"waaah.\""],"Tap your chin twice. \"Ow-VAI.\"","ʻAuwae (ow-VAI) is chin. Wāwae (vaah-VAI) is leg. They rhyme, so hear the start.",null,"Mangoes falling on a chin"],["n090","n",90,"ʻiʻo","EE-oh","flesh, muscle, meat","EEEE... OH!",["At the beach party the grill is loaded with 50 pounds of meat. Short ribs, chicken, hot dogs, a whole fish. It has to move out of the wind. Skinny Cousin Kimo says he got it.","He grabs both sides. He lifts. His face goes red. \"EEEEEEEEEE...\" His arms shake like a washing machine. Then a little catch in his throat. And then \"...OH!\"","At that exact moment, his arm muscle pops up out of nowhere, like a softball jumping out from under his skin. Everyone gasps. Nobody knew it was in there.","He carries the grill 20 feet, sets it down, and stares at his new muscle. The meat is fine. Muscle. Meat. Flesh. Eee, oh."],"Flex your arm and strain. \"EE,\" catch, \"oh!\"","Do not confuse ʻiʻo (flesh, meat) with ʻio, the Hawaiian hawk.",null,"Skinny cousin's muscle popping out"],["n091","n",91,"aʻa","AH-ah","vein; root","Ah... ʻAH!",["You are at the blood drive. The nurse needs a vein. She taps your arm. Nothing. She slaps your arm. Nothing. She calls another nurse. They both slap.","Then it rises. A vein pops up on your arm as thick as a garden hose. It keeps going. It branches out across your elbow and down your wrist, twisting and splitting like the roots of the giant banyan tree outside the window.","The nurse looks at the vein. She looks out the window at the banyan roots. She looks back at the vein. \"Ah...\" she says, then a catch in her throat. \"ʻAH!\" She found it.","Vein. Root. They even look the same. Aʻa."],"Trace the veins on your wrist. \"AH,\" catch, \"ah.\"","Aʻa (vein, root) is different from ʻaʻā, the rough, sharp, crumbly kind of lava.",null,"Vein on arm looking like banyan roots"],["n092","n",92,"alo","AH-lo","front, face","ʻALLO!",["There is a giant sunflower in Tūtū's yard, 9 feet tall, and it has decided you are the sun. Wherever you go, its big yellow face turns to face you.","You walk to the mailbox. The flower turns. \"ʻALLO!\" it squeaks, dropping the h because it has no lungs.","You walk around to the back of the house. It twists all the way around. \"ʻALLO!\" You hide behind the water tank. It leans over the tank, face first. \"ʻALLO!\"","It will not show you its back. Ever. Only its front. Only its face.","You give up and eat your lunch in front of it. It watches every bite. ʻAllo. Alo. Front and face."],"Wave to someone right in front of you. \"AH-lo.\"","A popular way to explain aloha is alo (face, presence) plus hā (breath). Face to face, sharing breath.",null,"Sunflower always facing you"],["n093","n",93,"kīkala","kee-KAH-lah","hip","Kick! HOLLER!",["It is a paniolo party upcountry. There is a barn, a band, and 200 people in cowboy boots doing a line dance. The caller has a microphone and a very loud voice.","\"KICK!\" Everyone kicks. \"HOLLER!\" Everyone hollers. \"HIP!\" Everyone swings their hip to the side and bumps the person next to them.","Then Aunty gets in the line. Aunty has been doing hip bumps at parties for 50 years. She swings her hip. Uncle next to her flies 12 feet into a stack of hay bales. The hay explodes. A horse looks in through the window.","\"KICK! HOLLER!\" Bump. Two more cousins go flying. Aunty keeps dancing. That is the hip. The most powerful thing in the barn."],"Bump your hip to one side. \"Kee-KAH-lah!\"",null,null,"Aunty's hip bump launching uncle into hay"],["n094","n",94,"pūhaka","poo-HAH-kah","waist","POOOO... HAH! KA!",["It is the big family photo on the beach. 60 people. Uncle is in the front row and he is sucking in his waist so hard his belt is loose.","The photographer's camera jams. \"Hold on, one more minute.\" Uncle holds his breath. One minute. Ten minutes. Thirty minutes. His face turns blue like a mahimahi. His waist is as thin as a coffee can.","At minute 45 the photographer says \"Okay, done!\" Uncle lets it all out. \"POOOOOOOO... HAH!\" His waist springs back out like a spring. His belt buckle shoots off with a \"KA!\" and knocks a coconut out of a tree.","In the photo, 59 people are smiling and Uncle is a blue blur. That is the waist. Pooo, hah, ka."],"Suck in your waist, then let it all go. \"Poo-HAH-kah!\"",null,null,"Uncle's belt buckle flying off at a photo"],["n095","n",95,"ʻūhā","oo-HAAH","thigh","OOOOO-HAAAAA!",["Your cousin has done leg day at the gym every day for a year. No arms. No chest. Only legs. Now his thighs are the size of two watermelons.","He cannot find jeans that fit. He wears two pairs of shorts, one per leg. When he walks, the thighs rub and make a sound like a squeaky balloon.","He is very proud. He slaps both thighs with both hands and yells \"OOOOOO-HAAAAA!\" The slap is so loud the car alarms go off down the street. Both sounds long, the long u and the long a.","Then he tries to walk down the stairs. The thighs are too big to bend. So he slides down the railing. Thigh."],"Slap both thighs and hold it long. \"Oooo-HAAAH!\"",null,null,"Cousin slapping giant watermelon thighs"],["n096","n",96,"ʻēheu","eh-HEH-oo","wing","Eh! HEY, YOU!",["Uncle has built wings. He made them from 400 paper plates, a roll of duct tape and two broom handles. Each wing is 10 feet long. He has been flapping them in the carport for a week.","Today he climbs onto the carport roof. The whole street comes out. A neighbor lady drops her hose and yells \"EH! HEY, YOU! Get down!\"","He does not get down. He jumps. He flaps. For one magic second, he flies. He goes up 2 feet. The chickens in the yard gasp. Then the wings fold like a taco and he drops straight into the kiddie pool. SPLOOSH.","He climbs out and shakes the water off his wings. \"Tomorrow I going use more plates.\" Wing. Eh, hey, you."],"Flap your arms like wings. \"Eh-HEH-oo!\"",null,null,"Uncle with paper plate wings in a kiddie pool"],["n097","n",97,"huelo","hoo-EH-lo","tail","WHO? 'ELLO?",["You are house sitting for the neighbor. It is dark. The power went out. You are feeling your way down the hallway.","Something soft and furry swishes across your cheek. You freeze. \"WHO?\" Silence. \"'ELLO?\" It swishes again, across your neck this time. \"WHO? 'ELLO?\"","You find the flashlight and turn it on. It is the neighbor's cat, sitting on the bookshelf. It has a tail 4 feet long, fluffy as a feather duster. It is swinging it back and forth across the hallway like a windshield wiper, dusting everything.","It looks at you like you are the weird one. Tail. Who, 'ello. Huelo."],"Swish your hand behind you like a tail. \"Hoo-EH-lo.\"","Huelo is also the name of a place on Maui.",null,"Cat's giant tail swishing in the dark"],["n098","n",98,"hale","HAH-leh","house, building","HAH! LAY!",["There is an empty lot at the end of your street. One morning a chicken the size of a tour bus walks in and sits down on it. The whole street comes out to watch.","The giant hen closes her eyes. She grunts. \"HAH!\" Everyone leans in. She strains. \"LAY!\"","She stands up and walks away. Behind her is a house. A whole house. Three bedrooms, two bathrooms, a lanai and a carport. Still a little warm. The mailbox already has the family name on it.","By dinner a family has moved in and they are grilling on the lanai. Hah, lay. Hale. House. Building."],"Squat like a hen, then stand up proud. \"HAH-leh!\"","Hale shows up in many words. Hale pule is a church, a house of prayer. Hale kula is a schoolhouse.",null,"Giant hen laying a whole house"],["n099","n",99,"lumi","LOO-mee","room","ROOMY!",["You found an apartment in Honolulu. The ad says \"ROOMY!\" in big letters. It costs $2,400 a month. You sign right away.","You open the door. It hits the bed. The bed hits the wall. The wall is the kitchen. The kitchen is also the closet.","The toilet is under the sink. To turn around, you have to go outside.","The landlord squeezes in behind you and spreads his arms. His elbows touch both walls. \"Roomy, eh!\" he says. He says it with a Hawaiian L. \"LOO-mee!\"","You sleep standing up, like a horse. Still, it is a room. Lumi."],"Spread your arms and touch both walls. \"LOO-mee.\"","Lumi comes from English room. Lumi moe is a bedroom and lumi ʻauʻau is a bathroom.",null,"Tiny apartment where the door hits the bed"],["n100","n",100,"ʻīpuka","ee-POO-kah","door, gateway","EEEEE! PUKA!",["Uncle is late for the lūʻau. The front door is locked and the key is lost. He does not wait. He backs up to the end of the driveway, puts his head down and runs straight at the living room wall.","CRASH. He goes right through. There is now a hole in the wall in the exact shape of Uncle, arms out, one slippah shape at the bottom.","Tūtū looks up from her chair and screams long and high. \"EEEEEEE!\" Then she points. \"PUKA!\" Puka means hole.","Nobody ever fixes it. The family uses the Uncle-shaped hole as the new front door. Guests have to hold their arms out to come in. That is a door, a gateway. Eee, puka."],"Walk through an invisible doorway with arms out. \"Ee-POO-kah.\"","Puka means a hole or opening, or to pass through. An ʻīpuka is the opening you pass through.",null,"Uncle-shaped hole used as a door"],["n101","n",101,"pukaaniani","poo-kah-ah-nee-AH-nee","window","Puka! Annie! Annie!",["Your neighbor has twin girls, and for some reason he named both of them Annie. Today the Annies are playing baseball in the living room with a coconut and a rolling pin.","CRACK. The coconut flies straight through the front window and punches a perfect round hole in the glass, 9 inches wide. The wind starts whistling through it. A myna bird flies in, looks around, and flies back out.","Dad storms in, sees the hole, and jabs his finger at the glass. \"PUKA! ANNIE! ANNIE!\" Both Annies point at each other.","He never fixes it. He glues a little wooden frame around the hole and calls it the new window. Now every time the trade winds blow, the whole house whistles \"Puka, Annie, Annie\" at the girls all night."],"Poke one finger through an invisible window. \"Poo-kah-ah-nee-AH-nee.\"","Puka means hole or opening and aniani means clear, like glass, so a window is literally a transparent opening. Aniani by itself means mirror or glass.",null,"Coconut hole in window, twin Annies"],["n102","n",102,"papahele","pah-pah-HEH-leh","floor","Papa, HEH-leh!",["Papa is 78 and he waxes the floor every Saturday like it is his religion. Nine hours on his hands and knees. When he is done, the floor is so shiny you can see up your own nose in it.","The grandkids have figured out the best part. Papa lies flat on his belly with wax rags tied to his elbows and knees. Three kids grab his ankles, run, and shove. \"PAPA, HEH-LEH!\" Papa, go!","He zooms down the hallway like a sled, spinning slowly, arms out, buffing 60 feet of floor as he goes. He shoots past the kitchen, out the back door, across the lanai, and stops with a splash in the koi pond.","He climbs out dripping and says the floor still has a spot. \"Again. Papa, HEH-leh.\""],"Pretend to shove a grandpa sled across the floor. \"Pah-pah-HEH-leh!\"","Papa is a flat surface or board, and hele means to go. The floor is the flat surface you go on.",null,"Grandpa sliding on waxed floor like a sled"],["n103","n",103,"kaupaku","kow-PAH-koo","roof","Cow! Pah! Coo!",["You wake up at 5 in the morning because the ceiling is creaking. Something very heavy is walking around on top of your house. Thump. Thump. Plaster sprinkles on your face.","You run outside in your slippahs and look up. There is a full grown cow standing on the very top of your roof, balanced on the ridge like a tightrope walker. Nobody knows how it got up there.","It chews a roof shingle, makes a face, and spits it out. \"PAH!\" The shingle lands in your cereal. Then it tucks its legs under itself and settles in with the 40 pigeons that live up there, and it starts to coo like them. \"Cooo. Cooo.\"","You call the neighbors over and point. \"COW! PAH! COO!\" Nobody believes you until the roof sags 2 feet in the middle."],"Point up at your ceiling. \"Kow-PAH-koo.\" Spit on the PAH, coo on the koo.","Kaupaku is really the peak or ridge of the roof, the very top line of the house.",null,"Cooing cow on the roof ridge"],["n104","n",104,"paia","pah-EE-ah","wall","Pah! Eee! Ah!",["Your cousin has watched too many ninja movies. He is convinced he can run straight up the living room wall, flip backwards, and land on the couch.","He backs up to the kitchen. He runs full speed in his socks. First foot hits the wall. \"PAH!\" Second foot, third foot, he is actually going up. \"EEEEEE!\" Four steps, five steps, his head is almost touching the ceiling fan.","Then the wall does what walls do. Nothing. It just stands there, flat and hard, and gravity remembers him. \"AHHHHH!\" He peels off and lands in the laundry basket.","There are now five sock prints going up the wall in a perfect line. Aunty was going to be mad, but instead she framed them. Now every guest asks about the wall, and your cousin tells the story like he won."],"Slap a wall with your palm. \"Pah, EE, ah.\" Get louder on the EE.",null,null,"Ninja cousin running up the wall"],["n105","n",105,"pākaukau","paah-kow-KOW","table","Paaah! KOW! KOW!",["Tūtū is 83 years old and a black belt in karate. At Thanksgiving somebody says she is getting soft. The whole house goes quiet.","She walks over to the dining table. It is solid koa, 11 feet long, built by her own grandfather, and it weighs more than a pickup truck. The turkey is on it. The rice is on it. Eleven plates are on it.","She raises her hand, takes a long breath, and lets out the longest yell you have ever heard. \"PAAAAAAAH!\" Then she chops. \"KOW!\" Again. \"KOW!\"","Every plate jumps 2 feet in the air, spins once, and lands back exactly where it was. Not one grain of rice spills. The table does not even crack. Tūtū bows to the table. The table, somehow, bows back."],"Karate chop the nearest table, gently. \"Paaah... kow-KOW!\" Hold that first paaah long.",null,null,"Karate Tūtū chopping the koa table"],["n106","n",106,"moena","mo-EH-nah","mat; bed","Mow? Eh, nah.",["Dad told you to mow the lawn a month ago. You did not. The grass is now 4 feet tall and a family of chickens has moved in.","Today you finally go out there, but not with a lawn mower. You drag out Aunty's giant lauhala mat, woven by hand, 40 feet long, and you unroll it right over the jungle. FLOOMP. The grass folds flat under it like a mattress. It is the softest bed in Hawaiʻi.","You lie down. The sun is warm. The chickens climb on too.","Dad comes home, sees the mat on the lawn, and yells from the car. \"Did you MOW?\" You do not even open your eyes. \"Mow? Eh... nah.\" Then you snore so loud the chickens leave."],"Flop down on an invisible mat. \"Mo-EH-nah.\" Yawn on the nah.","Moe means to sleep, so a moena is the thing you sleep on. The old style moena is woven from lauhala (pandanus leaves).",null,"Lauhala mat unrolled over tall grass"],["n107","n",107,"uluna","oo-LOO-nah","pillow","Ooh, LUNA!",["You buy a pillow at the swap meet from a man who will not tell you what is inside it. It is perfectly round, 4 feet across, and it glows a soft white, like the full moon.","That night you put your head on it. It puffs up. And up. It lifts off the bed with you still on it, floats out the open window, and drifts over the whole neighborhood at rooftop height.","Down below, people are in their yards having barbecues. They look up, see this big glowing circle crossing the sky, and gasp. \"OOOH, LUNA!\" One uncle starts howling at it.","You float over the H-1 until sunrise, drooling on your moon. At 6 a.m. it gently sets you back in bed, and a little bit of drool falls on a dog."],"Fluff your pillow and whisper at it. \"Oo-LOO-nah.\"","Moena (mat) and uluna (pillow) go together. That is your whole bed.",null,"Glowing moon pillow floating over rooftops"],["n108","n",108,"kapa","KAH-pah","blanket; tapa cloth","KA! PA! KA! PA!",["Aunty sits on the lanai with a strip of soaked bark about as wide as your hand. She puts it on a smooth log and starts beating it with a wooden beater.","KA. PA. KA. PA. That is the sound. It echoes up the whole valley. The roosters start nodding to the beat. The neighbor's dog stops barking and just listens.","She does not stop for three days. KA, PA, KA, PA. The bark gets thinner and wider and softer. By day two it covers the lanai. By day three it hangs off the roof and spills into the street.","That night it rains hard. Aunty throws the giant cloth over the whole house like a blanket and tucks the corners under the steps. Everyone inside sleeps warm, and all night the rain on the roof sounds like ka, pa, ka, pa."],"Pound your fist on your knee twice. \"KAH-pah. KAH-pah.\"","Kapa is beaten from wauke (paper mulberry) bark with a wooden beater called an iʻe kuku. Do not mix it up with kapu, which means forbidden or sacred.",null,"Aunty beating bark into a house blanket"],["n109","n",109,"ipu","EE-poo","gourd, bowl, container","Eee, POO!",["Your neighbor grew a gourd so big it broke the trellis. It is 5 feet tall, round on the bottom, shaped like a giant bottle, and it has been drying on his carport for a year.","Your little cousin, age 6, crawls inside it through the hole on top. It still has old dried seeds and pulp in the bottom, and it smells like a gym bag that went to a fish market. From deep inside you hear a hollow, echoing voice. \"EEEE... POOOO!\"","He climbs out green. The neighbor laughs, scrapes the whole thing clean, and now it is the most useful container on the street. It holds rice. It holds fishing gear. It holds the TV remote. On weekends it holds your cousin, who has decided he likes it in there after all."],"Hol
